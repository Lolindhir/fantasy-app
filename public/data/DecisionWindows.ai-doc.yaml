schemaVersion: 3

file:
  path: public/data/DecisionWindows.json
  kind: generated-json-read-model
  generator: public/requests/RequestLeague.ps1
  baseDerivation: public/requests/utils/league/DecisionWindowUtils.psm1
  relevanceDerivation: public/requests/utils/league/FantasyRelevanceV2Utils.psm1
  scoringAvailabilityDerivation: public/requests/utils/league/PlayerScoringAvailabilityUtils.psm1
  repairabilityDerivation:
    - public/requests/utils/league/LineupRepairabilityDecisionUtils.psm1
    - public/requests/utils/league/LineupRepairabilityUtils.psm1
    - public/requests/utils/league/LineupRepairabilityEvidenceUtils.psm1
  participantScoringPathDerivation: public/requests/utils/league/ParticipantScoringPathDecisionUtils.psm1
  temporaryAcquisitionBridge: public/requests/utils/league/AcquisitionCapabilityUtils.psm1
  architectureDecision: .ai-context/manual/decisions.yaml#ADR-036

contract:
  purpose: >
    Current App read model for exact NFL kickoff Decision Windows, fantasy-team/player
    lock associations, objective lineup integrity, current Fantasy Relevance lineup
    state, provider-neutral per-slot repairability and provider-neutral participant
    remaining-scoring-path state. It is disposable generated output, not historical
    source of truth.
  topLevel:
    - SchemaVersion
    - LeagueID
    - Season
    - LineupWeek
    - LastLineupWeek
    - DecisionWindows
    - LookaheadDecisionWindow
    - PlayerLockFacts
    - TeamLineupEvaluations
    - ScoringAvailabilityObservations
    - FantasyRelevance
  decisionWindow:
    fields:
      - DecisionWindowID
      - Week
      - StartsAtUtc
      - Games
      - ParticipatingNFLTeamIDs
      - FantasyContextState
      - AffectedFantasyTeams
    semantics:
      - DecisionWindowID is the normalized absolute kickoff instant.
      - Only games with exactly equal StartsAtUtc share one Decision Window.
      - Nearby unequal kickoffs remain separate windows.
      - A rescheduled stable GameID moves to the window for its new kickoff.
      - Decision Window is not a Viewing Slot.
  game:
    fields:
      - GameID
      - Week
      - AwayTeamID
      - AwayTeamAbbr
      - HomeTeamID
      - HomeTeamAbbr
  affectedFantasyTeam:
    compatibility: >
      The original #343/#346 affected-team fields remain available for existing
      consumers. AffectedRosteredPlayerCount is broad schedule coverage and must
      not be used as the v2 relevance or must-watch ranking signal.
    fields:
      - FantasyTeamID
      - AffectedRosteredPlayerCount
      - AffectedStarterCount
      - Players
    playerFields:
      - PlayerID
      - NFLTeamID
      - GameID
      - IsStarter
  playerLockFact:
    kinds:
      scheduled: Player has one resolvable active-week NFL game and includes GameID, DecisionWindowID and StartsAtUtc.
      bye: Player has a known NFL team but that team has no active-week game.
      no-team: Player has no usable current NFL-team association.
      unknown: Required identity or join evidence is missing, conflicting or ambiguous.
    rule: >
      PlayerLockFacts remain provider-neutral kickoff association evidence. The
      current game-time state is materialized separately in FantasyRelevance.
  fantasyRelevance:
    version: 4
    purpose: >
      Generator-owned current lineup state for downstream remaining-scoring-path,
      must-watch, lineup-repairability and participant-terminal derivation. Angular
      must not reconstruct slot eligibility, Active Roster membership, lock/completion
      semantics, acquisition/repair heuristics or participant terminality.
    slotDefinitions:
      fields:
        - SlotID
        - SlotType
        - SlotOrdinal
        - SlotIndex
      rules:
        - Starting slots are the ordered league roster_positions entries excluding BN.
        - Repeated slot types receive stable per-lineup instance IDs such as QB-1, QB-2 and FLEX-1.
        - Current Starter ordering is preserved long enough to map each entry to the corresponding ordered starting slot.
    slotState:
      fields:
        - SlotID
        - SlotType
        - SlotOrdinal
        - SlotIndex
        - CurrentStarterID
        - State
        - GameID
        - DecisionWindowID
        - StartsAtUtc
        - ScoringAvailability
        - Repairability
      scoringAvailability: >
        Current ESPN Fantasy injuryStatus observations are joined by the existing ESPN
        player ID and normalized to available, uncertain, out or unknown. ProviderStatus,
        Source and FirstObservedAtUtc remain visible evidence. FirstObservedAtUtc marks the
        first local poll that saw the current provider status and resets on provider-status
        transitions; legacy ObservedAtUtc is retained as a compatibility alias to the same
        stable timestamp. No volatile last-poll timestamp is persisted in DecisionWindows,
        so unchanged provider checks remain semantic no-ops. Missing/provider-error evidence
        stays unknown and never removes a scoring path.
      repairabilityPresence: >
        Repairability is null for slots without an initial supported objective problem.
        It is populated for an open required starter slot, a starter-on-bye slot or an
        explicit OUT starter. An OUT starter after lock is irreparable; before lock the
        ordinary full-lineup repair solver decides whether a legal replacement path exists.
    rosterPlacement:
      values:
        - starter
        - bench
        - ir
        - taxi
      rules:
        - Roster remains the complete owned roster.
        - Active Roster means Starter plus Bench.
        - Bench is derived as Roster minus Starter minus IR/Reserve minus Taxi.
        - IR and Taxi are outside Active Roster and are not normal lineup alternatives.
        - A starter that is simultaneously IR or Taxi is contradictory evidence and fails closed.
    gameState:
      values:
        unlocked: The player's NFL kickoff is still in the future; current lineup placement is mutable.
        locked-active: The player's NFL kickoff has occurred and the NFL game is not Final; placement is committed and the player may still add points.
        completed: The player's NFL game is Final; no ordinary additional live fantasy points can be added by that player.
        unknown: Required scheduled-game evidence is unavailable or ambiguous.
      rules:
        - Final is taken from the effective Schedule gameStatus after RequestGames canonical finality resolution.
        - Canonical Final truth is source-data/nfl/game-finality/<season>.json, derived from validated nflverse released-games evidence; score or fantasy-point presence is never Final evidence.
        - RequestGames joins the transitional Tank01 Schedule shape to canonical game identity through the explicit ESPN provider ID before Schedule.json is published.
        - Kickoff comparison is evaluated during generation against current UTC time.
        - No EvaluatedAt timestamp is persisted; semantic output changes only when source facts or a relevant state boundary change.
        - Later stat corrections are outside live remaining-scoring-path semantics.
    repairability:
      fields:
        - ProblemCode
        - State
        - Path
        - ReasonCode
        - InternalCandidateCount
        - ExternalCandidateCount
      problemCodes:
        - OPEN_STARTER_SLOT
        - STARTER_ON_BYE
        - STARTER_UNAVAILABLE
      states:
        repairable: Known evidence proves the complete remaining mutable lineup can still be legally filled.
        irreparable: Known evidence proves no accepted legal internal or external repair path remains.
        unknown: Missing or contradictory evidence could change whether a legal repair path exists.
      paths:
        internal-roster: The complete mutable lineup can be solved using eligible unlocked Active Roster players only.
        external-acquisition: The complete mutable lineup requires at least one currently unrostered eligible player that the accepted acquisition capability can deliver before that player's lock.
        null: No known successful repair path, including irreparable and unknown states.
      reasonCodes:
        INTERNAL_ASSIGNMENT_AVAILABLE: Active Roster matching can fill every mutable required slot.
        EXTERNAL_ACQUISITION_ASSIGNMENT_AVAILABLE: Internal plus accepted external candidates can fill every mutable required slot.
        LINEUP_EVIDENCE_UNKNOWN: Current lineup/lock/position evidence is not sufficient for a deterministic result.
        ACQUISITION_EVIDENCE_UNKNOWN: Current acquisition capability is missing or contradictory.
        EXTERNAL_PLAYER_EVIDENCE_UNKNOWN: A potentially relevant unrostered player's ownership/position/team/game/lock evidence is insufficient.
        NO_LEGAL_REPAIR_PATH: Complete known evidence proves no accepted repair path remains.
      assignmentRules:
        - Repairability is solved against the complete set of mutable required slots, never as independent one-player/one-slot checks.
        - One player may fill at most one slot in the matching solution.
        - Unlocked starters may move among other eligible mutable slots, enabling FLEX/SUPER_FLEX reshuffles.
        - Locked-active and completed starters stay fixed and cannot be future repair candidates.
        - IR/Reserve and Taxi are excluded from normal internal repair candidates.
        - Review/data-quality lineup states remain unknown rather than becoming manager-fault irreparable states.
      externalCandidateRules:
        - Fantasy availability means the player is absent from every current fantasy roster; NFL free-agent status is not used.
        - Candidate position must be eligible for at least one mutable slot.
        - Candidate current-week NFL team/game/kickoff evidence must be resolvable.
        - The current temporary #493 bridge supplies acquisition capability; consumer output remains provider-neutral.
        - Under the accepted current bridge, an external candidate is actionable only when NextWaiverRun is strictly earlier than that candidate's StartsAtUtc.
        - Trade is excluded because another manager is required and therefore is not a deterministic repair path.
      replacementBoundary: >
        Issue #492 must replace/remove the temporary #493 acquisition bridge later
        without changing the repairability State/Path/Reason consumer semantics.
    participantRemainingScoringPath:
      field: RemainingScoringPathState
      values:
        open: Known direct/alternative scoring-path evidence or a known repairable lineup path remains for this fantasy-team side.
        none: Complete known evidence proves that this fantasy-team side has no remaining relevant scoring path.
        unknown: Missing, review or unknown lineup/lifecycle/repairability evidence prevents a terminal claim.
      rules:
        - Participant state is derived only after repairability enrichment so a known repair path keeps the side open.
        - HasRemainingScoringPath=false alone never proves none because unknown player or slot evidence can also yield no currently enumerated path.
        - A known remaining direct, alternative or repairable path makes the participant state open even when other evidence is incomplete.
        - none is the only participant state that Angular may present as the compact participant Final marker.
        - Participant none never implies Matchups.json CompletionState=final; whole-matchup finality remains owned by canonical Matchups finality.
        - Scores, rendered progress colors, NFL clock/time, weekday, provider rollover, opponent state and matchup CompletionState are not participant-terminal inputs.
    team:
      fields:
        - FantasyTeamID
        - ActiveRosterPlayerCount
        - StarterCount
        - BenchCount
        - IRCount
        - TaxiCount
        - UnlockedStarterCount
        - LockedActiveStarterCount
        - CompletedStarterCount
        - EligibleBenchCandidateCount
        - HasRemainingScoringPath
        - RemainingScoringPathState
        - Slots
        - Players
    player:
      fields:
        - PlayerID
        - Placement
        - Position
        - GameState
        - GameID
        - DecisionWindowID
        - StartsAtUtc
        - LineupSlotID
        - LineupSlotType
        - EligibleUnlockedSlotIDs
        - IsBenchCandidate
        - HasDirectScoringPath
        - HasAlternativePath
      candidateRule: >
        A Bench player is a lineup candidate only when the player is still unlocked
        and their generated fantasy Position is eligible for at least one still-
        unlocked starting slot. Broad Roster membership is not candidate evidence.
      slotEligibility:
        exactPosition: QB/RB/WR/TE/K and other exact slot names match the same player Position.
        FLEX: RB, WR or TE.
        SUPER_FLEX: QB, RB, WR or TE.
        WRRB_FLEX: WR or RB.
        REC_FLEX: WR or TE.
    autoSubs: >
      Concrete Sleeper AutoSub assignments are intentionally excluded. Current
      persisted/public Sleeper matchup and roster evidence exposes league-level
      AutoSub settings but no reliable starter-to-sub assignment, so no assignment
      is inferred.
  lineupEvaluation:
    states:
      - ready
      - review
      - action-required
      - pending
      - unknown
    issueCodes:
      - OPEN_STARTER_SLOT
      - STARTER_ON_BYE
      - STARTER_WITHOUT_NFL_TEAM
      - STARTER_LOCK_UNKNOWN
      - UNRESOLVED_ROSTER_PLAYER
      - MALFORMED_ROSTER_STRUCTURE
      - MALFORMED_STARTER_STRUCTURE
      - MALFORMED_ROSTER_PLAYER
      - MALFORMED_STARTER_PLAYER
      - DUPLICATE_ROSTER_PLAYER
      - DUPLICATE_STARTER
      - STARTER_NOT_IN_ROSTER
      - STARTER_COUNT_OVERFLOW
    rules:
      - ExpectedStarterCount is derived from league roster configuration and is not hard-coded.
      - Affected players alone are context and do not create warnings.
      - Integrity ambiguity fails to unknown instead of silently producing ready.
      - Starter on bye is action-required; starter without a usable NFL team is review.
  lookahead:
    rule: >
      Include only the first Decision Window of the next fantasy lineup week and
      only while another lineup-relevant week exists.
    fantasyContextState: pending
    staleStarterRule: Current-week starters are never evaluated against lookahead.

ownership:
  lineupWeek: >
    Current runtime adapter uses fantasy-platform lineup-week evidence
    (Sleeper settings.leg), not generated League.CurrentWeek/finality.
  currentJoin: >
    Transitional adapter still joins Player.TeamID to Schedule.teamIDHome/teamIDAway
    using inputs already present in the League refresh. Schedule shape remains
    transitional, but #447 moved its Final truth to canonical nflverse game-finality
    before publication. #347 may replace the remaining Schedule/provider adapter.
  relevanceBoundary: >
    FantasyRelevance consumes current League/Teams/Players plus the generated
    finality-resolved Schedule in the generation layer. It does not make Angular a
    source of truth. Repairability and participant remaining-scoring-path state extend
    this same generator-owned boundary; #493 is used only as a temporary normalized
    acquisition input for repairability.
  historical: >
    Historical Decision Window relevance is rebuilt from persisted season/week
    schedule, fantasy players/starters and week-appropriate player-to-NFL-team
    assignments through the same provider-neutral base derivation semantics. The
    current FantasyRelevance repairability enrichment is not required for historical output.

freshness:
  writer: public/requests/utils/general/FileUtils.psm1::Save-JsonFile
  timestampKey: DecisionWindows
  timestampFile: public/data/Timestamps.json
  meaning: >
    Timestamps.json.DecisionWindows is the last semantic generated-data update.
    It does not mean last checked or last fetched.
  noOpRule: >
    Repeated derivation with no semantic DecisionWindows change skips the file
    rewrite and preserves the existing DecisionWindows timestamp.
  finalityDependency: >
    completed state cannot become fresher than the canonical nflverse game-finality
    refresh plus the subsequent Schedule and League materializations. #447 identified
    the current game-day cadence as an operational follow-up; no time heuristic is
    used to compensate for stale source evidence.

failureBehavior:
  - Invalid required derivation input must not overwrite the prior valid generated file.
  - Duplicate/conflicting provider-neutral evidence must never use first/last-wins behavior.
  - Canonical finality/provider-ID contradictions fail closed in RequestGames before Schedule publication.
  - Safe per-player ambiguity becomes unknown; unrecoverable derivation failures fail closed.
  - Repairability ambiguity that could change the outcome remains unknown rather than being guessed into repairable or irreparable.
  - Participant terminal ambiguity remains RemainingScoringPathState=unknown rather than being guessed into none.

nonGoals:
  - broad Overview or dialog visual redesign
  - historical DecisionWindows repairability store
  - subjective start/sit optimization
  - AutoSub assignment inference
  - projections, expected points or win probability
  - trade as a deterministic repair path
  - viewing-slot grouping
