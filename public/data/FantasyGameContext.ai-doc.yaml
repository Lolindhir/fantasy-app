schemaVersion: 5

file:
  path: public/data/FantasyGameContext.json
  kind: generated-json-read-model
  generator: public/requests/RequestLeague.ps1
  baseDerivation: public/requests/utils/league/FantasyGameContextCore.ps1
  relevanceDerivation: public/requests/utils/league/FantasyRelevanceV2Utils.psm1
  matchupPreviewDerivation: public/requests/utils/league/FantasyMatchupPreviewUtils.psm1
  weeklyWatchDerivation: public/requests/utils/league/FantasyWeeklyWatchUtils.psm1
  scoreProjectionDerivation: public/requests/utils/league/FantasyGameContextUtils.psm1::Add-FantasyGameScoreContext
  predecessorIssue: 346
  v2Issue: 432
  v2RefinementIssue: 437
  matchupPreviewFixIssue: 441
  matchupDecisionScoringRefinementIssue: 443
  finalityFixIssue: 447
  scorePresentationIssue: 453
  weeklyWatchRefinementIssue: 467
  liveAndNextScoringWindowsIssue: 520

contract:
  purpose: >
    Provider-neutral fantasy/NFL game context read model. The original #346 game
    relevance and league-scored impact facts remain available for compatibility;
    Fantasy Relevance v2 adds remaining-scoring-path and decision/scoring facts
    derived from generated lineup slots, Active Roster state and NFL game state.
    Schema v3 additionally projects an optional completed NFL away/home score pair
    from the already finality-resolved generated Schedule for sports-game identity
    display. Schema v4 separates the week-level Must-watch ranking from remaining
    relevance. Schema v5 separates the currently active direct-Starter scoring
    window from the next future direct-Starter scoring window so both temporal
    horizons can be presented simultaneously without using lineup-decision facts.
  topLevel:
    - SchemaVersion
    - LeagueID
    - Season
    - Week
    - ScoringState
    - DecisionWindows
    - Games
    - FantasyMatchups
    - NonGameAssociations
    - MustWatchGames
  compatibility:
    baseRelevance: >
      Existing Relevance.RosteredPlayerCount and related broad schedule-coverage
      fields remain for current consumers but are not the weekly Must-watch ranking
      signal.
    impact: >
      Impact remains based only on league-scored matchup player points. No generic
      provider fantasy-point source is substituted. A canonical Final transition
      changes Impact.State from partial to final without removing already materialized
      league-scored points.
    finality: >
      Game Status/completion consumes the finality-resolved Schedule generated by
      RequestGames. Schedule retains its Tank01-compatible shape, but Final truth is
      resolved from source-data/nfl/game-finality/<season>.json before publication.
    scoreFields: >
      Schema-v3+ AwayScore/HomeScore are additive nullable game fields. Older
      consumers may ignore them and older generated schema-v2 files remain readable.
    weeklyWatch: >
      Schema-v4 MustWatchGames is a stable week-level Starter-impact ranking. Older
      schema-v2/v3 generated files retain their previous remaining-relevance
      compatibility behavior in Angular until regenerated.
    scoringWindows: >
      Schema-v5 ActiveScoring* fields are additive. Existing NextScoring* fields now
      mean the next future direct-Starter scoring window only. Angular keeps an
      explicit schema-v4 compatibility path where the legacy NextScoringWindow may
      itself be live, but schema-v4 data cannot prove FINAL SCORING WINDOW.

remainingScoringPaths:
  source: DecisionWindows.json.FantasyRelevance
  pathTypes:
    locked-starter: >
      Current Starter whose NFL game has kicked but is not Final. This is a
      committed remaining scoring path.
    unlocked-starter: >
      Current Starter whose NFL kickoff is still future. This is provisional
      because the current lineup can still change.
    bench-candidate: >
      Current Bench player whose own NFL game is still unlocked and who is eligible
      for at least one still-unlocked starting slot. This is a possible alternative
      path, not a claim that the player will be started.
  excluded:
    - completed starters
    - locked or completed Bench players
    - IR players
    - Taxi players
    - AutoSub assignment inference
    - players without a usable scheduled-game association

fantasyMatchup:
  v2Field: RemainingRelevance
  fields:
    - State
    - HasRemainingScoringPaths
    - LeftRemainingPathCount
    - RightRemainingPathCount
    - LockedActiveStarterCount
    - UnlockedStarterCount
    - EligibleBenchCandidateCount
    - NextLineupDecisionWindowID
    - NextLineupDecisionGameIDs
    - NextLineupDecisionPrimaryGameID
    - NextLineupDecisionWindowGameCount
    - NextLineupDecisionStarterCount
    - NextLineupDecisionOptionCount
    - ActiveScoringWindowID
    - ActiveScoringGameIDs
    - NextScoringWindowID
    - NextScoringGameIDs
    - NextScoringPrimaryGameID
    - NextScoringWindowGameCount
    - NextScoringLockedActiveStarterCount
    - NextScoringUnlockedStarterCount
    - NextScoringOptionCount
    - FinalScoringWindowID
    - FinalScoringGameIDs
    - IsFinalScoringWindowCommitted
  states:
    both-sides: Both fantasy teams still have at least one generated scoring path.
    left-only: Only the first TeamID side still has a generated scoring path.
    right-only: Only the second TeamID side still has a generated scoring path.
    none: Neither side has a generated remaining scoring path.
  nextLineupDecisionRule: >
    The next lineup decision is the earliest still-unlocked kickoff window that
    contains either a current unlocked Starter or an eligible Bench candidate for
    this fantasy matchup. Locked-active starters are excluded because their lineup
    decision has already passed. Within that window, the primary NFL game is chosen
    deterministically by direct-starter count, then option count, then stable GameID.
  activeScoringRule: >
    ActiveScoringWindowID is the current direct-Starter window containing generated
    locked-starter paths. ActiveScoringGameIDs contains only NFL games in that window
    with direct locked-starter membership, in generator-owned deterministic order.
    No clock, status or lineup reconstruction is performed in Angular.
  nextScoringRule: >
    In schema v5, NextScoring* means only the earliest future window containing at
    least one generated unlocked-starter path. A currently active locked-starter
    window does not consume Next. An option-only Bench-candidate window is never a
    scoring window. Within the selected future window, NextScoringPrimaryGameID
    chooses the NFL game with the strongest direct-starter evidence for this fantasy
    matchup. NextScoringLockedActiveStarterCount is retained for compatibility and is
    zero for schema-v5 generation; NextScoringUnlockedStarterCount and
    NextScoringOptionCount remain matchup/game-specific counts.
  presentationRelationship: >
    Decision and scoring facts remain separate generated concepts. The league-level
    Decision Window is the primary overview surface for upcoming lineup flexibility.
    A fantasy matchup overview card may present Final/completed, Live now, Next and
    Later starter states simultaneously. An earlier option-only lineup decision must
    not replace either active or future direct-Starter scoring in the matchup card.
  finalWindowRule: >
    FinalScoringWindowID remains the latest remaining-path window and may therefore
    include a later Bench-option-only path. It is committed only when every remaining
    path in that window is a locked starter. For the #520 presentation, an active
    direct-Starter window is the final direct-Starter scoring window when schema-v5
    ActiveScoring* exists and no future NextScoring* direct-Starter window exists;
    the UI must not reinterpret FinalScoringWindowID for that purpose.
  decidedBoundary: >
    State=none is a deterministic no-scoring-paths-remaining statement. It is not
    a probabilistic win claim and does not use projections.

game:
  v2Field: RemainingRelevance
  fields:
    - AwayScore
    - HomeScore
    - HasRemainingRelevance
    - LockedActiveStarterCount
    - UnlockedStarterCount
    - EligibleBenchCandidateCount
    - DirectStarterFantasyTeamCount
    - DirectStarterFantasyTeamIDs
    - FantasyMatchupCount
    - TwoSidedFantasyMatchupCount
    - FinalWindowFantasyMatchupCount
    - CommittedFinalWindowMatchupCount
    - MustWatchRank
  directStarterFantasyTeams: >
    RemainingRelevance.DirectStarterFantasyTeamIDs is the unique set of fantasy teams
    with at least one remaining direct starter path in this NFL game (unlocked or
    locked-active). Bench-option-only teams are intentionally excluded. These fields
    answer who is still directly tied to the game now and may become empty after
    Final. They are not the schema-v4 stable weekly Must-watch exposure source.
  meaning: >
    RemainingRelevance fields answer why an NFL game still matters to the fantasy
    league now. Completed-only exposure and broad owned-roster mass do not create
    remaining relevance. AwayScore/HomeScore are separate sports-game identity facts
    and never contribute to relevance, impact or Finality derivation.

nflGameScore:
  fields:
    away: Games[].AwayScore
    home: Games[].HomeScore
  generatedSource: >
    RequestGames publishes optional awayPts/homePts on the generated Schedule for
    games already resolved as canonical Final. RequestLeague then projects that
    complete pair into FantasyGameContext as AwayScore/HomeScore.
  currentRuntimeEvidence: >
    The transitional Tank01 schedule/score surface supplies the numeric score pair.
    Previously materialized complete pairs may be retained as generated cache when
    a later schedule response omits them; missing pairs are enriched through the
    lightweight score endpoint for canonical-Final games only.
  finalityBoundary: >
    Score evidence is display data and cannot promote a game to Final. Canonical
    nflverse game-finality remains the sole current Final truth. A non-Final game
    receives null AwayScore/HomeScore even if provider score/status evidence claims
    completion.
  liveScoreBoundary: >
    The current score source is not fresh enough for a prominent real-time NFL score.
    UI must not render AwayScore/HomeScore as a live score; the pair is shown only
    after canonical Final, where it is reliable game-identity information.
  missingRule: >
    Both values must be present and numeric before the pair is projected. Zero is a
    valid score. A partial/malformed pair remains null/null and must not render as 0-0.
  conflictRule: >
    Conflicting complete score evidence for the same GameID fails closed in the
    score merge helper instead of selecting a value silently.

mustWatchGames:
  purpose: >
    Deterministic generated week-level ordering of NFL games with actual current
    Starter exposure. Angular may select the top N but must not rebuild the ranking
    logic. Upcoming, Live and Final state alone do not add, remove or reorder a game;
    a pre-kickoff lineup change may legitimately change membership/rank because the
    actual Starter exposure changed.
  fields:
    - Rank
    - GameID
    - DecisionWindowID
    - StartsAtUtc
    - CommittedFinalWindowMatchupCount
    - LockedActiveStarterCount
    - DirectStarterFantasyTeamCount
    - DirectStarterFantasyTeamIDs
    - UnlockedStarterCount
    - TwoSidedFantasyMatchupCount
    - FantasyMatchupCount
    - FinalWindowFantasyMatchupCount
    - EligibleBenchCandidateCount
  stableExposureSource: >
    Ranking and stable weekly DirectStarterFantasyTeamIDs are derived from
    Games[].FantasyTeams entries with StarterCount > 0. This preserves starter-team
    identities after a game becomes Final and RemainingRelevance reaches none.
  rankingOrder:
    - stable DirectStarterFantasyTeamCount descending
    - Games[].Relevance.StarterCount descending
    - stable FantasyMatchupCount descending
    - StartsAtUtc ascending
    - GameID ascending
  compatibilityFields: >
    Remaining-relevance counters are retained on MustWatchGames rows because they are
    useful to other/detail consumers and preserve additive compatibility, but they do
    not participate in schema-v4 weekly ranking.
  rationale: >
    Must-watch answers which NFL games shape the fantasy week, not which game is most
    urgent at this instant. Breadth across fantasy teams with actual Starters is the
    leading signal, followed by total Starter volume and fantasy-matchup breadth.
    Live/locked status and Bench-option volume must not promote a game above stronger
    week-level Starter exposure.

uiPresentation:
  scoreHierarchy: >
    Fantasy matchup scores and per-game fantasy starter-point contributions are
    primary sports information and should use strong weight/tabular numerals.
    NFL away/home score belongs to the NFL game identity and must remain visually
    distinct from fantasy starter points or matchup scores.
  affectedTeamStrip: >
    On the week-level Must-watch surface, affected-fantasy-team avatars represent
    actual Games[].FantasyTeams with StarterCount > 0 so the strip remains stable
    after Final. On remaining-relevance/detail surfaces,
    RemainingRelevance.DirectStarterFantasyTeamIDs may represent only teams still
    directly tied to an unfinished game. Bench-option-only teams stay secondary.
  matchupCardFocus: >
    Fantasy matchup Overview cards are football/scoring-first. With schema-v5 data,
    show the active direct-Starter window as LIVE NOW and independently show the next
    future direct-Starter window as NEXT when both exist. When Active exists and Next
    does not, FINAL SCORING WINDOW may be shown. If no Active exists, retain the
    compact NEXT SCORING WINDOW presentation. Matchups.json authoritative finality
    suppresses future-window presentation. Pure option-only lineup-decision windows
    never become scoring rows.
  decisionWindowPriority: >
    Commissioner/team ordering first respects semantic attention state. Within the
    same attention state, priority is affected Active Roster player count in that
    kickoff window (Starter + Bench, explicitly excluding Taxi and IR), then affected
    Starter count, then deterministic fallback order.
  stateGrammar: >
    Position remains visually encoded by the existing position-color language.
    Lineup state (Starter, Locked, Final, Option) is a separate compact semantic
    treatment so state color does not replace or compete with position identity.
    A different lineup slot such as FLEX is contextual metadata and should be
    visually quieter than the natural-position and lineup-state chips.
  matchupTimelineDensity: >
    In the two-column matchup timeline, player name remains the primary line and
    position/slot/state metadata stays on one compact row underneath. Position and
    state may use pills; a secondary lineup slot should not look like a third equal-
    weight pill. Chip text must remain vertically centered. Per-NFL-game starter
    points should align to the same left/right fantasy sides rather than appearing
    as an undifferentiated footer. Raw LeftRemainingPathCount /
    RightRemainingPathCount and the global matchup-level current-starter/option
    aggregate are generated facts but are not primary user-facing hero copy; the
    plain-language State and concrete timeline are.
  interactionBoundary: >
    Entity-level interactions may open existing Player, Fantasy Team and NFL Game
    detail views. Interaction wiring is presentation behavior; eligibility and
    ranking remain generated facts.

ownership:
  domainLogic: >
    Slot mapping, Active Roster/Bench derivation, eligibility, lock/completion
    state, remaining paths, lineup-decision/scoring preview selection/counts,
    active-versus-next direct-Starter scoring membership, stable week-level Starter
    exposure and Must-watch ranking are generation-layer facts. Complete NFL
    score-pair projection is also generation-layer behavior.
  angularBoundary: >
    Angular may render, filter and select from these fields and may choose the
    documented presentation lens (Decision Window versus matchup scoring) without
    changing generated domain facts. It must not sort Schedule games into scoring
    relevance, reconstruct Starter membership/eligibility/repairability/scoring
    paths/finality or use clock/weekday heuristics. Older schema-v2/v3/v4 JSON remains
    renderable with explicit compatibility behavior until the next materialization.
  providerBoundary: >
    Sleeper still owns league/matchup point evidence and Tank01 still supplies the
    transitional Schedule/boxscore shape and current numeric score evidence, but
    #447 moves Final truth for the current Schedule into the accepted canonical
    nflverse game-finality contract through a strict ESPN-ID mapping. #347 owns the
    remaining broader provider/source-data consumer migration.

historical:
  schemaSemantics: >
    Historical FantasyGameContext uses the same read-model types but does not project
    today's live FantasyRelevance/roster state backward. Historical generation paths
    that lack current FantasyRelevance keep their historical schema/output semantics;
    schema-v5 ActiveScoring* is only materialized when the generating evidence contains
    the corresponding generated current relevance facts.

failureBehavior:
  - Missing or ambiguous player/game joins remain explicit through the existing NonGameAssociations/fail-safe behavior.
  - Canonical finality/provider-ID contradictions fail closed before Schedule publication; FantasyGameContext never resolves them locally.
  - NFL score values are projected only as a complete numeric pair for an already-Final game; partial score evidence remains null/null.
  - Duplicate Schedule GameID identities fail closed in FantasyGameContext score projection.
  - The v2/v5 enrichment does not infer AutoSubs, projections or unknown position eligibility.
  - Existing historical FantasyGameContext generation remains compatible when current FantasyRelevance evidence is absent.

nonGoals:
  - probabilistic matchup win chance
  - expected fantasy points or projections
  - Sleeper AutoSub assignment reconstruction
  - live NFL score presentation from the current roughly ten-minute source cadence
  - historical 2025 mapping repair tracked separately by #420
  - app-wide design-system rollout tracked separately by #436
