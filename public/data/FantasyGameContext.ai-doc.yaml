schemaVersion: 2

file:
  path: public/data/FantasyGameContext.json
  kind: generated-json-read-model
  generator: public/requests/RequestLeague.ps1
  baseDerivation: public/requests/utils/league/FantasyGameContextCore.ps1
  relevanceDerivation: public/requests/utils/league/FantasyRelevanceV2Utils.psm1
  matchupPreviewDerivation: public/requests/utils/league/FantasyMatchupPreviewUtils.psm1
  predecessorIssue: 346
  v2Issue: 432
  v2RefinementIssue: 437
  matchupPreviewFixIssue: 441
  matchupDecisionScoringRefinementIssue: 443

contract:
  purpose: >
    Provider-neutral fantasy/NFL game context read model. The original #346 game
    relevance and league-scored impact facts remain available for compatibility;
    Fantasy Relevance v2 adds remaining-scoring-path and must-watch facts derived
    from generated lineup slots, Active Roster state and NFL game state.
  topLevel:
    - SchemaVersion
    - LeagueID
    - Season
    - Week
    - ScoringState
    - DecisionWindows
    - Games
    - FantasyMatchups
    - NonGameAssociations
    - MustWatchGames
  compatibility:
    baseRelevance: >
      Existing Relevance.RosteredPlayerCount and related broad schedule-coverage
      fields remain for current consumers but are not the v2 ranking signal.
    impact: >
      Impact remains based only on league-scored matchup player points. No generic
      provider fantasy-point source is substituted.

remainingScoringPaths:
  source: DecisionWindows.json.FantasyRelevance
  pathTypes:
    locked-starter: >
      Current Starter whose NFL game has kicked but is not Final. This is a
      committed remaining scoring path.
    unlocked-starter: >
      Current Starter whose NFL kickoff is still future. This is provisional
      because the current lineup can still change.
    bench-candidate: >
      Current Bench player whose own NFL game is still unlocked and who is eligible
      for at least one still-unlocked starting slot. This is a possible alternative
      path, not a claim that the player will be started.
  excluded:
    - completed starters
    - locked or completed Bench players
    - IR players
    - Taxi players
    - AutoSub assignment inference
    - players without a usable scheduled-game association

fantasyMatchup:
  v2Field: RemainingRelevance
  fields:
    - State
    - HasRemainingScoringPaths
    - LeftRemainingPathCount
    - RightRemainingPathCount
    - LockedActiveStarterCount
    - UnlockedStarterCount
    - EligibleBenchCandidateCount
    - NextLineupDecisionWindowID
    - NextLineupDecisionGameIDs
    - NextLineupDecisionPrimaryGameID
    - NextLineupDecisionWindowGameCount
    - NextLineupDecisionStarterCount
    - NextLineupDecisionOptionCount
    - NextScoringWindowID
    - NextScoringGameIDs
    - NextScoringPrimaryGameID
    - NextScoringWindowGameCount
    - NextScoringLockedActiveStarterCount
    - NextScoringUnlockedStarterCount
    - NextScoringOptionCount
    - FinalScoringWindowID
    - FinalScoringGameIDs
    - IsFinalScoringWindowCommitted
  states:
    both-sides: Both fantasy teams still have at least one generated scoring path.
    left-only: Only the first TeamID side still has a generated scoring path.
    right-only: Only the second TeamID side still has a generated scoring path.
    none: Neither side has a generated remaining scoring path.
  nextLineupDecisionRule: >
    The next lineup decision is the earliest still-unlocked kickoff window that
    contains either a current unlocked Starter or an eligible Bench candidate for
    this fantasy matchup. Locked-active starters are excluded because their lineup
    decision has already passed. Within that window, the primary NFL game is chosen
    deterministically by direct-starter count, then option count, then stable GameID.
  nextScoringRule: >
    The next scoring preview represents a current direct Starter path only. Prefer
    an already locked-active Starter window when one is live; otherwise use the
    earliest future window containing at least one unlocked current Starter. An
    option-only Bench-candidate window is not a scoring window. Within the selected
    window, NextScoringPrimaryGameID chooses the NFL game with the strongest direct
    starter evidence for this fantasy matchup. NextScoring*StarterCount and
    NextScoringOptionCount are matchup/game-specific counts, not league-wide NFL-game
    totals.
  presentationRelationship: >
    If NextLineupDecisionWindowID and NextScoringWindowID are the same window, UI may
    present one compact scoring card because the lineup decision and scoring trigger
    coincide. If the lineup decision is earlier, UI should surface it first and may
    show the later next-scoring event as secondary context.
  finalWindowRule: >
    The latest remaining path window is FinalScoringWindowID. It is committed only
    when every remaining path in that window is a locked starter; an unlocked
    Starter or Bench candidate keeps the final-window claim provisional.
  decidedBoundary: >
    State=none is a deterministic no-scoring-paths-remaining statement. It is not
    a probabilistic win claim and does not use projections.

game:
  v2Field: RemainingRelevance
  fields:
    - HasRemainingRelevance
    - LockedActiveStarterCount
    - UnlockedStarterCount
    - EligibleBenchCandidateCount
    - DirectStarterFantasyTeamCount
    - DirectStarterFantasyTeamIDs
    - FantasyMatchupCount
    - TwoSidedFantasyMatchupCount
    - FinalWindowFantasyMatchupCount
    - CommittedFinalWindowMatchupCount
    - MustWatchRank
  directStarterFantasyTeams: >
    DirectStarterFantasyTeamIDs is the unique set of fantasy teams with at least
    one remaining direct starter path in this NFL game (unlocked or locked-active).
    Bench-option-only teams are intentionally excluded. The Count field is the
    cardinality of that set and is the ordinary-upcoming breadth signal used by
    must-watch ranking and visual affected-team strips.
  meaning: >
    These fields answer why an NFL game still matters to the fantasy league now.
    Completed-only exposure and broad owned-roster mass do not create remaining
    relevance.

mustWatchGames:
  purpose: >
    Deterministic generated ordering of NFL games that still have at least one
    remaining fantasy scoring path. Angular may select the top N but must not
    rebuild the ranking logic.
  fields:
    - Rank
    - GameID
    - DecisionWindowID
    - StartsAtUtc
    - CommittedFinalWindowMatchupCount
    - LockedActiveStarterCount
    - DirectStarterFantasyTeamCount
    - DirectStarterFantasyTeamIDs
    - UnlockedStarterCount
    - TwoSidedFantasyMatchupCount
    - FantasyMatchupCount
    - FinalWindowFantasyMatchupCount
    - EligibleBenchCandidateCount
  rankingOrder:
    - CommittedFinalWindowMatchupCount descending
    - LockedActiveStarterCount descending
    - DirectStarterFantasyTeamCount descending
    - UnlockedStarterCount descending
    - TwoSidedFantasyMatchupCount descending
    - FantasyMatchupCount descending
    - FinalWindowFantasyMatchupCount descending
    - EligibleBenchCandidateCount descending
    - StartsAtUtc ascending
    - GameID ascending
  rationale: >
    Late-week committed final-window and locked-live starter urgency outrank
    ordinary upcoming exposure. For ordinary upcoming games, breadth across
    distinct fantasy teams with direct starter exposure is more informative than
    the small league's raw fantasy-matchup count, followed by starter volume.
    Two-sided matchup context remains useful but secondary. Bench alternatives are
    deliberately a late tie-breaker and cannot create direct-starter breadth.

uiPresentation:
  affectedTeamStrip: >
    Prominent affected-fantasy-team avatar strips should use
    DirectStarterFantasyTeamIDs, not every team with a Bench alternative. A legacy
    fallback may use current game FantasyTeams with StarterCount > 0 while older
    generated data is still in circulation.
  stateGrammar: >
    Position remains visually encoded by the existing position-color language.
    Lineup state (Starter, Locked, Final, Option) is a separate compact semantic
    treatment so state color does not replace or compete with position identity.
    A different lineup slot such as FLEX is contextual metadata and should be
    visually quieter than the natural-position and lineup-state chips.
  matchupTimelineDensity: >
    In the two-column matchup timeline, player name remains the primary line and
    position/slot/state metadata stays on one compact row underneath. Position and
    state may use pills; a secondary lineup slot should not look like a third equal-
    weight pill. Chip text must remain vertically centered. Raw
    LeftRemainingPathCount / RightRemainingPathCount and the global matchup-level
    current-starter/option aggregate are generated facts but are not primary
    user-facing hero copy; the plain-language State and concrete timeline are.
  interactionBoundary: >
    Entity-level interactions may open existing Player, Fantasy Team and NFL Game
    detail views. Interaction wiring is presentation behavior; eligibility and
    ranking remain generated facts.

ownership:
  domainLogic: >
    Slot mapping, Active Roster/Bench derivation, eligibility, lock/completion
    state, remaining paths, lineup-decision/scoring preview selection/counts,
    direct starter-team breadth and must-watch ranking are generation-layer facts.
  angularBoundary: >
    Angular may render, filter and select from these fields. It must not recreate
    league slot eligibility, scoring-path state or ranking rules. Older schema-v2
    JSON without NextLineupDecision* fields may temporarily render only the scoring
    preview until the next normal League materialization.
  providerBoundary: >
    The current runtime may still consume transitional Sleeper/Tank01-shaped inputs.
    #347 owns the separate provider/source-data consumer migration.

failureBehavior:
  - Missing or ambiguous player/game joins remain explicit through the existing NonGameAssociations/fail-safe behavior.
  - The v2 enrichment does not infer AutoSubs, projections or unknown position eligibility.
  - Existing historical FantasyGameContext generation remains compatible when current FantasyRelevance evidence is absent.

nonGoals:
  - probabilistic matchup win chance
  - expected fantasy points or projections
  - Sleeper AutoSub assignment reconstruction
  - historical 2025 mapping repair tracked separately by #420
  - app-wide design-system rollout tracked separately by #436
