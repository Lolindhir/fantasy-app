id: transactions

title: Transactions
layer: generated-app-data

responsibility: >
  Generated completed league moves used by Angular and by draft ownership
  generation. Draft-pick movements retain their transaction direction and are
  enriched generator-side with the concrete draft and pick result when that
  data is available.

owns:
  - completed transaction identity and chronology via EffectiveAt, not CreatedAt
  - participant roster IDs
  - player adds and drops
  - draft-pick movement from previous owner to new owner
  - stable original draft-pick owner identity
  - resolved draft type and draft key
  - concrete pick key, position and display pick
  - selected player ID and name for completed picks

doesNotOwn:
  - pending transactions without a reliable source
  - frontend presentation layout
  - manually authored league rules

sources:
  providerEvidence: >
    Sleeper transaction, draft and traded-pick endpoints are acquired only by the League Source
    sync into data-source/providers/sleeper; no App generator calls them.
  canonicalInputs: data-source/leagues/<CanonicalLeagueID>/seasons/<season>/ (transactions, drafts, picks, traded picks, rosters, league)
  manualOverlay: data-meta/<CanonicalLeagueID>/transactions-manual.json
  sharedDerivedOwner: data-derived/league-transactions/<CanonicalLeagueID>/<season>.json (with data-derived/league-drafts for pick identity and results)
  notInputs: public/data/Drafts.json and past_seasons Drafts files are consumer outputs and never inputs.

generation:
  primaryGenerator: tools/league_history_app_publish.py
  product: data-derived/league-transactions/<CanonicalLeagueID>/<season>.json
  entryPoints:
    - .github/workflows/league-live.yml (current season, ten-minute chain)
    - .github/workflows/update-history.yml (weekly, all seasons)

notes:
  - EffectiveAt is the authoritative timestamp of a completed move (Shared Derived LeagueTransactions v2). Source/Canonical preserve Sleeper created and status_updated; CreatedAt/CreatedDate remain submission provenance. Manual and legacy missing updated time use CreatedAt deterministically.
  - Angular must consume the generated draft-pick facts instead of deriving draft identity, concrete position or selected player from unrelated frontend state.
  - Draft-pick enrichment is intentionally optional while a future pick has no exact order or while a draft result is not yet available.
  - PlayerName is stored as a historical fallback when PlayerID no longer resolves against the current Players.json.
