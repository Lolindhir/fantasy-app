schemaVersion: 1

artifact: public/data/MatchupProjections.json

role: >
  Generated App delivery read model with the team-level projection and prediction
  ranges for every current fantasy matchup. Consumers join it by FantasyMatchupID
  and FantasyTeamID and display it; they do not calculate projections or ranges.

source:
  publisher: tools/matchup_projection.py
  inputs:
    - computed FantasyGameContext (tools/derived_data_lib/fantasy_game_context.py, ADR-075)
    - App adaptation of the data-derived/player-week-fantasy product (in memory, no public/data read)
    - optional data-derived/season-statistics/<league>/<season>.json (season-to-date Best Ball, historical actual manager efficiency, and per-team actual weekly scores for estimated display uncertainty; only completed weeks strictly before the target)
    - optional computed Decision Windows FantasyRelevance (slot definitions, per-player current roster placement, exact lock state and scoring availability; resolved once with supplied AtUtc, never re-read from public/data)
  model: team-range-v1 (tools/derived_data_lib/models/team_range/v1.py, chosen per season in data-meta Models.TeamRange)
  scheduling: tools/player_week_fantasy_refresh.py inside the APP Data League workflow (about every 10 minutes)
  backtest: tools/historical_team_range_backtest.py

contract:
  schemaVersion: 1
  rootFields:
    - CanonicalLeagueID
    - Season
    - Week
    - DisplayLevel
    - Method
    - WinProbabilityModel
    - Matchups
  displayLevel: >
    The range level UIs show. One of Method.Levels; set once in
    tools/player_week_fantasy.py::DISPLAY_INTERVAL_LEVEL together with the player ranges.
  methodFields:
    Id: normal-independent-v1
    Levels: published range levels
    SigmaBasisLevel: player range level used to derive each starter's standard deviation
    Assumption: starters score independently; player variances add
    ParticipationCondition: ranges are conditional on participation
  matchupFields:
    FantasyMatchupID: join key
    Teams: one entry per team of the matchup
    Axis: shared Min/Max/Step scale covering both teams' ranges at DisplayLevel; null when a team has no range
  teamFields:
    FantasyTeamID: join key
    State: available when every starter is resolved, partial when some are, unavailable when none or no starters
    StarterCount: current starters
    ResolvedStarterCount: starters with a final result, a usable projection or an explicit bye
    FinalStarterCount: starters whose game is final
    ScoredPoints: points of starters in final games
    PregameProjectedScore: sum of starter projections (byes count zero); null unless every starter has one
    ProjectedFinalScore: final-game starters count actual points, other starters their projection, byes and out starters zero; null unless State is available
    StandardDeviation: square root of the summed variances of starters in games that are not final
    Ranges: central ranges per level (Level, Lower, Upper); empty unless State is available
    ByeStarterPlayerIDs: starters on an explicit bye (counted zero)
    OutStarterPlayerIDs: starters in games that are not final whose scoring availability is out (counted zero, no variance)
    UncertainStarterPlayerIDs: starters in games that are not final whose scoring availability is uncertain (projection kept)
    UnavailableStarterPlayerIDs: starters that block the team value
    WinProbability: whole-percent win chance of the matchup from win-prob-v1 (raw normal-difference of the two team projections, no calibration; both teams add up to 100); null unless both teams are available; adjusted with every finished NFL game because final games count real points (SchemaVersion 3, Issue #1443)
    WinProbabilityRaw: unrounded chance fraction (0..1) for this team, computed independently from the other side to preserve very small tails; null when the chance is unavailable (additive, Issue #1507)
    WinProbabilityIsDeterministic: true when both modeled standard deviations are zero, false when there is remaining modeled scoring variance, null when the chance is unavailable; frontend does not infer certainty from rounded 0/100
    DisplayWinProbability: whole-percent rendered chance; same as original WinProbability for complete lineups, else optionally estimated from the selected DisplayProjectedScore and per-side selected uncertainty
    DisplayWinProbabilityRaw: independent raw probability per side; null when either selected score or uncertainty is unknown
    DisplayWinProbabilityIsDeterministic: selected-input determinism; never true for a matchup with a positive season-score volatility estimate
    DisplayWinProbabilityBasis: lineup for complete starter inputs, season-bestball-efficiency-estimate for a mixed or two-sided season fallback, null when unknown; original WinProbability fields are never overwritten
    BestBallEfficiencyFallback: nullable separate estimate (Points = season-to-date mean ProjectedBestBallPoints multiplied by mean actual LineupEfficiencyActual / 100; Method season-bestball-actual-efficiency-v1, SourceThroughWeek and both inputs retained); no recalculation of the target week's Best Ball. Optional ScoreStandardDeviation is the sample SD of completed previous-week actual team scores from SeasonStatistics GameLog (>=3 distinct valid prior weeks, nonzero variance), with ScoreVolatilityGames and ScoreVolatilityMethod season-final-score-sample-sd-v1; does not pretend to be team-range-v1 or calibrated
    DisplayProjectedScore: chosen published display number; existing ProjectedFinalScore when complete, otherwise the season baseline before any starter game is final if valid; null when neither is available
    DisplayProjectionMethod: normal-independent-v1 when using complete starter projection, season-bestball-actual-efficiency-v1 for fallback, otherwise null
    HybridExpected: >-
      Optional, additive CP2 shadow-preview object (null if the computed Decision Windows are unavailable or target
      a different week). Method weekly-hybrid-actual-efficiency-preview-v1. State available/incomplete/unavailable,
      Reason, ExpectedPoints (null unless every required slot is resolvable), LockedProjectedPoints,
      LockedActualPoints, RemainingBestBallPoints, LockedStarterPlayerIDs, OptimalRemainingPlayerIDs,
      UnfilledSlotIDs, ExcludedPlayerCounts, ConditionalAvailabilityPlayerIDs, PoolBasis
      active-roster-only, ParticipationBasis conditional-on-participation, SourceThroughWeek and
      ManagerEfficiencyPercent. Before a player's NFL kickoff the active Starter/Bench roster is
      globally optimized by week-specific PWF points and position eligibility; after kickoff locked
      starters are fixed to their original slots, locked bench players cannot be chosen, and
      completed locked starters contribute real final points. Only the remaining optimized
      slot total is weighted by historical actual LineupEfficiencyActual from season-statistics.
      Bye and confirmed-out candidates are excluded, uncertain/unknown availability among selected
      candidates is explicitly identified. Taxi/IR are not treated as instantly activatable in
      this first, conservative preview; their exclusion is not a permanent league eligibility rule.
      A structurally incomplete lineup (such as only one eligible QB for two QB slots), missing
      prior-week efficiency or contradictory final/lock evidence cannot produce a non-null
      ExpectedPoints. This is not a calibrated model, a guaranteed manager lineup or a complete
      prospective availability/roster transaction simulation. It is not consumed by the Angular
      app and does not change existing displayed scores/chances. No ever-changing AsOfUtc field:
      DecisionWindows receives explicit AtUtc and the deterministic preview changes only when
      actual input facts/locks/points change.
  rootAdditions:
    BestBallFallbackMethod: season-bestball-actual-efficiency-v1
    BestBallFallbackVolatilityMethod: season-final-score-sample-sd-v1

semantics: .ai-context/manual/player-week-fantasy.yaml

consumer:
  - src/app/core/services/data.service.ts joins it onto FantasyGameContext matchups (Projection) by FantasyMatchupID and exposes DisplayLevel as ProjectionDisplay.TeamRangeLevel.
  - Overview matchup cards and the fantasy matchup dialog only format and lay out the published values.

boundaries:
  - A week mismatch between FantasyGameContext and PlayerWeekFantasy skips publication; consumers must ignore a snapshot that targets another Season or Week.
  - Starters without a game association other than a bye (unknown, no team) stay unresolved.
  - Live points are never used; a game that is not final counts its projection until Final.
  - Availability comes from DecisionWindows.json and is ignored when that file targets another Season or LineupWeek.
  - Ranges are estimates under an independence assumption; the backtest documents the observed coverage.
  - The estimated display-only win chance combines the existing win-prob-v1 normal-difference function with empirical per-team historical score SD, not a calibrated prediction distribution. Never feed display chance into pregame recap/upset calculations, and never replace original team-range/WinProbability values.
  - Missing or malformed prior weekly scores, fewer than three scored weeks or an unprojectable partial live lineup keep the estimated chance null. Display can still show the point baseline independently.
  - HybridExpected is an internal optional, read-only CP2 candidate only. It never overwrites ProjectedFinalScore, DisplayProjectedScore, StandardDeviation, WinProbability, DisplayWinProbability, pregame recap/upset figures or their versioned model choices. If HybridExpected is unavailable or incomplete, retain existing independent season BestBallEfficiencyFallback under its original method flag.
