id: request-players
title: Request Players
layer: generator-scripts

responsibility: >
  Builds the current generated player read model from the canonical population
  export (canonical Sleeper snapshot, NFL rosters/draft, league ownership; #347 H1b,
  ADR-043), league-scored canonical stats and the canonical GameHistory (#347 G3),
  then writes Players.json only when the generated dataset passes its integrity checks
  and has changed.

owns:
  - generation of public/data/Players.json
  - consuming the population export of tools/players_population.py (no Tank01 or live Sleeper population call)
  - canonical player ID assignment
  - player ranking enrichment, including previous-season Combined fallback ranking
  - player-data integrity validation before persistence
  - timestamp and backup creation for successful changed outputs
doesNotOwn:
  - Angular player presentation
  - Fantasy Management recommendations
  - downstream player-signal materialization rules

identityContract:
  canonicalId:
    field: Players[].ID
    source: Sleeper player_id from the canonical Sleeper snapshot
    requirements:
      - non-empty for every generated player record
      - globally unique within Players.json
  providerId:
    status: removed in #347 H1b (Players[].TankID no longer exists)
    note: >
      No Tank01 playerID is read any more; GameHistory comes from canonical facts since #347 G3.

scoringContract:
  issue: 347
  step: D4
  source: tools/players_league_scoring.py export, consumed by public/requests/utils/player/PlayerLeagueScoringUtils.psm1
  meaning: >
    Points, played games, snaps, attempts, touchdowns and the three prior seasons
    (PointHistory) are canonical NFL player stats scored with the league ScoringSettings,
    not Tank01 PPR. Per-game FantasyPoints of every GameHistory game use the same scorer (since
    #347 G3 also not yet final and postseason games). Salary, SalaryProjected,
    Ranking, Grading.Rank and the League salary cap follow from these inputs through the unchanged
    PowerShell formulas.
  identity: >
    Players.json[].ID (Sleeper player_id) is resolved to a CanonicalPlayerID per season. A Sleeper ID
    without exactly one owning record for the current season is an identity hold: the last published
    scoring values are kept and the run logs a warning. A league-owned player with an ambiguous
    identity aborts the export (fail closed, last known good Players.json stays).
  persistence: >
    The export is rebuilt on every run from canonical source-data in a temporary file and is not
    committed; persisting it as a derived-data product needs a publish-scope change of the Players
    workflow and is a separate approved step.
  validation: tools/players_league_scoring_shadow.py gate (Sleeper PlayerPoints reference, wired in build.yml)

gameHistoryContract:
  issue: 347
  step: G3
  source: tools/players_game_history.py (built inside the players_league_scoring.py export), converted by ConvertTo-PlayerGameHistory
  meaning: >
    Current-season games of a player from canonical player-stats, snap-counts, qbr-week,
    player-game-long-gains, schedule and game finality; no Games.json and no Tank01. Team keys are
    canonical abbreviations, GameID keeps the legacy provider spelling. QBRating, LongRush and
    LongReceptions are null when the canonical source has no value (unknown, not zero). Details:
    .ai-context/manual/data-sources.yaml players.gameHistoryContract and ADR-044.

rankingContract:
  currentCombined:
    field: Players[].Ranking[Type=Combined]
    source: current-season generated fantasy-point ranks
    meaning: >
      Current-season Combined ranking. Players without qualifying current-season
      values do not receive a usable positive Combined rank.
  previousCombined:
    field: Players[].Ranking[Type=Combined_Previous]
    source: Players[].PointHistory.SeasonMinus1
    meaning: >
      Previous-season Combined ranking generated with the same configured Total
      and PerGame rank weights and tie behavior as the current Combined ranking.
      It exists as a fallback ordering signal and must not be presented as a
      current-season rank.
  comparisonEnrichment: >
    Compare-Players adds Combined_Previous to the newly generated in-memory
    player collection before semantic comparison so the derived ranking is part
    of the persisted Players.json change contract without manually editing
    generated data.

integrityValidation:
  helper: public/requests/utils/player/PlayerUtils.psm1::Test-UniquePlayerIds
  invocation: >
    Compare-Players validates every newly generated player collection before
    change comparison; RequestPlayers.ps1 calls Compare-Players before timestamp,
    backup and Players.json write operations.
  failClosed: true
  failureBehavior:
    - abort the player generation run with a terminating error
    - do not overwrite public/data/Players.json
    - preserve the last known good Players.json
    - do not create a new backup or timestamp for the rejected dataset
  diagnostics:
    - report the number of missing canonical IDs when present
    - report every duplicate canonical Players.ID
    - include Name, TeamID and Position for each conflicting source record

persistence:
  target: public/data/Players.json
  backupEnabled: true
  backupPathPattern: public/data/backup/Players_<UTC timestamp>.json
  backupTiming: >
    The previous Players.json is backed up only after the newly generated player
    dataset has passed integrity validation and a semantic change was detected.

relatedManualDocs:
  - .ai-context/manual/architecture.yaml
  - .ai-context/manual/domain.yaml
  - .ai-context/manual/data-sources.yaml

aiWarnings:
  - Never resolve duplicate canonical IDs by silently dropping one record.
  - A duplicate Players.ID is an upstream identity collision and must remain visible as a data-quality failure.
  - Combined_Previous is a previous-season fallback signal and must never be silently mixed into the current Ranked group.
  - Downstream materializers may keep their own duplicate-ID guard as defense in depth, but the player generator is the earliest publishing boundary and must fail first.
