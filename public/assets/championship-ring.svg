      <stop offset="0.55" stop-color="#c89131"/>
      <stop offset="0.76" stop-color="#f7d77b"/>
      <stop offset="1" stop-color="#a96c17"/>
    </linearGradient>
    <linearGradient id="goldFace" x1="0.15" y1="0" x2="0.85" y2="1">
