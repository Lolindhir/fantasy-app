    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f7f7f"/>
      <stop offset="0.17" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#b6b6b6"/>
      <stop offset="0.66" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#727272"/>
    </linearGradient>
    <linearGradient id="chromeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#8d8d8d"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.2" flood-color="#000" flood-opacity=".34"/>
