<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="8" y1="5" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B3"/>
      <stop offset="0.22" stop-color="#E9B84A"/>
      <stop offset="0.5" stop-color="#8A570B"/>
      <stop offset="0.78" stop-color="#E4AC39"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="silver" x1="25" y1="14" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.36" stop-color="#D8DEE4"/>
      <stop offset="0.68" stop-color="#808A94"/>
      <stop offset="1" stop-color="#F9FBFC"/>
    </linearGradient>
    <radialGradient id="emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(32 28) rotate(90) scale(27 31)">
      <stop stop-color="#0C6B54"/>
      <stop offset="0.55" stop-color="#073A33"/>
      <stop offset="1" stop-color="#041F20"/>
    </radialGradient>
    <linearGradient id="gemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42E0A3"/>
      <stop offset="0.45" stop-color="#0B8A62"/>
      <stop offset="1" stop-color="#034E3D"/>
    </linearGradient>
  </defs>

  <!-- Ring face only: no visible lower finger loop/band. -->
  <path d="M12 6.5h40l7 7v37l-7 7H12l-7-7v-37l7-7Z"
        fill="url(#gold)" stroke="#6E4409" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M14.5 9.5h35l5.2 5.2v32.6l-5.2 5.2h-35l-5.2-5.2V14.7l5.2-5.2Z"
        fill="url(#emerald)" stroke="#F8DD86" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Side championship details, simplified for 25 px use. -->
  <g stroke="#F5D06C" stroke-width="0.85" stroke-linejoin="round">
    <path d="M10.5 16.5h7v8h-7Z" fill="url(#gemGreen)"/>
    <path d="M46.5 16.5h7v8h-7Z" fill="url(#gemGreen)"/>
    <path d="M10.5 39.5h7v8h-7Z" fill="url(#gemGreen)"/>
    <path d="M46.5 39.5h7v8h-7Z" fill="url(#gemGreen)"/>
  </g>

  <!-- Large side stars. -->
  <g fill="#FFE58C" stroke="#8C5A0E" stroke-width="0.45">
    <path d="m14 27.2 1.25 2.5 2.8.4-2.02 1.95.48 2.76L14 33.5l-2.51 1.31.48-2.76-2.02-1.95 2.8-.4L14 27.2Z"/>
    <path d="m50 27.2 1.25 2.5 2.8.4-2.02 1.95.48 2.76L50 33.5l-2.51 1.31.48-2.76-2.02-1.95 2.8-.4L50 27.2Z"/>
  </g>

  <!-- Three top stars mirror the concept but stay bold at icon size. -->
  <g fill="#FFF0A1" stroke="#8C5A0E" stroke-width="0.35">
    <path d="m24 11.5.95 1.92 2.12.31-1.54 1.5.37 2.11L24 16.34l-1.9 1 .36-2.11-1.54-1.5 2.13-.31L24 11.5Z"/>
    <path d="m32 9.4 1.2 2.43 2.69.39-1.95 1.9.46 2.68L32 15.54l-2.4 1.26.46-2.68-1.95-1.9 2.69-.39L32 9.4Z"/>
    <path d="m40 11.5.95 1.92 2.12.31-1.54 1.5.37 2.11L40 16.34l-1.9 1 .36-2.11-1.54-1.5 2.13-.31L40 11.5Z"/>
  </g>

  <!-- Minimal laurel shapes to retain the first concept's championship feel. -->
  <g fill="#F5C95E" stroke="#8C5A0E" stroke-width="0.35">
    <path d="M20 21c-3 1.2-4.5 3.5-4.7 6 2.8-.4 4.6-2.3 4.7-6Z"/>
    <path d="M20 28c-3.1 1.1-4.8 3.2-5 5.7 2.9-.3 4.7-2.1 5-5.7Z"/>
    <path d="M20.5 35c-2.9.8-4.5 2.5-4.8 4.8 2.7-.1 4.3-1.5 4.8-4.8Z"/>
    <path d="M44 21c3 1.2 4.5 3.5 4.7 6-2.8-.4-4.6-2.3-4.7-6Z"/>
    <path d="M44 28c3.1 1.1 4.8 3.2 5 5.7-2.9-.3-4.7-2.1-5-5.7Z"/>
    <path d="M43.5 35c2.9.8 4.5 2.5 4.8 4.8-2.7-.1-4.3-1.5-4.8-4.8Z"/>
  </g>

  <!-- Lombardi-style trophy as the dominant center motif. -->
  <ellipse cx="32" cy="23.3" rx="7.6" ry="5.1"
           transform="rotate(-16 32 23.3)"
           fill="url(#silver)" stroke="#5F6770" stroke-width="0.8"/>
  <path d="M29 27.5h6l2.2 17.5H26.8L29 27.5Z"
        fill="url(#silver)" stroke="#5F6770" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M26.2 44.6h11.6l1.1 2.7H25.1l1.1-2.7Z"
        fill="url(#silver)" stroke="#5F6770" stroke-width="0.7" stroke-linejoin="round"/>

  <!-- Football laces. -->
  <path d="M28.7 22.2 35.2 23.7" stroke="#6B4A13" stroke-width="0.95" stroke-linecap="round"/>
  <path d="m30.5 21.7-.42 1.9M32.1 22.1l-.42 1.9M33.7 22.45l-.42 1.9"
        stroke="#6B4A13" stroke-width="0.62" stroke-linecap="round"/>

  <!-- Small metallic highlight so the face still feels premium at 25 px. -->
  <path d="M13.5 8.2h36" stroke="#FFFFFF" stroke-opacity="0.68" stroke-width="0.65" stroke-linecap="round"/>
</svg>