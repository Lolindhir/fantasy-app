<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="13" y1="6" x2="50" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B5"/>
      <stop offset="0.26" stop-color="#E9BA4E"/>
      <stop offset="0.58" stop-color="#98630F"/>
      <stop offset="0.82" stop-color="#F0C967"/>
      <stop offset="1" stop-color="#744508"/>
    </linearGradient>
    <linearGradient id="band" x1="18" y1="28" x2="46" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0A0"/>
      <stop offset="0.3" stop-color="#D49B2A"/>
      <stop offset="0.6" stop-color="#744508"/>
      <stop offset="0.82" stop-color="#DCA637"/>
      <stop offset="1" stop-color="#FFF3AE"/>
    </linearGradient>
    <linearGradient id="silver" x1="25" y1="14" x2="39" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#DCE4ED"/>
      <stop offset="0.72" stop-color="#8997A8"/>
      <stop offset="1" stop-color="#F7FAFC"/>
    </linearGradient>
  </defs>

  <!-- Broad lower band: drawn first so the compact silhouette still reads unmistakably as a ring. -->
  <ellipse
    cx="32"
    cy="42"
    rx="15.5"
    ry="17.5"
    stroke="url(#band)"
    stroke-width="7.5"
  />
  <path
    d="M20.5 43.5C22 52.2 25.6 57 32 57s10-4.8 11.5-13.5"
    stroke="#FFF0A0"
    stroke-opacity="0.7"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Slightly shorter championship face so more of the band remains visible at 24–25 px. -->
  <path
    d="M20 6.5h24l7.5 7.5v13.5L44 35H20l-7.5-7.5V14L20 6.5Z"
    fill="url(#gold)"
    stroke="#684008"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <path
    d="M23 11.5h18l5.5 5.5v7.5L41 30H23l-5.5-5.5V17l5.5-5.5Z"
    fill="#17283F"
    stroke="#F8E39A"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <g fill="#F9FCFF">
    <circle cx="21.5" cy="15.5" r="1.25"/>
    <circle cx="42.5" cy="15.5" r="1.25"/>
    <circle cx="21.5" cy="26" r="1.25"/>
    <circle cx="42.5" cy="26" r="1.25"/>
  </g>

  <!-- Compact original football-trophy mark. -->
  <ellipse
    cx="32"
    cy="19.2"
    rx="6.3"
    ry="3.8"
    transform="rotate(-16 32 19.2)"
    fill="url(#silver)"
    stroke="#6E7A89"
    stroke-width="0.8"
  />
  <path d="M29.9 22.7h4.2l1.1 5.5h-6.4l1.1-5.5Z" fill="url(#silver)" stroke="#6E7A89" stroke-width="0.75"/>
  <rect x="27.3" y="27.5" width="9.4" height="2.4" rx="1.2" fill="url(#silver)" stroke="#6E7A89" stroke-width="0.65"/>

  <path d="M29.4 18.6 34.5 19.7" stroke="#526171" stroke-width="0.85" stroke-linecap="round"/>
  <path d="m31 18.2-.35 1.55M32.5 18.5l-.35 1.55M34 18.8l-.35 1.55" stroke="#526171" stroke-width="0.6" stroke-linecap="round"/>
</svg>
