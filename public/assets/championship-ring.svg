<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Championship ring</title>
  <desc id="desc">Original silver and gold American-football championship ring with a large finger opening, Lombardi-style trophy and football shoulder details.</desc>
  <defs>
