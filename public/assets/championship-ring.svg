<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="12" y1="8" x2="52" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF2A8"/>
      <stop offset="0.28" stop-color="#E8B94F"/>
      <stop offset="0.58" stop-color="#9E6A16"/>
      <stop offset="0.82" stop-color="#F2CD70"/>
      <stop offset="1" stop-color="#7D5110"/>
    </linearGradient>
    <linearGradient id="silver" x1="24" y1="16" x2="40" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#D8E0EA"/>
      <stop offset="0.7" stop-color="#8796A8"/>
      <stop offset="1" stop-color="#F7FAFD"/>
    </linearGradient>
    <linearGradient id="band" x1="18" y1="34" x2="46" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8D978"/>
      <stop offset="0.32" stop-color="#B77B1B"/>
      <stop offset="0.55" stop-color="#71440B"/>
      <stop offset="0.78" stop-color="#DDAA3D"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
  </defs>

  <!-- Thick championship band, deliberately broad so the silhouette reads at icon size. -->
  <path
    d="M17 34.5C18.5 49.2 23.4 58 32 58s13.5-8.8 15-23.5H36.5C35.8 43.8 34.2 48 32 48s-3.8-4.2-4.5-13.5H17Z"
    fill="url(#band)"
    stroke="#6E460D"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Oversized ring face inspired by championship jewelry, not a solitaire setting. -->
  <path
    d="M20 7h24l9 9v18l-9 9H20l-9-9V16l9-9Z"
    fill="url(#gold)"
    stroke="#6E460D"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <path
    d="M23 13h18l6 6v12l-6 6H23l-6-6V19l6-6Z"
    fill="#17283F"
    stroke="#F8E39A"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Gem-like perimeter details add championship-ring weight without relying on tiny text. -->
  <g fill="#F8FBFF" opacity="0.95">
    <circle cx="21.5" cy="17.5" r="1.35"/>
    <circle cx="42.5" cy="17.5" r="1.35"/>
    <circle cx="21.5" cy="32.5" r="1.35"/>
    <circle cx="42.5" cy="32.5" r="1.35"/>
  </g>

  <!-- Abstract football-trophy mark: original, compact and readable at small sizes. -->
  <ellipse
    cx="32"
    cy="21.5"
    rx="6.8"
    ry="4.25"
    transform="rotate(-16 32 21.5)"
    fill="url(#silver)"
    stroke="#6E7A89"
    stroke-width="0.8"
  />
  <path d="M29.7 25.5h4.6l1.2 7.4h-7l1.2-7.4Z" fill="url(#silver)" stroke="#6E7A89" stroke-width="0.8"/>
  <rect x="27" y="32.3" width="10" height="2.8" rx="1.4" fill="url(#silver)" stroke="#6E7A89" stroke-width="0.7"/>

  <path d="M29.3 20.8 34.7 22" stroke="#526171" stroke-width="0.9" stroke-linecap="round"/>
  <path d="m31.1 20.4-.4 1.7M32.6 20.7l-.4 1.7M34.1 21l-.4 1.7" stroke="#526171" stroke-width="0.65" stroke-linecap="round"/>

  <path d="M16 21.5 13.5 24 16 26.5M48 21.5l2.5 2.5-2.5 2.5" stroke="#FFF3B5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
