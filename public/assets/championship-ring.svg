<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="silverBody" x1="48" y1="34" x2="206" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".24" stop-color="#D9DEE4"/>
      <stop offset=".5" stop-color="#F7F8FA"/>
      <stop offset=".72" stop-color="#A7AEB7"/>
      <stop offset="1" stop-color="#767D86"/>
    </linearGradient>
    <linearGradient id="silverFrame" x1="72" y1="42" x2="186" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".34" stop-color="#C4CAD1"/>
      <stop offset=".58" stop-color="#F5F7F9"/>
      <stop offset="1" stop-color="#8E959E"/>
    </linearGradient>
    <linearGradient id="greenFace" x1="88" y1="58" x2="169" y2="131" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FD283"/>
      <stop offset=".42" stop-color="#0E9554"/>
      <stop offset="1" stop-color="#075C35"/>
    </linearGradient>
    <linearGradient id="chrome" x1="102" y1="62" x2="153" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#D4D9DF"/>
      <stop offset=".5" stop-color="#7F8791"/>
      <stop offset=".67" stop-color="#F7F9FB"/>
      <stop offset="1" stop-color="#A1A8B1"/>
    </linearGradient>
    <linearGradient id="panel" x1="48" y1="63" x2="83" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555B63"/>
      <stop offset="1" stop-color="#20252A"/>
    </linearGradient>
    <mask id="fingerHole" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="#fff"/>
      <ellipse cx="128" cy="187" rx="60" ry="27" fill="#000"/>
    </mask>
  </defs>

  <g>
    <!-- Full ring body: shoulders and lower opening remain the primary silhouette. -->
    <path d="M38 110C38 78 58 51 90 40C101 36 113 34 128 34C143 34 155 36 166 40C198 51 218 78 218 110V158C218 179 209 196 191 207C175 218 154 224 128 224C102 224 81 218 65 207C47 196 38 179 38 158V110Z"
          fill="url(#silverBody)" stroke="#59616A" stroke-width="4.5" stroke-linejoin="round" mask="url(#fingerHole)"/>

    <!-- Strong top highlight for metal readability at 25 px. -->
    <path d="M55 108C55 84 69 63 94 53C104 49 115 47 128 47C141 47 152 49 162 53C187 63 201 84 201 108"
          stroke="#FFFFFF" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/>

    <!-- Exaggerated transparent finger opening for unmistakable ring readability at 25 px. -->
    <ellipse cx="128" cy="187" rx="64" ry="31" fill="none" stroke="#7C848D" stroke-width="8"/>
    <path d="M72 176C88 167 105 163 128 163C151 163 168 167 184 176"
          stroke="#FFFFFF" stroke-opacity=".72" stroke-width="4" stroke-linecap="round"/>

    <!-- Broad collar separating face from the lower ring. -->
    <path d="M45 157C61 151 88 148 128 148C168 148 195 151 211 157V168C193 163 166 160 128 160C90 160 63 163 45 168V157Z"
          fill="url(#silverFrame)" stroke="#777F88" stroke-width="2.5"/>

    <!-- Side shoulders: simple dark panels plus one bold football silhouette each. -->
    <path d="M46 70L66 60L78 72V125L66 135L47 127L41 98L46 70Z"
          fill="url(#panel)" stroke="#7A828B" stroke-width="2.5"/>
    <path d="M210 70L190 60L178 72V125L190 135L209 127L215 98L210 70Z"
          fill="url(#panel)" stroke="#7A828B" stroke-width="2.5"/>

    <g fill="url(#chrome)" stroke="#6F7780" stroke-width="2">
      <ellipse cx="60" cy="98" rx="10" ry="20"/>
      <ellipse cx="196" cy="98" rx="10" ry="20"/>
    </g>
    <path d="M60 86V110M196 86V110" stroke="#59616A" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Raised front plate. -->
    <rect x="70" y="42" width="116" height="105" rx="26" fill="url(#silverFrame)" stroke="#68717B" stroke-width="3.2"/>
    <rect x="84" y="56" width="88" height="73" rx="17" fill="url(#greenFace)" stroke="#075A34" stroke-width="3"/>
    <path d="M95 63H161" stroke="#A8F2CB" stroke-opacity=".58" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Simplified Lombardi-style trophy: larger and fewer lines for 25 px. -->
    <g transform="translate(128 93)">
      <g transform="rotate(-18)">
        <ellipse cx="0" cy="-13" rx="25" ry="17" fill="url(#chrome)" stroke="#646C75" stroke-width="2.8"/>
        <path d="M-11 -13C-4 -10 4 -7 11 -6" stroke="#5C646D" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M-4 -18V-10M1 -19V-9M6 -17V-9" stroke="#717983" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <path d="M-13 7L-22 53H22L13 7Z" fill="url(#chrome)" stroke="#646C75" stroke-width="2.8" stroke-linejoin="round"/>
      <path d="M-15 50H15" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
    </g>

  </g>
</svg>
