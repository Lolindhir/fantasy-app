<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="5" y1="5" x2="59" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6BC"/>
      <stop offset=".23" stop-color="#E9B84B"/>
      <stop offset=".5" stop-color="#875509"/>
      <stop offset=".78" stop-color="#E4AD3C"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="silver" x1="26" y1="15" x2="39" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".33" stop-color="#F4F7F9"/>
      <stop offset=".65" stop-color="#AEB7C0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(32 29) rotate(90) scale(27 30)">
      <stop stop-color="#0D7057"/>
      <stop offset=".56" stop-color="#073B33"/>
      <stop offset="1" stop-color="#041F20"/>
    </radialGradient>
    <linearGradient id="gemGreen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#45E3A6"/>
      <stop offset=".46" stop-color="#0D8E66"/>
      <stop offset="1" stop-color="#034E3D"/>
    </linearGradient>
  </defs>

  <!-- Stronger open ring shoulders: clearly ring-like, but still no closed lower finger loop. -->
  <path d="M14.5 14.5C6.5 16 1.5 23.5 1.5 33c0 8.8 3.8 15.8 11.5 20.2l5.4-7.3c-4.3-2.9-6.5-7-6.5-12.5 0-5.4 2.2-9.4 6.7-12.1l-4.1-6.8Z"
        fill="url(#gold)" stroke="#6E4409" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M49.5 14.5C57.5 16 62.5 23.5 62.5 33c0 8.8-3.8 15.8-11.5 20.2l-5.4-7.3c4.3-2.9 6.5-7 6.5-12.5 0-5.4-2.2-9.4-6.7-12.1l4.1-6.8Z"
        fill="url(#gold)" stroke="#6E4409" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Open lower-side returns stop before meeting in the middle. -->
  <path d="M7.3 42.6c1.8 7.3 6.4 13.6 14.4 17.3l3.7-6.1c-5.1-2.5-8.9-6.4-10.8-11.8l-7.3.6Z"
        fill="#C98A21" stroke="#6E4409" stroke-width=".85" stroke-linejoin="round"/>
  <path d="M56.7 42.6c-1.8 7.3-6.4 13.6-14.4 17.3l-3.7-6.1c5.1-2.5 8.9-6.4 10.8-11.8l7.3.6Z"
        fill="#C98A21" stroke="#6E4409" stroke-width=".85" stroke-linejoin="round"/>

  <path d="M7.8 27.2c-1 2-1.5 4.1-1.5 6.3 0 2.6.5 4.9 1.6 7"
        stroke="#FFF1A5" stroke-width="1.15" stroke-linecap="round" opacity=".74"/>
  <path d="M56.2 27.2c1 2 1.5 4.1 1.5 6.3 0 2.6-.5 4.9-1.6 7"
        stroke="#FFF1A5" stroke-width="1.15" stroke-linecap="round" opacity=".74"/>

  <!-- Wider, softer championship face; intentionally less square than v5. -->
  <path d="M16.2 6.5h31.6c5.4 0 9.2 4.4 9.2 10.3v29.4C57 52.4 52.2 57 45.9 57H18.1C11.8 57 7 52.4 7 46.2V16.8C7 10.9 10.8 6.5 16.2 6.5Z"
        fill="url(#gold)" stroke="#6E4409" stroke-width="1.45"/>
  <path d="M18 10.2h28c4.5 0 7.3 3.5 7.3 8.1v25.4c0 5.1-3.7 8.8-8.9 8.8H19.6c-5.2 0-8.9-3.7-8.9-8.8V18.3c0-4.6 2.8-8.1 7.3-8.1Z"
        fill="url(#emerald)" stroke="#F8DD86" stroke-width="1.15"/>

  <!-- Sparse side accents only; no extra micro-detail. -->
  <g stroke="#F5D06C" stroke-width=".8" stroke-linejoin="round">
    <path d="M11.6 18.3h6.6v7.2h-6.6Z" fill="url(#gemGreen)"/>
    <path d="M45.8 18.3h6.6v7.2h-6.6Z" fill="url(#gemGreen)"/>
  </g>
  <g fill="#FFE58C" stroke="#8C5A0E" stroke-width=".42">
    <path d="m15 31.2 1.08 2.18 2.4.35-1.74 1.69.41 2.39L15 36.69l-2.15 1.13.41-2.39-1.74-1.69 2.4-.35L15 31.2Z"/>
    <path d="m49 31.2 1.08 2.18 2.4.35-1.74 1.69.41 2.39L49 36.69l-2.15 1.13.41-2.39-1.74-1.69 2.4-.35L49 31.2Z"/>
  </g>
  <g fill="#FFF1A6" stroke="#8C5A0E" stroke-width=".34">
    <path d="m25 12.6.88 1.78 1.96.29-1.42 1.38.34 1.95-1.76-.92-1.76.92.34-1.95-1.42-1.38 1.96-.29L25 12.6Z"/>
    <path d="m32 10.3 1.12 2.27 2.5.36-1.81 1.77.43 2.49L32 16.04l-2.24 1.18.43-2.49-1.81-1.77 2.5-.36L32 10.3Z"/>
    <path d="m39 12.6.88 1.78 1.96.29-1.42 1.38.34 1.95-1.76-.92-1.76.92.34-1.95-1.42-1.38 1.96-.29L39 12.6Z"/>
  </g>

  <!-- Brighter, simpler Lombardi-style trophy for stronger 25 px readability. -->
  <ellipse cx="32" cy="23.2" rx="8" ry="5.2" transform="rotate(-16 32 23.2)"
           fill="url(#silver)" stroke="#F4F7F9" stroke-width="1"/>
  <path d="M29.6 27.6h4.8l2.3 16.1h-9.4l2.3-16.1Z"
        fill="url(#silver)" stroke="#F4F7F9" stroke-width="1" stroke-linejoin="round"/>
  <path d="M26.4 43.6h11.2l1.35 3.1h-13.9l1.35-3.1Z"
        fill="url(#silver)" stroke="#F4F7F9" stroke-width=".9" stroke-linejoin="round"/>
  <path d="M28.8 22.2 35.2 23.7" stroke="#7A5718" stroke-width=".9" stroke-linecap="round"/>

  <path d="M14 8.8h36" stroke="#FFFFFF" stroke-opacity=".7" stroke-width=".7" stroke-linecap="round"/>
</svg>