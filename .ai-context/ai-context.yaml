schemaVersion: 1

project:
  name: fantasy-app
  repository: Lolindhir/fantasy-app
  frontend: Angular
  dataGeneration: PowerShell
  generatedDataPath: public/data
  purpose: >
    Static fantasy football web app that displays generated league data.
    PowerShell scripts generate app-readable JSON files that are consumed
    by the Angular frontend.

contextModel:
  principle: >
    Manual architecture and domain decisions are separated from automatically
    generated structure documentation and local file header documentation.

  manualContext:
    description: >
      Stable, human-maintained documentation describing architecture, domain
      meaning, source-of-truth decisions and AI guidance.
    directory: .ai-context/manual
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  fileHeaderDocs:
    description: >
      Human-maintained local documentation embedded in source file headers or
      sidecar .ai-doc.yaml files. Describes the role and boundaries of one file.
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  generatedContext:
    description: >
      Machine-generated snapshots of repository structure, extracted AI-DOC
      headers, module dependencies and JSON data contracts.
    directory: .ai-context/generated
    mayBeEditedByAI: false
    mayBeRegeneratedAutomatically: true

  fantasyManagement:
    description: >
      Isolated Fantasy Management workspace for NFL Dynasty, Mighty Giants,
      StonedLack, Relevant Players, trade, roster, draft, free-agent and player
      evaluation work. Detailed rules and sources live in the repository under
      fantasy-management/ and must not be duplicated in this central app context.
    entryPoint: fantasy-management/AGENTS.md
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  workTracking:
    description: >
      GitHub Issues are the canonical operative source of truth for repository
      backlog, progress, handoff and historical work records. Durable architecture,
      domain and source-of-truth knowledge remains in the appropriate canonical
      repository documentation.
    source: GitHub Issues
    contract: .ai-context/manual/work-tracking.yaml
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Follow .ai-context/manual/work-tracking.yaml for Issue lifecycle, granularity, labels, priorities and drift governance.
      - Do not maintain parallel Markdown todo lists.
      - The current Issue body is the canonical mutable work state; comments are supplemental history or communication.

  workflowMonitoring:
    description: >
      Versioned operational contract that classifies every GitHub Actions workflow,
      defines run-health thresholds and routes deterministic health snapshots to an
      external notification layer.
    contract: .ai-context/manual/workflow-monitoring.yaml
    monitor: GitHub health snapshot plus external ChatGPT condition watch
    snapshotBranch: workflow-health-state
    snapshotPath: workflow-health.json
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - The repository contract owns workflow monitoring semantics; individual workflow YAML files do not duplicate alert policy.
      - Every workflow must be classified; unclassified or stale configured paths are monitoring configuration errors.
      - The repository snapshotter evaluates run metadata deterministically and writes only the isolated workflow-health-state branch.
      - The external monitor remains read-only and decides user notification from the current snapshot and its freshness.

  frontendDesign:
    description: >
      Human-maintained app-wide frontend design governance separated into durable
      principles, design architecture, auditable standards and decision rationale.
    entryPoint: .ai-context/manual/frontend-design/index.yaml
    directory: .ai-context/manual/frontend-design
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Frontend/UI/UX and design-system work must read the entry point and follow its internal reading order before analysis or mutation.
      - Keep principles, architecture, standards and decisions semantically distinct instead of mixing recommendations and hard requirements in one file.
      - Use documented normative strength and exception semantics when reviewing compliance; do not invent hidden design requirements during an audit.

readingOrder:
  - .ai-context/manual/ai-guidance.yaml
  - .ai-context/manual/work-tracking.yaml
  - .ai-context/manual/workflow-monitoring.yaml
  - .ai-context/manual/architecture.yaml
  - .ai-context/manual/frontend-design/index.yaml
  - .ai-context/manual/domain.yaml
  - .ai-context/manual/draft-identity.yaml
  - .ai-context/manual/player-identity.yaml
  - .ai-context/manual/nfl-source-data.yaml
  - .ai-context/manual/league-source-data.yaml
  - .ai-context/manual/historical-fantasy-scoring.yaml
  - .ai-context/manual/provider-join-invariants.yaml
  - .ai-context/manual/source-of-truth-matrix.yaml
  - .ai-context/manual/data-sources.yaml
  - .ai-context/manual/decisions.yaml
  - .ai-context/manual/routing.yaml
  - .ai-context/manual/file-header-docs.yaml
  - .ai-context/manual/ci-diagnostics.yaml
  - .ai-context/generated/file-docs.json
  - .ai-context/generated/generated-json-contracts.json

shortContext:
  fantasy-management/AGENTS.md: Isolated Fantasy Management agent entry point for NFL Dynasty, Mighty Giants, StonedLack, Relevant Players, analyses, boards and decisions
  .ai-context/manual/work-tracking.yaml: Kanonischer Vertrag für GitHub-Issue-Work-Tracking, Label-Semantik, Prioritäten, Handoff und Drift-Governance
  .ai-context/manual/workflow-monitoring.yaml: Kanonischer fail-closed Vertrag für Workflow-Klassifizierung, Failure-/Staleness-Auswertung, isolierten Health-Snapshot und externe Alarmierung
  .ai-context/manual/frontend-design/index.yaml: Kanonischer Einstiegspunkt für app-weite Frontend-Design-Governance mit getrennten Principles, Architecture, Standards und Decisions sowie MUST/SHOULD/MAY-Review-Semantik
  public/data/Metadata.json: Liga-spezifische Inputs und Regeln; Drafts.UpcomingDraftCount zählt nicht abgeschlossene Drafts pro Typ zusätzlich zu allen Drafts der aktuellen LeagueYear; DraftType + DraftInstance identifiziert einen konfigurierten Draft-Slot und SleeperDraftIDs bindet bekannte konkrete Sleeper-Drafts saisonweise
  .ai-context/manual/draft-identity.yaml: Kanonischer Vertrag für DraftType, DraftInstance, DraftCode, DraftKey, SleeperDraftID-Mapping und Transaction-Pick-Auflösung
  .ai-context/manual/player-identity.yaml: Kanonischer Vertrag für die von fantasy-app vergebene providerunabhängige CanonicalPlayerID, historische Provider-Mappings, Konflikt-Quarantäne, Legacy-Feldmigration und den unveränderten Sleeper-basierten Players.json-App-Vertrag
  .ai-context/manual/nfl-source-data.yaml: Kanonischer Vertrag für source-data Registry v3, Fixed-/Season-Partitioned Acquisition, Availability, Dataset-Lifecycle, Refresh/Retention/Repair, historische Partitionen und NFL-Source-Materialisierung
  .ai-context/manual/league-source-data.yaml: Produktiv akzeptierter Phase-1B-Vertrag des gemeinsamen League Source Layers; CanonicalLeagueID/CanonicalLeagueSeasonID, Sleeper-League-Lineage, saisonale WeekStructure, Multi-League-Struktur, Raw/Canonical-Lifecycle und Phase-2-Consumergrenzen
  .ai-context/manual/historical-fantasy-scoring.yaml: ADR-033 und kanonischer Hardening-Vertrag für historische/What-if-Neuberechnung aus persistierten NFL-Fakten plus explizitem League-Scoringprofil; Missing historisch ist fail-closed, Provider-Fantasy-Punkte bleiben validation-only und nfl-reise ist die aktuelle CanonicalLeagueID
  .ai-context/manual/provider-join-invariants.yaml: Fail-closed Cardinality-/Uniqueness-Vertrag für Player-, Team-, Draft-, Transaction- und Historical-Provider-Joins
  .ai-context/manual/source-of-truth-matrix.yaml: Konsolidierte feldbezogene Primary-/Secondary-/Fallback-Entscheidung für NFL- und Fantasy-League-Quellen sowie heutige Runtime-vs.-kanonische Zielbesitzer
  public/requests/utils/ConfigUtils.psm1: Technische Pfade und Generierungs-Konfiguration
  public/data/*.json: Generierte App-Daten
  public/data/League.json: Generiertes League-Home-Read-Model für Lifecycle, Teams, Standings, League-Konfiguration und Season-Metadaten; Fantasy-Matchup-Schedule/Score/Result/Finality liegen ausschließlich im dedizierten Matchups-Read-Model
  public/data/Matchups.json: Generator-eigenes season-weites Fantasy-Matchup-Read-Model mit bekannten Paarungen, nullable effective Scores, FantasyMatchupID, open/final/unknown-Finality, finalen Ergebnissen, Week Stage/Kickoff und Summary-Helpern; historische Pendants liegen unter past_seasons/Matchups
  public/data/DecisionWindows.json: Generiertes providerneutrales App-Read-Model für exakte Kickoff-Decision-Windows, Player-Lock-Fakten, aktuelle ScoringAvailability, objektive TeamLineupEvaluations und Repairability; Angular nutzt StartsAtUtc/providerneutrale Zustände nur für Darstellung und leitet keine Schedule-, Roster-, ESPN- oder Lineup-Domainlogik neu ab
  public/data/PastSeasonsIndex.json: Generiertes Navigationsmanifest für historische Season-Dateien unter public/data/past_seasons, einschließlich Matchups und FantasyGameContext wenn vorhanden
  public/requests/RequestPastSeasonsIndex.ps1: Entry-Point zum Regenerieren von PastSeasonsIndex.json
  public/requests/utils/league/PastSeasonsIndexUtils.psm1: Utility zum Scannen konfigurierter Past-Season-Ressourcen, Schreiben stabiler data/... Web-Pfade und ContentHash-basierter Index-Metadaten
  public/requests/utils/league/DraftOrderAwareUtils.psm1: Order-aware Draft-Pick-Generator; behält alle Drafts der aktuellen Saison unabhängig vom Status und ergänzt je Typ/Instanz die konfigurierte Anzahl offener Drafts; berücksichtigt linear/snake bei exakten Drafts
  public/requests/utils/league/DraftHistoryUtils.psm1: Completed-Draft-History-Generator; nutzt dieselbe Season+DraftType+DraftInstance-Identität wie Current Drafts und reichert completed Pick-Ergebnisse sowie CurrentOwnerRosterID aus Sleeper-Pick-Ergebnissen an
  public/requests/utils/league/LeagueUtils.psm1: Generator für League Status und Phase; unterscheidet Pre Draft, In Draft und Between Drafts anhand aktueller offener, laufender und abgeschlossener Drafts
  public/requests/utils/league/LeagueOverviewUtils.psm1: Generator-Helper für nullable TradeDeadlineWeek sowie echten Regular-Season-/Playoff-Kickoff; Matchup-Snapshot-Kompatibilität gehört nicht mehr zu League.json
  public/requests/utils/league/MatchupReadModelUtils.psm1: Öffentliche Generator-Grenze für season-weite Matchups-Read-Models, Vergleich, historische Materialisierung, kanonische Pairing-/Score-Helfer und neutrale #503-Reihenfolge; Legacy League.Matchups wird nicht exportiert
  deploy_action.ps1: Pages-Build-Script; schreibt .ai-workflow/build.log und deploy-script-result.json als transiente CI-Diagnose
  .ai-context/manual/ci-diagnostics.yaml: Manuelle Doku für transiente Build-/Deploy-Diagnoseausgaben
  src/app/core/interceptors/json-data-cache-busting.interceptor.ts: Fügt lokalen GET-Requests für JSON unter data/ den aktuellen Build-Commit als Queryparameter hinzu; data/past_seasons/** bleibt für langfristiges historisches Caching ausgenommen
  src/app/core/services/data-api.service.ts: HTTP-Lader für generierte JSON-Dateien; lädt League-Daten, Transactions.json für Moves, DecisionWindows.json, Matchups.json, FantasyGameContext.json sowie indexierte historische Matchups-/FantasyGameContext-Ressourcen
  src/app/core/services/data.service.ts: Öffentliche App-Datenfassade; reicht gemappte League-/Player-/Draft-/Transaction-Daten sowie die generator-owned DecisionWindows-, Matchups- und FantasyGameContext-Read-Models und deren semantische Updated-Timestamps an Consumer durch
  src/app/core/models/transaction.models.ts: Explizite Raw- und Frontend-Modelle für abgeschlossene Transaktionen, Teilnehmer, Spieler-Assets und Draft-Pick-Bewegungen; unresolved Sleeper-Picks dürfen bis zur eindeutigen Instanzauflösung null DraftType/DraftKey tragen
  src/app/core/mappers/transaction.mapper.ts: Reiner Mapper für Transactions.json; löst Teams und Spieler auf und ordnet Assets je Teilnehmer als acquired/sent zu
  src/app/features/**: Geroutete Angular-Feature-Seiten
  src/app/features/overview/overview.html: League-Home-Overview; Hero nutzt League Timeline, Matchups werden verfügbarkeitsgetrieben auch im späten Draft gezeigt, Current Standings bleiben auf In-Season/Playoffs begrenzt und All-Time bleibt separat erhalten
  src/app/features/standings/standings-page.ts: Geroutete Standings-Seite für Hall of Fame, All-Time Overview, Current Standings und Season Archive
  src/app/features/drafts/drafts-page.ts: Gerouteter Drafts-Seiten-Aggregator; Current entspricht League.Season, Future nur späteren Seasons und Past nur archivierten früheren Seasons
  src/app/features/drafts/components/**: Wiederverwendbare Draft-UI-Bausteine wie DraftShell, DraftPickCard, DraftPickTrigger und DraftPickPopover
  src/app/features/drafts/tabs/current-drafts/**: Wiederverwendete current-style Draft-Cards für Current und Past mit Overview, Teams und List; nutzen zentrale Draft-ViewModels und gemeinsame Draft-UI-Komponenten
  src/app/features/drafts/tabs/future-drafts/**: Future-Drafts-UI mit teambezogenen Pick-Zusammenfassungen, DraftShell-Header, gemeinsamem DraftPickTrigger und gemeinsamem DraftPickPopover
  src/app/shared/components/league-legacy-summary/league-legacy-summary.ts: Wiederverwendbare Hall-of-Fame-Kachelkomponente für Legacy-Highlights
  src/app/shared/components/league-timeline/league-timeline.ts: Wiederverwendbare Hero-Timeline; In-Season/Playoffs trennen recurring Operational Deadlines (Next Lineup Lock + Next Waiver Run) von unabhängigen Season Milestones (Trade Deadline/Playoffs Start/League Final), nutzen einen minute-aligned Frontend-Clock für StartsAtUtc-Rollover und isolieren DecisionWindows-Ladefehler; Pre-/Draft-/Off-Season behalten die Legacy-Milestone-Darstellung
  src/app/shared/components/decision-window-context-popover/decision-window-context-popover.ts: Responsive Commissioner-Popover für ein exaktes Decision Window; listet die generierten Games und alle aktuellen League-Teams per FantasyTeamID/TeamID, zeigt objektive Status-/Affected-Kontexte und Updated-Freshness und öffnet den bestehenden TeamDetailDialogService
  src/app/shared/components/league-matchups/league-matchups.ts: Wiederverwendbare Matchup-Darstellung; konsumiert Matchups.json, nutzt Summary.ActiveOrNextWeek und FantasyMatchupID für den Join zu FantasyGameContext, löst TeamIDs gegen gemappte League-Teams auf und bewahrt nullable Score-Semantik
  src/app/shared/components/all-time-overview/all-time-overview.ts: Wiederverwendbare All-Time-Übersicht mit Reitern für Overall und Regular Season
  src/app/shared/components/current-standings/current-standings.ts: Wiederverwendbare Current-Standings-Komponente für aktuelle Tabellenzeilen
  src/app/shared/components/season-archive/season-archive.ts: Wiederverwendbares Season Archive für Playoff-Ergebnisse, Awards und Regular-Season-Standings je Saison
  src/app/shared/components/season-results/season-results.ts: Wiederverwendbare Season-Results-Komponente für vorherige Saisonergebnisse, Podium und Restplatzierungen
  src/app/shared/components/all-time-standings/all-time-standings.ts: Wiederverwendbare All-Time-Standings-Komponente für Overall-Standings
  src/app/shared/components/all-time-regular-season-standings/all-time-regular-season-standings.ts: Wrapper für die All-Time-Regular-Season-Ansicht über die gemeinsame Regular-Season-Standings-Liste
  src/app/shared/components/regular-season-standings-list/regular-season-standings-list.ts: Gemeinsame kompakte Regular-Season-Zeilenkomponente für All-Time Regular Season und archivierte Season-Regular-Standings
  src/app/shared/utils/decision-window-view.util.ts: Reine Frontend-View-Utility für earliest-future StartsAtUtc-Auswahl, lokale Window-/Countdown-Formatierung, TeamID-basierte Statusprojektion, Team-Counts und Commissioner-Sortierung; keine Schedule-/Roster-/Lineup-Ableitung
  src/app/shared/utils/league-timeline-view.util.ts: Reine Timeline-ViewModel-Utility; modelliert in aktiven Phasen Operational Deadlines getrennt von Season Milestones und bewahrt die Legacy-Timeline für Pre-/Draft-/Off-Season
  src/app/shared/utils/league-standings-view.util.ts: Gemeinsame Frontend-ViewModel-Utility für Current Standings, Season Results, Hall of Fame und Season Archive
