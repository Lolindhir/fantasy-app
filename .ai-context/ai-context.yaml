schemaVersion: 1

project:
  name: fantasy-app
  repository: Lolindhir/fantasy-app
  frontend: Angular
  dataGeneration: PowerShell
  generatedDataPath: public/data
  purpose: >
    Static fantasy football web app that displays generated league data.
    PowerShell scripts generate app-readable JSON files that are consumed
    by the Angular frontend.

contextModel:
  principle: >
    Manual architecture and domain decisions are separated from automatically
    generated structure documentation and local file header documentation.

  manualContext:
    description: >
      Stable, human-maintained documentation describing architecture, domain
      meaning, source-of-truth decisions and AI guidance.
    directory: .ai-context/manual
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  fileHeaderDocs:
    description: >
      Human-maintained local documentation embedded in source file headers or
      sidecar .ai-doc.yaml files. Describes the role and boundaries of one file.
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  generatedContext:
    description: >
      Machine-generated snapshots of repository structure, extracted AI-DOC
      headers, module dependencies and JSON data contracts.
    directory: .ai-context/generated
    mayBeEditedByAI: false
    mayBeRegeneratedAutomatically: true

  fantasyManagement:
    description: >
      Isolated Fantasy Management workspace for NFL Dynasty, Mighty Giants,
      StonedLack, Relevant Players, trade, roster, draft, free-agent and player
      evaluation work. Detailed rules and sources live in the repository under
      fantasy-management/ and must not be duplicated in this central app context.
    entryPoint: fantasy-management/AGENTS.md
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  leagueMetadata:
    description: >
      Hand-maintained league metadata per league under data-meta/<CanonicalLeagueID>/ (ADR-054,
      Issue #986): provider league ID, owners, draft configuration, per-season Cap Deadline and model
      choice per season. Calculation logic lives in central models, not here.
    contract: .ai-context/manual/league-metadata.yaml
    directory: data-meta
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Only hand maintenance writes into data-meta; no workflow or generator does.
      - Read it through tools/league_metadata.py or LeagueMetadataUtils.psm1, never by ad-hoc path.
      - Do not put model parameters or facts that are already canonical in data-source into the metadata.

  workTracking:
    description: >
      GitHub Issues are the canonical operative source of truth for repository
      backlog, progress, handoff and historical work records. Durable architecture,
      domain and source-of-truth knowledge remains in the appropriate canonical
      repository documentation.
    source: GitHub Issues
    contract: .ai-context/manual/work-tracking.yaml
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Follow .ai-context/manual/work-tracking.yaml for Issue lifecycle, granularity, labels, priorities and drift governance.
      - Do not maintain parallel Markdown todo lists.
      - The current Issue body is the canonical mutable work state; comments are supplemental history or communication.

  architectureReview:
    description: >
      Canonical cross-cutting contract for architecture self-review and independent
      reviewer passes. It requires existing-first analysis, configuration/dynamic
      checks, complete identity dimensions, source-of-truth ownership, dependency
      invalidation, compatibility, workflow reuse and testable validation.
    contract: .ai-context/manual/architecture-review.yaml
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Apply the self-review when proposing or implementing materially architectural changes covered by the contract.
      - Independent Architecture Review is read-only by default and records concrete findings in the owning Issue.
      - Reuse status:review for the lifecycle handoff; review type/result belongs in the Issue body in v1.

  workflowMonitoring:
    description: >
      Versioned operational contract that classifies every GitHub Actions workflow,
      defines run-health thresholds and routes deterministic health snapshots to an
      external notification layer.
    contract: .ai-context/manual/workflow-monitoring.yaml
    monitor: GitHub health snapshot plus external ChatGPT condition watch
    snapshotBranch: workflow-health-state
    snapshotPath: workflow-health.json
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - The repository contract owns workflow monitoring semantics; individual workflow YAML files do not duplicate alert policy.
      - Every workflow must be classified; unclassified or stale configured paths are monitoring configuration errors.
      - The repository snapshotter evaluates run metadata deterministically and writes only the isolated workflow-health-state branch.
      - The external monitor remains read-only and decides user notification from the current snapshot and its freshness.

  frontendDesign:
    description: >
      Human-maintained app-wide frontend design governance separated into durable
      principles, design architecture, auditable standards and decision rationale.
    entryPoint: .ai-context/manual/frontend-design/index.yaml
    directory: .ai-context/manual/frontend-design
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Frontend/UI/UX and design-system work must read the entry point and follow its internal reading order before analysis or mutation.
      - Keep principles, architecture, standards and decisions semantically distinct instead of mixing recommendations and hard requirements in one file.
      - Use documented normative strength and exception semantics when reviewing compliance; do not invent hidden design requirements during an audit.

readingOrder:
  - .ai-context/manual/ai-guidance.yaml
  - .ai-context/manual/architecture-review.yaml
  - .ai-context/manual/work-tracking.yaml
  - .ai-context/manual/workflow-monitoring.yaml
  - .ai-context/manual/architecture.yaml
  - .ai-context/manual/league-metadata.yaml
