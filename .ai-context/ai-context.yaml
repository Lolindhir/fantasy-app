  - .ai-context/manual/external-source-data.yaml
  - .ai-context/manual/historical-fantasy-scoring.yaml
  - .ai-context/manual/week-finality.yaml
  - .ai-context/manual/player-week-fantasy.yaml
  - .ai-context/manual/derived-models.yaml
  - .ai-context/manual/player-valuation.yaml
  - .ai-context/manual/league-standings.yaml
  - .ai-context/manual/league-lifecycle.yaml
  - .ai-context/manual/decision-windows.yaml
  - .ai-context/manual/matchup-context.yaml
  - .ai-context/manual/weekly-recaps.yaml
