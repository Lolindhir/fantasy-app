shortContext:
  fantasy-management/AGENTS.md: Isolated Fantasy Management agent entry point for NFL Dynasty, Mighty Giants, StonedLack, Relevant Players, analyses, boards and decisions
  .ai-context/manual/architecture-review.yaml: Kanonischer Vertrag für Architecture-Self-Review und unabhängige Reviews mit Existing-first-, Dynamik-, Ownership-, Identity-, Invalidation-, Kompatibilitäts- und Validierungschecks
  .ai-context/manual/work-tracking.yaml: Kanonischer Vertrag für GitHub-Issue-Work-Tracking, Label-Semantik, Prioritäten, Handoff und Drift-Governance
  .ai-context/manual/workflow-monitoring.yaml: Kanonischer fail-closed Vertrag für Workflow-Klassifizierung, Failure-/Staleness-Auswertung, isolierten Health-Snapshot und externe Alarmierung
  .ai-context/manual/frontend-design/index.yaml: Kanonischer Einstiegspunkt für app-weite Frontend-Design-Governance mit getrennten Principles, Architecture, Standards und Decisions sowie MUST/SHOULD/MAY-Review-Semantik
  .ai-context/manual/league-metadata.yaml: Kanonischer Vertrag fuer die handgepflegten Liga-Metadaten data-meta/<CanonicalLeagueID>/metadata.json (ADR-054, Issue #986) mit Modellwahl je Saison, Lader und fail-closed Regeln; hat Metadata.json, config.ps1 und _bootstrap abgeloest (entfernt)
  .ai-context/manual/draft-identity.yaml: Kanonischer Vertrag für DraftType, DraftInstance, DraftCode, DraftKey, SleeperDraftID-Mapping und Transaction-Pick-Auflösung
  .ai-context/manual/player-identity.yaml: Kanonischer Vertrag für die von fantasy-app vergebene providerunabhängige CanonicalPlayerID, historische Provider-Mappings, Konflikt-Quarantäne, Legacy-Feldmigration und den unveränderten Sleeper-basierten Players.json-App-Vertrag
  .ai-context/manual/nfl-source-data.yaml: Kanonischer Vertrag für data-source Registry v3, Fixed-/Season-Partitioned Acquisition, Availability, Dataset-Lifecycle, Refresh/Retention/Repair, historische Partitionen und NFL-Source-Materialisierung
  .ai-context/manual/league-source-data.yaml: Produktiv akzeptierter Phase-1B-Vertrag des gemeinsamen League Source Layers; CanonicalLeagueID/CanonicalLeagueSeasonID, Sleeper-League-Lineage, saisonale WeekStructure, Multi-League-Struktur, Raw/Canonical-Lifecycle und Phase-2-Consumergrenzen
  .ai-context/manual/external-source-data.yaml: Kanonischer Vertrag für externe Markt-, Ranking-, ADP-, Projection- und Roster-Activity-Quellen als Source Evidence (ADR-060, Issue #988): eigene Registry data-source/external-registry.json, Snapshot-Layout unter data-source/market, Identitätsindex ohne Namens-Fallback, Rechtefelder, Challenge-/Phasenregeln; Fundament steht, Umzug je Provider folgt
  data-derived/**: Physischer kanonischer Owner fuer reproduzierbare consumer-neutrale Shared-Derived-Daten nach ADR-038; erster produktiver Datensatz ist PlayerWeekFantasy
  .ai-context/manual/week-finality.yaml: Kanonischer Vertrag der gemeinsamen Woche-final-Definition (ADR-071, Issue #897); Belege NflGamesFinal/NflStatsComplete/LeagueScored, Meilensteine LeagueScoredWeek und StatsFinalWeek, reine Funktion ohne Persistenz (tools/derived_data_lib/week_finality.py)
  .ai-context/manual/player-week-fantasy.yaml: Kanonischer Shared-Derived-Vertrag fuer PlayerWeekFantasy mit scoring-spezifischer Identitaet, semantischem SettingsHash sowie Actual/Projection/PredictionRange-Semantik
  .ai-context/manual/derived-models.yaml: Kanonischer Vertrag fuer zentrale, ligaunabhaengige, versionierte Derivationsmodelle (salary-v1, salary-cap-v1, grading-v1) mit Registry, Unveraenderlichkeit nach erstem produktiven Einsatz, Modellwahl je Liga und Saison ueber data-meta und exakter Paritaet zum PowerShell-Verhalten (ADR-055, #919)
  .ai-context/manual/player-valuation.yaml: Shared-Derived-Vertrag fuer PlayerValuation (Salary, SalaryProjected, Ranking, Rank-Grading, Salary Cap) mit voller Historie je Liga, Saison und Woche unter data-derived/player-valuation, Snapshot-Identitaet, Identity-Hold und Invalidierung (ADR-055, #919)
  .ai-context/manual/league-standings.yaml: Shared-Derived-Vertrag fuer die Liga-Standings (Regular-Season-Tabelle mit Tiebreaks, Wochentabellen und Weekly Movement, Playoff-Platzierungen, Awards, All-Time) als Produkt league-standings mit einer Datei je Liga und Saison unter data-derived; zentrale Modelle standings-v1/awards-v1 mit Modellwahl je Saison in data-meta, Wochenbasis LeagueScoredWeek, Cutover elevated (ADR-072, #987)
  .ai-context/manual/league-lifecycle.yaml: Kanonischer Vertrag fuer den Liga-Lifecycle als zentrales Modell lifecycle-v1 mit reiner Funktion resolve(Liga, Saison, AtUtc); berechnet statt gespeichert (Muster week-finality), Uhrzeit als Eingabe, Eingaben nur aus data-source, league-drafts-Produkt und data-meta, kein neuer Writer (ADR-073, #1199)
  .ai-context/manual/decision-windows.yaml: Kanonischer Vertrag fuer die Decision Windows (Fenster, Sperren, Lineup-Pruefung, Fantasy Relevance, Verfuegbarkeit, Repairability, Scoring Path) als reine Funktion resolve(Liga, Saison, AtUtc); berechnet statt gespeichert, Modell repairability-v1 je Saison in data-meta, DecisionWindows.json bleibt App-Auslieferung (ADR-074 erweitert ADR-036, #1199 Abschnitt 2)
  .ai-context/manual/matchup-context.yaml: Kanonischer Vertrag fuer den Matchup-Kontext (Matchups-Saisonmodell, FantasyGameContext, MatchupProjections, Historie) als reine Funktion resolve(Liga, Saison, AtUtc); berechnet statt gespeichert, CompletionState als eigenes Konzept neben ADR-071, Modell team-range-v1 je Saison in data-meta, App-Dateien bleiben Auslieferung eines Consumer-Generators (ADR-075 erweitert ADR-036/074, #1199 Abschnitt 3)
  .ai-context/manual/weekly-recaps.yaml: Kanonischer Vertrag fuer die Weekly Recaps (KeyPlayers, KeyGames, TeamAwards-Projektion je finaler Liga-Woche) als reine Funktion resolve(Liga, Saison); berechnet statt gespeichert, Wochenbasis LeagueScoredWeek, feste Auswahlregeln ohne Modell-ID in v1, alle Ligen, WeeklyRecaps.json bleibt App-Auslieferung eines Consumer-Generators (ADR-063 erweitert, #1199 Abschnitt 4)
  .ai-context/manual/players-read-model.yaml: Kanonischer Vertrag fuer Players.json als berechnete Consumer-Auslieferung (ADR-076, #1226); reine Funktion resolve(Liga, Saison, AsOfDate), Alter mit Stichtag, Hold ohne Lesen der alten Datei, Saisonwerte/PointHistory/Form-Grundlage im Produkt player-valuation, zwei Punktepfade mit Waechter, kein neuer Writer
  .ai-context/manual/league-history.yaml: Shared-Derived-Vertrag fuer die Liga-Historie (LeagueTransactions, LeagueDrafts) mit voller Historie je Liga und Saison unter data-derived, ADR-026-Materialisierungsreihenfolge, Consumer-Generator fuer schlanke public/data-Auslieferung und explizitem Standings-Uebergangsinput bis #987 (ADR-057, #999)
  .ai-context/manual/historical-fantasy-scoring.yaml: ADR-033 und kanonischer Hardening-Vertrag für historische/What-if-Neuberechnung aus persistierten NFL-Fakten plus explizitem League-Scoringprofil; Missing historisch ist fail-closed, Provider-Fantasy-Punkte bleiben validation-only und nfl-reise ist die aktuelle CanonicalLeagueID
  .ai-context/manual/source-of-truth-matrix.yaml#consumerReadClassification: Pro Datei klassifizierte Provider- und public/data-Reads aller App-, Fantasy-Management- und Tooling-Consumer (#347 K1); tools/tests/test_consumer_read_classification.py schlaegt bei jedem nicht klassifizierten Read fehl
  .ai-context/manual/provider-join-invariants.yaml: Fail-closed Cardinality-/Uniqueness-Vertrag für Player-, Team-, Draft-, Transaction- und Historical-Provider-Joins
  .ai-context/manual/source-of-truth-matrix.yaml: Konsolidierte feldbezogene Primary-/Secondary-/Fallback-Entscheidung für NFL- und Fantasy-League-Quellen sowie heutige Runtime-vs.-kanonische Zielbesitzer
  public/requests/utils/ConfigUtils.psm1: Technische Pfade und Generierungs-Konfiguration; besitzt außerdem die PowerShell-Daten-Roots (Get-DataSourceRoot, Get-DataDerivedRoot, Get-DataMetaRoot, Config DataSourceDir/DataDerivedDir/DataMetaDir)
  tools/data_roots.py: Einzige Python-Definition der Daten-Roots (DATA_SOURCE_ROOT, DATA_DERIVED_ROOT, DATA_META_ROOT) nach Issue #788 Schritt 0; Produktivcode unter tools/ und public/requests/ schreibt die Root-Namen nicht aus, tools/tests/test_data_roots.py erzwingt das und hält Python und ConfigUtils synchron
  public/data/*.json: Generierte App-Daten
  public/data/PlayerWeekFantasy.json: App-Delivery-Adapter des Shared-Derived PlayerWeekFantasy-Snapshots; bewahrt CanonicalPlayerID und ergänzt nullable Sleeper PlayerID ohne Projection-/Scoring-Neuberechnung
  public/data/League.json: Generiertes League-Home-Read-Model für Lifecycle, Teams, Standings, League-Konfiguration und Season-Metadaten; Fantasy-Matchup-Schedule/Score/Result/Finality liegen ausschließlich im dedizierten Matchups-Read-Model
  public/data/Matchups.json: Generator-eigenes season-weites Fantasy-Matchup-Read-Model mit bekannten Paarungen, nullable effective Scores, FantasyMatchupID, open/final/unknown-Finality, finalen Ergebnissen, Week Stage/Kickoff und Summary-Helpern; historische Pendants liegen unter past_seasons/Matchups
  public/data/DecisionWindows.json: Generiertes providerneutrales App-Read-Model für exakte Kickoff-Decision-Windows, Player-Lock-Fakten und objektive TeamLineupEvaluations; Angular nutzt StartsAtUtc nur für aktuelle Countdown-/Rollover-Darstellung und leitet keine Schedule-, Roster- oder Lineup-Domainlogik neu ab
  public/data/PastSeasonsIndex.json: Generiertes Navigationsmanifest für historische Season-Dateien unter public/data/past_seasons, einschließlich Matchups und FantasyGameContext wenn vorhanden
  public/requests/RequestPastSeasonsIndex.ps1: Entry-Point zum Regenerieren von PastSeasonsIndex.json
  public/requests/utils/league/PastSeasonsIndexUtils.psm1: Utility zum Scannen konfigurierter Past-Season-Ressourcen, Schreiben stabiler data/... Web-Pfade und ContentHash-basierter Index-Metadaten
  tools/derived_data.py: Materializer fuer Shared-Derived-Produkte (materialize --product player-valuation); schreibt PlayerValuation je Liga, Saison und Woche nach data-derived, nur bei semantischer Aenderung; seit dem Cutover (Issue #919 Schritt 5) vom Players-Lauf ausgefuehrt und von update-players.yml veroeffentlicht, mit --hold-seed-players-file fuer Identity-Hold (ADR-055)
  tools/player_valuation_sources.py: Liest kanonische NFL-/League-Fakten (Population, Punkte, Byes, Scoring-Profil) fuer PlayerValuation; nutzt players_league_scoring und players_population
  tools/player_valuation_shadow.py: Read-only Shadow fuer PlayerValuation; materialisiert in ein Scratch-Verzeichnis und vergleicht den Snapshot der veroeffentlichten Woche exakt (ohne Toleranz) mit Players.json/League.json (Salary, SalaryProjected, Ranking, Rank-Grading, Inputs, SalaryCap*); fuer historische Snapshots nur Plausibilitaetsbericht (ADR-055, Issue #919 Schritt 4)
  tools/derived_data_lib/player_valuation.py: Reine Snapshot-Berechnung von PlayerValuation (Inputs, Salary, Ranking, Grading, Cap) mit den per Liga und Saison gewaehlten Modellen
  tools/league_standings_sources.py: Loader der league-standings-Eingaben aus data-source/leagues (league, members, rosters, brackets, matchups) mit Woche-final-Basis LeagueScoredWeek; Port von CanonicalStandingUtils.psm1, fail-closed (ADR-072, #987)
  tools/derived_data_lib/league_standings.py: Reine Assemblierung des Produkts league-standings je Liga und Saison aus den Modellen standings-v1 und awards-v1 (Tabelle, Wochentabellen, Playoffs, Awards, All-Time-Kette)
  tools/league_history_sources.py: Loader der LeagueTransactions-/LeagueDrafts-Eingaben aus data-source/leagues, data-meta und dem Manual-Overlay (Standings nur als uebergangsweiser Draft-Order-Input bis #987)
  tools/derived_data_lib/league_transactions.py: Reine Transaktionsstufen der Liga-Historie (Manual-Overlay, Pick-Identitaetsaufloesung, Pick-Ergebnis-Anreicherung) mit PowerShell-Paritaet (ADR-057, #999)
  tools/derived_data_lib/league_history.py: Pipeline der Liga-Historie in ADR-026-Reihenfolge ueber LeagueHistoryInputs (Transaktionsbasis, Pick-Identitaet, Drafts, Pick-Ergebnisse zurueck in die Transaktionen); build_history liefert beide Produkte
  tools/schedule_archive.py: Consumer-Generator der Schedule-Archive public/data/past_seasons/Schedule_<season>.json aus data-source/nfl (schedules, game-finality); wird woechentlich im update-transactions-Lauf geschrieben, nur bei semantischer Aenderung; compare-current beweist Paritaet mit Schedule.json (ADR-058, Issue #999 Schritt 7b)
  tools/league_history_app_publish.py: Consumer-Generator der Liga-Historie, rendert die App-Dateien Transactions.json, Drafts.json und past_seasons/Transactions|Drafts aus den Produkten (Display-Felder, Pick-LeagueID, Dateiformat) und vergleicht sie im Befehl compare exakt mit public/data (Schatten-Paritaet, Issue #999 Schritt 4)
  tools/derived_data_lib/league_drafts.py: Reine Draft-Stufe der Liga-Historie (aktuelle, offene und abgeschlossene Drafts, Linear/Snake-Reihenfolge, Trades, Pick-Ergebnisse, TradeHistory) mit PowerShell-Paritaet (ADR-057, #999)
  tools/players_game_history.py: Builder für Players.json GameHistory aus kanonischen NFL-Fakten (player-stats, snap-counts, qbr-week, player-game-long-gains, Schedule, Finality); läuft innerhalb des players_league_scoring.py-Exports, ADR-044
  tools/weekly_recaps_app_publish.py: Consumer-Generator der App-Dateien WeeklyRecaps.json und past_seasons WeeklyRecaps aus der berechneten Recap-Funktion (ADR-063, #1199 Abschnitt 4); schreibt nur bei semantischer Aenderung, League Live (aktuelle Saison) und woechentlicher update-transactions-Lauf (Historie)
  tools/matchup_context_app_publish.py: Consumer-Generator der App-Dateien Matchups.json, FantasyGameContext.json und past_seasons Matchups/FantasyGameContext aus der berechneten Matchup-Kontext-Funktion (ADR-075, #1199 Abschnitt 3); schreibt nur bei semantischer Aenderung, League Live vor RequestLeaguePublication
  tools/nfl-game-window.cjs: Scheduler-Modul fuer mode game-window; leitet NFL-Spielfenster aus dem kanonischen Schedule (Eastern-Kickoffs) und Game-Finality ab, waehlt dichten oder Idle-Cron und faellt bei unlesbarem Schedule auf den dichten Cron zurueck (Issue #946)
  deploy_action.ps1: Pages-Build-Script; schreibt .ai-workflow/build.log und deploy-script-result.json als transiente CI-Diagnose
  .ai-context/manual/ci-diagnostics.yaml: Manuelle Doku für transiente Build-/Deploy-Diagnoseausgaben
  src/app/core/interceptors/json-data-cache-busting.interceptor.ts: Fügt lokalen GET-Requests für JSON unter data/ den aktuellen Build-Commit als Queryparameter hinzu; data/past_seasons/** bleibt für langfristiges historisches Caching ausgenommen
  src/app/core/services/data-api.service.ts: HTTP-Lader für generierte JSON-Dateien; lädt League-Daten, Transactions.json für Moves, DecisionWindows.json, Matchups.json, FantasyGameContext.json sowie indexierte historische Matchups-/FantasyGameContext-Ressourcen
  src/app/core/services/data.service.ts: Öffentliche App-Datenfassade; reicht gemappte League-/Player-/Draft-/Transaction-Daten sowie die generator-owned DecisionWindows-, Matchups- und FantasyGameContext-Read-Models und deren semantische Updated-Timestamps an Consumer durch
  src/app/core/models/transaction.models.ts: Explizite Raw- und Frontend-Modelle für abgeschlossene Transaktionen, Teilnehmer, Spieler-Assets und Draft-Pick-Bewegungen; unresolved Sleeper-Picks dürfen bis zur eindeutigen Instanzauflösung null DraftType/DraftKey tragen
  src/app/core/mappers/transaction.mapper.ts: Reiner Mapper für Transactions.json; löst Teams und Spieler auf und ordnet Assets je Teilnehmer als acquired/sent zu
  src/app/features/**: Geroutete Angular-Feature-Seiten
  src/app/features/overview/overview.html: League-Home-Overview; Hero nutzt League Timeline, Matchups werden verfügbarkeitsgetrieben auch im späten Draft gezeigt, Current Standings bleiben auf In-Season/Playoffs begrenzt und All-Time bleibt separat erhalten
  src/app/features/standings/standings-page.ts: Geroutete Standings-Seite für Hall of Fame, All-Time Overview, Current Standings und Season Archive
  src/app/features/drafts/drafts-page.ts: Gerouteter Drafts-Seiten-Aggregator; Current entspricht League.Season, Future nur späteren Seasons und Past nur archivierten früheren Seasons
  src/app/features/drafts/components/**: Wiederverwendbare Draft-UI-Bausteine wie DraftShell, DraftPickCard, DraftPickTrigger und DraftPickPopover
  src/app/features/drafts/tabs/current-drafts/**: Wiederverwendete current-style Draft-Cards für Current und Past mit Overview, Teams und List; nutzen zentrale Draft-ViewModels und gemeinsame Draft-UI-Komponenten
  src/app/features/drafts/tabs/future-drafts/**: Future-Drafts-UI mit teambezogenen Pick-Zusammenfassungen, DraftShell-Header, gemeinsamem DraftPickTrigger und gemeinsamem DraftPickPopover
  src/app/shared/components/league-legacy-summary/league-legacy-summary.ts: Wiederverwendbare Hall-of-Fame-Kachelkomponente für Legacy-Highlights
  src/app/shared/components/league-timeline/league-timeline.ts: Wiederverwendbare Hero-Timeline; In-Season/Playoffs trennen recurring Operational Deadlines (Next Lineup Lock + Next Waiver Run) von unabhängigen Season Milestones (Trade Deadline/Playoffs Start/League Final), nutzen einen minute-aligned Frontend-Clock für StartsAtUtc-Rollover und isolieren DecisionWindows-Ladefehler; Pre-/Draft-/Off-Season behalten die Legacy-Milestone-Darstellung
  src/app/shared/components/decision-window-context-popover/decision-window-context-popover.ts: Responsive Commissioner-Popover für ein exaktes Decision Window; listet die generierten Games und alle aktuellen League-Teams per FantasyTeamID/TeamID, zeigt objektive Status-/Affected-Kontexte und Updated-Freshness und öffnet den bestehenden TeamDetailDialogService
  src/app/shared/components/league-matchups/league-matchups.ts: Wiederverwendbare Matchup-Darstellung; konsumiert Matchups.json, nutzt Summary.ActiveOrNextWeek und FantasyMatchupID für den Join zu FantasyGameContext, löst TeamIDs gegen gemappte League-Teams auf und bewahrt nullable Score-Semantik
  src/app/shared/components/all-time-overview/all-time-overview.ts: Wiederverwendbare All-Time-Übersicht mit Reitern für Overall und Regular Season
  src/app/shared/components/current-standings/current-standings.ts: Wiederverwendbare Current-Standings-Komponente für aktuelle Tabellenzeilen
  src/app/shared/components/season-archive/season-archive.ts: Wiederverwendbares Season Archive für Playoff-Ergebnisse, Awards und Regular-Season-Standings je Saison
  src/app/shared/components/season-results/season-results.ts: Wiederverwendbare Season-Results-Komponente für vorherige Saisonergebnisse, Podium und Restplatzierungen
