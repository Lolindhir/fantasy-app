schemaVersion: 1

project:
  name: fantasy-app
  repository: Lolindhir/fantasy-app
  frontend: Angular
  dataGeneration: PowerShell
  generatedDataPath: public/data
  purpose: >
    Static fantasy football web app that displays generated league data.
    PowerShell scripts generate app-readable JSON files that are consumed
    by the Angular frontend.

contextModel:
  principle: >
    Manual architecture and domain decisions are separated from automatically
    generated structure documentation and local file header documentation.

  manualContext:
    description: >
      Stable, human-maintained documentation describing architecture, domain
      meaning, source-of-truth decisions and AI guidance.
    directory: .ai-context/manual
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  fileHeaderDocs:
    description: >
      Human-maintained local documentation embedded in source file headers or
      sidecar .ai-doc.yaml files. Describes the role and boundaries of one file.
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  generatedContext:
    description: >
      Machine-generated snapshots of repository structure, extracted AI-DOC
      headers, module dependencies and JSON data contracts.
    directory: .ai-context/generated
    mayBeEditedByAI: false
    mayBeRegeneratedAutomatically: true

  todos:
    description: >
      Human-maintained, mutable project task list. Todos are intentionally kept
      outside .ai-context because they are operational tasks, not durable
      architecture or domain decisions.
    path: TODO.md
    language: de
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Store open project todos in TODO.md at the repository root.
      - Write todos in German.
      - Do not store mutable todo lists in .ai-context/manual.
      - Only move todo information into .ai-context/manual when it becomes a durable architecture, domain or source-of-truth decision.

readingOrder:
  - .ai-context/manual/ai-guidance.yaml
  - .ai-context/manual/architecture.yaml
  - .ai-context/manual/domain.yaml
  - .ai-context/manual/data-sources.yaml
  - .ai-context/manual/decisions.yaml
  - .ai-context/manual/routing.yaml
  - .ai-context/manual/file-header-docs.yaml
  - .ai-context/generated/file-docs.json
  - .ai-context/generated/generated-json-contracts.json

shortContext:
  public/data/Metadata.json: Liga-spezifische Inputs und Regeln
  public/requests/utils/ConfigUtils.psm1: Technische Pfade und Generierungs-Konfiguration
  public/data/*.json: Generierte App-Daten
  public/data/PastSeasonsIndex.json: Generiertes Navigationsmanifest für historische Season-Dateien unter public/data/past_seasons
  public/requests/RequestPastSeasonsIndex.ps1: Entry-Point zum Regenerieren von PastSeasonsIndex.json
  public/requests/utils/league/PastSeasonsIndexUtils.psm1: Utility zum Scannen konfigurierter Past-Season-Ressourcen, Schreiben stabiler data/... Web-Pfade und ContentHash-basierter Index-Metadaten
  src/app/core/services/data-api.service.ts: HTTP-Lader für generierte JSON-Dateien; lädt Past Drafts tolerant als einzelnes historisches Draft-Objekt oder Draft-Array und normalisiert alte absolute Index-Pfade
  src/app/features/**: Geroutete Angular-Feature-Seiten
  src/app/features/drafts/drafts-page.ts: Gerouteter Drafts-Seiten-Aggregator für aktuelle, zukünftige und historische Drafts; lädt Past Drafts über PastSeasonsIndex.json
  src/app/features/drafts/tabs/current-drafts/**: Wiederverwendete Draft-Cards mit kompaktem Draft-Board-Overview, Teams- und List-Sicht sowie Pick-Popovers für Current und Past Drafts
  src/app/features/drafts/tabs/future-drafts/**: Future-Drafts-UI mit teambezogenen Pick-Zusammenfassungen und Herkunfts-Popovers
  src/app/features/league-activity/league-activity.ts: Technische Moves-Seite für spätere Transaktionen und Roster Moves
  src/app/shared/**: Wiederverwendbare Angular-Bausteine
