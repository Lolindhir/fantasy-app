schemaVersion: 1

project:
  name: fantasy-app
  repository: Lolindhir/fantasy-app
  frontend: Angular
  dataGeneration: PowerShell
  generatedDataPath: public/data
  purpose: >
    Static fantasy football web app that displays generated league data.
    PowerShell scripts generate app-readable JSON files that are consumed
    by the Angular frontend.

contextModel:
  principle: >
    Manual architecture and domain decisions are separated from automatically
    generated structure documentation and local file header documentation.

  manualContext:
    description: >
      Stable, human-maintained documentation describing architecture, domain
      meaning, source-of-truth decisions and AI guidance.
    directory: .ai-context/manual
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  fileHeaderDocs:
    description: >
      Human-maintained local documentation embedded in source file headers or
      sidecar .ai-doc.yaml files. Describes the role and boundaries of one file.
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false

  generatedContext:
    description: >
      Machine-generated snapshots of repository structure, extracted AI-DOC
      headers, module dependencies and JSON data contracts.
    directory: .ai-context/generated
    mayBeEditedByAI: false
    mayBeRegeneratedAutomatically: true

  todos:
    description: >
      Human-maintained, mutable project task list. Todos are intentionally kept
      outside .ai-context because they are operational tasks, not durable
      architecture or domain decisions.
    path: TODO.md
    language: de
    mayBeEditedByAI: true
    mayBeRegeneratedAutomatically: false
    rules:
      - Store open project todos in TODO.md at the repository root.
      - Write todos in German.
      - Do not store mutable todo lists in .ai-context/manual.
      - Only move todo information into .ai-context/manual when it becomes a durable architecture, domain or source-of-truth decision.

readingOrder:
  - .ai-context/manual/architecture.yaml
  - .ai-context/manual/domain.yaml
  - .ai-context/manual/data-sources.yaml
  - .ai-context/manual/decisions.yaml
  - .ai-context/manual/file-header-docs.yaml
  - .ai-context/generated/file-docs.json
  - .ai-context/generated/generated-json-contracts.json

shortContext:
  public/data/Metadata.json: Liga-spezifische Inputs und Regeln
  public/requests/utils/ConfigUtils.psm1: Technische Pfade und Generierungs-Konfiguration
  public/data/*.json: Generierte App-Daten
  src/app/**: Angular-Darstellung
  TODO.md: Menschenlesbare offene Projektaufgaben auf Deutsch

sourceOfTruthPriority:
  - .ai-context/manual decisions
  - public/data/Metadata.json for league-specific rules
  - public/requests/utils/ConfigUtils.psm1 for technical generation configuration
  - public/data/*.json for current generated app data shape
  - src/app/** for frontend display behavior
  - TODO.md for mutable open project tasks

aiGuidance:
  rules:
    - Do not infer source-of-truth domain ownership from Angular components alone.
    - Do not put league-specific rules into ConfigUtils.psm1 when they belong in Metadata.json.
    - Do not treat generated JSON as manually editable source-of-truth data.
    - Do not edit files in .ai-context/generated manually.
    - When changing architecture, update .ai-context/manual/decisions.yaml.
    - When changing generated data contracts, regenerate generated context documentation.
    - Store open todos in TODO.md at the repository root and write them in German.
    - Do not create separate todo lists in .ai-context unless explicitly requested.
    - Use Get-Verb approved verbs for PowerShell function names.
    - When the user asks implementation questions, option comparisons, feasibility questions or follow-up questions about specific application, frontend, data generation, script or repository behavior, inspect the relevant current repository files and AI context before answering.
    - Ground application-specific recommendations in the current repository structure, source-of-truth rules and existing implementation. Avoid purely abstract guidance unless the user explicitly asks for general options.
    - For large, multi-file, move-heavy or refactor commits, use a deliberate large-change mode: summarize the intended change, identify affected files, choose the safest write strategy, and avoid uploading unnecessarily large full-file contents.
    - Prefer small focused commits over one large commit. Split large changes into logical commits when possible, especially when moving files, restructuring folders, or changing multiple layers.
    - For pure file moves or renames, prefer Git tree/blob/SHA-based operations when available instead of re-uploading full file contents. Preserve file content unchanged and verify that the resulting diff represents a move, not an unintended rewrite.
    - If a write operation is blocked or fails because of payload size, safety checks or tool limitations, do not retry the same large full-content update. Switch to a smaller patch, split commit, tree/blob/SHA-based strategy, or ask before falling back to manual instructions.
    - Before committing large or structural changes, present a concise commit plan with affected files, intended operations, validation approach and whether documentation or TODO.md may be affected.
    - After each commit, review whether manual AI context documentation or file-local documentation should be updated based on both the committed changes and the conversation that led to the commit.
    - After each commit, review TODO.md for completed, obsolete or newly discovered tasks based on both the committed changes and the conversation that led to the commit.
    - If documentation or TODO.md changes are needed after a commit, propose the concrete changes first and ask before applying them.
    - "After every commit, end the chat response with a visible post-commit check containing: Commit summary; changed-file scope; validation status; source-of-truth alignment; generated data impact; secrets or sensitive data check; follow-up items; Documentation: updated / proposal needed / no change needed; TODO.md: updated / proposal needed / no change needed."
    - In the post-commit check, state validation as run, not run, or not applicable. Consider Angular build/tests for frontend changes, PowerShell syntax and approved verbs for ps1/psm1 changes, and JSON/YAML validity for data or AI context changes.
    - If a commit was created without being previewed or explicitly approved in the chat beforehand, summarize that commit in the chat after it is created.
