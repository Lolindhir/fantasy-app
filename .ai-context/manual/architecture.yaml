schemaVersion: 1

architecture:
  summary: >
    fantasy-app is evolving toward a shared fantasy-football data platform with
    App and Fantasy Management as peer consumers. The current repository separates
    league/domain configuration, technical generation configuration, persistent
    provider-backed source data, generated app read models, Fantasy Management
    derivations and frontend rendering. ADR-037 adds the durable logical target:
    Source Evidence -> Canonical/Normalized Data -> Shared Derived Data ->
    Consumer Data/Insights. Existing physical paths remain transitional contracts
    until separately migrated.

layers:
  - name: manual-domain-config
    path: public/data/Metadata.json
    responsibility: >
      Contains league-specific inputs and rules used by the PowerShell generation
      pipeline.
    owns:
      - league-specific inputs
      - league-specific rules
      - owner id mapping
      - draft configuration
    doesNotOwn:
      - technical paths
      - runtime credentials
      - Angular rendering
      - generated app output

  - name: generation-config
    path: public/requests/utils/ConfigUtils.psm1
    responsibility: >
      Provides technical paths and generation configuration for the PowerShell
      data generation pipeline. Loads Metadata.json and exposes configuration to
      generator scripts.
    owns:
      - generated data file paths
      - backup paths
      - request/generation defaults
      - mapping Metadata.json into generator config
    doesNotOwn:
      - Angular rendering
      - generated JSON content as source of truth
      - UI state

  - name: persistent-source-data
    path: source-data/**
    responsibility: >
      Persists validated provider raw inputs under source-data/providers,
      provider-independent NFL facts under source-data/nfl and canonical
      fantasy-league facts under source-data/leagues. Phase 1B is productively
      accepted; this shared facts substrate is now available independently to the
      App generators and Fantasy Management without making either consumer depend
      on the other's derived read models.
    owns:
      - validated provider raw data and provenance
      - provider-independent CanonicalPlayerID identities and historical mappings; CanonicalPlayerID is application-defined by fantasy-app, not NFL-issued
      - stable CanonicalLeagueID and CanonicalLeagueSeasonID identities for fantasy-league lineage
      - canonical season-partitioned NFL facts such as Draft, Combine, schedules, rosters, stats and snaps
      - canonical fantasy-league facts such as league instances, members, rosters, transactions and fantasy drafts
      - dataset acquisition/lifecycle contracts and source-data audit output
    doesNotOwn:
      - manually authored league-specific rules that remain owned by Metadata
      - public/data app read-model contracts
      - Angular display behavior
      - Fantasy Management rankings, monitoring judgments, Knowledge, analyses or decisions
    lifecycleRule: >
      NFL acquisition and lifecycle semantics follow
      .ai-context/manual/nfl-source-data.yaml. League-source identity, multi-league,
      provider-lineage and accepted Phase-1B semantics follow
      .ai-context/manual/league-source-data.yaml. Provider/raw and canonical facts
      remain distinct from consumer-specific derived outputs.

  - name: generator-scripts
    path: public/requests/**
    responsibility: >
      Fetches, transforms and enriches source data into generated JSON files
      consumed by the Angular app. During the transition some generators still
      read providers directly. Phase 1B is accepted; Phase 2 is the next migration
      step and moves them to the stable canonical NFL and League source-data
      contracts while preserving existing public/data contracts unless separately
      approved.
    owns:
      - fetching external/source data not yet migrated into source-data
      - data transformation
      - data enrichment
      - writing generated JSON
      - current-season incremental update logic
      - force rebuild logic for generated scopes
    doesNotOwn:
      - frontend presentation state
      - manual architecture decisions
      - persistent provider raw provenance already owned by source-data

  - name: generated-app-data
    path: public/data/*.json
    responsibility: >
      Represents current app-readable read models consumed by Angular. During the
      current transition Fantasy Management also reads these files for current
      league state, but the target shared-facts architecture removes that
      cross-consumer dependency after Phase 2.
    owns:
      - current generated app data shape
      - generated league/team/player/draft/transaction/timestamp data
    doesNotOwn:
      - architectural decisions
      - manually authored source-of-truth documentation
      - persistent provider raw data
      - the shared canonical League facts layer

  - name: fantasy-management-derived-data
    path: fantasy-management/**
    responsibility: >
      Produces Fantasy Management source context, Operations datasets, monitoring,
      Knowledge, analyses and decisions. Today current league state is read from
      public/data; the Phase-2 target is to derive shared NFL/League base facts
      directly from source-data while keeping Fantasy-Management-specific
      interpretation in fantasy-management.
    owns:
      - Fantasy Management external source processing
      - Operations signal datasets
      - monitoring/watch state according to its own contracts
      - Knowledge, analyses and decisions
    doesNotOwn:
      - shared canonical NFL facts
      - shared canonical fantasy-league facts
      - App public/data read-model contracts

  - name: frontend
    path: src/app/**
    responsibility: >
      Displays generated JSON data and provides user interaction.
    owns:
      - rendering
      - UI state
      - frontend filtering
      - frontend sorting
      - frontend-only enrichment
      - component-level view models
    doesNotOwn:
      - source-of-truth league rules
      - PowerShell data generation pipeline
      - persisted generated JSON
      - AI/chat-client-specific convenience datasets

sourceDataTarget:
  phases:
    phase1A:
      name: NFL Source Layer
      status: completed-and-productively-accepted
      contract: .ai-context/manual/nfl-source-data.yaml
    phase1B:
      name: League Source Layer
      status: completed-and-productively-accepted
      contract: .ai-context/manual/league-source-data.yaml
    phase2:
      name: Consumer Migration
      status: next

  targetFlow: |
    nflverse / Sleeper NFL ------> source-data/providers/** ----> source-data/nfl/**
                                                                    |
    Sleeper league APIs --------> source-data/providers/** ----> source-data/leagues/**
                                                                    |
                                                       +------------+------------+
                                                       |                         |
                                                       v                         v
                                                App generators          Fantasy Management
                                                       |                 derivations/Operations
                                                       v
                                                public/data/**
                                                       |
                                                       v
                                                    Angular

  leagueIdentity:
    CanonicalLeagueID: >
      Stable fantasy-app-issued identity for the logical league across seasons and
      provider migrations. It is not a Sleeper league_id and must not be derived
      from a display name.
    CanonicalLeagueSeasonID: >
      Stable identity for one season instance inside a CanonicalLeagueID. Sleeper
      league_id maps to this seasonal instance as a provider identifier.
    sleeperPreviousLeagueID: >
      Sleeper previous_league_id is retained as provider lineage evidence linking
      seasonal Sleeper instances. It can support historical discovery but does not
      replace the canonical league identity and cannot silently override an
      existing conflicting canonical mapping.
    multiLeague: >
      The source-data model supports multiple independent CanonicalLeagueID values;
      no shared-source contract may assume exactly one fantasy league globally.


dataPlatformTarget:
  architectureDecision: ADR-037
  status: logical-target-current-paths-transitional

  principle: >
    Repository location does not define domain ownership. Data that can serve
    multiple consumers belongs conceptually to a shared layer even when its current
    implementation still lives under public/** or fantasy-management/**. Physical
    directory migration is intentionally deferred until a dedicated inventory and
    migration plan approves concrete target paths.

  logicalFlow: |
    external providers / publications / media
                    |
                    v
            Source Evidence
                    |
                    v
       Canonical / Normalized Data
                    |
                    v
          Shared Derived Data
             /              \
            v                v
      App read models    Fantasy Operations
            |                |
            v                v
          Angular      Insights / Decisions

  layers:
    sourceEvidence:
      responsibility: >
        Preserve validated provider, publication or content evidence with enough
        provenance to reproduce and audit downstream normalization.
      examples:
        - NFLverse and Sleeper raw inputs
        - FantasyPros/FantasyCalc/FFC/CBS/FFToday ranking or projection snapshots
        - podcast episode metadata and raw transcripts
      rules:
        - Evidence may be objective facts, market observations or subjective source statements.
        - Source, format/context, observation/publication time and provenance must remain attributable.
        - Persisting source evidence does not automatically authorize public redistribution.

    canonicalNormalized:
      responsibility: >
        Normalize identity, schema, units, temporal context and source semantics
        without erasing attribution or upgrading opinions into objective truth.
      examples:
        - provider-independent NFL and League facts
        - normalized FantasyCalc market-value observations keyed to CanonicalPlayerID
        - normalized FantasyPros ranking observations
        - podcast mentions/takes resolved to canonical entities
      rules:
        - "Canonical" for an attributed opinion means canonical representation of what the source said, not canonical correctness of the opinion.
        - Cross-provider entity joins follow the repository's fail-closed identity rules.

    sharedDerived:
      responsibility: >
        Materialize deterministic, reproducible and consumer-neutral results from
        known shared inputs plus explicit/versioned domain rules.
      categories:
        leagueRules:
          examples:
            - Salary/Salary Cap policy
            - Award definitions
            - Draft rules
          rule: >
            Parameters/policies should be explicit and versionable; algorithms
            remain tested implementation code rather than formula strings hidden in config.
        derivedMetrics:
          examples:
            - Salary
            - SalaryProjected
            - Salary Cap
            - ImprovementScore
            - player Grade
            - aggregated Dynasty rank
            - aggregated Trade Value
            - cross-source expert/media sentiment
        productSemantics:
          examples:
            - League lifecycle state
            - Decision Windows
            - Lineup Repairability
          rule: >
            Shared only when semantics are consumer-neutral and reproducible from
            the same facts/rules.
      doesNotOwn:
        - Mighty-Giants-specific roster fit or recommendation
        - final trade/cut/add decisions
        - free-form analysis whose answer depends on a consumer strategy

    consumerDataInsights:
      responsibility: >
        Adapt shared facts/derivations into consumer delivery contracts and add
        consumer-specific interpretation.
      app:
        currentDeliveryPath: public/data/**
        role: Angular-facing read models and app-specific delivery shape
      fantasyOperations:
        currentPath: fantasy-management/generated/operations/**
        role: operations-specific inputs/signals that prepare Fantasy Management decisions
      fantasyManagement:
        currentPath: fantasy-management/**
        role: strategy, roster fit, analysis, Knowledge and final decisions
      rule: >
        Consumer outputs may combine shared data but must not become the upstream
        owner of a datum needed by another consumer.

  pipelineResponsibilities:
    orderedVerbs:
      - acquire
      - normalize/materialize
      - derive
      - publish
    orchestration: >
      Scheduler cadence, event triggers, freshness checks and dependency invalidation
      are technical pipeline concerns. They must remain separate from Domain Rules.
      Future orchestration may model a dependency DAG so a source change runs only
      the derivations and publishers it can affect.

  migrationGuardrails:
    - Do not move league-owned calculations such as Salary or Grading into source-data/nfl merely because their input facts are migrated there.
    - Do not leave reusable market/media source acquisition permanently under fantasy-management merely because Fantasy Management was the first consumer.
    - Raw podcast transcripts and normalized/extracted takes are different data products with separate provenance and publication policy.
    - Keep provider rankings/values attributed; only an explicit derived aggregation may produce an application-owned consensus metric.
    - Before the Players portion of #347, decompose RequestPlayers responsibilities by logical layer instead of treating the script as one canonical consumer.
    - public/data remains an App delivery contract, not the long-term shared domain-data store.
    - Exact future top-level directory names and physical migration sequencing require a separate approved design step.


frontendStructure:
  current:
    - path: src/app/features/**
      responsibility: >
        Contains routed Angular feature areas and larger domain-facing pages.
      examples:
        - src/app/features/overview/overview.ts
        - src/app/features/standings/standings-page.ts
        - src/app/features/teams/team-list/team-list.ts
        - src/app/features/players/players-page.ts
        - src/app/features/drafts/drafts-page.ts
        - src/app/features/league-activity/league-activity.ts
        - src/app/features/trade/trade-simulator/trade-simulator.ts
        - src/app/features/handbook/about.ts

    - path: src/app/core/services/data-api.service.ts
      responsibility: >
        Low-level HTTP loader for generated JSON files. It loads the common league
        data bundle, Transactions.json for the Moves feature and historical resources.
        For Past Drafts it reads PastSeasonsIndex.json, normalizes legacy absolute
        index paths into app-relative data/... URLs and accepts historical Drafts
        resources stored either as one RawDraft object or as an array of RawDrafts.

    - path: src/app/core/services/data.service.ts
      responsibility: >
        Public app-data facade and orchestrator. It maps the common league/player
        bundle once per request path, exposes resolved League, Player, Team and Draft
        data, and returns mapped current-season Transaction objects for Moves without
        exposing raw transaction JSON to feature components.

    - path: src/app/core/models/transaction.models.ts
      responsibility: >
        Defines the generated RawTransaction contract and the resolved frontend
        Transaction model, including participant-specific added/dropped players and
        acquired/sent draft picks.

    - path: src/app/core/mappers/transaction.mapper.ts
      responsibility: >
        Pure RawTransaction-to-Transaction mapper. It resolves player and fantasy-team
        references, keeps unresolved assets through ID fallbacks and assigns each
        draft-pick movement from PreviousOwnerRosterID to NewOwnerRosterID while
        retaining OriginalOwnerRosterID as the stable pick identity.

    - path: src/app/features/standings/standings-page.ts
      responsibility: >
        Routed Standings page for Hall of Fame / League Legacy, all-time overall
        and regular-season standings, current standings and season archive. It
        loads league/team data through DataService, builds frontend standing and
        legacy view models with league-standings-view.util.ts and delegates
        rendering to shared components.

    - path: src/app/features/drafts/drafts-page.ts
      responsibility: >
        Routed Drafts page aggregator for current-season, future and past draft
        presentation. It consumes current/future draft data from Drafts.json and
        discovers historical draft seasons through PastSeasonsIndex.json before
        loading the selected season's historical Drafts resource. It maps all
        loaded draft lists through DraftsViewModelService and delegates rendering
        to reusable current/past and future Draft tab components.

    - path: src/app/features/drafts/components/**
      responsibility: >
        Contains Drafts feature UI building blocks shared by current, past and
        future draft views. DraftShellComponent owns the common draft card header
        and metric line, DraftPickCardComponent owns the compact Overview pick tile,
        and DraftPickTriggerComponent is the Drafts-facing adapter that maps Drafts
        feature ViewModels into the app-wide shared draft-pick context trigger.
        Generic compact token interaction and pick-detail popover content live under
        src/app/shared/components/draft-pick-context/** so Team Detail and Drafts use
        one implementation without a shared-to-feature dependency.

    - path: src/app/features/drafts/tabs/current-drafts/**
      responsibility: >
        Reusable current-style draft-card presentation used for current-season and
        past completed drafts. Each draft card owns its active view mode and can
        render Overview, Teams or List. Overview renders a compact draft-board grid
        where rows are rounds and columns are positions in the round. Teams uses
        current-owner pick groups from the central DraftViewModel. List renders
        orderedPicks from the central DraftViewModel with compact mobile and more
        detailed desktop layout. Pick tiles/chips open the app-wide shared draft-pick
        context popover for open/picked state, owner, original-owner, selected-player
        and trade context. CurrentDraftPickChipComponent remains a wrapper around the
        Drafts adapter DraftPickTriggerComponent for current/past pick-chip use cases.

    - path: src/app/features/drafts/tabs/future-drafts/**
      responsibility: >
        Future draft presentation. It uses DraftShellComponent for the shared
        draft card header and metric line, renders team-owned round summaries,
        marks traded/non-own picks with a dot through the Drafts adapter
        DraftPickTriggerComponent and opens the app-wide shared draft-pick context
        popover in a future-compatible mode for pick ownership context.

    - path: src/app/features/league-activity/league-activity.ts
      responsibility: >
        Routed Moves page implementation for /moves. The technical component name
        remains LeagueActivityComponent for compatibility. It consumes mapped
        current-season Transaction objects from DataService and renders a chronological
        timeline with summary metrics, participant teams, player movement and traded
        picks. Pick chips include the original-team abbreviation because multiple
        picks from the same season, draft type and round can move in opposite directions
        within one trade.

    - path: src/app/features/league-activity/moves-view-model.util.ts
      responsibility: >
        Frontend-only Moves view-model and display utility. It groups transactions by
        date, derives summary counts, formats transaction labels and creates stable,
        original-owner-aware draft-pick labels and Angular track keys.

    - path: src/app/features/trade/trade-simulator/trade-simulator.ts
      responsibility: >
        Routed Trade Simulator page. It remains independent under /trade until it
        is intentionally integrated into Moves.

    - path: src/app/shared/components/**
      responsibility: >
        Contains reusable Angular UI components that are not owned by one routed
        feature page. DraftPickPillComponent owns the generic draft-pick token shape;
        DraftPickContextTriggerComponent and DraftPickContextPopoverComponent own the
        app-wide clickable draft-pick context interaction used by Drafts and Team
        Detail without depending on Drafts feature ViewModels. LeagueLegacySummaryComponent
        renders Hall-of-Fame highlight cards; CurrentStandingsComponent renders current
        standing rows; AllTimeStandingsComponent renders all-time overall placement
        rows; AllTimeRegularSeasonStandingsComponent wraps the shared compact
        RegularSeasonStandingsListComponent for all-time regular-season rows;
        SeasonArchiveComponent renders season-level playoff results, awards and
        regular-season standings and reuses the same regular-season list;
        SeasonResultsComponent remains available for previous-season podium
        rendering in Overview.
      examples:
        - src/app/shared/components/draft-pick-pill/draft-pick-pill.ts
        - src/app/shared/components/draft-pick-context/draft-pick-context-trigger.ts
        - src/app/shared/components/draft-pick-context/draft-pick-context-popover.ts
        - src/app/shared/components/team-detail-dialog/team-detail-dialog.ts
        - src/app/shared/components/player-list/player-list.ts
        - src/app/shared/components/player-detail-dialog/player-detail-dialog.ts
        - src/app/shared/components/league-legacy-summary/league-legacy-summary.ts
        - src/app/shared/components/current-standings/current-standings.ts
        - src/app/shared/components/all-time-standings/all-time-standings.ts
        - src/app/shared/components/all-time-regular-season-standings/all-time-regular-season-standings.ts
        - src/app/shared/components/regular-season-standings-list/regular-season-standings-list.ts
        - src/app/shared/components/season-archive/season-archive.ts
        - src/app/shared/components/season-results/season-results.ts

    - path: src/app/shared/**
      responsibility: >
        Contains reusable frontend helpers, Material imports, shared components,
        pipes and utility candidates.

    - path: src/app/shared/utils/league-standings-view.util.ts
      responsibility: >
        Reusable frontend ViewModel utility for league standing presentation. It
        builds current standing rows, previous-season result podium/rows, previous
        champion, current-season awards, all-time overall rows, all-time regular
        season rows, frontend Hall-of-Fame/legacy highlights, award legend items
        and season history rows. It owns only presentation mapping and must not
        become the source of truth for generated league standings.

    - path: src/app/shared/utils/draft-ui.util.ts
      responsibility: >
        Reusable frontend utility for draft-specific presentation helpers such as
        round-based chip colors and normalized draft status classes. It owns only
        UI display mapping and must not derive draft order or ownership.

    - path: src/app/shared/utils/player-sort.util.ts
      responsibility: >
        Reusable frontend utility for deterministic Player sorting by selected
        player fields and stable ID fallback.

    - path: src/app/shared/utils/trade-calculator.util.ts
      responsibility: >
        Reusable frontend utility for roster salary calculations and trade roster
        projection. DataService keeps thin compatibility delegates while consumer
        imports are still being consolidated.

frontendTargets:
  teamsFranchiseHub:
    status: implemented
    responsibility: >
      Replace the routed Teams overview with a compact Salary-centered franchise
      overview while keeping team details available as an app-wide interaction
      rather than a private child of the /teams route.
    principles:
      - /teams owns the team-card overview, not the lifecycle of team detail data.
      - Team detail must be openable from any feature that has a stable team reference, including Teams, Standings, Drafts, Moves, Overview, Player Detail and the future Salary & Trade Simulator.
      - The team detail dialog should be opened through one shared app-level interaction/service instead of feature-local MatDialog wiring duplicated across callers.
      - Team detail uses the existing resolved FantasyTeam model and app data facade; callers should pass a stable team identity or resolved team, not rebuild team data locally.
      - Existing PlayerListComponent, PlayerDetailDialogComponent, PositionStylePipe, standings/history presentation helpers and Material interaction patterns are reused before new UI is introduced.
      - Draft pick presentation must not be duplicated for Teams. If the existing Drafts feature components cannot be reused without an improper cross-feature dependency, extract only the genuinely generic pick trigger/popover primitive to shared and let Drafts and Teams consume the same implementation.
      - Shared salary calculations and presentation view models are established before Teams and the later simulator grow separate Current/Projected, cap-usage, position-allocation or salary-movement logic.
      - New salary UI primitives such as Salary Health, Cap Usage and Salary-by-Position should accept presentation inputs rather than depend directly on one routed feature so the future simulator can reuse them.
      - The new Teams experience represents current state only; hypothetical cuts, exclusions and trades remain outside team detail.
      - The current salary-centric Teams implementation stays temporarily reachable as a legacy fallback until the future Salary & Trade Simulator covers the existing exclude/cut scenario functionality.
    implementationOrder:
      - shared salary and roster presentation foundation
      - new /teams card overview
      - app-wide team detail dialog and shared opener
      - team detail Overview, Roster, Salary, Drafts and History tabs
      - responsive and cross-feature integration validation
      - Salary & Trade Simulator expansion using the same shared salary primitives
      - remove the legacy Teams salary view only after functional parity for exclude/cut scenarios
