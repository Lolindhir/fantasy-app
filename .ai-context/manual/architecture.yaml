schemaVersion: 1

architecture:
  summary: >
    fantasy-app separates league/domain configuration, technical generation
    configuration, generated app data and frontend rendering.

layers:
  - name: manual-domain-config
    path: public/data/Metadata.json
    responsibility: >
      Contains league-specific inputs and rules used by the PowerShell generation
      pipeline.
    owns:
      - league-specific inputs
      - league-specific rules
      - owner id mapping
      - draft configuration
    doesNotOwn:
      - technical paths
      - runtime credentials
      - Angular rendering
      - generated app output

  - name: generation-config
    path: public/requests/utils/ConfigUtils.psm1
    responsibility: >
      Provides technical paths and generation configuration for the PowerShell
      data generation pipeline. Loads Metadata.json and exposes configuration to
      generator scripts.
    owns:
      - generated data file paths
      - backup paths
      - request/generation defaults
      - mapping Metadata.json into generator config
    doesNotOwn:
      - Angular rendering
      - generated JSON content as source of truth
      - UI state

  - name: generator-scripts
    path: public/requests/**
    responsibility: >
      Fetches, transforms and enriches source data into generated JSON files
      consumed by the Angular app and AI/chat helper workflows.
    owns:
      - fetching external/source data
      - data transformation
      - data enrichment
      - writing generated JSON
      - current-season incremental update logic
      - force rebuild logic for generated scopes
      - chunked helper exports derived from generated data
    doesNotOwn:
      - frontend presentation state
      - manual architecture decisions

  - name: generated-app-data
    path: public/data/*.json
    responsibility: >
      Represents current app-readable read models consumed by Angular and
      generated helper outputs derived from those read models.
    owns:
      - current generated app data shape
      - generated league/team/player/draft/transaction/timestamp data
      - relevant player subset output
      - generated AI/chat helper chunk output
    doesNotOwn:
      - architectural decisions
      - manually authored source-of-truth documentation

  - name: frontend
    path: src/app/**
    responsibility: >
      Displays generated JSON data and provides user interaction.
    owns:
      - rendering
      - UI state
      - frontend filtering
      - frontend sorting
      - frontend-only enrichment
      - component-level view models
    doesNotOwn:
      - source-of-truth league rules
      - PowerShell data generation pipeline
      - persisted generated JSON

frontendStructure:
  current:
    - path: src/app/features/**
      responsibility: >
        Contains routed Angular feature areas and larger domain-facing pages.
      examples:
        - src/app/features/overview/overview.ts
        - src/app/features/teams/team-list/team-list.ts
        - src/app/features/players/players-page.ts
        - src/app/features/drafts/drafts-page.ts
        - src/app/features/league-activity/league-activity.ts
        - src/app/features/trade/trade-simulator/trade-simulator.ts
        - src/app/features/handbook/about.ts

    - path: src/app/features/drafts/drafts-page.ts
      responsibility: >
        Routed Drafts page aggregator for current-season, future and past draft
        presentation. It consumes current/future draft data from Drafts.json and
        discovers historical draft seasons through PastSeasonsIndex.json before
        loading the selected season's historical Drafts resource. It maps all
        loaded draft lists through the Drafts view-model mapper and delegates
        current/past rendering to reusable Current Drafts card views while Future
        Drafts keeps its compact team-owned summary view.

    - path: src/app/features/drafts/tabs/current-drafts/**
      responsibility: >
        Reusable current-style draft-card presentation used for current-season and
        past completed drafts. Each draft card owns its active view mode and can
        render Overview, Teams or List. Overview renders a compact draft-board grid
        where rows are rounds and columns are positions in the round. Teams groups
        concrete picks by current owner. List renders picks in draft order with
        compact mobile and more detailed desktop layout. Pick tiles/chips open
        compact popovers for both open and picked selections.

    - path: src/app/features/drafts/tabs/future-drafts/**
      responsibility: >
        Future draft presentation. It renders team-owned round summaries, marks
        traded/non-own picks with a dot and opens compact origin popovers for
        pick ownership context.

    - path: src/app/features/league-activity/league-activity.ts
      responsibility: >
        Routed Moves page implementation for /moves. The technical component name
        is intentionally still LeagueActivityComponent for now. It is a placeholder
        until Transactions.json is modeled and loaded in the frontend.

    - path: src/app/features/trade/trade-simulator/trade-simulator.ts
      responsibility: >
        Routed Trade Simulator page. It remains independent under /trade until it
        is intentionally integrated into Moves.

    - path: src/app/shared/components/**
      responsibility: >
        Contains reusable Angular UI components that are not owned by one routed
        feature page.
      examples:
        - src/app/shared/components/player-list/player-list.ts
        - src/app/shared/components/player-detail-dialog/player-detail-dialog.ts

    - path: src/app/shared/**
      responsibility: >
        Contains reusable frontend helpers, Material imports, shared components,
        pipes and utility candidates.

    - path: src/app/shared/utils/player-sort.util.ts
      responsibility: >
        Reusable frontend utility for deterministic Player sorting by selected
        player fields and stable ID fallback.

    - path: src/app/shared/utils/trade-calculator.util.ts
      responsibility: >
        Reusable frontend utility for roster salary calculations and trade roster
        projection. DataService keeps thin compatibility delegates while consumer
        code can move to the utility directly.

    - path: src/app/core/**
      responsibility: >
        Target area for app-wide Angular models, services and mapper code. This
        area is being populated in staged slices while DataService is split.

    - path: src/app/core/models/fantasy.models.ts
      responsibility: >
        Central Angular model import surface. Draft, league/team and player model
        exports come from dedicated files under src/app/core/models. Feature and
        shared Angular consumers should import type dependencies from this barrel.

    - path: src/app/core/services/data-api.service.ts
      responsibility: >
        App-wide Angular HTTP facade for generated JSON files and timestamps. It
        owns HttpClient access to public/data read-model files, PastSeasonsIndex.json
        and selected historical Drafts resources, and returns typed raw data to
        DataService.

    - path: src/app/core/services/data.service.ts
      responsibility: >
        Current app-wide Angular data facade. It imports model declarations from
        src/app/core/models, loads generated JSON through DataApiService, delegates
        mapping to core mappers, delegates FreeAgentMarket enrichment to
        FreeAgentMarketService, uses shared utilities for Player sorting and
        salary/trade calculations, and mainly remains as app-facing
        facade/orchestrator.

routing:
  primaryRoutes:
    - path: /
      component: src/app/features/overview/overview.ts
    - path: /teams
      component: src/app/features/teams/team-list/team-list.ts
    - path: /players
      component: src/app/features/players/players-page.ts
    - path: /drafts
      component: src/app/features/drafts/drafts-page.ts
    - path: /moves
      component: src/app/features/league-activity/league-activity.ts
    - path: /trade
      component: src/app/features/trade/trade-simulator/trade-simulator.ts
    - path: /handbook
      component: src/app/features/handbook/about.ts
  compatibilityRedirects:
    - from: /league-activity
      to: /moves
      reason: Preserve old links after splitting the previous combined League Activity feature.

dataFlow:
  - from: public/data/Metadata.json
    to: public/requests/utils/ConfigUtils.psm1
    purpose: Load league-specific inputs and rules.

  - from: public/requests/utils/ConfigUtils.psm1
    to: public/requests/RequestLeague.ps1
    purpose: Resolve generated data paths, including relevant player and chat export paths.

  - from: public/requests/RequestLeague.ps1
    to: public/data/Transactions.json
    purpose: >
      Update current-season completed transactions before draft generation so
      draft-pick ownership can be derived from transaction history.

  - from: public/requests/RequestLeague.ps1
    to: public/data/Drafts.json
    purpose: >
      Generate the restricted current/upcoming/live draft read model for the
      frequent league update. This path must stay lightweight and must not refresh
      completed draft history.

  - from: public/data/Drafts.json
    to: public/requests/RequestLeague.ps1
    purpose: >
      Enrich generated League.json team objects with sorted current/upcoming/live
      draft pick keys owned by each team.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/Drafts.json
    purpose: Run the weekly/manual full draft update for current/upcoming/live drafts.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: >
      Run the weekly/manual completed draft history refresh. Historical draft
      files must not be used to enrich League.json team DraftPicks.

  - from: public/data/League.json, public/data/Players.json, public/data/Teams.json, public/data/Drafts.json, public/data/PastSeasonsIndex.json
    to: src/app/core/services/data-api.service.ts
    purpose: Load generated raw JSON read models and the historical-season navigation manifest through Angular HttpClient.

  - from: public/data/past_seasons/Drafts/Drafts_<season>.json
    to: src/app/core/services/data-api.service.ts
    purpose: Load the selected historical Drafts resource when the Past Drafts tab selects a season from PastSeasonsIndex.json.

  - from: src/app/core/services/data-api.service.ts
    to: src/app/core/services/data.service.ts
    purpose: Provide typed raw League, Player, NFL team, current/future Draft, PastSeasonsIndex and selected historical Draft data to the app data facade.

  - from: public/data/Drafts.json
    to: src/app/core/mappers/league.mapper.ts
    purpose: Resolve generated DraftPick keys into draft-pick-enriched FantasyTeam structures.

  - from: src/app/core/services/data.service.ts
    to: src/app/features/drafts/drafts-page.ts
    purpose: >
      Provide DraftsPageComponent with generated current/upcoming/live draft data,
      PastSeasonsIndex.json, selected historical draft data, player data and
      fantasy teams for Current/Future/Past draft tabs, round groups, pick ordering,
      selected-player display and current/original owner display.

  - from: public/data/Transactions.json
    to: src/app/features/league-activity/league-activity.ts
    status: planned
    purpose: >
      Future Moves timeline input after Transactions.json is intentionally modeled
      in DataApiService/DataService and frontend transaction interfaces.

buildMetadata:
  purpose: >
    The app shell exposes a compact build indicator so users can identify the
    actually loaded frontend bundle and diagnose whether the published server
    bundle is newer than the currently loaded app.
  producer:
    path: deploy_action.ps1
    writes:
      - src/app/core/build-info.generated.ts
      - public/build-info.json
  frontendConsumer:
    path: src/app/app.ts
  display:
    paths:
      - src/app/app.html
      - src/app/app.scss
  sourceOfTruth: >
    Build metadata is deploy/frontend metadata only. It is not generated league
    data and does not affect public/data app data contracts.

generatedPlayerExports:
  relevantPlayers:
    path: public/data/Players_Relevant.json
    producer: public/requests/RequestLeague.ps1
    helper: public/requests/utils/player/PlayerUtils.psm1
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantFile
    behavior: >
      The frequent league generation flow derives a relevant player subset from
      Players.json. Relevant players include fantasy-rostered players, young
      prospects, players with meaningful historical production and players with a
      high salary signal.
  chatChunks:
    path: public/data/chat/players-relevant
    producer: public/requests/utils/player/PlayerChatExportUtils.psm1
    entryPoint: public/requests/RequestLeague.ps1
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantChatDir
    behavior: >
      The chat export keeps full relevant player objects, splits them into stable
      10-player chunk files and writes index.json with lookup metadata. It is
      generated helper output for AI/chat workflows, not a separate manual source
      of truth.

knownFrontendDomainLogic:
  - path: src/app/core/services/free-agent-market.service.ts
    topic: FreeAgentMarketInfo / RuleBasedAutoCut
    note: >
      Currently computed in Angular as frontend enrichment. If it becomes
      source-of-truth data, move it into PowerShell generation and generated JSON.

  - path: src/app/features/overview/overview.ts
    topic: Draft round chip colors
    note: >
      Overview creates a local draft-pick chip view model and computes subtle
      warm-to-cold HSL round colors from the maximum visible current-season draft
      round. This is display logic and should move into a shared frontend utility,
      pipe or service because draft picks are now shown in more than one component.

  - path: src/app/features/drafts/**
    topic: Draft pick display, round chip colors and current/past draft view grouping
    note: >
      The Drafts feature builds component-level view models from DataService
      draft/team/player data, groups picks for current, future and past draft views,
      displays current owner plus original owner/trade context and duplicates the
      HSL round color calculation used by Overview. Current and Past Drafts Overview
      render compact square-tile draft boards from draftVm.rounds; Teams/List still
      derive grouping from draftVm.rounds and should later move into the central
      Drafts view model.

  - path: src/app/features/league-activity/league-activity.ts
    topic: Moves placeholder
    note: >
      LeagueActivityComponent is currently the routed Moves page implementation.
      It intentionally remains a placeholder until Transactions.json is modeled
      and loaded in the frontend.
