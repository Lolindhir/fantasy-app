schemaVersion: 1

architecture:
  summary: >
    fantasy-app separates league/domain configuration, technical generation
    configuration, generated app data and frontend rendering.

layers:
  - name: manual-domain-config
    path: public/data/Metadata.json
    responsibility: >
      Contains league-specific inputs and rules used by the PowerShell
      generation pipeline.
    owns:
      - league-specific inputs
      - league-specific rules
      - owner id mapping
      - draft configuration
    doesNotOwn:
      - technical paths
      - API keys
      - Angular rendering
      - generated app output

  - name: generation-config
    path: public/requests/utils/ConfigUtils.psm1
    responsibility: >
      Provides technical paths and generation configuration for the PowerShell
      data generation pipeline. Loads Metadata.json and exposes configuration
      to generator scripts.
    owns:
      - generated data file paths
      - backup paths
      - request/generation defaults
      - mapping Metadata.json into generator config
    doesNotOwn:
      - Angular rendering
      - generated JSON content as source of truth
      - UI state

  - name: generator-scripts
    path: public/requests/**
    responsibility: >
      Fetches, transforms and enriches source data into generated JSON files
      consumed by the Angular app and AI/chat helper workflows.
    owns:
      - fetching external/source data
      - data transformation
      - data enrichment
      - writing generated JSON
      - current-season incremental update logic
      - force rebuild logic for generated scopes
      - chunked helper exports derived from generated data
    doesNotOwn:
      - frontend presentation state
      - manual architecture decisions

  - name: generated-app-data
    path: public/data/*.json
    responsibility: >
      Represents current app-readable read models consumed by Angular and
      generated helper outputs derived from those read models.
    owns:
      - current generated app data shape
      - generated league/team/player/draft/transaction/timestamp data
      - relevant player subset output
      - generated AI/chat helper chunk output
    doesNotOwn:
      - architectural decisions
      - manually authored source-of-truth documentation

  - name: frontend
    path: src/app/**
    responsibility: >
      Displays generated JSON data and provides user interaction.
    owns:
      - rendering
      - UI state
      - frontend filtering
      - frontend sorting
      - frontend-only enrichment
      - component-level view models
    doesNotOwn:
      - source-of-truth league rules
      - PowerShell data generation pipeline
      - persisted generated JSON

frontendStructure:
  current:
    - path: src/app/features/**
      responsibility: >
        Contains routed Angular feature areas and larger domain-facing pages.
      examples:
        - src/app/features/overview/overview.ts
        - src/app/features/teams/team-list/team-list.ts
        - src/app/features/players/players-page/players-page.ts
        - src/app/features/trade/trade-simulator/trade-simulator.ts
        - src/app/features/league-activity/league-activity.ts
        - src/app/features/handbook/about.ts

    - path: src/app/shared/components/**
      responsibility: >
        Contains reusable Angular UI components that are not owned by one routed
        feature page.
      examples:
        - src/app/shared/components/player-list/player-list.ts
        - src/app/shared/components/player-detail-dialog/player-detail-dialog.ts

    - path: src/app/shared/**
      responsibility: >
        Contains reusable frontend helpers, Material imports, shared components,
        pipes and utility candidates.

    - path: src/app/core/**
      responsibility: >
        Target area for app-wide Angular models, services and mapper code. This
        area is being populated in staged slices while DataService is split.

    - path: src/app/core/models/draft.models.ts
      responsibility: >
        Contains extracted Angular draft model declarations for RawDraft,
        DraftSettings, DraftPickTradeHistoryEntry and DraftPick. These mirror the
        generated Drafts.json read model used by DataService and draft features.

    - path: src/app/core/models/league.models.ts
      responsibility: >
        Contains extracted Angular league, standing, placement, award and
        FantasyTeam model declarations. These mirror the generated League.json
        read model and team-enriched frontend shape. DataService imports these
        declarations directly.

    - path: src/app/core/models/player.models.ts
      responsibility: >
        Contains extracted Angular player, NFL team, player stats, game history
        and FreeAgentMarket model declarations. These mirror the generated
        Players.json read model plus frontend-enriched Player shape. DataService
        imports these declarations directly.

    - path: src/app/core/models/fantasy.models.ts
      responsibility: >
        Central Angular model import surface. Draft, league/team and player model
        exports come from dedicated files under src/app/core/models. Feature and
        shared Angular consumers should import type dependencies from this barrel.

    - path: src/app/services/data-service.ts
      responsibility: >
        Current app-wide Angular data facade. It imports model declarations from
        src/app/core/models and still contains HTTP loading, mapping/enrichment and
        helper logic. Mapper and service responsibilities are the next major
        frontend refactor candidates.

  removedCompatibilityReExports:
    note: >
      The old routed component paths were temporarily retained as compatibility
      re-exports after the feature-structure move. After repository search showed
      no productive imports or path references to those old wrappers, the wrapper
      files were removed. New code must import routed pages from src/app/features/**.
    removedFiles:
      - src/app/overview/overview.ts
      - src/app/team-list/team-list.ts
      - src/app/players-page/players-page.ts
      - src/app/trade-simulator/trade-simulator.ts
      - src/app/league-activity/league-activity.ts
      - src/app/about/about.ts

buildMetadata:
  purpose: >
    The app shell exposes a compact build indicator so users can identify the
    actually loaded frontend bundle and diagnose whether the published server
    bundle is newer than the currently loaded app.
  producer:
    path: deploy_action.ps1
    writes:
      - src/app/core/build-info.generated.ts
      - public/build-info.json
    behavior: >
      Before the Angular production build runs, deploy_action.ps1 writes the same
      UTC build timestamp into the embedded Angular build info file and the
      public server-side build-info.json file.
  frontendConsumer:
    path: src/app/app.ts
    behavior: >
      App uses the embedded APP_BUILD_INFO and loaded script bundle hash for the
      currently running application. It then fetches cache-busted index.html and
      build-info.json from the server to compare the published bundle/build time
      with the loaded bundle/build time.
  display:
    paths:
      - src/app/app.html
      - src/app/app.scss
    behavior: >
      Desktop shows a compact fixed build label and exposes details through the
      title tooltip. Mobile shows the same compact label in the burger menu and
      expands a small diagnostic detail panel when tapped.
  sourceOfTruth: >
    Build metadata is deploy/frontend metadata only. It is not generated league
    data and does not affect public/data app data contracts.

generatedPlayerExports:
  relevantPlayers:
    path: public/data/Players_Relevant.json
    producer: public/requests/RequestLeague.ps1
    helper: public/requests/utils/player/PlayerUtils.psm1
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantFile
    behavior: >
      The frequent league generation flow derives a relevant player subset from
      Players.json. Relevant players include fantasy-rostered players, young
      prospects, players with meaningful historical production and players with a
      high salary signal.
  chatChunks:
    path: public/data/chat/players-relevant
    producer: public/requests/utils/player/PlayerChatExportUtils.psm1
    entryPoint: public/requests/RequestLeague.ps1
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantChatDir
    behavior: >
      The chat export keeps full relevant player objects, splits them into stable
      10-player chunk files and writes index.json with lookup metadata. It is
      generated helper output for AI/chat workflows, not a separate manual source
      of truth.

dataFlow:
  - from: public/data/Metadata.json
    to: public/requests/utils/ConfigUtils.psm1
    purpose: Load league-specific inputs and rules.

  - from: public/requests/utils/ConfigUtils.psm1
    to: public/requests/RequestLeague.ps1
    purpose: Resolve generated data paths, including relevant player and chat export paths.

  - from: public/requests/RequestLeague.ps1
    to: public/data/Transactions.json
    purpose: >
      Update current-season completed transactions before draft generation so
      draft-pick ownership can be derived from transaction history.

  - from: public/requests/RequestLeague.ps1
    to: public/data/Drafts.json
    purpose: >
      Generate the restricted current/upcoming/live draft read model for the
      frequent league update. This path must stay lightweight and must not refresh
      completed draft history.

  - from: public/data/Drafts.json
    to: public/requests/RequestLeague.ps1
    purpose: >
      Enrich generated League.json team objects with sorted current/upcoming/live
      draft pick keys owned by each team.

  - from: public/data/Players.json
    to: public/requests/RequestLeague.ps1
    purpose: Provide player data for salary-cap calculation and relevant-player subset generation.

  - from: public/requests/RequestLeague.ps1
    to: public/data/Players_Relevant.json
    purpose: Generate a relevant player subset for AI/chat-friendly player analysis.

  - from: public/data/Players_Relevant.json
    to: public/data/chat/players-relevant/index.json and public/data/chat/players-relevant/players_*.json
    purpose: Generate stable lookup metadata and 10-player chunks for AI/chat workflows.

  - from: public/requests/RequestLeague.ps1
    to: public/data/League.json
    purpose: Generate app-readable league data.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/Drafts.json
    purpose: >
      Run the weekly/manual full draft update for current/upcoming/live drafts.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: >
      Run the weekly/manual completed draft history refresh. Historical draft
      files must not be used to enrich League.json team DraftPicks.

  - from: Sleeper draft picks endpoint
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: >
      Add completed pick results such as PlayerID, PlayerName, SleeperPickNo,
      SleeperPickedBy and Picked status to historical draft picks.

  - from: public/data/League.json
    to: src/app/services/data-service.ts
    purpose: Frontend League model.

  - from: public/data/Drafts.json
    to: src/app/services/data-service.ts
    purpose: >
      Frontend current/upcoming/live draft and draft-pick model. DataService
      resolves team DraftPick keys into DraftPick objects. Angular consumers should
      import draft model types through src/app/core/models/fantasy.models.ts.

  - from: src/app/services/data-service.ts
    to: src/app/features/league-activity/league-activity.ts
    purpose: >
      Provide LeagueActivityComponent with generated current/upcoming/live draft
      data and fantasy teams for draft cards, round groups, pick ordering and
      current/original owner display.

  - from: public/data/Players.json
    to: src/app/services/data-service.ts
    purpose: Frontend Player model.

  - from: public/data/Teams.json
    to: src/app/services/data-service.ts
    purpose: Frontend NFL team model.

  - from: public/data/Timestamps.json
    to: src/app/services/data-service.ts
    purpose: Display freshness of generated data.

knownFrontendDomainLogic:
  - path: src/app/services/data-service.ts
    topic: FreeAgentMarketInfo / RuleBasedAutoCut
    note: >
      Currently computed in Angular as frontend enrichment. If it becomes
      source-of-truth data, move it into PowerShell generation and generated JSON.

  - path: src/app/features/overview/overview.ts
    topic: Draft round chip colors
    note: >
      Overview creates a local draft-pick chip view model and computes subtle
      warm-to-cold HSL round colors from the maximum visible current-season draft
      round. This is display logic and should move into a shared frontend utility,
      pipe or service because draft picks are now shown in more than one component.

  - path: src/app/features/league-activity/league-activity.ts
    topic: League Activity draft cards
    note: >
      LeagueActivityComponent is a frontend presentation feature for the
      /league-activity route. It builds component-level view models from
      DataService draft/team data, groups picks by draft round, displays current
      owner plus "from original owner" for traded picks, and currently keeps the
      Moves section as a placeholder until Transactions.json is modeled in the
      frontend.

  - path: src/app/features/league-activity/league-activity.ts
    topic: Draft round chip colors
    note: >
      LeagueActivityComponent currently duplicates the warm-to-cold HSL round
      color calculation used by Overview. This is acceptable for the MVP but
      should be extracted into a shared frontend utility, pipe or service before
      the draft-pick display pattern is expanded further.
