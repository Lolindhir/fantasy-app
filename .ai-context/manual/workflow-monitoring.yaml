schemaVersion: 1
purpose: Canonical repository contract for GitHub Actions health monitoring. The repository defines which workflows matter
  operationally and when a run becomes actionable. A repository-owned snapshotter materializes deterministic health state;
  an external ChatGPT condition watch remains the notification layer.
ownership:
  canonicalFile: .ai-context/manual/workflow-monitoring.yaml
  monitoredRepository: Lolindhir/fantasy-app
  monitoredRef: main
  monitorImplementation: github-health-snapshot-plus-external-chatgpt-condition-watch
  requiresMonitoringWorkflowInRepository: true
snapshot:
  producerWorkflow: .github/workflows/workflow-health-snapshot.yml
  builder: tools/build_workflow_health_snapshot.py
  stateBranch: workflow-health-state
  statePath: workflow-health.json
  stateBranchInitialization: producer-created-orphan-branch
  schemaVersion: 1
  maxAgeMinutes: 90
  cadence:
    schedulerConfig: .github/workflow-schedules.json
    schedulerWorkflow: .github/workflows/scheduler.yml
    schedulerTargetId: workflow-health
    event: repository_dispatch
    eventType: scheduler-workflow-health
    timezone: Etc/UTC
    cron: "7-59/30 * * * *"
    observationBarrier:
      configKey: deferUntilOtherTargetsSettled
      blockingProfile: productive
      sameTickProductiveDispatch: hard-defer-current-tick
      inFlightMaxDeferralMinutes: 20
      awaitingObservationMaxDeferralMinutes: 20
      deadlineAnchor: productive-blocker-start-or-dispatch-time
      healthDueSlotPersistence: retained-for-slot-dedupe-only
      nonBlockingSchedulerStates:
      - retry-wait
      - retry-exhausted
      - cooldown
      - observation-timeout
      - observation-cooldown
    transition:
      externalCronStatus: cut-over
      currentSchedulerCron: null
      externalSchedulerEventType: external-scheduler-tick
  principles:
  - The snapshotter reads this policy and GitHub Actions run metadata but does not send notifications or mutate Issues.
  - The snapshotter writes only the isolated workflow-health-state branch; it must never publish health snapshots to main.
  - If the state branch does not yet exist, the snapshot producer initializes it as an orphan branch containing only monitoring state.
  - The central scheduler owns the `:07` and `:37` Health due slots according to `.github/workflow-schedules.json`.
  - Only scheduler targets whose configured profile has `healthBarrier: true` can delay Workflow Health. The current `productive` profile is blocking; `maintenance` and `observer` are not.
  - A productive target that will be dispatched in the same scheduler tick is a hard barrier for that tick. Health must wait even when the persisted Health due slot is already old.
  - A productive target that is already in-flight may delay Health for at most 20 minutes from that run's own creation/start time. A productive target awaiting GitHub run observation may delay Health for at most 20 minutes from the persisted dispatch-request time. Health remains deferred while at least one productive blocker is still inside its own window.
  - A deferred Health due slot remains persisted for slot deduplication, but its age does not consume the deferral budget of productive work that started later. Crossing a later `:07` or `:37` boundary also does not silently replace that Health slot while it remains unresolved.
  - Retry-wait, retry-exhausted, retry cooldown, observation-timeout and observation-cooldown are not Health blockers. Once retry or dispatch observation can no longer productively settle in the current window, Health must be allowed to materialize the observable state instead of being starved.
  - The observation barrier delays only Workflow Health. Other productive scheduler targets remain parallel and are not serialized by monitoring.
  - The snapshot producer itself has no schedule, push or workflow_run trigger; repository activity and unrelated workflow completions must not create Health Snapshot runs.
  - Each actual scheduler dispatch materializes a snapshot directly. There is no snapshot-side freshness gate because the central scheduler owns due-slot deduplication and observation-barrier timing.
  - The verified external Cloudflare cron is the sole automatic wake-up source for the central scheduler through `external-scheduler-tick` repository_dispatch; workflow_dispatch remains available for manual recovery and testing.
  - The former GitHub `*/5` schedule was removed after productive verification. Restoring GitHub cron later is a separate workflow/policy change; snapshot.maxAgeMinutes is 90 after post-cutover production observation showed the 30-minute snapshot cadence remained comfortably inside that bound, with observed gaps around 40 minutes.
  - The external watcher reads this policy from main plus the snapshot from workflow-health-state.
  - If the snapshot is older than maxAgeMinutes or cannot be read, the external watcher must treat monitoring infrastructure as unhealthy. This freshness signal is also the backstop when the central scheduler or snapshot dispatch path stops running.
  - The snapshot producer is classified for inventory completeness but its own run health is not used for paging; snapshot freshness is its independent health signal.
scheduler:
  config: .github/workflow-schedules.json
  implementation: tools/run-workflow-scheduler-runtime.cjs
  corePrimitives: tools/run-workflow-scheduler.cjs
  runtimeState:
    schemaVersion: 1
    branch: workflow-scheduler-state
    path: workflow-scheduler-state.json
    publication: isolated-root-commit-ref
    sourceOfTruthRule: >
      GitHub Actions run history is positive evidence for actual execution status and failure conclusions. Scheduler runtime
      state is authoritative only for the fact that a dispatch request was issued and for anchoring retry, observation,
      deferral and circuit timing. Absence from one workflow-run list response is unknown state, never failure evidence.
  profiles:
    productive:
      healthBarrier: true
      purpose: Productive data/source/materialization work whose same-tick dispatch or bounded in-flight/awaiting-observation execution should precede a Health snapshot.
    maintenance:
      healthBarrier: false
      purpose: Repository maintenance that must not delay Workflow Health.
    observer:
      healthBarrier: false
      purpose: Observation/monitoring work that must not block itself or productive work.
  dispatchObservation:
    policyOwner: .github/workflow-schedules.json
    timeoutMinutes: 15
    primaryRunRead: workflow-specific listWorkflowRuns with branch=main and per_page=100
    fallbackRunRead: >
      When a persisted dispatch is expected but the primary query does not expose it, issue one additional workflow-specific
      listWorkflowRuns query filtered to event=repository_dispatch without the branch parameter, merge/dedupe both result sets,
      then apply the local main/event/due-slot matcher again.
    missingRunRule: A persisted dispatch that is not visible in the merged run reads is `awaiting-observation`; it must not increment attempts or trigger a retry.
    timeoutRule: After 15 minutes without observing the requested run, open an observation circuit instead of issuing a blind retry.
    cooldownMinutes: 60
    cooldownRule: While the observation circuit is open, do not dispatch the target. After expiry a later scheduler tick may start one fresh cycle for the then-current due slot.
    recoveryRule: Any subsequently visible successful relevant run heals the observation state/circuit immediately.
  retry:
    policyOwner: .github/workflow-schedules.json
    defaultPolicy: standard
    maxAttempts: 3
    backoffMinutes:
    - 5
    - 10
    cooldownMinutes: 60
    slotAnchor: original-due-slot-until-success-or-circuit-resolution
    failureEvidenceRule: A retry may be scheduled only after an actually observed repository_dispatch run for the active cycle is completed with a non-success conclusion. Missing run observation is not a failed attempt.
    successRule: Any newer relevant successful run that satisfies the active cycle heals it and clears scheduler runtime state.
    exhaustionRule: After the configured observed failed attempts are exhausted, open the retry circuit for the configured cooldown instead of dispatching again on every scheduler tick.
    cooldownRule: While the retry circuit is open, do not dispatch the target; after expiry a later scheduler tick may start a fresh cycle for the then-current due slot.
  projectFieldSync:
    policyOwner: .github/workflow-schedules.json
    implementation: tools/run-project-field-sync-scheduler.cjs
    workflow: .github/workflows/sync-project-fields.yml
    eventType: scheduler-sync-project-fields
    wakeup: each central external-scheduler-tick
    quietMinutes: 5
    maxWaitMinutes: 30
    bootstrapLookbackMinutes: 30
    watermarkRule: Use the newest successful scheduler-dispatched Project batch run; before the first batch after cutover, the newest successful legacy Issue-event sync may seed the watermark.
    changeDetectionRule: Inspect repository Issues updated after the watermark; pull requests are excluded. Issue state and labels remain canonical even though unrelated Issue metadata updates may conservatively enter a batch.
    idleRule: If no Issue changed after the watermark, or a batch is already in flight, do not start another Project sync workflow run.
    debounceRule: Dispatch one batch after five minutes without another pending Issue update; continuous activity may delay that batch for at most 30 minutes from the oldest pending Issue update.
    failureIsolation: Project field mutations execute in the separate sync-project-fields workflow. Project/API mutation failures therefore fail that workflow, not the central scheduler run that detected the batch.
  output:
    machineReadable: Keep one JSON decision per target in the Actions log, including observation/fallback evidence where applicable.
    humanReadable: Write a GitHub Job Summary with target, profile, status, action, due slot, attempt and reason, plus explicit Health-deferral, dispatch-observation and circuit-breaker notes.
principles:
- Monitoring configuration is versioned in the repository; alert logic must not be duplicated across individual workflow YAML
  files.
- Every GitHub Actions workflow file must have exactly one entry in this contract.
- A newly created, renamed or materially repurposed workflow must update this contract in the same authorized change.
- An unclassified workflow is a fail-closed monitoring configuration error and must be surfaced.
- A configured workflow path that no longer exists is configuration drift and must be surfaced.
- Feature-branch pull-request runs and normal manual workflow_dispatch runs are not production paging signals unless a workflow
  entry explicitly opts in.
- Central-scheduler repository_dispatch runs are production paging signals for migrated scheduled workflows.
- A failure is healed when a newer relevant completed run succeeds; healed failures must not be alerted.
- Cancelled, skipped and neutral runs are not failures for paging purposes.
- Disabled workflows remain classified but are excluded from run-health and staleness checks until re-enabled.
- The snapshotter performs deterministic evaluation only; the external monitor decides whether to surface a notification from
  the current snapshot.
runEvaluation:
  defaultBranch: main
  recentRunsToInspect: 100
  defaultIgnoredEvents:
  - pull_request
  - workflow_dispatch
  healthyConclusions:
  - success
  unhealthyConclusions:
  - failure
  - timed_out
  - action_required
  - startup_failure
  ignoredConclusions:
  - cancelled
  - skipped
  - neutral
  incompleteRuns: ignore-until-completed
  incompleteRunMetadata: Expose the newest relevant incomplete run as latestRelevantInFlightRun for observation context, but do not count it toward failure, recovery or staleness conclusions before completion.
  unknownCompletedConclusion: fail-closed
  branchRule: Require main when the run exposes a meaningful head branch. Repository-level events such as issues or repository_dispatch may not expose
    a normal branch and are evaluated by event.
  failureStreakRule: After filtering to relevant events, count consecutive unhealthy completed runs from newest to oldest
    and stop at the first healthy completed run.
  healedFailureRule: If the newest relevant completed run is healthy, do not alert for any older failure.
  stalenessRule: Only evaluate staleness when staleAfterMinutes is explicitly configured for the workflow. Measure from the
    newest successful relevant completed run. A successful relevant push run may satisfy freshness for the same workflow because
    it proves the production workflow logic completed successfully.
  notificationDeduplication:
    sameIncident: suppress
    reNotifyAfterHours: 24
    incidentFingerprint: Use workflow path plus alert type and incident onset. The snapshot carries firstObservedAt and notificationDue
      across runs so the external watcher can remain stateless for basic deduplication.
    materialChangeExamples:
    - failure streak increased
    - alert category changed
    - a different failure replaced the previous incident after a recovery
    - the same unresolved incident has reached the re-notification interval
categories:
  non-paging:
    notify: false
    consecutiveFailures: null
    description: Classified for inventory completeness but intentionally excluded from production paging, typically PR/manual
      validation, repair-only workflows or the snapshot producer whose own health is represented by snapshot freshness.
  critical:
    notify: true
    consecutiveFailures: 1
    description: Production integrity, deployment or central scheduling failures that should be surfaced on the first relevant unresolved failure.
  important:
    notify: true
    consecutiveFailures: 2
    description: Important production workflows where one transient failure may self-heal, but a short failure streak or configured
      staleness is actionable.
  routine:
    notify: true
    consecutiveFailures: 2
    description: Scheduled maintenance or provider refreshes where transient failure noise should be suppressed and freshness
      is the main backstop.
workflows:
  .github/workflows/build.yml:
    category: non-paging
    relevantEvents: []
    rationale: PR/manual CI; failures are handled in the active development/review context.
  .github/workflows/deploy.yml:
    category: critical
    relevantEvents:
    - push
    - workflow_call
    rationale: Main deployment failure can leave the published app behind repository state.
  .github/workflows/fantasy-management-validation.yml:
    category: critical
    relevantEvents:
    - push
    rationale: A failing validation run on main indicates repository-integrity drift; pull-request runs stay non-paging.
  .github/workflows/scheduler.yml:
    category: critical
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 20
    rationale: Central five-minute scheduling layer woken automatically by the external Cloudflare cron for all migrated time-driven targets, including workflow health. It owns profile-driven bounded retries, fail-safe dispatch observation with fallback reads, isolated runtime coordination, Health observation-barrier decisions and debounced Project-field change detection; a scheduler failure or roughly 20 minutes without a successful external tick can prevent downstream refreshes and Project mirroring and is immediately actionable.
  .github/workflows/sync-nfl-source-data.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    - push
    - workflow_call
    consecutiveFailures: 1
    staleAfterMinutes: 1800
    rationale: Daily persistent NFL Source sync dispatched by the central scheduler; main-push/called runs verify source-layer changes, while failures or a missed daily cycle should surface promptly. Manual repair runs remain non-paging.
  .github/workflows/sync-league-source-data.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    - push
    consecutiveFailures: 1
    staleAfterMinutes: 1800
    rationale: Daily persistent League Source sync dispatched by the central scheduler; main-push runs verify source-layer changes immediately, while failures or a missed daily cycle should surface promptly. Pull-request and manual repair runs remain non-paging.
  .github/workflows/source-data-readiness.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily post-source observer materializes persisted NFL, League and storage readiness evidence after the source sync windows; failures or a missed daily audit should surface, while manual repair runs remain non-paging.
  .github/workflows/sync-project-fields.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    rationale: Scheduler-dispatched batches mirror canonical Issue state and labels after a five-minute quiet period, with a 30-minute maximum wait during continuous activity. Repeated batch failures can desynchronize the GitHub Project; manual workflow_dispatch repair runs remain non-paging.
  .github/workflows/clean-backups.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly maintenance dispatched by the central scheduler; alert after the scheduled cycle has effectively been missed for about a day.
  .github/workflows/materialize-fantasy-operations-inputs.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily Operations materialization dispatched by the central scheduler should not silently miss a complete daily cycle.
  .github/workflows/update-cbs-sports-projections.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasy-football-calculator-adp.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasycalc-rankings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasypros-rankings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fftoday-projections.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-sleeper-trending.yml:
