    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations signal refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-league.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 45
    rationale: Ten-minute league refresh dispatched by the central scheduler; two consecutive failures or roughly 45 minutes without a successful production run are actionable.
  .github/workflows/update-players.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 840
    rationale: Three centrally scheduled daily refreshes; 14 hours covers the longest normal gap with modest operational grace.
  .github/workflows/update-games.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 960
    rationale: Two centrally scheduled daily refreshes; 16 hours covers the longest normal gap with operational grace.
  .github/workflows/update-transactions.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly transaction/history rebuild dispatched by the central scheduler; surface a missed weekly cycle without paging on a single transient run immediately.
  .github/workflows/update-standings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly between-week standings refresh dispatched by the central scheduler; alert after the weekly cycle has effectively been missed for about a day.
  .github/workflows/update-teams.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly between-week teams refresh dispatched by the central scheduler; alert after the weekly cycle has effectively been missed for about a day.
  .github/workflows/update-drafts.yml:
    category: non-paging
    relevantEvents: []
    rationale: Manual repair/refresh workflow with no production schedule.
  .github/workflows/update-past-seasons-index.yml:
    category: non-paging
    relevantEvents: []
    rationale: Manual maintenance/repair workflow with no production schedule.
  .github/workflows/workflow-health-snapshot.yml:
    category: non-paging
    relevantEvents: []
    rationale: Scheduler-dispatched 30-minute snapshot producer. Productive same-tick dispatches hard-defer Health; already in-flight or awaiting-observation productive work can delay it for at most 20 minutes from each blocker's own run/dispatch start. Retry-wait/exhausted/cooldown and observation-timeout/cooldown states do not block it. It has no independent schedule, push or workflow_run trigger; its availability is monitored through workflow-health.json freshness rather than recursive run-health evaluation.
future:
  dailyDigest:
    status: planned-later
    principle: A separate daily digest may summarize healthy runs, transient recovered failures and ignored development noise.
      It is deliberately not part of the hourly paging contract.
