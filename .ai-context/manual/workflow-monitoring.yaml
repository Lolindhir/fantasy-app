schemaVersion: 1
purpose: Canonical repository contract for GitHub Actions health monitoring. The repository defines which workflows matter
  operationally and when a run becomes actionable. A repository-owned snapshotter materializes deterministic health state;
  an external ChatGPT condition watch remains the notification layer.
ownership:
  canonicalFile: .ai-context/manual/workflow-monitoring.yaml
  monitoredRepository: Lolindhir/fantasy-app
  monitoredRef: main
  monitorImplementation: github-health-snapshot-plus-external-chatgpt-condition-watch
  requiresMonitoringWorkflowInRepository: true
snapshot:
  producerWorkflow: .github/workflows/workflow-health-snapshot.yml
  builder: tools/build_workflow_health_snapshot.py
  stateBranch: workflow-health-state
  statePath: workflow-health.json
  stateBranchInitialization: producer-created-orphan-branch
  schemaVersion: 1
  maxAgeMinutes: 150
  cadence:
    primarySchedule: "7-59/30 * * * *"
    fallback:
      minimumStateAgeMinutes: 40
      mainPush:
        event: push
        branch: main
        immediatePaths:
        - .github/workflows/workflow-health-snapshot.yml
        - .ai-context/manual/workflow-monitoring.yaml
        - tools/build_workflow_health_snapshot.py
        - tools/tests/test_build_workflow_health_snapshot.py
      productiveWorkflowRun:
        event: workflow_run
        branch: main
        types:
        - completed
        categories:
        - critical
        - important
        - routine
        exclusions:
        - .github/workflows/scheduler.yml
  principles:
  - The snapshotter reads this policy and GitHub Actions run metadata but does not send notifications or mutate Issues.
  - The snapshotter writes only the isolated workflow-health-state branch; it must never publish health snapshots to main.
  - If the state branch does not yet exist, the snapshot producer initializes it as an orphan branch containing only monitoring state.
  - The offset 30-minute schedule (`:07` and `:37` each hour) is best-effort. All pushes to main also trigger the snapshot producer so repository activity provides a scheduler-independent refresh opportunity.
  - Pushes to main that change the snapshot workflow, builder, tests or policy bypass the freshness gate and trigger an immediate snapshot.
  - Other pushes to main rebuild only when the current snapshot is missing, unreadable or at least 40 minutes old.
  - Completed runs on main of paging-relevant workflows are additional workflow_run heartbeat opportunities and use the same 40-minute freshness gate.
  - The central five-minute scheduler is intentionally excluded from the snapshot workflow_run trigger list so every scheduler tick does not create a second monitoring workflow run. Scheduler health is still evaluated from its own scheduled run history whenever a snapshot is materialized through the independent snapshot cron, main-push fallback or another productive workflow heartbeat.
  - The workflow_run trigger list must cover every other paging-relevant workflow and must exclude `non-paging` workflows, especially the snapshot producer itself, so monitoring cannot recursively trigger on its own completion.
  - The external watcher reads this policy from main plus the snapshot from workflow-health-state.
  - If the snapshot is older than maxAgeMinutes or cannot be read, the external watcher must treat monitoring infrastructure
    as unhealthy.
  - The snapshot producer is classified for inventory completeness but its own run health is not used for paging; snapshot
    freshness is its independent health signal.
principles:
- Monitoring configuration is versioned in the repository; alert logic must not be duplicated across individual workflow YAML
  files.
- Every GitHub Actions workflow file must have exactly one entry in this contract.
- A newly created, renamed or materially repurposed workflow must update this contract in the same authorized change.
- An unclassified workflow is a fail-closed monitoring configuration error and must be surfaced.
- A configured workflow path that no longer exists is configuration drift and must be surfaced.
- Feature-branch pull-request runs and normal manual workflow_dispatch runs are not production paging signals unless a workflow
  entry explicitly opts in.
- Central-scheduler repository_dispatch runs are production paging signals for migrated scheduled workflows.
- A failure is healed when a newer relevant completed run succeeds; healed failures must not be alerted.
- Cancelled, skipped and neutral runs are not failures for paging purposes.
- Disabled workflows remain classified but are excluded from run-health and staleness checks until re-enabled.
- The snapshotter performs deterministic evaluation only; the external monitor decides whether to surface a notification from
  the current snapshot.
runEvaluation:
  defaultBranch: main
  recentRunsToInspect: 100
  defaultIgnoredEvents:
  - pull_request
  - workflow_dispatch
  healthyConclusions:
  - success
  unhealthyConclusions:
  - failure
  - timed_out
  - action_required
  - startup_failure
  ignoredConclusions:
  - cancelled
  - skipped
  - neutral
  incompleteRuns: ignore-until-completed
  unknownCompletedConclusion: fail-closed
  branchRule: Require main when the run exposes a meaningful head branch. Repository-level events such as issues or repository_dispatch may not expose
    a normal branch and are evaluated by event.
  failureStreakRule: After filtering to relevant events, count consecutive unhealthy completed runs from newest to oldest
    and stop at the first healthy completed run.
  healedFailureRule: If the newest relevant completed run is healthy, do not alert for any older failure.
  stalenessRule: Only evaluate staleness when staleAfterMinutes is explicitly configured for the workflow. Measure from the
    newest successful relevant completed run. A successful relevant push run may satisfy freshness for the same workflow because
    it proves the production workflow logic completed successfully.
  notificationDeduplication:
    sameIncident: suppress
    reNotifyAfterHours: 24
    incidentFingerprint: Use workflow path plus alert type and incident onset. The snapshot carries firstObservedAt and notificationDue
      across runs so the external watcher can remain stateless for basic deduplication.
    materialChangeExamples:
    - failure streak increased
    - alert category changed
    - a different failure replaced the previous incident after a recovery
    - the same unresolved incident has reached the re-notification interval
categories:
  non-paging:
    notify: false
    consecutiveFailures: null
    description: Classified for inventory completeness but intentionally excluded from production paging, typically PR/manual
      validation, repair-only workflows or the snapshot producer whose own health is represented by snapshot freshness.
  critical:
    notify: true
    consecutiveFailures: 1
    description: Production integrity, deployment or central scheduling failures that should be surfaced on the first relevant unresolved failure.
  important:
    notify: true
    consecutiveFailures: 2
    description: Important production workflows where one transient failure may self-heal, but a short failure streak or configured
      staleness is actionable.
  routine:
    notify: true
    consecutiveFailures: 2
    description: Scheduled maintenance or provider refreshes where transient failure noise should be suppressed and freshness
      is the main backstop.
workflows:
  .github/workflows/build.yml:
    category: non-paging
    relevantEvents: []
    rationale: PR/manual CI; failures are handled in the active development/review context.
  .github/workflows/deploy.yml:
    category: critical
    relevantEvents:
    - push
    - workflow_call
    rationale: Main deployment failure can leave the published app behind repository state.
  .github/workflows/fantasy-management-validation.yml:
    category: critical
    relevantEvents:
    - push
    rationale: A failing validation run on main indicates repository-integrity drift; pull-request runs stay non-paging.
  .github/workflows/scheduler.yml:
    category: critical
    relevantEvents:
    - schedule
    staleAfterMinutes: 20
    rationale: Central five-minute scheduling layer for all migrated time-driven productive workflows; a scheduler failure or roughly 20 minutes without a successful scheduler tick can prevent downstream refreshes and is immediately actionable.
  .github/workflows/sync-nfl-source-data.yml:
    category: important
    relevantEvents:
    - push
    - workflow_call
    consecutiveFailures: 1
    rationale: Source-data tooling failures on main/called production paths should surface promptly; manual repair runs stay
      non-paging.
  .github/workflows/sync-project-fields.yml:
    category: important
    relevantEvents:
    - issues
    rationale: Repeated issue-event failures can desynchronize the GitHub Project from canonical Issue metadata.
  .github/workflows/clean-backups.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly maintenance dispatched by the central scheduler; alert after the scheduled cycle has effectively been missed for about a day.
  .github/workflows/materialize-fantasy-operations-inputs.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily Operations materialization dispatched by the central scheduler should not silently miss a complete daily cycle.
  .github/workflows/update-cbs-sports-projections.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasy-football-calculator-adp.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasycalc-rankings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fantasypros-rankings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-fftoday-projections.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations provider refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-sleeper-trending.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    - push
    staleAfterMinutes: 1800
    rationale: Daily pre-Operations signal refresh dispatched by the central scheduler; tolerate a transient failure but surface a missed daily cycle.
  .github/workflows/update-league.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 45
    rationale: Ten-minute league refresh dispatched by the central scheduler; two consecutive failures or roughly 45 minutes without a successful production run are actionable.
  .github/workflows/update-players.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 840
    rationale: Three centrally scheduled daily refreshes; 14 hours covers the longest normal gap with modest operational grace.
  .github/workflows/update-games.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 960
    rationale: Two centrally scheduled daily refreshes; 16 hours covers the longest normal gap with operational grace.
  .github/workflows/update-transactions.yml:
    category: important
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly transaction/history rebuild dispatched by the central scheduler; surface a missed weekly cycle without paging on a single transient run immediately.
  .github/workflows/update-standings.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly between-week standings refresh dispatched by the central scheduler; alert after the weekly cycle has effectively been missed for about a day.
  .github/workflows/update-teams.yml:
    category: routine
    relevantEvents:
    - repository_dispatch
    staleAfterMinutes: 11520
    rationale: Weekly between-week teams refresh dispatched by the central scheduler; alert after the weekly cycle has effectively been missed for about a day.
  .github/workflows/update-drafts.yml:
    category: non-paging
    relevantEvents: []
    rationale: Manual repair/refresh workflow with no production schedule.
  .github/workflows/update-past-seasons-index.yml:
    category: non-paging
    relevantEvents: []
    rationale: Manual maintenance/repair workflow with no production schedule.
  .github/workflows/workflow-health-snapshot.yml:
    category: non-paging
    relevantEvents: []
    rationale: Best-effort offset 30-minute snapshot producer with scheduler-independent main-push refresh opportunities plus freshness-gated workflow_run heartbeats from paging-relevant workflows except the five-minute central scheduler; its own availability is monitored through workflow-health.json freshness rather than recursive run-health evaluation.
future:
  dailyDigest:
    status: planned-later
    principle: A separate daily digest may summarize healthy runs, transient recovered failures and ignored development noise.
      It is deliberately not part of the hourly paging contract.
