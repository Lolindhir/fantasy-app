  It runs in league-live (after the incremental materializer) and update-transactions (after the full materializer) inside
  the existing public/data publication scope; Timestamps.json[ScheduleOutlook] is stamped only on a semantic change.
  The Angular view is a separate change.

playoffOdds:
  issue: 1588
  architectureDecision: ADR-090
  model: playoff-odds-v1 (tools/derived_data_lib/models/playoff_odds/v1.py), chosen per season in data-meta Models.PlayoffOdds (no default)
  principle: >
    Purely statistical and exact: every open regular-season game is an independent 50/50 win/loss, all outcome
    combinations are counted exactly (dynamic program over team scores, no Monte Carlo), no team strength and no
    projection. The 50/50 basis is the combinatorial scenario view; calibrated, strength-based probabilities stay with
    Issue #1536 and may reuse the output shape. Team count, playoff size (WeekStructure.PlayoffTeams), the regular-season
    end and the open pairings come from canonical league facts; nothing is hard-wired to 6 teams / 4 playoff places.
  documentShape: |
    Root "Models.PlayoffOdds": "playoff-odds-v1" and root block "PlayoffOdds":
    { "Model", "Available", "Reason": null | "unknown-playoff-teams" | "state-limit-exceeded",
      "Provenance": { "OpenGames", "OutcomeCount" (string, 2^OpenGames), "PlayoffTeams", "RegularSeasonComplete",
                      "TieRule": "equal-record-teams-share-places", "Method": "exact-enumeration-50-50" },
      "Teams": [ { "TeamID", "CanonicalLeagueRosterID", "Record": { "Wins", "Losses", "Ties" },
                   "PlaceProbabilities": [ ... length = team count, index 0 = place 1 ... ],
                   "PlayoffProbability", "EliminationProbability", "Status": "clinched" | "eliminated" | "alive" } ] }
    Probabilities are rounded to 10 digits in the product (rounding for display belongs to the consumer);
    each team's places sum to 1 and each place sums to 1 across teams (within rounding).
  rules:
    - Played results (wins, losses, ties; ties count 0.5) come from the scored regular-season weeks up to the cutoff. Points are used only once the regular season is complete.
    - Equal-record teams share the affected places evenly because future points are unknown; no extrapolation of current points.
    - Status is strict. clinched = a playoff place in every outcome even if every tiebreak is lost; eliminated = no playoff place in any outcome even if every tiebreak is won; otherwise alive.
    - After the regular-season end the official table (standings-v1 tiebreak, with points) decides and all probabilities are 0 or 1.
    - Unknown playoff size or an exceeded state limit (MAX_STATES) yields Available false with null values, never an approximation or an invented 50 percent.
    - A missing PlayoffOdds block (documents before this change) is unavailable to consumers.
  invalidation: >
    The input fingerprint (FINGERPRINT_VERSION 2) additionally covers the played records (points only after the regular
    season is complete) and the playoff-odds model ID; a played result dirties only the cutoffs that count it.
  performance: Measured 2026-11-20 for nfl-reise (6 teams, 3 games per week) - all 47 cutoffs 2024-2026 in about 20 s; the full 14-week season alone in about 3 s. Larger leagues hit MAX_STATES and report unavailable until a better algorithm is approved.
  noNewWriter: Runs inside the existing league-live (incremental) and update-transactions (full) outlook writers; same prefix data-derived/league-schedule-outlook, same App file ScheduleOutlook.json (unchanged transfer).

purpose: >
  One reproducible, consumer-neutral shared data product for the remaining
  regular-season schedule, two separately explained opponent-strength metrics,
  and confirmed, provisional, conditional or unknown playoff paths for every
  fully scored historical after-week cutoff. Does not contain future match
  win, playoff-qualification or championship probabilities (follow-up #1536).

architecture:
  decisionBasis:
    - ADR-037
    - ADR-038
    - ADR-054
    - ADR-055
    - ADR-071
    - ADR-082
  logicalLayer: Shared Derived Data
  proposedStorage: data-derived/league-schedule-outlook/<CanonicalLeagueID>/<Season>/after-week-<NN>.json
  existingInputs:
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/league.json
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/members.json
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/rosters.json
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/matchups/week-N.json
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/winners-bracket.json
    - data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/losers-bracket.json
    - data-derived/season-statistics/<CanonicalLeagueID>/<Season>.json (rebuildable from accepted Source and upstream products)
    - tools/derived_data_lib/week_finality.py (LeagueScoredWeek)
    - central model registry schedule-outlook-v1
    - data-meta/<CanonicalLeagueID>/metadata.json (future explicit Models.ScheduleOutlook selection; not yet enabled)
  forbiddenInputs:
    - public/data/** consumer read models
    - any previously generated league-schedule-outlook snapshot
    - future scores, starters, later rosters or results of unscored weeks
    - finalized playoff winners before the entire applicable round is scored

identity:
  fileTuple:
    - CanonicalLeagueID
    - CanonicalLeagueSeasonID
    - Season
    - AsOf.AfterWeek
    - SchemaVersion
    - Models.ScheduleOutlook
  teamKey: CanonicalLeagueRosterID
  secondaryJoinKey: TeamID is season-local and not canonical identity
  oneFilePerWeek: after-week-00 is pre-season; subsequent weeks are fully scored league weeks only

temporalSemantics:
  cutoff: AfterWeek is 0..LeagueScoredWeek from the central week-finality contract
  regularSeasonEnd: PlayoffStartWeek minus one (never hardcode the season's week count)
  sourcePairings: >
    Only canonical team/matchup identities of future regular-season weeks are
    used. Matchup scores and lineups from those source rows are ignored.
  ratings: >
    Use season-statistics.Weeks[min(AfterWeek,regularSeasonEnd)] for every
    opponent, or null at Week 0. After the regular-season end the last
    regular-season rating stays explicitly fixed while playoff paths update.
  playoffPaths: >
    Model the existing bracket's routing, one- or two-week rounds, byes,
    placement/consolation and distinct participant certainty and round
    completion. Never replay later winner or seeded-entrant observations
    into earlier completed-week snapshots.
  evidence: >
    An AsOf snapshot is reconstructed from the currently accepted canonical
    facts under the selected model; it does not assert the exact provider or
    UI observation that historically existed at that clock instant.

definitions:
  RemainingSoSRelativeStrength: >
    Mean of each remaining opponent's as-of RelativeScoringStrength, counting
    repeated games repeatedly. Lower means an easier remaining schedule.
  RemainingOpponentBestBallStrength: >
    Mean of each remaining opponent's as-of ProjectedBestBallStrength in
    fantasy points. These two metrics are not combined in V1.
  ranking: >
    Ascending competition ranking only with complete opponent coverage
    across every team for that metric. A metric missing any opponent has
    a null aggregate/rank and a clear coverage count.
  noGames: >
    Zero remaining games yields null difficulty and rank, never zero.
  noEvidence: >
    Unknown scores/ratings/participants stay null or unknown; never 50%,
    zero or a fabricated schedule/opponent.

contract:
  version: 1
  product: league-schedule-outlook
  provisionalRootShape: |
    {
      "SchemaVersion": 1,
      "Product": "league-schedule-outlook",
      "CanonicalLeagueID": "<id>",
      "CanonicalLeagueSeasonID": "<canonical season id>",
      "Season": <int>,
      "Models": {
        "ScheduleOutlook": "schedule-outlook-v1",
        "SeasonStats": "season-stats-v1" | null
      },
      "AsOf": { "AfterWeek": <int>, "RatingWeek": <int> | null },
      "Provenance": { "Reconstruction": "reconstructed-from-accepted-sources" },
      "RegularSeason": {
        "AfterWeek": <int>,
        "RatingWeek": <int> | null,
        "UpcomingMatchups": [ { "Week", "CanonicalLeagueMatchupID",
                                "Team1CanonicalLeagueRosterID", "Team2CanonicalLeagueRosterID" } ],
        "Teams": [ { "TeamID", "CanonicalLeagueRosterID", "RemainingGames", "Upcoming",
                     "KnownRelativeScoringStrengthGames", "KnownProjectedBestBallStrengthGames",
                     "RemainingSoSRelativeStrength", "RemainingSoSRelativeStrengthRank",
                     "RemainingOpponentBestBallStrength", "RemainingOpponentBestBallStrengthRank" } ]
      },
      "Playoffs": {
        "Format": { "PlayoffStartWeek", "PlayoffTeams", "PlayoffRoundType", "RoundWeeks",
                    "ObservedPlayoffFormat", "ProjectedPlayoffFormat", "FormatEvidence" },
        "Paths": [ { "Bracket", "Match", "Round", "RoundWeeks", "RoundState",
                     "Category", "Placement", "Participants", "ParticipantCertainty",
                     "WinnerCanonicalLeagueRosterID", "LoserCanonicalLeagueRosterID" } ]
      }
    }
  modelSelection: >
    ScheduleOutlook is a mandatory explicit per-season data-meta model choice
    before any productive materialization; no implicit version fallback.
    Missing or unknown selections fail closed.
  serialization: >
    Deterministic compact UTF-8 JSON with no volatile build/clock timestamps.
    No PreviewOnly field in persisted product documents.
  sourceRevision: >
    Input fingerprints and correction/republication semantics will be fixed
    in the materializer/restore checkpoint before the first production write;
    this provisional schema makes no unsupported ObservedAt claim.

plannedMaterialization:
  pureAssembler: tools/derived_data_lib/league_schedule_outlook.py::assemble
  readOnlySourceAdapter: tools/league_schedule_outlook_preview.py (SeasonInputs, load_season_inputs, snapshot)
  materializer: tools/league_schedule_outlook_materialize.py
  writeScope: data-derived/league-schedule-outlook/** by the two existing writers below (approved 2026-11-19)
  layout: >
    data-derived/league-schedule-outlook/<CanonicalLeagueID>/<Season>/after-week-NN.json (one per fully
    scored cutoff 0..LeagueScoredWeek) plus index.json in the same folder, always written last.
  indexShape: >
    {SchemaVersion, Product "league-schedule-outlook-index", CanonicalLeagueID, CanonicalLeagueSeasonID,
    Season, Models.ScheduleOutlook, LeagueScoredWeek, Snapshots[{AfterWeek, File, InputFingerprint, Sha256}]}.
    A present index implies a complete, hash-verifiable set 0..LeagueScoredWeek; consumers read the index
    first and must treat a missing or inconsistent index as unavailable, never as an empty outlook.
  inputFingerprint: >
    Provenance.InputFingerprint = SHA-256 over exactly the accepted facts a cutoff depends on: fingerprint,
    schema and model versions, identities, WeekStructure, team identity, the FUTURE regular-season pairings
    (identity only), the ratings of that cutoff's rating week only, the SeasonStats model id and the
    bracket facts visible at the cutoff (direct seeds from the regular-season end, Winner/Loser only after
    the whole round is scored). Scores, lineups, later ratings and masked bracket results are excluded, so a
    new week or a playoff result dirties only the cutoffs it can change. Soundness (content change implies
    fingerprint change) is pinned by a perturbation test. Any change to the model, assembler or what they
    read requires bumping FINGERPRINT_VERSION or a new model version.
  modes:
    incremental: >
      Recompute only cutoffs whose fingerprint differs from the persisted document or whose file is
      missing or unreadable; unchanged input is a true no-op. The persisted file decides only whether to
      recompute, never the content. Intended for League Live (current season, every tick).
    full: >
      Recompute every cutoff and compare bytes (weekly historical pass, tamper/drift detection and
      explicit repair), as required by data-sources.yaml historicalReconciliationStandard.
  consistency: >
    A season is built entirely in memory, its inputs are re-read and all fingerprints recomputed (any
    change aborts that season with nothing written), snapshots are replaced atomically and the index is
    written last. A season error never touches its files and never blocks other seasons (exit code 1,
    warning annotation). Orphan snapshot files (for example after a finality rollback) are reported and
    never deleted automatically. Upstream order: season-statistics of the season must be current through
    the rating week (otherwise the season fails closed and keeps its last good set).
  performance: >
    Measured 2026-11-19: all 47 historical cutoffs (2024–2026) in about 2.8 s and about 1 MB in a single
    process; incremental no-op about 2.6 s (dominated by reading inputs and week finality). The expensive
    part of the earlier restore replay is the upstream PWF/TWP/SeasonStats rebuild, which production
    never repeats because the materializer reads the persisted season-statistics product. No further
    optimisation is needed.
  currentScope: >
    League Live: --scope current --mode incremental after the season-statistics refresh of the same
    publication (fail-soft like season-statistics).
  historicalScope: >
    update-transactions (weekly): --scope all --mode full after season-statistics --scope all and before
    the Past Seasons index.
  writerOwners:
    - .github/workflows/league-live.yml (existing rebuild-and-retry, new --path data-derived/league-schedule-outlook)
    - .github/workflows/update-transactions.yml (existing rebuild-and-retry, same new --path)
  activationChangeSet: >
    One reviewed change after approval: (1) data-meta Models.ScheduleOutlook per season together with the
    league_metadata KNOWN_MODEL_IDS entry (Models must name exactly the catalogue, so the catalogue entry
    and every league season edit land together), (2) the model id read from data-meta instead of
    --model-id, (3) PRODUCTIVE_WRITE_ENABLED, (4) the two workflow calls and --path prefix,
    (5) workflow-publication.yaml note, (6) data-derived README product row, (7) ADR in decisions.yaml.
  rollback: >
    Remove the two generator calls and the --path prefix from both workflows through a reviewed change. Do not force-delete published snapshots as an
    automatic rollback action; consumers fall back to unavailable.

validation:
  pureTests: tools/tests/test_league_schedule_outlook_document.py
  previewTests: tools/tests/test_league_schedule_outlook_preview.py
  restoreProbeRequired: tools/derived_clean_root_audit.py
  candidateRestoreProbe: >
    Explicit opt-in only: --schedule-outlook-candidate --league <ID>
    --model-id schedule-outlook-v1 [--season YYYY]. Rebuilds PWF, TWP and
    season-statistics in temporary empty/normal roots, then compares in-memory
    outlook hashes for every final cutoff and a second no-op pass. The
    candidate model argument is not productive data-meta selection. The
    upstream materializers are restricted to selected seasons, and the report
    records clean committed Git data-source/data-meta tree revisions when
    available, with before/after equality. This is accepted-checkout identity,
    not proof of live provider freshness or historical observation. The
    existing weekly full Derived Restore Gate also runs this candidate as an
    advisory read-only in-memory replay against its already-built empty and
    normal shadows (no duplicate PWF/TWP/SeasonStats build). An Outlook
    candidate failure is reported separately without weakening or blocking
    the existing products' restore gate until the product contract is accepted.
    Passing this probe is not writer authorization.
  materializerTests: tools/tests/test_league_schedule_outlook_materialize.py
  acceptanceGates:
    - Complete source-only cold rebuild and byte-identical second pass (done: I5b.2c audit, I6 tests)
    - No reference to previous outlook outputs or public/data (done)
    - All valid 2024/2025/2026 Cutoffs and both playoff round styles (done)
    - Correct null/unknown and future-leak regression tests (done)
    - Fail-closed unknown metadata model, source/cutoff gaps, late source revisions (done for explicit model; data-meta selection pending approval)
    - Bounded writer-scope, no-op and race/recovery tests (materializer side done in I6; workflow integration pending approval)
    - Separate targeted approval for new productive Derived prefix (pending)
