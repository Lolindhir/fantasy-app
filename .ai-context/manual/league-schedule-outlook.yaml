schemaVersion: 1
status: active-derived-product-app-file-generator
trackingIssue: 1519
architectureDecision: ADR-088
implementationState: >
  I1–I5b.2c merged; the full historical replay (47 cutoffs 2024–2026) passed in the weekly Full Audit
  (run 44523559168, 2026-11-19: VerifiedCandidatePass, SourceRevisionVerified, no digest differences).
  I6 added the bounded, fingerprinted, recoverable materializer tools/league_schedule_outlook_materialize.py.
  Activated by Robert's approval of 2026-11-19 (ADR-088): data-meta Models.ScheduleOutlook selects
  schedule-outlook-v1 for every season, and the existing writers league-live.yml (current season, incremental,
  fail-soft) and update-transactions.yml (all seasons, full) publish data-derived/league-schedule-outlook.
  The initial fill came from a normal update-transactions run (2026-11-19, 47 snapshots 2024-2026).
  App delivery (Robert 2026-11-20, "Freigabe für alles"): tools/league_schedule_outlook_app_publish.py renders
  public/data/ScheduleOutlook.json = the newest snapshot of the current season, unchanged, read through the completeness
