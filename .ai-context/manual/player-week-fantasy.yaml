schemaVersion: 1

domain: player-week-fantasy
status: accepted-contract-v1
trackingIssue: 697

purpose: >
  Define the reusable Shared Derived Data contract for one NFL player's
  fantasy-football state in one target week under one explicit League scoring
  profile. The contract unifies realized fantasy points and pregame projection
  semantics without making a consumer read model or provider score the upstream
  owner.

architecture:
  decisionBasis:
    - ADR-033
    - ADR-037
    - ADR-038
  logicalLayer: Shared Derived Data
  physicalStorage: derived-data/player-week-fantasy/<CanonicalLeagueID>/<season>/<week>.json
  implementationFoundation: tools/player_week_fantasy.py
  rules:
    - source-data/nfl/weekly-rosters/<season>/<week>.json remains the canonical week-scoped NFL player anchor.
    - PlayerWeekFantasy never mutates or enriches canonical NFL source records in place.
    - public/data is an App delivery layer and is not the shared domain owner.
    - FantasyGameContext, Players/Free Agents and later Fantasy Operations are consumers, not independent scoring owners.
    - Starter/bench/free-agent ownership does not change the underlying player-week projection.

identity:
  recordTuple:
    - CanonicalPlayerID
    - CanonicalLeagueID
    - Season
    - Week
    - ScoringProfile.SettingsHash
  scoringProfile:
    fields:
      - Season
      - SettingsHash
      - FingerprintVersion
      - ActiveSettingsCount
    rule: >
      ScoringProfile.Season identifies the canonical League-season rule set selected
      for derivation. It is explicit even when it equals the target NFL Season so
      historical/what-if re-scoring remains unambiguous.
  providerBoundary: >
    Sleeper PlayerID is not part of the shared identity. CanonicalPlayerID -> app
    PlayerID resolution belongs to a later App publication/join step and must fail
    closed when ambiguous.

scoringFingerprint:
  version: 1
  algorithm: sha256
  implementation: tools/player_week_fantasy.py::scoring_settings_fingerprint
  semanticInput: ScoringSettings
  normalization:
    - sort setting keys deterministically
    - normalize numeric values so equivalent forms such as 1, 1.0 and "1.000" are identical
    - omit zero-valued settings because absent and explicit zero are scoring-equivalent
    - reject non-numeric, non-finite or invalid setting values
  payloadShape: >
    {"ActiveSettings":{...canonical decimal strings...},"Version":1}
  hashFormat: sha256:<lowercase-hex>
  rules:
    - Active scoring-weight changes must change SettingsHash.
    - Reordering settings must not change SettingsHash.
    - Adding/removing an inactive zero-valued setting must not change SettingsHash.
    - The same effective settings may have the same SettingsHash in multiple leagues; CanonicalLeagueID remains a separate identity dimension.
    - Any materialized Actual, Projection or PredictionRange must never be reused under a different SettingsHash.

contract:
  version: 1
  rootShape: |
    {
      "ContractVersion": 1,
      "CanonicalLeagueID": "nfl-reise",
      "Season": 2026,
      "Week": 4,
      "ScoringProfile": {
        "Season": 2026,
        "SettingsHash": "sha256:...",
        "FingerprintVersion": 1,
        "ActiveSettingsCount": 41
      },
      "Records": []
    }
  recordShape: |
    {
      "CanonicalPlayerID": "NFLP-...",
      "Projection": {
        "Status": "available",
        "Points": 16.8,
        "PredictionRange": {
          "Level": 0.90,
          "Lower": 8.4,
          "Upper": 29.7
        },
        "RangeQuality": "player-volatility",
        "HistoryGames": 27,
        "ParticipationCondition": "conditional-on-participation",
        "AvailabilityAdjustmentApplied": false,
        "PointModel": "V4-C",
        "IntervalModel": "V4-C-PI1"
      },
      "Actual": {
        "Points": 21.4,
        "State": "final"
      }
    }

projection:
  statuses:
    available:
      points: required-finite-number
      predictionRange: required
      rangeQuality:
        - player-volatility
        - limited-history-fallback
    insufficient-history:
      points: null
      predictionRange: null
      rangeQuality: unavailable
    no-game:
      points: null
      predictionRange: null
      rangeQuality: unavailable
    unavailable:
      points: null
      predictionRange: null
      rangeQuality: unavailable
  acceptedPointModel:
    id: V4-C
    evidence: issue-697-and-PR-771
    productionImplementationState: productive-materializer
    rule: >
      V4-C is productively implemented by tools/player_week_fantasy_materialize.py.
      The materializer preserves the accepted V4-C model form while recalibrating
      deterministically from completed canonical history under the selected scoring profile.
  predictionRange:
    primaryLevel: 0.90
    acceptedIntervalModel:
      id: V4-C-PI1
      strategy: position-plus-projection-bucket-plus-historical-player-volatility
      evidence: issue-697-and-PR-771
      productionImplementationState: productive-materializer
    rules:
      - Lower and Upper must be finite and Lower <= Upper.
      - Negative lower bounds are allowed when scoring permits negative outcomes.
      - Bounds are prediction limits, not guaranteed floor/ceiling values.
      - Team ranges must not be built by summing player lower/upper bounds.
  historyGames: >
    Count of pregame historical played games available to the uncertainty layer;
    target-week outcome is excluded.
  participationCondition: conditional-on-participation
  availabilityAdjustmentApplied: false
  availabilityRule: >
    Contract v1 does not silently include injury/inactive/DNP probability.
    Availability-aware expectation requires a separately validated model.

actual:
  implementationReuse: tools/historical_fantasy_scoring.py
  derivationRule: >
    Realized fantasy points are derived from canonical NFL scoring evidence plus
    the explicit ScoringSettings profile through the accepted canonical scorer.
    PlayerWeekFantasy must not implement a second scoring engine.
  states:
    pending:
      points: null
    live:
      points: finite-number
    final:
      points: finite-number
    unavailable:
      points: null
  rules:
    - Zero and negative fantasy scores are valid realized values.
    - Unknown/unavailable must never be represented as zero.
    - Finality is separate from score presence and must come from canonical game/finality evidence in the later materializer.
    - Provider fantasy totals remain validation/fallback evidence according to the historical-scoring contract; they are not silently promoted to canonical truth.

dependencies:
  scoringProfile:
    owner: source-data/leagues/<CanonicalLeagueID>/seasons/<season>/league.json::ScoringSettings
    invalidates:
      - Actual
      - Projection
      - PredictionRange
    key: SettingsHash
  weeklyPlayerAnchor:
    owner: source-data/nfl/weekly-rosters/<season>/<week>.json
    invalidates:
      - target-week player population
      - no-game/game association semantics
  actualInputs:
    - canonical player-stats
    - canonical special-teams-fumble-events when active settings require them
    - canonical finality evidence
  projectionInputs:
    - canonical historical player scoring outcomes under the selected scoring profile
    - canonical snap/usage history
    - target-week player/game membership
  leakageGuard: >
    Target-week Actual, snaps, opportunities or outcomes must never enter the
    pregame Projection or PredictionRange feature/calibration path.

consumerBoundary:
  app:
    - public/data/PlayerWeekFantasy.json is the App delivery adapter for the shared PlayerWeekFantasy snapshot.
    - App PlayerID is the active canonical Sleeper mapping when available; CanonicalPlayerID is always retained.
    - Missing active Sleeper identity is represented as PlayerID=null and never name-joined or silently dropped.
    - Angular DataService joins the published value into current FantasyGameContext player rows by App/Sleeper PlayerID only when Season and Week match.
    - The FantasyGameContext join is compatibility-safe: missing publication, duplicate non-null App PlayerID, or Season/Week mismatch leaves the raw context unchanged.
    - Players/Free Agents may join the same published value for unrostered players in a later checkpoint.
  teamProjection:
    pointRule: sum available starter Projection.Points
    appAggregation:
      owner: src/app/core/services/data.service.ts
      sourceLineup: current FantasyGameContext starters plus starter NonGameAssociations
      byeRule: >
        A starter whose NonGameAssociation Kind is bye (known NFL team without a game this week)
        counts as a resolved zero in predictedEndScore and ProjectedFinalScore and is listed in
        ByeStarterPlayerIDs. Kinds unknown and no-team stay unresolved.
      coverageState:
        available: every current starter has Projection.Status=available and finite Points, or is a bye starter
        partial: at least one but not every current starter has an available finite projection
        unavailable: no current starter has an available finite projection
      projectedStarterPoints: sum of all available current-starter Projection.Points
      predictedEndScore: numeric only when coverageState=available; otherwise null so a partial sum is never presented as a complete team expectation
    rangeRule: separate later distribution/simulation aggregation
  liveProjectedFinal:
    rule: >
      final players use Actual; not-started players use pregame Projection; live
      players require a separate remaining-points model. Current points must not
      be added to the full pregame Projection.
    appAggregation:
      owner: src/app/core/services/data.service.ts
      field: FantasyGameContextTeamPrediction.ProjectedFinalScore
      starterRule:
        finalGame: actual FantasyGameContext starter Points; no projection required
        otherGame: max(points scored so far, pregame Projection.Points) as a deliberate interim rule until the live remaining-points model exists
      completeness: numeric only when every current starter is resolved (bye starters count as zero; other non-game starters stay unresolved); otherwise null
      pregameEquivalence: equals predictedEndScore while no starter game has started
    ui:
      owner: src/app/shared/components/league-matchups
      surface: Overview Week Matchups card score plate, secondary row labelled PROJ. below the actual score
      rule: neutral secondary typography, never recolors the score or implies a winner; hidden when the matchup is final or no side has a value
      matchupDialog:
        owner: src/app/shared/components/fantasy-game-context-dialog
        hero: neutral "Proj. left – right" line under the matchup state label, only while the matchup is not final; oriented by the displayed team order
        playerRows: muted "PROJ." value for current starters whose game is not scored yet and whose published projection is available; final or scored games keep showing actual points

matchupProjections:
  output: public/data/MatchupProjections.json
  owner: tools/matchup_projection.py
  inputs:
    - public/data/FantasyGameContext.json
    - public/data/PlayerWeekFantasy.json
  scheduling: tools/player_week_fantasy_refresh.py inside the APP Data League workflow (second rebuild-and-retry step)
  method:
    id: normal-independent-v1
    teamValue: ProjectedFinalScore as defined under teamProjection.liveProjectedFinal; byes count zero
    teamVariance: >
      sum over current starters in games that are not final of sigma squared, with
      sigma = (Upper - Lower) / (2 * z(0.9)) from the starter's 90 percent PredictionRange;
      final-game starters and byes carry no variance
    range: mean +/- z(level) * sqrt(variance) for the published levels 0.5, 0.8 and 0.9
    neverDo: sum player lower/upper bounds (50 to 358 points for a normal team instead of about 151 to 241)
  displayLevel: >
    DISPLAY_INTERVAL_LEVEL in tools/player_week_fantasy.py selects the level every surface shows;
    players and teams switch together and the frontend only reads the published Level.
  publicationRule: week mismatch between the two inputs skips publication and keeps the existing file
  transitional: >
    Angular DataService still aggregates TeamPredictions in the browser until the frontend
    checkpoint switches to this file and removes that arithmetic.
  backtest:
    tool: tools/historical_team_range_backtest.py
    command: python3 tools/historical_team_range_backtest.py --seasons 2024 2025
    protocol: >
      Production PlayerWeekFantasy model rebuilt walk-forward per team-week, actual starters from
      the canonical league matchup partitions, weeks after FinalLeagueWeek excluded (NFL week 18
      was never a fantasy week), weeks whose weekly roster has rows without CanonicalPlayerID
      excluded (2024 W1, W2, 2025 W1), team-weeks with an unprojectable starter skipped.
    result_2026_10_04:
      teamWeeks: {"2024": 90, "2025": 94, "all": 184}
      coverageAt90Percent: {"2024": 0.8778, "2025": 0.8723, "all": 0.875}
      coverageAt80Percent: {"2024": 0.8, "2025": 0.7553, "all": 0.7772}
      coverageAt50Percent: {"2024": 0.4556, "2025": 0.4787, "all": 0.4674}
      tailMissesAt90Percent: {"low": 12, "high": 11}
      residualStdVsPredictedStd: {"2024": [27.2, 27.66], "2025": [29.76, 28.24]}
      calibrationScaleFrom2024: 1.0031
      holdout2025CoverageAt90PercentWithScale: 0.883
    interpretation: >
      Slightly narrow (about 2.5 points below the nominal level at every level) but balanced
      between both tails; no inflation applied. The sample is small (184 correlated team-weeks,
      about +/-2.5 points). Byes and running games are not covered by the backtest.

failClosed:
  - duplicate CanonicalPlayerID within one PlayerWeekFantasy contract
  - malformed or non-finite scoring settings
  - malformed SettingsHash or unsupported fingerprint version
  - mismatched CanonicalLeagueID between root and scoring profile identity
  - non-finite Actual/Projection/range values
  - invalid Actual state/value combinations
  - numeric Projection values for unavailable statuses
  - malformed PredictionRange ordering
  - ambiguous or conflicting canonical-to-app identity during publication

currentCheckpoint:
  implemented:
    - semantic scoring fingerprint
    - scoring-profile identity
    - contract builder/validation
    - Actual derivation delegation to canonical scorer
    - regression coverage
    - physical Shared Derived storage path under derived-data/**
    - current-week materialization
    - V4-C production promotion
    - V4-C-PI1 interval production promotion
    - Sleeper/app publication bridge via public/data/PlayerWeekFantasy.json
    - Angular FantasyGameContext consumer join by published App/Sleeper PlayerID
    - current-starter team PredictedEndScore aggregation with explicit complete/partial/unavailable coverage
    - team ProjectedFinalScore (final starters actual, other starters max(points so far, projection)) shown as PROJ. row on the Overview matchup card and in the matchup dialog
    - scheduled refresh of the current App week inside the existing APP Data League workflow (tools/player_week_fantasy_refresh.py)
  deferred:
    - Players/Free Agents migration
    - team range simulation
    - live remaining-points model
    - UI beyond the Overview matchup card and the matchup dialog (Players/Free Agents)


productionMaterialization:
  implementation: tools/player_week_fantasy_materialize.py
  outputPattern: derived-data/player-week-fantasy/<CanonicalLeagueID>/<season>/<week>.json
  firstAcceptedSnapshot: derived-data/player-week-fantasy/nfl-reise/2026/03.json
  writeSemantics: deterministic-semantic-no-op
  targetPopulation: >
    All canonical weekly-roster QB/RB/WR/TE/FB/K players for the target NFL week,
    independent of fantasy ownership. Status=RET rows are excluded before identity
    validation; other fantasy-relevant rows require CanonicalPlayerID.
  rollingCalibration:
    pointFitSeasons: T-3-through-T-1
    intervalCalibrationSeason: T-1
    intervalCalibrationPointFitSeasons: T-3-through-T-2
    targetWeekRule: >
      For target week W, target-season score/snap/opportunity history may use only
      canonically final weeks < W. Week W outcome and usage never enter its projection.
    scoringRule: >
      Historical outcomes and both model calibrations are re-derived under the
      explicitly selected ScoringSettings. A SettingsHash change therefore invalidates
      Actual, Projection and PredictionRange without requiring a code change.
  currentSeasonFinality:
    authority: source-data/nfl/game-finality/<season>.json::Weeks[].WeekFinal
    rule: >
      Current-season source partitions may remain lifecycle Finalized=false while
      completed weeks are valid history. Only canonical REG WeekFinal=true weeks
      enter projection history, and consumed rows must belong to final GameIDs.
  actualV1:
    rule: >
      Actual becomes final only when the whole target REG week is canonically
      WeekFinal. Otherwise it remains unavailable; live remaining-points semantics
      are deliberately deferred.
  scheduling:
    owner: .github/workflows/update-league.yml (second rebuild-and-retry step, scope player-week-fantasy)
    entrypoint: tools/player_week_fantasy_refresh.py
    targetResolution: >
      League/Season/Week are read from public/data/FantasyGameContext.json so the published
      snapshot always matches the week the Angular join requires. The Sleeper league is mapped to
      the canonical league through source-data/leagues/*/seasons/<season>/league.json ProviderMappings.
    publicationScope:
      - derived-data/player-week-fantasy
      - public/data/PlayerWeekFantasy.json
    notReadyRule: >
      A target week without a synced canonical weekly-roster partition is skipped and the existing
      publication stays untouched. Every other failure fails closed.
    idempotence: Unchanged inputs produce no commit (deterministic semantic no-op).
    projectionStability: >
      The player Projection depends only on canonically final weeks < target week, so reruns during
      the week do not change it; it can only improve when an earlier week becomes canonically final.
  publication: shared-derived-plus-app-publication-bridge-consumed-by-fantasy-game-context
