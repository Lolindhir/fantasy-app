schemaVersion: 2

purpose: >
  Defines the durable player-identity architecture shared by the NFL source-data
  layer, generated app data and historical consumers. It separates the
  application-defined canonical person identity from provider-specific identifiers
  and from the current Sleeper-based application contract.

identityModel:
  canonicalPerson:
    key: CanonicalPlayerID
    owner: source-data/nfl
    namespace: fantasy-app
    issuer: fantasy-app
    semantics: >
      CanonicalPlayerID identifies one real NFL player independently of any
      external provider. It is an application-defined identity owned by this
      repository and must never be interpreted as an identifier issued by the NFL,
      nflverse or another provider. Once assigned to a person its value remains
      stable across provider corrections, provider migrations, historical
      backfills, field-name migrations and future source additions.
    requirements:
      - Never use a display name as an authoritative merge key.
      - Do not rename or regenerate an existing CanonicalPlayerID merely because a new provider ID becomes available.
      - Preserve historical facts that already reference a CanonicalPlayerID.
      - The source-data/nfl path describes the NFL data domain, not the issuer or namespace of CanonicalPlayerID.
      - Any future official NFL-issued player identifier is another external/provider mapping and does not replace or rename CanonicalPlayerID.
    valueCompatibility: >
      Existing opaque canonical ID values remain unchanged during the
      NFLPlayerID-to-CanonicalPlayerID field-name migration. The legacy value
      prefix is not an issuer declaration and must not be regenerated solely to
      match the new field name.

  legacyFieldMigration:
    previousField: NFLPlayerID
    currentField: CanonicalPlayerID
    canonicalSchemaVersion: 2
    rule: >
      NFLPlayerID is a legacy schema label only. Readers may temporarily accept it
      to migrate already persisted v1 source-data, but all new canonical output,
      provider-mapping output, Draft/Combine records, audits and documentation use
      CanonicalPlayerID. Migration changes the field name, not the canonical ID
      value or the person it identifies.
    frozenHistory: >
      Frozen historical partitions may be schema-normalized from the legacy field
      name to CanonicalPlayerID without --force because no historical fact changes.
      Their canonical ID values and all other semantic facts remain unchanged.

  currentAppIdentity:
    path: public/data/Players.json
    field: ID
    provider: Sleeper
    semantics: >
      Sleeper is the leading provider for the current app and league state.
      Players.json[].ID therefore remains the Sleeper player_id used by the
      current Angular and generated-data contracts. This is an app-facing source
      contract, not the permanent cross-provider identity of a person.
    requirements:
      - Do not migrate Players.json[].ID away from Sleeper as part of the source-data identity work.
      - Current Sleeper roster, draft and transaction facts remain authoritative for what happened in the fantasy league where the app currently relies on Sleeper.
      - A Sleeper ID must not be assumed to identify the same person for all historical time without temporal evidence.

  providerMappings:
    semantics: >
      Sleeper, Tank01, GSIS, ESPN, PFR, PFF, OTC, FantasyPros, any future official
      NFL-issued ID and other external identifiers are mappings to
      CanonicalPlayerID. Provider mappings are historical records and may have a
      bounded validity period.
    temporalModel:
      minimumResolution: season
      futureCompatibleWith:
        - FirstObserved
        - LastObserved
        - ValidFrom
        - ValidTo
      rule: >
        The first implementation resolves mapping validity by season. When an
        anchor provider corrects the current value for an already reconciled
        CanonicalPlayerID, a stale mapping observed only in the same current season
        is replaced rather than pretending to be valid for the entire season. If
        that old mapping reaches into earlier seasons, preserve the historical
        interval and close it before the current observation season. This contract
        must remain forward-compatible with more precise observation/validity
        intervals later.
    activeVsHistoricalLinks:
      rule: >
        source-data/nfl/identities/players.json represents the active canonical
        provider bridge, not an append-only bag of every identifier ever observed.
        If current corroborated evidence for a CanonicalPlayerID supplies a
        different value for the same provider, the stale persisted latest-snapshot
        value is not promoted to an active IDAlias. Historical validity belongs in
        provider-mappings.json with a non-overlapping interval when it is actually
        supported by earlier observations.
    provisionalAppReconciliation:
      provisionalSources:
        - app.Players
        - app.Players.git.*
      replacementEvidence:
        - corroborated external historical crosswalk claim
        - unique current claim jointly observed by app.Players and at least one non-app source
      rule: >
        Generated app player snapshots may bootstrap a provisional provider mapping
        when no durable bridge exists yet. A season-local replacement is allowed in
        two bounded cases: a historical crosswalk claim that has already passed the
        independent non-Sleeper corroboration contract, or a unique current claim
        whose persisted conflict provenance shows that app.Players and at least one
        non-app source both resolve the same provider token to the same current
        CanonicalPlayerID. In either case every competing active mapping for that
        provider token in the exact season must be supported only by provisional
        app.Players evidence. Only that season may be retired from the provisional
        interval; surrounding seasons remain unchanged. Any competing
        non-provisional mapping, multiple jointly corroborated current owners, or
        unrelated active conflict keeps the token fail-closed. Replacements are
        persisted in HistoricalMappingReconciliations provenance with a reason that
        distinguishes historical-claim from current-claim evidence; they must never
        happen silently and display names are not evidence.
    conflictRules:
      - A provider ID collision must never merge two otherwise distinguishable people.
      - If one provider ID claims multiple distinct CanonicalPlayerIDs for an overlapping period, quarantine the provider mapping as ambiguous or conflicting.
      - Quarantining one provider mapping must not discard unrelated corroborated mappings for the same person unless those mappings are independently contradictory.
      - Do not choose a winner silently and do not add provider-specific or player-specific hard-coded identity exceptions as the primary conflict strategy.
    currentAdjudication:
      source: source-data/nfl/identities/current-identity-adjudications.json
      documentation: source-data/nfl/identities/current-identity-adjudications.md
      provenancePrefix: manual.current-identity-adjudication
      role: bounded-human-reviewed-current-provider-reassignment
      runtimeStatus: consumed-by-identity-builder
      rule: >
        Rare current-season provider identity gaps that remain unresolved after the
        ordinary automated corroboration rules may be represented by an explicit,
        versioned adjudication contract. A current adjudication targets one already
        existing durable CanonicalPlayerID, names one or more already existing
        source/provisional CanonicalPlayerIDs and enumerates exactly which provider
        tokens may be reassigned for one NFL season. It never creates or renames a
        CanonicalPlayerID, never bulk-merges two identity records, never turns
        display names into merge evidence and never rewrites raw provider evidence.
        Checkpoint 6Z.7 established the source contract and fail-closed validator;
        Issue #347 B5 integrates the confirmed decisions into the productive
        identity builder (see integration below).
      integration:
        status: implemented-347-b5
        implementation: >
          tools/nfl_source_data_lib/identity.py (current_identity_adjudication_state,
          _apply_current_adjudications, called from build_identities before the app
          candidates and components are built) and provider_mappings.py
          (_retire_transferred_claims with reason
          current_identity_adjudication_transfers_current_claim).
        rule: >
          Before components are built the builder loads the confirmed decisions for
          the observation season and validates them against the persisted pre-build
          identity graph and provider mappings (any contradiction raises and fails
          the materialization closed). Decisions reported obsolete are not applied.
          An applicable decision is applied to the candidate evidence, not by an
          ad-hoc merge: the declared source records give up the assigned provider
          tokens, the target's persisted record carries them (an existing different
          value is never replaced), and for upstream-claim-override the named
          upstream claim is removed from the named upstream source and from the
          target. The ordinary component builder then attaches the current provider
          evidence to the target. No CanonicalPlayerID is created, renamed, merged
          or deleted, and raw provider evidence is not rewritten.
        movableTokens: >
          The decision's ProviderAssignments. For upstream-claim-override
          additionally the token under an independent anchor's SourceProvider (the
          link between the two records, for example Tank01 on the replacement record
          equal to ESPN on the target); no other unlisted token transfers.
        provenanceAndDiagnostics:
          - Every moved provider claim carries manual.current-identity-adjudication:<AdjudicationID> in its Sources and TransferredFromCanonicalPlayerIDs.
          - The previous owner's current-season mapping and conflict for a moved token are retired with a HistoricalMappingReconciliations entry (reason current_identity_adjudication_transfers_current_claim); earlier seasons stay.
          - An overridden upstream claim stays visible as an identity source conflict with reason upstream_claim_overridden_by_current_adjudication. The historical mapping interval of that claim is not rewritten.
        replay: >
          A replay finds the tokens already on the target; the result is identical.
          A decision whose replacement token the target already carries is reported
          superseded-by-upstream and keeps suppressing the overridden upstream claim
          for as long as the upstream still makes it.
      requirements:
        - Status must be confirmed; unresolved review candidates do not belong in the canonical current-adjudication source.
        - ResolutionKind is either current-provider-reassignment with ConflictPolicy reject-active-conflict, or upstream-claim-override with ConflictPolicy override-named-upstream-claim (see currentIdentityGapResolution.classes.wrongUpstreamClaim).
        - Every decision requires a stable AdjudicationID, exact Season, DecisionAuthority, DecisionDate, rationale and non-empty evidence references.
        - TargetCanonicalPlayerID and every SourceCanonicalPlayerID must already exist in the persisted canonical identity graph, and the target must not also be listed as a source.
        - ProviderAssignments enumerate the only Provider plus ExternalID tokens the decision may reassign; no unlisted provider value transfers implicitly.
        - A decision is active only for its exact observation season and must not silently carry into a later season.
        - For current-provider-reassignment, the target must not already carry a different active value for an assigned provider.
        - An assigned provider token must not be owned by an undeclared third CanonicalPlayerID.
        - A current-provider-reassignment must fail closed rather than override an active provider conflict, with one exception: a conflict whose parties are exactly the declared target and declared sources is the split the decision resolves (a persisted empty provisional record and the full record both claiming the token). Any third party in an active conflict for the token keeps it fail-closed. Otherwise only upstream-claim-override may resolve a conflict, and only the exact upstream claim it names.
        - Productive materialization retains manual.current-identity-adjudication:<AdjudicationID> provenance on every moved provider claim and is replay-idempotent.
        - Any future reversal or correction must be explicit and versioned; generated canonical identity or provider-mapping output must never be hand-edited as the source of truth.
    currentIdentityGapResolution:
      status: accepted-partially-implemented
      implementedSteps:
        - upstream-claim-override loader and state validator (tools/nfl_source_data_lib/current_identity_adjudications.py) (#347 B3)
        - productive consumption of the confirmed adjudication entries in the identity builder (#347 B5)
        - openGapHold and gap classification in the population audit (fantasy-management/_ai/scripts/audit_player_signal_population_policy.py with identity_gap_classification.py), analysis only (#347 B3)
      trackingIssue: 347
      decidedAt: 2026-10-04
      purpose: >
        A current identity gap is a current-season player whose provisional
        CanonicalPlayerID differs from a durable CanonicalPlayerID that current
        canonical NFL data attributes to the same real person. Gaps are found by the
        player-signal population audit through an exact normalized name plus
        fantasy position diagnostic; that diagnostic only detects candidates and is
        never merge evidence. This contract classifies every gap, assigns one
        resolution mechanism per class and defines how an open gap behaves until it
        is resolved, so that a single case can neither block the whole Phase 2
        migration nor be silently removed or merged.
      classes:
        placeholderGsisUpgrade:
          resolution: automatic
          pattern: >
            One record carries a placeholder GSIS value (not matching ^00-\d{7}$; in
            nflverse this is the player's ESB value repeated in the GSIS field) or no
            GSIS, while the other record carries a valid GSIS. Both records carry the
            same ESB value.
          rule: >
            The identity builder may treat the shared ESB value as the bridge between
            the two records only in this pattern, only when the ESB value occurs on
            exactly these two records, and only when no other provider ID present on
            both records disagrees. The provider tokens of the placeholder record
            transfer to the record with the valid GSIS for the current season, with
            provenance auto.placeholder-gsis-upgrade:<ESB>. Neither CanonicalPlayerID
            is renamed, regenerated or deleted. Placeholder GSIS values in general
            stay untouched; this rule does not reinterpret them as conflicts.
          implementation: >
            Implemented in tools/nfl_source_data_lib/identity.py
            (_placeholder_gsis_upgrades, _apply_placeholder_gsis_upgrades). Components
            are matched after ordinary merging. In addition to the rule above, both
            components must carry exactly the shared ESB value and no contradicting
            birth date. Only current candidates move; persisted canonical-existing
            candidates stay, so no CanonicalPlayerID is merged. The placeholder GSIS
            value itself is not transferred. Moved claims carry the source
            auto.placeholder-gsis-upgrade:<ESB>. provider_mappings.py retires the
            previous owner's current-season mapping and conflicts for each moved token
            and records a HistoricalMappingReconciliations entry with reason
            placeholder_gsis_upgrade_transfers_current_claim; earlier seasons stay.
            The rule is re-evaluated on every materialization and is idempotent: once
            the transferred ESPN/PFR/Sleeper tokens link both persisted records into one
            component again, _split_merged_placeholder_components splits it back along
            the two persisted CanonicalPlayerIDs when the pair still satisfies the rule;
            any other component with two persisted IDs keeps failing closed.
          observedOn2026-10-04: 8 ESB pairs repository-wide, among them current gap Layne Pryor
          effectOn2026-10-04: >
            Only two of the eight pairs carry current evidence on the placeholder
            record (Layne Pryor, Paschal Ekeji); for the other six the persisted
            identities do not change.
        splitIdentity:
          resolution: human-reviewed adjudication (ResolutionKind current-provider-reassignment)
          pattern: >
            Two partial records of the same person share no provider ID. Typically
            nflverse.players or rosters know GSIS/PFR/NFL IDs while the app/Sleeper
            record knows Sleeper/Tank01/ESPN IDs, because the external crosswalk has
            not yet caught up with a young or newly signed player.
          rule: >
            Use the existing current adjudication. Evidence must go beyond name and
            position (for example matching team in current canonical rosters, matching
            ESPN/Tank01 token, birth date). An adjudication whose assignments the
            automatic rules later reproduce on their own is reported as
            superseded-by-upstream and may then be retired by an explicit versioned
            change.
          observedOn2026-10-04: Grant Finley, Gregory Desrosiers, Roydell Williams
        wrongUpstreamClaim:
          resolution: human-reviewed adjudication (ResolutionKind upstream-claim-override)
          pattern: >
            An upstream crosswalk assigns a provider token to the durable record that
            the provider's own platform data contradicts, which creates an active
            provider conflict.
          rule: >
            An upstream-claim-override names exactly one upstream claim (Source,
            Provider, ExternalID, TargetCanonicalPlayerID) that is declared wrong for
            one Season, and the replacement token for the same provider. It requires
            at least one independent strong anchor (GSIS, ESPN, PFR or PFF) that ties
            the replacement token's record to the durable record, plus platform-data
            consistency of the replacement token (position and current team) and
            documented inconsistency of the overridden token. Raw upstream evidence is
            never rewritten; the overridden claim stays visible in conflict
            diagnostics with provenance manual.current-identity-adjudication:<AdjudicationID>.
            If the upstream claim changes or disappears, the override is reported as
            obsolete instead of being applied silently.
          observedOn2026-10-04: >
            Sam Hartman. nflverse ff-player-ids assigns Sleeper 11376 to the durable
            record; Sleeper lists 11376 as an OL without team. Sleeper 11558 is the QB
            at WAS, and its Tank01 ID 4361994 equals the durable record's ESPN ID.
      openGapHold:
        rule: >
          A gap that matches one of the classes but is not yet resolved is
          classified-open. A classified-open player keeps the population membership
          it had before the cutover (status identity_hold) and does not block a
          consumer cutover. Only unclassified gaps block, and they keep blocking
          until they are classified. A hold never merges, never removes and never
          grants new canonical facts.
        reporting: >
          The population audit reports classified-open and unclassified gaps
          separately, with class and age in days, so a long-standing hold stays
          visible. Age counts days since the class contract was accepted
          (2026-10-04) until a persisted first-seen state exists. The audit
          decision_status is blocked_on_current_canonical_identity_coverage only
          while an unclassified gap exists, and
          policy_ready_for_runtime_cutover_design_with_identity_hold while only
          classified-open gaps remain. Classification is structural (provider ID
          tokens of the provisional and the durable record, never names); a gap
          that matches no class stays unclassified and keeps blocking.
        upstreamClaimOverrideEntryShape:
          requiredFields:
            - ResolutionKind upstream-claim-override with ConflictPolicy override-named-upstream-claim
            - ProviderAssignments with exactly one replacement token
            - OverriddenUpstreamClaim (Source, Provider, ExternalID); Provider equals the replacement provider, ExternalID differs from the replacement
            - IndependentAnchors (non-empty); Provider is one of GSIS, ESPN, PFR, PFF and differs from the overridden provider; optional SourceProvider names the provider key under which the replacement record carries the same value (for example ESPN on the target equals Tank01 on the source)
            - ReplacementTokenConsistency (Position, Team, Summary)
            - OverriddenTokenInconsistency (Summary)
          stateValidation: >
            Reports each decision as active, obsolete (the named upstream claim
            changed or disappeared) or superseded-by-upstream (the target already
            carries the replacement token). For an active override it fails closed on
            an active conflict or undeclared owner of the replacement token, a
            replacement token not carried by a declared source record, an anchor not
            carried by the target (or its value missing on the source), and a
            declared position that differs from the target. Declared team and the
            platform consistency itself are reviewed evidence and are verified by the
            productive integration step, not by this validator.
      implementationOrder:
        - placeholderGsisUpgrade rule in the identity builder with an identity diff limited to the observed ESB pairs (implemented, Issue #347 B2)
        - upstream-claim-override loader/validator and the openGapHold rule in the population audit
        - reviewed adjudication entries for the open splitIdentity and wrongUpstreamClaim cases
        - productive consumption in the identity builder (current adjudication integration steps 1-7; implemented, Issue #347 B5)
    historicalAdjudication:
      source: source-data/nfl/identities/historical-identity-adjudications.json
      provenancePrefix: manual.identity-adjudication
      role: bounded-human-reviewed-evidence
      rule: >
        Rare historical provider tokens that remain unresolved after the ordinary
        automated corroboration rules may be confirmed through an explicit,
        versioned adjudication. An adjudication confirms exactly one Provider plus
        ExternalID plus Season observation to an already existing
        CanonicalPlayerID. It never creates a canonical person, never turns display
        names into merge evidence, never weakens the ordinary automatic
        corroboration thresholds and never rewrites raw provider evidence.
      requirements:
        - Status must be confirmed; unresolved review candidates do not belong in the canonical adjudication source.
        - Every decision requires a stable AdjudicationID, DecisionAuthority, DecisionDate, rationale and non-empty evidence references.
        - The target CanonicalPlayerID must already exist in the canonical identity graph.
        - A confirmation is valid only for its exact provider token and observed season.
        - A confirmed season may join same-owner intervals only when that observation makes them contiguous; it must not bridge another unobserved gap.
        - An adjudication must fail closed rather than override an active provider conflict or a different season-valid owner.
        - Historical provider disagreements remain preserved in conflict diagnostics even when a separate provider token is adjudicated.
        - Materialized provider-mapping provenance must retain manual.identity-adjudication:<AdjudicationID> so the human decision remains auditable and reversible by an explicit later correction.

historicalResolution:
  rule: >
    Historical facts must be anchored to the CanonicalPlayerID that was resolved
    for the event or season when the canonical historical dataset is materialized.
    Keep the original provider ID and provenance as supporting evidence, but do not
    re-interpret an old trade, draft pick, roster snapshot or other historical
    event only through today's provider mapping.
  example: >
    If Sleeper ID 1000 maps to CanonicalPlayerID A in an earlier season and the
    same external value is later reused for CanonicalPlayerID B, the earlier
    historical fact remains linked to A and the later fact can resolve to B
    without corrupting either record.

mergeEvidence:
  names: descriptive-only
  principle: >
    Identity resolution may use corroborated provider IDs, birth dates and other
    strong evidence, but no single provider mapping is allowed to transitively
    collapse two conflicting person identities. In particular, Sleeper remains
    important for app resolution while still being treated as an external mapping
    in the permanent identity graph.
  authoritativeReplaySource: nflverse.players
  providerLinkCorrection:
    rule: >
      Current-vs-current provider disagreement keeps the ordinary strict alias
      thresholds. During replay of an already persisted CanonicalPlayerID against
      the authoritative current nflverse.players row, an exact birth date may act
      as one additional independent corroborator for a single aliasable strong
      provider-ID correction, but only when at least one strong provider anchor is
      still shared and no additional provider ID contradicts the match. The
      corrected current value becomes the active provider link; the stale persisted
      latest-snapshot value is not retained as an active alias. Names do not
      participate in this exception.
  currentCrosswalkBirthDateCorrection:
    crosswalkSource: nflverse.ff-player-ids
    authoritativePersonSource: nflverse.players
    minimumSharedStrongAnchors: 4
    rule: >
      A current crosswalk birth-date mismatch remains fail-closed unless at least
      four independent strong provider anchors from that same crosswalk row each
      resolve to one identical nflverse.players birth date and no resolved strong
      anchor points to another birth date. In that bounded case only the in-memory
      crosswalk candidate adopts the authoritative nflverse.players birth date so
      its provider IDs can participate in identity reconciliation. Raw source bytes
      are never changed, the mismatch remains explicitly audited with birthdate-only
      scope, and names do not participate. With fewer than four corroborators or
      any counter-evidence the existing row/mapping quarantine behavior remains.
  canonicalBirthDateCorrection:
    authoritativeCurrentSource: nflverse.players
    strongOnlyMinimumSharedAnchors: 3
    mixedEvidenceMinimumSharedStrongAnchors: 2
    mixedEvidenceMinimumSharedSecondaryProviderIDs: 2
    rule: >
      Outside the explicitly bounded current-crosswalk rule above, a birth-date
      mismatch remains fail-closed for current-vs-current identity evidence and for
      weakly corroborated replay. A previously persisted canonical identity may
      reconnect to current nflverse.players evidence across a corrected birth date
      only when no provider ID contradicts the match and either at least three
      independent strong provider anchors agree, or at least two strong anchors
      plus two additional secondary provider IDs agree. The stable CanonicalPlayerID
      is preserved and the current nflverse.players birth date replaces the stale
      persisted value. Display names are never evidence for this reconciliation.

metadataSeparation:
  appReadModels:
    paths:
      - public/data/Players.json
      - public/data/League.json
      - public/data/Drafts.json
      - public/data/Transactions.json
    rule: >
      Do not add technical generation or freshness fields such as GeneratedAt,
      GeneratedAtUtc or UpdatedAt to domain records merely to track pipeline
      execution. App read models remain focused on domain/display data.
  technicalMetadata:
    rule: >
      Fetch time, generation time, content hashes, freshness, provenance and
      similar operational metadata belong in dedicated timestamp, manifest,
      metadata, audit or sidecar structures.
  semanticNoOp:
    rule: >
      A materialization over semantically unchanged source data must not rewrite a
      canonical identity or historical dataset only because the pipeline ran at a
      different time. Runtime timestamps must therefore not participate in the
      semantic payload comparison of those datasets.

boundaries:
  - source-data/nfl owns provider-independent NFL-domain identities and historical provider mappings; the path name does not imply NFL-issued identifiers.
  - public/data remains generated app output and is not the source of truth for cross-provider identity history.
  - fantasy-management may consume the canonical identity bridge but does not own the app player identity contract.
  - public/data/PlayerWeekFantasy.json is the first explicitly designed App publication carrying CanonicalPlayerID beside the existing Sleeper-based PlayerID; unresolved active Sleeper identity stays PlayerID=null, duplicate/conflicting mappings fail closed, and no name fallback is allowed.
  - Any further CanonicalPlayerID integration into existing generated App contracts remains a separate scoped contract change with explicit validation.

implementationOrder:
  - Add regression coverage for conflicting, corrected and historically reused provider IDs.
  - Establish person identity before ambiguous provider mappings can join components.
  - Keep active provider links separate from historical mapping validity and quarantine overlapping conflicts.
  - Anchor canonical historical NFL datasets to CanonicalPlayerID plus source provenance.
  - Ensure identical materialization is a real semantic no-op.
  - Re-run the real-source bootstrap and inspect identity and draft coverage before expanding downstream integration.
