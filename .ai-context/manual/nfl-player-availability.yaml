schemaVersion: 1
status: active-product-v3
trackingIssue: 1590
v2TrackingIssue: 1610
architectureDecision: ADR-092
purpose: >
  Global, league-independent Shared Derived product NFL Player Availability (nfl-player-availability-v3, v2 or v1 until the next regeneration): per player and week the
  separate evidence for an observed injury report, the NFL roster status, participation and the game/bye situation, plus a documented
  derived State. It is the availability layer for the player-detail injury history and for Fantasy Injury Impact (Issue #1584).
  It makes no medical, onset, return-date, games-missed, probability or pre-kickoff claim.

ownership:
  product: data-derived/nfl-player-availability/<season>.json
  materializer: tools/nfl_player_availability_materialize.py
  pureFunction: tools/derived_data_lib/nfl_player_availability.py
  appDelivery: public/data/PlayerInjuryHistory.json
  appGenerator: tools/player_injury_history_app_publish.py
  currentInjuryStatus: >
    Unchanged: the latest status stays exclusively with Sleeper state (Players.json Injured/InjuryDetails,
    nfl-injuries.yaml). This product is retrospective evidence per week; it never replaces or merges the current status.

identity:
  key: Season + Week + CanonicalPlayerID
  note: Team and GameID are attributes of the record, not part of the key. A player with several teams in one week keeps the roster team.
  unresolvedIdentity: >
    A report observation without CanonicalPlayerID is not recorded and counted in Quality.ReportObservationsWithoutIdentity.
    No name fallback.

inputs:
  - data-derived/nfl-injuries/<season>.json (nfl-injuries-v1, never re-derived from Canonical)
  - data-source/nfl/weekly-rosters/<season>/<week>.json (Status, StatusDescription, Team, GameType, Position)
  - data-source/nfl/snap-counts/<season>/<week>.json (from 2013)
  - data-source/nfl/player-stats/<season>/<week>.json (from 1999, used as participation fallback)
  - data-source/nfl/schedules/<season>.json and game-finality/<season>.json
inputRules:
    - Consumers (App generator, Fantasy Injury Impact) read only the product, never these inputs for the history.
    - Seasons are discovered, not listed (injury product seasons plus roster seasons whose Status column is populated).

population:
  rule: >
    v2 (Issue #1610, Robert 2026-11-22): a player-week is recorded when (a) the player has an observed report row (any status), OR
    (b) the NFL roster status is RES or PUP, OR (c) in a season whose roster status column exists (data-driven, from 2016) the roster status is
    ACT or INA and the roster position is in the position cut. Report and reserve weeks of every position stay in every season. The position cut
    is QB, RB, WR, TE, K (FANTASY_POSITIONS, a documented product policy; the function parameter healthy_positions=None means all positions).
    Issue #1616 (Robert 2026-11-22) extends this within the same version: (d) every other non-null roster status (DEV practice squad, CUT, RET,
    SUS, EXE and so on) of a position in the cut is a record (G2, State not-on-active-roster, Available no), and (e) a bye week without a roster row is
    a record (G1, see byeRecords). Quality.Population.ByeWeeksIncluded and OtherRosterStatusesIncluded mark files that carry both.
    Seasons without roster status (before 2016) keep the v1 population (report weeks only); the coverage is stated in Quality.Population
    (RosterWeeksIncluded false). A postseason week in which the team has no game produces no record (it is not a bye).
    The denominator is therefore explicit: a consumer never derives healthy or available from a missing record within the cut; a missing record
    means the player is outside the position cut, the season has no roster status, or the player has no NFL roster row at all in that season
    (for example a free agent never signed that year): "no NFL roster row" is its own case for consumers, never healthy and never a bye.
  sizeMeasuredIssue1616: >
    G1 and G2 together measured on the persisted data before the first write: about 86 MB for 2016 to 2026 against 71 MB (about +21 percent):
    about 1,000 bye records and about 3,600 to 7,100 not-on-active-roster records per season (DEV and CUT dominate). Check on the league rosters 2026 weeks 1 to 10:
    player-weeks without a record fell from 151 to 9 (all nine belong to one player without any NFL roster row in 2026).
  sizeMeasured: >
    v1: about 3 to 4 MB per season from 2016, about 44 MB for 2009 to 2026. v2 with the fantasy-position cut: about 5.5 to 6 MB per season, about 71 MB in total
    (about 1.6 times v1). All positions would have measured about 10 to 11 MB per season and about 121 MB (2.7 times) and was not chosen.
    Healthy scratches measured per season from 2016: about 1,100 to 1,600 (fantasy positions) against about 2,600 to 3,800 (all positions).

evidenceFields:
  Report: >
    List of distinct observed report entries {Game, Practice, Reasons[]} taken from nfl-injuries-v1 (null when the week has no
    observed report). Blank statuses are null, not healthy. Multiple entries are kept, not ordered.
  Roster: >
    {Status, Code} of the NFL weekly roster row (null when the week has no roster row for the player). Status is null before 2016
    (the source has no status column then); it stays null, never inferred.
  Participation: >
    {State: played | not-played | unknown | no-game, Evidence}. Evidence is snap-counts, player-stats, snap-counts-token-excluded, snap-counts-identity-gap,
    game-not-final, cancelled-game, team-unresolved or bye; null when no evidence source covers the game.
    v3 (Issue #1612): Evidence may also be participation (nflverse pbp_participation, GSIS on-field plays) or participation-conflict, and
    Plays is the distinct play count of the player in that game from data-source/nfl/participation (null without a row or without the
    dataset; absence is never evidence).
  Team: roster team, else the first report source team; normalized to the schedule abbreviation of that season (franchise aliases).
  GameID: canonical schedule game of the team in that week, null for bye, cancelled or unresolved team.

participationRules:
  played: a snap-counts row with more than zero snaps, or a player-stats row of that game (stats rows exist only for players who took part).
  not-played: the game is covered by snap counts (any row of the GameID), the player has neither snaps nor a stats row, and no snap row of the
    same team and game lacks a CanonicalPlayerID (such a row could be this player) - or such rows exist but the player has own PFR tokens
    (data-source/nfl/identities/players.json IDs.PFR plus IDAliases.PFR) and none equals the SourceIDs.PFR of an identity-less row of that
    team and game (evidence snap-counts-token-excluded). The token index is a declared input handed in by the materializer
    (Inputs.PfrTokenIndexAvailable); a changed identity mapping changes the output on the next regeneration. An identity-less row without
    any PFR token, or a player without own PFR token, keeps the gap.
  v3Participation: >
    Declared input data-source/nfl/participation/<season>.json (compact positive-only projection, Inputs.ParticipationAvailable). Versioned model
    parameters (Inputs.ParticipationParameters): a player whose participation would be unknown (no snap/stat evidence, or a snap identity gap that is
    not excluded) with at least MinPlaysUnknownToPlayed = 1 plays is played (evidence participation). A player whose snap rows say not played
    (snap-counts or snap-counts-token-excluded) but who has at least MinPlaysConflict = 5 plays becomes unknown (evidence participation-conflict, Played null),
    never played: two independent sources disagree and neither is overwritten. Fewer plays keep not-played (a single play is usually a no_play entry).
    Snap or stat evidence of played always wins and only gains Plays. The first regeneration changed 48 of about 215,000 records over 2016 to 2025
    (42 unknown to played, 6 not-played to unknown).
  unknown: game not final; no snap coverage and no stats row (always the case for a missing stats row before 2013); snap-counts identity gap of the team when the player's own PFR token cannot be excluded.
  cancelled: the 2022 week 17 BUF@CIN game is absent from the canonical schedule and never counts as played (state unknown, evidence cancelled-game).

state:
  taxonomy:
    played: Participation played (a report row may exist, for example Questionable and played).
    not-played-reported: final game, not played, a report row exists. The report is the recorded reason, the roster status is shown next to it.
    not-played-reserve: final game, not played, no report row, roster status RES or PUP.
    not-played-unexplained: final game, not played, no report row, no reserve status. Reachable only through a future wider population; v1 population cannot produce it.
    bye: a regular-season week without a game of the team (a report or reserve row exists for that week).
    unknown: missing evidence (see participation unknown). Never healthy, never available.
  v2Additions:
    healthy-scratch: >
      final game, not played, no report row, roster status ACT or INA (available, not dressed or not used). Replaces not-played-unexplained for
      these statuses; not-played-unexplained remains only for other roster statuses without a report or reserve signal and is practically unreachable.
    Available: >
      Separate field per record, yes | no | unknown | bye. bye: every record with State bye (Issue #1616 follow-up, Robert 2026-11-22; explicit not-applicable value instead of null or unknown). no: roster status RES or PUP, or an observed game status Out or Doubtful. yes: roster status ACT or INA
      without such a status. unknown: any other roster status or no roster row (pre-2016 report weeks, for example). A Questionable or blank game status
      does not make a player unavailable. Available is evidence of availability, independent of Played: Out and played stays Available no, Played true.
      A cancelled week carries the same evidence rules and is excluded through Participation (unknown); a bye week is always Available bye.
    Played: >
      true | false | null, from Participation: played is true, not-played is false, unknown and no-game are null. Missing evidence is null, never false.
  v2AdditionsIssue1616:
    not-on-active-roster: >
      Roster status other than ACT, INA, RES, PUP (DEV, CUT, RET, SUS, EXE and so on) of a position in the cut, no report row, game final and not played.
      Available is no for every such status (the statuses mean the player is not on the active roster; confidence per status is in rosterStatusCodes).
      A played participation stays played, a report row keeps not-played-reported, missing evidence stays unknown.
    bye: now also synthesized without any report or reserve signal (see byeRecords).
  byeRecords:
    rule: >
      A regular-season week in which the team has no game, for a player whose roster row of the directly preceding week is a regular-season row with a
      status in BYE_CARRY_STATUSES (ACT, INA, RES, PUP, DEV, SUS, EXE; confidence: attached-to-team statuses) and a position in the cut (RES and PUP
      of every position, as in the population), and who has no roster row in the bye week. The team is the one of that preceding roster week, so a
      team change around the bye keeps the pre-bye team. CUT, RET, TRD and similar statuses end the attachment and never produce a bye record.
    values: State bye, Available bye, Played null, Participation {no-game, bye}, Roster null, GameID null.
    noteOnIssueText: Issue #1616 named Available null; Robert chose the explicit value bye on 2026-11-22 so that a bye is never mistaken for missing evidence (null, unknown). It also applies to a bye week that has a roster row.
    postseason: A postseason week without a game of the team never produces a record.
    cancelled: The hand-maintained cancelled game (2022 week 17 BUF and CIN) keeps Participation unknown with evidence cancelled-game.
  note: State is a derivation for display and for downstream consumers; the evidence fields are the facts.

rosterStatusCodes:
  source: nflverse weekly rosters (Status and StatusDescription). Meanings below are the repository's documentation; confidence is stated.
  status:
    ACT: Active roster. Confidence high.
    INA: Game-day inactive (active roster, not dressed). Confidence high. Not a population signal in v1.
    RES: Reserve list (includes injured reserve). Confidence high. Population signal, state not-played-reserve.
    PUP: Physically unable to perform list. Confidence high. Population signal, state not-played-reserve.
    DEV: Practice or development squad. Confidence high.
    CUT: Released. Confidence high.
    RET: Retired. Confidence high.
    SUS: Suspended. Confidence medium. Not an injury signal; a record since Issue #1616 (not-on-active-roster).
    NWT, RSN, RSR, EXE, TRC, TRD, TRT, UFA, RFA, UDF, E01, E14: other transaction or reserve variants. Meaning unverified; recorded as seen and never interpreted. Since Issue #1616 they are records (not-on-active-roster, Available no) for the position cut; only the status name is evidence, not its meaning.
    "null": the season has no status column (before 2016).
  descriptionCodes:
    A01: Active. Confidence medium.
    I01, I02: Inactive variants. Confidence low, shown raw.
    R01: Injured Reserve. Confidence high (as named by the issue and observed with RES).
    R48: Injured Reserve with return marker (designated to return). Confidence medium.
    R04: PUP reserve. Confidence medium.
    other R-codes (R02, R05, R06, R23, R27, R30, R40, R59, R62 and so on): meaning unverified; the UI shows only the status group, not the code.
    P-codes (P01 to P12), W03, E02: development, waiver and exempt variants. Meaning unverified.
  rules:
    - Contradicting pairs exist (for example RES with A01). They are stored as seen; the product never corrects them.
    - The code table is documentation; no behavior except the RES/PUP population and state rule depends on a code.
    - Only a status or code that appears with a documented confidence may be shown with a label in a consumer; unknown codes are shown raw or not at all.

quality:
  perSeason:
    - RecordCount and StateCounts
    - ReportObservationsWithoutIdentity
    - WeekCoverage[] per week: Games, FinalGames, GamesWithSnapCounts, RosterPartition
    - Inputs.RosterStatusAvailable, SnapCountsAvailable, PlayerStatsAvailable, InjuryProduct (null when no report product exists)
  coverageNotes:
    - Snap counts exist from 2013; earlier seasons can only prove played (stats row), never not-played (unknown).
    - Roster status exists from 2016; earlier seasons have report rows only.
    - Weekly roster partitions list only teams that play; a bye-week player has no roster row, so since Issue #1616 the bye record is synthesized from the preceding week (byeRecords).
    - The roster Status is a weekly snapshot, not a transaction date.

dependencyInvalidation:
  dependsOn: nfl-injuries-v1 product, weekly rosters, snap counts, player stats, schedule, game finality, the product version.
  recompute: every run rebuilds all seasons from persisted inputs and writes a season file only on a byte difference (semantic no-op, no timestamps).
  versioning: ProductVersion nfl-player-availability-v3 (SchemaVersion 3; v2 and v1 files stay readable until the writer regenerates them, Monday full run or the next injury run). A rule change is a new ProductVersion and a regenerated product.

publication:
  writer: >
    The existing nfl_injuries_derived job of sync-nfl-source-data.yml (rebuild-and-retry, scope nfl-availability-derived, prefix
    data-derived/nfl-player-availability). It runs after every Injury Source update (daily in September to February) and on the Monday
    historical reconciliation, so the product follows the roster, snap and stats inputs of the daily NFL Source sync with at most the lag
    of the next injury run (current season) or the next Monday (outside the injury window). Historical rederivation is the Monday run
    (data-sources.yaml historicalReconciliationStandard). No new workflow, schedule or credential.
  appFile: >
    The existing update-players.yml writer renders PlayerInjuryHistory.json (prefix public/data, already declared) after Players.json,
    fail-soft, only on a semantic difference, Timestamps.json key PlayerInjuryHistory.
  restoreProbe: tools/derived_clean_root_audit.py builds the product after nfl-injuries from clean-root data (global product).

appDelivery:
  file: public/data/PlayerInjuryHistory.json
  shape: >
    {ContractVersion 1, Product (follows the product version, the only change v1 to v2), Coverage[{Season, ReportsAvailable, RosterStatusAvailable, SnapCountsAvailable}],
    Players[{ID (Sleeper), Seasons[{Season, Weeks[{Week, GameType, Team, State, Participation, Report, Roster}]}]}]}
  rules:
    - Pure reshaping of the product; no derivation in the generator.
    - v2: the generator keeps publishing only signal weeks (report row or RES/PUP status) so the file stays equal to its v1 content; healthy roster weeks, Available and Played are not copied (Issue #1610 step 4).
    - The population follows players_population.build_population (ADR-043, all configured leagues, current season) and can differ from Players.json (for example while Players.json is not yet refreshed); Sleeper ID to CanonicalPlayerID through data-source/nfl/identities/players.json (the canonical identity owner).
    - The file is loaded lazily by the player-detail Injury tab (History).

notInScope:
  - Fantasy or league calculations (Fantasy Injury Impact is Issue #1584 and reads this product).
  - Current injury status (Sleeper) and ESPN scoring availability (Issue #669).
  - Diagnosis, onset, return date, games missed, start probability, pre-kickoff knowledge.

validation:
  tests: tools/tests/test_nfl_player_availability.py, tools/tests/test_player_injury_history_app_publish.py
  persistedStateGuard: tools/tests/test_nfl_player_availability.py PersistedStateGuard (every roster week of the cut with any non-null status has exactly one record, every bye week of an attached player has a record, Available and Played valid; files without Population.ByeWeeksIncluded are skipped until regenerated; v1 season files are skipped until regenerated).
  cases: healthy played, healthy scratch, bye (Issue #1616: synthesized bye, team change around the bye, ended attachment, regular season only), not-on-active-roster (EXE, CUT, DEV, RET, SUS), reserve without report, Out and played, Questionable and played, Doubtful, unknown (game not final, snap identity gap), cancelled game, other roster status, configurable position cut, no gaps, population documented; Out played/not played, Questionable played, reserve without report, inactive without report, bye, missing roster row, cancelled 2022 game, player without identity, game not final, no snap coverage, stats fallback, snap identity gap, postseason week without game, determinism and semantic no-op.
