version: 1
updated: 2026-09-14

purpose: >-
  Defines the generator-owned FantasyGameContext read model introduced by Issue #346.
  The model explains which NFL games matter to the league and how completed NFL games
  contributed league-scored starter points to fantasy matchups without moving joins or
  counterfactual logic into Angular. Issue #520 extends the current read model so a live
  direct-Starter scoring window and the next future direct-Starter scoring window remain
  distinct generated facts.

contract:
  current_output: public/data/FantasyGameContext.json
  historical_output: public/data/past_seasons/FantasyGameContext/FantasyGameContext_<season>.json
  historical_index: public/data/PastSeasonsIndex.json
  schema_version: 5
  ownership: generator-owned
  angular_role: presentation-only

semantic_chain:
  - NFL Game
  - Decision Window
  - Player
  - Fantasy Team
  - Starter role
  - Fantasy Matchup

identity:
  nfl_game: stable GameID from the schedule/DecisionWindow facts
  decision_window: generator-owned DecisionWindowID
  player_current: Sleeper PlayerID, matching current Players.json and DecisionWindows.json
  player_historical: canonical identity when persisted for the week; otherwise exact historical Player.Games evidence
  fantasy_team_current: current League.json TeamID / Sleeper roster ID
  fantasy_matchup: >-
    Opaque deterministic app-owned ID derived from season, week and the actual two-team pairing.
    Provider matchup IDs and nullable Team.MatchupID are adapter evidence only and are not frontend identity.

relevance_v1:
  definition: count-based only; no weighted composite score
  fields:
    - StarterCount
    - FantasyMatchupCount
    - FantasyTeamCount
    - RosteredPlayerCount
    - UnknownAssociationCount
  ordering:
    - StarterCount descending
    - FantasyMatchupCount descending
    - FantasyTeamCount descending
    - RosteredPlayerCount descending
    - StartsAtUtc ascending
    - GameID ascending

scoring_windows:
  active: >-
    RemainingRelevance.ActiveScoringWindowID / ActiveScoringGameIDs identify the current
    direct-Starter window from generated locked-active Starter paths. Angular must not
    reconstruct this membership from Schedule status or wall-clock heuristics.
  next_future: >-
    In schema v5, RemainingRelevance.NextScoring* identifies only the earliest future
    direct-Starter window from generated unlocked Starter paths. A live window no longer
    consumes Next, and an option-only lineup-decision window is never promoted to scoring.
  direct_final: >-
    For Overview presentation, Active present plus future Next absent proves that the live
    direct-Starter window is the last direct-Starter scoring window. FinalScoringWindowID
    is not substituted because later Bench-option-only paths may extend that broader fact.
  lineup_decision_separation: >-
    NextLineupDecision* remains the earliest unlocked Starter/eligible-option decision
    horizon and is independent from Active/Next direct-Starter scoring.

impact:
  source_of_truth: >-
    League-scored matchup player facts only. Current generation loads the active
    canonical League matchup partition through CanonicalMatchupUtils as score/player
    evidence for Matchups.json and FantasyGameContext. Historical data uses persisted
    canonical league PlayerPoints/StarterPoints. Generic NFL/Tank fantasy points are
    not accepted for this model.
  states:
    unavailable: no league-scored player facts are available yet
    partial: league-scored facts exist but the NFL game is not final
    final: league-scored facts exist and the NFL game is final
  ordering: StarterPoints descending, then relevance ordering

counterfactual:
  statement: >-
    For a completed, unambiguous fantasy matchup, subtract only the selected NFL game's
    starter points from the official final fantasy scores and compare the resulting winner/tie.
  interpretation: descriptive counterfactual, never a causal claim that the NFL game caused the result
  disabled_when:
    - fantasy week is not final
    - official final scores are missing
    - custom_points / commissioner-adjusted scoring evidence is present

historical_evidence_ladder:
  - canonical week-specific player/team membership when identity is available
  - exact historical Players_<season>.json Games[] game/team evidence
  - explicit unknown/no-association when neither rung resolves exactly one game
  forbidden:
    - current roster/team membership as historical evidence
    - nearest-date or abbreviation guessing
  scoring_window_rule: >-
    Do not project today's current FantasyRelevance, locks or roster view backward merely
    to populate schema-v5 ActiveScoring* fields. Historical generator paths keep their own
    persisted week evidence and may remain on earlier compatible schema semantics when the
    current live relevance input is absent.

failure_policy:
  malformed_pairing: exclude the malformed matchup with a diagnostic
  player_on_multiple_fantasy_teams: fail closed
  missing_or_ambiguous_player_game: keep explicit NonGameAssociations / unknown evidence
  missing_current_refresh: preserve previous generated FantasyGameContext instead of overwriting with guesses
  decision_window_week_mismatch: preserve previous generated FantasyGameContext

ui:
  overview:
    location: immediately after league matchup cards
    upcoming_lens: Upcoming Relevance
    completed_lens: Completed Impact
  matchup_cards: >-
    Compact scoring-first temporal grammar: Final/completed Starter -> Live now -> Next
    future direct-Starter window -> Later. If no live window exists, keep the compact
    single NEXT SCORING WINDOW treatment. If live exists with no future direct-Starter
    window, show FINAL SCORING WINDOW. Authoritative fantasy matchup Final always comes
    from Matchups.json and replaces future-window presentation.
  details:
    - NFL matchup, kickoff, status and DecisionWindowID
    - affected fantasy teams and players
    - starter/rostered counts
    - league-scored points and impact state
    - matchup counterfactual only when available
    - drill-through to existing team/player dialogs
  safe_state: missing or stale FantasyGameContext must not break existing matchup rendering

boundaries:
  decision_windows: >-
    DecisionWindows.json remains the sole Decision Window read model. FantasyGameContext consumes
    its generated facts in the same RequestLeague run; Angular never reconstructs NFL/fantasy joins.
  matchups: >-
    Matchups.json owns the season/week pairing, official/effective team score, matchup result and
    fantasy completion state. FantasyGameContext reuses the same deterministic FantasyMatchupID and
    owns richer roster, starter, NFL-game relevance, impact and counterfactual facts. League.json no
    longer republishes a compact matchup scoreboard snapshot.
  source_snapshots: >-
    source-data remains provider/canonical evidence. Generated Matchups and FantasyGameContext files
    are disposable presentation read models and can be rebuilt from those sources.
  angular: >-
    Angular may render generated Active/Next horizons and preserve generator-owned GameID order/count
    for compact previews. It must not sort Schedule games into scoring relevance, rebuild Starter
    membership, eligibility, repairability or scoring paths, infer finality, or use weekday/time
    heuristics as domain logic.
