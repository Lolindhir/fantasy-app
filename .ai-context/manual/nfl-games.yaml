        SchemaVersion 2 is an additive read-only preview format; existing
        nfl-games SchemaVersion 1 season index and publisher remain unchanged.
      historicalAvailability: >-
        player-stats are available from 1999 in canonical weekly partitions;
        snap-counts from 2013. Game joins can fail closed on unverified
        historical abbreviations; no guessed team aliases are introduced.
