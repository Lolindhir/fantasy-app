        A missing week partition or absent game rows is unavailable (null
        player/teams). Coverage for one-sided rows is partial, not zero or a
        complete-game claim. SourceFinalized is source snapshot metadata and
        never substitutes for full NFL play-by-play coverage. Full PBP stays false.
