schemaVersion: 1
domain: nfl-games
status: active-upon-first-published-full-sync
issue: 1077
architecture: ADR-037/ADR-038
ownership:
  producer: tools/nfl_games_materialize.py
  pureBuilder: tools/derived_data_lib/nfl_games.py
  output: data-derived/nfl-games/<season>.json
  scope: global-NFL-independent-of-league
  format: deterministic-json-season-partition
  authority: canonical-Source-plus-versioned-derivation
inputSources:
  schedule: data-source/nfl/schedules/<season>.json
  finality: data-source/nfl/game-finality/<season>.json
  odds: data-source/nfl/schedule-odds/<season>.json
identity:
  season: Season
  game: GameID
  schema: SchemaVersion
  join: exact-canonical-GameID-and-GameType/Week
  missingPartition: unavailable-not-empty
  missingGame: fail-closed
  duplicateGame: fail-closed
schema:
  SchemaVersion: 1
  Season: integer
  SourceDatasets: [nflverse.schedules, nflverse.game-finality, nflverse.schedule-odds]
  Games:
    fields:
      - GameID
      - GameType
      - Week
      - GameDay
      - GameTime
      - KickoffUtc
      - AwayTeam
      - HomeTeam
      - AwayScore
      - HomeScore
      - Final
      - Market
    market:
      SourceDataset: nflverse.schedule-odds
      SpreadLine: nullable-finite-number
      TotalLine: nullable-positive-number
      ImpliedAwayPoints: nullable-two-decimal-number
      ImpliedHomePoints: nullable-two-decimal-number
derived:
  spreadConvention: nflverse-away-spread-positive-favors-home
  impliedAway: (TotalLine-SpreadLine)/2
  impliedHome: (TotalLine+SpreadLine)/2
  rounding: decimal-half-up-to-two-places
  incompleteLines: null-both-implied-scores
  interpretation: market-expected-points-not-a-prediction-or-actual-score
  marketPriceFields: omitted-from-product-and-ignored-for-invalidation
temporal:
  kickoff: >
    Canonical GameDay is required. GameTime is nullable for historical seasons
    (1999 schedules have unknown times) and is preserved as null; no invented
    kickoff instant/timezone or observation timestamp.
  gameTime: nullable-canonical-source-string
  kickoffUtc: >
    KickoffUtc (Issue #1572, additive, SchemaVersion stays 1) is the single central conversion of
    canonical GameDay plus Eastern GameTime (America/New_York) to an absolute UTC instant in the form
    yyyy-MM-ddTHH:mm:ssZ (derived_data_lib/nfl_games.py::kickoff_utc). GameTime null gives KickoffUtc null,
    never an invented instant; a malformed, nonexistent or ambiguous Eastern wall-clock time fails the build
    closed. Consumers (Schedule archive, matchup context, Fantasy Management) read this field instead of
    converting themselves. Exceptions that keep their own conversion because they run before or independent
    of this product: the scheduler game window (tools/nfl-game-window.cjs, source schedule, fail-closed
    scheduling must not wait for a derived refresh) and the odds observation buffer
    (tools/odds_observation_buffer.py, source-side input of the product itself, circular otherwise).
  finality: canonical-nflverse.game-finality-only
  historicalMarketCaveat: latest-line-not-proven-original-pregame-line
  noInventedObservationTimestamp: true
invalidation:
  - schedule
  - finality
  - spread-or-total-value-including-null-transition
  - pureBuilderImplementation
  - schemaContractVersion
ignoreForThisProduct:
  - Moneyline
  - AwaySpreadOdds
  - HomeSpreadOdds
  - UnderOdds
  - OverOdds
operation:
  cli: python3 tools/nfl_games_materialize.py --season 2026
  default: read-only-preview
  explicitWrite: python3 tools/nfl_games_materialize.py --season 2026 --write
  check: python3 tools/nfl_games_materialize.py --season 2026 --check
  full: python3 tools/nfl_games_materialize.py --all-seasons
  publication: >
    After a successful normal full NFL Source sync or a successful targeted
    nflverse.schedule-odds Source refresh, sync-nfl-source-data.yml runs a
    dependent nfl_games_derived job that verifies
    real-source clean-root restore, then executes the existing rebuild-and-retry
    publisher from current main with scope nfl-games and only
    data-derived/nfl-games as allowed write destination.
  activation: gated-by-PR1082-green-CI-and-first-production-publish
  workflow: .github/workflows/sync-nfl-source-data.yml
  sourceTrigger: full-source-or-scoped-schedule-odds
  excludedTriggers:
    - nfl-live-game-finality
    - unrelated-targeted-NFL-source-dataset-refresh
    - league-live
  outputScope: data-derived/nfl-games/**
  noSeparateScheduler: true
  commitOnNoop: false
  rollback: revert-dependent-derived-job-and-commit-scope;preserve-published-history-pending-separate-cleanup-review
guards:
  - validate-canonical-dataset-and-season
  - reject-missing-odds-source-not-fabricate-empty-market
  - reject-duplicate-or-unknown-game-ids
  - reject-missing-finality-and-inconsistent-type-or-week
  - reject-nonfinite-spread-or-total-and-impossible-lines
  - reject-final-score-without-both-scores
  - stable-sort-game-id-week-type
  - no-op-on-identical-content
  - clean-root-restorable-from-three-canonical-inputs
  - no-UI-or-fantasy-projection-consumer-in-this-issue
futureGameDetailDirection:
  confirmedAt: 2026-11-14
  status: v2-dynamic-derived-writer-implementation-under-release-review
  ownership: extend-existing-nfl-games-product-not-a-second-game-product
  summary: >
    Keep the existing compact season/game index and evolve the same consumer-neutral
    NFL Game domain into detailed, independently addressable per-GameID statistics.
    The detailed game contract is for App NFL game pages, Fantasy Operations,
    Fantasy Management, AI chat data access, and future model research.
  plannedDetailGroups:
    - team-and-player-statistics
    - usage-and-snap-counts
    - situational-and-drive-context
    - advanced-play-derived-metrics
    - data-coverage-and-provenance
  metricDerivationOwnership:
    status: versioned-game-detail-v2-production-publisher-wiring-in-review
    source: >-
      Raw/provider evidence and canonical NFL facts live under data-source/nfl.
      Existing canonical schedule, player-stats and snap-counts remain independent.
      The 2025 original PBP has accepted immutable Source-byte identity and
      is available as explicitly unverified-upstream-completeness evidence.
      Future accepted original seasons are discovered from Source manifests,
      never a derived hard-coded season list.
    implementation: >-
      Consumer-neutral, versioned formulas belong under tools/derived_data_lib,
      not Angular, Fantasy Management, a workflow expression or generated JSON.
      nfl_games.py owns the published season index; nfl_game_detail_core.py
      retains pure v1 core groups and composes versioned v2 PBP candidates.
      nfl_pbp_team_metrics.py owns the reusable candidate opportunity formulas,
      nfl_pbp_accepted_season.py enforces accepted-source identity and
      nfl_team_snap_usage.py infers qualified team snap totals.
    materialization: >-
      The existing tools/nfl_games_materialize.py retains the SchemaVersion 1
      season index. The same NFL Games owner publishes versioned v2 GameDetails
      through the pre-existing scoped Derived writer, preserving full v1 fact
      groups plus candidate PBP evidence and explicit quality/provenance.
    orchestration: >-
      Reuse the classified sync-nfl-source-data.yml dependent nfl_games_derived
      workflow and the rebuild-and-retry scoped publisher, not one workflow per
      metric. Current details refresh after full Source sync or schedule-odds
      refresh through the existing writer. Historical details reconcile on Monday,
      with an initial schema-v2 upgrade on a full Source run when any stored
      historic v1 details remain. Subsequent content-identical rebuilds are
      no-ops; no new workflow, scheduler, destination or writer is created.
    consumerBoundary: >-
      Derived metric definitions, denominators, quality and provenance belong to
      Shared Derived; Angular, Operations, Management and V4-C may consume or
      interpret but must not independently reimplement the shared formula.
  teamSnapUsagePreview:
    status: read-only-candidate-not-published
    input: data-source/nfl/snap-counts/<season>/<week>.json
    identity: GameID + Team + Offense/Defense/SpecialTeams
    calculation: >-
      Infer an integer team play count for each of the three units only if
      multiple observed player counts and their rounded two-decimal PFR
      participation shares agree on exactly one plausible integer denominator.
      These values are source-derived estimates, NOT independently verified
      official team-play counts. A sum of player-participation snaps is NOT a
      team-snap count; no division by eleven.
    quality: >-
      Preserve missing, sparse, ambiguous, inconsistent and opponent
      offense-vs-defense mismatches as unavailable per metric, never zero.
      Preserve player SnapCounts and source finality unchanged. Special Teams
      remain an independent unit rather than a PBP pass/run proxy.
    activation: >-
      Preview only until representative historical/ongoing source checks,
      output contract, restorable publishing and workflow/write-scope approval.
  coreDetailV1:
    status: implemented-v1-core-used-unchanged-in-v2-and-rollback
    productOwner: existing-nfl-games
    version: 1
    identity: Season + canonical GameID + DetailSchemaVersion
    candidatePath: data-derived/nfl-games/details/<season>/<GameID>.json
    indexCompatibility: >-
      Keep data-derived/nfl-games/<season>.json and its SchemaVersion 1 exactly
      as published; no new second game index or separate data product.
    initialScope:
      - canonical game identity, type, week, teams, score, finality and market index fields
      - two team totals built only from validated canonical player stats
      - three separately qualified team snap totals per team, inferred from player
        participation fractions; never player-snap sums divided by eleven
      - per-group source coverage, finalization, identity holds and provenance
    excludedUntilSeparateGates:
      - full original PBP rows or unverified full-game completeness claims
      - the 17 provisional team PBP and six position-specific candidates
      - player-level public detail when historical canonical identity is unresolved
      - App delivery/read models, V4-C calculations or any new permissions
    missingness:
      sourcePartition: missing-or-not-yet-published-is-unavailable-not-zero
      playerStats: >-
        Any source player row without CanonicalPlayerID blocks only the
        player-dependent TeamStats group, with explicit unresolved row count.
        Other invalid or duplicate player rows fail closed; never discard them
        silently to generate a misleading team sum.
      missingHistoricalTeamContext: >-
        Legacy PlayerStats can contain rows with a valid canonical GameID and
        Week/SeasonType but no Team and/or OpponentTeam. They must remain
        included as input evidence and block TeamStats for that entire GameID
        with Status=blocked-missing-team-context and MissingTeamContextRows;
        do not infer a team from player name, player ID or the opposing roster.
        Independently validated team SnapCounts can still be derived. Unknown
        non-null team/opponent combinations fail closed rather than using
        arbitrary aliases.
      teamSnapCounts: >-
        Validate GameID, team, opponent, game type/week and typed nonnegative
        counts strictly. Invalid source percentage shares (out of 0..1,
        nonnumeric or nonfinite) must not be clipped/coerced or block other
        valid metrics: only the source team's affected Offense, Defense or
        SpecialTeams unit gets Status=blocked-invalid-share, TotalSnaps=null
        and InvalidShareRows; the game exposes SnapCounts.InvalidShareRows
        when nonzero. Other teams/units and TeamStats remain independent.
        Raw canonical Source stays untouched; the per-GameID fingerprint
        distinguishes invalid raw shares using typed finite diagnostic
        evidence. Infer valid team totals independently of player identity,
        retaining unresolved-ID counts without publishing those rows as named
        players. Inconsistent, ambiguous or sparse eligibility remains
        nullable per unit; opposite offense and defense totals must reconcile
        when both known. Valid-source outputs and definition version remain
        unchanged.
      historicalFranchiseAliases: >-
        Exact canonical GameID and week/type still required. PlayerStats and
        SnapCounts opponent/team fields may be mapped to the canonical historical
        schedule tokens only through tools/derived_data_lib/nfl_franchise_aliases.py:
        SD/LAC in 1999-2016, OAK/LV in 1999-2019, STL/LA in 1999-2015.
        Resolve both player-team and opponent against the same game, never
        a global modern-team substitution or a guessed canonical player ID.
        Preserve raw Source rows for the fingerprint, normalize only the
        temporary Derived grouping, and expose HistoricalFranchiseAliasRows
        per source group. Unknown/out-of-window conflicts fail closed.
      sourceFinality: Finalized flags do not certify source field/coverage completeness
    computation:
      pureBuilder: tools/derived_data_lib/nfl_game_detail_core.py
      existingRules:
        - tools/derived_data_lib/nfl_game_detail.py
        - tools/derived_data_lib/nfl_team_snap_usage.py
      readonlyCli: python3 tools/nfl_game_detail_preview.py --season 2025 --game-id 2025_01_ARI_NO --core-v1
      outputContract: >-
        SchemaVersion=1; Product=nfl-games; Game and GameID; TeamStats and
        SnapCounts; Coverage and Derivation (version and per-GameID input digest).
        No raw player/source PBP records or artificial generated timestamp.
    invalidation:
      scope: canonical-GameID
      key: >-
        Hash the selected canonical game index record, only the validated
        PlayerStats counting-stat fields/row team and identity and SnapCounts
        count/share fields/row team and identity actually consumed by this
        versioned model for this GameID, source Finalized values, model version
        and detail schema version. A relevant changed input field, group
        availability, finality or model rule invalidates the GameID; unrelated
        game rows and unused provider attributes (including nonfinite historical
        EPA fields not modeled in v1) do not. Do not silently coerce invalid
        model-used fields to zero or use a new metric without bumping the model
        definition version.
      semantics: >-
        Stable canonical ordering and serialized JSON; unchanged result
        yields no write or commit. Never treat raw Source snapshots or a
        timestamp-only observation as a material NFL-game change.
      supportedHistory: >-
        1999+ existing game index and PlayerStats; SnapCounts when actual
        canonically available (normally 2013+, 2012 known-unavailable).
        No zero-filled older years or automatic repairs of frozen Source.
    publication:
      writer: tools/nfl_game_details_materialize.py
      modes:
        current: --current-season --write
        weeklyHistory: --historical-seasons --write
        readOnlyAllHistory: --historical-seasons
        check: --historical-seasons --check
      writeScope: data-derived/nfl-games/details/**
      eligibility: at-least-one-actual-canonical-player-stats-or-snap-record-for-exact-GameID
      historicalMissingSource: unavailable-not-empty-and-not-deleted
      historyPreflight: all-selected-seasons-before-any-write
      historicalAuditTimezone: Europe/Berlin
      historicalAuditDay: Monday
      noOp: exact-serialized-detail-equality
      noSeparateScheduler: true
      noNewPermissions: true
    workflowTarget:
      owner: .github/workflows/sync-nfl-source-data.yml::nfl_games_derived
      publicationClass: existing-rebuild-and-retry-scoped-branch-writer
      current: >-
        Recompute affected current GameIDs only after accepted canonical
        schedule/finality/odds/player-stats/snap-count revisions.
      historical: >-
        Reconcile all indexed accepted historical seasons every Monday (Europe/Berlin)
        after the existing full daily NFL Source sync. Derive details from accepted
        canonical historical PlayerStats/SnapCounts at the currently deployed
        version and write only changed GameIDs. Only data-backed games are
        eligible. The same existing classified Publisher/Scope handles every write.
        Historical upstream source revision discovery/repair remains bounded by
        the separate NFL Source contract and cannot silently overwrite frozen raw
        historical inputs. The daily full sync's bounded missing-history healing
        is not an unrestricted rewrite authorization.
      activationGate: >-
        Specifically authorized 2026-11-16 for the existing nfl_games_derived
        publisher to write details across current and all supported historical
        indexed seasons. Scoped, deterministic GameDetails only; rights/coverage
        for full original PBP and metric-candidate activation remain separately
        gated. First real productive publication and historical CI audit must
        confirm live output health, no-op and race handling before claiming a
        completed cutover.
      rollbackPlan: >-
        Revert new detail generator invocation and new scoped write allowance,
        preserve existing season index and historical detail files pending
        reviewed cleanup; do not delete authoritative Source.
  pbpOpportunitySemantics:
    decision: competitive-opportunities-not-official-attempts
    decidedAt: 2026-11-17
    canonicalDefinition: .ai-context/manual/nfl-games-pbp-metrics.yaml::competitiveOpportunitiesDecision
    consumerContract: >-
      GameDetail PBP metrics represent meaningful competitive scrimmage
      opportunities with explicit per-metric eligibility and denominators,
      not NFL official attempts/carries. Clock-management spikes/kneeldowns
      are excluded; sacks and scrambles are treated according to the
      pass-throw/dropback/rush metric definitions. PlayerStats attempts and
      carries are diagnostic baselines only, not a parity gate.
    activationBoundary: >-
      The approved metric semantics are implemented as provisional v2
      GameDetail observations under the existing Derived writer. This does
      not expand Source permissions, alter season-index SchemaVersion 1,
      certify independent upstream completeness or permit arbitrary
      Source repair. Remaining uncertain play eligibility is visible.
  gameDetailV2DynamicPublication:
    issue: 1077
    targetScope: all-canonical-indexed-seasons-no-hardcoded-years
    status: writer-implementation-awaiting-ci-and-first-productive-run
    owner: existing-nfl-games
    definitionVersion: 2
    pureBuilder: tools/derived_data_lib/nfl_game_detail_core.py::build_nfl_game_detail_v2
    materializer: tools/nfl_game_details_materialize.py
    sourceReader: tools/derived_data_lib/nfl_pbp_accepted_season.py
    sourceDiscovery: data-source/providers/nflverse/play-by-play-original/metadata-<season>.json
    sourcePolicy: >-
      Each indexed Season uses the same SchemaVersion=2 and DetailDefinitionVersion=2.
      Discover PBP only through the accepted Source manifest for each season.
      The manifest points to a SHA-addressed immutable release asset; during
      the active season its pointer can advance to a separately audited new
      original version without altering or deleting prior release assets.
      After a season becomes historical its accepted original is frozen.
      Verify the selected release SHA256/size. Exactly one season
      download and CSV replay per materialization; preserve source evidence in
      memory for the preflight and the write, not as Derived raw rows.
      Without an accepted source manifest, v2 PlayByPlayMetrics is unavailable
      with null metric values; do not simulate historic observations.
      A present accepted manifest with invalid/missing archive fails closed
      before writes rather than erasing previously observed PBP metrics.
      This manifest-driven consumer does not itself acquire new Source seasons;
      tools/nfl_pbp_source_auto.py in the established full Source publisher owns
      dynamically discovered active-season intake and revisions, while the
      pre-existing 2025 original remains frozen with its own contract.
    outputContract: >-
      Existing compact NFL Games season index remains SchemaVersion=1.
      The same per-GameID details path contains the full pre-existing
      Game, TeamStats, SnapCounts groups, plus PlayByPlayMetrics with
      OffenseTeam/DefenseTeam perspectives. Ten candidate Competitive
      Opportunity, EPA, Success and Explosive metrics retain value,
      numerator, observed denominator, missingness and source-quality status.
      An offense observation maps to the opposing defense Allowed perspective;
      no duplicate defense score or raw PBP event array is published.
    completeness: >-
      Accepted byte identity and observed metrics do not independently certify
      complete upstream play evidence or settled penalty/no-play semantics.
      Publish candidate observed values with explicit provisional status and
      GameSourceCompletenessCertified=false. Missing source or unknown
      eligibility does not become zero. Model improvements are versioned,
      reviewed and compared against real published data.
    publisher: >-
      Reuse the existing classified sync-nfl-source-data.yml::nfl_games_derived
      rebuild-and-retry writer only for data-derived/nfl-games/details/**.
      Current-season games remain regularly refreshed after accepted Source.
      All older indexed seasons get a one-time v1->v2 schema migration on an
      unfiltered full Source run if needed; routine historical reconciliation
      thereafter stays Monday-only. No added scheduler, branch writer,
      destination, token, App or Fantasy Management dependency.
    validation: >-
      Full historical preflight before any write; tests for v1 group parity,
      unknown and missing data, per-GameID deterministic fingerprint,
      accepted source identity, publisher no-op, and existing consumers.
      After productive merge require actual published v2 readback and a
      second unchanged-source no-op. CI alone is not production readback.
    rollback: >-
      Revert v2 builder invocation and the historical schema upgrade check
      in the same existing producer; regenerate v1 details from canonical
      PlayerStats/SnapCounts under the classified Derived publisher, without
      altering Source manifests/archive assets or the unchanged season index.
    previewCli: >-
      python3 tools/nfl_game_detail_preview.py --season <season>
      --game-id <canonical-GameID> --v2
      --pbp-csv-gz /local/play_by_play_<season>.csv.gz
      --expected-sha256 <accepted-manifest-sha256>
  pbpDerivedMetricCatalog:
    path: .ai-context/manual/nfl-games-pbp-metrics.yaml
    catalogVersion: 1
    status: ten-mvp-metrics-in-versioned-derived-v2-candidate-publisher
    issue: 1077
    producer: existing-versioned-derived-nfl-games-not-a-new-product
    sourceEvidence: immutable-accepted-original-nflverse-pbp-seasons-only
    productRule: >-
      Future detailed nfl-games views publish only compact team, situation,
      usage and optional position-specific aggregates with coverage and versioned
      denominators, NOT all raw source plays. The PBP-only reader/analytics
      currently remain experimental read-only checkpoints. Fantasy player
      predictions, the externally discussed Stone Luck Score and ROS rankings are
      independent downstream research until separately validated.
    requiredBeforeActivation: original-source-and-field-audit;game-team-play-identity-and-coverage;metric-eligibility-tests;season-valid-player-position-join-only-for-position-metrics;versioned-output-and-risk-approved-publication
  inputPrinciple: >
    Use canonical NFL facts including retained full play-by-play evidence, player
    stats, snap counts, schedules, game finality and market odds as applicable.
    Play-level raw rows are source evidence, not a mandatory payload of every
    game-detail derived view. Derived metrics require explicit ownership and
    versioned definitions. Missing or incomplete is not zero.
  storagePrinciple: >
    Retain a lean season index and load detailed games on demand; per-game
    partition layout, schemas, compatibility, invalidation, and publishing
    require a separate approved implementation decision.

  fullPbpReadOnlyVerticalSlice:
    checkpoint: CP3
    status: code-implemented-original-game-asset-replay-not-yet-verified
    intent: >-
      Work directly from a local original nflverse play_by_play_<season>.csv.gz,
      never from the sparse long-gains projection or from aggregated player stats.
      The pure original-play builder stays inside the existing nfl-games
      game-detail owner; no separate derived product or new Source ownership.
    cli: >-
      python3 tools/nfl_game_detail_preview.py --season 2026
      --game-id 2026_10_WAS_NYG --pbp-csv-gz /local/play_by_play_2026.csv.gz
    optionalIntegrityCheck: --expected-sha256 <trusted-compressed-asset-digest>
    reader: >-
      Stream the full compressed seasonal CSV using gzip and csv.DictReader
      (same approach as existing Source projections), retain only exact target
      GameID rows in memory. Fail closed on missing/duplicate CSV headers,
      missing game, invalid play ID, duplicate game/play identity, inconsistent
      season/week/type/teams or invalid typed situational values.
    result: >-
      Returns read-only GameDetail SchemaVersion 3. Existing canonical
      Game and optional legacy detail groups stay structurally separate.
      PlayByPlay.OriginalPlays carries all matched source play rows ordered
      by PlayID, selected typed situation and EPA/success fields, and each
      complete original column map verbatim under SourceRow. The original
      GSIS player IDs are retained as provider evidence, not falsely converted
      to CanonicalPlayerID. PlayerStats and SnapCounts are not prerequisites
      in --pbp-csv-gz mode. No per-play metric aggregation is guessed.
    provenance: >-
      Original compressed asset SHA256 is calculated locally, and can be
      pinned to an explicitly supplied expected SHA256. The digest proves
      byte identity only against the supplied digest, not that all game plays
      are in the upstream source or that the asset may be redistributed.
    completeness: >-
      PlayCount is the count of selected source rows, not a verified complete
      game count. Coverage remains source-rows-unverified,
      OriginalPlays.Status=present-unverified-completeness,
      CompletenessVerified=false and FullPlayByPlayAvailable=false until
      independent full-game evidence can establish completeness. Never
      elevate partial upstream games or a Final flag to proven full PBP.
    validation: >-
      Synthetic nflverse-shaped gzip exercises streamed multi-game filtering,
      270 source rows, stable sorting, verbatim extra columns, missing values,
      SHA256, read-only contract, non-PBP independence and fail-closed joins.
      A real complete original game could not be replayed in this environment:
      original compressed season asset download is unavailable here; passing
      synthetic tests must not be reported as real source acceptance.
    sourceReadAndAnalyticsCheckpoint:
      checkpoint: CP4
      status: implemented-read-only-not-real-original-game-certified
      summaryCli: >-
        python3 tools/nfl_game_detail_preview.py --season 2026
        --game-id 2026_10_WAS_NYG
        --pbp-csv-gz /local/play_by_play_2026.csv.gz --summary
      sourceReadAudit: >-
        The entire gzip CSV is streamed to EOF and decompressed, preserving
        the gzip integrity verification and recording season rows scanned,
        distinct GameIDs in the asset, matched GameID rows, column count,
        asset byte size, selected unique PlayIDs and min/max PlayID. The
        compressed SHA256 is checked both before and after the scan to detect
        a changing source file. A matching optional --expected-sha256 pins
        the asset to a specified trusted hash. Nonconsecutive PlayIDs do not
        constitute missing rows without independent upstream evidence.
      scope: >-
        Analytics are computed solely from original matched PBP SourceRows
        after canonical GameID and unique PlayID validation; no player-stats,
        snap-counts, team boxscores or inferred drive/score joins are used.
        The PBP source snapshot's play completeness remains unverified.
      definitionVersion: 1
      eligibility: >-
        Include play_type=pass or run only, explicitly two_point_attempt=0,
        and a valid possession and defense team. Missing two_point_attempt
        means eligibility unknown and is counted as excluded, not treated as
        zero. Non-scrimmage, two-point and unknown-team plays are counted
        separately so no denominator is silently inflated.
      firstMetrics:
        - per-team offense and opposing-defense perspective
        - per-team pass/run splits and third-down splits
        - EPA sum and average from nullable original epa field
        - success rate from nullable original success=1 field
        - explosive rate based on yards_gained at pass >=20 or run >=10
        - third-down conversion from nullable original third_down_converted=1
      missingSemantics: >-
        Every metric reports observed and missing counts. Average/rate/sum
        are null when no relevant source observations exist; verified 0/0
        outcomes remain numeric zero for observed denominators. Third-down
        conversion is source-flag-based, not inferred from gained yards.
        Defense Allowed preserves the offense-positive EPA perspective;
        smaller allowed EPA/success is better.
      rounding: >-
        EPA sum to 3 decimals; per-play EPA and rates to 4 decimals.
      availability: provisional-unverified-game-completeness
      verification: >-
