schemaVersion: 1
status: accepted-contract-v1
trackingIssue: 919
architectureDecision: ADR-055

purpose: >
  Canonical contract for central, league-independent, versioned derivation models
  (Layer 4 "Zentrale Logik" of the six-layer data model). A model turns canonical
  facts into a derived value with an algorithm and parameters that live next to the
  code. Leagues do not carry model parameters; a league only selects, per season,
  which model version applies. Salary, SalaryCap and Grading are the first models;
  Standings and Awards follow (#987, ADR-072, league-standings.yaml), then the league
  Lifecycle (#1199, ADR-073, league-lifecycle.yaml) and the lineup Repairability of the
  Decision Windows (#1199 section 2, ADR-074, decision-windows.yaml) and the team projection range of the matchup context (#1199 section 3, ADR-075, matchup-context.yaml).

architecture:
  decisionBasis:
    - ADR-037
    - ADR-038
    - ADR-055
  logicalLayer: Shared Derived Data (algorithm side)
  physicalLocation: tools/derived_data_lib/models/<kind>/v<N>.py
  registry: tools/derived_data_lib/models/registry.py
  unversionedFunctions: tools/derived_data_lib/ranking.py
  consumers:
    - tools/derived_data.py materializer (player-valuation product, #919 step 3)
    - Fantasy Management salary simulation (#919 step 7)
    - tools/derived_data.py materializer (league-standings product, #987 step 2)
    - tools/derived_data_lib/league_lifecycle.py (computed lifecycle function, no product, #1199 step 2)
    - tools/derived_data_lib/decision_windows.py (computed Decision Windows function with the repairability model, no product, #1199 section 2)
    - tools/derived_data_lib/matchup_context.py (computed matchup context function with the team-range model, no product, #1199 section 3)
    - tools/matchup_projection.py and tools/derived_data_lib/weekly_recaps.py (win-prob model on the team-range projections, no product, #1443)
    - tools/derived_data_lib/season_statistics.py and the season-statistics product (season-stats-v1, #506)
    - later models through the same registry
  rules:
    - A model is a pure function of its explicit inputs plus its own PARAMS. It reads no files, no network, no clock, no environment and no league configuration.
    - Inputs that depend on the league (team count, scoring settings, rosters) are passed in by the caller, which reads them from canonical league facts.
    - Leagues never override PARAMS. Different behaviour is a different model version.
    - A model may expose unrounded building blocks (salary-v1 curve_dollars and floored_average, salary-cap-v1 raw_cap) for analyses; the productive functions are defined through them and their results are unchanged. Analyses may pass an explicit exponent to curve_dollars to probe the curve; productive code never does.
    - Models contain no presentation, no consumer shape and no Players.json/League.json field names beyond the documented result keys.

identity:
  modelId:
    format: <kind>-v<N>
    examples:
      - salary-v1
      - salary-cap-v1
      - grading-v1
      - standings-v1
      - awards-v1
      - awards-v2
      - awards-v3
      - lifecycle-v1
      - repairability-v1
      - team-range-v1
      - win-prob-v1
      - season-stats-v1
    rules:
      - The model ID is the only way a league, a snapshot or a test refers to a model.
      - kind uses hyphens in the ID (salary-cap-v1) and underscores in the module path (salary_cap/v1.py).
      - N is a positive integer without gaps in meaning; v2 never silently reuses v1 semantics.
  kinds:
    salary:
      module: tools/derived_data_lib/models/salary/v1.py
      produces: Salary and SalaryProjected in whole dollars
    salary-cap:
      module: tools/derived_data_lib/models/salary_cap/v1.py
      produces: SalaryCap and SalaryCapProjected in whole dollars plus TopN
    grading:
      module: tools/derived_data_lib/models/grading/v1.py
      produces: Grade letter and the Rank grading row
    standings:
      module: tools/derived_data_lib/models/standings/v1.py
      produces: Regular-season table with tiebreaks, weekly tables and movement, playoff placements and the all-time standing
    awards:
      module: tools/derived_data_lib/models/awards/v1.py
      produces: Season awards with their score annotations
    lifecycle:
      module: tools/derived_data_lib/models/lifecycle/v1.py
      produces: League Status and Phase, trade and waiver state, cuts flag and the clock-dependent boundaries for one instant (computed, not persisted, ADR-073)
    repairability:
      module: tools/derived_data_lib/models/repairability/v1.py
      produces: Lineup repairability (State, Path, ReasonCode, candidate counts) per problem slot, including the acquisition policy (computed, not persisted, ADR-074)
    team-range:
      module: tools/derived_data_lib/models/team_range/v1.py
      produces: Team projection (ProjectedFinalScore, StandardDeviation, 50/80/90 percent Ranges) from the starters' PlayerWeekFantasy projections (computed, not persisted, ADR-075)

immutability:
  rule: >
    A model is mutable only until its first productive use (first committed
    data-derived snapshot that names it). From then on any change of formula,
    parameter, rounding or tie handling is a new version. Bug fixes that change
    results are also a new version, because earlier snapshots must stay reproducible.
    Narrow, explicitly user-authorized historical correction exception: Issue #1263
    repairs the existing standings-v1 dense-placement defect (1,1,2 -> 1,1,3)
    without creating standings-v2. The pre-fix algorithm remains recoverable at
    repository commit 0dcbf1527e1301f75cae61f1c1a457bccffc6dae; a snapshot
    naming only standings-v1 is therefore insufficient to distinguish the
    exceptional pre-/post-fix implementation. Rebuild and compare every affected
    league/season, preserve pre-fix Git history, and do not generalize this exception.
  enforcement:
    - Each model module exposes MODEL_ID, KIND and an immutable PARAMS mapping.
    - A regression test pins the PARAMS content of every registered model.
    - A regression test pins hand-computed example results per model.
    - Removing or editing a registered model without a version bump fails the test suite, except the narrowly documented #1263 standings-v1 correction with replacement regression expectations and historical provenance.
  retirement: >
    An old version stays registered as long as any snapshot or league season
    manifest names it. It may be removed only together with the regeneration of
    every snapshot that used it and a decision record.

registry:
  contract:
    - registry.py maps every model ID to exactly one implementation module.
    - Resolving an unknown ID raises an error; there is no default model and no fallback.
    - Resolving an ID for the wrong kind raises an error (a grading ID cannot be used as salary model).
    - Listing models is deterministic (sorted by ID).
    - The registry exposes PARAMS and the module docstring so a snapshot can record which models produced it.
  leagueSelection:
    owner: data-meta/<CanonicalLeagueID>/metadata.json (#986)
    shape: Seasons.<season>.Models = { Salary, SalaryCap, Grading, Standings, Awards, Lifecycle, Repairability, TeamRange, WinProb, RosterCap, AutoCut, SeasonStats } -> model IDs
    rule: >
      The league metadata chooses model IDs per season. A new version applies from
      the season in which the metadata first names it; earlier seasons keep their
      model and stay reproducible. Until #986 delivers the loader, callers pass
      model IDs explicitly.
    notInMetadata:
      - model parameters (SalaryRelevantTeamSize, Cap factor, curve, floor, ramp-in, weights, grade thresholds)
      - TeamCount (canonical league.json::Settings.num_teams)
      - ScoringSettings (canonical league.json::ScoringSettings)

models:
  salary-v1:
    status: planned-step-2
    behaviour: exact port of the current RequestPlayers.ps1 behaviour (no redesign)
    parameters:
      weightTotal: 0.5
      weightGame: 0.5
      sourceMax: 20
      curveExponent: 2
      targetMin: 0
      targetMax: 50000000
      floorWeights: [0.5, 0.33, 0.17]
      rampIn: {"0": "previous season only", "1": [0.25, 0.75], "2": [0.35, 0.65], "3": [0.5, 0.5], "4": [0.75, 0.25]}
    rules:
      - Season points = avgPotentialGame * weightTotal + avgGame * weightGame.
      - Salary is computed from the three previous seasons; SalaryProjected from the current season (blended by AsOfFinalScoredWeek 0 to 4) plus the two newest previous seasons.
      - If the two newest of the three point values are exactly 0 the salary is 0.
      - The floor is the maximum point value times the weight of the season that holds the maximum; no value stays below the floor; the three floored values are averaged.
      - The mapping is non-linear (square) up to sourceMax and linear-extrapolated above it; the result is rounded to whole dollars with banker's rounding.
      - Dead code of the PowerShell version (random adjustments, fallback salary, linear branch) is not part of the model.
  salary-cap-v1:
    status: planned-step-2
    behaviour: exact port of RequestLeague.ps1 salary cap computation
    parameters:
      salaryRelevantTeamSize: 20
      factor: 0.9
    rules:
      - TopN = SalaryRelevantTeamSize * TeamCount; TeamCount comes from the caller.
      - Cap = round(mean of the TopN highest salaries * SalaryRelevantTeamSize * factor), banker's rounding; fewer players than TopN use all players.
      - SalaryCap uses Salary, SalaryCapProjected uses SalaryProjected; both are two calls of the same model.
      - An empty input or a non-positive TopN is an error, never a cap of zero.
  grading-v1:
    status: planned-step-2
    behaviour: exact port of Get-LetterGrade / Add-PositionalGradings Rank row
    parameters:
      thresholds: [6, 12, 18, 24, 30]
      grades: [A, B, C, D, E, F]
      positionMultiplier: {"K": 1.0, "RB": 2.0, "WR": 2.0, "default": 1.5}
    rules:
      - Grade is the first letter whose threshold times the position multiplier is greater than or equal to the Combined_Pos rank; above the last threshold the grade is F.
      - A player without a Combined_Pos rank gets no grade: the Rank row carries null for Value, Rank and Grade. The legacy PowerShell graded such a player as rank 0 (A); Robert decided on 2026-10-15 that this is a defect and had it corrected in grading-v1 itself (a one-time, explicit exception to immutability, since the model had been productive for hours and the old behaviour was never intended; no grading-v2 was created).
      - The Form grading row is a copy of the last four final scored GameHistory entries, not a model; it stays with the Players consumer generator.

  standings-v1:
    status: productive-since-987-step-4
    behaviour: exact port of the former PowerShell StandingUtils.psm1 and CanonicalStandingUtils.psm1 (no new rule; the PowerShell derivation was removed in Issue #987 step 5)
    contract: .ai-context/manual/league-standings.yaml
    parameters:
      regularSeasonTiebreak: [WinPercentage desc, Points desc, PointsAgainst asc]
      allTimeTiebreak: [RegularSeasonWins desc, WinPercentage desc, Points desc, PointsAgainst asc]
      allTimePlayoffTiebreak: [Championships desc, RunnerUps desc, Thirds desc, RegularSeasonWins desc, PlaceAverage asc, RegularSeason Place asc]
      tieKey: win percentage to 6 decimals, points and points against to 2 decimals; equal keys share the place and the next place is the one-based row index (competition ranking, e.g. 1,1,3; #1263 bugfix exception)
      efficiencyScore: pointsPerGameDiff + pointsAgainstPerGameDiff + wins
      ironWillScore: pointsAgainstPerGame / leagueAvgPointsAgainstPerGame + sqrt(winPct * 0.25); -999 when the league average is not positive
      streakScores: [0.001 per win, 0.00001 per point; 0.001 per loss, 0.00001 per point against]
    rules:
      - Games per season in the per-game values is the regular-season game count of the league (playoff_week_start - 1), also while the season is in progress (v1 behaviour kept).
      - The weekly tables rebuild wins, losses, ties and points from the canonical matchups, rounding sums to two decimals after each week, and are accepted only while every team result agrees with its Record.
      - The place movement is PreviousWeekPlace - Place (positive means moved up) and is null whenever no validated comparison exists (ADR-040).
      - Playoff placements come from the placement matches of the winners bracket (start place 1) followed by the losers bracket; the PlaceType boundary is the number of winners-bracket placements.
      - All-time standings accumulate completed seasons newest first (the order fixes the Placements array), rounding points to two decimals at the end.
  awards-v3:
    status: introduced-in-1460
    behaviour: >-
      awards-v2 with a league-adjusted Overperformer and a richer display (Issue #1460). Overperformer is the highest mean ProjectionDelta minus the league
      mean ProjectionDelta over every projected game of the season, so a projection bias that hits every team alike does not make the winner's value negative;
      the team order equals awards-v2. Brick Wall keeps the awards-v2 ranking and adds the points the beaten above-average opponents scored above their own
      average. Both StatDisplay texts have three English parts (value, count, Record W-L or W-L-T). Other awards, order and score annotations equal awards-v2.
      Input: the persisted product data-derived/season-statistics (marker NEEDS_SEASON_STATISTICS, team summaries plus GameLog). Missing product or no
      eligible team omits the award.
    contract: .ai-context/manual/league-standings.yaml
    approval: 'Robert 2026-11-13 (Issue #1460): all seasons of the league choose awards-v3 in data-meta. No workflow, writer or permission change. Rollback: set Awards back to awards-v2 in data-meta and regenerate.'
  awards-v2:
    status: introduced-in-506
    behaviour: >-
      awards-v1 with two changed awards (Issue #506, ADR-082). Overperformer is the highest mean of the own points above the own pregame projection
      (ProjectionDelta of the season-statistics product); Brick Wall is the most wins against opponents that scored above their own season average in that game
      (tie: higher quota, then table order). Other awards, order, display and score annotations equal awards-v1. Input: the persisted product
      data-derived/season-statistics of the season (marker NEEDS_SEASON_STATISTICS). Missing product or no eligible team omits the award (never guessed).
    contract: .ai-context/manual/league-standings.yaml
    approval: 'Robert 2026-11-13 (Issue #506): all seasons of the league choose awards-v2 in data-meta. The Standings job of league-live.yml adds /data-derived/season-statistics/ to its sparse checkout (read only; no new write prefix). The current season may lag one ten-minute tick because the League job writes the product after the Standings job; the weekly runs heal it. Rollback: set Awards back to awards-v1 in data-meta and regenerate.'
  awards-v1:
    status: productive-since-987-step-4
    behaviour: exact port of Get-Awards (no new rule); the stray closing parenthesis of the Brick Wall StatDisplay was fixed in place as a bug (owner-approved exception to ADR-055 immutability); #964 follows as awards-v2
    contract: .ai-context/manual/league-standings.yaml
    parameters:
      order: [Best Performer, Streaker, Overperformer, Brick Wall, Clutch Peaker, Most Improved]
      clutchPeaker: place gain minus 0.01 times the playoff place; -999 for a team outside the playoffs
      mostImproved: win percentage gain plus 0.01 times the points per game gain, rounded to four decimals; 0 for a team without a previous season row
    rules:
      - Without a completed regular-season game no award is given.
      - Clutch Peaker needs playoff placements, Most Improved needs the previous season; otherwise the award is absent.
      - The first team in table order wins an exact tie of the award score.
      - The score annotations (ClutchPeakerScore, ImprovementScore) are part of the result because the App contract carries them on the regular-season rows.

  lifecycle-v1:
    status: productive-1199-step-4
    behaviour: exact port of the lifecycle code of RequestLeague.ps1, LeagueUtils.psm1, WaiverUtils.psm1 and LeagueOverviewUtils.psm1 (no new rule); the rule chain is in league-lifecycle.yaml
    contract: .ai-context/manual/league-lifecycle.yaml
    parameters:
      seasonStartLeadDays: 7
      openDraftStatuses: [Virtual, PreDraft, Drafting]
      liveDraftStatus: Drafting
      completedDraftStatus: Complete
      waiverTimeZone: America/Los_Angeles
      validatedWaiverModes: [1, 2]
    rules:
      - The clock is an explicit input of the model (AtUtc); the model reads no clock, no file and no league configuration.
      - The result carries the instants at which its clock-dependent part may change (cap window end, season window start, next waiver run).
      - Known v1 quirks (CutsAllowed constant, trade deadline against CurrentWeek, UTC calendar days) are kept and listed in the contract for lifecycle-v2.

  repairability-v1:
    status: productive-1199-section-2-step-5
    behaviour: exact port of LineupRepairabilityUtils.psm1, LineupRepairabilityEvidenceUtils.psm1, LineupRepairabilityDecisionUtils.psm1 and AcquisitionCapabilityUtils.psm1 (no new rule); contract in decision-windows.yaml
    contract: .ai-context/manual/decision-windows.yaml
    acquisitionPolicy: acquisition-waiver-only-v1 (the #493 bridge; #492 follows as a later version)
    parameters:
      externalAcquisitionMode: waiver-only
      immediateFreeAgentAddsAllowed: false
      tradeRepairAllowed: false
      waiverMustPrecedeKickoff: strict
    rules:
      - The model is a pure function of the lineup evidence and the waiver facts; the clock is an explicit input (AtUtc) and the model reads no file and no league configuration.
      - It is the only versioned part of the Decision Windows; windows, locks, slot assignment and relevance are fixed provider-neutral semantics without a model ID.
      - A new acquisition policy is a new version chosen from a season on in data-meta.

  team-range-v1:
    status: registered-1199-section-3-step-6
    module: tools/derived_data_lib/models/team_range/v1.py
    behaviour: exact move of the method normal-independent-v1 of tools/matchup_projection.py (no new rule); contract in matchup-context.yaml
    contract: .ai-context/manual/matchup-context.yaml
    parameters: calibrated Gaussian team range, starters independent, 50/80/90 percent levels (values stay those of matchup_projection.py at the time of the move)
    rules:
      - The model is a pure function of the starters' PlayerWeekFantasy projections and prediction ranges; it reads no file, no clock and no league configuration.
      - A better method (for example correlated players of one NFL game) is a new version chosen from a season on in data-meta (Models.TeamRange), never a silent change of the numbers.

  win-prob-v1:
    status: registered-1443
    module: tools/derived_data_lib/models/win_prob/v1.py
    behaviour: P(A) = Phi((meanA - meanB) / sqrt(sdA^2 + sdB^2)) from the team projections of team-range-v1, published as whole percents that add up to 100; no calibration factor (Robert, 2026-11-12)
    contract: .ai-context/manual/matchup-context.yaml
    parameters: Distribution normal-difference, Calibration none, Unit whole-percent, UpsetThreshold 0.35, UnderdogThreshold 0.5 (additive with #1446, no existing value changes)
    rules:
      - The model is a pure function of the two team projections (ProjectedFinalScore, StandardDeviation); it reads no file, no clock and no league configuration.
      - A missing input gives null (unknown), never 50 percent. A matchup without variance (all starters final) is decided - 100 percent for the higher score, 50/50 for equal scores.
      - Upset means the winner had less than 35 percent before the week (unrounded value); a tie has no upset.
      - Recap mark (Issue #1446, upset_level): a winner below 35 percent is an upset, a winner from 35 up to (excluding) 50 percent is an underdog win, every other winner has no mark; unknown chance and ties give null. The thresholds live only in this model, never in the frontend.
      - A better chance comes from a better projection model (a new team-range version chosen per season) or a new win-prob version chosen per season in data-meta (Models.WinProb), never from a silent change of the numbers.

  season-stats-v1:
    status: registered-506
    module: tools/derived_data_lib/models/season_stats/v1.py
    behaviour: All-Play and Expected Wins, Luck, relative scoring strength, strength of schedule, points against burden, opponent timing, projection delta, Brick-Wall base and upset counts from the weekly regular-season games of one season; full definitions in season-statistics.yaml
    contract: .ai-context/manual/season-statistics.yaml
    parameters: AllPlay less-plus-half-equal-over-others, UnderdogThreshold 0.5, UpsetThreshold 0.35, Digits 4
    rules:
      - The model is a pure function of the prepared weekly games (points, pregame projection, unrounded pregame chance); it reads no file, no clock and no league configuration.
      - Missing evidence is null (unknown), never zero or 50 percent. A game without a chance counts in no upset figure.
      - Selected per season in data-meta (Models.SeasonStats). A better formula is season-stats-v2, never a silent change of the numbers.

rankingFunctions:
  implementation: tools/derived_data_lib/ranking.py
  versioning: >
    Ranking is a deterministic order statistic, not a league-selectable model. It has
    no model ID. Its behaviour is part of the player-valuation product contract
    (SchemaVersion); a behaviour change bumps that version.
  contract:
    - Active players have FantasyPointsAvgPotentialGame > 0 and FantasyPointsAvgGame > 0; inactive players receive no ranking rows.
    - Ranks are competition ranks: equal values share the rank of the first of them and the following rank skips (1, 1, 3). Tiebreak sort keys never change a rank.
    - Types in order: Total, PerGame, Combined, Total_Pos, PerGame_Pos, Combined_Pos, Combined_Previous.
    - Combined = rank of (rankTotal * 0.5 + rankPerGame * 0.5), ascending; the _Pos variants use the same rule inside one position group.
    - Combined_Previous uses the SeasonMinus1 AvgPotentialGame and AvgGame of players where both are greater than 0.
    - Weights are 0.5 and 0.5 (formerly ConfigUtils.psm1 WeightTotal and WeightGame, removed with #919 step 8; the shadow keeps them as fixed legacy oracle constants); they are fixed ranking constants in v1 and not league metadata.

parityRequirement:
  rule: >
    Every model reproduces the current PowerShell behaviour exactly, without
    rounding tolerance (Robert, 2026-10-14). Parity is proven by hand-computed unit
    tests, by an equivalence test against the existing validated Python port in
    tools/players_league_scoring_shadow.py and by the exact shadow comparison of
    #919 step 4. A difference is explained and fixed, or needs Robert's explicit okay.
  numerics:
    - PowerShell [math]::Round and Python round() both use round-half-to-even on the binary value.
    - Sums that feed averages use sequential accumulation in descending order; Python's built-in sum() (compensated for floats since 3.12) is not used for money-like averages.
    - Exponentiation uses math.pow(x, 2.0) like [math]::Pow.

failClosed:
  - unknown model ID
  - model ID of the wrong kind
  - non-finite input values (NaN, infinity)
  - non-positive TopN or empty salary list in salary-cap
  - non-integer or non-positive team count
  - lifecycle - naive (not timezone-aware) AtUtc, unparsable instants, non-integer week values
  - repairability - naive AtUtc, duplicate candidates, slots without ID or type

documentation:
  humanDescription: >
    The human-readable description of each model is its module docstring plus this
    contract. The research under fantasy-management/league-economy/salary/ stays
    concept material for future versions and is not the model definition.
 
l10PreActivation:
  issue: 1237
  state: selected-for-team-cap-outlook-app-delivery
  models:
    roster-cap-v1:
      kind: roster-cap
      module: tools/derived_data_lib/models/roster_cap/v1.py
      produces: Stable top-N salary usage for one fantasy roster (not the league-wide cap limit).
      input: Explicit PlayerID/salary roster and positive top_n; no league or clock defaults.
    auto-cut-v1:
      kind: auto-cut
      module: tools/derived_data_lib/models/auto_cut/v1.py
      produces: Ordered hypothetical sixth-highest-salary cuts until roster usage is at or under cap, or no sixth player remains.
      input: Explicit roster, top_n and cap_limit; separately evaluated for current and projected salary.
  activationBoundary: >
    Registry entries do not select these models in data-meta, change generated
    products or App JSON, or authorize a new writer. League/season selection,
    persisted delivery and interactive Trade Simulator behavior require the
    separate #1237 consumer-contract decision and safe publication review.

l10Delivery:
  issue: 1237
  path: public/data/TeamCapOutlook.json
  producer: tools/team_cap_outlook_app_publish.py
  models: [roster-cap-v1, auto-cut-v1]
  principles:
    - The league selects model IDs in data-meta for each season; input values are canonical roster facts and player-valuation.
    - One current-season App read model; no additional data-derived product and no new workflow.
    - The producer writes only on semantic changes in the existing League Live publisher.
    - The input-roster salary witness is used by Angular only for freshness validation, never domain recomputation.
    - A missing, stale or unknown result must not be interpreted as zero salary or no cut requirement.
