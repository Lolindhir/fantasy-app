schemaVersion: 1

ciDiagnostics:
  purpose: >
    Machine-readable helper output for checking whether the generated site build
    that belongs to a commit succeeded, failed or was cancelled.

  files:
    diagnosticsDir: .ai-workflow
    buildLog: .ai-workflow/build.log
    scriptResult: .ai-workflow/deploy-script-result.json
    workflowResult: .ai-workflow/workflow-result.json
    stepSummary: GitHub Actions GITHUB_STEP_SUMMARY

  commitStatus:
    context: deploy/result
    owner: .github/workflows/deploy.yml workflow-result job
    source: GitHub commit status API
    states:
      success: Build and Pages deployment completed successfully.
      failure: Build or Pages deployment failed.
      error: Build or Pages deployment was cancelled or could not produce a normal result.
    descriptionFormat: build=<build-result> deploy=<deploy-result> conclusion=<workflow-conclusion>

  ownership:
    generator: deploy_action.ps1 and .github/workflows/deploy.yml
    category: transient-ci-helper-output
    committed: false
    gitignore: .gitignore

  resultSchema:
    deployScriptResult:
      schemaVersion: 1
      type: deploy-script-result
      fields:
        - conclusion
        - stage
        - message
        - buildExitCode
        - commit
        - shortCommit
        - buildLog
        - generatedAtUtc
    workflowResult:
      schemaVersion: 1
      type: deploy-workflow-result
      fields:
        - workflow
        - runId
        - runAttempt
        - commit
        - shortCommit
        - ref
        - event
        - build
        - deploy
        - conclusion
        - generatedAtUtc

  agentUsage:
    - After a commit that can start a site build, first check the deploy/result commit status for the committed SHA.
    - Use deploy/result as the primary machine-readable result when workflow runs are not directly listable through the available tools.
    - Prefer workflow-result.json, deploy-script-result.json and build.log when those files are available through CI artifacts.
    - Use the GitHub Actions step summary as a human-readable fallback when artifacts are not available.
    - Treat cancelled runs as a separate state when the workflow result is available; commit status represents cancellation as error because GitHub commit statuses only allow success, failure, error or pending.
    - If the current tools cannot access commit status, run status, summaries or artifacts, say so explicitly instead of assuming success.
