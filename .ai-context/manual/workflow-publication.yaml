schemaVersion: 1
status: active
purpose: >-
  Canonical publication-safety contract for GitHub Actions workflows that mutate
  repository branches. It classifies each branch writer by how it must react when
  the target branch advances while work is in flight.

principles:
  - Never force-push to resolve an automated publication race.
  - Self-contained snapshots may use rebase-and-retry when their content does not depend on repository state that can change during the run.
  - Repository-derived outputs must use rebuild-and-retry: fetch latest target, discard the stale generated commit, rerun the generator, then retry publication.
  - Real generator failures, unexpected changed paths and non-race Git failures fail closed.
  - Transient transport/server failures (HTTP 5xx, RPC failed, hung-up or reset connections, DNS/timeouts, HTTP 429) of git push and git fetch are neither a branch race nor a generator failure. Both helpers repeat the same git command a bounded number of times (default 3, backoff 5/15/45 s plus jitter, `--max-transient-retries` / `--transient-backoff-seconds`) with a separate counter from the race counter; a rebuild helper re-pushes the same local commit instead of rebuilding. Auth errors (403, permission denied, authentication failed) and hook/protection rejections stay fail-closed, as do exhausted transient retries.
  - Workflow-local push loops that do not use the helpers (sync-league-source-data, sync-nfl-source-data, materialize-fantasy-operations-inputs, source-data-readiness) do not yet have transient retry; moving them onto the helpers is tracked in Issue #471 and needs explicit workflow approval.
  - Cross-workflow serialization is not the primary safety mechanism; independent writers may remain parallel when publication semantics are race-safe.
  - Generated-data writers publish only their declared output scope.
  - Every workflow that requests repository content write permission, or otherwise contains recognized branch-publication behavior, must be explicitly classified here before CI may accept it.
  - A workflow that intentionally needs contents write for a non-branch surface must still be classified as non-branch-writer; write permission is never an implicit exemption from publication review.
  - Classified workflow paths must remain synchronized with the real workflow inventory; deleted or renamed workflows leave no stale classification entries.

classes:
  rebase-and-retry:
    helper: tools/publish_generated_commit.py
    meaning: One self-contained generated snapshot may be rebased onto a newer target branch; content is not recomputed.
  rebuild-and-retry:
    helper: tools/rebuild_and_publish.py or workflow-local/delegated equivalent with the same semantics
    meaning: The generator is rerun from the latest target branch after every recognized publication race.
    exception: sync-nfl-source-data.yml may rebase its validated canonical commit when the race touched no declared materialization input path (materialize_input_pathspecs); any input change, rebase conflict or exhausted rebase attempts still force a full rebuild or fail closed.
  isolated-branch:
    meaning: State is intentionally published to a dedicated non-main branch and must not compete with main writers.
  non-branch-writer:
    meaning: Workflow may hold write permissions for another GitHub surface but does not publish repository branch content.

writers:
  .github/workflows/update-league.yml: rebuild-and-retry
  .github/workflows/update-players.yml: rebuild-and-retry
  .github/workflows/update-games.yml: rebuild-and-retry
  .github/workflows/update-drafts.yml: rebuild-and-retry
  .github/workflows/update-transactions.yml: rebuild-and-retry
  .github/workflows/update-standings.yml: rebuild-and-retry
  .github/workflows/update-teams.yml: rebuild-and-retry
  .github/workflows/update-past-seasons-index.yml: rebuild-and-retry
  .github/workflows/clean-backups.yml: rebuild-and-retry
  .github/workflows/source-data-readiness.yml: rebuild-and-retry
  .github/workflows/sync-nfl-game-finality.yml: rebuild-and-retry
  .github/workflows/sync-nfl-source-data.yml: rebuild-and-retry
  .github/workflows/sync-nfl-player-availability.yml: rebuild-and-retry
  .github/workflows/sync-league-source-data.yml: rebuild-and-retry
  .github/workflows/sync-league-core.yml: rebuild-and-retry
  .github/workflows/sync-league-transactions.yml: rebuild-and-retry
  .github/workflows/sync-league-drafts.yml: rebuild-and-retry
  .github/workflows/materialize-fantasy-operations-inputs.yml: rebuild-and-retry
  .github/workflows/update-fantasypros-rankings.yml: rebase-and-retry
  .github/workflows/update-fantasycalc-rankings.yml: rebase-and-retry
  .github/workflows/update-fantasy-football-calculator-adp.yml: rebase-and-retry
  .github/workflows/update-fftoday-projections.yml: rebase-and-retry
  .github/workflows/update-cbs-sports-projections.yml: rebase-and-retry
  .github/workflows/update-sleeper-trending.yml: rebase-and-retry
  .github/workflows/workflow-health-snapshot.yml: isolated-branch
  .github/workflows/scheduler.yml: isolated-branch

validation:
  regressionTest: tools/tests/test_workflow_publication_contracts.py
  rebuildHelperTests: tools/tests/test_rebuild_and_publish.py
  coverageRule: >-
    CI inventories every .github/workflows/*.yml and *.yaml file. A workflow requires
    explicit classification when it requests contents: write/write-all at workflow
    or job scope, or when recognized branch-publication markers are present.
  rules:
    - Every workflow requiring publication classification must have exactly one writers entry above.
    - Every writers entry must point to an existing workflow file and use a declared class.
    - Every workflow listed as rebuild-and-retry must invoke tools/rebuild_and_publish.py, contain an explicitly reviewed workflow-local rebuild loop, or delegate to a reusable workflow with the same classified rebuild semantics.
    - Every workflow listed as rebase-and-retry must invoke tools/publish_generated_commit.py.
    - Workflows classified non-branch-writer must not contain recognized branch-publication markers.
    - App/Maintenance generated-data workflows must not contain a naked direct HEAD:main push.
    - App/Maintenance generated-data workflows need contents: write only unless another permission is separately justified.
