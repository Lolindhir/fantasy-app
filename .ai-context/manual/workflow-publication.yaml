schemaVersion: 1
status: active
purpose: >-
  Canonical publication-safety contract for GitHub Actions workflows that mutate
  repository branches. It classifies each branch writer by how it must react when
  the target branch advances while work is in flight.

principles:
  - Never force-push to resolve an automated publication race.
  - Self-contained snapshots may use rebase-and-retry when their content does not depend on repository state that can change during the run.
  - Repository-derived outputs must use rebuild-and-retry: fetch latest target, discard the stale generated commit, rerun the generator, then retry publication.
  - Real generator failures, unexpected changed paths and non-race Git failures fail closed.
  - Transient transport/server failures (HTTP 5xx, RPC failed, hung-up or reset connections, DNS/timeouts, HTTP 429) of git push and git fetch are neither a branch race nor a generator failure. Both helpers repeat the same git command a bounded number of times (default 3, backoff 5/15/45 s plus jitter, `--max-transient-retries` / `--transient-backoff-seconds`) with a separate counter from the race counter; a rebuild helper re-pushes the same local commit instead of rebuilding. Auth errors (403, permission denied, authentication failed) and hook/protection rejections stay fail-closed, as do exhausted transient retries.
  - Workflow-local push loops that do not use the helpers (sync-nfl-source-data Source job, source-data-readiness) do not yet have transient retry; moving them onto the helpers is tracked in Issue #471 and follows the root scope-based risk authorization rules, without a separate workflow-file gate.
  - Issue #1421 Injury activation: the centrally scheduled sync-nfl-injuries.yml is a permanent delegation wrapper, not an independent branch writer. Its only called publisher is classified rebuild-and-retry sync-nfl-source-data.yml under the existing nfl-source-data-sync concurrency group, now with a dataset-exclusive injuries scope: raw release/metadata publication first, then canonical injury partition publication with exact write-set and rebuild-on-input-race. A change to the wrapper on main uses a read-only original-byte/schema/identity/schedule preflight and delegates at most one dynamically discovered historical pilot through this same writer; an unknown historical asset fails closed before any publication. The nfl_injuries_derived dependent job publishes only data-derived/nfl-injuries/** via tools/rebuild_and_publish.py against current main. The 10-minute ESPN Source writer and NFL Games Derived writer remain independent; ordinary full NFL Source sync never acquires Injury reports implicitly. Only the explicitly reviewed Monday recurrence may admit one missing, fully preflighted original as described below.
  - Issue #1421 recurring history: only the existing unfiltered Monday 04:00 Europe/Berlin scheduled full sync-nfl-source-data.yml Source Raw transaction, or its explicitly opted-in manual workflow_dispatch with reconcile_injury_history=true (unfiltered full scope, force=false), checks the complete official Injury release inventory. Ordinary manual starts, targeted runs, reusable calls and main pushes do not trigger historical reconciliation. It may admit ALL dynamically discovered eligible missing historical Source seasons in one invocation, pinning the complete selected season set from its first intake attempt across all Raw/Canonical publication retries (including an empty selection). Preflight ALL selected original assets and all row-level identity/game links before any new Raw files are staged; any rejected original blocks the entire new batch, with no partial Raw publication. The selected seasons must be finite, less than current source season and present in the official release inventory: an entirely absent Raw+metadata pair or ONLY the missing CSV/metadata half (data-source/providers/nflverse/injuries/raw-<season>.csv and metadata-<season>.json), AFTER validating the pinned official release URL/ID/update time/size, matching official SHA-256 when provided, always recording exact downloaded byte SHA-256, exact schema, and complete identity/GameID preflight BEFORE the existing Raw git add/commit. Digestless assets must carry the explicit official-asset/self-hash provenance state, never a claimed provider digest. Any surviving original Raw, metadata or Canonical Source fingerprint must match the reconstructed original before only missing paths may be restored; no frozen original replacement, missing schedule synthesis, new writer or write scope. It then replays every accepted persisted historical Injury Canonical season using immutable original Raw plus current identity/schedule, verifies a second semantic no-op and commits only its existing data-source/** scope. After successful Source publication, the existing nfl_injuries_derived rebuild-and-retry publisher handles every accepted historical data-derived/nfl-injuries/** season, followed by read-only official release revision checks for frozen originals. An upstream-missing, byte-mismatching, unlinked or otherwise unauditable source blocks admission and cannot become false empty history. The single documented 2022 Week-17 BUF@CIN cancellation is the only historical intake exception: its 17 BUF/CIN REG reports retain GameID=null and GameLinkState=not-found; every other unmatched/ambiguous link or identity blocks. This never adds a played canonical game or broadens the writer write-set. Every Monday repeats the discovery after prior no-ops, missing file deletions or incomplete prior runs; this is a persistent recurring reconciliation, not a one-shot backfill. No new writer job, scheduler target, credentials, Raw repair, forced original replacement, App or League consumer is introduced; frozen source revisions remain review-only.
  - Issue #1590 (ADR-092, approved by Robert 2026-11-20 as an elevated effect): the existing nfl_injuries_derived job of sync-nfl-source-data.yml additionally publishes the Shared Derived product data-derived/nfl-player-availability through a second tools/rebuild_and_publish.py call (scope nfl-availability-derived, tools/nfl_player_availability_materialize.py --all-seasons --write) after the Injury Derived steps, and the existing update-players.yml additionally renders public/data/PlayerInjuryHistory.json (prefix public/data already declared, fail-soft) through tools/player_injury_history_app_publish.py after Players.json. The only change is the added path prefix data-derived/nfl-player-availability; writer class, credentials, permissions, triggers and concurrency are unchanged and a data-derived-only commit triggers no deploy. The product is a pure function of persisted inputs and a season file is written only on a byte difference. Rollback: remove the step and the generator call.
  - Issue #1077 original-2025-PBP pilot: the EXISTING sync-nfl-source-data.yml full/unfiltered Source job is the sole owner of a bounded original-2025-byte archival side effect. It verifies the pinned official compressed SHA/size and runs the existing read-only game/play/metric audits before uploading the immutable, SHA-addressed original gzip to a GitHub Release asset on this same repository (GitHub contents:write already granted), outside git history. Only the small provider Source manifest data-source/providers/nflverse/play-by-play-original/metadata-2025.json joins the existing Source Raw Git publication, with normal source publication retry/race/no-op rules. The release upload can precede the manifest Git commit; retries must verify and reuse an already uploaded asset. Never overwrite/delete accepted Source bytes, never auto-update frozen 2025 on upstream revision drift, never run on targeted/scoped source invocations. This is not another branch writer, scheduler, token or derived/public metric publisher. Original-pilot validation, upload or dependency failures fail closed for the new archive only, emitting an explicit Actions warning without blocking unrelated routine Source publication. Other seasons and PBP-derived game details are not enabled.
  - Issue #1077 active-season original PBP acquisition: the existing, unfiltered full sync-nfl-source-data.yml Source job also runs tools/nfl_pbp_source_auto.py against dynamically discovered current_source_season. It selects only the exact official nflverse-data release 'pbp' CSV.gz asset, requires official GitHub SHA-256 digest/size and a matching downloaded original, verifies its full original GZIP/CSV stream and observed GameID/PlayID identity against the accepted canonical Source schedule (data-source/nfl/schedules/<season>.json), with no data-derived index, future PlayerStats requirement, or team-metric replay gating the original Source pointer. Team-metric/PlayerStats reconciliation remains a separately runnable read-only downstream diagnostic. Accepted original revisions are saved as distinct, immutable SHA-addressed GitHub Release assets outside git; the small active-season data-source/providers/nflverse/play-by-play-original/metadata-<season>.json pointer advances only after the new immutable asset is accepted. Previous asset tags are retained and recorded in manifest lineage (no overwrite/delete). A matching current digest is a verified no-op, and a broken accepted prior archive fails closed. The current-season-only guard prevents automatic changes to closed-season archives; the pinned 2025 Source remains under its existing freeze/revision-review contract. This is the SAME full Source writer's data-source/providers publication class and its existing contents:write authorization, with no new scheduler, workflow, branch writer, permissions, output root, or Derived/App writer. Failures are isolated to this PBP intake with explicit warning and do not block independent NFL canonical Source updates. A successful accepted Source manifest is consumed by the existing independent NFL GameDetail v2 Derived writer on the same successful full Source run; lack of a valid accepted original leaves PBP Metrics unavailable/null rather than fabricated.
  - Issue #1077 historical original-PBP intake: the SAME unfiltered scheduled/manual full sync-nfl-source-data.yml Source Raw publisher additionally performs a bounded dynamically discovered acceptance of at most three missing historical nflverse PBP original seasons per invocation, pinned across Source Raw retries. This is an additive immutable GitHub Release/archive side effect (approximately 454 MB in total for 1999-2024) and writes only small per-season metadata-<season>.json under the pre-existing data-source/providers/nflverse/play-by-play-original scope. Canonical Source schedules select eligible seasons; no Derived or consumer read ever selects a Source season. All selected gzip bytes undergo exact official asset identity, available official SHA256 (digestless 1999 uses explicitly labeled self-SHA256), size, full GZIP and canonical game/play audit before any release/manifest. Any write retries must reuse verified content-addressed assets, and no existing frozen original is automatically replaced when official bytes change. The same existing dependent nfl_games_derived writer reconstructs source-backed historical GameDetail v2 when newly accepted assets appear or on Monday; an Actions cache of verified immutable archives is permitted for efficiency, but not as canonical Source and not as a completeness certification. No new scheduler, branch writer, privilege, Source/Derived output root or App output path.

  - The dependent nfl_games_derived job in sync-nfl-source-data.yml is a separately scoped, Source-dependent Derived publisher. It runs only after a successful full NFL Source Sync or a successful explicitly targeted nflverse.schedule-odds Source sync, and uses tools/rebuild_and_publish.py (not the Source job's custom push loop). Its declared output scope is exclusively data-derived/nfl-games/**; game-finality/NFL Live and unrelated targeted dataset runs skip it. Under #1077 (specifically authorized 2026-11-16), the same job additionally publishes data-derived/nfl-games/details/** via the same rebuild-and-retry class: current supported games on a normal/odds refresh; all accepted historical seasons on Monday's full Source run in Europe/Berlin, without another scheduler, permission or branch writer. Accepted immutable original PBP bytes remain outside this Derived writer scope. GameDetail v2 may publish only ten compact provisional PBP-derived observations from manifest-verified Source seasons, with missing seasons explicitly unavailable; original play rows never enter Derived. A one-time historical v1→v2 schema upgrade is allowed on full Source runs when outdated detail schemas exist; subsequent historical replay remains Monday-only. No additional writer, scheduler, permissions, destination, or app consumer is introduced.
  - odds-refresh.yml is an isolated technical state branch writer (odds-refresh-state/odds-buffer/<season>.json only), using tools/odds_state_publish.py for optimistic SHA CAS. It conditionally delegates nflverse.schedule-odds publication with materialization_scope=schedule-odds to the existing rebuild-validated sync-nfl-source-data.yml. This scope requires parity with published canonical schedules and writes only data-source/nfl/schedule-odds/**, retaining the original Source writer's rebuild-or-safe-rebase publication class and concurrency group. The dependent NFL Game Derived writer retains its separate data-derived/nfl-games/** scope. No additional main writer, writer destination, credentials or force push exists.
  - sync-league-source-data.yml keeps its two-phase raw-then-canonical loop with failure diagnostics, but fetches and pushes through tools/git_transient.py, which reuses the transient-retry classification of tools/rebuild_and_publish.py (exit 10 = branch race, rebuild from latest main; any other failure fails closed). Its League Live callers (league-live.yml) publish Standings, League and PlayerWeekFantasy through tools/rebuild_and_publish.py. Since Issue #471 step 3 (amended by Issue #1319), the League Live league job publishes in the same rebuild-and-retry transaction tools/league_live_derived_refresh.py outputs: current-season league-transactions, current plus all dynamically configured future-year league-drafts, and newest scored-week team-week-performance, using the pre-existing three data-derived output prefixes. These prefixes are already written by the weekly update-history and update-standings runs; the writer class, credentials and permissions of league-live.yml are unchanged and a data-derived-only commit triggers no deploy. The independent TeamWeekPerformance refresh remains fail-soft on unready weeks. However, missing/stale current or future Drafts/Transactions products cannot be published around: the App history consumer verifies its persisted Derived inputs against canonical history and exits nonzero via --fail-on-error, aborting the existing rebuild-and-retry League publication without a partial commit (Issue #1319). The current publication command order is derived refresh, PlayerWeekFantasy refresh, Matchups/FantasyGameContext App publication, League history App publication, WeeklyRecaps App projection, RequestLeaguePublication, then TeamCapOutlook App publication. The League Live TWP refresh does not scan corrected older weeks; that remains the independent weekly historical job.
  - Issue #1263 C9c.3: The existing full sync-league-source-data.yml writer may additionally publish the bounded data-source/_sync/league-refresh-witnesses/<LeagueID>/<Season>-week-<WW>.json proof AFTER successful full raw acquisition, canonical materialization and deterministic no-op validation, within its existing rebuild-on-race loop. Only source-owned proof metadata is written; a witness failure never broadens publication or blocks canonical data. Unchanged proofs remain byte-identical; other materialization scopes cannot write this prefix. The disabled FM Weekly Review is not a consumer yet.
  - Issue #1627 (ADR-097, approved by Robert 2026-11-22 as an elevated effect): the existing nfl-live.yml gains the job espn-schedule (continue-on-error, never blocks the chain) that publishes only data-source/providers/espn/schedule through tools/rebuild_and_publish.py (scope nfl-espn-schedule, rebuild-and-retry, same PAT and contents: write as before). The ESPN kickoff observations are applied inside the existing nflverse schedule materializer (sync-nfl-source-data.yml game-finality, schedule-odds and full scopes read the snapshot as a materialization input; canonical write set unchanged). No new workflow, credential or permission. Rollback: remove the job and the overlay call.
  - Cross-workflow serialization is not the primary safety mechanism; independent writers may remain parallel when publication semantics are race-safe.
  - 'Issue #1263 (G5 pending starvation, observed 2026-11-15): the shared Source writer groups nfl-source-data-sync (full/scheduled/push sync plus the callers nfl-live finality, odds-refresh scoped Odds and the sync-nfl-injuries wrapper) and league-source-data-sync (daily full sync plus the league-live source job) declare concurrency queue: max with cancel-in-progress: false. One run still holds the group at a time; waiting runs are kept FIFO (GitHub cap 100) instead of the default single pending slot, where every new waiter cancelled the previous one. Evidence: during three push-triggered full NFL syncs (24-51 min) on 2026-11-15, scheduled and manual Injury runs, NFL Live finality and one Odds publication cancelled each other while pending, and the central scheduler re-dispatched cancelled targets, which displaced the next waiter. The queue is bounded in practice: nfl-live, odds-refresh and league-live hold their own single-pending workflow groups, and the scheduler treats a pending run as in flight and does not re-dispatch it. Accepted cost: queued redundant runs execute afterwards as fast rebuild-and-retry no-ops, and a live run can wait behind an earlier queued run. Long full syncs still delay live writers by design; separating them would change writer serialization and needs its own review. Rollback: remove queue: max.'
  - Issue #774 (ADR-098, approved by Robert 2026-11-23 as an elevated effect): the existing writers league-live.yml (fail-soft) and update-history.yml additionally publish the Shared Derived product data-derived/league-teams (one file per league, all seasons) through tools/derived_data.py materialize --product league-teams in their existing rebuild-and-retry commits. The only change is the added path prefix; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the materializer call from both workflows.
  - Issue #506 (ADR-082, approved by Robert 2026-11-13 as an elevated effect): the existing writers league-live.yml (current season, fail-soft, after the WeeklyRecaps projection) and update-history.yml (all seasons, before the Past Seasons index) additionally publish the Shared Derived product data-derived/season-statistics and the App files SeasonStatistics.json and past_seasons/SeasonStatistics through tools/season_statistics_app_publish.py in their existing rebuild-and-retry commits. The only change is the added path prefix data-derived/season-statistics; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the generator call from both workflows.
  - Issue #1571 (ADR-089, approved by Robert 2026-11-19 as an elevated effect): the existing writers league-live.yml (current season, fail-closed like the App Matchups file it feeds, before the App publisher) and update-history.yml (completed seasons, before the App history publisher) additionally publish the Shared Derived product data-derived/matchup-context through tools/matchup_context_materialize.py in their existing rebuild-and-retry commits; the App files are rendered from it by tools/matchup_context_app_publish.py and the PlayerWeekFantasy refresh no longer publishes MatchupProjections itself (--skip-matchup-projections). The only change is the added path prefix; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the materializer call and drop --skip-matchup-projections; the App publisher then needs the previous computed path from git history.
  - Issue #1571 step 5 (L4, ADR-089): in the existing writers league-live.yml, update-history.yml, update-standings.yml and update-players.yml the materialization of the Shared Derived products player-valuation, league-standings, season-statistics and league-rivalry is its own command (tools/derived_data.py materialize, new --scope current|history|all) before the consumer generators tools/*_app_publish.py, which now only render from the persisted products. Same output prefixes, fail-soft behaviour (season-statistics, league-rivalry) and fail-closed behaviour (standings, players) as before; no new prefix, writer, credential or permission. Rollback: restore the previous single generator call.
  - Issue #1584 CP5 (ADR-096, approved by Robert 2026-11-22 as an elevated effect): the existing writers league-live.yml (current season, fail-soft) and update-history.yml (completed seasons, history) additionally publish the Shared Derived product data-derived/team-injury-impact through tools/team_injury_impact_materialize.py and render public/data/InjuryImpact.json through tools/injury_impact_app_publish.py in their existing rebuild-and-retry commits. The only change is the added path prefix data-derived/team-injury-impact; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the two generator calls from both workflows.
  - Issue #1571 step 4 (ADR-089, approved by Robert 2026-11-19 as an elevated effect): the existing writer league-live.yml additionally publishes the Shared Derived product data-derived/team-cap-outlook through tools/team_cap_outlook_materialize.py (current season, fail-soft, before the App renderer tools/team_cap_outlook_app_publish.py write). The only change is the added path prefix; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the materializer call; the App renderer then needs the previous computed load path from git history.
  - Issue #1571 step 3 (ADR-089, approved by Robert 2026-11-19 as an elevated effect): the same two writers additionally publish the Shared Derived product data-derived/weekly-recaps through tools/weekly_recaps_materialize.py (league-live.yml current season before the App publisher, update-history.yml completed seasons before the App history publisher); WeeklyRecaps.json, the past_seasons archives and PlayerAwardHistory.json are rendered from it by tools/weekly_recaps_app_publish.py and no published archive is an input. The only change is the added path prefix; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the materializer call; the App publisher then needs the previous computed path from git history.
  - Issue #1519 (ADR-088, approved by Robert 2026-11-19 as an elevated effect): the existing writers league-live.yml (current season, incremental, fail-soft, after season-statistics) and update-history.yml (all seasons, full, fail-closed, before the Past Seasons index) additionally publish the Shared Derived product data-derived/league-schedule-outlook through tools/league_schedule_outlook_materialize.py in their existing rebuild-and-retry commits. The materializer builds in memory, re-reads inputs and aborts on change, replaces files atomically and writes index.json last; the model comes from data-meta Models.ScheduleOutlook. The only change is the added path prefix; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the generator call from both workflows.
  - Issue #1519 App delivery (Robert 2026-11-20): the same two writers additionally run tools/league_schedule_outlook_app_publish.py write, which renders public/data/ScheduleOutlook.json from the persisted product. Only the already declared public/data prefix is used; no new path prefix, writer class, credential or permission. Rollback: remove the generator call from both workflows.
  - Issue #1455 (ADR-083, approved by Robert 2026-11-13 as an elevated effect): the existing writers league-live.yml (fail-soft, after the matchup context) and update-history.yml (before the Past Seasons index) additionally publish the Shared Derived product data-derived/league-rivalry (one file per league) and the App file public/data/Rivalry.json through tools/rivalry_app_publish.py in their existing rebuild-and-retry commits. The only change is the added path prefix data-derived/league-rivalry; writer class, credentials, permissions and triggers are unchanged and a data-derived-only commit triggers no deploy. Rollback: remove the prefix and the generator call from both workflows.
  - The existing weekly update-history.yml pipeline materializes historical Shared Derived league-transactions and league-drafts before rebuilding App transactions/history. Its rebuild-and-retry commit permits only public/data, data-derived/league-transactions and data-derived/league-drafts; generator failures abort publication. No new scheduler target or writer class is introduced.
  - The existing weekly update-standings.yml has three independent jobs: Standings, historical PlayerWeekFantasy and historical TeamWeekPerformance. TWP does NOT need historical PWF success (official Sleeper awards are authoritative). Each historical job uses tools/rebuild_and_publish.py, with exactly one permitted data-derived/player-week-fantasy or data-derived/team-week-performance prefix respectively. TWP recalculates all finalized league weeks with canonical league/finality gates and optional, non-blocking PWF parity (--all-finalized --write, not --require-pwf); any blocked week aborts its entire batch before any output write. Existing historical corrections are recovered on the next successful weekly rerun, rather than via a Source-revision watcher; the next normal League Live App publication reprojects WeeklyRecaps. Publication races rebuild from latest main; unchanged results produce no commit. No extra workflow, schedule, branch-writer class, credentials, 10-minute League Live App producer or App/Source publication destination.
  - Generated-data writers publish only their declared output scope.
  - Every workflow that requests repository content write permission, or otherwise contains recognized branch-publication behavior, must be explicitly classified here before CI may accept it.
  - A workflow that intentionally needs contents write for a non-branch surface must still be classified as non-branch-writer; write permission is never an implicit exemption from publication review.
  - Classified workflow paths must remain synchronized with the real workflow inventory; deleted or renamed workflows leave no stale classification entries.

classes:
  rebase-and-retry:
    helper: tools/publish_generated_commit.py
    meaning: One self-contained generated snapshot may be rebased onto a newer target branch; content is not recomputed.
  rebuild-and-retry:
    helper: tools/rebuild_and_publish.py or workflow-local/delegated equivalent with the same semantics
    meaning: The generator is rerun from the latest target branch after every recognized publication race.
    exception: sync-nfl-source-data.yml may rebase its validated canonical commit when the race touched no declared materialization input path (materialize_input_pathspecs); any input change, rebase conflict or exhausted rebase attempts still force a full rebuild or fail closed.
    mixedWorkflow: fm-daily.yml (Issue #947) is classified rebuild-and-retry because its materialize job rebuilds Fantasy Operations inputs through tools/rebuild_and_publish.py. Its six provider matrix legs each publish one self-contained external-source snapshot through tools/publish_generated_commit.py (rebase-and-retry); both helpers are required in that workflow.
  isolated-branch:
    meaning: State is intentionally published to a dedicated non-main branch and must not compete with main writers.
  non-branch-writer:
    meaning: Workflow may hold write permissions for another GitHub surface but does not publish repository branch content.

writers:
  .github/workflows/league-live.yml: rebuild-and-retry
  .github/workflows/update-players.yml: rebuild-and-retry
  .github/workflows/update-games.yml: rebuild-and-retry
  .github/workflows/update-history.yml: rebuild-and-retry
  .github/workflows/update-standings.yml: rebuild-and-retry
  .github/workflows/update-teams.yml: rebuild-and-retry
  .github/workflows/clean-backups.yml: rebuild-and-retry
  .github/workflows/source-data-readiness.yml: rebuild-and-retry
  .github/workflows/nfl-live.yml: rebuild-and-retry
  .github/workflows/odds-refresh.yml: isolated-branch
  .github/workflows/sync-nfl-source-data.yml: rebuild-and-retry
  .github/workflows/sync-nfl-injuries.yml: rebuild-and-retry
  .github/workflows/sync-nfl-player-availability.yml: rebuild-and-retry
  .github/workflows/sync-league-source-data.yml: rebuild-and-retry
  .github/workflows/fm-daily.yml: rebuild-and-retry
  .github/workflows/workflow-health-snapshot.yml: isolated-branch
  .github/workflows/scheduler.yml: isolated-branch

validation:
  regressionTest: tools/tests/test_workflow_publication_contracts.py
  rebuildHelperTests: tools/tests/test_rebuild_and_publish.py
  coverageRule: >-
    CI inventories every .github/workflows/*.yml and *.yaml file. A workflow requires
    explicit classification when it requests contents: write/write-all at workflow
    or job scope, or when recognized branch-publication markers are present.
  rules:
    - Every workflow requiring publication classification must have exactly one writers entry above.
    - Every writers entry must point to an existing workflow file and use a declared class.
    - Every workflow listed as rebuild-and-retry must invoke tools/rebuild_and_publish.py, contain an explicitly reviewed workflow-local rebuild loop, or delegate to a reusable workflow with the same classified rebuild semantics.
    - Every workflow listed as rebase-and-retry must invoke tools/publish_generated_commit.py.
    - fm-daily.yml must invoke both tools/rebuild_and_publish.py and tools/publish_generated_commit.py and must not contain a naked git push.
    - Workflows classified non-branch-writer must not contain recognized branch-publication markers.
    - App/Maintenance generated-data workflows must not contain a naked direct HEAD:main push.
    - App/Maintenance generated-data workflows need contents: write only unless another permission is separately justified.
