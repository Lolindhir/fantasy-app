schemaVersion: 1
domain: weekly-recaps
status: accepted-contract-v1
trackingIssue: 1199
architectureDecision: ADR-063
implementationState: >-
  Issue #1199 section 4 is complete: contract and ADR-063 amendment (step 1), function, CLI and Fast tests (step 2), the App cutover (step 4;
  tools/weekly_recaps_app_publish.py write in League Live for the current season and in the weekly update-transactions run for the history) and
  the removal of RequestWeeklyRecaps.ps1, WeeklyRecapUtils.psm1, WeeklyRecapMatchupFacts.psm1 and WeeklyRecapRegressionTest.ps1 (steps 5 and 6).
  RequestLeaguePublication.ps1 keeps only the PastSeasonsIndex refresh. The App files carry no league dimension, so the publisher fails closed for
  more than one league until the App delivery gains one.

purpose: >-
  Define the Weekly Recaps (KeyPlayers, KeyGames and the TeamAwards projection per final league week) as one pure function of
  canonical facts, products and data-meta. It replaces public/requests/RequestWeeklyRecaps.ps1 and
  public/requests/utils/league/WeeklyRecapUtils.psm1, which read the consumer files Matchups.json and Schedule.json. The result is
  computed, never persisted (pattern of week-finality.yaml, league-lifecycle.yaml, decision-windows.yaml and matchup-context.yaml).
  public/data/WeeklyRecaps.json and past_seasons/WeeklyRecaps/WeeklyRecaps_<season>.json stay App deliveries with unchanged contracts.

winProbability:
  issue: 1443
  models: [team-range-v1, win-prob-v1]
  rule: >-
    Each final week carries WinProbabilities: per matchup the pregame win chance (whole percent) of both teams and the Upset flag (winner below 35 percent
    before the week). Every starter counts with his PlayerWeekFantasy projection of that week (nothing final), recomputed from the product on every
    run and not frozen; the models are chosen per season in data-meta (Models.TeamRange, Models.WinProb). A starter without a usable projection or
    canonical identity makes the chance null (unknown, never 50) and the upset null. A tie has no upset. The season model also carries
    WinProbabilityModel and UpsetCounts per team (Upsets, Weeks with a known chance); the frontend only displays them. Issue #1446 adds per matchup UpsetLevel (upset below 35 percent, underdog from 35 to below 50 percent, otherwise null; the thresholds belong to win-prob-v1) and
    UnderdogWinnerFantasyTeamID (winner of a marked matchup); the Weeks page recap shows one card per marked matchup and nothing for a week in which every favorite won.
    The season UpsetCounts keep counting only real upsets (below 35 percent). The additive fields leave
    SchemaVersion 1 unchanged. Historical seasons are written by the weekly update-transactions run, the current season by League Live.
  backtest: tools/historical_win_prob_backtest.py, research/win-probability/2026/

architecture:
  decisionBasis: [ADR-037, ADR-054, ADR-063, ADR-071, ADR-075]
  logicalLayer: Shared Derived Data (editorial product semantics, computed)
  persistence: none (no product file, no writer, no write prefix; the App files are written by a consumer generator)
  owner:
    function: tools/derived_data_lib/weekly_recaps.py
    cli: tools/weekly_recaps.py
    cliCommand: python3 tools/weekly_recaps.py resolve --league <CanonicalLeagueID> --season <Season>
    consumerGenerator: tools/weekly_recaps_app_publish.py write [--scope current|history|all]
    tests: tools/tests/test_weekly_recaps.py
  rules:
    - The result is a pure function of explicit inputs. There is no clock input, because only final weeks go in.
    - Facts come only from the canonical league matchup rows (pairings through matchup_context.canonical_pairings, starters and points through fantasy_game_context.canonical_matchup_facts), schedule_archive.build_schedule (App game IDs and final scores), the canonical weekly rosters, the league-standings product (neutral team order), the team-week-performance product with the canonical league matchups (TeamAwards), week_finality and data-meta. public/data is never an input.
    - v1 introduces no new selection rule or award. It reproduces the PowerShell behaviour 1:1; the only intended value difference is R2.
    - The WeeklyRecaps.json contract (SchemaVersion 1) is unchanged.

decisions:
  R1: Computed, not persisted. resolve(CanonicalLeagueID, Season) returns the season model; tools/weekly_recaps_app_publish.py writes the App files only on a semantic difference. No new writer, write prefix or product directory.
  R2: >-
    The week basis is LeagueScoredWeek (ADR-071) instead of Matchups CompletionState = final, so the recap and its TeamAwards (which follow the
    team-week-performance partition and thus LeagueScoredWeek) cover the same week. Shadow finding (step 2): the current season is identical, but in completed
    seasons the Matchups completion is unknown for most weeks (starter or game evidence gaps), so the published history only holds a few weeks (2024: none,
    2025: two). The function therefore also recaps those earlier weeks when their starter and game evidence is complete; every published week stays identical.
    A week with an evidence gap is left out and reported, never guessed.
  R3: No model ID for the selection rules in v1. They are fixed, league-independent editorial semantics (below). A model weekly-recap-v2 with a registry entry and a data-meta key follows only with #499 (weekly fantasy awards) or a league that wants other rules.
  R4: All leagues of the league manifests are processed; the league is never hard-coded.
  R5: League Live writes only the current season; completed seasons are written by the weekly update-transactions run together with the matchup-context history.
  R6: After section 3, the remaining FantasyGameContext/Matchup PowerShell (WeeklyRecapMatchupFacts.psm1) is deleted together with the recap PowerShell.

lineupEfficiency:
  issue: 1408
  summary: >-
    Additive fields of the unchanged SchemaVersion 1 contract (no new file, writer or write path). The team-week-performance partition is only read.
  weekFields: >-
    Each week gets TeamPerformance: one entry per team (FantasyTeamID, ActualStarterPoints, PotentialPoints, MissedPoints, EfficiencyPercent, OptimalLineup[{SlotID,
    PlayerID, CanonicalPlayerID, Points}]), copied from the validated partition and joined to FantasyTeamID exactly like TeamAwards. It is null when the partition is
    missing (unknown, never zero). PlayerID is the Sleeper ID of the App contract resolved through the weekly roster of that week, null when unknown.
  seasonFields: >-
    The season model gets SeasonEfficiency: per team sum(ActualStarterPoints), sum(PotentialPoints), MissedPoints and EfficiencyPercent = Actual / Potential * 100
    (4 decimals) over the recap weeks that have a partition, plus Weeks (the number of weeks counted). Computed in the generator; the frontend only displays it.
  compatibility: Files without the fields stay valid (all fields optional for the frontend); older archives gain them with the next weekly update-transactions run.
  consumers: Weeks page season grid (Efficiency view), team detail Franchise Snapshot, matchup dialog optimal lineup of final weeks.

selectionRules:
  weekBasis: A week gets a recap exactly when week <= LeagueScoredWeek. Weeks after it are absent, not empty.
  starters: Only actual starters (IsStarter) count. A starter without realized point evidence fails closed.
  identity: Team and position of a starter come from the canonical weekly roster of that week (CanonicalPlayerID first, then the Sleeper player ID); a defense is recognised by its team abbreviation and gets position DEF. Anything else fails closed.
  keyPlayers: The top 3 starters by points; tiebreaks neutral team order (ascending), then PlayerID. Fewer than 3 starters fails closed.
  keyGames: >-
    The top 2 NFL games by the sum of starter points; tiebreaks fantasy matchup count, fantasy team count, starter count (all descending),
    then kickoff (ascending), then GameID. Fewer than 2 games with starter production fails closed. Final scores come from the canonical schedule; a missing score fails closed.
  teamAwards: >-
    Best Manager and Best Coach are projected from data-derived/team-week-performance per ADR-063. A missing partition gives State unavailable
    with empty winner lists, never zero. An incompatible or contradictory partition fails closed. Roster IDs map to FantasyTeamID only through the
    canonical league matchups of the same season and week.
  neutralOrder: The neutral team order is the All-Time Overall order of the league-standings product; historical seasons use it as it stood through that season (domain.yaml neutralOrdering).
  rounding: Points are rounded to 4 decimals exactly as the PowerShell generator does.
  failClosed: >-
    Evidence that contradicts itself (matchup facts that are not in the pairings, a TeamAwards partition that disagrees with the matchups) fails the season.
    A week whose starter, identity or game evidence is incomplete (a starter without weekly-roster identity or points, a game without a unique canonical
    schedule row or score) is an evidence gap: the week is absent from the season model and resolve_with_skips reports it, because the PowerShell generator
    only recapped weeks whose Matchups completion was final, which needs the same evidence.

inputs:
  - matchup_context.resolve (tools/derived_data_lib/matchup_context.py)
  - tools/schedule_archive.py build_schedule (canonical schedule and finality)
  - data-source/nfl/weekly-rosters/<season>/<WW>.json
  - data-source/leagues/<CanonicalLeagueID>/seasons/<season>/matchups/week-<n>.json
  - data-derived/league-standings/<CanonicalLeagueID>/<season>.json
  - data-derived/team-week-performance/<CanonicalLeagueID>/<season>/<WW>.json
  - tools/derived_data_lib/week_finality.py
  - data-meta/<CanonicalLeagueID>/metadata.json (league manifest only)

consumers:
  app: public/data/WeeklyRecaps.json and public/data/past_seasons/WeeklyRecaps/WeeklyRecaps_<season>.json via tools/weekly_recaps_app_publish.py (Angular reads them; no Fantasy Management reader)
  cadence: League Live (current season, every ten minutes, products before consumers) and the weekly update-transactions run (completed seasons)

nonGoals:
  - New selection rules or awards (#499 stays separate).
  - Changes to the WeeklyRecaps.json contract other than R2 at the edge and the additive lineupEfficiency fields (Issue #1408).
  - A persisted recap product.
  - Frontend changes.

migration:
  steps:
    1: 'Contract and ADR-063 amendment (this change).'
    2: 'Function with Fast tests ported from WeeklyRecapRegressionTest.ps1.'
    3: 'Shadow compare against the published files, exact except R2, classified validation-shadow.'
    4: 'App cutover in League Live and update-transactions; RequestLeaguePublication.ps1 stops calling RequestWeeklyRecaps.ps1; League Live runtime measured.'
    5: 'Delete RequestWeeklyRecaps.ps1, WeeklyRecapUtils.psm1 and the PowerShell test; update inventory, data-sources.yaml and the consumer-read register.'
    6: 'Delete WeeklyRecapMatchupFacts.psm1 once no caller remains (may coincide with step 5).'

architectureReview:
  existingFirst: Reuses matchup_context.resolve, schedule_archive.build_schedule, the league-standings and team-week-performance products and week_finality; no new product, writer or workflow.
  configuration: The selection rules are fixed editorial semantics; the league and season are inputs. A new rule needs a code change plus a model ID (weekly-recap-v2).
  identity: CanonicalLeagueID + Season; weeks by number; games by the App GameID; teams by FantasyTeamID; players by the Sleeper player ID (App contract).
  invalidation: Recomputed on every call from final facts; the consumer generator writes only on a semantic difference.
  temporal: Only weeks up to LeagueScoredWeek exist; no future or partial week can leak in.
  unknown: A missing TeamAwards partition is unavailable; every other missing evidence fails closed.
  compatibility: Contract unchanged; the PowerShell generator stays productive until the cutover and is held equal by the shadow.
