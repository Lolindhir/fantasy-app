        - Scoring switch to league ScoringSettings is approved by Robert (2026-10-04, #347 block D); validation reference is Sleeper's own player points
    pointHistory:
      fields: [PointHistory.SeasonMinus1, PointHistory.SeasonMinus2, PointHistory.SeasonMinus3]
