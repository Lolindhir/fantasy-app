  dependencyCycles:
    identityEvidence: >
      Resolved by #347 H1a. tools/nfl_source_data_lib/identity.py no longer reads
      Players.json or its git history; Sleeper identity evidence comes from the
      persisted Sleeper snapshot (source sleeper.players, see player-identity.yaml
      sleeperPlatformEvidence). audit.py and coverage.py still read Players.json,
      but only as an object under test, never as evidence. Persisted
      app.Players provenance in provider mappings stays as history. Population and
      field migration of Players.json (#347 H1b, done) is fed from canonical
      identities and the canonical Sleeper snapshot without re-asserting its own
      pairings. H1b removed the remaining Tank01 pairing claim (getNFLPlayerList
      sleeperBotID); the cycle Players.json -> identities -> Players.json no longer exists.
      Optional follow-up (subject to scope-based risk authorization, no separate YAML gate): drop public/data/Players.json from the
      materialize input list of the NFL Source Sync.
    salaryCap: >
      RequestLeague.ps1 derives the league salary cap from the newest PlayerValuation snapshot
      (since Issue #919 step 5); the dead read of Players.json was removed in Issue #1226 step 1.
    historyArchives: >
      Players.json history inputs come from Tank01-keyed past_seasons archives, i.e.
      a legacy read model is used as input. A league-scoring migration must
      re-score seasons -1..-3 from canonical player stats rather than reuse
      archive points.

  observedDefects:
    - id: bye-week-derived-from-played-games
      verified: true
      evidence: >
        2026-10-04: ByeWeek is 4 for 1104 rows and 5 for 164 rows; none of the 1268
        rows matches the team's actual bye week in data-source/nfl/schedules/2026.json.
        Games.json only holds games already fetched, so the first week without a
        fetched game is taken as bye.
      effect: >
        Inferred from code: the bye week is never subtracted from GamesPotential, so
        after a team's real bye GamesPotential is one too high and
        FantasyPointsAvgPotentialGame, Ranking Total and SalaryProjected are biased
        down for that team's players.
    - id: grading-form-depth-truncation
      verified: true
      evidence: >
        Grading[].Value[].GameDetails is serialized as the string
        System.Collections.Specialized.OrderedDictionary (ConvertTo-Json -Depth 5).
        No consumer reads Grading.
    - id: qb-rating-uses-previous-passing-row
      verified: code-reading-only
      evidence: >
        RequestPlayers.ps1 parses $pass.qbr before $pass = $p.Passing is assigned, so
        GameHistory Passing.QBRating carries the previous passing row's value or null.
        Not read by Angular.
        Canonical replacement exists since #347 F4a: data-source/nfl/qbr-week/<season>.json
        (ESPN QBR via nflverse); the consumer switch is G3.
    - id: historical-fgc-player-fallback-unmatched
      verified: resolved-2026-10-16
      evidence: >
        FantasyGameContextCore.ps1 keyed the legacy past-season player map by
        PlayerID/ID/SleeperID, but past_seasons/Players_<year>.json carries only
        TankID, so the fallback never matched. In addition the canonical weekly roster
        rung read no team (records carry the plain string Team), so every 2025 player was
        unknown. Resolved in Issue #420: the Players_<year>.json fallback was removed and
        the weekly roster rung reads Team; history no longer reads Players_<year>.json.
    - id: ops-inputs-legacy-status
      verified: code-reading-only
      evidence: >
        build_fantasy_operations_inputs.py still reads Players.json Status while
        player-signals uses canonical Sleeper status.
        Resolved 2026-10-15 (Issue #919 step 6): Status now comes from the canonical
        population export (canonical_player_inputs.py), Players.json is no input.

  migrationGuidance:
    - Migrate by field group, never Players.json as a whole (#613 guardrail).
    - byeWeek is the smallest independent cutover candidate (canonical schedule, fixes a verified defect, only internal consumer GamesPotential); its parity diff is expected to be non-empty and must be approved as a correction.
    - seasonStatsAndPoints, pointHistory, ranking, salary and the League.json salary cap move together in #347 block D (D2 design, D3 shadow, D4 cutover).
    - nflTeamAndAvailability: free-agent definition decided and implemented in #347 H5/H1b (nflFreeAgentAndAvailabilityStatus).
    - appIdentity and population changes required the identityEvidence cycle decision first; resolved by #347 H1a/H1b (ADR-043).
    - convenienceLinks and grading need no source migration; grading has no consumer and may be repaired or retired separately.

consumerReadClassification:
  issue: 347
  step: K1
  test: tools/tests/test_consumer_read_classification.py
  purpose: >
    Every App, Fantasy Management and tooling file that reads a provider or a
    published public/data read model must carry a classification entry here. The
    repository test scans the consumer code and fails when a read has no entry, when
    an entry names a read that no longer exists, or when a category is unknown.
  scope:
    scanned:
      - public/requests/** (PowerShell, without *RegressionTest.ps1)
      - tools/** (Python, without tests)
      - fantasy-management/** (Python, without tests)
      - fantasy-management/automation/**/*.json and fantasy-management/_ai/*.json (declared inputs)
    notScanned:
      - src/app/** (Angular is the delivery consumer of public/data by design, ADR-004; all JSON loads go through DataApiService)
      - .github/workflows/** (workflow trigger paths are governed by workflow-monitoring.yaml and workflow-publication.yaml)
      - data-source/** (canonical store; a read there is a canonical read, not a classified legacy or provider read)
  tokens:
    provider:<host>: a URL naming a known provider host (sleeper, nflverse, fantasypros, fantasycalc, fftoday, cbssports, fantasyfootballcalculator, espn, tank01, rapidapi)
    sleeper-api:<Function>: a call to a Sleeper client function (the client SleeperUtils.psm1 was retired; its function names stay reserved in the test so a reintroduced call is reported)
    network: an HTTP client call (Invoke-RestMethod, urllib, requests, ...)
    legacy:<Name>: a reference to public/data/<Name>.json, the matching $config.<Name>File or (Get-Config).<Name>File, or a call of a reader helper declared under helperReads
  helperReads: {}
  helperReadsRule: >
    A reader helper hides the read of a published read model from its callers, so the
    scan would miss every caller (L7, datenprodukte analysis 2026-10-29). Each helper is
    declared here with the read model it wraps; a call counts as a legacy:<Name> read of
    the calling file, and the test checks that the helper is defined exactly once in a
    file that carries the matching classified read itself. A new reader helper must be
    added here in the same change.
  transitionalConsumerReadGuard:
    issue: 1263
    test: tools/tests/test_consumer_read_classification.py::test_transitional_consumer_to_consumer_reads_do_not_expand
    policy: >
      Existing app-read-model-chain, intentional-overlay and legacy-read-model-pending
      registrations are migration debt or narrowly justified existing adapters,
      not authorization to introduce another shared fact sourced from an App
      consumer. The Fast regression pins the current file/token/category triples.
      Any new tuple must fail until reviewed against a canonical owner and
      explicitly resolved; removing or reclassifying old debt requires updating
      the pinned baseline in the same change as the verified cutover. Classification
      alone cannot establish semantic parity or prove a read is display-only.
  categories:
    source-layer-acquisition: provider read owned by the data-source acquisition layer; sanctioned
    provider-client: the shared Sleeper HTTP client module (retired in #347 K1 follow-up; category kept for history)
    provider-evidence-fetcher: Fantasy Management acquisition of attributed external evidence (ADR-037)
    provider-direct-supplementary: documented direct provider observation that no canonical dataset covers yet
    legacy-provider-path: App generator code that still calls the Sleeper client directly; the productive path uses a canonical adapter; open follow-up (no entries left since the K1 follow-up)
    display-link-construction: a URL string is built for display; nothing is fetched
    http-helper: generic HTTP helper without a provider-specific read
    repository-infrastructure: repository tooling, not a fantasy base fact
    app-output-owner: the generator or publisher that writes that read model
    app-output-state-feedback: the generator reads its own previously published output to carry state across runs (not a base fact); the file is also written by it
    app-read-model-chain: a consumer reads another published App read model as a deliberate step of the App derivation chain
    app-config-path-owner: resolves generated-file paths
    intentional-overlay: documented consumer-specific display or scoring enrichment (ADR-054 boundary); base facts come from data-source
    manual-league-rule: data-meta league metadata, the manual league-input owner (ADR-054)
    freshness-trigger: read or declared only to detect that published data changed
    validation-shadow: read-only comparison or guard against published output; never an input
    historical-static-reference: frozen published history, not a live read
    analysis-snapshot-input: one-off analysis over published data
    mention-only: the token appears in a comment or docstring, not in an executed read
    legacy-read-model-pending: a base fact is still read from a published read model; open migration or review item
  consumers:
    tools/odds_state_publish.py:
      reads:
        network: repository-infrastructure
      note: 'GitHub Contents API isolated odds-refresh-state CAS reader/writer; technical state only, CLI remains dormant (#471).'
    tools/odds_observation.py:
      reads:
        provider:nflverse: source-layer-acquisition
      note: 'Scoped NFL odds candidate acquisition from fixed registered nflverse games.csv; temp-fetch only, no Source/App publication (#471).'
    tools/ci_test_impact.py:
      reads:
        network: repository-infrastructure
      note: 'CP1 GitHub PR changed-file pagination via read-only REST GET. No fantasy provider reads, source data or publication rights (#1095).'
    fantasy-management/_ai/scripts/build_kicker_weekly_research_plan.py:
      reads:
        provider:cbssports: display-link-construction
        provider:espn: display-link-construction
      note: 'Reads the canonical NFL schedule, game finality and team registry from data-source/nfl (#347 FM-read step); the ESPN and CBS box-score URLs are built for display only, nothing is fetched.'
