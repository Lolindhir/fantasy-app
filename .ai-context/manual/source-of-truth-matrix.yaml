schemaVersion: 2

domain: source-of-truth-matrix

status: accepted
consolidatedAt: 2026-09-10

purpose: >
  Consolidates field- and domain-level source ownership after the NFL source-data
  evaluation and provider-join audit. It distinguishes durable canonical ownership
  from the provider that still feeds the current app runtime during migration.
  This matrix is the decision boundary used before activating additional nflverse
  datasets or redesigning the app-generator DAG.

scope:
  includes:
    - provider-independent NFL person identity and provider mappings
    - NFL Draft and Combine history
    - NFL schedules, scores and game finality
    - NFL player stats and snap counts
    - NFL roster membership and current player/platform status
    - injuries, depth-chart facts and convenience metadata
    - fantasy-league facts that must remain owned by Sleeper, Metadata or generated domain logic
  excludes:
    - frontend-only display state
    - fantasy-management analysis sources and rankings
    - league-specific rules already owned by public/data/Metadata.json
    - generated public/data files as architectural source-of-truth owners

principles:
  canonicalVsRuntime: >
    durableCanonicalPrimary states the intended long-lived owner of a fact.
    currentRuntimePrimary states what the app generator currently reads. They may
    differ while a migration is incomplete. A canonical decision does not itself
    change public/data or activate a source-data dataset.
  fieldLevelOwnership: >
    A provider is primary only for the fields explicitly assigned to it. No
    provider receives blanket ownership of a whole player, game or roster object
    merely because it supplies some fields in that object.
  fallbackIsNotConflictWinner: >
    A fallback may cover temporary unavailability or a legacy consumer during a
    controlled migration. It must not silently override a conflicting canonical
    fact. Conflicts remain fail-closed or unresolved according to the owning
    identity/source contract.
  identityFirst: >
    Provider IDs are mappings/evidence. Canonical NFL-domain person facts resolve
    to CanonicalPlayerID through explicit provider mappings. CanonicalPlayerID is
    issued by fantasy-app, not by the NFL or another provider; source-data/nfl is
    the domain path, not an issuer namespace. Display names are never an
    authoritative join key.
  futureOfficialNflId: >
    If the NFL later exposes a stable official player identifier, model it as an
    external/provider mapping to CanonicalPlayerID. It does not replace or rename
    the existing canonical identity.
  historyIsSticky: >
    Finalized historical facts stay bound to the identity and source evidence used
    when they were canonically materialized. Current provider mappings do not
    reinterpret old facts.
  missingIsNotZero: >
    unavailable, not-yet-available and fetch-failed states must not be serialized
    as a genuine numeric/string zero merely to satisfy a consumer contract.
  generatedReadModels: >
    public/data/** remains generated app output. It may intentionally preserve a
    legacy provider-shaped contract while canonical source-data is introduced
    behind it.
  providerJoinContract: >
    Every future materializer and consumer must apply the fail-closed uniqueness,
    missing-ID and cardinality rules in provider-join-invariants.yaml before
    publishing.

sourcePrioritySemantics:
  primary: authoritative source for the assigned fact/domain in normal operation
  secondary: corroborating or complementary source that may enrich but cannot silently override primary
  fallback: temporary availability or legacy compatibility source used only under an explicit rule
  unresolved: no durable canonical source has been accepted yet

matrix:
  nflPersonIdentity:
    facts:
      - permanent real-person identity
      - historical provider-ID mappings
    durableCanonicalPrimary: source-data/nfl/identities using CanonicalPlayerID in the fantasy-app namespace
    currentRuntimePrimary: public/data/Players.json uses Sleeper player_id as Players.ID
    secondary:
      - nflverse players / ff-player-ids provider mappings
      - Tank01 playerID mapping
      - GSIS
      - ESPN
      - PFR
      - PFF
      - future official NFL-issued ID if one becomes available
      - other corroborated provider IDs
    fallback: none
    identityKey: CanonicalPlayerID
    providerKeys:
      - Sleeper player_id
      - Tank01 playerID
      - GSIS ID
      - ESPN ID
      - PFR ID
    lifecycle: dynamic identity graph with historical season-level mapping validity
    historyCoverage: provider-mapping coverage varies by provider and season
    migrationState: canonical-v2-active-app-id-unchanged
    guards:
      - no display-name identity joins
      - overlapping provider-ID collisions are quarantined
      - existing CanonicalPlayerID values remain stable through the legacy NFLPlayerID field-name migration
      - public/data/Players.json[].ID remains Sleeper until a separate app-contract migration is approved

  nflPlayerProfile:
    facts:
      - display name
      - birth/age metadata
      - height/weight outside Combine context
      - college/high-school metadata
      - generic player status fields
    durableCanonicalPrimary: unresolved
    currentRuntimePrimary: mixed Sleeper and Tank01 in RequestPlayers.ps1
    secondary:
      - nflverse players
      - existing provider mappings
    fallback: none-defined
    identityKey: CanonicalPlayerID for any future canonical profile
    lifecycle: dynamic
    historyCoverage: not-consolidated
    migrationState: field-level-consolidation-not-yet-approved
    guards:
      - do not infer that nflverse players owns every current Players.json profile field
      - keep convenience/profile metadata separate from roster membership and injury ownership
      - names remain descriptive rather than identity keys

  nflDraftHistory:
    facts:
      - NFL draft year
      - round
      - pick within round / overall pick
      - drafting NFL team
      - drafted/undrafted/not-yet-drafted/unknown status
    durableCanonicalPrimary: nflverse draft-picks normalized to source-data/nfl/draft/<season>.json
    currentRuntimePrimary: canonical source-data for NFL Draft history; fantasy-league Drafts.json is a separate domain
    secondary:
      - provider raw draft evidence retained as provenance
    fallback: none
    identityKey: season + CanonicalPlayerID for player draft fact; canonical draft row identity remains season/pick scoped
    lifecycle: immutable-history
    historyCoverage: canonical materialization currently 1980-2026
    freshness: discover new/current partition; prior seasons frozen in normal mode
    migrationState: canonical-active
    guards:
      - historical repair requires explicit force except schema-only canonical field migration
      - NFL Draft facts must never be confused with league fantasy Drafts.json ownership

  nflCombine:
    facts:
      - height/weight measured at Combine
      - forty-yard dash
      - bench press
      - vertical/broad jump
      - three-cone/shuttle
    durableCanonicalPrimary: nflverse Combine normalized to source-data/nfl/combine/<season>.json
    currentRuntimePrimary: canonical source-data; not automatically projected into Players.json
    secondary:
      - PFR ID as authoritative identity mapping for this dataset
      - upstream draft fields retained only as SourceDraftEvidence
    fallback: none
    identityKey: CanonicalPlayerID when uniquely resolved through PFR mapping
    lifecycle: immutable-history
    historyCoverage: 2000-2026 in current canonical materialization
    freshness: discover new/current partition; prior seasons frozen in normal mode
    migrationState: canonical-active
    guards:
      - same-season duplicate PFR claims from distinguishable rows are quarantined as ambiguous
      - exact duplicate raw rows fail closed
      - canonical Draft link comes from source-data/nfl/draft rather than upstream Combine draft fields

  nflSchedule:
    facts:
      - NFL season
      - game type
      - week
      - kickoff/date metadata
      - home and away teams
      - game identity
      - final scores when published by schedule dataset
    durableCanonicalPrimary: nflverse schedules
    currentRuntimePrimary: Tank01 getNFLGamesForWeek remains the legacy Schedule.json shape; RequestGames overlays canonical finality before publication
    secondary: none-required
    fallback:
      - Tank01 for legacy Schedule.json shape compatibility during migration
    identityKey: nflverse game_id for canonical schedule; current bridge uses explicit ESPN provider ID
    lifecycle: seasonal-finalizable
    historyCoverage: 1999-present
    freshness: current Schedule keeps its normal APP Data Games fallback cadence and additionally republishes on main changes to canonical NFL game-finality; canonical full-source refresh remains separate
    migrationState: canonical-finality-migrated-schedule-shape-legacy
    guards:
      - game_type must be explicit; postseason must not silently enter the current REG-only app contract
      - canonical game identity must be unique before materialization
      - the current Tank01 Schedule row must resolve uniquely to canonical schedule identity by ESPN ID before Final can be published
      - migrating the remaining Schedule.json fields is separate from the focused #447 finality cutover

  nflGameFinality:
    facts:
      - explicit Final state
      - derived all-games-final week closure
    durableCanonicalPrimary: nflverse released-games evidence normalized by canonical game_id
    currentRuntimePrimary: source-data/nfl/game-finality/<season>.json consumed by GameFinalityUtils.psm1 in RequestGames.ps1
    secondary:
      - nflverse schedules own canonical game identity, game type and final score fields
    fallback:
      - none for Final truth; Tank01 remains only a legacy Schedule-shape/boxscore provider and cannot override conflicting canonical finality
    identityKey: nflverse game_id / canonical game identity; transitional Schedule bridge uses ESPN provider ID
    lifecycle: seasonal-finalizable
    historyCoverage: follows validated released-games evidence; backfill coverage must be audited when activated
    freshness: canonical evidence follows nflverse released-game publication; production polls nflverse.game-finality every 10 minutes during September-January through the dedicated scheduler target while retaining the daily full NFL source sync; semantic Finality changes trigger APP Data Games immediately and the normal 10-minute League refresh then converges dependent read models
    migrationState: canonical-active-runtime-finality-migrated-live-refresh
    guards:
      - do not infer Final merely from score or fantasy-point presence
      - Final requires membership in the validated released-games evidence for the same canonical game_id
      - RequestGames may promote stale non-Final Tank01 status when canonical Final=true, but a contradictory Tank01 Final while canonical Final=false fails closed
      - missing/duplicate/mismatched ESPN provider joins fail closed before Schedule publication
      - targeted game-day polling changes freshness only and must not introduce an elapsed-time or score-based terminal-state heuristic
      - the abandoned BUF-CIN Week 17/2022 game must not be treated as Final merely because schedule/score evidence exists
      - postponed/cancelled/no-contest semantics remain distinct terminal-state work if encountered
      - weekFinal may only be derived after every applicable game has canonical finality

  nflGameBoxscoreLegacy:
    facts:
      - current provider-shaped full Games.json game object
      - provider-specific playerStats boxscore payload
    durableCanonicalPrimary: no-single-provider-object
    currentRuntimePrimary: Tank01 getNFLBoxScore in RequestGames.ps1
    secondary:
      - canonical schedule
      - canonical player stats
      - canonical snap counts
    fallback: Tank01 remains legacy full-object provider until Games.json is intentionally redesigned
    identityKey: current Tank01 gameID; future canonical join must map to canonical game identity
    lifecycle: generated-app-readmodel
    historyCoverage: current app archives 2022-2025; provider history is not the preferred future backfill path
    migrationState: legacy-contract-retained
    guards:
      - boxscore fetch eligibility for completed games follows the finality-resolved Schedule status rather than raw Tank01 finality
      - do not declare nflverse Player Stats a 1:1 replacement for the whole Tank01 boxscore object
      - future Games.json redesign belongs with the app-generator DAG/read-model migration

  nflPlayerWeeklyStats:
    facts:
      - passing attempts and touchdowns
      - rushing carries and touchdowns
      - receiving targets and touchdowns
      - field-goal attempts
      - PAT attempts
      - punt/kick return yards and return touchdowns where published
      - weekly player stat totals
      - team/opponent/game references
    durableCanonicalPrimary: nflverse player-stats
    currentRuntimePrimary: Tank01 playerStats embedded in Games.json and consumed by RequestPlayers.ps1
    secondary: none-required for finalized history
    fallback:
      - Tank01 for legacy Games.json until that read model is redesigned
    identityKey: GSIS -> CanonicalPlayerID
    gameKey: nflverse game_id
    lifecycle: seasonal-finalizable
    historyCoverage: 1999-present
    freshness: nightly after game days plus additional game-day updates
    preferredFinalizedWeeklyRead: Thursday after NFL stat-correction window
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - no name-based player join
      - secondary/fallback data cannot overwrite a conflicting finalized canonical stat silently
      - raw stat fields, including return-yard facts, must remain available for league-specific scoring
      - AttemptsTotal remains an app-derived metric and must be regression-tested when its inputs migrate

  fantasyPointsLeagueScoring:
    facts:
      - league-specific fantasy points derived from canonical NFL player statistics
    durableCanonicalPrimary: deterministic derivation from canonical NFL player stats plus Sleeper league scoring_settings
    currentRuntimePrimary: league-scored points exported by tools/players_league_scoring.py for Players.json (#347 D4, 2026-10-05); Tank01 fantasyPointsDefault.PPR remains only the provider value of GameHistory games that are not final or are playoff games, and in Games.json
    secondary:
      - nflverse/provider fantasy-point values may be used as validation/corroboration only
    fallback: none for Players.json points; an identity hold keeps the last published values
    identityKey: CanonicalPlayerID + season + week/game
    lifecycle: derived-seasonal
    historyCoverage: follows canonical player-stats coverage
    derivationOwner: playerWeekFantasy (productively-materialized-v1, contract .ai-context/manual/player-week-fantasy.yaml; derives league-scoring points from canonical stats plus canonical league ScoringSettings)
    migrationState: players-consumer-migrated-d4-via-players-league-scoring-export (PlayerWeekFantasy shares the scorer tools/historical_fantasy_scoring.py)
    guards:
      - scoring definition comes from the league settings rather than a provider-default fantasy-point field
      - canonical source stat corrections must propagate deterministically
      - return-yard scoring changes must be possible without changing the NFL stat provider

  nflSnapCounts:
    facts:
      - offense_snaps
      - offense_pct
      - defense_snaps
      - defense_pct
      - st_snaps
      - st_pct
    durableCanonicalPrimary: nflverse PFR snap-count dataset
    currentRuntimePrimary: Tank01 snapCounts embedded in Games.json
    secondary: none-required
    fallback:
      - Tank01 for legacy Games.json during migration
    identityKey: PFR ID -> CanonicalPlayerID
    gameKey: nflverse game_id / PFR game mapping
    lifecycle: seasonal-finalizable
    historyCoverage: 2012-present
    freshness: four-times-daily-during-season-dependent-on-PFR
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - ambiguous/missing PFR mappings remain unresolved or quarantined
      - pre-2012 unavailable data is not zero
      - current not-yet-published snaps are not zero
      - current kicker synthetic FG+PAT attempt semantics must not be silently replaced by real special-teams snaps

  nflWeeklyRosterMembership:
    facts:
      - player NFL team membership by week
      - in-season team changes
      - weekly roster/status evidence
    durableCanonicalPrimary: nflverse weekly-rosters
    currentRuntimePrimary: mixed current player team/status evidence from Tank01 and Sleeper in RequestPlayers.ps1
    secondary:
      - nflverse season rosters for season-level context
    fallback: none-defined for canonical finalized history
    identityKey: GSIS -> CanonicalPlayerID
    lifecycle: seasonal-finalizable
    historyCoverage: 2002-present
    freshness: roster pipeline daily around 07:00 UTC
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - season roster must not replace weekly history for in-season team changes
      - Sleeper team fields are platform metadata and cannot silently override canonical NFL membership

  nflSeasonRosterProfile:
    facts:
      - season-level NFL roster affiliation
      - season-level roster/player profile evidence
    durableCanonicalPrimary: nflverse rosters
    currentRuntimePrimary: mixed Tank01/Sleeper player metadata
    secondary:
      - weekly-rosters where week-specific membership is required
    fallback: none-defined
    identityKey: GSIS -> CanonicalPlayerID
    lifecycle: seasonal-finalizable
    historyCoverage: 1920-present
    freshness: daily around 07:00 UTC
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - season-level row is not proof of a player's team for every week in that season

  sleeperPlayerPlatformFacts:
    facts:
      - current Sleeper player_id
      - Sleeper status
      - Sleeper depth_chart_position
      - Sleeper depth_chart_order
      - Sleeper-specific fantasy/player catalog metadata
    durableCanonicalPrimary: Sleeper for Sleeper-specific facts only
    currentRuntimePrimary: Sleeper /players/nfl in RequestPlayers.ps1
    secondary: none
    fallback: none
    identityKey: Sleeper player_id mapped to CanonicalPlayerID where cross-provider identity is required
    lifecycle: dynamic platform state
    historyCoverage: no canonical historical guarantee from current app path
    freshness: Sleeper recommends persisting player map and refreshing no more than about daily
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - Sleeper-specific depth fields are not automatically the canonical NFL depth-chart source
      - Sleeper player_id remains the current Players.json ID contract

  nflInjuriesCurrent:
    facts:
      - current injury designation/status
      - injury start date where supplied
      - practice participation where supplied
      - richer description/expected return only when a separately accepted source supplies it
    durableCanonicalPrimary: Sleeper /players/nfl for the current core injury/status fields; richer injury narrative/return-date contract remains unresolved
    currentRuntimePrimary: Tank01 player injury object in RequestPlayers.ps1 until the later generator migration
    secondary:
      - Tank01 may remain legacy/current-runtime evidence during migration and later a bounded control source
    fallback: none-accepted-for-conflict-resolution
    identityKey: Sleeper player_id -> CanonicalPlayerID
    lifecycle: dynamic
    historyCoverage: no accepted canonical historical injury timeline; this decision is for current state
    freshness: persist Sleeper player map and refresh sparingly, approximately daily
    migrationState: canonical-active-runtime-not-migrated
    guards:
      - nflverse injury source is not a valid current replacement after its source ended following 2024
      - missing Tank01-style ReturnDate/Description is allowed and is not synthesized
      - conflicting provider injury claims are not silently resolved by fallback priority

  nflDepthChart:
    facts:
      - NFL depth-chart role/order snapshots
    durableCanonicalPrimary: unresolved
    currentRuntimePrimary: canonical Sleeper platform snapshot (source-data/nfl/platform/sleeper/players.json DepthChartPosition/DepthChartOrder) read by RequestPlayers.ps1 through utils/player/SleeperPlatformUtils.psm1 for the current app fields (#347 H4); a player missing from the snapshot stays null
    secondary:
      - nflverse depth-charts is a candidate snapshot source pending separate evaluation
      - other depth-chart providers may be evaluated separately
    fallback: none-accepted
    identityKey: provider ID -> CanonicalPlayerID
    lifecycle: snapshot when canonicalized
    historyCoverage: not-consolidated
    freshness: nflverse candidate updates daily and uses timestamped snapshots from 2025 onward
    migrationState: sleeper-fields-canonical-active-additional-source-evaluation-still-open
    guards:
      - depth-chart rank is a role/roster signal, not direct fantasy opportunity
      - preserve timestamped historical snapshots rather than overwriting only latest state if nflverse is adopted

  nflContracts:
    facts:
      - NFL contract snapshots
    durableCanonicalPrimary: unresolved
    currentRuntimePrimary: none-as-canonical-app-source
    secondary:
      - nflverse contracts is registered as a planned candidate dataset
    fallback: none
    identityKey: provider ID -> CanonicalPlayerID
    lifecycle: snapshot
    historyCoverage: not-evaluated
    freshness: not-consolidated
    migrationState: planned-not-evaluated
    guards:
      - no app/source-of-truth ownership may be inferred merely because the registry contains a planned contracts dataset
      - licensing/attribution must be validated before persistence/publication expansion

  nflPlayerConvenienceMetadata:
    facts:
      - player headshot URL
      - FantasyPros link
      - ESPN link
      - provider-specific short name
    durableCanonicalPrimary: none-required; convenience-enrichment only
    currentRuntimePrimary: Tank01 and Sleeper fields in RequestPlayers.ps1
    secondary: provider-specific alternatives may be used only through an explicit consumer rule
    fallback: consumer-specific
    identityKey: provider mapping to current player
    lifecycle: dynamic convenience metadata
    historyCoverage: not-authoritative
    migrationState: legacy-enrichment-retained
    guards:
      - convenience URLs/images are not identity evidence or NFL roster truth
      - absence must not invalidate otherwise canonical player facts

  nflFreeAgentAndAvailabilityStatus:
    facts:
      - NFL free-agent/active availability style fields in current Players.json
    durableCanonicalPrimary: unresolved
    currentRuntimePrimary: Tank01 isFreeAgent plus Sleeper status in RequestPlayers.ps1
    secondary:
      - canonical weekly/season rosters may provide membership evidence after activation
    fallback: none-defined
    identityKey: CanonicalPlayerID / current provider mappings
    lifecycle: dynamic
    historyCoverage: not-consolidated
    migrationState: requires-separate-field-definition-during-player-readmodel-migration
    guards:
      - absence from a roster snapshot must not automatically equal free-agent status without an explicit rule
      - platform status and NFL employment status are distinct concepts

  byeWeek:
    facts:
      - current-season bye week used in player read model
    durableCanonicalPrimary: derived-source-not-yet-formally-migrated
    currentRuntimePrimary: current Tank01/team data path in RequestPlayers.ps1
    secondary:
      - future derivation from canonical nflverse schedule is the preferred candidate once schedules are active
    fallback: Tank01 during migration
    identityKey: NFL team + season
    lifecycle: seasonal-derived
    historyCoverage: follows schedule coverage when migrated
    migrationState: derivation-rule-to-validate-during-generator-migration
    guards:
      - derive from explicit team schedule rather than treating a player provider metadata field as permanent truth

  fantasyLeagueSettings:
    facts:
      - league ID/year manual selection
      - salary-cap and league-specific rules
      - draft configuration
      - Sleeper league settings such as roster positions, scoring, trade settings and playoff settings
    durableCanonicalPrimary:
      manualRules: public/data/Metadata.json
      platformState: Sleeper league endpoint
    currentRuntimePrimary: Metadata + Sleeper
    secondary: none
    fallback: none
    identityKey: LeagueID / season
    lifecycle: league-season dynamic/manual
    migrationState: retained-domain-owners
    guards:
      - nflverse cannot become source of truth for fantasy-league rules
      - ConfigUtils maps configuration but does not own league-specific domain rules

  fantasyLeagueRostersAndTeams:
    facts:
      - fantasy roster membership
      - roster_id
      - owner_id
      - fantasy league member/user relation
      - Taxi/IR/reserve membership
    durableCanonicalPrimary: Sleeper league rosters/users for platform facts, enriched by Metadata owner mapping where required
    currentRuntimePrimary: Sleeper
    secondary: Metadata for league-specific mapping/rules
    fallback: none
    identityKey:
      - roster_id for fantasy roster
      - user_id/owner_id for Sleeper member relation
      - Sleeper player_id for rostered player reference
    lifecycle: league-season dynamic
    migrationState: retained-platform-owner
    guards:
      - nflverse NFL rosters are a different domain and cannot replace fantasy-league rosters
      - owner/member/roster cardinality follows provider-join-invariants.yaml

  fantasyLeagueTransactions:
    facts:
      - completed fantasy trades/adds/drops
      - player movement
      - fantasy draft-pick movement
    durableCanonicalPrimary: Sleeper transactions plus explicit public/data/Transactions_Manual.json enrichment
    currentRuntimePrimary: same
    secondary: manual input only under documented match/enrichment rules
    fallback: none
    identityKey: TransactionID / Sleeper transaction_id
    lifecycle: current-season dynamic plus historical generated archives
    migrationState: retained-domain-owner
    guards:
      - manual SleeperTransactionID binds to at most one transaction
      - no pending-transaction source is invented without reliable provider evidence
      - duplicate transaction identities fail closed

  fantasyLeagueDraftsAndPickOwnership:
    facts:
      - fantasy draft instances
      - draft status/start/order
      - selected fantasy players
      - original/current fantasy pick owner
    durableCanonicalPrimary:
      draftPlatformFacts: Sleeper drafts/picks
      configuredSlotsAndRules: Metadata Drafts configuration
      ownershipChanges: completed fantasy transactions
    currentRuntimePrimary: same through Draft generation pipeline
    secondary: historical generated draft output is read model/provenance, not upstream source
    fallback: deterministic configured virtual draft only where no explicit SleeperDraftID binding exists and domain contract allows it
    identityKey:
      - DraftKey for configured fantasy draft identity
      - SleeperDraftID for concrete provider draft
      - PickKey including OriginalOwnerRosterID for pick identity
    lifecycle: league-season current plus generated historical archive
    migrationState: retained-domain-owner
    guards:
      - explicit SleeperDraftID bindings are authoritative and never fall back to another provider draft
      - NFL Draft history under source-data/nfl/draft is a separate domain
      - duplicate DraftKey/PickKey/provider IDs fail closed according to provider-join-invariants.yaml

unresolvedDecisionsBeforeAppGeneratorDag:
  blocking:
    - migrate the remaining app consumers from direct/legacy provider reads to the accepted canonical source-data layer without changing public contracts unintentionally
    - define exact Games.json replacement/compatibility strategy instead of assuming canonical stat datasets reproduce the Tank01 boxscore object
    - validate how canonical source availability states are exposed to downstream generators so missing/not-yet-available/fetch-failed do not collapse into zero
    - regression-test league-settings-based fantasy scoring against current outputs before replacing provider point values
  nonBlockingForInitialDagDesign:
    - depth-chart provider evaluation can remain separate if current Sleeper fields stay isolated as platform facts
    - contracts may remain unactivated because no current app contract depends on canonical NFL contract data
    - player convenience metadata can remain provider-specific while identity, schedule, stats and roster facts migrate

phase1ActivationState: completed-2026-08-30
activationOrder:
  - nflverse.schedules
  - nflverse.game-finality
  - sleeper.players
  - nflverse.player-stats
  - nflverse.snap-counts
  - nflverse.weekly-rosters
  - nflverse.rosters

historicalBackfillBands:
  - seasons: 2012-2021
    canonicalCoverage:
      - schedule
      - weekly-player-stats
      - weekly-rosters
      - snap-counts
    quality: strongest-complete-band-for-evaluated-datasets
  - seasons: 2002-2011
    canonicalCoverage:
      - schedule
      - weekly-player-stats
      - weekly-rosters
    missing:
      - snap-counts
  - seasons: 1999-2001
    canonicalCoverage:
      - schedule
      - weekly-player-stats
      - season-rosters
    missing:
      - weekly-rosters
      - snap-counts
  - seasons: before-1999
    canonicalCoverage:
      - season-rosters
    priority: no-current-app-backfill-priority

externalEvidence:
  verifiedAt: 2026-09-10
  nflverse:
    updateSchedule: https://nflreadr.nflverse.com/articles/nflverse_data_schedule.html
    schedulesDictionary: https://nflreadr.nflverse.com/articles/dictionary_schedules.html
    snapCountsDictionary: https://nflreadr.nflverse.com/articles/dictionary_snap_counts.html
    releasedGamesEvidence: nflverse/nflverse-pbp-internal released_games.csv and its FINAL-gated release logic
  sleeper:
    apiDocumentation: https://docs.sleeper.com/
    notes:
      - Sleeper documents /players/nfl as a large player-ID map intended to be persisted and refreshed sparingly, approximately daily rather than per consumer request.
      - Sleeper player records expose player_id, status, team, injury fields and depth_chart_position/depth_chart_order as platform data.

repositoryEvidence:
  - .ai-context/manual/player-identity.yaml
  - .ai-context/manual/nfl-source-data.yaml
  - .ai-context/manual/provider-join-invariants.yaml
  - .ai-context/manual/data-sources.yaml
  - .github/workflow-schedules.json
  - .github/workflows/sync-nfl-game-finality.yml
  - .github/workflows/update-games.yml
  - public/requests/RequestPlayers.ps1
  - public/requests/RequestGames.ps1
  - public/requests/utils/general/GameFinalityUtils.psm1

nextArchitectureStep: >
  Phase 1 source-data is accepted and #447 migrated current Final truth plus live
  game-day refresh behind the legacy Schedule.json shape. Continue the App-Generator-DAG
  and remaining consumer migration while preserving public contracts unless a separate
  contract change is explicitly approved.


playerWeekFantasy:
  status: productively-materialized-v1
  contract: .ai-context/manual/player-week-fantasy.yaml
  targetOwner: Shared Derived Data
  physicalOwner: derived-data/player-week-fantasy/<CanonicalLeagueID>/<season>/<week>.json
  identity: CanonicalPlayerID + CanonicalLeagueID + Season + Week + ScoringProfile.SettingsHash
  primaryInputs:
    weeklyPlayerAnchor: source-data/nfl/weekly-rosters/<season>/<week>.json
    scoringProfile: source-data/leagues/<CanonicalLeagueID>/seasons/<season>/league.json::ScoringSettings
    actualScoring: canonical NFL scoring evidence via tools/historical_fantasy_scoring.py
    projection: canonical historical scoring plus snap/usage evidence under the selected scoring profile
  currentConsumers:
    - App delivery publication public/data/PlayerWeekFantasy.json
    - App FantasyGameContext via src/app/core/services/data.service.ts
  currentMaterializer: tools/player_week_fantasy_materialize.py
  currentAppPublisher: tools/player_week_fantasy_app_publish.py
  targetConsumers:
    - App Players/Free Agents
    - Fantasy Operations
  matchupProjections:
    output: public/data/MatchupProjections.json
    owner: tools/matchup_projection.py
    inputs: App read models FantasyGameContext.json and PlayerWeekFantasy.json (same Season+Week)
    rule: team projection and range arithmetic lives in published data, not in Angular
  migrationRule: >
    Existing provider/current consumer score paths remain productive until a later
    materialization/publication checkpoint explicitly migrates them. The new shared
    contract is the target owner; no consumer may create a second independent
    scoring/projection truth once the shared value is productively available.


playersReadModelFieldInventory:
  status: accepted-inventory-no-runtime-change
  inventoriedAt: 2026-10-04
  trackingIssue: 347
  planStep: D1
  evidenceSnapshot: main f280a1d2, public/data/Players.json with 1268 rows
  purpose: >
    Field-level inventory of the generated App read model public/data/Players.json
    as required by the #613 guardrail before any Players cutover. Every field is
    classified by #613 logical layer, current producer, target owner (matrix key)
    and consumers. This section documents the current state; it does not approve
    any contract change. Migration of each field group remains a separate
    shadow -> parity -> cutover step under #347.
  layerLegend:
    sourceFact: provider/platform fact or observation (Source Evidence or Canonical/Normalized under #613)
    sharedDerived: deterministic league-owned derivation (Shared Derived under #613); must not move into source-data/nfl/**
    consumerOnly: App delivery shape or display convenience (Consumer Data under #613)

  producer:
    script: public/requests/RequestPlayers.ps1
    population: >
      Tank01 getNFLPlayerList rows with sleeperBotID, joined to Sleeper /players/nfl
      by that claim, restricted to app fantasy positions (Get-AppFantasyPosition)
      and to rows with a parseable Sleeper birth_date. The Sleeper<->Tank01 pairing
      is therefore a Tank01 provider claim, not a canonical identity decision.
    inputs:
      - Sleeper /players/nfl (live API call)
      - Tank01 getNFLPlayerList (live API call, RapidAPI keys)
      - public/data/Games.json (Tank01 boxscores incl. fantasyPointsDefault.PPR and snapCounts)
      - public/data/League.json (LastLeagueWeek, PlayoffStartWeek, FinalScoredWeek)
      - public/data/past_seasons/Players_<season-1..season-3>.json keyed by TankID
      - config.ps1 WeightTotal/WeightGame
    historyArchives:
      producer: public/requests/RequestPlayersSeason.ps1 (manual, no workflow) from past_seasons/Games_<year>.json
      shape: TankID, Name, TeamIDs, Games[] with FantasyPoints = Tank01 fantasyPointsDefault.PPR
      note: archives carry no Sleeper ID and no canonical ID; they are a Tank01-keyed legacy read model used as input

  fieldGroups:
    appIdentity:
      fields: [ID, TankID]
      layer: sourceFact
      currentProducer: ID = Sleeper player_id; TankID = Tank01 playerID
      matrixKey: nflPersonIdentity
      targetOwner: ID stays Sleeper player_id (App contract); provider mappings resolve through CanonicalPlayerID
      consumers:
        - App join key for rosters, transactions, drafts, FantasyGameContext (ID); TankID not read by Angular
        - tools/nfl_source_data_lib identity.py, audit.py, mapping_history.py (ID, TankID as identity evidence)
        - FM build_player_signal_dataset.py and build_fantasy_operations_inputs.py (ID join)
        - RequestLeague.ps1 DecisionWindows and scoring-availability filters (ID)
    profile:
      fields: [Name, NameFirst, NameLast, NameShort, Position, Age, Year, College, HighSchool, Number]
      layer: sourceFact
      currentProducer: Sleeper (names, position via Get-AppFantasyPosition, birth_date -> Age, years_exp + 1 -> Year, college, high_school); Tank01 (cbsShortName -> NameShort, jerseyNum -> Number)
      matrixKey: nflPlayerProfile
      targetOwner: field-level-consolidation-not-yet-approved (unchanged)
      consumers:
        - App display, search and sort (Name, NameFirst, NameLast, NameShort, Age, Year, College, Number); HighSchool declared but unused
        - Position drives App filters, grouping and rankings, and RequestLeague.ps1 fantasy relevance and lineup repairability
        - FM app_data (Age, Year)
      notes:
        - Age is computed at generation time from birth_date; it is not a stored fact
    nflTeamAndAvailability:
      fields: [TeamID, TeamAbbr, IsFreeAgent, Status]
      layer: sourceFact
      currentProducer: Tank01 team/teamID/isFreeAgent; Sleeper status
      matrixKey: [nflWeeklyRosterMembership, nflFreeAgentAndAvailabilityStatus, sleeperPlayerPlatformFacts]
      targetOwner: canonical weekly roster membership for team; free-agent definition still unresolved
      consumers:
        - App TeamID -> TeamNFL display; IsFreeAgent only maps TeamNFL to FA and blanks Number; TeamAbbr and Status not read
        - FM build_player_signal_dataset.py no longer reads TeamAbbr (C2, 2026-10-05: the has_nfl_team population bridge was replaced by canonical_nfl_membership / canonical_nfl_recent_history from canonical NFL roster membership)
        - FM build_fantasy_operations_inputs.py reads legacy Status and IsFreeAgent
        - RequestLeague.ps1 DecisionWindows and lineup repairability read TeamID
      observations:
        - For free agents TeamAbbr/TeamID hold the last Tank01 team, not a current NFL team
        - IsFreeAgent agrees with absence from the canonical 2026 week-4 weekly roster for 439 of 452 true values (sleeper-mapped rows); 70 rows with IsFreeAgent=false are not on that roster
    convenienceLinks:
      fields: [Picture, FantasyPros, ESPN, ESPNID]
      layer: consumerOnly
      currentProducer: Tank01 espnHeadshot, fantasyProsLink, espnLink; Sleeper espn_id
      matrixKey: nflPlayerConvenienceMetadata
      targetOwner: none-required; convenience enrichment
      consumers:
        - App display/links (Picture, FantasyPros, ESPN); ESPNID declared but unused
        - identity.py uses ESPNID/ESPN only as a corroborated ESPN bridge (_app_player_espn_bridge)
    depthChart:
      fields: [SleeperDepthChartPosition, SleeperDepthChartOrder]
      layer: sourceFact
      currentProducer: Sleeper depth_chart_position/order
      matrixKey: sleeperPlayerPlatformFacts
      targetOwner: unchanged; canonical depth-chart source waits for #189
      consumers:
        - App depth label and depth sort (SleeperDepthChartOrder); SleeperDepthChartPosition declared but unused
    injury:
      fields: [Injured, InjuryDetails.Designation, InjuryDetails.Description, InjuryDetails.ReturnDate, InjuryDetails.Date]
      layer: sourceFact
      currentProducer: Tank01 injury object (Injured = designation present)
      matrixKey: nflInjuriesCurrent
      targetOwner: Sleeper for current core status; richer narrative unresolved
      consumers:
        - App injury chip and injury tab (Date normalized but not displayed)
        - FM derive_injury_signal in player-signals and ops inputs
    byeWeek:
      fields: [ByeWeek]
      layer: sharedDerived
      currentProducer: RequestPlayers.ps1 through NflScheduleUtils.psm1 from canonical source-data/nfl/schedules/<season>.json (#347 E1)
      matrixKey: byeWeek
      targetOwner: derivation from canonical source-data/nfl/schedules/<season>.json
      consumers:
        - not read by Angular; used inside RequestPlayers.ps1 for GamesPotential
    seasonStatsAndPoints:
      fields: [GamesPlayed, GamesPotential, SnapsTotal, AttemptsTotal, TouchdownsTotal, TouchdownsPassing, TouchdownsReceiving, TouchdownsRushing, FantasyPointsTotal, FantasyPointsAvgGame, FantasyPointsAvgPotentialGame, FantasyPointsAvgSnap, FantasyPointsAvgAttempt]
      layer: sharedDerived
      currentProducer: PlayerLeagueScoringUtils.psm1 over the tools/players_league_scoring.py export (canonical player-stats and snap-counts scored with the league ScoringSettings, final REG weeks up to LastLeagueWeek, played game = offense snaps > 0, kickers FG + PAT attempts > 0); GamesPotential still follows Games.json presence and the canonical bye week (#347 D4)
      matrixKey: [nflPlayerWeeklyStats, nflSnapCounts, fantasyPointsLeagueScoring]
      targetOwner: league-scored points from the PlayerWeekFantasy derivation (CanonicalPlayerID + league ScoringSettings); stats/snaps from canonical player-stats and snap-counts
      consumers:
        - App Players page sort/columns and player dialog (Total, AvgGame, GamesPlayed, GamesPotential, Snaps, Attempts, TDs); AvgSnap, AvgAttempt and AvgPotentialGame effectively unused in the UI
        - internal inputs to Ranking and Salary (AvgGame, AvgPotentialGame)
      notes:
        - Kicker SnapCount is synthetic (FG + PAT attempts), see nflSnapCounts guard
        - Scoring switch to league ScoringSettings is approved by Robert (2026-10-04, #347 block D); validation reference is Sleeper's own player points
    pointHistory:
      fields: [PointHistory.SeasonMinus1, PointHistory.SeasonMinus2, PointHistory.SeasonMinus3]
      layer: sharedDerived
      currentProducer: PlayerLeagueScoringUtils.psm1::Get-PlayerLeagueScoringSeasonStats over the tools/players_league_scoring.py export (league-scored, season-aware Sleeper identity); PotentialGames = LastLeagueWeek - 1 (#347 D4; the past_seasons/Players_<year>.json archives are no longer read)
      matrixKey: fantasyPointsLeagueScoring
      targetOwner: league-scored historical points from canonical player stats per season and CanonicalPlayerID
      consumers:
        - App last-season sort/columns, history table and chart
        - input to Salary, SalaryProjected and Ranking Combined_Previous
    gameHistory:
      fields: [GameHistory]
      layer: consumerOnly
      currentProducer: per-game rows from Games.json (Tank01 boxscore, snaps, Passing/Receiving/Rushing/Kicking objects); FantasyPoints of final regular-season games are replaced by league-scored points (#347 D4), playoff and not yet final games keep the Tank01 PPR value
      matrixKey: [nflPlayerWeeklyStats, fantasyPointsLeagueScoring, nflSchedule]
      targetOwner: App delivery shape over canonical weekly stats and league-scored weekly points
      consumers:
        - App game log only (Week, WeekScored, WeekPlayoff, Home/Away, FantasyPoints, TD sub-fields, Kicking FG/XP); most other sub-fields unused
    salary:
      fields: [Salary, SalaryProjected]
      layer: sharedDerived
      currentProducer: Get-FantasySalaryWithFloor over weighted per-season points (Salary uses seasons -1..-3; SalaryProjected blends the current season with -1 and -2) mapped non-linearly to dollars
      matrixKey: fantasyLeagueSettings (league rule) plus fantasyPointsLeagueScoring (input)
      targetOwner: Shared Derived league rule; must not move into source-data/nfl/**
      consumers:
        - App cap, free-agent market and salary displays
        - RequestLeague.ps1 league salary cap (average of top SalaryRelevantTeamSize x team count by Salary/SalaryProjected)
        - FM player-signals and ops inputs app_data.salary/salary_projected
      notes:
        - Any change to the points basis changes Salary, SalaryProjected and the published league salary cap together
    ranking:
      fields: [Ranking]
      layer: sharedDerived
      currentProducer: Add-Rankings (Total, PerGame, Combined and _Pos variants from AvgPotentialGame/AvgGame); Add-PreviousSeasonCombinedRanking in PlayerUtils.psm1 (Combined_Previous)
      matrixKey: fantasyPointsLeagueScoring (input)
      targetOwner: Shared Derived
      consumers:
        - App Combined, Combined_Pos and Combined_Previous; Total, PerGame, Total_Pos and PerGame_Pos are not displayed
    grading:
      fields: [Grading]
      layer: sharedDerived
      currentProducer: Form (last four final scored games) and Rank (letter grade from Combined_Pos)
      targetOwner: Shared Derived
      consumers:
        - none found (not read by Angular, FM or tools)

  dependencyCycles:
    identityEvidence: >
      tools/nfl_source_data_lib/identity.py reads Players.json ID (Sleeper), TankID
      (Tank01) and ESPNID/ESPN as identity evidence (source app.Players, priority 30),
      and app rows may establish provisional current people. mapping_history.py also
      uses git snapshots of Players.json as historical Sleeper<->Tank01 evidence.
      There is no closed cycle today because RequestPlayers.ps1 reads the providers
      directly. If Players.json population or IDs are later fed from canonical
      identities, that would close the loop Players.json -> identities -> Players.json
      and re-assert Players.json's own pairings as evidence. Before such a cutover,
      identity.py and mapping_history.py must stop treating canonically fed
      Players.json rows as independent evidence (separate decision).
    salaryCap: >
      RequestLeague.ps1 derives the league salary cap from Players.json Salary and
      SalaryProjected, so Players salary changes propagate into League.json.
    historyArchives: >
      Players.json history inputs come from Tank01-keyed past_seasons archives, i.e.
      a legacy read model is used as input. A league-scoring migration must
      re-score seasons -1..-3 from canonical player stats rather than reuse
      archive points.

  observedDefects:
    - id: bye-week-derived-from-played-games
      verified: true
      evidence: >
        2026-10-04: ByeWeek is 4 for 1104 rows and 5 for 164 rows; none of the 1268
        rows matches the team's actual bye week in source-data/nfl/schedules/2026.json.
        Games.json only holds games already fetched, so the first week without a
        fetched game is taken as bye.
      effect: >
        Inferred from code: the bye week is never subtracted from GamesPotential, so
        after a team's real bye GamesPotential is one too high and
        FantasyPointsAvgPotentialGame, Ranking Total and SalaryProjected are biased
        down for that team's players.
    - id: grading-form-depth-truncation
      verified: true
      evidence: >
        Grading[].Value[].GameDetails is serialized as the string
        System.Collections.Specialized.OrderedDictionary (ConvertTo-Json -Depth 5).
        No consumer reads Grading.
    - id: qb-rating-uses-previous-passing-row
      verified: code-reading-only
      evidence: >
        RequestPlayers.ps1 parses $pass.qbr before $pass = $p.Passing is assigned, so
        GameHistory Passing.QBRating carries the previous passing row's value or null.
        Not read by Angular.
    - id: historical-fgc-player-fallback-unmatched
      verified: code-reading-only
      evidence: >
        FantasyGameContextCore.ps1 keys the legacy past-season player map by
        PlayerID/ID/SleeperID, but past_seasons/Players_<year>.json carries only
        TankID, so the fallback never matches.
    - id: ops-inputs-legacy-status
      verified: code-reading-only
      evidence: >
        build_fantasy_operations_inputs.py still reads Players.json Status while
        player-signals uses canonical Sleeper status.

  migrationGuidance:
    - Migrate by field group, never Players.json as a whole (#613 guardrail).
    - byeWeek is the smallest independent cutover candidate (canonical schedule, fixes a verified defect, only internal consumer GamesPotential); its parity diff is expected to be non-empty and must be approved as a correction.
    - seasonStatsAndPoints, pointHistory, ranking, salary and the League.json salary cap move together in #347 block D (D2 design, D3 shadow, D4 cutover).
    - nflTeamAndAvailability needs an explicit free-agent definition before cutover (nflFreeAgentAndAvailabilityStatus is unresolved).
    - appIdentity and population changes require the identityEvidence cycle decision first.
    - convenienceLinks and grading need no source migration; grading has no consumer and may be repaired or retired separately.
