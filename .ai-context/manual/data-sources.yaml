schemaVersion: 1

dataSources:
  metadata:
    path: public/data/Metadata.json
    category: manual-domain-config
    role: Liga-spezifische Inputs und Regeln
    description: >
      Contains league-specific configuration and domain rules used by the
      PowerShell generation pipeline.
    owns:
      - LeagueID
      - LeagueYear
      - CapDeadline
      - CapDeadlineBufferDays
      - OwnerIDs
      - Drafts configuration, including the number of non-completed drafts retained per draft type

  configUtils:
    path: public/requests/utils/ConfigUtils.psm1
    category: technical-generation-config
    role: Technische Pfade und Generierungs-Konfiguration
    description: >
      Provides technical path resolution and generation configuration for the
      PowerShell data pipeline. Loads Metadata.json and returns the generator
      configuration object.
    owns:
      - DataDir
      - generated JSON file paths
      - transaction archive paths
      - draft archive paths
      - past season index file path
      - configured past season resource path patterns
      - timestamp file path
      - mapping Metadata.json into generator config
    exposes:
      - PlayersFile
      - DecisionWindowsFile
      - PastSeasonsDir
      - PastSeasonsIndexFile
      - PastSeasonResources

  generationPipeline:
    path: public/requests
    category: generation-pipeline
    role: PowerShell-Datengenerierung
    description: >
      Fetches, transforms, enriches and writes generated app data.

  generatedJson:
    path: public/data
    category: generated-output
    role: Generierte App-Daten
    description: >
      Generated read models consumed by Angular. These files are output, not the
      architectural source of truth. Metadata.json is an exception because it is
      manually maintained domain input.

  players:
    path: public/data/Players.json
    generator: public/requests/RequestPlayers.ps1
    helpers:
      - public/requests/utils/player/PlayerUtils.psm1
    localDocumentation: public/requests/RequestPlayers.ai-doc.yaml
    category: generated-output
    role: Full generated player read model
    description: >
      Complete generated player output used by Angular and by downstream
      generation steps that need the full player universe. Players[].ID is the
      canonical Sleeper player_id resolved through the Tank01 sleeperBotID join;
      Players[].TankID preserves the Tank01 playerID for provider provenance.
    identityContract:
      canonicalField: ID
      canonicalSource: Sleeper player_id
      providerField: TankID
      providerSource: Tank01 playerID
      requirements:
        - every generated player record has a non-empty canonical ID
        - canonical ID values are globally unique within Players.json
      validation: public/requests/utils/player/PlayerUtils.psm1::Test-UniquePlayerIds
      failureBehavior: >
        Fail closed before change comparison, timestamp, backup and write. The
        existing last-known-good Players.json remains untouched. Diagnostics list
        every duplicate ID together with TankID, Name, TeamID and Position for all
        conflicting records.
    timestamped: true
    backup: true
    backupPathPattern: public/data/backup/Players_<UTC timestamp>.json


  league:
    path: public/data/League.json
    generator: public/requests/RequestLeague.ps1
    helpers:
      - public/requests/utils/league/LeagueUtils.psm1
      - public/requests/utils/league/TeamUtils.psm1
      - public/requests/utils/league/TeamDraftPickUtils.psm1
      - public/requests/utils/league/PlayoffUtils.psm1
    category: generated-output
    role: Generated league, status and team read model
    description: >
      Generated app-facing league output. It contains the top-level lifecycle
      Status and optional Phase sub-status, current/final week metadata,
      Sleeper-derived move openness fields, salary-cap values, standings,
      playoff data and enriched fantasy teams. Phase is generated by the league
      pipeline as a UI-safe label and is empty when no meaningful sub-phase
      exists. TradesOpen is a league-process flag, not merely the technical
      ability to submit a trade offer in Sleeper. TradeReviewDays exposes
      Sleeper's trade_review_days setting and a positive value makes TradesOpen
      false. Phase must not be used as source of truth for unrelated move
      permissions such as CutsAllowed.
    statusPhase:
      statusField: Status
      phaseField: Phase
      tradeReviewDaysField: TradeReviewDays
      currentPhaseLabels:
        offSeason:
          - Cap Deadline Open
          - Cap Check
          - Post Cap Check
        draftSeason:
          - Pre Draft
          - In Draft
          - Between Drafts
      tradeOpenness: >
        TradesOpen is true only when Sleeper has not disabled trades, the trade
        deadline has not been reached and trade_review_days is 0. A positive
        trade_review_days value represents the commissioner-review workaround for
        closing or controlling trades and therefore counts as not freely open.
      draftStartTime: >
        Draft-Season / Pre Draft is enabled when at least one non-completed
        current-season draft has DraftStartTimeUtc or SleeperStartTime and no draft
        is currently live. After a current-season draft completes, another open
        current-season draft without a start time keeps the league in Draft-Season
        / Between Drafts.
      cutsAllowed: >
        CutsAllowed is not derived from Phase. Keep it data-driven once a
        reliable Sleeper field is identified; until then it follows the existing
        generator behavior.
    timestamped: true
    backup: true

  decisionWindows:
    path: public/data/DecisionWindows.json
    generator: public/requests/RequestLeague.ps1
    helpers:
      - public/requests/utils/league/DecisionWindowUtils.psm1
    localDocumentation: public/data/DecisionWindows.ai-doc.yaml
    architectureDecision: ADR-036
    category: generated-output
    role: Current exact-kickoff Decision Window and objective lineup read model
    description: >
      Small current App read model generated in the existing League refresh from
      provider-neutral season/week-addressable Decision Window derivation. One
      Decision Window is one exact absolute kickoff instant; simultaneous games
      share a window while nearby unequal kickoffs remain separate. The current
      file contains the active fantasy lineup week, only the first next-week
      lookahead window when another lineup-relevant week exists, current player
      lock facts and objective team lineup evaluations. It is not a historical
      store and never persists wall-clock-only upcoming/locked labels.
    currentAdapter:
      lineupWeekSource: Sleeper settings.leg from already-fetched League state
      scheduleJoin: Player.TeamID -> Schedule.teamIDHome / teamIDAway
      providerRequests: none added specifically for DecisionWindows
      migrationBoundary: '#347 may replace transitional current adapters with canonical source-data inputs without changing the provider-neutral derivation semantics.'
    historicalRule: >
      Historical relevance remains rebuildable from persisted season/week schedule,
      fantasy players/starters and week-appropriate player-to-NFL-team assignments
      through the same rostered-plus-starter semantics. No live kickoff snapshot is
      required and no historical DecisionWindows file is authoritative source data.
    clockRule: >
      StartsAtUtc is persisted; Angular may derive upcoming/locked and the next
      future current-week window by comparing StartsAtUtc to now. Kickoff, not game
      Final status, advances the actionable deadline.
    timestamped: true
    timestampKey: DecisionWindows
    timestampMeaning: last semantic generated-data update, not last check or fetch
    noOpRule: semantic no-op skips DecisionWindows.json rewrite and preserves Timestamps.json.DecisionWindows
    backup: false

  transactions:
    path: public/data/Transactions.json
    manualInput: public/data/Transactions_Manual.json
    generator: public/requests/utils/league/TransactionUtils.psm1
    helpers:
      - public/requests/utils/league/TransactionDraftPickEnrichmentUtils.psm1
      - public/requests/utils/league/DraftTransactionPipelineUtils.psm1
    category: generated-output
    role: Completed transaction read model
    description: >
      Current-season transaction output used by draft generation and the app.
      It combines Sleeper transactions with manual enrichments. Historical
      transaction files are generated by RequestTransactions.ps1 under
      public/data/past_seasons/Transactions. A full all-season rebuild then resolves
      canonical draft identity, regenerates current/open and completed historical
      draft outputs in the same working tree, enriches transaction picks from those
      freshly generated drafts and only then refreshes PastSeasonsIndex.json. A
      previous generated historical draft file is not a source for a full rebuild.
    updateMode:
      normal: missing weeks plus current and previous week
      force: all available weeks for the current season
      historicalFull: weekly/manual RequestTransactions coupled rebuild of Transactions and dependent Draft outputs
    timestamped: true
    backup: true

  drafts:
    path: public/data/Drafts.json
    generator: public/requests/utils/league/DraftUtils.psm1
    helpers:
      - public/requests/utils/league/DraftOrderAwareUtils.psm1
      - public/requests/utils/league/DraftTransactionPipelineUtils.psm1
    teamMapper: public/requests/utils/league/TeamDraftPickUtils.psm1
    category: generated-output
    role: Current-season draft history and open future draft-pick read model
    description: >
      Generated draft data containing every draft from the configured LeagueYear
      regardless of status plus Drafts.UpcomingDraftCount non-completed drafts for
      each configured draft type. A completed current-season draft remains in this
      file and does not count toward the configured open-draft limit, so later open
      seasons are added until the limit is reached. Current-season drafts can have
      exact order and completed pick results; future-season drafts may be round-only
      placeholders. For exact drafts, DraftOrderAwareUtils.psm1 derives the original
      owner order from the Sleeper draft type: linear drafts keep the base order
      every round, while snake drafts reverse the base order in even rounds.
      Completed transaction data is then applied to derive current pick ownership.
      DisplayStatus is generated directly by the draft generation utilities as a
      UI-safe status label. SleeperStartTime contains the source start_time value
      when present, and DraftStartTimeUtc contains the generated UTC ISO
      representation used by the league status phase resolver. This file is the
      only draft output used to enrich League.json team DraftPick references,
      including picked current-season picks needed for complete-season Draft Capital.
    updateMode:
      restricted: frequent RequestLeague.ps1 update
      scheduledFull: weekly coupled RequestTransactions.ps1 rebuild
      manualFull: workflow_dispatch RequestDrafts.ps1 refresh
    timestamped: true
    backup: true

  draftHistory:
    path: public/data/past_seasons/Drafts/Drafts_<season>.json
    generator: public/requests/utils/league/DraftHistoryUtils.psm1
    helpers:
      - public/requests/utils/league/DraftOrderAwareUtils.psm1
      - public/requests/utils/league/DraftTransactionPipelineUtils.psm1
    scheduledEntryPoint: public/requests/RequestTransactions.ps1
    scheduledWorkflow: .github/workflows/update-transactions.yml
    manualEntryPoint: public/requests/RequestDrafts.ps1
    manualWorkflow: .github/workflows/update-drafts.yml
    category: generated-output
    role: Completed draft history read model
    description: >
      Generated completed draft history by season. Historical draft files are
      disposable outputs and are refreshed by the scheduled coupled
      RequestTransactions.ps1 full rebuild or by a manually dispatched
      RequestDrafts.ps1 refresh. During the coupled rebuild, current and historical
      transaction base data is generated first, draft identity is resolved, and
      historical drafts are rebuilt from that fresh transaction state before draft
      result details are written back to Transactions. This prevents a previous
      Drafts_<season>.json schema from leaking back into freshly generated history.
      A completed current-season draft may exist both here as an archive copy and
      in Drafts.json as current-season data; Angular must expose it through Current
      only until League.Season advances. Historical files use the same draft/pick
      shape as Drafts.json but must not be used to enrich League.json team DraftPick
      references. For exact historical Sleeper drafts, DraftOrderAwareUtils.psm1
      derives the original owner order from the Sleeper draft type before trade
      flags and completed pick results are applied: linear drafts keep the base
      order every round, while snake drafts reverse the base order in even rounds.
      Completed historical pick results and final current pick ownership are
      enriched from Sleeper draft picks in DraftHistoryUtils.psm1. Completed pick
      TradeHistory is enriched by confirming traded pick assets through the
      draft-specific Sleeper traded picks endpoint and then attaching matching
      historical transaction details; transaction data is provenance for completed
      draft history and must not overwrite the final completed-draft owner. Both
      full-rebuild entry points refresh PastSeasonsIndex.json after their coupled
      draft/transaction work completes.
    updateMode:
      scheduled: weekly RequestTransactions coupled rebuild
      manual: workflow_dispatch on the RequestDrafts workflow
    timestamped: false
    backup: false

  pastSeasonsIndex:
    path: public/data/PastSeasonsIndex.json
    generator: public/requests/utils/league/PastSeasonsIndexUtils.psm1
    entryPoint: public/requests/RequestPastSeasonsIndex.ps1
    workflow: .github/workflows/update-past-seasons-index.yml
    category: generated-output
    role: Central navigational manifest for historical season resource files
    description: >
      Generated index of available historical season resources under
      public/data/past_seasons. The index is flexible by resource key and exposes
      each configured resource's web path, existence flag, content hash and stable
      update time for a season. UpdatedAt is preserved while a resource's
      ContentHash remains unchanged, so GitHub Actions checkout timestamps do not
      cause repeated index rewrites. It is a navigation manifest for Angular and
      AI workflows, not the domain source of truth for historical data. Historical
      Players, Games and Schedule files may be generated by separate manual
      scripts and then moved into public/data/past_seasons; after such manual
      moves the index should be refreshed through RequestPastSeasonsIndex.ps1 or
      its manual workflow.
    resourceConfigSource: public/requests/utils/ConfigUtils.psm1::PastSeasonResources
    currentResourceKeys:
      - Drafts
      - Transactions
      - Players
      - Games
      - Schedule
      - Standings
      - Teams
    updateMode:
      automatic: Requested by request scripts after potential past-season file updates; written only when path, existence or content hash changes.
      manual: workflow_dispatch on the Update Past Seasons Index workflow or local RequestPastSeasonsIndex.ps1 after manually moving historical files.
    timestamped: false
    backup: false

  angularFrontend:
    path: src/app
    category: frontend
    role: Angular-Darstellung
    description: >
      Displays generated JSON data. Angular may do frontend-only enrichment,
      filtering and UI state handling, but should avoid owning source-of-truth
      league rules.

dataFlow:
  - from: public/data/Metadata.json
    to: public/requests/utils/ConfigUtils.psm1
    purpose: Load league-specific inputs and rules, including the open draft count per draft type.

  - from: public/data/Metadata.json
    to: public/data/League.json
    purpose: Provide CapDeadline and CapDeadlineBufferDays for generated league Status and Phase rules.

  - from: public/requests/utils/ConfigUtils.psm1
    to: public/requests/RequestPastSeasonsIndex.ps1
    purpose: Provide PastSeasonsIndex.json target path and configured historical resource path patterns.

  - from: Sleeper league settings
    to: public/data/League.json
    purpose: Provide disable_adds, disable_trades, trade_review_days, trade_deadline and playoff settings for generated move openness, Status and Phase rules.

  - from: already-loaded League, Team, Player and Schedule facts in RequestLeague.ps1
    to: public/data/DecisionWindows.json
    purpose: >
      Build the current exact-kickoff Decision Window read model without duplicate
      provider requests. Sleeper settings.leg owns current lineup-week evidence;
      stable current TeamID fields join players to Schedule games.

  - from: Sleeper transactions endpoint
    to: public/data/Transactions.json
    purpose: Fetch completed current-season transaction data.

  - from: public/data/Transactions_Manual.json
    to: public/data/Transactions.json
    purpose: Enrich or add manual transaction output.

  - from: public/requests/RequestTransactions.ps1
    to: public/data/past_seasons/Transactions/Transactions_<season>.json
    purpose: Rebuild historical transaction base data before the same-run dependent draft rebuild and final pick enrichment.

  - from: public/data/Transactions.json
    to: public/data/Drafts.json
    purpose: Apply draft-pick ownership changes before generating current-season and open future draft output.

  - from: public/data/Metadata.json
    to: public/data/Drafts.json
    purpose: Provide draft types, rounds, configured order rules and the number of non-completed drafts retained per type.

  - from: Sleeper drafts endpoints
    to: public/data/Drafts.json
    purpose: Use authoritative Sleeper draft metadata, status, base order, draft type and start_time when available; retain completed LeagueYear drafts and continue adding later non-completed drafts until the configured per-type count is reached.

  - from: public/data/Drafts.json
    to: public/data/League.json
    purpose: Add sorted current-season and open-future PickKey references to generated team data and drive draft-related Status/Phase transitions, including Draft-Season / Between Drafts after one current draft completes while another remains open and unscheduled.

  - from: public/requests/RequestTransactions.ps1
    to: public/data/Drafts.json
    purpose: Rebuild current/open drafts in the scheduled coupled full-history refresh after transaction draft identity is resolved.

  - from: public/requests/RequestTransactions.ps1
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Rebuild completed draft history in the same working tree before final transaction pick-result enrichment.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/Drafts.json
    purpose: Manually refresh current/open drafts using the same shared draft/transaction orchestration.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Manually refresh completed draft history using the same shared draft/transaction orchestration.

  - from: public/data/past_seasons/Drafts/Drafts_<season>.json
    to: public/data/past_seasons/Transactions/Transactions_<season>.json
    purpose: Supply concrete pick position and selected-player details only after the historical drafts were freshly regenerated in the same full-rebuild run.

  - from: public/data/past_seasons/**
    to: public/data/PastSeasonsIndex.json
    purpose: Scan configured historical resource files and expose available season/resource paths, content hashes and stable update metadata.

  - from: Sleeper drafts endpoints
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Discover completed drafts for historical seasons and use their authoritative base order and draft type for exact historical pick generation.

  - from: Sleeper draft picks endpoint
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Add completed pick results and final current pick ownership to historical draft output.

  - from: Sleeper draft-specific traded picks endpoint
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Confirm which traded pick assets belong to a completed Sleeper draft before mapping transaction history.

  - from: public/data/past_seasons/Transactions/Transactions_<season>.json
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Add matching transaction details to completed draft pick TradeHistory after draft-specific traded-pick confirmation.

  - from: public/data/League.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend League and FantasyTeam models.

  - from: public/data/Drafts.json
    to: src/app/core/services/data.service.ts
    purpose: Resolve current-season and open-future team DraftPickKeys into DraftPick objects, including completed current-season picks, and display generated DisplayStatus when present.

  - from: public/data/Players.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend Player model.

  - from: public/data/Teams.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend NFL team model.

  - from: public/data/Timestamps.json
    to: src/app/core/services/data.service.ts
    purpose: Display freshness of generated data.

notesForAIAgents:
  - Generated JSON should generally be changed through generation logic, not manually.
  - DecisionWindows.json is a small current derived read model, not a historical store or source of truth; exact kickoff defines a window and lineup lock advances at kickoff rather than Final.
  - Do not persist Decision Window upcoming/locked state or NextDecisionWindow; frontend time comparison against StartsAtUtc owns those clock-dependent presentation facts.
  - Decision Window historical relevance uses rebuildable rostered + starter semantics from persisted weekly facts; do not introduce a mandatory live kickoff snapshot.
  - Timestamps.json.DecisionWindows means last semantic generated-data update, not last check/fetch; an unchanged regeneration must preserve the older timestamp.
  - The #343 current Decision Window adapter is transitional and reuses current League/Team/Player/Schedule facts; #347 owns migration to canonical source-data without changing the provider-neutral derivation contract.
  - Historical Transactions and Drafts are disposable generated outputs; a full rebuild must not treat an older generated historical Draft file as an authoritative enrichment source.
  - The scheduled historical rebuild order is Transactions base -> draft identity -> fresh current/historical Drafts -> transaction pick-result enrichment -> PastSeasonsIndex.
  - Legacy generated DraftKeys such as 2024_D1_Free_Agent are replaced by canonical current-contract keys during regeneration; do not add compatibility mappings merely to preserve an old generated schema.
  - Players.json requires a non-empty, globally unique canonical Players.ID for every record; RequestPlayers must fail closed before persistence when the Tank01-to-Sleeper identity join creates a collision.
  - Player identity collision diagnostics must preserve provider provenance by listing TankID plus Name, TeamID and Position for every conflicting record; do not silently deduplicate or choose a winner.
  - Draft generation depends on current transaction output.
  - Draft DisplayStatus is a generated UI label owned by the draft generation utilities; keep Status and SleeperStatus as technical/source status fields.
  - Drafts.json exposes SleeperStartTime from source start_time and DraftStartTimeUtc as the generated UTC representation when a start time exists.
  - Drafts.json retains every LeagueYear draft regardless of status and then counts only non-completed drafts toward Metadata Drafts.UpcomingDraftCount for each draft type.
  - Current-season completed picks remain in League team DraftPicks so full-season Draft Capital and Best Pick can include them; availability-sensitive views must filter by pick status and selected-player metadata.
  - League Status and Phase are generated UI-safe lifecycle labels. Phase is optional and should be an empty string when no sub-phase applies.
  - TradesOpen is a league-process flag. A positive Sleeper trade_review_days value means commissioner review is active and trades are not freely open, even though Sleeper may still allow submitting trade offers.
  - Do not derive CutsAllowed from League Phase. A reliable Sleeper field must be identified before changing cut/move openness logic.
  - Draft-Season / Pre Draft depends on a non-completed current-season draft start time from Drafts.json; a completed current draft plus another unscheduled open current draft produces Draft-Season / Between Drafts.
  - Exact draft pick original owner order is generated by draft type: linear keeps the base order every round; snake reverses the base order in even rounds. Do not fix snake order by post-processing generated picks.
  - Current-season virtual drafts display as Upcoming; later virtual season drafts display as Future.
  - Angular Current Drafts is defined by Season equal to League.Season, Future Drafts by Season greater than League.Season, and Past Drafts by archived seasons lower than League.Season.
  - Angular display issues should not be fixed by changing generated data contracts unless the domain shape is wrong.
  - Completed draft history is generated by the weekly RequestTransactions coupled flow or a manual RequestDrafts flow and should not refresh in the 10-minute RequestLeague workflow.
  - Completed draft history uses Sleeper draft picks as source for completed pick results and final current pick ownership; draft-specific Sleeper traded picks confirm completed trade assets before matching historical Transactions into TradeHistory. Do not reintroduce transaction-based ownership repair for completed draft history.
  - PastSeasonsIndex.json is a generated navigation manifest for historical files and should be regenerated through RequestPastSeasonsIndex.ps1, not edited manually.
