schemaVersion: 1

dataSources:
  metadata:
    path: public/data/Metadata.json
    category: manual-domain-config
    role: Liga-spezifische Inputs und Regeln
    description: >
      Contains league-specific configuration and domain rules used by the
      PowerShell generation pipeline.
    owns:
      - LeagueID
      - LeagueYear
      - CapDeadline
      - CapDeadlineBufferDays
      - OwnerIDs
      - Drafts configuration

  configUtils:
    path: public/requests/utils/ConfigUtils.psm1
    category: technical-generation-config
    role: Technische Pfade und Generierungs-Konfiguration
    description: >
      Provides technical path resolution and generation configuration for the
      PowerShell data pipeline. Loads Metadata.json and returns the generator
      configuration object.
    owns:
      - DataDir
      - generated JSON file paths
      - transaction archive paths
      - draft archive paths
      - past season index file path
      - configured past season resource path patterns
      - timestamp file path
      - mapping Metadata.json into generator config
    exposes:
      - PlayersFile
      - PlayersRelevantFile
      - PlayersRelevantChatDir
      - PastSeasonsDir
      - PastSeasonsIndexFile
      - PastSeasonResources

  generationPipeline:
    path: public/requests
    category: generation-pipeline
    role: PowerShell-Datengenerierung
    description: >
      Fetches, transforms, enriches and writes generated app data.

  generatedJson:
    path: public/data
    category: generated-output
    role: Generierte App-Daten
    description: >
      Generated read models consumed by Angular. These files are output, not the
      architectural source of truth. Metadata.json is an exception because it is
      manually maintained domain input.

  players:
    path: public/data/Players.json
    generator: public/requests/RequestPlayers.ps1
    helpers:
      - public/requests/utils/player/PlayerUtils.psm1
    category: generated-output
    role: Full generated player read model
    description: >
      Complete generated player output used by Angular and by downstream
      generation steps that need the full player universe.
    timestamped: true
    backup: false

  relevantPlayers:
    path: public/data/Players_Relevant.json
    generator: public/requests/RequestLeague.ps1
    helpers:
      - public/requests/utils/player/PlayerUtils.psm1
    category: generated-output
    role: AI/chat-friendly relevant player subset source
    description: >
      Generated subset of Players.json containing fantasy-rostered players,
      young prospects, players with meaningful historical production and players
      with high salary signal. It is written by the frequent league generation
      flow and is the source for the chunked player chat export.
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantFile
    timestamped: false
    backup: false

  playerChatExport:
    path: public/data/chat/players-relevant
    index: public/data/chat/players-relevant/index.json
    chunks: public/data/chat/players-relevant/players_*.json
    generator: public/requests/utils/player/PlayerChatExportUtils.psm1
    entryPoint: public/requests/RequestLeague.ps1
    category: generated-output
    role: Chunked relevant player export for AI/chat consumption
    description: >
      Splits the full relevant player objects into stable 10-player chunk files
      and writes index.json with lookup tables for player id, name, position and
      team. The chunks preserve the player object shape; the index is navigation
      metadata for agents and chat workflows.
    pathSource: public/requests/utils/ConfigUtils.psm1::PlayersRelevantChatDir
    chunkSize: 10
    timestamped: false
    backup: false

  league:
    path: public/data/League.json
    generator: public/requests/RequestLeague.ps1
    helpers:
      - public/requests/utils/league/LeagueUtils.psm1
      - public/requests/utils/league/TeamUtils.psm1
      - public/requests/utils/league/TeamDraftPickUtils.psm1
      - public/requests/utils/league/PlayoffUtils.psm1
    category: generated-output
    role: Generated league, status and team read model
    description: >
      Generated app-facing league output. It contains the top-level lifecycle
      Status and optional Phase sub-status, current/final week metadata,
      Sleeper-derived move openness fields, salary-cap values, standings,
      playoff data and enriched fantasy teams. Phase is generated by the league
      pipeline as a UI-safe label and is empty when no meaningful sub-phase
      exists. It must not be used as source of truth for unrelated move
      permissions such as CutsAllowed.
    statusPhase:
      statusField: Status
      phaseField: Phase
      currentPhaseLabels:
        offSeason:
          - Cap Deadline Open
          - Cap Check
          - Post Cap Check
        draftSeason:
          - Pre Draft
          - In Draft
      draftStartTime: >
        A stable draft start-time field is not part of Drafts.json yet; the
        Draft-Season / Pre Draft transition remains intentionally blocked until
        the exact Sleeper field is verified and generated.
      cutsAllowed: >
        CutsAllowed is not derived from Phase. Keep it data-driven once a
        reliable Sleeper field is identified; until then it follows the existing
        generator behavior.
    timestamped: true
    backup: true

  transactions:
    path: public/data/Transactions.json
    manualInput: public/data/Transactions_Manual.json
    generator: public/requests/utils/league/TransactionUtils.psm1
    category: generated-output
    role: Completed transaction read model
    description: >
      Current-season transaction output used by draft generation and the app.
      It combines Sleeper transactions with manual enrichments. Historical
      transaction files are generated by RequestTransactions.ps1 under
      public/data/past_seasons/Transactions and the request refreshes
      PastSeasonsIndex.json after the all-seasons transaction update.
    updateMode:
      normal: missing weeks plus current and previous week
      force: all available weeks for the current season
    timestamped: true
    backup: true

  drafts:
    path: public/data/Drafts.json
    generator: public/requests/utils/league/DraftUtils.psm1
    helpers:
      - public/requests/utils/league/DraftOrderAwareUtils.psm1
    teamMapper: public/requests/utils/league/TeamDraftPickUtils.psm1
    category: generated-output
    role: Current/upcoming/live draft and draft-pick read model
    description: >
      Generated current/upcoming/live draft data. Current-season drafts can have
      exact order; future-season drafts may be round-only placeholders. For exact
      drafts, DraftOrderAwareUtils.psm1 derives the original owner order from the
      Sleeper draft type: linear drafts keep the base order every round, while
      snake drafts reverse the base order in even rounds. Completed transaction
      data is then applied to derive current pick ownership. DisplayStatus is
      generated directly by the draft generation utilities as a UI-safe status
      label. This file is the only draft output used to enrich League.json team
      DraftPick references. A stable draft start-time field still needs to be
      verified against Sleeper before it becomes part of the generated draft
      contract.
    updateMode:
      restricted: frequent RequestLeague.ps1 update
      full: weekly/manual RequestDrafts.ps1 update
    timestamped: true
    backup: true

  draftHistory:
    path: public/data/past_seasons/Drafts/Drafts_<season>.json
    generator: public/requests/utils/league/DraftHistoryUtils.psm1
    helpers:
      - public/requests/utils/league/DraftOrderAwareUtils.psm1
    entryPoint: public/requests/RequestDrafts.ps1
    workflow: .github/workflows/update-drafts.yml
    category: generated-output
    role: Completed draft history read model
    description: >
      Generated completed draft history by season. Historical draft files are
      refreshed as part of the weekly/manual RequestDrafts.ps1 full draft update.
      They use the same draft/pick shape as Drafts.json but must not be used to
      enrich League.json team DraftPick references. For exact historical Sleeper
      drafts, DraftOrderAwareUtils.psm1 derives the original owner order from the
      Sleeper draft type before trade flags and completed pick results are
      applied: linear drafts keep the base order every round, while snake drafts
      reverse the base order in even rounds. Completed historical pick results and
      final current pick ownership are enriched from Sleeper draft picks in
      DraftHistoryUtils.psm1. Completed pick TradeHistory is enriched by
      confirming traded pick assets through the draft-specific Sleeper traded
      picks endpoint and then attaching matching historical transaction details;
      transaction data is provenance for completed draft history and must not
      overwrite the final completed-draft owner. RequestDrafts.ps1 refreshes the
      central PastSeasonsIndex.json manifest after the history update; the index
      utility writes the manifest only when the semantic resource listing changes.
    updateMode:
      normal: weekly scheduled RequestDrafts workflow
      manual: workflow_dispatch on the RequestDrafts workflow
    timestamped: false
    backup: false

  pastSeasonsIndex:
    path: public/data/PastSeasonsIndex.json
    generator: public/requests/utils/league/PastSeasonsIndexUtils.psm1
    entryPoint: public/requests/RequestPastSeasonsIndex.ps1
    workflow: .github/workflows/update-past-seasons-index.yml
    category: generated-output
    role: Central navigational manifest for historical season resource files
    description: >
      Generated index of available historical season resources under
      public/data/past_seasons. The index is flexible by resource key and exposes
      each configured resource's web path, existence flag, content hash and stable
      update time for a season. UpdatedAt is preserved while a resource's
      ContentHash remains unchanged, so GitHub Actions checkout timestamps do not
      cause repeated index rewrites. It is a navigation manifest for Angular and
      AI workflows, not the domain source of truth for historical data. Historical
      Players, Games and Schedule files may be generated by separate manual
      scripts and then moved into public/data/past_seasons; after such manual
      moves the index should be refreshed through RequestPastSeasonsIndex.ps1 or
      its manual workflow.
    resourceConfigSource: public/requests/utils/ConfigUtils.psm1::PastSeasonResources
    currentResourceKeys:
      - Drafts
      - Transactions
      - Players
      - Games
      - Schedule
      - Standings
      - Teams
    updateMode:
      automatic: Requested by request scripts after potential past-season file updates; written only when path, existence or content hash changes.
      manual: workflow_dispatch on the Update Past Seasons Index workflow or local RequestPastSeasonsIndex.ps1 after manually moving historical files.
    timestamped: false
    backup: false

  angularFrontend:
    path: src/app
    category: frontend
    role: Angular-Darstellung
    description: >
      Displays generated JSON data. Angular may do frontend-only enrichment,
      filtering and UI state handling, but should avoid owning source-of-truth
      league rules.

dataFlow:
  - from: public/data/Metadata.json
    to: public/requests/utils/ConfigUtils.psm1
    purpose: Load league-specific inputs and rules.

  - from: public/data/Metadata.json
    to: public/data/League.json
    purpose: Provide CapDeadline and CapDeadlineBufferDays for generated league Status and Phase rules.

  - from: public/requests/utils/ConfigUtils.psm1
    to: public/requests/RequestPastSeasonsIndex.ps1
    purpose: Provide PastSeasonsIndex.json target path and configured historical resource path patterns.

  - from: Sleeper transactions endpoint
    to: public/data/Transactions.json
    purpose: Fetch completed current-season transaction data.

  - from: public/data/Transactions_Manual.json
    to: public/data/Transactions.json
    purpose: Enrich or add manual transaction output.

  - from: public/requests/RequestTransactions.ps1
    to: public/data/past_seasons/Transactions/Transactions_<season>.json
    purpose: Refresh historical transaction files and then refresh PastSeasonsIndex.json.

  - from: public/data/Transactions.json
    to: public/data/Drafts.json
    purpose: Apply draft-pick ownership changes before generating current/upcoming/live draft output.

  - from: public/data/Metadata.json
    to: public/data/Drafts.json
    purpose: Provide draft types, rounds and configured order rules.

  - from: Sleeper drafts endpoints
    to: public/data/Drafts.json
    purpose: Use authoritative Sleeper draft metadata, base order and draft type when available; exact snake drafts reverse the original owner order in even rounds during pick generation.

  - from: public/data/Drafts.json
    to: public/data/League.json
    purpose: Add sorted current/upcoming/live draft PickKey references to generated team data and drive draft-related Status/Phase transitions.

  - from: public/data/Players.json
    to: public/data/Players_Relevant.json
    purpose: Derive the generated relevant player subset for AI/chat-friendly player analysis.

  - from: public/data/Players_Relevant.json
    to: public/data/chat/players-relevant/index.json and public/data/chat/players-relevant/players_*.json
    purpose: Split full relevant player objects into stable chat-readable chunks with lookup metadata.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/Drafts.json
    purpose: Refresh current/upcoming/live draft data in the weekly/manual full draft update.

  - from: public/requests/RequestDrafts.ps1
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Refresh completed draft history in the weekly/manual full draft update.

  - from: public/data/past_seasons/**
    to: public/data/PastSeasonsIndex.json
    purpose: Scan configured historical resource files and expose available season/resource paths, content hashes and stable update metadata.

  - from: Sleeper drafts endpoints
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Discover completed drafts for historical seasons and use their authoritative base order and draft type for exact historical pick generation.

  - from: Sleeper draft picks endpoint
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Add completed pick results and final current pick ownership to historical draft output.

  - from: Sleeper draft-specific traded picks endpoint
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Confirm which traded pick assets belong to a completed Sleeper draft before mapping transaction history.

  - from: public/data/past_seasons/Transactions/Transactions_<season>.json
    to: public/data/past_seasons/Drafts/Drafts_<season>.json
    purpose: Add matching transaction details to completed draft pick TradeHistory after draft-specific traded-pick confirmation.

  - from: public/data/League.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend League and FantasyTeam models.

  - from: public/data/Drafts.json
    to: src/app/core/services/data.service.ts
    purpose: Resolve current/upcoming/live team DraftPickKeys into DraftPick objects and display generated DisplayStatus when present.

  - from: public/data/Players.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend Player model.

  - from: public/data/Teams.json
    to: src/app/core/services/data.service.ts
    purpose: Frontend NFL team model.

  - from: public/data/Timestamps.json
    to: src/app/core/services/data.service.ts
    purpose: Display freshness of generated data.

notesForAIAgents:
  - Generated JSON should generally be changed through generation logic, not manually.
  - Draft generation depends on current transaction output.
  - Draft DisplayStatus is a generated UI label owned by the draft generation utilities; keep Status and SleeperStatus as technical/source status fields.
  - League Status and Phase are generated UI-safe lifecycle labels. Phase is optional and should be an empty string when no sub-phase applies.
  - Do not derive CutsAllowed from League Phase. A reliable Sleeper field must be identified before changing cut/move openness logic.
  - Draft-Season / Pre Draft depends on a stable draft start-time field that still needs to be verified and added to Drafts.json.
  - Exact draft pick original owner order is generated by draft type: linear keeps the base order every round; snake reverses the base order in even rounds. Do not fix snake order by post-processing generated picks.
  - Current-season virtual drafts display as Upcoming; later virtual season drafts display as Future.
  - Angular display issues should not be fixed by changing generated data contracts unless the domain shape is wrong.
  - Completed draft history is generated by the weekly/manual RequestDrafts flow and should not refresh in the 10-minute RequestLeague workflow.
  - Completed draft history uses Sleeper draft picks as source for completed pick results and final current pick ownership; draft-specific Sleeper traded picks confirm completed trade assets before matching historical Transactions into TradeHistory. Do not reintroduce transaction-based ownership repair for completed draft history.
  - PastSeasonsIndex.json is a generated navigation manifest for historical files and should be regenerated through RequestPastSeasonsIndex.ps1, not edited manually.
  - Player chat export files under public/data/chat/players-relevant are generated helper output for AI/chat workflows; update PlayerChatExportUtils.psm1 or relevant-player generation instead of editing them manually.
