schemaVersion: 1
status: accepted-contract-v1
trackingIssue: 919
architectureDecision: ADR-055
implementationState: >
  PlayerValuation has been productively Python-owned since #919 and the Players consumer
  fully migrated in #1226 (ADR-076): tools/players_app_publish.py write materializes
  tools/derived_data.py snapshots and renders public/data/Players.json using
  tools/derived_data_lib/players_read_model.py. RequestLeague.ps1 only reads the
  newest PlayerValuation season snapshot through the trimmed
  public/requests/utils/player/PlayerValuationUtils.psm1::Get-PlayerValuationLatestSnapshot
  (Issue #1238 scope 3). No valuation arithmetic or materializer is owned by PowerShell;
  output contracts and the existing publication workflows are unchanged.

purpose: >
  Define the Shared Derived Data product PlayerValuation: for one league and one
  season, per week, the league-valued state of every NFL player in the league
  population - Salary, SalaryProjected, Ranking, rank Grading - plus the league
  Salary Cap. It replaces the Salary/Ranking/Grading/Salary-Cap logic that lives in
  the former public/requests/RequestPlayers.ps1 and the valuation logic formerly embedded in RequestLeague.ps1 with versioned central
  models (derived-models.yaml) and keeps the full history reproducible.

architecture:
  decisionBasis:
    - ADR-037
    - ADR-038
    - ADR-041
    - ADR-043
    - ADR-055
  logicalLayer: Shared Derived Data
  physicalStorage: data-derived/player-valuation/<CanonicalLeagueID>/<season>/week-<NN>.json
  physicalStorageTransition: >
    The product root was renamed from derived-data/ to data-derived/ in #788 SA; the root is addressed
    only through the central root constant (#788 step 0).
  models: .ai-context/manual/derived-models.yaml
  rules:
    - The product is consumer-neutral. App, Fantasy Operations, Fantasy Management and the salary simulation read the same snapshot; consumer shapes are produced by consumer generators.
    - public/data/Players.json and League.json keep their current contract. They are filled from the snapshot by the Players/League consumer generators (step 5) and stay byte-identical for unchanged inputs.
    - Mighty-Giants-specific valuation, roster fit and decisions stay FM insights and never enter this product.
    - Season values, PointHistory, GamesPotential and the Form basis (last four scored games) are added to the product additively (ADR-076, players-read-model.yaml, Issue #1226 step 3a); the Players function only copies them. A real Form grading becomes grading-v2 on the product data. Until step 3a the Form grading row stays a copy of GameHistory in the Players consumer generator.

identity:
  snapshotTuple:
    - CanonicalLeagueID
    - Season
    - AsOfFinalScoredWeek
    - ScoringProfile.SettingsHash
    - Models (Salary, SalaryCap, Grading model IDs)
  rowKey: >
    CanonicalPlayerID when present; otherwise the Sleeper PlayerID. Exactly one row
    per key per snapshot; a duplicate key fails the snapshot.
  asOfFinalScoredWeek: >
    NN in the file name. 00 means before week 1 of the season. NN is the last
    regular-season week that is final in the uninterrupted run of final weeks
    (resolve_league_week_bounds semantics) at the time the snapshot describes,
    capped at LastLeagueWeek. A snapshot for week NN uses only current-season
    results of weeks <= NN.
  scope:
    seasons: every season listed in data-source/leagues/<CanonicalLeagueID>/manifest.json
    weeks: "00 up to the last scored week of the season (completed seasons: all weeks; current season: up to the current AsOfFinalScoredWeek)"
    rule: Any snapshot can be regenerated at any time from data-source plus data-meta; no snapshot is a source of truth.
  providerBoundary: >
    Sleeper PlayerID is a join key for the App, not the identity. It may be null when
    no active Sleeper mapping exists for that season (completed seasons).

contract:
  version: 3
  versionHistory: >-
    ContractVersion 2 (Issue #1226 step 3a, ADR-076) adds SeasonValues and FormGames.
    ContractVersion 3 (Issue #1236) defines GamesPlayed as fantasy-relevant games
    (non-K offense snaps or nonzero league-scored actual, including negative/ST points).
    Scoreless ST-only appearances are excluded; K remains attempt-based. Current
    and historical AvgGame, Inputs, points and salaries use the same semantics.
    Old v2 snapshots preserve their prior inputs; salary-v1 is not modified.
  rootShape: |
    {
      "ContractVersion": 3,
      "CanonicalLeagueID": "nfl-reise",
      "Season": 2026,
      "AsOfFinalScoredWeek": 4,
      "ScoringProfile": { "Season": 2026, "SettingsHash": "sha256:...", "FingerprintVersion": 1, "ActiveSettingsCount": 41 },
      "Models": { "Salary": "salary-v1", "SalaryCap": "salary-cap-v1", "Grading": "grading-v1" },
      "League": {
        "TeamCount": 12,
        "SalaryRelevantTeamSize": 20,
        "TopN": 240,
        "SalaryCap": 430186369,
        "SalaryCapProjected": 462661278
      },
      "Players": []
    }
  playerRowShape: |
    {
      "CanonicalPlayerID": "NFLP-...",
      "PlayerID": "10215",
      "Position": "QB",
      "Population": ["nfl_roster_current_season"],
      "Hold": null,
      "Inputs": {
        "Current":      { "AvgPotentialGame": 0.0, "AvgGame": 0.0 },
        "SeasonMinus1": { "AvgPotentialGame": 0.0, "AvgGame": 0.0 },
        "SeasonMinus2": { "AvgPotentialGame": 0.0, "AvgGame": 0.0 },
        "SeasonMinus3": { "AvgPotentialGame": 0.0, "AvgGame": 0.0 }
      },
      "SeasonValues": {
        "Current":      { "GamesPlayed": 0, "GamesPotential": 0, "SnapsTotal": 0, "AttemptsTotal": 0, "FantasyPointsTotal": 0.0, "FantasyPointsAvgGame": 0, "FantasyPointsAvgPotentialGame": 0, "FantasyPointsAvgSnap": 0, "FantasyPointsAvgAttempt": 0, "TouchdownsTotal": 0, "TouchdownsPassing": 0, "TouchdownsReceiving": 0, "TouchdownsRushing": 0 },
        "SeasonMinus1": { "Total": 0.0, "AvgGame": 0.0, "AvgPotentialGame": 0.0, "GamesPlayed": 0, "PotentialGames": 0 },
        "SeasonMinus2": {},
        "SeasonMinus3": {}
      },
      "FormGames": ["game-id", "..."],
      "Salary": 0,
      "SalaryProjected": 0,
      "Ranking": [ { "Type": "Total", "Value": 1 } ],
      "Grading": [ { "Type": "Rank", "Value": 1, "Rank": 1, "Grade": "A" } ]
    }
  fieldRules:
    - Salary and SalaryProjected are whole-dollar integers from the selected salary model.
    - Ranking uses the types and order of derived-models.yaml rankingFunctions; inactive players have an empty list.
    - Grading contains exactly the Rank row of the selected grading model. The Form row is not part of the product.
    - SeasonValues are the Players.json season aggregates and the PointHistory blocks (Players.json field names, same rounding), derived once here; the Players consumer only copies them. They follow the as-of rule of Inputs, so an older snapshot never changes when later weeks arrive.
    - FormGames lists the GameIDs of the last four scored games (final, within the league weeks, week up to AsOfFinalScoredWeek), newest first; it is the basis of a later Form grading (grading-v2) and carries no grade itself.
    - An identity-hold row takes SeasonValues from the held snapshot row (null when none is known) and has empty FormGames; it has no GameHistory (Issue #1226, Q3).
    - Inputs make every row self-describing so models can be re-run and audited without re-reading data-source; they are copies of the league-scored values and carry no extra rounding.
    - ContractVersion 3: GamesPlayed is fantasy-relevant games, not literal NFL appearances. For non-K it counts finalized regular-season offense-snap games (including zero-point) plus scored games (positive or negative, including ST-only), once per player-week. Scoreless ST-only games do not count. K uses kick attempts. The same game denominator feeds current and historical salary-v1 AvgGame and FantasyPointsAvgGame. SnapsTotal remains offensive for non-K and is not relabeled. No extra games counter is introduced.
    - Players are sorted by row key (ordinal) and keys inside objects have a fixed order, so equal content is byte-equal.
    - No wall-clock timestamp, run ID or commit hash appears in the content (semantic no-op).
  missingVersusZero: >
    Unknown is never written as 0. A value that cannot be derived (no usable input,
    no hold source) is null. A real 0 (for example Salary 0 by the two-newest-seasons
    rule) is a model result.

inputs:
  points:
    owner: tools/players_league_scoring.py (in-process, ADR-041)
    rule: >
      League-scored weekly points of the snapshot season (weeks <= AsOfFinalScoredWeek)
      and the three previous seasons from canonical player-stats and snap-counts with
      the canonical ScoringSettings of the snapshot season, applied to all four seasons as
      RequestPlayers.ps1 does today. Under ContractVersion 3, AvgGame is points
      per fantasy-relevant game (non-K offense snaps or any scored points; K attempts),
      and AvgPotentialGame is points per potential game. Current season: unrounded point sum, averages rounded
      half-to-even to two decimals, potential = as-of week minus one when the team bye week
      is <= the as-of week (bye 0 without a team, legacy parity). Previous seasons: total
      rounded to two decimals first, then the averages, potential = LastLeagueWeek - 1 of
      the snapshot season. Implementation: tools/derived_data_lib/player_valuation.py.
  scoringProfile:
    owner: data-source/leagues/<CanonicalLeagueID>/seasons/<season>/league.json::ScoringSettings
    fingerprint: tools/player_week_fantasy.py scoring_settings_fingerprint (SettingsHash)
  population:
    owner: tools/players_population.py (ADR-043)
    rule: >
      The population rule of ADR-043 evaluated for the snapshot season: app fantasy
      position, valid birth date and at least one reason (season roster, season draft,
      league owned). Population lists the reasons per row.
    historicalSeasons: >
      For a completed season the roster and draft reasons come from that season's
      canonical weekly rosters and draft; the Sleeper snapshot is current-only and is
      not used. Position and birth date come from the canonical NFL player profile and
      roster of that season. league_owned is evaluated against the persisted
      rosters.json of that league season, which is the end-of-season state; it is
      therefore marked and never reconstructs a mid-season roster. A player that cannot
      be assigned unambiguously is omitted and counted in the materialization report
      (Missing, not zero).
  weekBounds:
    owner: tools/players_league_scoring.py::resolve_league_week_bounds (delegates to tools/derived_data_lib/week_finality.py)
    rule: LastLeagueWeek, PlayoffStartWeek from the canonical league-season WeekStructure; AsOfFinalScoredWeek is the shared StatsFinalWeek milestone (games final and stats coverage, week-finality.yaml, ADR-071).
  teamCount:
    owner: data-source/leagues/<CanonicalLeagueID>/seasons/<season>/league.json::Settings.num_teams
  modelSelection:
    owner: data-meta/<CanonicalLeagueID>/metadata.json (#986, loader in #986 step 2)
    rule: Seasons.<season>.Models; unknown or missing choice for a season fails the snapshot.

identityHold:
  rule: >
    A population player without a unique CanonicalPlayerID for the snapshot season
    (identity hold, ambiguous special-teams evidence) keeps the last published Inputs.
    Salary, Ranking and Grading are recomputed from the held Inputs together with all
    other players, as RequestPlayers.ps1 does today.
  holdSource: the existing snapshot file of the same league, season and week; if absent, the newest earlier week of that season; if absent, Inputs and all derived values are null and the row carries the hold reason.
  marking: 'Hold is an object with Reason (identity status) and SourceWeek (NN or null); it is null for normal rows.'
  consequence: >
    Hold rows depend on earlier snapshot content and are the only part that cannot be
    rebuilt from data-source alone. They are limited to the current season and are
    reported by the materializer. Completed-season snapshots with holds are rebuilt
    with the hold rows as persisted.

invalidation:
  triggers:
    - league-scored points or stat corrections of the snapshot season or the three previous seasons
    - ScoringSettings / SettingsHash change of any of these seasons
    - population change (rosters, draft, league rosters, identity resolution)
    - AsOfFinalScoredWeek or week structure change
    - model choice or model version change for a season
    - TeamCount change
  rule: >
    A change in any trigger is detected by recomputation, not by a cache key; the
    materializer recomputes the affected snapshots and writes only on semantic
    difference. A later week snapshot of the same season does not depend on an earlier
    one except through hold rows.
  noOp: unchanged inputs produce no file change, no commit

consumers:
  app:
    path: public/data/Players.json, public/data/League.json (unchanged contract)
    fields: Salary, SalaryProjected, Ranking, Grading[Rank], League.SalaryCap, SalaryCapProjected
    step: 5
  fantasyOperations:
    path: fantasy-management/_ai/scripts/build_fantasy_operations_inputs.py, build_player_signal_dataset.py, audit_player_signal_population_relevance.py (all via canonical_player_inputs.py)
    fields: Salary, SalaryProjected from the newest snapshot of the current season; population, Age, Year, IsFreeAgent, Status and injury from tools/players_population.py
    ageRule: Age uses shared tools/player_age.py with an explicit run-scoped AsOfDate in the canonical league time zone (Issue #1263 C9a); neither published Timestamps.Players nor the app read model determines the Age date
    step: 6
    state: done 2026-10-15; public/data/Players.json is no input of the Operations builders anymore (parity on repository data, 945 players, 0 differing rows)
  fantasyManagement:
    path: fantasy-management/league-economy/salary/simulation/salary_simulation.py
    step: 7
    state: done 2026-10-15; curve, floor, season-points weights and cap come from the registered salary-v1 and salary-cap-v1 modules (curve_dollars, floored_average, raw_cap; unrounded variants with unchanged behaviour of the productive functions); simulation output (md, json, csv) is byte-identical before and after on the same input data; the draft-concept parameters (minimum percentages, rookie scale, dead cap) stay simulation-local because they belong to the unadopted redesign
  legacyPowerShellRemoval:
    path: public/requests (former RequestPlayers.ps1 and PlayerUtils.psm1; current RequestLeague.ps1 and trimmed PlayerValuationUtils.psm1)
    step: 8
    state: >
      Done 2026-10-15 (#919 step 8) and completed by #1226/#1238: Salary/Ranking/Grading calculation, Players read model and materializer are Python-owned; the former PowerShell Salary functions and PlayerUtils.psm1 were retired. RequestLeague retains only a read-only newest-season PlayerValuation snapshot adapter for the unchanged Salary Cap. players_league_scoring_shadow keeps fixed oracle constants for parity validation.

failClosed:
  - unknown model ID or model not chosen for the season
  - duplicate row key
  - non-finite input value
  - AsOfFinalScoredWeek beyond what canonical finality proves
  - team count missing or not a positive integer
  - ambiguous league-owned identity (as in tools/players_league_scoring.py)

ciWiring: .github/workflows/build.yml step 'Run PlayerValuation model and materializer tests' (test_derived_data_models, test_player_valuation, test_player_valuation_shadow; approved by Robert 2026-10-15)
openPoints:
  - id: historical-population
    text: >
      Implemented in tools/player_valuation_sources.py (canonical rosters plus weekly rosters,
      Sleeper source ID, app position, valid birth date). FB players are not in the historical
      population, which matches the current population rule (ADR-043: app positions QB, RB,
      WR, TE, K only), so this is no gap against the published Players.json. A league-owned
      player without roster record is skipped and counted. The step 4 plausibility report
      (tools/player_valuation_shadow.py) states coverage per snapshot: the position mix of
      2024 and 2025 matches 2026 in order of magnitude and no snapshot contains a hold row.
  - id: snapshot-size
    text: >
      Measured in step 3 (compact JSON, about 0.54 MB per snapshot) and decided in step 5: the full
      history (2024 to 2026, about 22 MB) is committed under data-derived. The materializer writes
      only semantically changed snapshots, so a daily run rewrites at most the snapshots of the
      current season; past seasons change only after a stat or scoring correction.
  - id: hold-seeding
    text: >
      C8j (Issue #1263) retires the old optional published-player seed from the
      shared PlayerValuation materializer and read-only restore probe. The former
      Issue #919 step 5 bootstrap was superseded by ADR-076 on 2026-10-30:
      previously published consumer rows are not an allowed Derived input.
      An identity-hold row reuses Inputs of its existing same-week snapshot or
      newest earlier season week; if none exist, Inputs remain null and the
      Players consumer reports the documented gap/warning. No new hold writer,
      source fallback or automatic seed is introduced.
  - id: players-run-materializes-all-seasons
    text: >
      The Python Players consumer tools/players_app_publish.py write materializes every season.
      Past seasons therefore follow corrections to canonical stats automatically; the League refresh
      never materializes and reads the newest committed snapshot from the last Players run.
  - id: non-contiguous-final-weeks
    text: >
      Legacy scores all final weeks while a snapshot uses only weeks <= AsOfFinalScoredWeek.
      Both agree while final weeks are contiguous. The step 4 shadow confirmed exact parity for
      2026 week 5 (weeks 1 to 5 contiguous). A season with a gap in its final weeks is not
      covered by that evidence and must be re-checked when it occurs.
  - id: unranked-grade
    text: >
      Resolved 2026-10-15 (Robert): a player without a rank gets Grade null in grading-v1 instead of A
      (defect fix in place, no grading-v2). Players.json carries Grade null for these players from the
      first Players run after the fix; no app or Fantasy Management consumer reads Grade. The
      shadow treats published A versus snapshot null for an unranked player as the intended deviation
      until the file is republished.
