schemaVersion: 3

domain: nfl-source-data

purpose: >
  Definiert den dauerhaften Vertrag fuer persistierte externe NFL-Quelldaten,
  ihre Acquisition-/Availability-Semantik, Lifecycle-Klassen und die
  providerunabhaengige kanonische Materialisierung. Dieser Vertrag ergaenzt den
  Player-Identity-Vertrag; er ersetzt weder public/data als App-Read-Model-Schicht
  noch fantasy-management/sources.

boundaries:
  providerRaw:
    path: source-data/providers/<provider>/
    owns:
      - validierte providernahe Rohdaten
      - Abrufprovenienz und Content-Hash
      - Provider-/Upstream-Feldnamen
      - expliziten Availability-State pro persistierter Source/Partition
  canonicalNfl:
    path: source-data/nfl/
    owns:
      - providerunabhaengige NFL-Fakten
      - dauerhafte CanonicalPlayerID-Verknuepfungen
      - saison- oder snapshotbezogene historische Fakten
    identityNamespaceRule: >
      Der Pfadname nfl bezeichnet die Datendomaene. CanonicalPlayerID wird von
      fantasy-app vergeben und ist keine von der NFL ausgestellte ID.
  appReadModels:
    path: public/data/
    owns:
      - generierte App-Vertraege
    rule: >
      Source-Datasets duerfen nicht allein durch ihre Aufnahme in source-data
      automatisch neue Felder, Provider oder Identitaeten in public/data
      einfuehren. Die App-Generator-Migration ist ein eigener spaeterer Schritt.

canonicalSchema:
  currentVersion: 2
  playerIdentityField: CanonicalPlayerID
  legacyPlayerIdentityField: NFLPlayerID
  migrationRule: >
    Bestehende v1-Canonical-Dateien duerfen den Legacy-Feldnamen beim normalen
    Materialize-Lauf auf CanonicalPlayerID migrieren. ID-Wert und historische
    Personenzuordnung bleiben unveraendert. Neue Outputs schreiben nur
    CanonicalPlayerID.

registry:
  path: source-data/registry.json
  schemaVersion: 3
  principle: >
    Acquisition, Format, Availability, Materializer-Teilnahme, Refresh,
    Retention, Partitionierung, Finalisierung und Repair sind maschinenlesbare
    Bestandteile des Dataset-Vertrags und werden beim Laden fail-closed validiert.

  sourceModes:
    fixed:
      rule: >
        Eine feste Source-URL wird auf genau einen validierten Raw-Snapshot und
        eine Metadata-Datei abgebildet. URL und Pfade duerfen kein {season}-Token
        enthalten.
    season-partitioned:
      rule: >
        Source-URL, Raw-Pfad und Metadata-Pfad enthalten alle {season}. Im
        normalen Lauf wird die aktuelle Source-Season verwendet; explizite
        Backfills/Repairs koennen eine oder mehrere Seasons ueber --season waehlen.

  sourceFormats:
    supported:
      - csv
      - json
    jsonContract: >
      JSON-Raw-Sources duerfen als Liste von Records oder als Objekt mit Records
      als Values vorliegen. Required Fields und Mindestanzahl werden vor
      Persistierung validiert.

  materializerParticipation:
    field: materialize
    rule: >
      materialize=true bedeutet, dass das Dataset bereits vom kanonischen
      Materializer konsumiert wird. Das umfasst Identity, Draft, Combine sowie
      die aktivierten Phase-1-Materializer. materialize=false erlaubt Raw-
      Persistierung ohne kanonische Publikation.

  availabilityPolicies:
    required:
      rule: >
        Fetch-, HTTP-, Schema-, Format- oder Plausibilitaetsfehler sind harte
        Fehler. Der letzte gute persistierte Raw-Stand bleibt unveraendert.
    current-season-may-be-unavailable:
      rule: >
        Nur ein HTTP-404 fuer eine noch nicht persistierte aktuelle Season eines
        season-partitioned Datasets darf als not-yet-available materialisiert
        werden. Historische 404s bleiben Fehler. Ein bereits vorhandener Raw-
        Stand wird durch einen spaeteren 404 niemals ersetzt.
      noOpRule: >
        not-yet-available-Metadata enthaelt keinen per-run Timestamp.
        Wiederholte Checks ohne Zustandsaenderung bleiben semantische No-ops.

  sourceSeason:
    resolutionOrder:
      - public/data/League.json -> Season
      - public/data/Metadata.json -> LeagueYear
      - UTC calendar year as final technical fallback
    explicitSelection: >
      `python tools/nfl_source_data.py sync --season <year>` ist wiederholbar und
      nur fuer sync mit mindestens einem ausgewaehlten season-partitioned Dataset
      zulaessig.

  lifecycleClasses:
    dynamic:
      refreshPolicy: periodic
      retentionPolicy: latest-with-git-history
      partitionKey: none
      finalization: never
      repairPolicy: normal
    immutable-history:
      useFor: historisch stabile, saisonweise kanonisierte Fakten wie Draft und Combine
      refreshPolicy: discover-new-partitions
      retentionPolicy: permanent-by-season
      partitionKey: season
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force
      rule: >
        Die aktuelle Source-Season bleibt aktualisierbar. Bereits vorhandene
        fruehere Saisons werden im normalen Materialize-Pfad unveraendert
        beibehalten; historische Reparatur benoetigt --force.
    seasonal-finalizable:
      useFor: laufende saisonale oder woechentliche Fakten wie Rosters, Schedules, Stats und Snap Counts
      refreshPolicy: current-season
      retentionPolicy: permanent-by-season
      partitionKey:
        - season
        - season-week
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force
    snapshot:
      useFor: zeitpunktbezogene Zustaende wie Depth Charts und Contracts
      refreshPolicy: snapshot
      retentionPolicy: permanent-snapshots
      partitionKey: snapshot-time
      finalization: append-only-snapshots
      repairPolicy: explicit-force

  rawFreezeRule: >
    Bereits persistierte season-partitioned Raw-Seasons vor der aktuellen
    Source-Season werden normal als frozen-existing validiert und ohne Netzabruf
    wiederverwendet. Historische Reparaturen verwenden --force.

activeDatasets:
  - id: nflverse.players
    lifecycle: dynamic
    sourceMode: fixed
    materialize: true
  - id: nflverse.ff-player-ids
    lifecycle: dynamic
    sourceMode: fixed
    materialize: true
  - id: nflverse.draft-picks
    lifecycle: immutable-history
    sourceMode: fixed
    materialize: true
  - id: nflverse.combine
    lifecycle: immutable-history
    sourceMode: fixed
    materialize: true
  - id: nflverse.schedules
    lifecycle: seasonal-finalizable
    sourceMode: fixed
    materialize: true
  - id: nflverse.game-finality
    lifecycle: seasonal-finalizable
    sourceMode: fixed
    materialize: true
  - id: nflverse.rosters
    lifecycle: seasonal-finalizable
    sourceMode: season-partitioned
    materialize: true
  - id: nflverse.weekly-rosters
    lifecycle: seasonal-finalizable
    sourceMode: season-partitioned
    materialize: true
  - id: nflverse.player-stats
    lifecycle: seasonal-finalizable
    sourceMode: season-partitioned
    materialize: true
  - id: nflverse.snap-counts
    lifecycle: seasonal-finalizable
    sourceMode: season-partitioned
    materialize: true
  - id: sleeper.players
    lifecycle: dynamic
    sourceMode: fixed
    materialize: true

plannedDatasets:
  - id: nflverse.depth-charts
    lifecycle: snapshot
  - id: nflverse.contracts
    lifecycle: snapshot

canonicalOutputs:
  schedules: source-data/nfl/schedules/<season>.json
  gameFinality: source-data/nfl/game-finality/<season>.json
  rosters: source-data/nfl/rosters/<season>.json
  weeklyRosters: source-data/nfl/weekly-rosters/<season>/<week>.json
  playerStats: source-data/nfl/player-stats/<season>/<week>.json
  snapCounts: source-data/nfl/snap-counts/<season>/<week>.json
  sleeperPlayers: source-data/nfl/platform/sleeper/players.json
  audit: source-data/audits/nfl-source-data-audit.json

operationalDatasetEvaluation:
  evaluatedAt: 2026-08-30
  principle: >
    nflverse und Sleeper werden feldbezogen bewertet. Die Phase-1-Datasets sind
    im Source-Data-Vertrag aktiviert; dies aendert public/data und seine Runtime-
    Provider noch nicht. App-Generator-Migration bleibt Phase 2.

  schedules:
    recommendedRole: primary-canonical
    canonicalPath: source-data/nfl/schedules/<season>.json
    primaryFor:
      - NFL-Spielplan und historische Schedule-Metadaten
      - Saison, Woche, Game Type, Datum, Teams und Scores
      - langfristige saisonweise Historie
    historyStart: 1999
    identity:
      gameKey: nflverse game_id
      playerIdentityRequired: false
    currentRuntimeUntilMigration:
      - Tank01 liefert weiterhin das heutige Schedule.json-Format bis Phase 2
    guards:
      - game_id ist innerhalb des kanonischen Schedule-Datasets eindeutig
      - game_type wird explizit erhalten
      - Postseason gelangt nicht still in einen spaeteren REG-only Consumer

  gameFinality:
    recommendedRole: canonical-finality-evidence
    canonicalPath: source-data/nfl/game-finality/<season>.json
    evidence: nflverse released_games.csv
    rule: >
      Ein Score allein ist niemals Final-Nachweis. Final=true gilt nur fuer eine
      canonical game_id, die in der validierten released-games-Evidenz enthalten
      ist. WeekFinal wird pro GameType/Woche erst dann true, wenn alle
      anwendbaren Spiele Final=true sind.
    specialCaseEvidence: >
      Das abgebrochene BUF-CIN-Spiel der Week 17/2022 bleibt trotz vorhandener
      Schedule-/Score-Werte nicht final, solange es nicht released ist.
    guards:
      - doppelte released game_id bricht fail-closed ab
      - released game_id ohne korrespondierendes Schedule-Spiel bricht fail-closed ab
      - score presence darf nie als Ersatz-Evidenz dienen

  playerStats:
    recommendedRole: primary-canonical
    canonicalPath: source-data/nfl/player-stats/<season>/<week>.json
    primaryFor:
      - woechentliche NFL-Player-Rohstats
      - historische Passing-, Rushing-, Receiving-, Kicking- und Return-Statistik
      - Rohfakten fuer spaetere ligaeigene Fantasy-Point-Berechnung
    historyStart: 1999
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    rawFactRule: >
      Alle nicht-kontextuellen Upstream-Stat-Felder bleiben im Stats-Objekt
      erhalten. Das umfasst insbesondere Punt-/Kickoff-Return-Yards und
      Return-TDs. Provider-Fantasy-Point-Werte sind keine dauerhafte kanonische
      Punktequelle.
    availabilityRule: >
      Noch nicht veroeffentlichte aktuelle Stats duerfen als not-yet-available
      gelten. Missing ist nicht 0.
    currentRuntimeUntilMigration:
      - Tank01 bleibt Quelle des heutigen provider-spezifischen Games.json-Boxscore-Schemas bis Phase 2

  rosters:
    recommendedRole: primary-canonical-for-nfl-membership
    canonicalSeasonPath: source-data/nfl/rosters/<season>.json
    canonicalWeeklyPath: source-data/nfl/weekly-rosters/<season>/<week>.json
    primaryFor:
      - NFL-Teamzugehoerigkeit und saisonale Roster-Historie
      - In-Season-Teamwechsel ueber Weekly Rosters
      - providerunabhaengige Team-/Status-Evidenz
    seasonHistoryStart: 1920
    weeklyHistoryStart: 2002
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    retainSleeperFor:
      - Sleeper-spezifischen Player-/Platform-Status
      - Sleeper Depth-Chart-Felder als Plattformfakten
      - Fantasy-Plattform- und Liga-spezifische Availability-Fakten
    rule: >
      Season-Rosters ersetzen keine Weekly-Historie fuer In-Season-Teamwechsel.
      Rows ohne GSIS bleiben in Raw-Evidence, werden aber nicht per Name in die
      kanonische Player-Zuordnung geraten.

  snapCounts:
    recommendedRole: primary-canonical
    canonicalPath: source-data/nfl/snap-counts/<season>/<week>.json
    primaryFor:
      - offensive, defensive und Special-Teams-Snaps pro Spiel
      - historische Snap-Anteile und Snap-Counts
    historyStart: 2012
    identity:
      authoritativeProviderKey: PFR
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    semanticGuard: >
      Fehlende historische oder noch nicht veroeffentlichte aktuelle Snap-Daten
      duerfen nicht als 0 materialisiert werden. unavailable,
      not-yet-available und fetch-failed bleiben von einem echten 0-Wert
      unterscheidbar.
    kickerNote: >
      Echte nflverse Special-Teams-Snaps aendern nicht still die bisherige
      synthetische Kicker-Snap-Semantik der App; das gehoert in Phase 2.

  sleeperPlayers:
    recommendedRole: current-platform-and-interim-injury-source
    canonicalPath: source-data/nfl/platform/sleeper/players.json
    identity:
      authoritativeProviderKey: Sleeper player_id
      canonicalTarget: CanonicalPlayerID
      objectKeyInvariant: object key and record player_id must agree when both exist
    fields:
      - sleeper player_id and platform status
      - team/platform metadata
      - injury_status
      - injury_start_date
      - practice_participation
      - Sleeper depth-chart fields as platform facts
    injuryRule: >
      Sleeper liefert den benoetigten aktuellen Injury-/Practice-State. Tank01-
      spezifische Rich-Fields wie ReturnDate oder Description sind kein
      Pflichtfeld, wenn keine gleichwertige kanonische Source vorhanden ist.

scoringTarget:
  rawFacts: canonical NFL player stats
  leagueRules: Sleeper league scoring_settings
  fantasyPoints: derived-deterministically-in-own-pipeline
  providerPointValues: validation-only
  rule: >
    Spaetere Scoring-Aenderungen wie Punkte fuer Kick-/Punt-Return-Yards duerfen
    keinen Wechsel der NFL-Statistikquelle erzwingen.

tank01Target:
  normalPrimaryAfterMigration: false
  intendedRole: limited-periodic-control-provider
  rule: >
    Nach erfolgreicher Source- und spaeterer Generator-Migration soll Tank01
    nicht Primary fuer Schedule, Finality, Weekly Stats, Snaps, Fantasy Points
    oder den benoetigten Current-Injury-Status sein. Ein begrenzter
    Kontrollabgleich darf Abweichungen auditieren, aber kanonische Daten nicht
    automatisch ueberschreiben.

historicalBackfill:
  currentAppHistory: >
    public/data/past_seasons besitzt fuer Players, Games und Schedule derzeit
    materialisierte Saisons 2022 bis 2025.
  bands:
    - seasons: 2012-2021
      coverage: schedules + player-stats + weekly-rosters + snap-counts
      recommendation: strongest-backfill-band
    - seasons: 2002-2011
      coverage: schedules + player-stats + weekly-rosters
      missing: snap-counts
    - seasons: 1999-2001
      coverage: schedules + player-stats + season-rosters
      missing:
        - weekly-rosters
        - snap-counts
    - seasons: before-1999
      coverage: season-rosters-only-for-this-evaluation
      recommendation: no-current-app-backfill-priority
  rule: >
    Historische App-Dateien sollen spaeter aus kanonischen source-data-Vertraegen
    neu erzeugt werden. Fehlende Felder muessen als nicht verfuegbar modelliert
    werden.

combine:
  providerDataset: nflverse.combine
  upstream: nflverse/nflverse-data
  provenance: NFL Combine data courtesy of Pro Football Reference
  canonicalPath: source-data/nfl/combine/<season>.json
  identity:
    masterKey: CanonicalPlayerID
    authoritativeJoin: PFR provider mapping
    nameMatchingAuthoritative: false
    sourceCollisionPolicy:
      distinctSameSeasonPfrClaims: quarantine-as-ambiguous
      identicalDuplicateRows: fail-closed
      duplicateResolvedCanonicalIdentity: fail-closed
    rule: >
      Combine-Records werden nur ueber eindeutige PFR-Mappings gebunden. Namen,
      Position oder Schule duerfen keinen Gewinner bestimmen. Widerspruechliche
      Same-Season-PFR-Claims werden quarantinisiert.
  draftLink:
    authoritativeSource: source-data/nfl/draft/<season>.json
    sourceEvidenceField: SourceDraftEvidence
    rule: >
      Upstream-Draftfelder bleiben Provenienz. Die normalisierte Draft-
      Verknuepfung stammt aus dem kanonischen Draft-Dataset.

publication:
  rawFirst: true
  failClosed: true
  semanticNoOpRequired: true
  normalRepairBehavior: >
    Normale Materialisierung/Raw-Synchronisierung darf eingefrorene historische
    Partitionen nicht ersetzen. Bewusste Reparatur verwendet --force.
  workflow:
    path: .github/workflows/sync-nfl-source-data.yml
    rule: >
      Der bestehende Workflow publiziert zuerst validierte Raw-Daten, baut danach
      kanonische Daten aus dem auf main persistierten Raw-Stand und fuehrt sofort
      einen zweiten semantischen No-op-Pass aus. Phase 1 aendert die Workflow-
      Datei selbst nicht.

validation:
  - Registry-v3 Source-/Lifecycle-Kombinationen werden beim Laden fail-closed validiert.
  - Current 404 -> not-yet-available ist nur unter der expliziten Policy erlaubt; historical 404 bleibt Fehler.
  - Vorhandene prior-season Raw-Partitionen werden normal ohne Netzabruf erhalten.
  - Unerwartet kleine/leere oder schema-inkompatible Inputs koennen keinen letzten guten Stand ersetzen.
  - PR-CI fuehrt die komplette test_nfl_source*.py-Suite vor den bestehenden PowerShell-/Angular-Checks aus.
  - Schedules und released-games game_id muessen eindeutig sein; unbekannte released game_id bricht fail-closed ab.
  - BUF-CIN Week 17/2022 bleibt ohne released-Evidenz nicht final, auch wenn Scores vorliegen.
  - Roster/Stats/Snap/Sleeper-Player-Zuordnung verwendet nur Provider-IDs; Namen sind nie autoritativ.
  - Player Stats behalten Return-Yards/-TDs und alle weiteren Rohstat-Felder fuer spaetere deterministische Scoring-Regeln.
  - Missing/unavailable Stats oder Snaps werden nie als numerische 0 erfunden.
  - Sleeper object key und player_id duerfen sich nicht widersprechen.
  - Phase-1-Abdeckung und Identity-Resolution werden im Audit unter phase1Datasets publiziert.
  - Reale Source-Materialisierung muss den bestehenden zweiten semantischen No-op-Pass bestehen.
