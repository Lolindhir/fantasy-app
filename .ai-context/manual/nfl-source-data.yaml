schemaVersion: 3

domain: nfl-source-data

purpose: >
  Definiert den dauerhaften Vertrag fuer persistierte externe NFL-Quelldaten,
  ihre Acquisition-/Availability-Semantik, Lifecycle-Klassen und die
  providerunabhaengige kanonische Materialisierung. Dieser Vertrag ergaenzt den
  Player-Identity-Vertrag; er ersetzt weder public/data als App-Read-Model-Schicht
  noch fantasy-management/sources.

boundaries:
  providerRaw:
    path: source-data/providers/<provider>/
    owns:
      - validierte providernahe Rohdaten
      - Abrufprovenienz und Content-Hash
      - Provider-/Upstream-Feldnamen
      - expliziten Availability-State pro persistierter Source/Partition
  canonicalNfl:
    path: source-data/nfl/
    owns:
      - providerunabhaengige NFL-Fakten
      - dauerhafte CanonicalPlayerID-Verknuepfungen
      - saison- oder snapshotbezogene historische Fakten
    identityNamespaceRule: >
      Der Pfadname nfl bezeichnet die Datendomaene. CanonicalPlayerID wird von
      fantasy-app vergeben und ist keine von der NFL ausgestellte ID. Eine
      kuenftige offizielle NFL-ID waere eine weitere externe Provider-Zuordnung.
  appReadModels:
    path: public/data/
    owns:
      - generierte App-Vertraege
    rule: >
      Source-Datasets duerfen nicht allein durch ihre Aufnahme in source-data
      automatisch neue Felder, Provider oder Identitaeten in public/data einfuehren.
      Die App-Generator-Migration ist ein eigener spaeterer Schritt.

canonicalSchema:
  currentVersion: 2
  playerIdentityField: CanonicalPlayerID
  legacyPlayerIdentityField: NFLPlayerID
  migrationRule: >
    Bestehende v1-Canonical-Dateien duerfen den Legacy-Feldnamen beim normalen
    Materialize-Lauf auf CanonicalPlayerID migrieren. Der ID-Wert und die
    historische Personenzuordnung bleiben unveraendert. Diese reine Schema-
    Migration benoetigt auch fuer eingefrorene historische Partitionen kein
    --force; neue Outputs duerfen den Legacy-Feldnamen nicht mehr schreiben.

registry:
  path: source-data/registry.json
  schemaVersion: 3
  principle: >
    Acquisition, Format, Availability, Materializer-Teilnahme, Refresh,
    Retention, Partitionierung, Finalisierung und Repair sind maschinenlesbare
    Bestandteile des Dataset-Vertrags und werden beim Laden fail-closed validiert.

  sourceModes:
    fixed:
      rule: >
        Eine feste Source-URL wird auf genau einen validierten Raw-Snapshot und
        eine Metadata-Datei abgebildet. URL und Pfade duerfen kein {season}-Token
        enthalten.
    season-partitioned:
      rule: >
        Source-URL, Raw-Pfad und Metadata-Pfad enthalten alle {season}. Im
        normalen Lauf wird die aktuelle Source-Season verwendet; explizite
        Backfills/Repairs koennen eine oder mehrere Seasons ueber --season waehlen.

  sourceFormats:
    supported:
      - csv
      - json
    jsonContract: >
      JSON-Raw-Sources duerfen als Liste von Records oder als Objekt mit Records
      als Values vorliegen. Required Fields und Mindestanzahl werden vor
      Persistierung validiert.

  materializerParticipation:
    field: materialize
    rule: >
      materialize=true bedeutet, dass das Dataset bereits vom bestehenden
      kanonischen Materializer konsumiert wird. materialize=false erlaubt die
      Aktivierung und Persistierung einer Raw-Source, ohne sie versehentlich in
      die aktuelle Identity/Draft/Combine-Materialisierung einzuspeisen.

  availabilityPolicies:
    required:
      rule: >
        Fetch-, HTTP-, Schema-, Format- oder Plausibilitaetsfehler sind harte
        Fehler. Der letzte gute persistierte Raw-Stand bleibt unveraendert.
    current-season-may-be-unavailable:
      rule: >
        Nur ein HTTP-404 fuer eine noch nicht persistierte aktuelle Season eines
        season-partitioned Datasets darf als not-yet-available materialisiert
        werden. Historische 404s bleiben Fehler. Ein bereits vorhandener Raw-Stand
        wird durch einen spaeteren 404 niemals durch not-yet-available ersetzt.
      noOpRule: >
        not-yet-available-Metadata enthaelt keinen per-run Timestamp. Wiederholte
        Checks ohne Zustandsaenderung bleiben semantische No-ops.

  sourceSeason:
    resolutionOrder:
      - public/data/League.json -> Season
      - public/data/Metadata.json -> LeagueYear
      - UTC calendar year as final technical fallback
    explicitSelection: >
      `python tools/nfl_source_data.py sync --season <year>` ist wiederholbar und
      nur fuer sync mit mindestens einem ausgewaehlten season-partitioned Dataset
      zulaessig.

  lifecycleClasses:
    dynamic:
      useFor: fortlaufend aktualisierte, nicht saisonweise eingefrorene Quellen
      refreshPolicy: periodic
      retentionPolicy: latest-with-git-history
      partitionKey: none
      finalization: never
      repairPolicy: normal

    immutable-history:
      useFor: historisch stabile, saisonweise kanonisierte Fakten wie Draft und Combine
      refreshPolicy: discover-new-partitions
      retentionPolicy: permanent-by-season
      partitionKey: season
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force

    seasonal-finalizable:
      useFor: laufende saisonale oder woechentliche Fakten wie Rosters, Schedules, Stats und Snap Counts
      refreshPolicy: current-season
      retentionPolicy: permanent-by-season
      partitionKey:
        - season
        - season-week
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force

    snapshot:
      useFor: zeitpunktbezogene Zustaende wie Depth Charts und Contracts
      refreshPolicy: snapshot
      retentionPolicy: permanent-snapshots
      partitionKey: snapshot-time
      finalization: append-only-snapshots
      repairPolicy: explicit-force

  rawFreezeRule: >
    Bereits persistierte season-partitioned Raw-Seasons, die vor der aktuellen
    Source-Season liegen, werden im normalen Sync als frozen-existing validiert
    und ohne Netzabruf wiederverwendet. Bewusste historische Reparaturen verwenden
    --force.

activeDatasets:
  - id: nflverse.players
    lifecycle: dynamic
    sourceMode: fixed
    materialize: true
  - id: nflverse.ff-player-ids
    lifecycle: dynamic
    sourceMode: fixed
    materialize: true
  - id: nflverse.draft-picks
    lifecycle: immutable-history
    sourceMode: fixed
    materialize: true
  - id: nflverse.combine
    lifecycle: immutable-history
    sourceMode: fixed
    materialize: true

plannedDatasets:
  - id: nflverse.rosters
    lifecycle: seasonal-finalizable
    intendedSourceMode: season-partitioned
  - id: nflverse.weekly-rosters
    lifecycle: seasonal-finalizable
    intendedSourceMode: season-partitioned
  - id: nflverse.schedules
    lifecycle: seasonal-finalizable
    intendedSourceMode: fixed-or-normalized-season-source
  - id: nflverse.game-finality
    lifecycle: seasonal-finalizable
    intendedSourceMode: fixed
  - id: nflverse.player-stats
    lifecycle: seasonal-finalizable
    intendedSourceMode: season-partitioned
  - id: nflverse.snap-counts
    lifecycle: seasonal-finalizable
    intendedSourceMode: season-partitioned
  - id: sleeper.players
    lifecycle: dynamic
    intendedSourceMode: fixed
  - id: nflverse.depth-charts
    lifecycle: snapshot
  - id: nflverse.contracts
    lifecycle: snapshot

operationalDatasetEvaluation:
  evaluatedAt: 2026-08-28
  principle: >
    nflverse und Sleeper werden feldbezogen bewertet; die Aktivierung einer
    Raw-Source aendert public/data nicht automatisch. Aktuelle Runtime-Provider
    koennen waehrend der Migration von der dauerhaften Source-Entscheidung
    abweichen.

  schedules:
    recommendedRole: primary-canonical
    primaryFor:
      - NFL-Spielplan und historische Schedule-Metadaten
      - Saison, Woche, Game Type, Datum, Teams und Scores
    historyStart: 1999
    identity:
      gameKey: nflverse game_id
      playerIdentityRequired: false
    knownGaps:
      - game_type muss explizit behandelt werden
      - Aktivierung der Source ist getrennt von der spaeteren Schedule.json-Migration

  gameFinality:
    recommendedRole: canonical-finality-evidence
    evidence: nflverse released_games.csv
    rule: >
      Ein Score allein ist niemals Final-Nachweis. Die validierte released-games-
      Evidenz darf spaeter einen kanonischen Final-State fuer dieselbe game_id
      bestaetigen; weekFinal wird erst aus allen anwendbaren finalen Spielen einer
      Woche abgeleitet. Die App-Generatoren bleiben bis zur Phase-1-Abnahme
      unveraendert auf ihrem heutigen Runtime-Pfad.
    specialCaseEvidence: >
      Das abgebrochene BUF-CIN-Spiel der Week 17/2022 ist nicht als released/final
      enthalten und darf durch diese Regel nicht faelschlich abgeschlossen werden.

  playerStats:
    recommendedRole: primary-canonical
    historyStart: 1999
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    rawFactRule: >
      Vollstaendige relevante NFL-Rohstats persistieren. Provider-Fantasy-Point-
      Werte sind keine dauerhafte kanonische Punktequelle. Return-Stats wie
      punt_return_yards, kickoff_return_yards und Return-TDs bleiben erhalten,
      damit spaetere ligaeigene Scoring-Regeln reproduzierbar berechnet werden koennen.

  rosters:
    recommendedRole: primary-canonical-for-nfl-membership
    seasonHistoryStart: 1920
    weeklyHistoryStart: 2002
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    rule: >
      Season-Rosters ersetzen keine Weekly-Historie fuer In-Season-Teamwechsel.
      Sleeper-spezifische Plattform-/Depth-Fakten bleiben getrennt.

  snapCounts:
    recommendedRole: primary-canonical
    historyStart: 2012
    identity:
      authoritativeProviderKey: PFR
      canonicalTarget: CanonicalPlayerID
      nameMatchingAuthoritative: false
    semanticGuard: >
      Fehlende historische Snap-Daten vor 2012 oder noch nicht veroeffentlichte
      aktuelle Snap-Daten duerfen nicht als 0 materialisiert werden.

  sleeperPlayers:
    recommendedRole: current-platform-and-interim-injury-source
    fields:
      - sleeper player_id and platform status
      - team/platform metadata
      - injury_status
      - injury_start_date
      - practice_participation
      - Sleeper depth-chart fields as platform facts
    injuryRule: >
      Fuer den spaeteren Current-Injury-Vertrag darf Sleeper den benoetigten
      aktuellen Status/Start-/Practice-State liefern. Tank01-spezifische Rich-
      Fields wie ReturnDate oder Description sind kein Pflichtfeld, wenn keine
      gleichwertige Source vorhanden ist. Die heutige Generator-Nutzung von
      Tank01 wird in Phase 1 noch nicht geaendert.

scoringTarget:
  rawFacts: canonical NFL player stats
  leagueRules: Sleeper league scoring_settings
  fantasyPoints: derived-deterministically-in-own-pipeline
  providerPointValues: validation-only
  rule: >
    Spaetere Scoring-Aenderungen wie Punkte fuer Kick-/Punt-Return-Yards duerfen
    keinen Wechsel der NFL-Statistikquelle erzwingen.

tank01Target:
  normalPrimaryAfterMigration: false
  intendedRole: limited-periodic-control-provider
  rule: >
    Nach erfolgreicher Source- und spaeterer Generator-Migration soll Tank01
    moeglichst nicht Primary fuer Schedule, Finality, Weekly Stats, Snaps,
    Fantasy Points oder den benoetigten Current-Injury-Status sein. Ein begrenzter
    Kontrollabgleich darf Abweichungen auditieren/melden, aber kanonische Daten
    niemals automatisch ueberschreiben.

historicalBackfill:
  bands:
    - seasons: 2012-2021
      coverage: schedules + player-stats + weekly-rosters + snap-counts
      recommendation: strongest-backfill-band
    - seasons: 2002-2011
      coverage: schedules + player-stats + weekly-rosters
      missing: snap-counts
    - seasons: 1999-2001
      coverage: schedules + player-stats + season-rosters
      missing:
        - weekly-rosters
        - snap-counts
    - seasons: before-1999
      coverage: season-rosters-only-for-this-evaluation
      recommendation: no-current-app-backfill-priority
  rule: >
    Fehlende historische Felder muessen als nicht verfuegbar modelliert werden;
    historische Tank01-Requests sind fuer durch nflverse abgedeckte Saisons kein
    Standard-Backfill-Pfad.

combine:
  providerDataset: nflverse.combine
  upstream: nflverse/nflverse-data
  provenance: NFL Combine data courtesy of Pro Football Reference
  canonicalPath: source-data/nfl/combine/<season>.json
  identity:
    masterKey: CanonicalPlayerID
    authoritativeJoin: PFR provider mapping
    nameMatchingAuthoritative: false
    cfbRefRole: provenance-only
    sourceCollisionPolicy:
      distinctSameSeasonPfrClaims: quarantine-as-ambiguous
      identicalDuplicateRows: fail-closed
      duplicateResolvedCanonicalIdentity: fail-closed
  measurements:
    - HeightInches
    - WeightPounds
    - FortyYardDashSeconds
    - BenchPressReps
    - VerticalJumpInches
    - BroadJumpInches
    - ThreeConeSeconds
    - ShuttleSeconds
  draftLink:
    authoritativeSource: source-data/nfl/draft/<season>.json
    sourceEvidenceField: SourceDraftEvidence
    rule: >
      Widersprueche zwischen Combine-Upstream und kanonischem Draft werden
      auditiert und nicht durch eine stille Gewinnerauswahl aufgeloest.

publication:
  rawFirst: true
  failClosed: true
  semanticNoOpRequired: true
  normalRepairBehavior: >
    Normale Materialisierung/Raw-Synchronisierung darf vorhandene eingefrorene
    historische Partitionen nicht ersetzen. --force ist ein bewusster Repair-Pfad.
  workflow:
    path: .github/workflows/sync-nfl-source-data.yml
    seasonInput: >
      workflow_dispatch/workflow_call akzeptieren optional eine kommagetrennte
      Season-Liste und reichen sie als wiederholtes --season an den Sync weiter.
    failureDiagnostic: >
      Der Diagnose-State zeichnet Dataset-, Season- und Force-Input auf, ohne
      Credentials oder Secrets zu persistieren.

validation:
  - Registry-v3 Source-/Lifecycle-Kombinationen werden beim Laden fail-closed validiert.
  - Current 404 -> not-yet-available ist nur unter der expliziten Policy erlaubt; historical 404 bleibt Fehler.
  - Vorhandene prior-season Raw-Partitionen werden normal ohne Netzabruf erhalten.
  - Unerwartet kleine/leere oder schema-inkompatible Inputs koennen keinen letzten guten Stand ersetzen.
  - PR-CI fuehrt die komplette test_nfl_source*.py-Suite vor den bestehenden PowerShell-/Angular-Checks aus.
  - Historische kanonische Partitionen behalten Regressionstests fuer Normal-/Force-Repair und Legacy-Feldmigration.
  - Reale Source-Materialisierung muss den zweiten semantischen No-op-Pass bestehen.
