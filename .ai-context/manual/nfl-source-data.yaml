schemaVersion: 1

domain: nfl-source-data

purpose: >
  Definiert den dauerhaften Vertrag fuer persistierte externe NFL-Quelldaten,
  ihre Lifecycle-Klassen und die providerunabhaengige kanonische Materialisierung.
  Dieser Vertrag ergaenzt den Player-Identity-Vertrag; er ersetzt weder
  public/data als App-Read-Model-Schicht noch fantasy-management/sources.

boundaries:
  providerRaw:
    path: source-data/providers/<provider>/
    owns:
      - validierte providernahe Rohdaten
      - Abrufprovenienz und Content-Hash
      - Provider-/Upstream-Feldnamen
  canonicalNfl:
    path: source-data/nfl/
    owns:
      - providerunabhaengige NFL-Fakten
      - dauerhafte NFLPlayerID-Verknuepfungen
      - saison- oder snapshotbezogene historische Fakten
  appReadModels:
    path: public/data/
    owns:
      - generierte App-Vertraege
    rule: >
      Source-Datasets duerfen nicht allein durch ihre Aufnahme in source-data
      automatisch neue Felder oder Identitaeten in public/data einfuehren.

registry:
  path: source-data/registry.json
  schemaVersion: 2
  principle: >
    Refresh-, Retention-, Partitionierungs-, Finalisierungs- und Repair-Regeln
    sind maschinenlesbarer Bestandteil des Dataset-Vertrags und werden beim Laden
    der Registry fail-closed validiert. Freie Policy-Strings ohne validierte
    Lifecycle-Semantik sind kein ausreichender Vertrag.

  lifecycleClasses:
    dynamic:
      useFor: fortlaufend aktualisierte, nicht saisonweise eingefrorene Quellen
      refreshPolicy: periodic
      retentionPolicy: latest-with-git-history
      partitionKey: none
      finalization: never
      repairPolicy: normal

    immutable-history:
      useFor: historisch stabile, saisonweise kanonisierte Fakten wie Draft und Combine
      refreshPolicy: discover-new-partitions
      retentionPolicy: permanent-by-season
      partitionKey: season
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force
      rule: >
        Die aktuelle League-Season bleibt aktualisierbar, damit ein noch wachsender
        oder upstream-korrigierter aktueller Jahrgang nicht durch einen fruehen Lauf
        versehentlich eingefroren wird. Bereits vorhandene fruehere Saisons werden
        im normalen Materialize-Pfad unveraendert beibehalten. Eine bewusste
        historische Korrektur benoetigt --force.

    seasonal-finalizable:
      useFor: laufende saisonale oder woechentliche Fakten wie Rosters, Schedules, Stats und Snap Counts
      refreshPolicy: current-season
      retentionPolicy: permanent-by-season
      partitionKey:
        - season
        - season-week
      finalization: freeze-prior-seasons
      repairPolicy: explicit-force

    snapshot:
      useFor: zeitpunktbezogene Zustaende wie Depth Charts und Contracts
      refreshPolicy: snapshot
      retentionPolicy: permanent-snapshots
      partitionKey: snapshot-time
      finalization: append-only-snapshots
      repairPolicy: explicit-force

activeDatasets:
  - id: nflverse.players
    lifecycle: dynamic
  - id: nflverse.ff-player-ids
    lifecycle: dynamic
  - id: nflverse.draft-picks
    lifecycle: immutable-history
  - id: nflverse.combine
    lifecycle: immutable-history

plannedDatasets:
  - id: nflverse.rosters
    lifecycle: seasonal-finalizable
  - id: nflverse.weekly-rosters
    lifecycle: seasonal-finalizable
  - id: nflverse.schedules
    lifecycle: seasonal-finalizable
  - id: nflverse.player-stats
    lifecycle: seasonal-finalizable
  - id: nflverse.snap-counts
    lifecycle: seasonal-finalizable
  - id: nflverse.depth-charts
    lifecycle: snapshot
  - id: nflverse.contracts
    lifecycle: snapshot

operationalDatasetEvaluation:
  evaluatedAt: 2026-08-23
  scope:
    - nflverse.schedules
    - nflverse.player-stats
    - nflverse.rosters
    - nflverse.weekly-rosters
    - nflverse.snap-counts
  principle: >
    nflverse wird nicht pauschal als Ersatz fuer Tank01 oder Sleeper behandelt.
    Feldbesitz wird nach Datenqualitaet, Historientiefe, Aktualitaet, Identitaet
    und bestehendem App-Vertrag getrennt entschieden. Die Aktivierung eines
    Source-Datasets aendert public/data nicht automatisch.

  schedules:
    recommendedRole: primary-canonical
    primaryFor:
      - NFL-Spielplan und historische Schedule-Metadaten
      - Saison, Woche, Game Type, Datum, Teams und Scores
      - langfristige saisonweise Historie
    historyStart: 1999
    freshness: every-5-minutes-during-season
    identity:
      gameKey: nflverse game_id
      playerIdentityRequired: false
    retainTank01For:
      - expliziten aktuellen gameStatus beziehungsweise Final-State im bestehenden App-Pfad, bis eine kanonische Final-State-Regel separat validiert ist
      - Legacy-Kompatibilitaet des heutigen Schedule.json waehrend der Migration
    sleeperRole: none-for-nfl-schedule
    knownGaps:
      - nflverse Schedule besitzt keinen direkten Tank01-kompatiblen gameStatus-String
      - der bestehende App-Request ist auf Regular Season begrenzt; eine kanonische Materialisierung muss game_type explizit behandeln und darf Postseason nicht still in den heutigen App-Vertrag mischen

  playerStats:
    recommendedRole: primary-canonical
    primaryFor:
      - woechentliche NFL-Player-Stats
      - historische Passing-, Rushing-, Receiving- und Kicking-Statistik
      - PPR-Fantasy-Points als kanonisch reproduzierbare Derived Stats
      - historische stat-basierte Player-Readmodels
    historyStart: 1999
    freshness: nightly-after-game-days-plus-additional-game-day-updates
    correctionWindow: >
      NFL-Korrekturen koennen bis Mittwoch einfliessen; der Donnerstag-Stand ist
      fuer abgeschlossene Wochen der bevorzugte saubere Stand.
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: NFLPlayerID
      nameMatchingAuthoritative: false
    fieldCoverageForCurrentPlayers:
      covered:
        - passing attempts
        - rushing carries
        - receiving targets
        - passing, rushing und receiving touchdowns
        - field-goal attempts
        - PAT attempts
        - fantasy_points_ppr
        - season, week, game_id, team und opponent_team
      rule: >
        Der heutige gemischte AttemptsTotal-Wert kann fachlich aus Passing Attempts,
        Targets, Carries, FG Attempts und PAT Attempts rekonstruiert werden. Vor
        einer App-Vertragsmigration muss die Adapterabbildung gegen reale Seasons
        regression-getestet werden.
    retainTank01For:
      - optionalen Low-Latency-Fallback, wenn der nflverse Stats-Lauf nach einem Spiel noch nicht verfuegbar ist
      - das heutige vollstaendige Tank01-Boxscore-Schema in Games.json, solange dieser Legacy-App-Vertrag nicht gezielt ersetzt ist
    sleeperRole: none-as-primary-nfl-stat-source
    knownGaps:
      - kein 1-zu-1-Ersatz fuer das komplette provider-spezifische Tank01-Boxscore-Objekt
      - nflverse Player Stats koennen unmittelbar nach Spielende spaeter verfuegbar sein als ein Live-API-Boxscore

  rosters:
    recommendedRole: primary-canonical-for-nfl-membership
    primaryFor:
      - NFL-Teamzugehoerigkeit und saisonale Roster-Historie
      - providerunabhaengige historische Team-/Status-Evidenz
      - GSIS-basierte Identitaetsverknuepfung
    seasonHistoryStart: 1920
    weeklyHistoryStart: 2002
    freshness: daily-0700-utc
    identity:
      authoritativeProviderKey: GSIS
      canonicalTarget: NFLPlayerID
      sleeper_idRole: provider-mapping-only
      nameMatchingAuthoritative: false
    retainSleeperFor:
      - Sleeper-spezifischen Player-Status im App-Kontext
      - SleeperDepthChartPosition
      - SleeperDepthChartOrder
      - Fantasy-Plattform- und Liga-spezifische Roster-/Availability-Fakten
    retainTank01For:
      - aktuelle Injury-Felder im bestehenden Players.json, solange keine separat validierte Ersatzquelle existiert
      - provider-spezifische Metadaten wie heutige Links/Felder, die noch nicht aus einem anderen kanonischen Dataset kommen
    knownGaps:
      - Season-Rosters sind kein Ersatz fuer die feinere Weekly-Historie bei In-Season-Teamwechseln
      - nflverse Injury-Daten sind nach der Saison 2024 derzeit nicht als aktuelle Ersatzquelle verfuegbar
      - Depth-Chart-Quellen werden in einem separaten Evaluationspunkt behandelt und nicht aus Roster-Feldern zum neuen Source of Truth erklaert

  snapCounts:
    recommendedRole: primary-canonical
    primaryFor:
      - offensive, defensive und Special-Teams-Snaps pro Spiel
      - historische Snap-Anteile und Snap-Counts
    historyStart: 2012
    freshness: four-times-daily-during-season-dependent-on-pfr
    identity:
      authoritativeProviderKey: PFR
      canonicalTarget: NFLPlayerID
      nameMatchingAuthoritative: false
      conflictPolicy: >
        Fehlende oder mehrdeutige PFR-Zuordnungen werden wie andere Provider-ID-
        Konflikte quarantinisiert; Namen duerfen keine Identitaetsluecke schliessen.
    fieldCoverageForCurrentPlayers:
      covered:
        - offense_snaps
        - offense_pct
      additionalAvailable:
        - defense_snaps
        - defense_pct
        - st_snaps
        - st_pct
    retainTank01For:
      - optionalen Low-Latency-Fallback, falls PFR/nflverse fuer ein gerade abgeschlossenes Spiel noch keine Snap Counts bereitstellt
      - Legacy-Games.json waehrend der Migration
    semanticGuard: >
      Fehlende historische Snap-Daten vor 2012 oder noch nicht veroeffentlichte
      aktuelle Snap-Daten duerfen nicht als 0 materialisiert werden. unavailable,
      not-yet-available und fetch-failed muessen von einem echten Wert 0
      unterscheidbar bleiben.
    kickerNote: >
      Der heutige App-Generator setzt Kicker-Snaps synthetisch aus FG- plus PAT-
      Attempts zusammen. Echte Special-Teams-Snaps aus nflverse duerfen diese
      Semantik nicht still veraendern; das waere eine separate App-Vertragsentscheidung.

  historicalBackfill:
    currentAppHistory: >
      public/data/past_seasons besitzt fuer Players, Games und Schedule derzeit
      materialisierte Saisons 2022 bis 2025.
    bands:
      - seasons: 2012-2021
        coverage: schedules + player-stats + weekly-rosters + snap-counts
        recommendation: strongest-backfill-band
      - seasons: 2002-2011
        coverage: schedules + player-stats + weekly-rosters
        missing: snap-counts
      - seasons: 1999-2001
        coverage: schedules + player-stats + season-rosters
        missing:
          - weekly-rosters
          - snap-counts
      - seasons: before-1999
        coverage: season-rosters-only-for-this-evaluation
        recommendation: no-current-app-backfill-priority
    rule: >
      Historische App-Dateien sollen spaeter aus kanonischen source-data-Vertraegen
      neu erzeugt werden. Fehlende Felder muessen als nicht verfuegbar modelliert
      werden; historische Tank01-Requests sind fuer durch nflverse abgedeckte
      Saisons kein Standard-Backfill-Pfad.

  tank01BudgetImpact:
    conclusion: substantial-reduction-possible-after-source-activation
    opportunities:
      - den heutigen vollen Schedule-Request je Games-Lauf perspektivisch durch persistierte nflverse-Schedules ersetzen
      - historische Stats-/Schedule-/Snap-Backfills ohne Tank01-Requestbudget durchfuehren
      - Tank01-Boxscores nach stabiler Stats- und Snap-Materialisierung auf Low-Latency-/Legacy-Fallback statt primaeren Dauerpfad reduzieren
    cannotRemoveYet:
      - Tank01 Player-List-/Metadata-Nutzung ist durch diese vier Dataset-Klassen allein nicht vollstaendig ersetzt
      - aktuelle Injury-Felder benoetigen weiterhin Tank01 oder eine separat validierte Ersatzquelle
    implementationOrder:
      - nflverse.schedules
      - nflverse.player-stats
      - nflverse.snap-counts
      - nflverse.weekly-rosters
      - nflverse.rosters

combine:
  providerDataset: nflverse.combine
  upstream: nflverse/nflverse-data
  provenance: NFL Combine data courtesy of Pro Football Reference
  canonicalPath: source-data/nfl/combine/<season>.json
  identity:
    masterKey: NFLPlayerID
    authoritativeJoin: PFR provider mapping
    nameMatchingAuthoritative: false
    cfbRefRole: provenance-only
    rule: >
      Ein Combine-Record darf nur ueber eine eindeutige PFR-Provider-Zuordnung an
      NFLPlayerID gebunden werden. Namen, Position oder Schule duerfen keine
      fehlende oder widerspruechliche Identitaetszuordnung heuristisch ersetzen.
    sourceCollisionPolicy:
      distinctSameSeasonPfrClaims: quarantine-as-ambiguous
      identicalDuplicateRows: fail-closed
      duplicateResolvedCanonicalIdentity: fail-closed
      rule: >
        Wenn mehrere unterscheidbare Raw-Records derselben Combine-Saison dieselbe
        PFR-ID beanspruchen, bleibt die PFR-ID als Provider-Provenienz an allen
        betroffenen Records erhalten, nimmt fuer diese Records aber nicht an der
        kanonischen NFLPlayerID-Aufloesung teil. Der Konflikt wird explizit als
        ambiguous auditiert; Name, Position, Schule, CFBRef oder Draft-Evidenz
        duerfen keinen Gewinner bestimmen. Exakt doppelte Raw-Zeilen sowie zwei
        eindeutig aufgeloeste Records derselben Saison mit derselben NFLPlayerID
        bleiben harte Invariant-Verletzungen.
  measurements:
    - HeightInches
    - WeightPounds
    - FortyYardDashSeconds
    - BenchPressReps
    - VerticalJumpInches
    - BroadJumpInches
    - ThreeConeSeconds
    - ShuttleSeconds
  draftLink:
    authoritativeSource: source-data/nfl/draft/<season>.json
    sourceEvidenceField: SourceDraftEvidence
    rule: >
      Draftjahr, Runde und Overall Pick aus dem Combine-Upstream bleiben als
      Provenienz erhalten. Die normalisierte Draft-Verknuepfung stammt aus dem
      kanonischen Draft-Dataset. Widersprueche werden auditiert und nicht durch
      eine stille Gewinnerauswahl aufgeloest.

publication:
  rawFirst: true
  failClosed: true
  semanticNoOpRequired: true
  normalRepairBehavior: >
    Normale Materialisierung darf vorhandene eingefrorene historische Partitionen
    nicht ersetzen. Der explizite CLI-Repair-Pfad ist
    `python tools/nfl_source_data.py materialize --force` oder ein vollstaendiger
    `sync --force`, wenn bewusst Raw- und Canonical-Reparatur gemeinsam gewuenscht sind.
  workflowNote: >
    Der bestehende produktive Raw-first-Workflow wird durch diesen Architektur-Slice
    nicht umgebaut. Seine normalen Materialize-Schritte bleiben nicht-forciert.

validation:
  - Registry-Schema und Lifecycle-Kombinationen werden beim Laden fail-closed validiert.
  - Historische Partitionen erhalten Regressionstests fuer Normal- und Force-Repair.
  - Combine-Identitaet wird gegen fehlende PFR-Zuordnung und Namensgleichheit getestet.
  - Unterschiedliche Same-Season-Records mit derselben PFR-ID werden als ambige Source-Claims quarantiniert und auditiert; exakt doppelte Raw-Zeilen brechen fail-closed ab.
  - Doppelte eindeutig aufgeloeste NFLPlayerID-Zuordnungen innerhalb einer Combine-Saison brechen fail-closed ab.
  - Combine-vs.-Draft-Widersprueche werden im Audit sichtbar.
  - Reale Source-Materialisierung muss den bestehenden zweiten semantischen No-op-Pass bestehen.
