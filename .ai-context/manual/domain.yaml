schemaVersion: 1

domain:
  name: Fantasy Football League App
  summary: >
    App for displaying a custom fantasy football league with generated league,
    team, player, standings, salary, transaction and draft-related data.

coreConcepts:
  League:
    description: >
      The configured fantasy football league represented by generated app data.

  Team:
    description: >
      A fantasy team in the league. Teams are identified by generated TeamID and
      can be mapped from league metadata and generated league data.
    draftPickRelation: >
      Team DraftPicks are stored as PickKey references in generated League.json
      and resolved to DraftPick objects by Angular DataService. Only current,
      upcoming or live draft picks from public/data/Drafts.json should be exposed
      this way; completed historical draft picks must not be added as current
      team assets.

  Player:
    description: >
      A football player enriched from source data and exposed to Angular through
      generated JSON.

  SalaryCap:
    description: >
      League-specific cap concept based on the top salary-relevant players.
      SalaryRelevantTeamSize defines how many players count toward cap logic.

  FreeAgentMarket:
    description: >
      Frontend-facing market model that marks players as rostered, free agents,
      projected cap cuts or possible cap cuts.

  Transaction:
    description: >
      Completed league move from Sleeper and/or manual input. Transactions can
      affect players and draft-pick ownership.
    importantFields:
      - Source
      - TransactionID
      - Type
      - Status
      - Season
      - Week
      - CreatedAt
      - CreatedDate
      - RosterIDs
      - Adds
      - Drops
      - DraftPicks
      - Notes

  Draft:
    description: >
      A league draft event. Current draft output may represent upcoming or live
      drafts, while completed draft history is stored separately by season.
    importantFields:
      - DraftKey
      - DisplayDraftKey
      - DisplayAbrDraftKey
      - Season
      - DraftType
      - DisplayDraftType
      - DraftNo
      - DraftSource
      - SleeperDraftID
      - SleeperStatus
      - Status
      - DisplayStatus
      - PickSource
      - OrderSource
      - OrderMode
      - Settings
      - Picks

  DraftPick:
    description: >
      A pick belongs to a season, draft type, round and owner. It tracks both
      original owner and current owner because transactions can transfer ownership.
      Completed pick results may also contain the selected player and Sleeper pick
      metadata.
    importantFields:
      - PickKey
      - DraftKey
      - Season
      - DraftType
      - Round
      - PositionInRound
      - OverallPick
      - DisplayPick
      - OriginalOwnerRosterID
      - CurrentOwnerRosterID
      - WasTraded
      - IsCurrentlyTraded
      - TradeSource
      - TradeHistory
      - PlayerID
      - PlayerName
      - SleeperPickNo
      - SleeperPickedBy
      - Status

  LeagueActivity:
    description: >
      Frontend feature area for current/upcoming/live draft assets and later
      trades and roster moves. Its stable route is /league-activity and its
      current MVP component is src/app/league-activity/league-activity.ts.
    currentMvpScope:
      - display current/upcoming/live drafts from public/data/Drafts.json
      - group picks by draft and round
      - show current owner as the primary owner label
      - show original owner as "from <team>" when a pick is currently traded
      - reserve a Moves area as placeholder until Transactions.json is modeled in Angular
    doesNotOwn:
      - draft order derivation
      - draft-pick ownership derivation
      - transaction source-of-truth logic
      - generated JSON contracts

transactions:
  sourceOfTruth:
    currentOutput: public/data/Transactions.json
    manualInput: public/data/Transactions_Manual.json
    generator: public/requests/utils/league/TransactionUtils.psm1
    externalSource: Sleeper transactions endpoint

  statusRules:
    currentGeneratedData: completed transactions
    pendingTransactions: >
      Pending transactions are not generated right now because the Sleeper
      league transactions endpoint appears to return completed transactions only
      in the current workflow.

  frontendStatus:
    currentState: >
      Transactions.json exists as generated output but is not yet modeled or
      loaded by Angular DataService. LeagueActivityComponent therefore keeps the
      Moves section as a placeholder instead of rendering transaction data.
    target: >
      When Moves are implemented, add explicit transaction interfaces and a
      frontend mapping/loading path before rendering trades, waiver moves, adds or
      drops in the League Activity timeline.

  manualEnrichment:
    description: >
      Manual transactions can enrich matching Sleeper transactions through
      SleeperTransactionID or create manual-only transaction output.
    manualOnlyStatus: complete

  currentSeasonUpdate:
    normalMode:
      - Load existing Transactions.json.
      - Fetch missing weeks.
      - Fetch current week.
      - Fetch previous week.
      - Replace only fetched weeks in the local data.
      - Save only when the compare script detects semantic changes.
    forceMode:
      - Fetch all available weeks for the current season.
      - Rebuild current-season output from remote/manual source data.
      - Still allow compare-and-skip behavior when output is unchanged.

  sorting:
    canonicalOrder: newest-first
    keys:
      - Season
      - Week
      - CreatedAt
      - TransactionID

drafts:
  sourceOfTruth:
    config: public/data/Metadata.json
    currentOutput: public/data/Drafts.json
    historicalOutput: public/data/past_seasons/Drafts/Drafts_<season>.json
    generator: public/requests/utils/league/DraftUtils.psm1
    historyGenerator: public/requests/utils/league/DraftHistoryUtils.psm1
    teamPickMapper: public/requests/utils/league/TeamDraftPickUtils.psm1

  currentState:
    metadataContains:
      - UpcomingDraftCount
      - UpcomingDraftCountMode
      - DraftType
      - DraftNo
      - Rounds
      - OrderSource
      - OrderMap
      - Order

  draftTypes:
    canonical:
      - Rookie
      - Free_Agent
      - Veteran
    notes: >
      Historical Sleeper drafts are classified from Sleeper settings and metadata
      first. Metadata.json is mainly a planning/configuration guide for future
      drafts and a current-season guideline, not a validator for old completed
      draft settings.

  configuredDraftTypes:
    - draftType: Rookie
      draftNo: 1
      rounds: 5
      currentSeasonOrderSource: PreviousPlayoffs
      notes: >
        Uses configured OrderMap based on previous playoff placement when no
        authoritative Sleeper draft order is available.
    - draftType: Free_Agent
      draftNo: 2
      rounds: 5
      currentSeasonOrderSource: AllTime
      notes: >
        Uses AllTime standings with configured direction. Historical Free_Agent
        classification is based on Sleeper player-pool settings or explicit text,
        not simply on snake/linear draft format.

  keyRules:
    currentDraftKey: "<season>_<draftType>"
    historicalDraftKey: "<season>_D<chronologicalDraftNo>_<draftType>"
    pickKey: "<draftKey>_R<round>_OO<originalOwnerRosterID>"
    notes: >
      Current/upcoming/live drafts keep the compact configured key because those
      keys are used as team DraftPick references in League.json. Historical drafts
      include chronological DraftNo in DraftKey so multiple drafts of the same type
      in one season remain unique. PickKey uses DraftKey as prefix and therefore
      stays unique automatically for repeated draft types. The technical D-number
      must not leak into user-facing display fields.

  orderModes:
    Exact:
      usedFor: current-season upcoming/live drafts and completed historical drafts
      description: >
        Exact position and overall pick can be generated from Sleeper draft order
        or configured standings-based order.
    RoundOnly:
      usedFor: future-season drafts
      description: >
        Exact order is unknown. Round-level representation is sufficient.

  ownership:
    originalOwner:
      field: OriginalOwnerRosterID
      description: The team that originally owned the pick.
      invariant: Should not change after pick generation.
    currentOwner:
      field: CurrentOwnerRosterID
      description: The team currently owning the pick after transactions.
      invariant: May change when transaction draft-pick movements are applied.
    history:
      field: TradeHistory
      description: Optional but valuable ownership change history.

  currentDraftOutput:
    path: public/data/Drafts.json
    description: >
      Contains current, upcoming and live draft read models used by the app and
      by League.json team DraftPick references.
    updateMode:
      restricted: RequestLeague.ps1 frequent update
      full: RequestDrafts.ps1 weekly/manual update
    teamIntegration: true

  historicalDraftOutput:
    path: public/data/past_seasons/Drafts/Drafts_<season>.json
    description: >
      Contains all completed Sleeper draft history by season. Historical drafts
      are stored separately from public/data/Drafts.json, but are refreshed by the
      existing weekly/manual RequestDrafts.ps1 full draft update. Historical round
      counts and draft settings come from Sleeper; Metadata must not invalidate
      old completed drafts when league rules change later.
    updateMode: weekly/manual RequestDrafts.ps1 flow
    teamIntegration: false
    numbering: >
      Historical DraftNo is assigned from the chronological completed Sleeper draft
      order within the season. It must not come from the current Metadata DraftNo
      of the resolved draft type. Historical DraftKey uses this DraftNo to remain
      unique when the same DraftType appears multiple times in a season.
    classificationRules:
      - Sleeper settings/player-pool restrictions are the primary classification source.
      - Rookie-only settings map to Rookie only when the related setting value is active.
      - Veteran-only settings map to Veteran only when the related setting value is active.
      - All/unrestricted/no player-pool restriction settings map to Free_Agent.
      - Explicit Sleeper text/metadata can also map to Rookie, Veteran or Free_Agent.
      - Snake or linear draft format alone is not a draft-type signal.
      - Very high historical round counts can be used as a fallback signal for Free_Agent when no stronger type signal exists.
      - Metadata order is only a fallback when Sleeper settings and text have no stronger signal.
    classificationAssumptions: >
      Draft type detection is intentionally heuristic because Sleeper does not expose
      a project-owned DraftType field. The current mapping assumes that available
      Sleeper settings, metadata text, player-pool restriction values and unusually
      high historical round counts are stable enough to infer Rookie, Free_Agent or
      Veteran. If Sleeper changes those fields or if a historical draft is
      misclassified, this classification logic should be reviewed before changing
      generated data contracts.
    resultEnrichment: >
      Completed pick results are loaded through Get-SleeperDraftPicks and applied
      by Get-AppliedDraftPickResults. PickKey must remain stable.

  transactionIntegration:
    description: >
      Draft-pick ownership is updated by completed transaction DraftPicks.
      Transactions must be updated before current draft generation in
      RequestLeague.ps1. Historical draft generation can also read current and
      archived transaction output to reconstruct historical ownership.

  teamIntegration:
    description: >
      Generated teams store DraftPicks as sorted PickKey references owned by
      CurrentOwnerRosterID. Angular resolves those keys into DraftPick objects.
      Only public/data/Drafts.json participates in this integration.

  displayRules:
    exactPickDisplay: "{round}.{positionInRound:00}"
    roundOnlyDisplay: "Round {round}"
    draftDisplayKey: >
      User-facing draft display keys show season and draft type only, for example
      "2024 Free Agent". Historical displays append "#2", "#3", etc. only when
      the same DraftType occurs multiple times in the same season.
    draftDisplayAbrKey: >
      Abbreviated draft display keys use the full season year, for example
      "2024 FA" instead of "24 FA". Historical abbreviated displays follow the
      same duplicate suffix rule as full display keys.
    draftDisplayStatus: >
      Status is the technical generated status used by data logic. DisplayStatus
      is the user-facing label generated from Status: PreDraft maps to Upcoming,
      Drafting maps to Live, Complete maps to Completed, and Virtual maps to
      Projected.
    tradedPickOwnerDisplay: >
      Frontend draft-pick displays should show the current owner as the primary
      owner and, when IsCurrentlyTraded is true or current/original owners differ,
      show the original owner as secondary "from <team>" context.

  overviewRoundChips:
    currentLocation: src/app/overview/overview.ts
    description: >
      Overview displays current-season draft picks grouped by team and draft.
      Each chip stores display text, round and background color.
    colorRule:
      scope: all current-season draft picks visible in Overview
      invariant: Same round must have the same color across different drafts.
      scale: warm-to-cold HSL
      hsl:
        startHue: 35
        endHue: 205
        saturation: "55%"
        lightness: "84%"
    futureTarget: >
      Move round chip color calculation into a shared frontend utility, pipe or
      service when draft picks are shown in multiple components.

  leagueActivityDraftCards:
    currentLocation: src/app/league-activity/league-activity.ts
    route: /league-activity
    description: >
      League Activity displays current/upcoming/live drafts as draft cards with
      summary metrics, round expansion panels and pick rows. It uses DataService
      draft/team data and must not derive draft order or ownership itself beyond
      frontend view-model formatting.
    colorRule:
      scope: all draft picks visible in League Activity
      invariant: Same round should have the same color within the view.
      scale: warm-to-cold HSL matching the current Overview rule
    movesPlaceholder: >
      Moves are intentionally not rendered yet because Transactions.json is not
      loaded by DataService. Do not fake transaction data in Angular; model
      Transactions.json explicitly first.

notesForAIAgents:
  - Do not collapse OriginalOwnerRosterID and CurrentOwnerRosterID into one field.
  - Do not infer draft-pick ownership by parsing DisplayPick.
  - Do not calculate round chip colors relative to one draft if multiple drafts are visible together.
  - Do not add TransactionsPending.json unless a reliable pending transaction source exists.
  - When changing draft-pick ownership logic, review transaction logic and this document together.
  - Do not merge completed draft history into public/data/Drafts.json.
  - Do not use completed historical draft picks to enrich League.json team DraftPicks.
  - Do not validate old completed draft settings against current Metadata rounds.
  - Do not derive historical DraftNo from the current Metadata DraftNo of the resolved draft type.
  - Do not classify historical draft type from snake/linear draft format alone.
  - Treat historical draft type detection as heuristic unless Sleeper provides an explicit stable draft-type field.
  - Keep historical DraftKey duplicate-safe when multiple drafts of the same DraftType exist in one season.
  - Do not expose the technical historical D-number in DisplayDraftKey or DisplayAbrDraftKey.
  - Use the full four-digit season in DisplayAbrDraftKey.
  - Keep Status and DisplayStatus separate; Status is technical and DisplayStatus is user-facing.
  - Keep LeagueActivityComponent focused on frontend view models and display; move reusable draft-pick display behavior into shared frontend code when reused further.
