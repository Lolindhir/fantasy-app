schemaVersion: 1

domain:
  name: Fantasy Football League App
  summary: >
    App for displaying a custom fantasy football league with generated league,
    team, player, standings, salary, transaction and draft-related data.

coreConcepts:
  League:
    description: >
      The configured fantasy football league represented by generated app data.
    importantFields:
      - LeagueID
      - Season
      - SeasonType
      - Status
      - Phase
      - CurrentWeek
      - FinalScoredWeek
      - LastLeagueWeek
      - PlayoffStartWeek
      - TradeDeadlineWeek
      - TradeReviewDays
      - CutsAllowed
      - WaiversOpen
      - TradesOpen
      - CapDeadline
      - Teams
    statusRules: >
      League Status is generated by the PowerShell league pipeline as a UI-safe
      top-level lifecycle label. Status values currently include Off-Season,
      Draft-Season, Pre-Season, In-Season, Playoffs and Completed.
    phaseRules: >
      League Phase is an optional UI-safe sub-status. It is an empty string for
      statuses without a meaningful sub-phase. Current planned values include
      Off-Season phases Cap Deadline Open, Cap Check and Post Cap Check, plus
      Draft-Season phases Pre Draft, In Draft and Between Drafts. Between Drafts
      applies after at least one current-season draft is complete while another
      current-season draft is still open but not scheduled. Phase must not be
      treated as a source of truth for unrelated move permissions such as
      CutsAllowed.
    tradeOpennessRules: >
      TradesOpen represents whether trades are freely open from a league-process
      perspective, not merely whether Sleeper allows users to submit trade offers.
      A positive Sleeper trade_review_days value means trades are under
      commissioner review and therefore not freely open. TradeReviewDays exposes
      that Sleeper setting in the generated League.json contract.
    waiverRules:
      availabilityMeaning: >
        WaiversOpen answers whether managers may currently submit waiver claims.
        It does not mean that Sleeper is actively processing waivers at that
        moment. A submitted claim may remain pending until the next configured
        waiver processing run.
      nextRunTarget: >
        The planned public League read model extension tracked in Issue #328 is one
        app-ready absolute next waiver-processing timestamp derived in the
        generation layer from the league's Sleeper settings. Angular must render
        that result and must not decode raw Sleeper waiver schedule fields or
        hard-code the league's current weekdays, local clock time or a fixed
        timezone offset.
      publicUiBoundary: >
        Waiver order type and Team.WaiverPosition are not part of the public UI
        target for Issue #328. Waiver priority is strategically sensitive and may
        remain available to private Fantasy Management consumers without being
        surfaced to every app user.
      movesBoundary: >
        Pending waiver claims do not belong in Moves. Moves remains completed
        chronological transaction history.
      playerMarketBoundary: >
        The existing FreeAgentMarket terminology and player UI remain unchanged
        for this scope. If the league later enables classic Free Agency or mixed
        acquisition modes, acquisition-state presentation should be generalized
        from the league-wide configuration in a separate intentional change rather
        than speculatively modeling waiver candidates now.

  Team:
    description: >
      A fantasy team in the league. Teams are identified by generated TeamID and
      can be mapped from league metadata and generated league data.
    draftPickRelation: >
      Team DraftPicks are stored as PickKey references in generated League.json
      and resolved to DraftPick objects by Angular DataService. Drafts.json is the
      source for those references and includes every draft from the current league
      season, including completed drafts, plus configured open future drafts.
      Current-season picked picks intentionally remain attached to their team so
      Draft Capital can evaluate the complete season. Pick availability is derived
      separately from DraftPick status and selected-player fields. Completed drafts
      from seasons older than League.Season remain historical only and must not be
      added as current team data.

  Player:
    description: >
      A football player enriched from source data and exposed to Angular through
      generated JSON.

  SalaryCap:
    description: >
      League-specific cap concept based on the top salary-relevant players.
      SalaryRelevantTeamSize defines how many players count toward cap logic.

  FreeAgentMarket:
    description: >
      Frontend-facing market model that marks players as rostered, free agents,
      projected cap cuts or possible cap cuts.

  Transaction:
    description: >
      Completed league move from Sleeper and/or manual input. Transactions can
      affect players and draft-pick ownership. Angular maps the generated raw
      transaction into participant-specific acquired and sent assets while retaining
      OriginalOwnerRosterID as the stable identity of every traded draft pick.
    importantFields:
      - Source
      - TransactionID
      - Type
      - Status
      - Season
      - Week
      - CreatedAt
      - CreatedDate
      - RosterIDs
      - Adds
      - Drops
      - DraftPicks
      - Notes

  Draft:
    description: >
      A league draft event. Drafts.json contains every draft from the current
      LeagueYear regardless of status and, for each configured draft type, the
      configured number of non-completed drafts. A completed current-season draft
      therefore remains in the current read model without counting toward the open
      future-draft limit. Completed draft history is additionally stored separately
      by season for past-season views.
    importantFields:
      - DraftKey
      - DisplayDraftKey
      - DisplayAbrDraftKey
      - Season
      - DraftType
      - DisplayDraftType
      - DraftNo
      - DraftSource
      - SleeperDraftID
      - SleeperStatus
      - SleeperStartTime
      - DraftStartTimeUtc
      - Status
      - DisplayStatus
      - PickSource
      - OrderSource
      - OrderMode
      - Settings
      - Picks
    startTimeRules: >
      SleeperStartTime is the raw Sleeper draft start_time timestamp in
      milliseconds when present. DraftStartTimeUtc is the generated UTC ISO value
      derived from it. Only a non-completed current-season draft with a start time
      can move the League Phase to Draft-Season / Pre Draft. Once one current-season
      draft is complete, another open draft without a start time keeps the league in
      Draft-Season / Between Drafts rather than returning it to Off-Season.

  DraftPick:
    description: >
      A pick belongs to a season, draft type, round and owner. It tracks both
      original owner and current owner because transactions can transfer ownership.
      Completed pick results may also contain the selected player and Sleeper pick
      metadata.
    importantFields:
      - PickKey
      - DraftKey
      - Season
      - DraftType
      - Round
      - PositionInRound
      - OverallPick
      - DisplayPick
      - OriginalOwnerRosterID
      - CurrentOwnerRosterID
      - WasTraded
      - IsCurrentlyTraded
      - TradeSource
      - TradeHistory
      - PlayerID
      - PlayerName
      - SleeperPickNo
      - SleeperPickedBy
      - Status

  DraftsFeature:
    description: >
      Frontend feature area for all current-season drafts, open future draft assets
      and completed historical draft views. Its primary route is /drafts and its
      routed page aggregator is src/app/features/drafts/drafts-page.ts.
    currentScope:
      - display every current-season draft from public/data/Drafts.json regardless of whether it is upcoming, live or completed
      - display only seasons greater than League.Season as future drafts from public/data/Drafts.json without treating unresolved future order as concrete pick order
      - display completed past drafts from public/data/past_seasons/Drafts/Drafts_<season>.json discovered through public/data/PastSeasonsIndex.json
      - exclude League.Season and later seasons from the Past season selector even when an archive copy already exists
      - split current-season, future and past drafts into dedicated top-level tabs
      - let the Past tab choose available seasons from PastSeasonsIndex.json via dropdown and load the selected season's historical Drafts resource
      - map draft presentation data through DraftsViewModelService and the central Drafts view-model mapper
      - show draft-card metrics for current, past and future drafts through DraftShellComponent as Rounds, Settings.Type such as Linear/Snake, and Traded Picks
      - show current-season and past drafts with draft-specific view modes: Overview, Teams and List
      - show Overview as the default current/past draft view using a compact draft-board grid where rows are rounds and columns are pick positions in the round
      - render Overview pick tiles through DraftPickCardComponent as square, mobile-compact cells with DisplayPick, current-owner logo for open picks, selected-player image for picked picks and current-owner logo as tile context; player position is shown in the pick popover, not directly on the tile
      - show current-season and past Teams view from currentOwnerPickGroups in the central DraftViewModel as current-owner pick groups with concrete pick chips such as 2.03
      - show current-season and past List view from orderedPicks in the central DraftViewModel as ordered pick rows with compact mobile layout and more detailed desktop layout
      - render compact current/past pick chips and future round pills through DraftPickTriggerComponent variants while keeping the larger Overview card in DraftPickCardComponent
      - make current-season and past picks clickable in every current/past view, including open picks, to expose pick, owner, original owner and trade context through DraftPickPopoverComponent
      - use PlayerName as a fallback display value for completed historical picks when PlayerID cannot be resolved against current Players.json
      - show future drafts as compact team-owned round summaries inside DraftShellComponent with clickable shared pick triggers and pick popovers in a future-compatible mode
      - keep completed current-season picks in Overview Draft Capital so Best Pick can represent the full season while Best Open Pick filters by pick availability
      - use src/app/shared/utils/draft-ui.util.ts for shared draft round colors and draft status display classes
      - use src/app/shared/utils/draft-capital.util.ts for shared frontend draft-pick order, Pick Strength sorting, RoundCounts and BestPick helpers across Drafts and Overview Draft Capital
      - treat Pick Strength as frontend display/ranking logic until generator-provided Draft Capital values exist
      - show current owner as the primary owner label in pick popovers
      - show original owner as "from <team>" only when current owner differs from original owner
      - allow the Traded Pick badge to indicate trade-history context independently from whether the pick is currently owned by the original owner
    doesNotOwn:
      - draft order derivation
      - draft-pick ownership derivation
      - draft capital value source-of-truth
      - transaction source-of-truth logic
      - generated JSON contracts

  MovesFeature:
    description: >
      Frontend feature area for chronological current-season league activity such as
      trades, adds, drops and roster movement. Its primary route is /moves. The
      technical component remains src/app/features/league-activity/league-activity.ts
      for compatibility.
    currentScope:
      - load public/data/Transactions.json through DataApiService together with the common league/player resolution bundle
      - expose mapped Transaction objects through DataService instead of raw generated transaction JSON
      - resolve participant teams and player assets while preserving unresolved assets through ID fallbacks
      - assign players and draft picks per participant as acquired or sent from the generated owner fields
      - group completed transactions chronologically by CreatedDate
      - show current-season summary counts, transaction metadata, participant teams and asset chips
      - identify traded picks by season, draft type, round and original owner so equal-round pick swaps remain distinguishable
      - keep /league-activity as compatibility redirect to /moves
      - keep /trade separate until the Trade Simulator is intentionally integrated into Moves
    doesNotOwn:
      - draft presentation
      - transaction source-of-truth logic
      - generated JSON contracts
      - pending transaction derivation

transactions:
  sourceOfTruth:
    currentOutput: public/data/Transactions.json
    manualInput: public/data/Transactions_Manual.json
    generator: public/requests/utils/league/TransactionUtils.psm1
    externalSource: Sleeper transactions endpoint

  statusRules:
    currentGeneratedData: completed transactions
    pendingTransactions: >
      Pending transactions are not generated right now because the Sleeper
      league transactions endpoint appears to return completed transactions only
      in the current workflow.

  frontendStatus:
    currentState: >
      Transactions.json is modeled through RawTransaction and resolved Transaction
      interfaces. DataApiService loads the current transaction output, DataService
      maps the shared league/player bundle and transaction.mapper.ts resolves teams,
      players and participant-specific asset direction before /moves renders the
      chronological timeline.
    draftPickIdentity: >
      A transaction pick is not uniquely identified by season, draft type and round.
      Multiple picks of the same round can be exchanged in opposite directions in one
      trade. OriginalOwnerRosterID is therefore retained in the mapped model, visible
      in Moves pick labels and included in Angular track keys.

  manualEnrichment:
    description: >
      Manual transactions can enrich matching Sleeper transactions through
      SleeperTransactionID or create manual-only transaction output.
    manualOnlyStatus: complete

  currentSeasonUpdate:
    normalMode:
      - Load existing Transactions.json.
      - Fetch missing weeks.
      - Fetch current week.
      - Fetch previous week.
      - Replace only fetched weeks in the local data.
      - Save only when the compare script detects semantic changes.
    forceMode:
      - Rebuild all available weeks for the current season.
      - Fetch manual transaction enrichment.
      - Apply manual enrichment by SleeperTransactionID where possible.
      - Include manual-only completed transactions.
