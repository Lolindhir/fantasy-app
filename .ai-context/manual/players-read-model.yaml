schemaVersion: 1
domain: players-read-model
status: accepted-contract-v1
trackingIssue: 1226
architectureDecision: ADR-076
implementationState: >-
  Issue #1226 step 5: the function tools/derived_data_lib/players_read_model.py, the CLI tools/players_read_model.py and the
  consumer generator tools/players_app_publish.py (compare = shadow, write = productive) exist. Since the cutover
  update-players.yml runs players_app_publish.py write (materializes the player-valuation product, then writes the file on
  a content change with backup and the Players timestamp); the PV hold seed is no longer passed. RequestPlayers.ps1 and the
  utils/player modules are no longer called and are removed in the cleanup (step 6).

purpose: >-
  Define public/data/Players.json as a pure consumer delivery. One pure function resolves the complete player rows for
  one league, one season and one reference date from canonical facts, the player-valuation product and data-meta; a
  consumer generator writes the file. It replaces public/requests/RequestPlayers.ps1 and the utils/player modules.
  The result is computed, never persisted (pattern of week-finality.yaml, league-lifecycle.yaml, decision-windows.yaml
  and matchup-context.yaml). Data-platform rule 4 (2026-10-29): facts and calculations come only from data-source,
  products or data-meta; Players.json is a consumer output and never an input.

architecture:
  decisionBasis: [ADR-004, ADR-037, ADR-041, ADR-043, ADR-044, ADR-054, ADR-055, ADR-071, ADR-076]
  layers: source -> derived -> consumer
  persistence: >-
    none for the function. The only persisted result of the chain stays the existing product data-derived/player-valuation
    and the consumer file public/data/Players.json. No new product, writer, write prefix or permission.
  owner:
    function: tools/derived_data_lib/players_read_model.py
    cli: tools/players_read_model.py
    cliCommand: python3 tools/players_read_model.py resolve --league <CanonicalLeagueID> --season <Season> --as-of <AsOfDate>
    consumerGenerator: tools/players_app_publish.py (write, compare)
    tests: tools/tests/test_players_read_model.py
  rules:
    - The function copies; it does not derive league values. Salary, SalaryProjected, Ranking, Grading, season values, PointHistory, GamesPotential and the Form basis come from the player-valuation snapshot.
    - Source -> derived -> consumer holds for gradings too. Rank grading stays grading-v1. A real Form grading (evaluation instead of game selection) becomes grading-v2 on the same product data so App and Fantasy Management read the same result; it is not part of this work.
    - The consumer keeps the field names of the Players.json contract, the file rounding and the JSON write depth (Get-PlayersPublishedJsonDepth, 7). The contract of Players.json is unchanged.
    - Platform fields, profile fields and injury come from tools/players_population.py (ADR-043); GameHistory from tools/players_game_history.py (ADR-044); Bye weeks from the canonical NFL schedule; depth chart fields from the canonical Sleeper snapshot.
    - No input from public/data, in particular not the previously published Players.json.
    - No wall clock inside the function or the model. Time enters only through AsOfDate.

function:
  signature: resolve(repo_root, CanonicalLeagueID, Season, AsOfDate) -> {Players, Warnings}
  asOfDate: >-
    Calendar date supplied by the caller. The consumer generator uses the run date in the league time zone
    (data-meta LeagueTimeZone). The function and the CLI echo it back. Age = round((AsOfDate - BirthDate) in days / 365.2425, 1);
    an unparsable or missing BirthDate gives null. Same inputs and same AsOfDate give the same rows; the only change
    without an input change is Age when AsOfDate moves (P1).
  formGradingShape: >-
    Grading carries a Form row and the Rank row. The Form value keeps its published shape until grading-v2: null without
    scored games, the bare game object for exactly one game, a list for two to four (a serialization quirk of the PowerShell
    pipeline that the unchanged contract preserves). The games are selected from GameHistory by the GameIDs of the product
    FormGames; the function does not choose them.
  determinism: Rows are ordered as today (by the existing sort of RequestPlayers.ps1); the result is a pure function of its inputs.
  failClosed:
    - missing or incomplete Sleeper snapshot, unknown team abbreviation or empty population (players_population errors pass through)
    - no usable player-valuation snapshot for the season, or a snapshot older than the StatsFinalWeek of week_finality
    - missing WeekStructure or game finality (week bounds fail closed as in ADR-041)
    - an empty Players.json is never written

inputs:
  population: tools/players_population.py (canonical Sleeper snapshot, NFL rosters, NFL draft, league rosters, identities)
  valuation: data-derived/player-valuation/<CanonicalLeagueID>/<season>/week-<NN>.json, snapshot of StatsFinalWeek (Salary, SalaryProjected, Ranking, Grading, Inputs, season values, PointHistory, Form basis, Hold)
  weekBounds: tools/derived_data_lib/week_finality.py (StatsFinalWeek, LeagueScoredWeek) and the league WeekStructure
  gameHistory: tools/players_game_history.py (inside the players_league_scoring.py export, ADR-044)
  schedule: data-source/nfl/schedules/<season>.json (Bye weeks)
  depthChart: data-source/nfl/platform/sleeper/players.json
  leagueMetadata: data-meta/<CanonicalLeagueID>/metadata.json (LeagueTimeZone, model choice)

holdRule:
  decision: Robert 2026-10-30 (Q3)
  identityHold: >-
    A player in the population without a unique CanonicalPlayerID (identity hold, league-owned players only) takes its
    values from the player-valuation snapshot hold row. The previously published Players.json is never read.
  gameHistory: GameHistory of a hold player is an empty list and the run raises a warning.
  gap: A hold player that no snapshot knows is reported as a gap with a warning; no old value is carried over.
  seed: The PV hold seed (--hold-seed-players-file) is dropped with the cutover. Today 0 hold players exist (PV 2026 week 7, 956 rows).

productOwnedValues:
  decision: Robert 2026-10-30 (Q4, sharpened)
  moveIntoProduct: >-
    Season values (Total, GamesPlayed, PotentialGames, GamesPotential, snaps, attempts, touchdowns), PointHistory and the
    Form basis (the last four scored games) are added to the player-valuation product (same materializer, same write path,
    additive ContractVersion bump; details in player-valuation.yaml with step 3a). AvgGame and AvgPotentialGame are already there.
  oneImplementation: The season arithmetic exists once, in Python; the PowerShell copy in PlayerLeagueScoringUtils.psm1 is removed with the cutover.

pointPaths:
  decision: Robert 2026-10-30 (Q5)
  players: >-
    players_league_scoring.py scores canonical player-stats and snap-counts with the ScoringSettings of the CURRENT league
    season for every history season (ADR-041, intended so that salaries of different seasons are comparable). Used by Players,
    PointHistory and the player-valuation Inputs. History reaches before league start (needs 2023 for a league that began in 2024).
  playerWeekFantasy: >-
    PlayerWeekFantasy scores every season with the ScoringSettings of THAT season (settings hash in the identity). It exists
    only for league seasons.
  relation: >-
    Both use historical_fantasy_scoring.score_record and the week-final rule of ADR-071. For the current season the weekly
    points are equal (2,953 of 2,953 player-weeks, weeks 1 to 7 of 2026). Merging the paths would change the meaning of
    PointHistory and lose the season before league start; therefore both stay.
  guard: >-
    A Fast test on persisted state requires equal current-season weekly points from both paths (step 6). It reads
    persisted repository data and fails with the differing player-weeks; it does not weaken either path.

consumerGenerator:
  write: >-
    tools/players_app_publish.py write calls the function with AsOfDate = run date in LeagueTimeZone and writes
    public/data/Players.json only on a semantic difference (published-form comparison at write depth 7, Compare-Players
    semantics), with backup, Timestamps.json Players entry and the placement of today. No other file is written.
  compare: >-
    compare reads the published file and the function result and reports every differing field; with AsOfDate equal to the
    date of the Players timestamp the result must be exact, including rounding and write depth. It is classified validation-shadow
    in the consumer read register (step 4).

boundaries:
  - Hold players are a rare emergency path; their GameHistory is intentionally empty (Q3).
  - Age depends on AsOfDate by design; a shadow comparison must use the date of the published timestamp.
  - Angular was only seen using Age for display and sorting; a check for logic use belongs to step 4.
  - Frontend cap and auto-cut models (plan gap L10) are out of scope.

nonGoals:
  - changes to the Players.json contract
  - new salary, ranking or grading rules (salary-v2, grading-v2 stay separate decisions)
  - PlayerWeekFantasy as the only point source
  - a new persisted Players product

steps:
  - 1 preparations (done, PR 1227): dead read removed, salary_simulation.py on canonical inputs
  - 2 this contract and ADR-076
  - 3a player-valuation extended additively (Q4), done (PR 1229); the exact equality with the published Players.json fields is proven by the step 4 shadow
  - 3b function players_read_model.py with Fast tests on synthetic players (done in the step 3b pull request; a local run against the freshly materialized product matched the published file byte for byte at AsOfDate 2026-10-31, the formal shadow is step 4)
  - 4 shadow compare against the published file (validation-shadow, Fast guard, one manual run on main)
  - 5 cutover of update-players.yml (players_app_publish.py write), PV hold seed dropped, runtime measured
  - 6 cleanup: delete RequestPlayers.ps1 and unused player modules, point-path guard, FM trigger to data-derived/player-valuation/**, inventory and registers
