schemaVersion: 1

decisions:
  - id: ADR-001
    title: Separate manual AI context from generated structure documentation
    status: accepted
    context: >
      AI tools need both stable architectural intent and current repository
      structure. Mixing both causes generated files to overwrite human decisions
      or lets stale manual documentation describe code structure incorrectly.
    decision: >
      Store human-maintained architecture and domain documentation in
      .ai-context/manual and generated repository snapshots in
      .ai-context/generated.
    consequences:
      positive:
        - AI can distinguish intent from implementation snapshot.
        - Generated files can be recreated safely.
        - Manual decisions remain stable across refactors.
      negative:
        - Requires discipline to keep manual decisions updated.

  - id: ADR-002
    title: Metadata owns league-specific rules
    status: superseded
    supersededBy: ADR-054
    decision: >
      League-specific inputs and rules belong in public/data/Metadata.json, not
      in Angular and not in technical path utilities.
    rationale: >
      This keeps domain configuration separate from technical generation and
      frontend rendering.

  - id: ADR-003
    title: ConfigUtils owns technical generation configuration
    status: accepted
    decision: >
      public/requests/utils/ConfigUtils.psm1 owns technical paths and generation
      configuration. It may load Metadata.json, but should not become the main
      home for league-specific domain rules.
    rationale: >
      Path resolution and generation setup are technical concerns and should not
      be mixed with league-specific rules.

  - id: ADR-004
    title: Generated JSON is the app data contract
    status: accepted
    decision: >
      Angular consumes public/data JSON as app-ready read models.
    rationale: >
      Angular should render and interact with data, but avoid owning core
      source-of-truth derivation logic.

  - id: ADR-005
    title: Angular owns display and frontend interaction
    status: accepted
    decision: >
      Angular components and services should display, filter, sort and combine
      generated app data. Core league rule derivation should remain in metadata
      or the PowerShell generation pipeline when it is source-of-truth behavior.

  - id: ADR-006
    title: Drafts are generated app data
    status: accepted
    decision: >
      Upcoming drafts and draft picks are generated into public/data/Drafts.json.
      The generation pipeline owns draft order, draft pick keys, display values
      and transaction-applied current ownership.
    rationale: >
      Drafts are domain data, not only UI state. They must be available to
      multiple frontend components and can be linked to transactions.

  - id: ADR-007
    title: Draft-pick ownership keeps original and current owner separately
    status: accepted
    decision: >
      Draft picks keep OriginalOwnerRosterID and CurrentOwnerRosterID as separate
      fields. Original ownership is stable; current ownership reflects applied
      draft-pick transactions.
    rationale: >
      This preserves history while still allowing teams to display currently
      owned picks.

  - id: ADR-008
    title: Transactions drive draft-pick ownership changes
    status: accepted
    decision: >
      Completed transaction output is updated before draft generation and is used
      to apply draft-pick ownership changes to generated Drafts.json.
    rationale: >
      Transactions are the domain event source for pick movement.

  - id: ADR-009
    title: Do not generate pending transactions without a reliable source
    status: accepted
    decision: >
      Do not add TransactionsPending.json while the current Sleeper transactions
      workflow only provides completed transaction data.
    rationale: >
      A generated pending file without a reliable source would imply a false
      source of truth.

  - id: ADR-010
    title: Draft round chip colors are frontend display logic
    status: accepted
    decision: >
      Draft round chip and tile colors are frontend-only display logic and are
      centralized in src/app/shared/utils/draft-ui.util.ts through
      getDraftRoundColor. Draft status display classes are normalized in the same
      utility through getDraftStatusClass.
    rationale: >
      The color and status-class mapping is presentation-specific. Centralizing it
      keeps Overview and Drafts displays visually consistent without moving draft
      order, ownership or source-of-truth derivation into Angular UI components.

  - id: ADR-011
    title: Completed draft history is stored separately from current drafts
    status: superseded
    supersededBy: ADR-021
    context: >
      The app needs current/upcoming/live draft picks as team assets, but also
      needs completed draft history for historical views. Mixing completed draft
      history into public/data/Drafts.json would make old picks look like current
      team assets because League.json team DraftPicks are derived from Drafts.json.
    decision: >
      Keep public/data/Drafts.json scoped to current/upcoming/live drafts. Store
      completed draft history by season under
      public/data/past_seasons/Drafts/Drafts_<season>.json. The frequent
      RequestLeague.ps1 flow only performs the restricted current/upcoming/live
      draft update. The weekly/manual RequestDrafts.ps1 flow performs the full
      draft refresh and also updates completed draft history.
    rationale: >
      This preserves the current team asset model, keeps the frequent league
      update lightweight and still allows completed draft results to be refreshed
      weekly or manually when source formats change.
    consequences:
      positive:
        - Completed draft history does not pollute League.json team DraftPicks.
        - The 10-minute league update does not constantly reprocess completed drafts.
        - Historical draft output can use the same draft/pick contract as current drafts.
      negative:
        - Frontend views that need completed history must load historical draft files separately.

  - id: ADR-012
    title: League Activity route groups draft and move presentation
    status: superseded
    supersededBy: ADR-016
    context: >
      The navigation label may change over time, but the frontend needs a stable
      feature area for current/upcoming draft assets, trades and roster movement.
      Drafts and moves are related league activity, but drafts are structured by
      draft and round while trades and roster moves are chronological activity.
    decision: >
      Use the stable route path /league-activity and LeagueActivityComponent for
      this feature area. The initial MVP displays current/upcoming/live drafts
      from public/data/Drafts.json and reserves the Moves section as a placeholder
      until Transactions.json is intentionally modeled in the frontend.
    rationale: >
      This kept the visible navigation label flexible while giving the codebase
      a durable component and route name. It also avoided prematurely treating
      Transactions.json as frontend contract before the DataService and models are
      updated for transactions.

  - id: ADR-013
    title: AI guidance is structured in a dedicated manual file
    status: accepted
    context: >
      The aiGuidance.rules list in .ai-context/ai-context.yaml grew from a short
      set of global reminders into a mixed collection of answering behavior,
      source-of-truth rules, write strategies and post-commit checks.
    decision: >
      Keep .ai-context/ai-context.yaml as the entry point and short summary. Move
      detailed AI working rules into .ai-context/manual/ai-guidance.yaml, grouped
      by answering behavior, source-of-truth handling, documentation, todos,
      PowerShell conventions, write strategy and post-commit behavior.
    rationale: >
      Grouped rules are easier for agents to find and apply than one long flat
      list. The top-level context file remains concise while still pointing to
      the full rule set.
    consequences:
      positive:
        - AI guidance is less likely to be diluted by a long flat list.
        - New guidance can be added to a specific category.
        - AGENTS.md can point agents to the dedicated guidance file early.
      negative:
        - Agents must read one additional manual context file.

  - id: ADR-014
    title: Routed Angular feature pages live under src/app/features
    status: accepted
    context: >
      The first Angular structure refactor moved routed pages away from the
      src/app root into feature folders and moved reusable player UI into shared
      components. Temporary compatibility re-export wrappers were used during
      stabilization.
    decision: >
      New routed feature code belongs under src/app/features/**. Reusable UI
      belongs under src/app/shared/components/**. The old routed compatibility
      re-export wrappers were removed after build checks, manual UI validation and
      repository search showed no productive references to the old paths.
    rationale: >
      This keeps routed pages, shared UI and future core services separate while
      avoiding permanent duplicate import paths after the staged migration.

  - id: ADR-015
    title: Relevant player chat export is generated helper output
    status: superseded
    supersededBy: ADR-024
    context: >
      The full generated player file is too large for practical AI/chat analysis,
      but the app should not lose player fields or introduce a manually maintained
      parallel data model just for chat workflows.
    decision: >
      Generate public/data/Players_Relevant.json from Players.json during the
      frequent RequestLeague.ps1 flow and derive public/data/chat/players-relevant
      from that relevant player subset. The chunk export preserves full player
      objects, writes stable 10-player chunks and uses index.json for lookup
      metadata. Technical output paths are owned by ConfigUtils.psm1 via
      PlayersRelevantFile and PlayersRelevantChatDir.
    rationale: >
      This keeps the app data source generated and reproducible, avoids manually
      edited helper files, and gives AI/chat workflows a small indexed entry point
      without changing Angular's current Players.json contract.
    consequences:
      positive:
        - Chat analysis can load index.json first and fetch only relevant chunks.
        - Relevant player filtering remains generation-owned rather than frontend-owned.
        - Chunk files preserve the generated player object shape.
      negative:
        - The frequent league generation flow writes additional generated helper files.
        - Any changes to relevant-player criteria or chat index shape must be made in the generation utilities.

  - id: ADR-016
    title: Drafts and Moves are separate routed feature areas
    status: accepted
    context: >
      Drafts and moves started as one League Activity MVP. The product direction
      now treats Drafts as a dedicated planning and draft-asset area, while Moves
      should become the chronological activity area for trades, adds, drops and
      roster movement. The Trade Simulator stays separate for now but may later
      move under Moves.
    decision: >
      Use /drafts as the primary route for draft presentation and use
      DraftsPageComponent under src/app/features/drafts/drafts-page.ts as the
      routed page aggregator. Use /moves as the primary route for transaction and
      roster-move presentation. Keep LeagueActivityComponent as the technical
      component name for the Moves page for now. Keep /league-activity as a
      compatibility redirect to /moves. Keep /trade as an independent route until
      the Trade Simulator is intentionally integrated into Moves.
    rationale: >
      Drafts are structured by draft, round, pick order, current owner and
      original owner. Moves are chronological league activity and depend on
      Transactions.json being modeled in the frontend. Separate routes avoid a
      mixed feature page and allow each area to evolve independently.
    consequences:
      positive:
        - Drafts can grow dedicated tabs, statistics and rankings without being coupled to the transaction timeline.
        - Moves can focus on transaction modeling and chronological activity.
        - Existing /league-activity links remain usable through a redirect.
      negative:
        - Shared pick detail and compact trigger mechanics are centralized, but visual card-style triggers such as the Overview tile can remain separate when their layout needs differ.
        - LeagueActivityComponent has a legacy name until the Moves area is renamed or rebuilt later.

  - id: ADR-017
    title: Current drafts have draft-scoped view modes
    status: accepted
    context: >
      Current-season drafts need multiple planning views: a compact draft-board
      overview, a team-owned pick view similar to Future Drafts but with concrete
      pick labels, and a simple ordered list/table. Different drafts may need
      different active views at the same time.
    decision: >
      Keep Current Drafts as a tab inside the Drafts feature, but let each draft
      card manage its own view mode: Overview, Teams or List. Use Overview as the
      default view and render it as a compact Sleeper-like draft board where rows
      are rounds and columns are positions in the round. Overview tiles are square
      and mobile-compact; open picks show the current owner's fantasy team logo,
      while picked tiles show the selected player's image plus the current owner's
      fantasy team logo as context. DraftPickCardComponent owns the Overview pick
      tile presentation. Player position and fuller pick details are shown in
      DraftPickPopoverComponent rather than directly on the Overview tile. Teams
      and List render orderedPicks and currentOwnerPickGroups from the central
      DraftViewModel instead of rebuilding that structure locally. Compact pick
      chips use DraftPickTriggerComponent through CurrentDraftPickChipComponent.
    rationale: >
      Draft-specific view state matches how current drafts are reviewed and avoids
      forcing all drafts into one global display mode. The compact board gives the
      default Overview a scan-friendly draft-room layout without changing generated
      contracts or source-of-truth derivation.
    consequences:
      positive:
        - Each current draft can be inspected in the most useful view independently.
        - Open and picked picks expose the same ownership and trade context.
        - Overview provides a dense mobile-friendly board for quick draft scanning.
        - Teams and List share stable view-model fields with other Drafts views.
      negative:
        - Pick trigger components remain separate only where their size and visual context differ materially, such as the Overview card tile.

  - id: ADR-018
    title: Past season files are discoverable through a central generated index
    status: accepted
    context: >
      Historical season data is stored in generated files under
      public/data/past_seasons, with some resources in nested folders such as
      Drafts and Transactions and other resources directly under the past_seasons
      root. A static Angular app cannot list folders at runtime, but Past Drafts
      and later historical views need to discover available seasons and resource
      paths without hard-coded year lists.
    decision: >
      Generate public/data/PastSeasonsIndex.json as a central flexible navigation
      manifest for historical season resources. ConfigUtils.psm1 owns the index
      output path and the configured resource path patterns through
      PastSeasonResources. RequestPastSeasonsIndex.ps1 is the request entry point,
      and PastSeasonsIndexUtils.psm1 owns the scan and write logic. A manual
      update-past-seasons-index workflow can rebuild the index on demand.
    rationale: >
      A single manifest scales better than one index per historical resource and
      gives Angular one stable entry point for Past Drafts and future historical
      views. Keeping it generated avoids manually maintained file lists.
    consequences:
      positive:
        - Angular can load one manifest and then fetch only the selected season/resource file.
        - Additional resources such as Players, Games, Schedule, Standings or Teams can be added via config without changing index logic.
        - The manifest is reusable for AI workflows that need to navigate historical data.
      negative:
        - Historical data generators must refresh the index after changing past-season files or rely on the manual workflow.
        - PastSeasonsIndex.json is a navigation manifest and must not be treated as the historical data source of truth.

  - id: ADR-019
    title: Draft presentation uses feature-local shared components
    status: accepted
    context: >
      Current, past and future draft views share header metrics, compact pick
      trigger mechanics, pick detail popover content and some pick presentation
      concepts, but they still need different routed tab layouts and card sizes.
    decision: >
      Keep reusable Draft-specific UI under src/app/features/drafts/components/**.
      Use DraftShellComponent for shared draft card header and metrics,
      DraftPickTriggerComponent for compact token trigger mechanics such as
      current/past pick chips and future round pills, DraftPickPopoverComponent
      for shared pick detail popover content, and DraftPickCardComponent for the
      reusable Overview pick tile. Keep generic app-wide UI under
      src/app/shared/components/** and keep draft-only helpers such as draft round
      colors in shared frontend utilities when they are used outside the Drafts
      feature.
    rationale: >
      Draft UI is reused across multiple Drafts tabs but is still domain-specific
      to the Drafts feature. Keeping it feature-local avoids making shared app UI
      too domain-heavy while preventing duplicated Current/Future/Past Draft code.
      Compact token triggers are similar enough to share one component, while the
      larger Overview tile remains a separate card component because it displays
      images and context labels instead of only a pick token.
    consequences:
      positive:
        - Current, past and future drafts use one header/metric source.
        - Compact token triggers share one button, traded-dot and popover trigger implementation.
        - Pick detail content is centralized while trigger shapes can remain appropriate to each view.
        - Overview and Drafts route colors can share one frontend utility without changing generated data.
      negative:
        - Future generic reuse outside Drafts would require intentionally moving components to src/app/shared/components.

  - id: ADR-020
    title: Season awards remain in Standings.json
    status: accepted
    context: >
      Season awards are derived from regular-season standings, playoff results
      and previous-season standings. A separate Awards.json file was considered,
      but awards are season-history data rather than independent current league
      assets.
    decision: >
      Keep generated season awards as part of each season object in
      public/data/Standings.json. Do not introduce a standalone Awards.json for
      this contract. League.json may temporarily embed standings and team
      placement awards for current frontend compatibility, but Standings.json is
      the intended generated owner for season-level award history. Amendment
      (Issue #1195, Robert 2026-10-30): League.json team Placements carry no
      award copy; awards are delivered only in the season standings sections
      and consumers filter them by TeamID.
    rationale: >
      Awards are meaningful together with the season standings that produced
      them. Keeping them in Standings.json avoids a fragmented history model and
      keeps future Hall-of-Fame, legacy and season-archive read models anchored to
      one season-history source.
    consequences:
      positive:
        - Season archive and award history can consume one standings/history contract.
        - No additional Awards.json navigation or synchronization path is needed.
        - Future generator-side legacy summaries can derive from Standings.json.
      negative:
        - Frontend refactors that currently read awards through League.json still need a migration path to load Standings.json directly.

  - id: ADR-021
    title: Completed current-season drafts remain in Drafts.json
    status: accepted
    context: >
      A completed draft still belongs to the active league season and is needed by
      Overview, the Drafts Current tab and complete-season Draft Capital. Removing
      it immediately after completion also makes the league fall out of Draft-Season
      before the next configured draft is scheduled.
    decision: >
      Generate public/data/Drafts.json with every draft from LeagueYear regardless
      of status. In addition, retain Drafts.UpcomingDraftCount non-completed drafts
      for each configured draft type; a completed LeagueYear draft does not consume
      one of those open slots. League.json team DraftPicks continue to include
      picked current-season picks so Best Pick and total Draft Capital cover the
      complete season, while availability-sensitive views derive Best Open Pick
      from pick status and selected-player metadata. Angular classifies only
      Season equal to League.Season as Current, only greater seasons as Future and
      only archived lower seasons as Past. After one current-season draft completes
      while another remains open and unscheduled, League Status remains Draft-Season
      with Phase Between Drafts.
    rationale: >
      Draft lifecycle, season membership and pick availability are separate domain
      concepts. Keeping them separate preserves completed current-season context,
      maintains a stable count of open future assets and prevents status transitions
      from depending on whether Sleeper has scheduled the next draft yet.
    consequences:
      positive:
        - Overview and the Drafts Current tab retain completed LeagueYear drafts.
        - Draft Capital can compare all current-season picks while Best Open Pick remains availability-aware.
        - The generator continues to expose the configured number of non-completed drafts per type.
        - Draft-Season remains stable between consecutive current-season drafts.
      negative:
        - A completed current-season draft may exist both in Drafts.json and in its archive file until League.Season advances.
        - Consumers must use explicit season and availability filters instead of assuming every Drafts.json pick is open.

  - id: ADR-022
    title: Current generated JSON uses build-version cache busting
    status: accepted
    context: >
      Angular bundles are output-hashed, but generated JSON resources keep stable
      filenames such as data/Drafts.json. Browser or intermediary caches can therefore
      serve JSON from an older deployment while the frontend already displays the new
      build commit. Historical resources can grow over time and normally do not change,
      so invalidating every historical file on every deploy would waste their durable
      cache value.
    decision: >
      Register a global Angular HttpClient interceptor that appends the deployed
      APP_BUILD_INFO commit as the build query parameter to local GET requests for JSON
      files under data/. Exclude data/past_seasons/** from build-version cache busting.
      Keep data/PastSeasonsIndex.json versioned because the root manifest can change
      when historical seasons or resource paths are added. Do not rename generated JSON
      files or change the deployment layout.
    rationale: >
      One global interceptor automatically protects current and future generated JSON
      loaders without requiring each DataApiService method to remember a URL helper.
      A stable build value preserves normal caching inside one deployment, while a new
      deploy receives a distinct request URL. Excluding historical resources avoids
      repeatedly downloading unchanged archive data.
    consequences:
      positive:
        - Current generated JSON cannot remain tied to an older frontend cache key after a deploy.
        - Future JSON files under data/ inherit the policy automatically when loaded through Angular HttpClient.
        - Historical files retain stable URLs and long-lived browser cache value.
        - The deploy script, physical JSON filenames and generated JSON contracts remain unchanged.
      negative:
        - Every new deploy invalidates all non-historical JSON URLs, even when an individual file did not change.
        - A historical file corrected in place may remain stale for users who already cached its stable URL.
        - Requests that bypass Angular HttpClient do not receive this cache policy automatically.

  - id: ADR-023
    title: Fantasy Management consumes app pipelines read-only by default
    status: accepted
    context: >
      Fantasy Management needs current app data as analysis input, but coupling
      Fantasy-Management-only freshness or monitoring mechanics into app producer
      workflows can make successful app publication depend on unrelated analysis
      tooling.
    decision: >
      Treat application data generation and fantasy-management as separate
      ownership domains. Fantasy Management may consume published canonical app
      data and react to its changes, but must not modify app generators, refresh
      workflows, schedules, publication paths or generated app outputs for an
      FM-only requirement unless the user explicitly approves that concrete
      cross-context change. Successful app generation and publication must never
      depend on Fantasy Management scripts, files, heartbeats or runtime state
      without that explicit approval.
    rationale: >
      The app is a productive source system in its own right. Read-only
      consumption preserves that source-of-truth boundary while still allowing
      Fantasy Operations to materialize derived signals from current app data.
    consequences:
      positive:
        - App refreshes remain operationally independent from Fantasy Management.
        - FM can still react immediately to published app-data changes.
        - Future freshness or observability needs must be implemented on the
          consumer side unless a cross-context change is explicitly approved.
      negative:
        - Some existing cross-context integrations may require separate review
          and migration to comply with the stricter boundary.

  - id: ADR-024
    title: Retire app-generated AI player subsets and chat chunks
    status: accepted
    context: >
      Players_Relevant.json and its ten-player chat chunks were introduced to work
      around an earlier AI-client ingestion limit. Fantasy Operations now has
      consumer-owned derived contracts for broad player analysis, while targeted
      repository reads can retrieve exact raw player records without requiring a
      duplicated app-generated player dataset.
    decision: >
      Keep public/data/Players.json as the canonical current raw player read model.
      Remove public/data/Players_Relevant.json, public/data/chat/players-relevant/**
      and their app-generation helpers. Fantasy Management should use its own
      derived Operations contracts for broad analysis and targeted read-only access
      to Players.json when raw player fields are required. Canonical app producers
      must not generate reduced, chunked or duplicated datasets solely for an AI,
      chat or agent client's ingestion limits.
    rationale: >
      Tool-specific convenience outputs are consumer concerns. Removing them keeps
      the application producer independent from Fantasy Management and avoids
      frequent League refresh churn across dozens of files that have no app
      consumer.
    consequences:
      positive:
        - RequestLeague no longer filters and republishes an AI-only player subset.
        - The 10-minute League refresh no longer rewrites chat chunk artifacts.
        - Fantasy Management relies on canonical app inputs and FM-owned derived contracts.
        - There is no second relevance definition competing with player-signals population rules.
      negative:
        - Agents needing a raw field outside an FM-derived contract must perform a targeted Players.json read.

  - id: ADR-025
    title: Canonical player identity is application-defined and provider mappings are historical
    status: accepted
    context: >
      The app intentionally relies on Sleeper for its current player and league
      state, but historical data must remain correct if a provider corrects,
      collides or eventually reuses an identifier. Real nflverse input has shown
      that one provider mapping can contradict otherwise distinct player
      identities, so treating every shared provider ID as an unconditional merge
      edge is not safe. The original canonical field name NFLPlayerID also
      misleadingly suggested an identifier issued by the NFL, while the identity
      is actually defined and owned by fantasy-app.
    decision: >
      Use CanonicalPlayerID as the durable provider-independent identity of one
      real NFL player in canonical source data. CanonicalPlayerID is issued in the
      fantasy-app namespace; source-data/nfl describes the NFL data domain and not
      the ID issuer. Keep public/data/Players.json[].ID as the Sleeper player_id
      because Sleeper remains the leading provider for the current app and
      fantasy-league state; this Sleeper field is an app contract, not the
      permanent cross-provider person key. Treat Sleeper, Tank01, GSIS, ESPN, PFR,
      PFF, any future official NFL-issued identifier and all other external IDs as
      historical mappings to CanonicalPlayerID. Persist mapping validity with at
      least season-level resolution. A conflicting provider mapping must be
      quarantined rather than merging two otherwise distinguishable people.
      Historical canonical facts retain the CanonicalPlayerID resolved for the
      event or season plus source provenance. Names remain descriptive rather than
      authoritative merge keys. Existing canonical ID values remain stable during
      the legacy NFLPlayerID-to-CanonicalPlayerID field-name migration; the rename
      does not create new person identities. Runtime timestamps must not make
      otherwise identical canonical source-data semantically different.
    rationale: >
      This preserves Sleeper as the practical source of truth for the current app
      while decoupling long-lived player history from assumptions about the
      lifetime uniqueness of any external provider identifier. Naming the
      application-owned identity CanonicalPlayerID also reserves an unambiguous
      namespace for any real NFL-issued player identifier that may become
      available later. The resolver can fail closed on dirty mappings without
      corrupting canonical people.
    consequences:
      positive:
        - Current Angular and generated Players.json contracts remain unchanged.
        - Historical facts can survive provider ID reuse or corrections.
        - Provider conflicts are isolated to mappings instead of collapsing people.
        - New providers, including a future official NFL identifier, can attach without becoming a new global master ID.
        - Existing canonical ID values survive the schema rename unchanged.
        - Semantic no-op materialization is independent from freshness metadata.
      negative:
        - The identity bridge requires historical mappings and conflict quarantine.
        - Resolution APIs need temporal context when an external ID is not globally unique.
        - Readers must temporarily accept the legacy NFLPlayerID field while v1 persisted source-data is migrated to canonical schema v2.

  - id: ADR-026
    title: Historical transaction rebuild regenerates dependent drafts in one working tree
    status: accepted
    context: >
      Transaction draft-pick details depend on generated draft results, while draft
      ownership and TradeHistory depend on transactions. A full historical
      transaction rebuild previously regenerated transaction base data and then
      enriched it from whatever historical Drafts_<season>.json happened to be on
      disk. After the DraftInstance contract changed, stale legacy draft outputs
      therefore wrote DraftInstance 0, empty DraftCode and old D1-style keys back
      into freshly regenerated Transactions history.
    decision: >
      Treat historical Transactions and Drafts JSON as disposable generated output.
      The scheduled full-history rebuild runs as one dependency-ordered working-tree
      pipeline: rebuild current and historical transaction base data from canonical
      inputs; resolve concrete draft identity; regenerate current/open and completed
      historical drafts from that fresh transaction state; enrich transaction picks
      from those freshly regenerated draft outputs; refresh PastSeasonsIndex. Do not
      add compatibility mappings for legacy generated keys such as
      2024_D1_Free_Agent. The scheduled RequestTransactions workflow owns this
      coupled weekly rebuild. RequestDrafts remains manually dispatchable as an
      independent repair/refresh path but is not a second scheduled history writer.
    rationale: >
      A full rebuild must be able to adopt new fields and schemas without previous
      generated files becoming accidental source data. Keeping dependent stages in
      one checkout also ensures that downstream generators consume exactly the
      upstream state produced by the same rebuild rather than a previous published
      snapshot.
    consequences:
      positive:
        - Historical schema changes are applied by regeneration rather than migration.
        - Stale historical Draft files cannot overwrite fresh transaction identity.
        - Draft ownership, TradeHistory and transaction pick-result enrichment use one coherent rebuild snapshot.
        - Weekly history publication has one scheduled owner instead of two competing writers.
      negative:
        - A full Transactions history run also regenerates Drafts and may publish both data scopes.
        - Manual Draft refreshes remain capable of enriching persisted Transactions and therefore must preserve the shared stage order.

  - id: ADR-027
    title: Team detail is app-wide and Teams migrates before the Salary & Trade Simulator
    status: accepted
    context: >
      The current Teams page combines useful salary inspection with temporary
      exclude/cut simulation, but the redesigned Teams experience is intended to
      become a compact franchise overview with reusable team details. Team details
      will also be useful from Standings, Drafts, Moves, Overview, Player Detail and
      the future simulator. Building Teams and the simulator independently would
      risk duplicated salary logic, draft-pick UI and dialog wiring.
    decision: >
      Build the new Teams experience before the full Salary & Trade Simulator, but
      first establish shared salary/roster presentation logic and reusable UI
      primitives. Treat the team detail dialog as an app-wide interaction opened
      through one shared entry point rather than as private state of /teams. Reuse
      PlayerList, Player Detail, position styling, standings/history helpers and
      existing Drafts UI wherever the dependency remains architecturally sound. If
      DraftPickTrigger/Popover needs genuine cross-feature reuse, move only the
      generic primitive to shared instead of duplicating it or making Teams depend
      on Drafts feature internals. Keep the current salary-centric Teams page
      temporarily reachable as a legacy fallback while the new /teams becomes the
      primary current-state view. Do not carry exclude/cut/trade simulation into
      team detail. Expand the Trade Simulator afterward into a Salary & Trade
      Simulator using the same shared salary primitives, and remove the legacy
      Teams salary view only once exclude/cut scenario functionality has reached
      functional parity there.
    rationale: >
      This delivers the already-defined Teams UX without waiting on a larger
      simulator redesign, preserves existing simulation capability during the
      migration and makes the shared salary/team-detail foundation reusable by the
      next feature instead of creating two competing implementations.
    consequences:
      positive:
        - Team detail can be opened consistently from any feature with a team reference.
        - Teams and the later simulator share Current/Projected, cap usage, salary allocation and roster calculations.
        - Existing player, standings and draft UI is reused instead of copied.
        - The legacy page protects current exclude/cut workflows during migration.
      negative:
        - The app temporarily carries both the new Teams view and a legacy salary view.
        - Some Drafts feature-local components may need a focused move to shared when a real cross-feature consumer appears.
        - Legacy removal is blocked until the later simulator reaches scenario parity.

  - id: ADR-028
    title: GitHub Issues are the canonical operative work-tracking system
    status: accepted
    context: >
      Operative repository work was previously distributed across root and
      Fantasy Management Markdown TODO files plus chat context. That made
      prioritization, mobile review, continuity across chats and handoff between
      agents or humans fragile, while the TODO files also accumulated durable
      architectural context that belonged in canonical documentation.
    decision: >
      Use GitHub Issues as the canonical operative source for backlog, progress,
      current handoff and retrospective work history. Keep durable architecture,
      domain, source and Fantasy Management knowledge in the existing canonical
      repository documentation. Treat the current Issue body as the canonical
      mutable work state; comments are supplemental history or communication and
      must not be required to reconstruct current work. Prefer flat coherent
      Issues with internal Markdown checklists for multi-step deliverables;
      parent/sub-issue relationships are optional. Do not maintain Markdown TODO
      files in parallel after migration. Commits and Pull Requests remain the
      implementation/change history, while the GitHub Project is a presentation
      and prioritization cockpit. Label semantics, mutable P0-P4 priorities and
      work-tracking drift governance are defined in
      .ai-context/manual/work-tracking.yaml.
    rationale: >
      This keeps operative state searchable, filterable, mobile-readable and
      handoff-safe without mixing temporary backlog with durable architecture
      knowledge or depending on one chat session. A documented label contract
      also lets agents validate GitHub metadata against repository-defined meaning.
    consequences:
      positive:
        - Work can continue across chats, AI models and humans from the Issue body.
        - Priorities and work status can change without rewriting durable architecture docs.
        - Open and historical work remains searchable after Markdown TODO retirement.
        - Durable repository documentation keeps its established ownership boundaries.
        - Label and Project drift can be detected during structural audits.
      negative:
        - GitHub Issue metadata and repository documentation must be kept semantically aligned.
        - Retrospectively migrated Issues have migration-time GitHub created_at values, so original dates must be documented separately when known.

  - id: ADR-029
    title: NFL source acquisition mode and availability are executable registry contracts
    status: accepted
    context: >
      The first source-data registry handled active sources as one fixed URL per
      dataset. The next approved NFL datasets include season-partitioned releases
      and sources that can legitimately be unpublished for the current season.
      Treating those cases as ad-hoc fetcher behavior would make availability,
      freezing and repair semantics inconsistent across datasets.
    decision: >
      Use source-data registry schema v3 to separate acquisition mode from dataset
      lifecycle. A fixed source maps one URL to one validated raw snapshot. A
      season-partitioned source requires {season} in its URL, raw path and metadata
      path and normally resolves the current source season, with explicit repeated
      --season selection for backfill/repair. Keep `required` as the default
      availability policy. Permit `current-season-may-be-unavailable` only for an
      HTTP 404 on a not-yet-persisted current-season partition; represent that as a
      stable not-yet-available state rather than empty data or zero. Historical
      404s, schema failures and implausibly small/empty data fail closed. Existing
      prior-season raw partitions are frozen in normal sync and historical repair
      requires --force. `materialize` explicitly distinguishes registered raw-only
      sources from datasets already consumed by the current canonical materializer.
      Activating a raw source never changes public/data or the app generator by
      itself.
    rationale: >
      Acquisition shape, source availability and historical repair are source-data
      concerns and should be reusable across schedules, stats, snaps, rosters and
      platform snapshots instead of being duplicated in per-dataset scripts. The
      narrow not-yet-available rule preserves Missing-vs-Zero semantics while the
      last-known-good contract protects production data from transient provider
      failures.
    consequences:
      positive:
        - Fixed and season-partitioned datasets share one validated sync path.
        - Current-season pre-publication is distinguishable from fetch/schema failure.
        - Prior-season raw evidence is stable unless repair is explicitly requested.
        - Raw sources can be activated and audited before canonical/app consumers are migrated.
        - PR CI can validate the common source tooling before productive source sync runs.
      negative:
        - Registry entries carry additional acquisition and availability metadata.
        - Dataset-specific activation still requires schema, license, join and materialization work.
        - The current-source-season fallback must remain aligned with the league/bootstrap lifecycle.

  - id: ADR-030
    title: Workflow health uses an isolated repository snapshot plus external notification
    status: accepted
    context: >
      The initial monitoring design expected the external ChatGPT watcher to read
      workflow-specific GitHub Actions run histories directly. The available
      ChatGPT GitHub connector cannot reliably list those run collections, so
      failure streaks, recovery and staleness cannot be evaluated there without
      incomplete evidence.
    decision: >
      Keep .ai-context/manual/workflow-monitoring.yaml as the canonical monitoring
      policy. Run a small repository-owned scheduled workflow that reads the policy
      and GitHub Actions metadata with actions:read, computes deterministic health
      state outside workflow YAML in tools/build_workflow_health_snapshot.py, and
      publishes workflow-health.json only to the isolated workflow-health-state
      branch. The snapshot producer never sends notifications or mutates Issues.
      The external ChatGPT condition watch reads the policy from main plus the
      snapshot from workflow-health-state, treats an over-age or missing snapshot
      as monitoring-infrastructure failure, and remains the user notification layer.
      The snapshot workflow is non-paging in recursive run evaluation; its own
      availability is represented by snapshot freshness.
    rationale: >
      GitHub Actions has authoritative access to its own run API, while the external
      watcher is better suited to user-facing conditional notification. Separating
      deterministic state materialization from notification avoids duplicating
      policy, avoids another notification source, and prevents hourly snapshot
      commits from triggering main-bound product workflows.
    consequences:
      positive:
        - Workflow-specific run evaluation uses complete GitHub-side evidence.
        - The existing category, failure and staleness policy remains versioned in one place.
        - Snapshot commits are isolated from main and do not trigger main-only product workflows.
        - Snapshot freshness provides independent self-monitoring for the snapshot producer.
        - The external notification layer no longer depends on unavailable run-list connector capabilities.
      negative:
        - Monitoring now depends on one additional scheduled GitHub Actions workflow and a state branch.
        - The snapshot workflow needs contents:write solely for the isolated state branch.
        - A missing or stale snapshot becomes a separate infrastructure incident that the external watcher must handle.

  - id: ADR-031
    title: Central scheduler owns productive workflow timing
    status: accepted
    context: >
      Productive refresh schedules were previously embedded independently in many
      GitHub Actions workflow files. This made the effective operating calendar
      difficult to inspect and duplicated scheduling concerns across producers.
      In addition, GitHub schedule events have shown repeated severe delay and
      silent-drop behavior, so merely moving individual cron minutes does not
      provide a robust scheduling model or a clean path to an external clock.
    decision: >
      Make .github/workflow-schedules.json the canonical repository schedule for
      time-driven productive workflows. REPO • Scheduler wakes every five minutes,
      evaluates those cron expressions in their declared IANA time zones, finds the
      latest due slot within the configured lookback and dispatches an unsatisfied
      target through its unique repository_dispatch event type. Target workflows
      no longer own schedule triggers; their existing push, pull_request and manual
      workflow_dispatch paths remain where applicable. A matching run started after
      the latest due slot satisfies that slot only after it completes successfully.
      A matching run that is still queued or in progress is treated as in-flight and
      suppresses duplicate dispatches for that slot. If no successful or in-flight
      matching run exists after the due slot, including when all attempts completed
      unsuccessfully, the next Scheduler tick dispatches one catch-up retry. Missed
      scheduler ticks are caught up at the next successful tick and multiple missed
      slots for one workflow coalesce into one current refresh. Workflow health still
      surfaces failures independently from this retry behavior. The workflow-health
      snapshot producer keeps its own independent best-effort clock so monitoring is
      not made dependent on the scheduler it observes. A future external clock may
      replace GitHub cron as the Scheduler wake-up source without changing target
      schedules or target workflow trigger contracts.
    rationale: >
      Separating the clock, the operating schedule and the productive workflow
      implementation makes timing centrally visible, provides deterministic
      catch-up/dedupe behavior and limits a future external-scheduler migration to
      one wake-up workflow instead of every producer. Requiring a successful
      completion before a slot is fulfilled prevents a failed refresh from being
      mistaken for delivered data, while the in-flight state prevents concurrent
      duplicate retries.
    consequences:
      positive:
        - All productive time-based refresh schedules are visible in one canonical file.
        - Target workflows are decoupled from the reliability of their own GitHub cron triggers.
        - Missed scheduler ticks can catch up without replaying every missed interval.
        - Failed refresh attempts remain eligible for a later catch-up retry until the slot succeeds.
        - A future external scheduler can wake one workflow without changing producer schedules.
        - Manual and event-driven workflow paths remain independently usable.
      negative:
        - Until an external wake-up source is added, the central scheduler still depends on GitHub cron for its own five-minute ticks.
        - The Actions run list contains many lightweight Scheduler runs.
        - A persistent target failure may create one new retry attempt per successful Scheduler tick until a run succeeds.
        - The Scheduler becomes critical shared infrastructure and therefore requires explicit monitoring and regression coverage.

  - id: ADR-032
    title: Shared source-data includes canonical fantasy-league facts
    status: accepted
    context: >
      Phase 1A established persistent provider raw data and canonical NFL facts,
      while productive App generators still fetch Sleeper league state directly
      and Fantasy Management consumes much of that state indirectly through
      public/data read models. Sleeper creates a new league_id for each league
      season and links seasonal instances through previous_league_id, so a provider
      league_id cannot serve as the durable identity of the logical multi-season
      fantasy league. App and Fantasy Management need the same underlying league
      facts without either consumer becoming the other's source of truth. Matchups
      are now also a productive League.json input and therefore part of the shared
      League-source fact scope.
    decision: >
      Treat source-data/** as the shared persistent facts substrate for both the
      Fantasy App and Fantasy Management. Keep provider-independent NFL facts under
      source-data/nfl/** and add canonical fantasy-league facts under
      source-data/leagues/<CanonicalLeagueID>/**, backed by provider raw league data
      under source-data/providers/sleeper/leagues/**. Use a fantasy-app-issued
      CanonicalLeagueID for the logical league across seasons and providers and a
      CanonicalLeagueSeasonID for each season. Sleeper league_id remains a provider
      identifier; previous_league_id is retained and validated as provider lineage
      evidence but does not replace canonical identity. Persist League, members,
      rosters, playoff brackets, week-partitioned matchups and transactions, league
      drafts, draft detail/picks and draft-specific traded-pick evidence required by
      the consumers. Model multiple independent fantasy leagues by design. Keep
      public/data/** as App-specific generated read models and keep Fantasy
      Management rankings, signals, monitoring judgments, Knowledge, analyses and
      decisions under fantasy-management/**. Complete and productively accept the
      League Source Layer in Phase 1B before Phase 2 migrates either consumer to the
      shared source contracts; existing public/data contracts remain unchanged
      unless separately approved.
    rationale: >
      A shared canonical League layer removes the current indirect dependency where
      Fantasy Management must consume App read models for facts that originate in
      Sleeper, while preserving clear ownership between provider evidence,
      normalized facts and consumer-specific derivations. Stable application-owned
      league identity is required because Sleeper league IDs are season-scoped and
      because the source model must remain valid for multiple leagues and possible
      future provider changes. Persisting matchup facts alongside the other Sleeper
      league facts keeps the Source Layer complete after the League.json matchup
      feature was introduced.
    consequences:
      positive:
        - App and Fantasy Management can derive from the same reproducible league facts without depending on each other's outputs.
        - Historical Sleeper league instances can be retained under one stable logical league identity.
        - Matchups are covered by the same provenance/no-op/lifecycle rules as other league facts.
        - Multi-league support is part of the source contract instead of a later retrofit.
        - Provider raw data, canonical facts, App read models and Fantasy Management derivations have explicit separate ownership.
        - Phase 2 can migrate consumers while preserving existing App JSON contracts.
      negative:
        - Phase 1B must introduce league identity mappings, lineage validation, persistence and lifecycle rules before consumer migration.
        - Existing direct Sleeper reads and Fantasy Management public/data dependencies remain temporarily during the staged migration.
        - CanonicalLeagueID and CanonicalLeagueSeasonID require application-owned namespaces and mapping maintenance.

  - id: ADR-033
    title: Central scheduler uses profiles, bounded retries and isolated runtime state
    status: accepted
    context: >
      ADR-031 centralized workflow timing, but the initial catch-up semantics could
      retry a persistently failing target on every Scheduler tick. The first Health
      observation barrier also applied one age limit equally to a productive target
      being dispatched in the current Scheduler pass and to a target that had
      already been running for a long time. Productive observation showed that a
      fresh Players retry could therefore start in the same tick as Workflow Health
      once the original Health slot was older than the blanket deferral limit. The
      raw JSON Scheduler output was also too difficult to assess directly from a run.
    decision: >
      Extend the central schedule contract in .github/workflow-schedules.json with
      named Scheduler profiles. Targets reference one profile: `productive`,
      `maintenance` or `observer`. Productive targets participate in the Workflow
      Health observation barrier; maintenance and observer targets do not. Profiles
      also own bounded retry policy. Productive targets use at most three attempts
      for one anchored due slot, with 5- and 10-minute backoff before attempts two
      and three and a 60-minute circuit-breaker cooldown after exhaustion. The
      Scheduler persists only coordination state on the isolated
      workflow-scheduler-state branch in scheduler-state.json and reconciles that
      state against actual GitHub Actions run history on every evaluation; GitHub
      run metadata remains authoritative for what actually ran and how it ended.
      An unresolved retry cycle keeps its original due slot even when newer regular
      slots become due, and a deferred Health slot is anchored the same way. A
      productive dispatch selected in the current Scheduler tick is a hard Health
      blocker for that tick regardless of Health age. An already in-flight
      productive target may stop blocking Health after the configured 20-minute
      anti-starvation window. Retry backoff, retry-exhausted and circuit-breaker
      cooldown states do not block Health, so persistent productive failures remain
      observable by the Health snapshot. Scheduler runs retain structured JSON
      decision logs and additionally write a human-readable GitHub Job Summary with
      target profile, decision, action, due slot, attempt and explanation.
    rationale: >
      Persistent failures must self-limit rather than consume Actions indefinitely,
      while transient failures still deserve automatic recovery attempts. A fresh
      productive dispatch is known to be about to change the observable state and
      should therefore finish before Health snapshots it; a genuinely long-running
      workflow needs a bounded escape hatch so monitoring cannot starve forever.
      Keeping runtime coordination state outside main avoids product/deploy churn,
      and reconciling it against GitHub run history prevents a stale counter from
      becoming a second execution truth. The Job Summary makes normal Scheduler
      operation understandable without decoding machine-oriented JSON logs.
    consequences:
      positive:
        - Persistent target failures no longer create one retry on every Scheduler tick.
        - Retry attempts stay associated with one stable due slot across later cron slots.
        - Fresh productive retries cannot race Workflow Health in the same Scheduler pass.
        - Long-running workflows cannot suppress Health forever.
        - Retry exhaustion and cooldown deliberately allow Health to expose the unresolved failure.
        - New Scheduler targets inherit barrier and retry semantics by selecting a central profile.
        - Operators can understand dispatch, retry and deferral decisions directly in the GitHub run summary.
        - Scheduler runtime writes remain isolated from main and do not trigger product deployment.
      negative:
        - The Scheduler now depends on an additional isolated runtime-state branch.
        - Profile, state reconciliation and retry-cycle behavior increase Scheduler implementation complexity.
        - A failed target may remain unretried during its configured cooldown even if the underlying cause is fixed immediately.

  - id: ADR-034
    title: Scheduler retries require positive run evidence
    status: accepted
    context: >
      Productive validation of ADR-033 exposed a reconciliation gap: Scheduler #21
      dispatched League for a due slot and the resulting League run completed
      successfully, but a later Scheduler run did not receive that run in its
      branch-filtered workflow-run list response. The persisted scheduler state
      still proved that a dispatch request had been issued. Treating the missing
      list observation as if the prior attempt had failed caused duplicate League
      dispatches and advanced the retry counter without any observed failure run.
    decision: >
      Treat GitHub Actions run history as positive evidence for execution state and
      conclusions, not as a strongly consistent negative oracle. Scheduler runtime
      state is authoritative for the fact that a dispatch request was issued and
      for its timing. If a persisted dispatch is not visible in the primary
      workflow-run query, perform one workflow-specific repository_dispatch fallback
      query without the branch parameter and re-apply local main/event/due-slot
      matching after merging and deduplicating the responses. If the dispatch is
      still not visible, classify the target as `awaiting-observation`; absence is
      unknown state and must never increment attempts or authorize a retry. A retry
      is allowed only after an actually observed repository_dispatch run for the
      active cycle has completed with a non-success conclusion. Awaiting observation
      may block Workflow Health only within the same 20-minute anti-starvation
      window used for in-flight work. If a dispatch remains unobserved for 15
      minutes, open an observation circuit instead of issuing a blind retry; while
      that circuit is open the target does not block Health, and after the 60-minute
      cooldown a later Scheduler tick may start one fresh cycle for the then-current
      due slot.
    rationale: >
      GitHub's workflow-run list is suitable evidence when it returns a run, but the
      scheduler must remain correct if one read is temporarily incomplete. Separating
      dispatch-request evidence from run-outcome evidence makes reconciliation
      monotonic: uncertainty can delay a decision, but it cannot fabricate a failure
      or duplicate productive work. The bounded observation circuit also prevents an
      indefinitely invisible run from creating Actions spam or starving monitoring.
    consequences:
      positive:
        - A successful productive run cannot be retried solely because one list read omitted it.
        - Retry counters advance only from observed scheduler-triggered runs.
        - A second run-list path can recover branch-filter anomalies without weakening local main filtering.
        - Unknown observation is explicit in JSON logs and the Job Summary.
        - Missing observation cannot create unbounded Actions retries or suppress Health forever.
      negative:
        - Scheduler evaluation may issue a second Actions API read for targets with unresolved dispatch observation.
        - A genuinely lost repository_dispatch can wait through the observation timeout and cooldown before a fresh probe cycle.
        - Scheduler runtime semantics now distinguish retry circuits from dispatch-observation circuits.

  - id: ADR-035
    title: Health anti-starvation is measured from productive blocker age
    status: accepted
    context: >
      Productive validation after ADR-034 exposed a second Health-barrier defect.
      Scheduler #25 correctly recognized freshly started League and Games runs as
      in-flight, but Workflow Health still dispatched because its persisted Health
      due slot was several hours old. The previous anti-starvation calculation used
      that Health-slot age, so a fresh productive run could inherit an already
      expired observation window. The dispatched Health run then also exposed that
      the canonical workflow-monitoring.yaml itself was not being parse-validated
      in CI and contained invalid YAML syntax.
    decision: >
      Keep the persisted Health due slot for slot identity and deduplication, but do
      not use its age to consume the observation window of productive work that
      started later. A same-tick productive dispatch remains a hard Health blocker.
      For an already in-flight productive target, measure the bounded Health
      deferral from that run's own created/start timestamp. For
      `awaiting-observation`, measure it from the persisted scheduler dispatch time.
      Health remains deferred while at least one productive blocker is inside its
      own configured window; only when every non-hard blocker has exceeded that
      window may Health proceed. Persisting an old Health slot therefore cannot make
      newly started productive work immediately non-blocking. CI must load and parse
      the real canonical workflow-monitoring.yaml in addition to testing synthetic
      snapshot policies.
    rationale: >
      The anti-starvation limit is intended to bound how long monitoring waits for
      one unresolved productive operation, not how old the monitoring request is.
      Anchoring the limit to each blocker preserves fresh-state observation while
      still guaranteeing that a genuinely hung productive run cannot suppress
      Health forever. Parsing the actual policy in CI closes the gap that allowed a
      syntactically invalid canonical monitoring contract to merge successfully.
    consequences:
      positive:
        - Fresh in-flight productive work is observed before Health even after a long Scheduler outage or stale Health slot.
        - Truly long-running productive work still stops blocking after the configured limit.
        - Mixed blocker sets defer Health while any fresh blocker remains active.
        - Machine-readable Scheduler output exposes blocker start time and blocker age.
        - Invalid canonical monitoring YAML fails in CI before reaching the Health workflow.
      negative:
        - Health deferral semantics now depend on trustworthy run-created or dispatch-request timestamps for blockers.
        - A missing blocker timestamp is treated conservatively as still blocking until another state transition resolves it.

  - id: ADR-036
    title: Decision Windows are exact-kickoff derived read-model primitives
    status: accepted
    context: >
      Lineup-lock timing, team-specific upcoming locks and later NFL-game fantasy
      relevance need one shared relationship between NFL schedule facts and fantasy
      roster/lineup facts. Feature-local joins would duplicate provider handling,
      make exact kickoff semantics inconsistent and make historical analysis depend
      on whether the app happened to observe a game live.
    decision: >
      Define one Decision Window as one absolute NFL kickoff instant plus every NFL
      game that starts at exactly that instant. Nearby but unequal kickoff times are
      separate Decision Windows, and a rescheduled game moves to the window for its
      new kickoff. Lineup-lock progression happens at kickoff and never waits for a
      game to become Final. Decision Windows are derived App read-model facts, not a
      new source of truth and not a Viewing Slot; a later viewing feature may group
      nearby windows without changing lineup-lock semantics. The generation layer
      owns NFL-game/team/player/fantasy-team/starter association, lineup structural
      evaluation and provider normalization. Angular owns local time formatting,
      countdowns, display filtering/sorting and derives future-versus-locked
      presentation from StartsAtUtc and the current clock rather than requiring
      clock-dependent state to be persisted. The first implementation publishes a
      small provider-neutral public/data/DecisionWindows.json from the existing
      League refresh path using transitional current Schedule/Sleeper adapters; #347
      may later replace those adapters with canonical source-data inputs without a
      frontend contract redesign. Historical Decision Window/relevance facts must be
      rebuildable from persisted schedule, week-specific NFL membership and fantasy
      matchup players/starters facts. No process must run at kickoff, and no
      mandatory lock snapshot is historical source truth. Historical relevance uses
      rostered plus starter as the durable roles; transaction replay is optional only
      for a future requirement that truly needs exact intra-week ownership at a
      timestamp. Freshness for the current read model uses the existing semantic
      change timestamp infrastructure; a no-op source check must not be mislabeled as
      a data update or require a parallel checked-at field.
    rationale: >
      Exact kickoff is the real lock boundary and remains stable across unusual NFL
      schedule days without hard-coded Thursday/Sunday/Monday taxonomy. Keeping the
      cross-domain join in generation gives League Overview, Team Detail, matchup
      analysis and later My Page consumers one explainable provider-neutral contract.
      Rebuildable historical semantics preserve the repository's source-data
      philosophy and allow onboarding a league after past games were already played.
    consequences:
      positive:
        - One shared exact-kickoff contract serves all lineup-lock and later relevance consumers.
        - Simultaneous games group naturally while 16:05 and 16:25-style kickoffs stay distinct.
        - UI rollover is independent of game Final status and generator cadence.
        - Historical relevance can be regenerated without live snapshots or current-roster leakage.
        - Phase-2 canonical migration can replace adapters without redesigning Angular consumers.
        - Provider aliases and cross-domain joins stay out of Angular.
      negative:
        - The initial current implementation temporarily depends on transitional generated/live inputs until #347 migrates the consumer.
        - Historical player-to-game association must fail closed when week-specific team evidence cannot be proven.
        - Consumers must distinguish Decision Windows from any later broader viewing-slot grouping.

  - id: ADR-037
    title: Shared Data Platform separates evidence, normalized observations, shared derivations and consumer insights
    status: accepted
    context: >
      The repository has grown beyond one Angular app data pipeline. Canonical NFL
      and fantasy-league facts are already shared through source-data, while other
      potentially cross-consumer inputs such as FantasyPros/FantasyCalc rankings,
      projections and podcast transcripts/takes currently live under
      fantasy-management. At the same time, league-owned derivations such as Salary,
      SalaryProjected, Salary Cap, Standings, Awards and early player Grading logic
      are embedded in app-oriented generator scripts under public/requests even
      though Fantasy Management and future consumers may need the same values.
      Treating public/ or fantasy-management/ as the owner merely because one
      consumer first needed the data would create circular dependencies and hide the
      product's reusable domain logic.
    decision: >
      Adopt a logical Shared Data Platform with four ordered data classes:
      (1) Source Evidence preserves validated external/provider/content evidence and
      provenance; (2) Canonical / Normalized Data resolves identity, schema and
      source semantics without turning subjective observations into objective truth;
      (3) Shared Derived Data contains deterministic, reproducible, consumer-neutral
      results calculated from known inputs plus explicit/versioned domain rules; and
      (4) Consumer Data / Insights contains delivery read models and
      consumer-specific interpretation. App and Fantasy Management are peer
      consumers of the shared layers. A reusable datum must not remain owned by a
      consumer namespace solely because that consumer introduced it first.
      Subjective external sources remain attributed observations: a FantasyPros rank,
      FantasyCalc trade value or podcast take records what that named source said,
      for which format/context and at which observation/publication time. Canonical
      normalization for such data means normalized representation plus identity and
      provenance, never "the correct ranking" or "the correct opinion". Raw podcast
      transcripts are Source Evidence; normalized mentions/takes may become shared
      source observations; cross-source sentiment or consensus is a separate derived
      product. Storage and public-publishing rights are separate policies, so
      retaining source evidence never implies that full source content may be exposed
      through the public app.
      League Rules, Derived Metrics and Product Semantics are distinct concepts.
      League Rules define explicit league-owned parameters and policies; algorithms
      remain tested code and configurable parameters may be declarative/versioned.
      Shared Derived Data may include Salary, SalaryProjected, Salary Cap, Standings,
      Awards, player Grades, aggregated Dynasty rankings/trade values and other
      reproducible cross-consumer metrics. Product Semantics such as lifecycle,
      Decision Windows and Repairability may also be shared when their meaning is
      consumer-neutral. Team-/strategy-specific recommendations, roster fit,
      retention judgments, analysis and final decisions remain consumer-owned
      Insights/Decisions rather than Shared Derived Data.
      Pipeline responsibilities should converge on explicit verbs:
      acquire -> normalize/materialize -> derive -> publish. Scheduling, trigger
      frequency, freshness polling and dependency orchestration are technical
      pipeline concerns and must not be encoded as Domain Rules. A later dependency
      DAG may use these boundaries to trigger only the affected derivations.
      This ADR fixes logical ownership and boundaries, not the final physical
      repository directory names. Existing source-data/**, public/data/**,
      public/requests/**, Metadata.json and fantasy-management/** paths remain valid
      current-state contracts until separately migrated. ADR-002 remains the current
      physical owner for league-specific manual rules until an explicit rule-storage
      migration is approved.
      During #347 and similar migrations, each field/behavior must be classified
      before movement as Source Fact/Observation, Canonical/Normalized, Shared
      Derived or Consumer-only. In particular, RequestPlayers.ps1 must not be
      migrated monolithically: Salary, Grading and other league-owned derivations
      must not be materialized into source-data/nfl/** merely because the player
      source facts feeding them become canonical.
    rationale: >
      The durable product is becoming a small fantasy-football data platform with
      multiple consumers, not an Angular app whose generated files happen to feed
      other workflows. Separating evidence, normalized observations, reusable
      derivations and consumer interpretation makes ownership explicit, prevents
      consumer-to-consumer dependencies, preserves attribution for subjective
      sources, enables the App to display the same market/media/derived values used
      by Fantasy Management, and gives scheduler/orchestration work an explicit
      dependency graph rather than monolithic refresh jobs.
    consequences:
      positive:
        - App and Fantasy Management can consume the same Salary, rankings, market values, media observations and other shared data without depending on each other's output trees.
        - Provider opinions and market values retain source, context, time and provenance instead of being mistaken for objective player truth.
        - Salary, Awards, Grading and similar product logic become identifiable domain assets rather than hidden generator implementation details.
        - Consumer-neutral aggregations can be reused in UI, Operations and future products.
        - Future pipeline scheduling can follow actual dependency/freshness edges.
        - The current #347 migration gains a clear guardrail before the Players consumer is decomposed.
      negative:
        - Existing consumer-owned paths now contain recognized transitional shared responsibilities that will need staged migration.
        - A future physical data-platform layout, rule storage model and derivation registry still require separate design and migration work.
        - Rights/publication policy must be modeled independently for retained media/source evidence.


  - id: ADR-038
    title: Shared Derived Data materializes under data-derived
    status: accepted
    context: >
      ADR-037 defined Shared Derived Data logically but deliberately deferred its
      final physical repository root. PlayerWeekFantasy is the first production
      shared derivation and needs an owner that is neither source-data, public/data
      nor a consumer namespace.
    decision: >
      Use data-derived/** (renamed from derived-data/** in #788 SA) as the canonical physical repository root for deterministic,
      reproducible and consumer-neutral Shared Derived Data. PlayerWeekFantasy is the
      first product at
      data-derived/player-week-fantasy/<CanonicalLeagueID>/<season>/<week>.json.
      source-data/** remains source/canonical facts; public/data/** remains App
      delivery; consumer-generated insights remain consumer-owned. Writers must be
      deterministic and preserve semantic no-op writes. Existing transitional
      derivations are not bulk-migrated and require separate scoped migrations.
    rationale: >
      A neutral root makes ADR-037 operational without making App or Fantasy
      Management the upstream owner of a value both may consume, while keeping
      algorithmic/scoring-specific results distinct from canonical NFL facts.
    consequences:
      positive:
        - PlayerWeekFantasy has one explicit consumer-neutral physical owner.
        - Peer consumers can later reuse the same derived value without cross-consumer dependencies.
        - Source facts, shared derivations and consumer publication remain physically distinct.
      negative:
        - The repository gains a new top-level data namespace.
        - Existing transitional shared derivations remain mixed until separately migrated.
        - Each new shared-derived product still needs explicit contract and invalidation semantics.


  - id: ADR-039
    title: NFL source sync runs the repo-state identity audit after materialization
    status: accepted
    context: >
      The workflow "Data • NFL Source Sync" runs the NFL source-data regression tests before it
      materializes and publishes source-data/**. The test
      test_rebuilt_identities_do_not_regress_current_population_identity_gap compares
      persisted canonical identities with public/data/Players.json, which
      update-players.yml writes independently. When Players.json gains a player that
      the persisted identities do not cover yet, the test fails, the sync is skipped
      and the identities stay stale. CI of every PR runs the same suite and turns
      red (Issue #814, resolved once by PR #815).
    decision: >
      Run the repo-state identity audit (test_rebuilt_identities_do_not_regress_current_population_identity_gap)
      after canonical materialization instead of in the pre-materialization test
      gate. The pre-gate sets NFL_SOURCE_SYNC_SKIP_REPO_STATE_AUDIT=1 for the full
      scope only; inside the rebuild loop, after the second idempotency check and
      before the canonical commit, the workflow runs the audit against the freshly
      materialized state. PR CI does not set the variable and still runs the test.
      The remaining test_nfl_source*.py suite stays in the pre-gate, and the
      game-finality scope is unchanged. If the audit fails after materialization, no
      canonical data is published and a failure diagnostic is written. The raw
      evidence is already on main by design, so canonical data stays stale and every
      scheduled run fails until the cause is fixed; this is a permanent property of
      the design, not a transition effect. The one-time recovery for the earlier
      deadlock was an official re-materialization
      (python tools/nfl_source_data.py materialize) merged through a normal PR
      (#815), never hand-edited source-data/**.
    rationale: >
      The audit is a guard on the materialized result, not on the state before the
      job that repairs it. Verified on the stale pre-fix state (e31113c):
      materialize ran cleanly, the audit then passed, and a second materialize was a
      semantic no-op. Decoupling the test from Players.json would weaken a real
      fail-closed guard, and a dedicated recovery path or one-off workflow adds
      machinery for a recurring event. Publishing raw evidence while canonical data
      lags is no regression: before this change the same condition blocked the whole
      run including raw data.
    consequences:
      positive:
        - The self-blocking deadlock between the test gate and the sync is removed.
        - The guard keeps its fail-closed meaning for published canonical data.
        - PR CI still runs the audit unchanged.
      negative:
        - After a real audit failure raw data keeps refreshing while canonical data stays stale until fixed.
        - PR CI can stay red while main is stale until the next sync heals it.
        - The pre-gate and the post-materialization step must stay in sync; the workflow contract test test_repo_state_audit_runs_after_materialization_not_in_pre_gate guards the ordering.

  - id: ADR-040
    title: Weekly standings movement is a generated canonical field
    status: accepted
    context: >
      The Weekly Overview standings need an up/down/unchanged movement signal.
      Issue #686 proposed reconstructing the previous week's table in Angular from
      Matchups facts, Issue #565 asked for a canonical generated field. Placements.Previous
      is the previous season and cannot serve as a weekly delta source.
    decision: >
      The standings generator owns the movement (Robert, 2026-10-04, Issue #565).
      Get-PreviousWeekRegularSeasonPlaces rebuilds the table after the immediately
      preceding completed week from canonical per-week matchups with the existing
      ranking/tiebreak function and publishes PreviousWeekPlace and PlaceDelta
      (PreviousWeekPlace - Place, positive = moved up) on current-season
      RegularSeason rows. Values are null when no trustworthy comparison exists.
      The 2026-10-13 retained-week regression additionally requires a
      WeeklyMovements[] history (Week, Place, PreviousWeekPlace, PlaceDelta)
      generated from validated per-week canonical matchup facts on current-season
      RegularSeason rows. Angular selects the history entry for its displayed
      as-of week, checks Place against the snapshot, and renders null when missing.
      Current PreviousWeekPlace/PlaceDelta remain backward-compatible and are
      never misapplied to older weekly snapshots. Neither historical seasons nor
      the frontend derive new standings rankings.
      Angular only displays the value.
    rationale: >
      Ranking and tiebreak semantics stay in one place, the league size stays
      dynamic and consumers need no historical standings machinery. Rejecting
      inconsistent weekly facts (results must match Record) is preferred over
      publishing a wrong arrow.
    consequences:
      positive:
        - One canonical value for every consumer, no frontend recomputation.
      negative:
        - Standings.json and Teams.json gain two fields for the current season.
        - Issue #686 / PR #714 must switch from frontend reconstruction to this field.

  - id: ADR-041
    title: Players points and salary come from canonical stats scored with the league ScoringSettings
    status: accepted
    context: >
      Players.json fantasy points, played games and the three prior seasons were Tank01 PPR sums over
      Games.json and Tank01 past_seasons archives. Tank01 does not know the league scoring, drops games
      with missing snap counts and has ID collisions (Issue #347 D2/D3). Salary, ranking and the League
      salary cap are derived from these points.
    decision: >
      Robert decided on 2026-10-04 to switch points, history, ranking and salary together (Issue #347
      step D4). RequestPlayers.ps1 reads league-scored weekly rows from tools/players_league_scoring.py,
      which scores canonical player-stats and snap-counts with the canonical league ScoringSettings and
      resolves Players.json[].ID (Sleeper) to a CanonicalPlayerID per season. The salary formula, weights,
      ranking and cap formulas stay unchanged in PowerShell; the salary redesign concept is not part of
      this decision. The export is rebuilt per run and not committed; persisting it as a data-derived
      product needs a separate workflow approval. The Sleeper PlayerPoints gate in build.yml is the
      permanent validation of the scorer.
    rationale: >
      One scorer (tools/historical_fantasy_scoring.py) serves PlayerWeekFantasy and Players, the points
      follow the league rules instead of a provider default, and fixed Tank01 defects (missing games, ID
      collisions) stop distorting salaries. Keeping the formulas in PowerShell keeps the change a pure
      input switch with an exact shadow parity.
    consequences:
      positive:
        - Points, history, ranking and salary follow the league ScoringSettings; the Sleeper gate guards the scorer.
        - Kicker history is complete; Tank01 snap-count gaps no longer drop games.
      negative:
        - League-owned kicker salaries rise by about 41 percent and the salary cap moves by about -0.4 percent.
        - A Sleeper ID without a unique current canonical identity keeps stale published values until the identity is resolved.
        - Playoff and not yet final GameHistory games still show Tank01 PPR points.

  - id: ADR-042
    title: NFL team identity is a canonical registry keyed by abbreviation
    status: accepted
    context: >
      The app keys NFL teams by a numeric Tank01 ID in Teams.json, Players, Schedule, GameHistory,
      DecisionWindows, FantasyGameContext and WeeklyRecaps, while canonical NFL source data uses
      nflverse abbreviations. Tank01 must be removed (Issue #347), and alias handling such as LAR
      to LA was hard-wired in individual scripts.
    decision: >
      Robert decided on 2026-10-05 (Issue #347 F3, decision D) to use the canonical abbreviation as
      the app team key and to keep the old numeric IDs permanently as LegacyIDs. source-data/nfl/teams.json,
      materialized from the nflverse dataset nflverse.teams, is the registry (FranchiseID, names,
      division, ESPN logo, aliases, LegacyAppTeamID). One fail-closed resolver per language reads it.
      Cutover is staged: registry and resolvers (F3a), tolerant lookup of both key forms in Angular and the
      PowerShell joins (F3b), Teams.json from the registry (F3c), then producers one by one (F3d).
    rationale: >
      Players.json and Schedule.json are written by different workflows at different times, so a
      single-commit key switch is not possible; tolerant reading first keeps every intermediate state
      consistent. Keeping LegacyIDs avoids rewriting browser-cached archives.
    consequences:
      positive:
        - One team identity for all consumers, no provider-specific alias maps.
        - Archives with numeric IDs keep resolving.
      negative:
        - Teams.json gains LegacyIDs and the visible Rams and Commanders abbreviations change in F3c.

  - id: ADR-043
    title: Players population follows the Fantasy Management rule and identity evidence no longer comes from Players.json
    status: accepted
    context: >
      RequestPlayers.ps1 took its population from Tank01 getNFLPlayerList rows with
      sleeperBotID and the identity builder read public/data/Players.json (and its git
      history) as evidence, so Players.json fed the identities that fed Players.json
      (Issue #347 H1; 182 of 184 historical_mapping_overlap conflicts cited
      app.Players.git). Without Tank01, new players that only the persisted identity
      record links to a Sleeper ID would have had no automatic bridge. Sleeper's current
      team alone is not a population criterion because retired players keep stale teams.
    decision: >
      Robert decided on 2026-10-05 (A to C) to use one population rule for the App and
      Fantasy Management: a canonical Sleeper snapshot player with an app fantasy position
      (QB, RB, WR, TE, K) and a valid birth date belongs in Players.json when it has a
      reason: nfl_roster_current_season, nfl_draft_current_season (both need exactly one
      CanonicalPlayerID) or league_owned (incl. Taxi and IR; identity hold without a unique
      identity). While the season roster is unpublished the previous season roster is used
      and marked; without a roster the run fails closed. Team, free-agent and status fields
      come from the canonical Sleeper snapshot through the canonical team registry (ADR-042):
      TeamAbbr = TeamID = canonical abbreviation (null without a team), IsFreeAgent = no
      Sleeper team (NFL free agency, not fantasy availability), TankID removed. app.Players
      and app.Players.git.* stop being identity evidence (persisted provenance stays as
      history); the Sleeper snapshot (source sleeper.players) replaces them, and Tank01 is
      no attach key. A bounded sleeperCurrentRosterAttributeBridge attaches a new Sleeper ID
      to exactly one current nflverse roster record on exact birth date, team and position
      when unique and uncontradicted; ambiguity stays provisional or goes to adjudication.
      Implemented in #347 H1a (identity) and H1b (population, PR 887 and 891); documented in
      #347 H1c.
    rationale: >
      One rule avoids two competing definitions of a relevant player, the snapshot is fresh
      daily and matches what managers see in Sleeper, and removing Players.json from the
      evidence closes the cycle without weakening fail-closed identity handling. The
      attribute bridge is the narrow replacement for the lost Tank01 pairing.
    consequences:
      positive:
        - Players.json carries no Tank01 population claim and no provider ID.
        - Identity evidence is acyclic; new app-driven identity conflicts no longer arise.
        - Free-agent and team semantics are explicit and registry-keyed.
      negative:
        - Players without a current-season roster, draft or league reason leave Players.json (1,268 to 937 on the 2026-10-05 data, 336 removed, 5 added, none league-owned); they return automatically through a roster entry.
        - GameHistory still depends on Games.json via the canonical Tank01 ID until G3.
        - A new Sleeper player that neither nflverse nor the bridge can resolve needs adjudication.

  - id: ADR-044
    title: Players GameHistory is built from canonical NFL facts
    status: accepted
    context: >
      GameHistory in Players.json came from Tank01 boxscores in Games.json: the QBRating was wrong
      (1 of 148 values matched ESPN), points of non-final and postseason games were Tank01 PPR, snap
      and kicking fields carried Tank01 artifacts (zero Kicking blocks for non-kickers) and a few games
      were missing entirely. #347 requires that no Tank01 dependency remains (Robert, 2026-10-05,
      Decision 4: all fields stay in the contract).
    decision: >
      GameHistory is built in tools/players_game_history.py inside the players_league_scoring.py export,
      so identity resolution and the hold decision stay shared with the points. An entry exists for every
      current-season game with a canonical player-stats row or snap-counts row. Fields follow the G1 design:
      exact-fraction half-up rounding for Rating and the *Avg fields, QBRating from ESPN QBR, long gains
      from player-game-long-gains (0 for covered games without a record, null for games the dataset does
      not cover yet, negative values kept), canonical team abbreviations for all team keys while GameID keeps
      the legacy provider spelling, league-scored points for every game. QBRating, LongRush and LongReceptions
      may be null (unknown, never zero). A game whose special-teams fumble evidence is ambiguous gets no
      entry instead of a wrong zero; a player in identity hold keeps the last published GameHistory.
    rationale: >
      One scorer and one identity resolution serve points and games, canonical facts replace a provider
      object that cannot be repaired, and unknown values stay distinguishable from zero.
    consequences:
      positive:
        - No Games.json input remains in RequestPlayers.ps1; the Players workflow no longer depends on Tank01 boxscores.
        - GameHistory points follow the league ScoringSettings for every game.
        - Games Tank01 never listed (for example a player missing from its boxscore) appear and change GamesPotential and SalaryProjected for those players.
      negative:
        - Published GameHistory team keys change from numeric Tank01 IDs and LAR/WSH spellings to canonical abbreviations (LA, WAS).
        - Rating differs by 0.1 from Tank01 on exact rounding ties.
        - Games.json, RequestGames.ps1 and RequestPlayersSeason.ps1 stayed until #347 G4 and were retired there (ADR-045).

  - id: ADR-045
    title: The Tank01 game pipeline is retired; Schedule.json is the only Games-workflow output
    status: accepted
    context: >
      After G2 (Schedule.json from canonical schedule and finality) and G3 (GameHistory and points from canonical
      player-stats and snap-counts) the only remaining Tank01 use was the boxscore fetch that fed public/data/Games.json,
      which neither Angular nor Fantasy Management reads, plus the manual archive generators RequestGamesSeason.ps1 and
      RequestPlayersSeason.ps1 (Issue #347, hard rule: no Tank01 dependency may remain).
    decision: >
      Robert approved the workflow change on 2026-10-06 (decision card, G4). RequestGames.ps1 becomes
      RequestSchedule.ps1 and builds only Schedule.json from canonical facts; update-games.yml keeps its name, triggers
      (scheduler event, main push on source-data/nfl/game-finality/**) and publication class (rebuild-and-retry) and only
      calls the renamed script. Games.json, RequestGamesSeason.ps1, RequestPlayersSeason.ps1, GameScoreUtils.psm1, the
      Tank01 example payloads, the Tank01 join helpers in PlayerUtils.psm1 and all RapidAPI keys (ConfigUtils.psm1,
      config.ps1, examples) are removed. The static past_seasons/Games_<year>.json archives (about 255 MB of Tank01
      boxscores without a consumer) are removed from the tree and from the Games resource of PastSeasonsIndex.json; they
      remain recoverable from git history. Schedule_<year>.json stays an archive (regenerated, ADR-058); past_seasons/Players_<year>.json was removed
      later (Issue #999 step 7b, 2026-10-16). update-teams.yml needs no change (no Tank01 call since #347 F3c). workflow-monitoring.yaml and
      workflow-publication.yaml classifications stay valid because workflow names, triggers and publication class are unchanged.
    rationale: >
      A dead provider pipeline that needs API keys is a maintenance and security liability; keeping the workflow and its
      scheduler contract avoids a monitoring/scheduler migration for no functional gain.
    consequences:
      positive:
        - No Tank01 call, key or boxscore remains in the repository code.
        - The Games workflow no longer needs provider credentials and no longer writes Games.json or its timestamp.
      negative:
        - The leaked RapidAPI keys stay valid in git history until Robert rotates them at RapidAPI (rest of Issue #186).
        - The workflow name still says Games although it only publishes the Schedule.

  - id: ADR-046
    title: ESPN player injury status is a shared NFL source dataset
    status: accepted
    context: >
      RequestLeague fetched ESPN kona_player_info directly on every ten-minute League refresh and wrote the result only to
      DecisionWindows.json. That was the last network call under public/requests (#347 target check, 2026-10-06) and the
      observation was filtered to the current fantasy starters, so it was not reusable by other consumers.
    decision: >
      Robert approved the workflow change on 2026-10-06. tools/espn_player_availability.py snapshots the ESPN injury status of
      all returned players into source-data/nfl/player-availability/espn.json (provenance in
      source-data/providers/espn/player-availability/metadata.json); the raw 21 MB response is not retained. The new workflow
      sync-nfl-player-availability.yml (rebuild-and-retry, monitoring category important) is dispatched by the central scheduler
      every ten minutes from September through January at minute 9, before the minute-10 League refresh. RequestLeague only reads
      the canonical snapshot; a missing, unreadable or other-season snapshot leaves availability unknown. The K1 consumer-read test
      now forbids direct provider requests under public/requests.
    rationale: >
      Provider acquisition belongs to the source layer, the observation is consumer-neutral, and a dedicated thin workflow avoids
      forcing a JSON provider into the CSV-oriented NFL registry and the daily NFL sync.
    consequences:
      positive:
        - public/requests holds no provider request anymore; the League refresh no longer depends on ESPN availability.
        - Other consumers can read the same injury snapshot.
      negative:
        - One more scheduled workflow; a stale snapshot shows up as unknown availability until the workflow health alerts.
        - Outside September through January the snapshot is not refreshed.


  - id: ADR-047
    title: Satisfied slots are persisted; absence never re-opens a satisfied slot, cancelled runs are not failed attempts
    status: accepted
    context: >
      Productive observation on 2026-10-07 (Issue #927, found in the #471 analysis) showed weekly and daily targets
      such as Standings, Players and Games being dispatched dozens of times per day. A later scheduler tick did not
      receive the already successful run in its workflow-run list (same unexplained phenomenon as ADR-034), found no
      satisfying run and started a new cycle for an already satisfied due slot. Separately, runs that GitHub cancelled
      as waiting runs inside a shared concurrency group (league-source-data-sync, nfl-source-data-sync) were counted as
      attempts, which produced retry-wait, retry-exhausted and 60-minute cooldowns without any failure. A scheduler
      state file read as empty or truncated also turned a whole scheduler run red.
    decision: >
      Extend ADR-033/ADR-034: the runtime state keeps one satisfied slot per target (satisfiedSlots.<targetId> with
      dueAt, runId, recordedAt; optional map, schema version unchanged). A due slot at or before the stored dueAt is
      `satisfied` (satisfiedFromState=true in decision log and Job Summary) even when the run list does not contain the
      run; a newer due slot behaves as before. Before any dispatch decision the existing unfiltered repository_dispatch
      fallback query is run once and merged. Runs with conclusion cancelled are not counted as attempts and cause no
      retry-wait, circuit or cooldown (consistent with Workflow Health ignoring cancelled). Empty or truncated state
      content is re-read up to twice before failing closed.
    rationale: >
      Absence from a list response is unknown state and must never create work; a satisfied slot is a monotonic fact
      that is cheap to persist. A cancelled run did not execute and is no failure evidence, so counting it contradicts
      the failure-evidence rule of ADR-034.
    consequences:
      positive:
        - Weekly and daily targets run once per slot even when the run list is incomplete.
        - Shared-concurrency cancellations no longer open retry circuits.
        - A transient empty state read no longer fails the scheduler run.
      negative:
        - The state file is rewritten once per newly satisfied slot per target.
        - A genuine cancel by a person is also not retried within the same slot until the next tick dispatches normally.

  - id: ADR-048
    title: Scheduler targets are pipelines
    status: accepted
    context: >
      ADR-031 and ADR-033 gave every ten-minute League step its own scheduler target and workflow: League Core (:02),
      transactions (:05), drafts (:08) and App League (:10), plus push-triggered Standings and League rebuilds on the
      files these steps wrote. Measured on 2026-10-10 this produced about 500 runs per day, 41 cancelled waiting runs
      (all source targets share the concurrency group league-source-data-sync) and many commits on main racing each
      other (Issue #945, step S2 of Issue #471).
    decision: >
      Model one scheduler target per dependency chain instead of one per step. The target league-live
      (.github/workflows/league-live.yml, event scheduler-league-live, every ten minutes, profile productive) runs
      jobs in order: source (reusable sync-league-source-data.yml with the new materialization scope current), Standings
      (only when canonical standing inputs changed between the start of the source job and the Standings job, or when
      forced) and App League including PlayerWeekFantasy and MatchupProjections. Standings runs before League because
      League.json embeds the published Standings placement. The scope current is not a new materializer: tools/
      league_source_data.py --current-scope runs the League Core, transaction-window and draft planners in that order and
      merges their results; tests/test_league_source_current_scope.py proves identical files and semantic no-op behaviour
      against the three single scopes. The pipeline owns its concurrency group league-live without cancel-in-progress; the
      source job additionally takes league-source-data-sync so the daily full League source sync never writes in parallel.
      The former targets league, league-core-source, league-transaction-source and league-draft-source and the workflows
      sync-league-core, sync-league-transactions, sync-league-drafts and update-league are removed; update-standings.yml
      stays as weekly fallback and manual path without push triggers. The League source loop fetches and pushes through
      tools/git_transient.py so the transient retry of ADR-033-era publication helpers applies. Monitoring is one entry
      (important, repository_dispatch, 45 minutes), publication class rebuild-and-retry.
    rationale: >
      A chain whose steps depend on each other belongs in one run: one scheduler decision, one retry cycle, one monitoring
      signal, no waiting runs cancelled by a shared concurrency group and no commit race between producer and consumer.
      Single scopes stay available for manual repair so no capability is lost.
    consequences:
      positive:
        - One scheduler target and roughly one run plus the necessary commits per ten-minute window instead of four targets and push-triggered follow-ups.
        - No cancelled waiting League runs; League and Standings consume the source commit of their own chain.
        - Future chains (for example the NFL live chain, FM daily chain) follow the same pattern.
      negative:
        - A failure in an early job fails the whole chain and is retried as one cycle; the later jobs still run on the last published data so freshness degrades gracefully.
        - Changes to Standings derivation code reach production at the next input change, the weekly fallback or a manual run instead of immediately via push.
        - Code changes of the League generator reach production with the next ten-minute chain instead of an immediate push run.

  - id: ADR-049
    title: Scheduler targets can follow NFL game windows
    status: accepted
    context: >
      The Finality target ran every ten minutes from September through January (143 runs on a Saturday without a single
      NFL game, Issue #946, step S3 of Issue #471). Nothing changes between NFL games, so dense polling outside game
      windows is pure Actions and commit load.
    decision: >
      Robert approved the workflow change on 2026-10-11. A scheduler target may declare mode game-window with
      preKickoffMinutes, postFinalMinutes and idleCron in .github/workflow-schedules.json. The runtime derives game blocks
      (games with overlapping assumed durations) from the canonical NFL schedule and Eastern-time kickoffs and uses the
      target cron only inside a window (first kickoff minus preKickoffMinutes until the assumed end of the block plus
      postFinalMinutes, extended up to maxOverrunMinutes while games are not final) and the idleCron otherwise. Canonical
      finality has no timestamp, so the post-final lag is anchored on the assumed end. An unreadable schedule keeps the
      dense cron. Player availability keeps its own ten-minute target all season because injury news does not follow
      game windows. Implementation: tools/nfl-game-window.cjs, evaluated in tools/run-workflow-scheduler-runtime.cjs.
    rationale: >
      The window is derived from the same canonical schedule the rest of the platform uses, stays configuration-driven per
      target and fails towards more runs, never fewer.
    consequences:
      positive:
        - No ten-minute runs on days without games; Finality and Schedule stay about ten minutes fresh inside windows.
        - Window state is visible in the machine-readable decision and the Job Summary.
      negative:
        - A schedule change that moves a game is picked up only after the next canonical schedule refresh.
        - The post-final lag is approximated from the assumed game end because finality has no timestamp.

  - id: ADR-050
    title: NFL Live is one game-window pipeline target
    status: accepted
    context: >
      After ADR-048 the NFL finality refresh, the Games workflow (Schedule.json) and their push trigger were still separate
      moving parts: a ten-minute finality target, two daily Games slots and a push-triggered Games run that raced the source
      commits (Issue #946, step S3 of Issue #471).
    decision: >
      Replace the scheduler targets nfl-game-finality and games by one target nfl-live (workflow nfl-live.yml, event
      scheduler-nfl-live, mode game-window per ADR-049). The pipeline runs jobs in order: finality (the existing sync-nfl-source-data.yml
      game-finality scope, which also syncs the schedule snapshot without odds), schedule (update-games.yml as reusable workflow, only when
      game-finality or the canonical schedule changed between the start of the finality job and the detect job), and league (repository_dispatch
      of scheduler-league-live, only when finality changed). update-games.yml loses its push and scheduler triggers and keeps workflow_dispatch for
      repair. The wrapper sync-nfl-game-finality.yml is removed. Player Availability keeps its own ten-minute target. The pipeline owns the
      concurrency group nfl-live without cancellation.
    rationale: >
      A dependency chain belongs in one run (ADR-048): one scheduler decision, one retry cycle and one monitoring signal; a changed finality
      wakes the League chain immediately instead of waiting up to ten minutes.
    consequences:
      positive:
        - No push-triggered Games runs and no daily Games fallback runs; Schedule.json is rebuilt only when its inputs changed.
        - Finality changes reach League.json about one tick earlier.
      negative:
        - A Schedule.json publication failure fails the nfl-live run and is retried as one cycle.
        - The League Live wake-up is an additional repository_dispatch from a workflow, using the PAT_PUSH secret.

  - id: ADR-051
    title: FM Daily is one pipeline target with provider matrix legs
    status: accepted
    context: >
      The daily Fantasy Operations chain consisted of six provider refresh workflows (05:20 to 06:20 Berlin) and a
      separate materializer (06:45) with its own push-trigger loop, seven scheduler targets in total (Issue #947,
      step S4 of Issue #471). Provider commits push-triggered the materializer, and the materializer kept a
      workflow-local push loop without the transient retry of the shared publication helper.
    decision: >
      Robert approved the workflow change on 2026-10-11. One scheduler target fm-daily (workflow fm-daily.yml, event
      scheduler-fm-daily, 05:20 Europe/Berlin, profile productive) runs the six providers as matrix legs with
      fail-fast false (each publishes its own snapshot through tools/publish_generated_commit.py), then the
      materializer job after all of them (needs providers, if not cancelled), also when a provider failed, using the
      last good source state. A report job writes the per-leg results into the Job Summary and a warning annotation;
      the run stays failed when a leg failed. The materializer generator moved into
      fantasy-management/_ai/scripts/materialize_operations_inputs.sh and is published through
      tools/rebuild_and_publish.py (scope fantasy-operations), so the transient retry applies. The workflow is
      classified rebuild-and-retry (it contains a rebuild writer; the provider legs are documented self-contained
      rebase writers). Push triggers: only League/Players/Metadata/draft inputs and materialization definitions run
      the gate and materialize jobs; source and heartbeat paths are no triggers (the resolver returns
      source_inputs_refreshed_by_pipeline), and fetcher code merges no longer refresh immediately; pull requests run
      the fetcher tests only. A queued materialization never cancels a running one. The former seven scheduler
      targets and workflows are removed; monitoring has one entry (important, staleness 1800 minutes).
    rationale: >
      A dependency chain belongs in one run (ADR-048): one scheduler decision, one retry cycle, one monitoring signal,
      and no push loop between producers and consumer. The productive profile is kept because the chain is short
      (parallel legs plus one materialize job) and Health should snapshot only after it.
    consequences:
      positive:
        - One scheduler target and one monitoring entry instead of seven; the materializer follows the providers directly.
        - The materializer publication gains the transient retry of the shared helper.
        - A failing provider no longer blocks materialization, and the failure is named in the run summary.
      negative:
        - A fetcher code change reaches production at the next daily run instead of immediately after the merge.
        - The commit message of materializer commits changes to the generated-data schema (data(fantasy-operations): Fantasy Operations inputs).
        - A failed provider leg fails the whole run, so the scheduler retries the complete chain (providers use skip-unchanged).

  - id: ADR-052
    title: Transient GitHub API read errors are retried and only persistent ones fail the run
    status: accepted
    context: >
      On 2026-10-12 (10:50 to 12:50 UTC) nine REPO Scheduler runs and one Workflow Health Snapshot run failed because a
      single GitHub API read returned HTTP 5xx (Issue #980). The scheduler already isolated errors per target, but one
      failed listWorkflowRuns still turned the whole run (monitoring category critical) red, and the Health snapshot had no
      retry at all. Everything was green again at the next tick.
    decision: >
      Robert approved the workflow-adjacent change on 2026-10-13. Idempotent API reads are retried inside the run:
      transient statuses 429, 500, 502, 503, 504 and network aborts or timeouts, three retries with about 2, 5 and
      10 seconds backoff plus jitter (retry-after honoured), each logged as a warning; 401, 403, 404 and 422 fail
      immediately. JS: tools/run-workflow-scheduler-entry.cjs wraps listWorkflowRuns next to the existing state-read retry.
      Python: github_getter in tools/build_workflow_health_snapshot.py. createDispatchEvent is not retried blindly because a
      5xx does not prove non-delivery; a transient dispatch failure records no run state and the next tick relies on the
      observation logic of ADR-034 (a landed run shows up as in-flight). A read or dispatch failure that survives the retries
      gives the target the decision api-error for that tick (no dispatch, state unchanged), counted in
      runtimeState.apiErrors.<targetId>. The scheduler run turns red only when the same target hits an API error in
      apiErrorPolicy.failAfterConsecutiveTicks (2) consecutive ticks.
    rationale: >
      A short GitHub outage is infrastructure noise, not a scheduling defect, and must not page via the critical scheduler
      workflow. A persistent outage must stay visible, so repeated errors per target still fail the run. Not repeating the
      dispatch avoids duplicate productive runs.
    consequences:
      positive:
        - A single 5xx no longer produces a red Scheduler or Health run.
        - Retries and api-error decisions are visible in logs, the Job Summary and the machine-readable decisions.
        - No duplicate dispatch from retrying.
      negative:
        - A target with a transient read error is skipped for one tick, so its dispatch may be delayed by five minutes.
        - A failed dispatch whose event did arrive is only noticed through the next tick's run list.
        - Retries add up to about 17 seconds (plus jitter) per failing read.

  - id: ADR-053
    title: Workflow Health reports scheduler run volume as an informational warning
    status: accepted
    context: >
      Health evaluated only failures and staleness, so a defect that started a target far more often than planned
      (Players: 46 instead of 2 runs in 13 hours, ADR-047) went unnoticed (Issue #934).
    decision: >
      Robert approved the change on 2026-10-13. The snapshot compares, per scheduler target, the repository_dispatch runs of the last 24 hours with the
      cron slots planned in .github/workflow-schedules.json (runVolume) and lists multiple-starts and many-cancelled-runs in a
      top-level warnings array. Threshold observed > 2 x expected + 2; game-window targets use the dense cron as upper bound.
      Warnings never create incidents, never change overall and never page. Details in workflow-monitoring.yaml runEvaluation.runVolume.
    rationale: >
      Volume anomalies are an early signal but push runs, manual repeats and legitimate retries make exact counts unreliable, so the signal stays informational.
    consequences:
      positive:
        - Repeated dispatching of satisfied slots becomes visible in the snapshot.
      negative:
        - Cron evaluation exists in Python and in the scheduler (Node); both support the same simple expression subset.
        - Targets denser than 100 runs per window report a lower-bound count.

  - id: ADR-054
    title: Hand-maintained league metadata lives in data-meta per league; calculation logic is central
    status: accepted
    supersedes: ADR-002
    context: >
      Hand-maintained league inputs were spread over public/data/Metadata.json,
      public/requests/config.ps1, league defaults in ConfigUtils.psm1 and the League source
      bootstrap (source-data/leagues/_bootstrap). ADR-002 put league rules into Metadata.json,
      which mixed metadata with calculation parameters and tied them to the App delivery tree.
      With several leagues possible and Salary, Cap and Grading moving into central models
      (Issue #919), one place per league is needed that holds only what a person decides.
    decision: >
      Robert decided on 2026-10-14 (Issue #986). Everything hand-maintained about one league
      lives in data-meta/<CanonicalLeagueID>/metadata.json (plus, later, transactions-manual.json
      from Issue #999): CanonicalLeagueID, Provider, CurrentProviderLeagueID, LeagueTimeZone,
      Owners, Drafts including SleeperDraftIDs, and per season the Cap Deadline with its buffer
      and the model choice (Salary, SalaryCap, Grading). Calculation logic and model parameters
      are central and league-independent (versioned, immutable models, Issue #919); a league only
      chooses a model ID per season. Facts that are already canonical stay out of the metadata
      (LeagueYear, TeamCount, earlier provider league IDs). data-meta is written by hand only;
      no workflow or generator writes into it. Access goes through tools/league_metadata.py and
      LeagueMetadataUtils.psm1, which fail closed (missing file or season, unknown key, unknown
      model ID) and iterate all leagues. The staged migration (Issue #986): contract (step 1),
      file and loaders with a parity test (step 2), consumer switch (step 3), removal of the
      legacy owners (step 4). ADR-002 is superseded; its ownership of league inputs passes to
      this decision, its ConfigUtils/technical-path split (ADR-003) is unchanged.
    rationale: >
      Metadata (what a league is and chooses) and logic (how values are calculated) change for
      different reasons and have different owners. One file per league supports multiple leagues
      and makes the model choice per season reproducible for history.
    consequences:
      positive:
        - One hand-maintained place per league; no league metadata in public/data or technical scripts.
        - A new model version applies from a chosen season while older seasons stay reproducible.
        - Multi-league capable loaders with fail-closed validation.
      negative:
        - Until step 3 two sources exist and are kept equal only by a parity test.
        - The interim model catalogue in the loaders must move to the model registry of Issue #919.

  - id: ADR-055
    title: Salary, Ranking, Grading and Salary Cap are central versioned models with the player-valuation product
    status: accepted
    context: >
      Salary, SalaryProjected, Ranking, Grading and the League Salary Cap are computed in
      public/requests/RequestPlayers.ps1 and RequestLeague.ps1 with parameters spread over
      config.ps1, ConfigUtils.psm1 and literals. Fantasy Management keeps a copy of the curve
      and floor in its salary simulation, and its Operations/Signal builders still read Salary
      from Players.json (legacy-read-model-pending in the K1 register). ADR-038 deferred the
      migration of such transitional derivations to scoped steps; Issue #919 is that step for
      this family. The league will use more than one Salary concept over time (a redesign is
      under discussion), and more than one league can exist.
    decision: >
      Robert decided on 2026-10-14 (Issue #919): the logic is central and league-independent.
      Each derivation is a versioned model in tools/derived_data_lib/models/<kind>/v<N>.py
      (salary-v1, salary-cap-v1, grading-v1) registered in registry.py; parameters live with
      the code, never in league files. A league chooses per season which model ID applies
      through data-meta/<CanonicalLeagueID>/metadata.json (ADR-054, #986). A model is
      immutable after its first productive use; any change is a new version. Ranking is a
      deterministic order statistic in tools/derived_data_lib/ranking.py without a model ID.
      Results are stored as the Shared Derived product PlayerValuation under
      data-derived/player-valuation/<CanonicalLeagueID>/<season>/week-<NN>.json with full
      history (every season of the league manifest, every week), regenerable at any time.
      public/data stays an App delivery contract filled by consumer generators with an
      unchanged contract; FM Operations/Signals and the salary simulation read the same
      product and models. The first versions reproduce today's behaviour exactly (Robert:
      parity without rounding tolerance); the Salary redesign becomes salary-v2 later. The
      contracts are .ai-context/manual/derived-models.yaml and
      .ai-context/manual/player-valuation.yaml.
    rationale: >
      One implementation per model removes the PowerShell/Python/FM copies, makes the Salary
      concept selectable per league and season without hidden parameters, keeps old seasons
      reproducible under the model that was valid then, and gives every consumer the same
      numbers. Immutable versions turn a formula change into an explicit, reviewable event.
    consequences:
      positive:
        - Salary, Ranking, Grading and Cap have one implementation, one registry and one stored history.
        - App, Operations, Management and the simulation can no longer drift apart.
        - A redesign (salary-v2, Dead Cap) lands as a new version without touching old seasons.
      negative:
        - The full history under data-derived adds repository size; it is measured in step 3 before it is committed.
        - Identity-hold rows depend on earlier snapshot content and are the only non-rebuildable part.
        - Resolved 2026-10-15 (Robert): the legacy quirk that an unranked player is graded A was a defect and is fixed in grading-v1 itself (Grade null for unranked players); no grading-v2, one-time exception to model immutability.
        - Until the cutover (step 5) the PowerShell implementation stays the productive one and the models are covered by tests and the shadow only.

  - id: ADR-056
    title: The three data roots are data-source, data-meta and data-derived
    status: accepted
    context: >
      The data roots were named source-data, derived-data and (new) data-meta, and every module spelled the
      root names out itself (about 1,250 mentions of source-data in about 230 files). A shared prefix makes the
      three roles easy to scan and the roots sort together in the repository (Issue #788).
    decision: >
      Robert decided on 2026-10-14 (gestaffelt) and approved the merges and the foreseen workflow changes the
      same day. Step 0 centralized the root names (tools/data_roots.py, ConfigUtils.psm1 Get-DataSourceRoot,
      Get-DataDerivedRoot, Get-DataMetaRoot, tools/tests/test_data_roots.py). Step A renamed derived-data to
      data-derived. Step B renames source-data to data-source in one atomic change: git mv, the constants, every
      path in code, workflows, .github/workflow-schedules.json, tools/nfl-game-window.cjs, tests and active
      documentation. Workflow file names, scheduler target IDs, event types and contract file names that contain
      "source-data" (for example sync-nfl-source-data.yml, nfl-source-data.yaml) are identifiers, not paths, and
      stay. No compatibility layer and no double paths. Earlier ADRs and the analyses under
      fantasy-management/analyses/** are historical records and keep the path names valid when they were written
      (source-data/, derived-data/); read them with this ADR. The provenance strings inside
      data-source/nfl/identities/historical-identity-adjudications.json are persisted evidence and stay as written.
    rationale: >
      One prefix for the three data roots, one place per language that spells them out, and a single atomic
      rename keep the repository consistent at every commit. Rollback is a revert of the rename commit.
    consequences:
      positive:
        - The roots sort together and are addressed through one constant per language.
        - A further move needs one constant instead of hundreds of edits.
      negative:
        - Older ADR text and historical analyses still say source-data/ and derived-data/.
        - Sync and pipeline workflows must not run across the rename merge; the merge happens in a quiet window.

  - id: ADR-057
    title: League history (transactions and drafts) is a Shared Derived product with a slim App delivery
    status: accepted
    context: >
      Completed transactions and all drafts are rebuilt by about 4,200 lines of PowerShell in
      public/requests/utils/league and written to public/data/Transactions.json, Drafts.json and
      past_seasons/Transactions and Drafts. Those generated files feed each other (ADR-026), the
      history is not available to Fantasy Operations or Fantasy Management except through the App
      read model, Display fields are mixed into the facts, and the draft order still reads
      public/data/Standings.json (Issue #999, #183).
    decision: >
      Robert decided on 2026-10-14 (Issue #999, six-layer target of the derived-data analysis) that the full
      league history lives in data-derived. Two products, data-derived/league-transactions/<CanonicalLeagueID>/<season>.json
      and data-derived/league-drafts/<CanonicalLeagueID>/<season>.json, hold every completed transaction
      (manual overlay applied, picks resolved to canonical draft identity and pick result) and every draft
      (completed, current and open future, order, ownership, pick results, TradeHistory) of every season,
      reproducible at any time from data-source plus data-meta. They are computed together in the ADR-026
      order in one in-memory materialization by tools/derived_data_lib and written only on semantic
      difference. Presentation (DisplayStatus, Display*Key, DisplayPick, selection of current versus past files)
      belongs to the consumer generator tools/league_history_app_publish.py, which writes the App files with an
      unchanged contract; trimming App fields is a separate later step that needs Robert's approval of the
      field list. No new transaction, draft-order or ownership rule is introduced. Exact parity is proven
      by a shadow run before the cutover. The only temporary non-canonical input is the Standings placement for
      configured draft orders, replaced by the league-standings product of Issue #987. Contract:
      .ai-context/manual/league-history.yaml. Amendment (Issue #1100, CP2,
      2026-10-21): historical player display references belong to those same
      Shared Derived league-history products, not to a new identity owner or a
      join in the App consumer. Both product families carry season-aware
      PlayerRefs resolved through the existing canonical provider mappings and
      qualified NFL/profile/provider-event evidence; the transactions product
      keeps its PlayerIdentities compatibility map generated from that same
      resolver. Source names, positions and portraits are explicitly attributed,
      unknown/ambiguous player identities remain unresolved and a current
      NFL team is never projected into a historical event. ContractVersion 2
      is additive at the product level; the App delivery and Angular fallbacks
      remain unchanged until separate CP3 integration.
    rationale: >
      A reproducible history owned by one deterministic implementation removes the generated-file feedback
      loop, serves all consumers from the same facts and lets the App receive a slim, App-specific delivery.
    consequences:
      positive:
        - No generated archive is the source of any value; history is regenerated, not archived.
        - App, Fantasy Operations and Fantasy Management can read the same transactions and drafts.
        - Presentation changes no longer touch the facts.
      negative:
        - Until Issue #987 the draft order depends on the Standings placement through one explicit adapter.
        - The PowerShell implementation stays productive until the cutover step, so two implementations coexist and are held equal by the shadow test.
        - Resolved 2026-10-15 (Robert, Issue #999 step 7): after the cutover the PowerShell rebuild (RequestTransactions.ps1, RequestDrafts.ps1 and the Draft/Transaction modules in public/requests/utils/league) was removed; ADR-026's dependency order now lives in tools/derived_data_lib/league_history.py and ADR-011/ADR-026 text that names the PowerShell entry points is historical.

  - id: ADR-058
    title: Past-season Schedule archives are regenerated from canonical NFL facts every week
    status: accepted
    amends: ADR-045
    context: >
      ADR-045 left past_seasons/Schedule_<year>.json as static archives after the Tank01 generators were removed. A check
      for Issue #999 step 7b found them reproducible from data-source/nfl (schedules plus game-finality) and, in part,
      wrong: three 2024 and two 2022 kickoff times differed from the canonical facts (for example BAL@KC 2024-09-05 shown
      as 8:40p instead of 8:20p). A derived output that is generated once cannot follow later changes of the derivation
      logic or a corrected canonical fact.
    decision: >
      Robert decided on 2026-10-15 (Issue #999) that the archives are kept current by the regular runs, never generated
      once. tools/schedule_archive.py is the consumer generator; it repeats New-AppScheduleGame
      (CanonicalScheduleUtils.psm1) in Python, proves parity with the published Schedule.json through the command
      compare-current, and writes Schedule_<season>.json from the first needed season (first league season minus the
      history seasons the Salary model of that season reads, salary-v1: 3, so 2021 for the league that began in 2024; the
      value is HISTORY_SEASONS of the model, not a constant of the generator) up to the season before the current
      league season (league manifests), only on a semantic difference and fail-closed (a season that cannot be built keeps its last
      file and raises a warning). It runs in the weekly update-transactions run before the Past Seasons index refresh.
      Archives keep all game types (the records carry seasonType), team fields use canonical abbreviations (ADR-042,
      consumers resolve LegacyIDs), and the cancelled 2022 week-17 game BUF@CIN, absent from nflverse, is a visible
      hand-maintained supplement in the generator. Players_<year>.json (static Tank01 archive) was removed on 2026-10-16 (Robert, Issue #999 step 7b) after its readers
      (historical FantasyGameContext, #420; FM salary simulation, dead TankID join) no longer needed it; recoverable from git history.
    rationale: >
      One implementation of the schedule conversion per language with a parity command, no archive as input, and
      archives that follow the canonical facts instead of freezing a provider's errors.
    consequences:
      positive:
        - Schedule archives always equal the canonical facts and follow later logic changes with the next weekly run.
        - Wrong Tank01 kickoff times in the archives are corrected.
      negative:
        - The archives gain 13 postseason games per season and lose the numeric Tank01 team IDs (LegacyIDs still resolve).
        - The conversion exists in PowerShell and Python; compare-current guards against drift.

  - id: ADR-059
    title: Scope-based and risk-tiered authorization replaces file-based workflow approvals
    status: accepted
    context: >
      Historic per-file GitHub Actions approval and per-step chat stoppages slow
      authorized multi-agent delivery without addressing risks in generators or
      other non-workflow code. Existing publication and workflow monitoring
      contracts provide separately enforceable safety requirements.
    decision: >
      On 2026-10-16 the user approved authorization by defined work-package
      scope and downstream operational impact rather than filename or model.
      A clearly approved end-to-end Issue permits continuous routine scoped
      workflow changes, commits, reviews, PRs and merges, subject to required
      checks, with no further approval for each YAML or checkpoint. A single
      bounded-step approval ends at its checkpoint. Standard changes preserve
      ownership, permissions and writer scopes. Elevated effects require the
      relevant specific scope and impact authorization; critical/destructive
      effects require distinct targeted authorization even for an approved
      Issue. Unknown risk fails closed. Keep Fantasy Management qualitative
      persistence authorization, default one-off Actions prohibition, canonical
      source-of-truth and branch-publication/monitoring safety unchanged.
      The normative agent-independent rules live in
      .ai-context/manual/ai-guidance.yaml under authorizationAndRisk
      (Issue #1039).
    rationale: >
      Human attention should focus on unapproved risk or material new scope,
      while reliable agents autonomously complete already authorized work.
    consequences:
      positive:
        - Less repeated approval friction for ChatGPT, Claude and other agents.
        - Real downstream data and permission effects determine review rigor.
        - Reversible checkpoints, mandatory validation and technical safety remain.
      negative:
        - Each agent must assess actual operational impact and escalate uncertainty.

  - id: ADR-060
    title: External market, ranking, ADP, projection and roster-activity sources are shared Source Evidence under data-source
    status: accepted
    context: >
      FantasyPros, FantasyCalc, Fantasy Football Calculator, FFToday, CBS Sports and Sleeper Trending are fetched by
      Fantasy Management scripts and stored under fantasy-management/sources (Issue #988). ADR-037 says reusable
      market/media acquisition must not stay in a consumer namespace. The inventory found league context
      (actual_league_team_count) inside global observations, three raw retention styles, no CanonicalPlayerID and only
      one season-aware quality contract, while the canonical identities already map FantasyPros, CBS and Sleeper IDs.
    decision: >
      Robert approved the migration plan and the foreseen workflow changes on 2026-10-14. The six sources become
      Source Evidence in data-source. A separate registry (data-source/external-registry.json, like league-registry.json)
      describes each dataset (provider x format): domain, kind, acquisition, provider format attributes, identity provider
      key, retention, quality, season-phase policy and mandatory rights fields. Raw responses live under
      data-source/providers/<provider>/<dataset>/ with latest-with-git-history retention. Normalized provider snapshots keep
      their current layout under data-source/market/<kind>/<provider>/<format>/snapshots/<date>/ and are immutable once
      written; history is moved with git mv. A per-dataset identity.json maps (Season, ProviderPlayerID) to CanonicalPlayerID
      through provider-mappings.json, fail-closed, without name fallback, regenerable and written only on semantic change.
      Observations carry format only as provider attributes; league context such as the league team count is not written.
      Technical freshness status per provider lives under data-source/market/_status/; Fantasy Management keeps its readiness
      gate as consumer policy. Code lives in tools/external_source_data.py and tools/external_source/. Acquisition keeps
      running as matrix legs of fm-daily.yml until an App consumer exists. A challenge response of a provider is a blocked
      state, never retried and never bypassed; a dataset inactive in the current NFL phase is not requested. No App display
      without resolved rights (#190). Migration is one PR per provider with exact Fantasy Management output parity after
      path-prefix normalization. Consumers do not read provider snapshots permanently: a deterministic Shared Derived product
      data-derived/market-observations (one schema across providers, CanonicalPlayerID, full history) and central movement
      models follow; App and Fantasy Management then read only those. Podcast transcripts later go to data-source/providers,
      extracted takes and mentions (LLM output, not byte-reproducible) to data-source/media as immutable versioned
      observations, and deterministic evaluations on top of them to data-derived; storage and publication rights stay a
      separate per-dataset decision (ADR-037). Transition rule: until the market-observations cutover, Fantasy Management
      reads the moved provider snapshots directly; this read is classified as transitional in consumerReadClassification and
      removed with that cutover. Contract: .ai-context/manual/external-source-data.yaml.
    rationale: >
      One owner for consumer-neutral evidence, the same retention and identity rules as the rest of data-source, and a
      migration that keeps every historical snapshot byte-identical.
    consequences:
      positive:
        - App and Fantasy Management can read the same attributed values; Fantasy Management is no longer the hidden owner.
        - Four of six sources gain a fail-closed CanonicalPlayerID without changing provider evidence.
        - Season-phase expectations apply to every source, so preseason-only projections ending is not an error.
      negative:
        - A third registry next to registry v3 and league-registry.json.
        - FFToday and Fantasy Football Calculator stay without CanonicalPlayerID until a provider ID mapping exists.
        - Acquisition remains orchestrated by an FM-named workflow until a later split.

  - id: ADR-061
    title: NFL betting source observations remain separate from global NFL Game derived expectations
    status: accepted
    context: >
      Issue #946 separated nflverse betting columns from the schedule facts because
      live finality polling caused frequent Raw commits without an odds consumer.
      #1073 enables canonical NFL betting source observations; #1077 introduces
      a reusable global NFL Game product. Upstream games.csv changed repeatedly
      during 2026-10-16/17, sometimes ten minutes apart, while the repository
      odds snapshot was refreshed only once per normal daily source run.
    decision: >
      On 2026-10-17 Robert approved an explicit Source/Derived split: keep the
      original low-churn schedules materialization and materialize separately
      data-source/nfl/schedule-odds/<season>.json keyed by canonical GameID with
      attributed Moneyline, Spread, Total and quoted odds as nullable source
      observations; do not store derived expected scores in canonical Source.
      The shared-derived global NFL Game product is owned separately by #1077
      under data-derived/nfl-games/<season>.json, joins Schedule, Finality and
      canonical Odds, and computes ImpliedAwayPoints=(TotalLine-SpreadLine)/2 and
      ImpliedHomePoints=(TotalLine+SpreadLine)/2 (positive away spread favors home).
      It is a market expectation, not a provider exact-score forecast. The odds
      dataset stays excluded from the ten-minute game-finality materialization.
      The daily odds cadence is *provisional*: #471 owns a data-driven reassessment
      of pregame freshness versus Source/Derived publication cost, and any scoped
      refresh cadence or writer change must first pass operational impact, rollback,
      monitoring and race-safety review. This decision alone does not authorize
      changing the scheduler, publication path or live pipeline.
    rationale: >
      Betting evidence needs its own provenance and low-noise source pipeline,
      while common cross-input derivation belongs to the dedicated shared-derived
      NFL Game domain. A future consumer justifies revisiting source freshness
      rather than automatically restoring noisy ten-minute full pipeline runs.
    consequences:
      positive:
        - Historical/current source odds are normalized without being recast as model truth.
        - One consumer-neutral global NFL Game product can serve multiple future consumers.
        - Existing finality and schedule contracts remain stable.
      negative:
        - First-time canonical Odds and future NFL Game backfill add stored files.
        - nflverse latest rows have no per-game publication time or odds movements;
          historical pregame backtests need real contemporary observations.
        - More frequent odds-only sync may require future scoped scheduling/writer
          changes after #471 evaluation.

  - id: ADR-062
    title: Global NFL Game shared derivation is separately owned from Source and scheduler
    status: accepted
    context: >
      On 2026-10-17 Robert authorized a global NFL Game product and a separate
      smarter Source/Derived publishing gate. #1073 owns odds evidence and
      #471 owns scheduling and durable change gates; neither may duplicate
      the global NFL Game domain computation.
    decision: >
      #1077 owns the consumer-neutral global season-partitioned NFL Game product
      under data-derived/nfl-games/<season>.json. Inputs are only normalized
      canonical Schedule, Game Finality and Schedule Odds partitions. The product
      is keyed by Season and GameID, preserves canonical scores and Finality, and
      derives rounded market-implied team points from SpreadLine and TotalLine.
      Never include provider moneyline/price fields in this v1 product; changes
      only to those fields do not invalidate the shared game model. Missing
      entire Source Odds partitions fail closed instead of masquerading as zero
      market expectations; missing individual SpreadLine/TotalLine remain null.
      Store no fabricated historical pregame observation time. The domain builder
      is deterministic and read-only by default; workflow/publisher integration
      is owned by #471 and requires a reviewed write/rollback scope.
    rationale: >
      A versioned single-owner shared model prevents a second game predictor in
      Source or in Angular/Fantasy Management. Separating semantic valuation
      from polling and Git publication prevents bookmaker price churn from
      re-triggering unrelated NFL Live and fantasy App builds.
    consequences:
      positive:
        - Deterministic league-independent NFL game truth plus attributed market estimates.
        - Reproducible output under a completely empty Shared Derived root.
        - Pure odds price changes cause no global NFL game data diffs.
      negative:
        - A new derived output and future scheduler adapter require explicit safety validation.
        - Historical latest-line market values must not be reused as ex-ante pregame evidence.

  - id: ADR-063
    title: Weekly team awards reuse the existing App WeeklyRecaps publisher
    status: accepted
    context: >
      The existing weekly recap generator owns the App-facing editorial
      KeyGames and KeyPlayers read model. Best Manager and Best Coach are
      already canonical Shared Derived TeamWeekPerformance facts for completed
      weeks; a parallel App publisher would duplicate its ownership.
    decision: >
      Reuse RequestLeaguePublication.ps1, RequestWeeklyRecaps.ps1 and
      WeeklyRecapUtils.psm1 to project existing TeamWeekPerformance winner
      facts into public/data/WeeklyRecaps.json and historical WeeklyRecaps
      archives. Derived owns scoring, best-ball optimization and winner ties.
      WeeklyRecaps does no second calculation. Winner CanonicalLeagueRosterID
      values map to FantasyTeamID exclusively through the exact season/week
      canonical league matchup ProviderRosterID and matching final Matchups
      participants; no current owner or mutable current roster lookup.
      Missing Derived partitions remain explicitly unavailable, not zero;
      incompatible or contradictory present partitions fail closed. The
      established 2 KeyGames/3 KeyPlayers contract remains unchanged.
      Future incremental migration of those legacy calculations to Shared
      Derived retains the existing public/data WeeklyRecaps projection
      boundary and is not performed in this checkpoint.
    rationale: >
      A single existing App publisher avoids a second scheduler/writer,
      preserves source-of-truth boundaries and supplies a stable consumer
      schema while Shared Derived expands.
    consequences:
      positive:
        - One App projection and no reimplementation of Best Ball scoring.
        - Historical roster identity is joined in its original week.
        - Independent Derived backfills become visible on the next App chain
          without introducing a new publication writer.
      negative:
        - A matching Derived partition is not guaranteed for every finalized
          recap week until separately gated historical backfill finishes.
        - The current recap generator temporarily mixes legacy editorial
          calculations with shared-derived team award projection.


  - id: ADR-064
    title: Keep league-provider points and canonical NFL scoring separate with auditable reconciliation
    status: accepted
    context: >
      Sleeper League PlayerPoints and independent canonical NFL-derived
      PlayerWeekFantasy Actual sometimes disagree because provider scoring
      evidence differs. League awards and canonical player analyses answer
      different questions. Overwriting either point value, globally widening
      scoring tolerances, or duplicating divergence gates across downstream
      consumers would hide evidence or make historic awards unreliable.
    decision: >
      Retain both values in their existing authoritative sources and add one
      read-only-by-default Shared Derived player-scoring reconciliation.
      Identify a comparison by canonical league, season, week, player and
      scoring-profile fingerprint. The reconciliation output contains both
      values, null when one is absent, numerical difference and explicit
      verification status. Allow only versioned, provenance-backed, exact
      player/week/value-pair exceptions from manual data-meta policy.
      Exception publication must remain auditable and stale exceptions fail
      closed. This does not relax the normal ~0.01-point parity tolerance.
      TeamWeekPerformance uses Sleeper League matchup PlayerPoints for both
      actual starters and retrospective all-roster Best Ball; it consumes
      reconciliation only as a quality gate. PWF continues to calculate
      independent canonical NFL scores without using provider fantasy totals
      as its source of truth.
    rationale: >
      A single reconciling fact creates future consumer choice without
      merging two independent scoring facts or creating a second scorer.
      The known Caleb Williams 2025 W06 difference (#698: 19.88 League
      versus 20.38 PWF) has an explicit narrow exception, not a waiver.
    consequences:
      positive:
        - Consumers can select a scoring source and inspect provenance.
        - Unknown, stale or inconsistent scoring remains fail-closed.
        - Accepted provider differences are not disguised as exact parity.
      negative:
        - An additional Shared Derived output requires later classified,
          race-safe publication and explicit historical backfill validation.
        - Players absent from the league matchup roster cannot have
          invented Sleeper points and are marked unavailable on that side.

  - id: ADR-065
    title: Fail-closed risk-selected CI for pull requests with permanent merge result
    status: accepted
    amendedBy: ADR-067
    context: >
      The single mandatory GitHub Actions build serially executed every
      historical source replay and full market restore on every pull request,
      regardless of risk or touched dependencies. Its measured runtime was
      approximately 39 minutes, mostly in NFL identity and market restoration.
      CP1 registered existing tests and a read-only dependency impact selector;
      CP2 proved independent read-only Fast validation can complete in roughly
      2 minutes while retaining the complete legacy suite. Moving to selected
      Deep tests must never silently drop existing checks or turn a skipped
      GitHub Actions job into false evidence of validation.
    decision: >
      The existing build.yml remains the sole central PR CI entry point.
      Run Fast contract/source/PowerShell/scheduler/Angular lanes on every PR
      and execute the remaining previously required Python Fast modules from
      a strict versioned registry. Select four Deep families using a complete
      verified PR changed-file inventory plus conservative dependency closure.
      Unknown paths, newly unclassified tests, renames/deletes, API uncertainty,
      CI/selector/contract changes and broad provider or identity dependencies
      require all affected Deep families; the unchanged legacy historical build is
      invoked only by workflow_dispatch manual full validation, never
      redundantly on a pull request. CP4 additionally schedules one weekly
      read-only full audit through the existing central scheduler using the
      narrowly declared repository_dispatch scheduler-ci-full-audit event.
      The audit has one attempt per weekly slot; its strict CI gate requires
      all Fast, all Deep and the intact historical full build to succeed.
      Health monitoring separately queries repository_dispatch runs (not
      frequently generated PR runs), alerts on the first failed audit,
      checks for stale success and provides a bounded first-due grace period.
      A single job-level
      timeout-minutes-only change in an explicit allowlisted workflow may avoid
      Deep only after comparing immutable base/head YAML semantic trees;
      event, permission, command, environment or writer changes can never be
      exempted. A stable always-present CI / Merge Gate inspects every Fast,
      selector, selected and unselected Deep and conditional legacy job result;
      missing, failed, cancelled, neutral or unexpected skip outcomes fail.
      Existing independent production publication and Fantasy Management
      validation remain intact. Branch protection activation is a separate
      administrative step owned by Issue #243, and until then a named Merge
      Gate is not itself a server-enforced required check.
    rationale: >
      Risk-based execution avoids unrelated 25-minute identity replays while
      preserving full coverage of test modules previously invoked by the old
      build. A separate strict result gate prevents the GitHub Actions default
      'skipped' status from being mistaken for validated critical tests.
      The tested Deep-test union replaces the redundant old build on CI-change
      pull requests, with all four Deep suites still required on those changes.
      Explicit full manual audits preserve the original complete command chain.
    consequences:
      positive:
        - Unrelated PRs can obtain bounded read-only Fast checks without full historical restore.
        - Source, identity, scoring, market and consumer risk retains explicit Deep regressions.
        - All selector errors and unexpected job outcomes are visible and fail closed.
        - Existing scheduler, state ownership and publication writers are unaffected.
      negative:
        - More individual jobs and test registry updates are now necessary.
        - Conservative cases still incur long NFL Deep replay when needed, but
          never the redundant sequential legacy build on pull requests.
        - The historical build runs only via manual operator dispatch or
          the once-weekly CP4 scheduler audit, not automatically on PRs.
        - 'Until Issue #243 activates branch protection for CI / Merge Gate, GitHub does not make this check a server-enforced merge requirement.'
        - Periodic complete audit and performance-distribution measurement are
          follow-up checkpoints CP4 and CP6, not part of this decision.

  - id: ADR-066
    title: Effective transaction chronology is derived from provider status update
    status: accepted
    context: >
      Sleeper waiver creation may precede successful processing by a calendar day.
      The prior CreatedAt-based chronology presented pending submission as though
      it were the effective completed league move and also ordered draft ownership
      transfers and salary simulation incorrectly in that case (Issue #1117).
    decision: >
      Preserve Sleeper created and status_updated as CreatedAt and StatusUpdatedAt
      in canonical League transaction facts. Shared Derived LeagueTransactions
      computes a single principal EffectiveAt timestamp from valid positive
      StatusUpdatedAt, falling back deterministically to CreatedAt for legacy
      missing provider evidence and manual-only records; there is no wall-clock
      interpolation. Keep CreatedAt and CreatedDate only as submission provenance.
      Transaction consumers (App timeline/recent moves, draft pick trade ordering,
      Fantasy Management salary simulation) use EffectiveAt as the event timestamp.
      The additive LeagueTransactions and LeagueDrafts product schemas are v2; LeagueDrafts additionally includes season-aware PlayerRefs per ADR-057/Issue #1100.
      The existing source/canonical and derived publisher pipelines own regeneration;
      no hand-authored generated-data corrections or new workflows.
    rationale: >
      One effective event time eliminates separate consumer-specific guesses and
      prevents a previously queued waiver claim from being dated before its outcome.
    consequences:
      positive:
        - Chronological league events align with successful status transitions.
        - Manual and legacy records have an explicit deterministic fallback.
        - Submission provenance is still available for historical audit.
      negative:
        - Previously generated timelines and historical draft trade ordering may change.
        - Canonical historical sources and consumer outputs need controlled republishing.
        - A later Sleeper status_updated edit cannot reveal historical prior status
          transitions; the provider timestamp is treated as best available evidence.

  - id: ADR-067
    title: Pull requests run Core plus selected Fast blocks; Deep runs only in the audit or by manual dispatch
    status: accepted
    amends: ADR-065
    context: >
      ADR-065 kept the four Deep families (NFL identity replay, League PWF/TWP,
      market restore, consumer restore) as automatically selected pull-request
      jobs. In practice the conservative dependency closure selected most or all
      of them for any change to shared code, so ordinary pull requests still waited
      for the 25 to 40 minute historical replays. Measured in Issue #1122 (CP6.0):
      a pull request without Deep finishes in about 2.5 minutes of wall-clock time.
    decision: >
      Robert approved the scope on 2026-10-22 (Issue #1122). A pull request runs
      Core (small mandatory contracts and publication-safety tests, always) plus
      exactly the Fast blocks the selector derives from the complete verified diff:
      the four Fast families (named like the Deep categories), Angular, Scheduler
      and PowerShell. Deep never runs on a pull request. It runs in the weekly full
      audit (together with every Fast block and the legacy build), and one Deep
      category can be started individually through the workflow_dispatch input
      `scope`. Every Deep category has Fast counterparts: modules mix cheap
      deterministic cases with one expensive real-source replay, and the expensive
      case carries the `deep_only` marker (tools/ci_tier.py) that the Fast lane
      skips through CI_TEST_TIER=fast; the Deep lane and local runs execute it.
      Additional read-only persisted-state guards (identity and derived references)
      check the most common regressions in seconds. The selector stays fail-closed:
      unknown, renamed, deleted, CI or policy paths select every Fast family and
      block; the unchanged historical Deep proofs keep their safety value in the
      audit. Fast families run when their own code or dependencies change, not on
      unrelated changes. The CI / Merge Gate requires Core and exactly the selected
      Fast blocks on a pull request, forbids Deep and the legacy build there, and
      requires every Fast block, every Deep category and the legacy build in a full
      audit. A Deep recommendation is a normal dialog rule, not a gate engine (see
      ai-guidance ciMaintenance). No new writers, permissions or branch protection.
    rationale: >
      Fast feedback for normal changes and full historical proof on a regular
      cadence. A bug that only a historical replay finds is caught at the latest by
      the weekly audit, while the persisted-state guards and the cheap parts of the
      Deep modules catch the common cases in the pull request.
    consequences:
      positive:
        - Normal pull requests finish in minutes instead of waiting for historical replays.
        - Deep is never skipped silently; it is audit or explicitly dispatched, and the audit gate requires it.
        - Fast counterparts grow with each Deep-found defect class.
      negative:
        - A defect only visible in a full replay can reach main and is found by the next weekly audit.
        - Modules with a deep_only case need the marker kept current; the inventory validation checks Fast family registration but not marker coverage.
        - The Fast budget (about 3 minutes per block) and the question whether Deep parts can be extracted as Fast are working rules in ai-guidance ciMaintenance and the architecture review, not gates.

  - id: ADR-068
    title: Separate NFL regression suites from production source validation
    status: accepted
    amends: ADR-039
    context: >
      The shared NFL Source Sync workflow executed the broad test_nfl_source*.py
      suite before every production refresh, including targeted schedule-odds.
      This cost about 25 minutes in recent live runs before the source-to-derived
      transaction could proceed. ADR-067 already owns PR Fast and full Deep
      regression scheduling.
    decision: >
      Production NFL source and game-finality refreshes no longer invoke a
      regression test suite before fetching current provider data. Regression
      ownership remains with PR Core and selected Fast tests, plus periodic
      full/Deep audit or manually dispatched Deep. Runtime fail-closed guards
      remain unchanged: provider acquisition and schema validation, raw-first
      publication, canonical materialization and integrity checks, scoped
      write-set guards, repeated semantic no-op verification, and race-safe
      publication. The full-scope repository-state identity audit (ADR-039)
      still runs against the freshly materialized state before canonical commit;
      it is a data-dependent publication guard, not redundant pre-sync testing.
      No data ownership, published output schema or write destination changes.
    rationale: >
      Code regressions belong in CI, whereas live provider evidence and
      materialized canonical state require direct checks on every production run.
      A dedicated odds-only materialization scope is separate follow-up work.
    consequences:
      positive:
        - Production Source refreshes avoid the expensive duplicate pre-sync suite.
        - The live data-integrity guards and identity check remain fail-closed.
      negative:
        - Historical-only Deep regressions may be detected first by the
          periodic audit, as accepted in ADR-067.
        - Targeted Odds publishing still performs full canonical materialization
          until the independent scoped-publishing change is implemented.

  - id: ADR-069
    title: Scope intelligent Odds canonical materialization to schedule-odds
    status: accepted
    context: >
      The 10-minute intelligent Odds observer previously delegated to the
      full NFL Source materializer. The full identity, roster, draft,
      Combine and historical pipeline was rebuilt twice even for an
      odds-only update. ADR-068 separated unit regressions from runtime
      but did not address this materialization cost.
    decision: >
      Extend the existing NFL Source CLI and reusable workflow with a
      schedule-odds scope restricted to dataset=nflverse.schedule-odds
      (fixed raw source, no season argument). Reuse the full canonical
      schedule and odds builders to preserve GameID joins, validation,
      output schema and lifecycle rules. Evaluate the schedule raw
      evidence but require its canonical effective partitions to match
      previously published canonical schedules; a mismatch fails closed
      until a normal full Source Sync reconciles the schedules.
      Publish only data-source/nfl/schedule-odds/** as a scoped canonical
      writer. Keep the existing two-phase raw-first transaction,
      deterministic second semantic no-op pass, guarded path set and
      race-safe publication. Narrow the scoped materialization's Git
      input paths to schedules, odds and their producer code; unrelated
      player and league updates cannot change this output.
      The existing Source concurrency group and dependent NFL Game
      Derived publisher stay unchanged. Do not introduce a new workflow
      or another owner of canonical Odds.
    rationale: >
      Odds changes do not invalidate player identity or weekly source
      products. Reusing the canonical builders avoids second-source
      computation, while strict schedule parity prevents odds from
      referring to unpublished schedule revisions.
    consequences:
      positive:
        - The Odds-specific publish path avoids full identity/roster rebuilds.
        - The scoped writer cannot modify unrelated canonical data.
        - Unrelated updates need not trigger expensive Odds rebuild retries.
      negative:
        - Missing or stale published schedules block scoped Odds until
          reconciled by full Source Sync.
        - Odds may still queue behind the full Source publisher because
          concurrency is unchanged in this checkpoint.

  - id: ADR-070
    title: League Live refreshes the current-season Shared Derived products incrementally
    status: accepted
    amends: ADR-057
    context: >
      LeagueTransactions/LeagueDrafts were rederived only weekly while League Live rendered the App
      files every ten minutes, so the Shared Derived product lagged the App by up to a week. Best Manager
      and Best Coach (TeamWeekPerformance, ADR-063) of a just-final week appeared only with the next
      weekly run (Issue #471, measured 2026-10-25).
    decision: >
      Robert approved the plan and, as an elevated effect, this step on 2026-10-25 (Issue #471, step 3).
      The League Live league job runs tools/league_live_derived_refresh.py after the PlayerWeekFantasy
      refresh and inside the same rebuild-and-retry publication: league-transactions and league-drafts of
      the current season per league, and TeamWeekPerformance of the newest league-scored week (strict
      --require-pwf). The publication gains the prefixes data-derived/team-week-performance,
      league-transactions and league-drafts, which the weekly runs already write. No fingerprint engine,
      no new workflow, scheduler target, credential or permission. The helper is fail-soft per product
      (warning, last good file stays) so an unfinished week cannot block the App League publication;
      corrections of older weeks still arrive with the weekly runs. Fast tests: tools/tests/test_league_live_derived_refresh.py.
      Ordering amendment (Issue #471, 2026-10-29, Robert approved the workflow change): products before
      consumers. Within the publication command the derived refresh runs first, then
      league_history_app_publish.py write and RequestLeaguePublication.ps1 (WeeklyRecaps reads the fresh
      TeamWeekPerformance), and the PlayerWeekFantasy/MatchupProjections refresh last, because it takes its
      target week from the FantasyGameContext.json that RequestLeaguePublication just wrote and no consumer
      reads PlayerWeekFantasy. Guarded by tools/tests/test_league_live_derived_refresh.py.
    rationale: >
      The App and its Shared Derived source stay equally fresh using the existing materializers, with
      failure isolation and without new infrastructure.
    consequences:
      positive:
        - Product and App are equally fresh; awards of a final week are available within one tick.
      negative:
        - League Live writes three more data-derived prefixes and runs a few seconds longer; the
          runtime was measured after the merge (Issue #471).
        - A persistently unready product only shows as a warning until the weekly run fails loudly.

  - id: ADR-071
    title: One week-final definition with two milestones, computed and not persisted
    status: accepted
    context: >
      Five places used three different rules for "week final" (Issue #897). PlayerWeekFantasy accepted WeekFinal without
      a stats coverage check, so PWF week 6 (2026-10-20) and week 7 (2026-10-27) published about 20 players with false
      0 points for roughly a day, while League.json already showed the week as scored and Players and PlayerValuation
      followed about 13 hours later.
    decision: >
      Robert decided on 2026-10-29 (Variant B) and approved implementation including merges after green CI. A single
      implementation, tools/derived_data_lib/week_finality.py with the CLI tools/week_finality.py, derives per league
      week the evidence NflGamesFinal, NflStatsComplete and LeagueScored and two milestones, each an uninterrupted run
      from the first league week: LeagueScoredWeek (games final and Sleeper scored) for League, Standings and
      TeamWeekPerformance, and StatsFinalWeek (games final and stats cover every playing team) for PlayerWeekFantasy
      Actual, Players and PlayerValuation. Until stats are complete PlayerWeekFantasy keeps Actual unavailable, never
      final with 0. The result is a pure function of canonical source facts and is not persisted (no new writer).
      Matchup finality and the current/lineup week stay separate concepts. Migration in six steps, one pull request
      each, League last because it runs every ten minutes. Contract: .ai-context/manual/week-finality.yaml.
    rationale: >
      One rule removes the divergence by construction. Two milestones name the roughly 12 hour offset between the
      Sleeper scoring and the nflverse stats instead of leaving it to chance, and a computed result needs no writer.
    consequences:
      positive:
        - No consumer can publish a final week with missing team stats.
        - The wait reason (Pending evidence) becomes visible per week.
      negative:
        - Until all steps land, the legacy rules stay productive next to the new function (held equal by a parity test).
        - The coverage check is team level; a missing single player inside a covered team is not detected.
        - Leagues with weeks beyond NFL week 18 need an explicit mapping first (hard error).

  - id: ADR-072
    title: Standings, Playoffs and Awards are central versioned models with the league-standings product
    status: accepted
    context: >
      The regular-season table with tiebreaks, the playoff placements, the season awards, the all-time standing and the weekly
      movement (ADR-040) are computed by about 1,700 lines of PowerShell (StandingUtils.psm1, CanonicalStandingUtils.psm1) and
      written to public/data/Standings.json. Three consumers read that generated file back (RequestLeague.ps1 for League.json
      Standings and Placements, RequestWeeklyRecaps.ps1, and tools/league_history_sources.py for the draft order, a transitional
      read the restore gate reports as latent-blocker). The logic cannot be applied per league or per season, and a second league
      would inherit the first league's rules (Issue #987, extracted from #919).
    decision: >
      Robert decided on 2026-10-29 (Issue #987, "alles wie empfohlen") to move the derivation into central, league-independent,
      versioned models standings-v1 and awards-v1 in tools/derived_data_lib/models, registered in the model registry (ADR-055) and
      chosen per league and season in data-meta/<CanonicalLeagueID>/metadata.json (ADR-054, keys Standings and Awards). The first
      versions reproduce the PowerShell behaviour 1:1 (no new tiebreak or award rule; #964 follows as awards-v2). The result is the
      Shared Derived product league-standings, one file per league and season at data-derived/league-standings/<CanonicalLeagueID>/<season>.json
      with the weekly tables, playoffs, awards and the all-time standing through that season; there are no week files. The week basis is
      LeagueScoredWeek (ADR-071). Consumers get Standings.json, the League.json placements, the neutral team order and the draft order only
      from the product; overlay reads are for display, never for status, phase or week. The migration runs in five steps with one pull
      request each: contract, models and materializer, exact shadow parity, cutover, removal of the old code. The cutover adds the write
      prefix data-derived/league-standings/** to league-live.yml and update-standings.yml; that is an elevated effect and needs a separate
      targeted approval with impact and rollback. Contract: .ai-context/manual/league-standings.yaml.
    rationale: >
      One implementation per model removes the generated-file feedback loop, lets a league choose the rules per season and keeps
      history reproducible. A season file avoids about twenty nearly identical weekly files; the week basis follows the Sleeper results
      without waiting for nflverse stats.
    consequences:
      positive:
        - Standings, Playoffs and Awards have one implementation, one registry entry and one stored history.
        - The draft order and WeeklyRecaps no longer read a consumer output.
        - A rule change lands as a new model version without touching old seasons.
      negative:
        - Until the cutover the PowerShell implementation stays productive and is held equal by the shadow comparison.
        - v1 keeps legacy quirks (per-game values divide by the regular-season game count during the season, team join across seasons by roster ID, display strings inside results).
        - The cutover adds a write prefix for two existing writers.

  - id: ADR-073
    title: The league lifecycle is a central versioned model with a pure function, computed and not persisted
    status: accepted
    context: >
      Status, Phase, CurrentWeek, the trade and waiver state and the season boundaries of League.json are derived in
      RequestLeague.ps1 and LeagueUtils.psm1, WaiverUtils.psm1 and LeagueOverviewUtils.psm1 (Issue #1199, about 5,000
      lines of product semantics in total). The result depends on the current clock (cap deadline window, season start
      lead, next waiver run), reads the consumer outputs Drafts.json and Schedule.json instead of canonical facts, keeps
      a league rule (the 7-day season start lead) in ConfigUtils.psm1 and sorts the current week by game ID text. Fantasy
      Management reads the result back from League.json and interprets Status with its own heuristic
      (_derive_taxi_phase does not recognise In-Season, so week 1 before the first scoring resolves to unknown).
    decision: >
      Robert decided on 2026-10-30 (Issue #1199, review L1 to L5, all as recommended). The lifecycle is a central,
      league-independent, versioned model lifecycle-v1 in tools/derived_data_lib/models/lifecycle/v1.py, registered in
      the model registry (ADR-055) and chosen per season in data-meta (ADR-054, Models.Lifecycle). One pure function,
      tools/derived_data_lib/league_lifecycle.py with the CLI tools/league_lifecycle.py, resolves
      (CanonicalLeagueID, Season, AtUtc). It is computed and not persisted, following the week-finality pattern
      (ADR-071); AtUtc is an explicit input and the clock-dependent instants are returned as Boundaries. Inputs are
      only data-source (league.json, NFL schedule and game finality), the league-drafts product, week_finality and
      data-meta; public/data is never an input. v1 reproduces today's behaviour 1:1, with one allowed difference: CurrentWeek
      comes from the canonical schedule instead of Schedule.json, and the shadow comparison proves equality. Known
      quirks (CutsAllowed constant, trade deadline against CurrentWeek, UTC calendar days) stay and are listed for
      lifecycle-v2. The season start lead moves into the model. League.json keeps its contract and the MetaTexts stay in the
      consumer. There is no new writer, write prefix, workflow change or product directory. A persisted lifecycle history
      (data-derived/league-lifecycle) is rejected for now: it would need a new write prefix, would store only boundaries
      and not the state, and no consumer needs "phase at date X". Contract: .ai-context/manual/league-lifecycle.yaml.
    rationale: >
      A time-dependent state belongs in a function whose clock is an input, as Decision Windows store instants and compare
      when reading (ADR-036) and as week finality is computed (ADR-071). Reading canonical facts removes the
      consumer-output feedback loop, the model choice per season keeps older seasons reproducible and one function lets
      App and Fantasy Management share the same Status without a second interpretation.
    consequences:
      positive:
        - One implementation of Status, Phase, current week, trade and waiver state for every consumer.
        - Testable with constructed seasons and a fixed AtUtc; no hidden clock.
        - Fantasy Management no longer interprets League.json Status with its own heuristic.
        - No new writer or permission; all steps are risk level standard.
      negative:
        - Until the cutover (step 4) the PowerShell implementation stays productive and is held equal by the shadow comparison.
        - RequestLeague.ps1 gains a Python process call in the ten-minute League Live run (measured in step 4).
        - Known v1 quirks stay visible until a lifecycle-v2 is decided.
