schemaVersion: 1
domain: team-week-performance
status: validated-core-pending-controlled-materialization
trackingIssue: 355

purpose: >
  Consumer-neutral, reproducible fantasy Team/Week performance facts and
  weekly Best Manager/Best Coach leaders. Shared Derived Data is the owner;
  WeeklyRecaps/Overview, Team History, Season Awards and Fantasy Operations are
  downstream consumers. No Angular or frontend-owned recalculation is allowed.

physicalOwner:
  pattern: data-derived/team-week-performance/<CanonicalLeagueID>/<Season>/<Week:02d>.json
  producer:
    calculation: tools/team_week_performance.py::build_team_week_performance
    persistence: tools/team_week_performance.py::save_team_week_performance
    optimizer: tools/weekly_lineup_optimizer.py::maximize_lineup
    canonicalInputAdapter: tools/team_week_performance_sources.py::load_verified_week_inputs
    lineupEligibilityBridge: public/requests/utils/league/ExportWeeklyPerformanceSlots.ps1
  status: writer-implemented-but-not-yet-orchestrated
  delivery: >
    An App publisher/read-model projection must be separately implemented.
    No scheduled workflow or public/data output has been changed in this
    checkpoint. This is NOT yet a populated production dataset.

identity:
  root:
    - CanonicalLeagueID
    - Season
    - Week
    - ScoringProfile.SettingsHash
    - LineupDefinitionHash
    - ContractVersion
  team:
    - CanonicalLeagueRosterID
  player: CanonicalPlayerID
  separation: >
    Franchise/roster performance is a team fact. Historical manager/owner
    attribution is a downstream season-appropriate identity join; current
    owner names and mutable Sleeper IDs must not be treated as durable identity.

inputs:
  sourceRosterAndScores:
    owner: data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/matchups/week-<Week>.json
    fields:
      - CanonicalLeagueRosterID
      - Week
      - Players
      - Starters
      - PlayerPoints
      - StarterPoints
      - Points
    semantics: >
      Every player appearing in a team's canonical week Players array is
      a hypothetical candidate, including Starter, Bench, Taxi and IR/Reserve.
      A player must not appear for two teams in the same week. Per ADR-036,
      the canonical weekly matchup Players list is the authoritative
      week-scoped fantasy ownership pool. No intraweek transaction replay or
      per-NFL-kickoff roster snapshot is required by these awards; this is
      explicitly a retrospective WEEK-POOL metric, not evidence of precise
      minute-by-minute acquisition eligibility. Historical ownership is
      not inferred from a current roster snapshot.
  expectedTeamPopulation:
    owner: data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/league.json::Settings.num_teams
    requirement: >
      A final week must contain exactly the historical season's configured
      number of fantasy team matchup rows, with unique CanonicalLeagueRosterIDs.
      Partial team-week populations fail closed before leaderboard calculation.
  lineupDefinition:
    owner: data-source/leagues/<CanonicalLeagueID>/seasons/<Season>/league.json::RosterPositions
    constraint: >
      Caller supplies slot IDs and allowed natural positions via the existing
      FantasyRelevance slot eligibility semantics. The Python performance
      calculator contains no copied hardcoded FLEX/SUPER_FLEX/REC_FLEX rule map.
      2024 WRRB_FLEX/REC_FLEX and 2025/2026 FLEX configurations must be tested.
  historicalFantasyPositions:
    requirement: >
      For ALL candidate CanonicalPlayerIDs, caller must provide a verified
      week-appropriate fantasy position. The source adapter first checks
      data-source/nfl/weekly-rosters/<season>/<week:02d>.json::Records.
      Missing target-week positions can use canonical NFL weekly roster
      partitions strictly earlier in the same season (consistent position
      required), then the same-season NFL roster only when Finalized=true.
      When still missing, earlier NFL season roster partitions may be used
      only if Finalized=true, CanonicalPlayerID matches, and every earlier
      finalized season containing that ID agrees on its Position. Future
      seasons and nonfinalized rosters are never eligible as fallback evidence.
      Evidence remains traceable to canonical NFL season/year source partitions;
      no current Sleeper platform profile is backdated. Conflicts or missing
      positions fail closed, including for bye/IR/Taxi players.
  finality:
    requirement: >
      Producer must verify finality independently from canonical NFL
      game finality and the league's scored-week state (canonical league
      WeekStructure.LastScoredLeg); the source adapter reuses the existing
      player_week_fantasy_materialize._week_finality reader before passing
      finalized=True and concrete finality_evidence. The builder checks this
      explicit gate but does not itself verify the asserted source.
      Simply having non-null PlayerPoints or a week-N source file is NOT
      finality. Historical 2024/2025 Matchups archives currently show
      missing/unknown finality and require a separate backfill gate.
  scoring:
    owner: Shared canonical fantasy scoring / league-scored weekly facts
    currentEvidence: canonical league matchup PlayerPoints and StarterPoints
    fingerprintImplementation: tools/player_week_fantasy.py::build_scoring_profile_identity
    rule: >
      Do not implement a new player scoring engine. ActualStarterPoints is
      calculated from the recorded StarterPoints values; the provider's
      Points is retained separately as OfficialMatchupPoints because manual
      commissioner adjustments may be distinct from player production.
      Reconcile against finalized Shared PlayerWeekFantasy Actual where
      available before approving production backfills.

contract:
  version: 1
  topLevelFields:
    - ContractVersion
    - CanonicalLeagueID
    - Season
    - Week
    - ScoringProfile
    - LineupDefinitionHash
    - FinalityEvidence
    - Teams
    - Awards
  teamFields:
    - CanonicalLeagueRosterID
    - ActualStarterPoints
    - OfficialMatchupPoints
    - PotentialPoints
    - EfficiencyPercent
    - MissedPoints
    - OptimalLineup
    - UnfilledSlotIDs
  awardsFields:
    - BestManagerRosterIDs
    - BestCoachRosterIDs
  formulas:
    potential: Maximum sum of actual weekly points assignable to the given position-constrained lineup slots from the entire fantasy roster
    efficiency: ActualStarterPoints / PotentialPoints * 100 when PotentialPoints > 0, otherwise null
    missed: PotentialPoints - ActualStarterPoints
    managerWinner: Highest unrounded positive PotentialPoints, all exact ties retained
    coachWinner: Highest unrounded non-null EfficiencyPercent, all exact ties retained
  precision: >
    Calculate in Decimal. Publish point and percentage values rounded to
    4 decimals, half up. Determine ties from unrounded scores.
  hypotheticalPolicy: >
    This is an All-Roster Potential metric, NOT proof of the best practically
    attainable legal in-week lineup. It hypothetically permits IR/Reserve and
    Taxi players to fill a slot, without simulating their real activation
    constraints, cuts or irreversible roster moves.
  edgeCases:
    - For hypothetical Best-Ball v1, any slot may be left empty for zero; a negative-score player is never mandatory in the theoretical optimum. This intentionally differs from submitted-lineup legality and is not a replay of Sleeper rules.
    - ActualStarterPoints includes all real started negative values; official commissioner-adjusted Points remain distinct. A team with PotentialPoints <= 0 has null efficiency, cannot win Best Coach; no Best Manager winner when the maximum is <= 0.
    - Missing/invalid positions, scores, team identities, historical league team counts and incomplete starter evidence fail closed.
    - Every actual starter must be assignable injectively to a historical legal slot; actual starter production must not exceed the theoretical all-roster maximum. Commissioner-adjusted official Points are recorded separately.
    - Empty slots score zero instead of negative candidate scores: approved v1 theoretical potential semantics, not a claim about an actually submitted lineup.
    - A nonpositive PotentialPoints yields null EfficiencyPercent; no award winners when the league maximum is zero.
    - All exact tied winner roster IDs are kept; consumers must not silently select a favorite.

recomputation:
  triggers:
    - canonical week Players/Starters/PlayerPoints/StarterPoints/Points correction
    - historical position or ownership correction
    - League season RosterPositions/eligibility rule change
    - League season ScoringSettings hash change
    - season/week finality correction
    - contract/algorithm version change
  persistence: >
    Stable JSON key ordering, no generation-time timestamp, byte-identical
    semantic no-op. Recalculate and publish only after all input requirements
    hold; historical awards can change with legitimate canonical corrections.
