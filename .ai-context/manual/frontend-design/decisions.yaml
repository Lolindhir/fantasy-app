schemaVersion: 1
status: active
purpose: >
  Canonical decision log for durable frontend design-governance and app-wide design
  decisions. Use this file to retain why a rule or structural choice exists and how
  later decisions supersede it.

decisionStatuses:
  proposed: Not yet accepted as canonical.
  accepted: Current canonical decision.
  superseded: Replaced by a later decision.
  rejected: Considered and intentionally not adopted.

decisionRecord:
  requiredFields:
    - id
    - status
    - title
    - decision
    - rationale
    - consequences
  optionalFields:
    - date
    - alternatives
    - references
    - supersedes
    - supersededBy

decisions:
  - id: FD-001
    status: accepted
    title: Use layered frontend design governance
    decision: >
      Store durable app-wide frontend design governance under
      .ai-context/manual/frontend-design/ with a canonical index and separate
      principles, architecture, standards and decisions files. Normative standards
      use MUST, SHOULD and MAY strength so later design reviews can distinguish
      violations from recommendations and allowed options.
    rationale: >
      Frontend design knowledge is expected to grow beyond one visual-language file.
      Separating directional guidance, structural design architecture, auditable
      rules and rationale keeps the contract scalable and reviewable while avoiding
      a single mixed document of hard requirements, recommendations and hypotheses.
    consequences:
      - Frontend/UI/UX work must enter through frontend-design/index.yaml and follow its reading order.
      - App-wide design audits can evaluate documented standards without treating all design prose as equally binding.
      - Concrete design rules can be added incrementally without requiring an app-wide restyle.
      - "GitHub Issue #436 remains the discovery and rollout anchor while promoted durable rules move into this directory."
    references:
      - "#436"
      - "#497"
      - "#531"

  - id: FD-002
    status: accepted
    title: Separate visual channels for separate semantics
    decision: >
      Represent natural player position, roster role, lifecycle/temporal state and
      exceptional problem/review state through distinct visual channels that may
      compose together instead of overloading one color, chip or icon system.
    rationale: >
      These meanings are independent and can coexist for one player. A single
      overloaded channel makes dense rows ambiguous and causes position, activity
      and problem semantics to drift between features.
    consequences:
      - Natural position keeps its established position-color language.
      - Role and roster placement may use compact semantic shorthand.
      - Lifecycle state uses the canonical lifecycle color family.
      - Problem/review modifiers remain distinguishable from ordinary activity.
      - Shared primitives should centralize mappings instead of introducing feature-local alternatives.
    references:
      - "#436"
      - "#497"

  - id: FD-003
    status: accepted
    title: Responsive width changes density, not product meaning
    decision: >
      Treat responsive variants of the same product surface as one semantic
      contract. Mobile and desktop keep the same selected entities, ranking and
      meaning; additional width may reveal richer metadata, spacing or parallel
      composition without adding semantic categories merely to fill space.
    rationale: >
      Users should not receive a different prioritization model because their
      viewport changed. Width is a presentation constraint, not a source of new
      product semantics.
    consequences:
      - Responsive reviews compare semantic parity before visual density.
      - Compact surfaces may delegate detail through progressive disclosure.
      - Desktop can become richer without changing selection or ranking rules.
    references:
      - "#436"
      - "#507"
