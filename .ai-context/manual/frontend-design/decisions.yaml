schemaVersion: 1
status: active
purpose: >
  Canonical decision log for durable frontend design-governance and app-wide design
  decisions. Use this file to retain why a rule or structural choice exists and how
  later decisions supersede it.

decisionStatuses:
  proposed: Not yet accepted as canonical.
  accepted: Current canonical decision.
  superseded: Replaced by a later decision.
  rejected: Considered and intentionally not adopted.

decisionRecord:
  requiredFields: [id, status, title, decision, rationale, consequences]
  optionalFields: [date, alternatives, references, supersedes, supersededBy]

decisions:
  - id: FD-001
    status: accepted
    title: Use layered frontend design governance
    decision: >
      Store durable app-wide frontend design governance under
      .ai-context/manual/frontend-design/ with a canonical index and separate
      principles, architecture, standards and decisions files. Normative standards
      use MUST, SHOULD and MAY strength so later design reviews can distinguish
      violations from recommendations and allowed options.
    rationale: >
      Frontend design knowledge is expected to grow beyond one visual-language file.
      Separating directional guidance, structural design architecture, auditable
      rules and rationale keeps the contract scalable and reviewable while avoiding
      a single mixed document of hard requirements, recommendations and hypotheses.
    consequences:
      - Frontend/UI/UX work must enter through frontend-design/index.yaml and follow its reading order.
      - App-wide design audits can evaluate documented standards without treating all design prose as equally binding.
      - Concrete design rules can be added incrementally without requiring an app-wide restyle.
      - "GitHub Issue #436 remains the discovery and rollout anchor while promoted durable rules move into this directory."
    references: ["#436", "#497", "#531"]
  - id: FD-002
    status: accepted
    title: Separate visual channels for separate semantics
    decision: >
      Natural position, lineup/roster role, lifecycle state and problem/review state
      are distinct meanings and must not be collapsed into one visual channel.
    rationale: >
      The app repeatedly needs to show several simultaneous facts about the same
      player. Independent channels preserve scanability and prevent colors, chips or
      icons from changing meaning across surfaces.
    consequences:
      - Natural position keeps its established position-color language.
      - Lifecycle colors follow the canonical neutral/blue/green/red/amber semantics.
      - Role/state iconography may coexist with position without replacing it.
      - Shared primitives should expose these meanings independently rather than encode one compound status.
    references: ["#436", "#497", "#509"]
  - id: FD-003
    status: accepted
    title: Responsive width changes density, not product meaning
    decision: >
      Mobile and desktop variants of the same surface preserve product meaning,
      ranking and selected entity set. Additional width is used for richer metadata,
      spacing and parallel composition rather than silently adding semantic breadth.
    rationale: >
      Responsive design should adapt presentation without making one viewport a
      materially different product or changing which entities the user is being told
      matter.
    consequences:
      - Responsive reviews compare semantic parity as well as visual containment.
      - Feature-specific deviations require an explicit product contract.
      - Desktop may expose more metadata for the same entities without introducing extra ranked entities solely to fill space.
    references: ["#436", "#500"]
  - id: FD-004
    status: accepted
    title: Preserve NFL-team identity across player-identity density
    decision: >
      Portrait-based player identity keeps NFL-team affiliation visible, but does not
      require one universal portrait-overlay composition. Comfortable layouts may
      show the NFL-team mark separately. Constrained layouts use an integrated mark
      when the team identity would otherwise be omitted; the established compact
      default is a small lower-right logo overlay on the portrait.
    rationale: >
      The user needs NFL affiliation to remain recognizable in compact player
      identity, while forcing an overlay on roomy layouts would add an unnecessary
      composition constraint rather than serving the underlying orientation goal.
    consequences:
      - Separate portrait and NFL-team-logo presentation is compliant when space comfortably supports both.
      - A compact surface must not drop NFL-team identity merely to save space when portrait identity is retained.
      - Design audits flag the missing team identity or missing constrained fallback, not the absence of an overlay on roomy layouts.
      - Shared PlayerIdentity work should support both separate and integrated density variants.
    references: ["#436"]
