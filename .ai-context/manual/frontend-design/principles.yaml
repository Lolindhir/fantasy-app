schemaVersion: 1
status: active
contentStatus: scaffold
purpose: >
  Canonical home for durable app-wide frontend design principles. Principles guide
  judgment and trade-offs but are intentionally less mechanically enforceable than
  standards.

principles: []

principleRecord:
  requiredFields:
    - id
    - statement
    - rationale
  optionalFields:
    - scope
    - implications
    - examples
    - counterExamples
    - references
    - supersedes

promotionPolicy:
  - Add a principle only after it is intentionally accepted as app-wide guidance.
  - Keep hypotheses and one-off screen feedback in the relevant GitHub Issue until promoted.
  - If a principle becomes objectively reviewable, encode the enforceable part as a standard instead of relying on prose alone.
