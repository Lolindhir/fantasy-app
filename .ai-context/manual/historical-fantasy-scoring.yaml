schemaVersion: 1

domain: historical-fantasy-scoring
status: accepted-phase1-hardening

decision:
  id: ADR-033
  acceptedAt: 2026-09-07
  title: Historical fantasy scoring is derived from persisted NFL facts plus an explicit League scoring profile
  context: >
    Phase 1 must preserve enough historical NFL evidence to recompute fantasy points
    deterministically under the scoring rules of a selected League season. Provider
    fantasy-point totals are useful for validation, but they are not canonical facts.
  decision: >
    Persist raw/statistical NFL facts in source-data, persist League scoring settings
    with the canonical League season, and derive historical/what-if fantasy points at
    evaluation time. Historical source gaps fail closed and are never interpreted as zero.
  consequences:
    - NFL fact storage remains independent from any one fantasy platform scoring model.
    - The same historical NFL facts can be re-scored under different explicit League profiles.
    - Missing historical partitions block readiness instead of silently changing player scores.
    - Provider-computed fantasy totals may be compared as secondary validation evidence only.

canonicalLeague:
  currentCanonicalLeagueID: nfl-reise
  identityRule: >
    CanonicalLeagueID is manually issued by fantasy-app and remains stable across seasons;
    it is not derived from the display name or from a seasonal Sleeper league_id.
  migration:
    retiredCanonicalNamespace: cl-220306ac3f9b480fa865e124098d8f56
    replacementCanonicalNamespace: nfl-reise
    providerLineagePreserved: true
    providerEvidenceRule: >
      Sleeper league_id and previous_league_id remain preserved as provider evidence and
      discovery lineage. They do not become canonical IDs.
    legacyAcceptanceSnapshotRule: >
      league-source-data.yaml productiveAcceptance acceptedAt 2026-09-04 records the
      pre-hardening Phase-1B acceptance snapshot. Its old cl-* canonical ID is historical
      evidence, not the current canonical League identity after ADR-033/#373.

factOwnership:
  nflFacts:
    owner: source-data/nfl/**
    relevantDatasets:
      - source-data/nfl/player-stats/**
      - source-data/nfl/special-teams-fumble-events/**
      - source-data/nfl/rosters/**
      - source-data/nfl/weekly-rosters/**
      - source-data/nfl/snap-counts/**
    rule: >
      Store provider-independent facts and evidence required for later derivation. Do not
      bake League scoring settings or provider fantasy-point totals into canonical NFL facts.
  leagueScoringProfile:
    ownerPattern: source-data/leagues/<CanonicalLeagueID>/seasons/<season>/league.json
    field: ScoringSettings
    rule: >
      ScoringSettings is an explicit input profile for a scoring calculation. It is League
      configuration evidence, not NFL fact storage.

historicalCoverage:
  rosters:
    startSeason: 1999
  weeklyRosters:
    startSeason: 2002
  playerStats:
    startSeason: 1999
  specialTeamsFumbleEvents:
    startSeason: 1999
    completenessRule: >
      Every historical scoring week must have WeekFinal=true in persisted
      game-finality evidence before zero-by-absence is valid. Every such week requires
      a canonical special-teams-fumble-event partition whose Finalized value matches
      WeekFinal. Records=[] is explicit zero. Exact upstream-unavailable weeks may be
      explicitly adjudicated for readiness but remain Finalized=false and unknown for
      affected player-games; every other WeekFinal=false or missing finalized partition
      fails readiness.
    knownUnavailableWeeks:
      - season: 2000
        week: 3
        missingGameID: 2000_03_SD_KC
      - season: 2000
        week: 6
        missingGameID: 2000_06_BUF_MIA
    knownUnavailableRule: >
      nflverse-pbp-internal states these are the only two schedule games whose PBP
      was never acquired and that nflfastR skips them. This adjudication permits the
      global readiness inventory to distinguish a bounded known source gap from an
      accidental missing partition; it does not authorize zero scoring for those games.
    identityRule: >
      Historical event records require CanonicalPlayerID; unresolved historical
      GSIS identities fail readiness closed.
  snapCounts:
    startSeason: 2012
  currentSeasonAvailabilityRule: >
    A dataset whose registry contract says current-season-may-be-unavailable may persist an
    explicit not-yet-available state only for the current season.
  historicalAvailabilityRule: >
    A missing or unavailable season inside a supported historical band is a hard readiness
    failure. Historical 404/unavailable/missing never means zero.

scoringContract:
  implementation: tools/historical_fantasy_scoring.py
  defaultLeague: nfl-reise
  providerFantasyTotals: validation-only
  playerScoringRule: >
    Individual player scoring is event-first rather than position-whitelisted. A kicker may
    score passing/rushing/receiving events, a skill player may score return/defensive events,
    and position is used only for explicitly position-specific Sleeper bonus settings.
    Team-defense-only settings are classified separately and are not applied to player rows.
  rawFieldRules:
    passingInterceptions: passing_interceptions
    fumbles: fumbles_total
    fumblesLost: fumbles_lost_total
    defensiveFumbleRecoveries: def_fumbles
    fumbleRecoveryTouchdowns: fumble_recovery_tds
    defensiveForcedFumbles: def_fumbles_forced
    defensiveInterceptions: def_interceptions
    defensiveSacks: def_sacks
    defensiveTouchdowns: def_tds
    specialTeamsPlayerTouchdowns: special_teams_tds
    puntReturnYards: punt_return_yards
    kickoffReturnYards: kickoff_return_yards
    patMade: pat_made
    patAttempts: pat_att
    fieldGoalsMade: fg_made
    fieldGoalAttempts: fg_att
    fieldGoalMadeDistance: fg_made_distance
  derivedRules:
    - Sleeper fum_rec is not reconstructed from offensive own/opponent recovery counters for an individual player; player fum_rec uses the defensive/IDP recovery fact def_fumbles.
    - Sleeper st_td is an individual Special Teams Player TD and maps to special_teams_tds.
    - Sleeper st_ff counts canonical SpecialTeams forced-fumble events for the individual player.
    - Sleeper st_fum_rec counts canonical SpecialTeams fumble-recovery events only when RecoveryTeam is the opponent of the single unambiguous FumbledTeams value; own-team recoveries do not score and ambiguous recovery relations fail closed.
    - Active st_ff/st_fum_rec require a present Finalized=true canonical special-teams-fumble-event week partition before zero-by-absence is valid.
    - PAT misses are pat_att minus pat_made so blocked attempts remain represented as misses.
    - Aggregate field-goal misses are fg_att minus fg_made.
    - Made field goals use nflverse distance buckets through 60+; fgm_50p combines 50-59 and 60+.
  failClosedUnsupported:
    - >
      Active Special Teams Solo Tackle remains unsupported because canonical source evidence
      does not yet identify that event by special-teams unit. It must not be inferred from
      generic tackle counters.
    - >
      Non-zero distance-specific missed-field-goal scoring remains unsupported until reliable
      raw miss-distance evidence including blocked attempts is available. The scorer must
      reject such a profile rather than fabricate a result.
    - >
      Any other active player-applicable Sleeper scoring key without an explicit canonical
      mapping is reported as UnsupportedNonZeroSettings instead of being silently ignored.

readinessContract:
  implementation: tools/source_data_readiness.py
  historicalBandOwner: tools/nfl_source_data_lib/history.py
  persistedAudits:
    - source-data/audits/nfl-source-data-readiness.json
    - source-data/audits/league-source-data-audit.json
    - source-data/audits/source-data-storage-audit.json
  readyForHistoricalScoringRule: >
    Every historical season in every declared support band must have persisted raw evidence
    and complete canonical materialization. For special-teams-fumble-events, completeness is
    week-exact against persisted game-finality: every WeekFinal=true week must exist including
    explicit Records=[] zero partitions, canonical Finalized must match WeekFinal, and historical
    event identities must be resolved. WeekFinal=false blocks readiness unless it is one of the
    exact documented upstream-unavailable exceptions; such exceptions remain non-final/unknown
    for affected player-games and never become zero evidence. Current-season not-yet-available
    evidence does not satisfy a historical partition and does not create a historical failure
    by itself.
  leagueRule: >
    Every configured CanonicalLeagueID must have a manifest and the required per-season core
    files. The productive hardening target is the nfl-reise namespace.

parityValidation:
  implementation: tools/historical_fantasy_scoring_parity.py
  comparisonRule: >
    Compare canonical League PlayerPoints against points re-derived from canonical NFL
    player-stats plus finalized special-teams-fumble-event evidence. League player-weeks
    without a canonical player-stat row may be skipped only when League PlayerPoints is zero;
    a missing canonical stat row with non-zero League points is a hard parity defect.
  tolerance: 0.01
  providerDivergenceRule: >
    A residual difference backed by different underlying provider raw facts is reported as
    an explicit provider-stat divergence. Provider fantasy totals are validation evidence only
    and never overwrite canonical NFL facts to force parity.

projectionBacktest:
  issue: 697
  implementation: tools/historical_projection_backtest.py
  v1:
    model: current-season-ppg
    formula: mean(prior confirmed played-game fantasy points in the same season)
    leakageRule: >
      Projection for target week W may use only outcomes from weeks < W. Target-week
      participation is allowed only to define whether a historical player-game belongs
      to the evaluation population; target-week stats, fantasy points, snaps and injury
      state are never model features.
    participation:
      qbRbWrTeFb: OffenseSnaps > 0
      kicker: SpecialTeamsSnaps > 0
      missingSnapEvidence: unknown-and-excluded
    coldStart: >
      Week 1 and any later first confirmed appearance with no prior played game receive
      no V1 projection. Cold start is not represented as zero.
    byeDnp: >
      A week without confirmed position-appropriate participation is not a player-game
      observation for V1.
    injury: no-explicit-adjustment-in-v1
    seasonState: reset-before-week-1
    metrics:
      - MAE
      - RMSE
      - Bias
      - MeanProjection
      - MeanActual
      - breakdown-by-position
      - breakdown-by-target-week
      - breakdown-by-prior-games
    acceptedBaseline:
      scoringProfile: nfl-reise-2025
      seasons:
        - 2024
        - 2025
      weeks: 1-18
      predictionCount: 11361
      mae: 4.6471
      rmse: 6.4724
      bias: -0.2951
      season2024:
        predictionCount: 5637
        coldStarts: 629
        missingParticipationEvidence: 6
        mae: 4.6664
        rmse: 6.4847
        bias: -0.4016
      season2025:
        predictionCount: 5724
        coldStarts: 641
        missingParticipationEvidence: 13
        mae: 4.6282
        rmse: 6.4603
        bias: -0.1902
      interpretation: >
        V1 is an accepted transparent baseline, not the final projection model. Early
        weeks are weaker (combined Week-2 MAE 5.5087) and QB is the weakest major
        position group (MAE 6.4903), providing the benchmark for shrinkage/baseline
        variants in the next checkpoint.

  v2:
    implementation: tools/historical_projection_v2_calibration.py
    model: shrunk-current-season-ppg
    formula: Projection = CurrentSeasonPPG * w + PositionBaseline * (1 - w)
    weight: w = PriorGames / (PriorGames + k)
    calibration:
      scoringProfile: nfl-reise-2025
      seasons:
        - 2023
        - 2024
      selectionMetric: MAE
      tieBreak:
        - RMSE
        - absolute-bias
        - lower-k
      kGrid: 0.00-20.00-by-0.25-plus-24-32-48-64
      comparableObservationCount: 11297
      selectedBaseline: previous-season-position-mean-leave-one-player-out
      selectedK: 0.5
      selectedMetrics:
        mae: 4.5917
        rmse: 6.2722
        bias: -0.1955
    baselineCandidates:
      - previous-season-position-mean-leave-one-player-out
      - current-season-to-date-position-mean-leave-one-player-out-with-previous-season-fallback
    leakageRule: >
      Baseline and k selection use only 2023-2024. The 2025 season is an untouched
      holdout. For a target week W, CurrentSeasonPPG and any current-season position
      baseline use only weeks < W. Previous-season position evidence is already
      completed before the target season. Position baselines exclude the target
      player's own observations so the player's history is not counted twice.
    holdout2025:
      comparableCount: 5724
      v1:
        mae: 4.6282
        rmse: 6.4603
        bias: -0.1902
      v2:
        mae: 4.5948
        rmse: 6.3162
        bias: -0.0628
      improvement:
        maePoints: 0.0334
        maePercent: 0.7217
        rmsePoints: 0.1441
        rmsePercent: 2.2305
      diagnostics:
        week2V1Mae: 5.5950
        week2V2Mae: 5.0683
        qbV1Mae: 6.6910
        qbV2Mae: 6.5573
    coldStartDiagnostic:
      additionalPredictions: 641
      mae: 5.9516
      rmse: 7.0246
      bias: 2.6506
      rule: >
        Pure position-baseline predictions for PriorGames=0 are diagnostic only and
        are not accepted as the product cold-start rule. Their strong positive bias
        shows that rookie/first-appearance handling needs the later V3 baseline work.
    interpretation: >
      V2 is accepted as a statistically better same-season projection after at least
      one confirmed played game. The holdout improvement is real but modest, so the
      simple global k=0.5 contract remains preferable to adding unvalidated complexity.
      V3 must be compared against this locked V2 holdout benchmark rather than against
      V1 alone.


operations:
  nflSyncWorkflow: .github/workflows/sync-nfl-source-data.yml
  leagueSyncWorkflow: .github/workflows/sync-league-source-data.yml
  readinessWorkflow: .github/workflows/source-data-readiness.yml
  backfillSelection: tools/nfl_source_data_lib/history.py
  backfillRule: >
    Historical partitions are acquired through the normal reusable NFL Source Sync, never a
    second historical-data implementation. Explicit dataset/season inputs remain the targeted
    repair/backfill path. An unfiltered full workflow run may additionally heal a bounded batch
    of missing supported historical raw partitions when historical_backfill_limit is greater
    than zero; the productive workflow default is 12 partitions per run, newest seasons first.
    Existing prior-season raw partitions remain frozen and are skipped without network access.
  backfillDisableRule: >
    historical_backfill_limit=0 disables automatic missing-history healing. Targeted dataset
    or season runs do not consume the automatic historical backlog.
  postBackfillValidation:
    - refresh persisted readiness audits
    - require ReadyForHistoricalScoring=true before declaring historical coverage complete
    - validate historical scoring against persisted nflverse raw fields and an explicit nfl-reise scoring profile

