<div class="team-lineup-player-list" aria-label="Affected lineup players">
  @for (row of rows; track row.player.ID) {
    <button
      type="button"
      class="team-lineup-player-row"
      [attr.aria-label]="'Open ' + row.player.Name + ' player details'"
      (click)="openPlayerDetail(row.player)"
    >
      <span class="team-lineup-player-team-logo">
        @if (row.player.TeamNFL?.Logo) {
          <img [src]="row.player.TeamNFL.Logo" [alt]="row.player.TeamNFL.Name + ' logo'" />
        }
      </span>

      <span class="team-lineup-player-picture">
        @if (row.player.Picture) {
          <img [src]="row.player.Picture" [alt]="row.player.Name" />
        }
      </span>

      <strong class="team-lineup-player-name">{{ row.player.Name }}</strong>

      <span
        class="team-lineup-player-position"
        [ngStyle]="row.player.Position | positionStyle"
      >
        {{ row.player.Position }}
      </span>

      <span class="team-lineup-player-statuses">
        @for (status of row.statuses; track status) {
          <span
            class="team-lineup-player-status"
            [class.team-lineup-player-status--starter]="status === 'Starter'"
            [class.team-lineup-player-status--bench]="status === 'Bench'"
            [class.team-lineup-player-status--taxi]="status === 'Taxi'"
            [class.team-lineup-player-status--ir]="status === 'IR'"
          >
            {{ status }}
          </span>
        }
      </span>
    </button>
  }
</div>
