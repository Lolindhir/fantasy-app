<section class="current-standings current-standings--detailed" *ngIf="standings as rows">
  <div class="standing-detailed-heading">
    <h2>{{ title }}</h2>
  </div>

  <ng-container *ngFor="let row of rows">
    <div class="standing-detailed-row">
      <div class="standing-detailed-rank">
        <strong>{{ row.place }}</strong>
      </div>

      <div class="standing-detailed-team">
        <app-team-identity
          class="standing-detailed-identity"
          [team]="identity(row)"
          [elements]="identityElements"
          [interactive]="false"
          size="small"
        ></app-team-identity>
        <div class="standing-detailed-form-line">
          <span class="standing-detailed-owner" [title]="row.owner">{{ row.owner }}</span>
          <span class="standing-detailed-record">{{ row.record ?? '—' }}</span>
        </div>
      </div>

      <div class="standing-detailed-scores">
        <span class="standing-detailed-score">
          <span class="standing-detailed-score-label">PF</span>
          <strong class="standing-detailed-points standing-detailed-points--for">{{ row.points | number:'1.2-2':'en-US' }}</strong>
        </span>
        <span class="standing-detailed-score">
          <span class="standing-detailed-score-label">PA</span>
          <span class="standing-detailed-points standing-detailed-points--against">{{ row.pointsAgainst | number:'1.2-2':'en-US' }}</span>
        </span>
      </div>
    </div>
  </ng-container>
</section>
