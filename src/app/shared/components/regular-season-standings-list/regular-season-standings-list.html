<section class="regular-season-list" *ngIf="standings as rows">
  <h2 *ngIf="showTitle">{{ title }}</h2>

  <div *ngFor="let row of rows" class="regular-row">
    <div class="regular-place">{{ row.place }}</div>

    <div class="regular-owner">{{ row.owner }}</div>

    <div class="regular-record">
      {{ recordWithQuote(row) }}
    </div>

    <div class="regular-diff">
      {{ pointDifferentialEmoji(row) }} {{ pointDifferential(row) >= 0 ? '+' : '' }}{{ pointDifferential(row) | number:'1.0-2' }}
    </div>
  </div>
</section>
