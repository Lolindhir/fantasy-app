<section class="hof" *ngIf="highlights && highlights.length > 0" [attr.aria-label]="heading">
  <header class="hof__head">
    <span class="hof__crest" aria-hidden="true">{{ crest }}</span>
    <h2 class="hof__title">{{ heading }}</h2>
  </header>

  <ul class="hof__grid" [class.hof__grid--compact]="compact">
    <li *ngFor="let item of highlights; trackBy: trackHighlight" class="hof__card">
      <div class="hof__label" [matTooltip]="item.reason">
        <span class="hof__icon" aria-hidden="true"><app-glyph [glyph]="item.icon"></app-glyph></span>
        <span>{{ item.title }}</span>
      </div>
      <div class="hof__record">
        <div class="hof__winners">
          <ng-container *ngIf="item.players?.length; else teamOrOwner">
            <ng-container *ngIf="(item.players?.length ?? 0) <= directWinnerLimit; else tiedPlayers">
              <ng-container *ngFor="let player of item.players; trackBy: trackPlayer">
                <ng-container *ngTemplateOutlet="playerIdentity; context: { $implicit: player }"></ng-container>
              </ng-container>
            </ng-container>
            <ng-template #tiedPlayers>
              <details class="hof__more">
                <summary>
                  <span class="hof__stack" aria-hidden="true">
                    <ng-container *ngFor="let player of item.players; trackBy: trackPlayer">
                      <ng-container *ngTemplateOutlet="playerPortrait; context: { $implicit: player }"></ng-container>
                    </ng-container>
                  </span>
                  <span class="hof__tie-label">{{ item.players?.length }} players tied</span>
                </summary>
                <div class="hof__extra">
                  <ng-container *ngFor="let player of item.players; trackBy: trackPlayer">
                    <ng-container *ngTemplateOutlet="playerIdentity; context: { $implicit: player }"></ng-container>
                  </ng-container>
                </div>
              </details>
            </ng-template>
          </ng-container>
          <ng-template #teamOrOwner>
            <button *ngIf="item.team as team; else plainOwner" class="hof__identity" type="button"
                    [disabled]="!item.teamInteractive" (click)="openTeam(item)">
              <img class="hof__team-logo" [src]="team.Avatar || defaultTeamAvatar" alt="" loading="lazy" />
              <span class="hof__owner">{{ item.owner }}</span>
            </button>
            <ng-template #plainOwner><span class="hof__owner">{{ item.owner }}</span></ng-template>
          </ng-template>
        </div>
        <div class="hof__value">
          <strong>{{ valueMain(item) }}</strong>
          <span *ngIf="valueCaption(item)">{{ valueCaption(item) }}</span>
        </div>
      </div>
    </li>
  </ul>
</section>

<ng-template #playerIdentity let-player>
  <button class="hof__identity" type="button" [disabled]="!player.player" (click)="openPlayer(player)">
    <ng-container *ngTemplateOutlet="playerPortrait; context: { $implicit: player }"></ng-container>
    <span class="hof__owner">{{ player.name }}<span *ngIf="player.teamAbbr" class="hof__sr-only">, {{ player.teamAbbr }}</span></span>
  </button>
</ng-template>

<ng-template #playerPortrait let-player>
  <span class="hof__portrait" aria-hidden="true">
    <img *ngIf="player.picture; else noPortrait" class="hof__photo" [src]="player.picture" alt="" loading="lazy" />
    <ng-template #noPortrait><span class="hof__photo hof__photo--empty">{{ player.name.slice(0, 1) }}</span></ng-template>
    <img *ngIf="player.teamLogo" class="hof__nfl-logo" [src]="player.teamLogo" alt="" loading="lazy" />
  </span>
</ng-template>
