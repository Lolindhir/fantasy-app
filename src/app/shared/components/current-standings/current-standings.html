<section class="current-standings" *ngIf="standings as rows">
  <div class="standing-mobile-heading">
    <h2 class="standing-mobile-title">{{ title === 'Current Standings' ? 'Standings' : title }}</h2>
    <div>Record</div>
    <div>PF</div>
  </div>

  <h2 class="standing-desktop-title">{{ title }}</h2>

  <div class="standing-row standing-header">
    <div>Place</div>
    <div>Team</div>
    <div>Record</div>
    <div>Points</div>
  </div>

  <div *ngFor="let row of rows" class="standing-row">
    <div class="standing-place">{{ row.displayPlace }}</div>

    <app-team-identity
      class="standing-team-identity standing-team-identity--mobile"
      [team]="row.team"
      [elements]="mobileTeamIdentityElements"
      size="small"
    ></app-team-identity>

    <app-team-identity
      class="standing-team-identity standing-team-identity--desktop"
      [team]="row.team"
      [elements]="desktopTeamIdentityElements"
      size="small"
    ></app-team-identity>

    <div class="standing-record">{{ formatRecord(row) }}</div>
    <div class="standing-points">{{ row.team.Points | number:'1.0-2' }}</div>
  </div>
</section>
