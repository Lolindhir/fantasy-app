<section class="award-legend" *ngIf="awards as rows">
  <h2>Award Legend</h2>

  <div class="award-legend-grid">
    <div
      *ngFor="let award of rows"
      class="award-legend-chip"
      [matTooltip]="award.tooltip"
    >
      <span class="award-icon">{{ award.icon }}</span>
      <span class="award-text">{{ award.displayText }}</span>
      <span class="award-count">{{ award.occurrences }}x</span>
    </div>
  </div>
</section>
