<section *ngIf="results as resultsVm">
  <h2 *ngIf="showTitle">{{ title }}</h2>

  <div class="standings-wrapper">
    <section class="honor-podium" aria-label="Playoff podium">
      <div class="honor-banners">
        <app-achievement-banner
          *ngIf="resultsVm.runnerUp as runnerUp"
          [season]="bannerSeason"
          achievementLabel="Runner Up"
          accent="silver"
          [subjectName]="runnerUp.teamName || runnerUp.team.Owner"
          [subjectAvatar]="runnerUp.teamAvatar"
          [secondaryAvatar]="runnerUp.ownerAvatar"
          emblemSrc="assets/awards/ui/award-runner-up.png"
          [achievementBadgeSrc]="runnerUp.isRegularSeasonChampion ? 'assets/awards/ui/award-regular-season.png' : null"
        ></app-achievement-banner>

        <app-achievement-banner
          *ngIf="resultsVm.champion as champion"
          [season]="bannerSeason"
          achievementLabel="Champion"
          accent="gold"
          [subjectName]="champion.teamName || champion.team.Owner"
          [subjectAvatar]="champion.teamAvatar"
          [secondaryAvatar]="champion.ownerAvatar"
          emblemSrc="assets/awards/ui/award-championship-ring.png"
          [achievementBadgeSrc]="champion.isRegularSeasonChampion ? 'assets/awards/ui/award-regular-season.png' : null"
        ></app-achievement-banner>

        <app-achievement-banner
          *ngIf="resultsVm.thirdPlace as thirdPlace"
          [season]="bannerSeason"
          achievementLabel="3rd Place"
          accent="bronze"
          [subjectName]="thirdPlace.teamName || thirdPlace.team.Owner"
          [subjectAvatar]="thirdPlace.teamAvatar"
          [secondaryAvatar]="thirdPlace.ownerAvatar"
          emblemSrc="assets/awards/ui/award-third-place.png"
          [achievementBadgeSrc]="thirdPlace.isRegularSeasonChampion ? 'assets/awards/ui/award-regular-season.png' : null"
        ></app-achievement-banner>
      </div>
    </section>

    <div class="rest">
      <div *ngFor="let result of resultsVm.remainingTeams" class="team-row">
        <div class="place"><app-standing-rank-badge [rank]="result.place" /></div>

        <div class="team-row__identity">
          <span class="team-row__avatar-stack">
            <span class="team-row__primary-avatar">
              <img
                *ngIf="result.teamAvatar; else teamAvatarFallback"
                [src]="result.teamAvatar"
                alt=""
                aria-hidden="true"
              />
              <ng-template #teamAvatarFallback>
                <span>{{ (result.teamName || result.team.Owner).charAt(0) || '?' }}</span>
              </ng-template>
            </span>

            <span *ngIf="result.ownerAvatar" class="team-row__secondary-avatar">
              <img [src]="result.ownerAvatar" alt="" aria-hidden="true" />
            </span>
            <span *ngIf="result.isRegularSeasonChampion" class="team-row__achievement-badge" title="Regular Season Champion" aria-label="Regular Season Champion">
              <img src="assets/awards/ui/award-regular-season.png" alt="" aria-hidden="true" />
            </span>
          </span>

          <div
            class="team-row__name"
            [appFitText]="result.teamName || result.team.Owner"
            [fitTextMinSize]="13"
            [fitTextMaxSize]="15.36"
          >
            {{ result.teamName || result.team.Owner }}
          </div>
        </div>
      </div>
    </div>

    <app-achievement-plaque
      *ngIf="resultsVm.regularSeasonChampion as winner"
      class="regular-season-achievement"
      [season]="bannerSeason ?? ''"
      [subjectName]="winner.teamName || winner.owner"
      [subjectAvatar]="winner.teamAvatar"
      [secondaryAvatar]="winner.ownerAvatar"
    ></app-achievement-plaque>
  </div>
</section>
