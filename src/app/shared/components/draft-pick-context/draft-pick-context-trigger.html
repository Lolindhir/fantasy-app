<app-draft-pick-pill
  [label]="context.label"
  [variant]="variant"
  [isTradedPick]="context.isTradedPick"
  [interactive]="true"
  [pillStyle]="usePositionColor ? (context.selectedPlayer?.Position | positionStyle) : { background: context.roundColor }"
  [matMenuTriggerFor]="pickInfoMenu" />

<mat-menu #pickInfoMenu="matMenu" class="draft-pick-trigger-menu">
  <app-draft-pick-context-popover [context]="context" />
</mat-menu>
