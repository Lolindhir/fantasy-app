<section *ngIf="matchups as matchupRows" class="matchups-shell">
  <ng-container *ngIf="matchupRows.length > 0">
    <div class="matchups-heading">
      <div>
        <div class="matchups-eyebrow">Next up</div>
        <h2>Week {{ week }} Matchups</h2>
      </div>
      <span class="matchups-count">{{ matchupRows.length }} games</span>
    </div>

    <div class="matchups-grid">
      <article *ngFor="let matchup of matchupRows" class="matchup-card">
        <div class="matchup-team matchup-team--left">
          <app-team-identity
            class="matchup-team-identity"
            [team]="matchup.left.team"
            [elements]="teamIdentityElements"
            size="medium"
          ></app-team-identity>
          <strong *ngIf="matchup.showScore" class="matchup-points">{{ matchup.left.points | number:'1.0-2' }}</strong>
        </div>

        <div class="matchup-vs">VS</div>

        <div class="matchup-team matchup-team--right">
          <strong *ngIf="matchup.showScore" class="matchup-points">{{ matchup.right.points | number:'1.0-2' }}</strong>
          <app-team-identity
            class="matchup-team-identity"
            [team]="matchup.right.team"
            [elements]="teamIdentityElements"
            size="medium"
            align="end"
          ></app-team-identity>
        </div>
      </article>
    </div>
  </ng-container>
</section>
