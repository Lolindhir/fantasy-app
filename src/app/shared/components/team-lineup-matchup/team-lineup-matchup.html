<div class="team-lineup-matchup" [attr.aria-label]="awayAbbr + ' at ' + homeAbbr">
  <div class="team-lineup-matchup-side team-lineup-matchup-side--away">
    <span class="team-lineup-matchup-logo">
      @if (awayLogo) {
        <img [src]="awayLogo" [alt]="awayAbbr + ' logo'" />
      }
    </span>
    <strong>{{ awayAbbr }}</strong>
  </div>

  <span class="team-lineup-matchup-at" aria-hidden="true">@</span>

  <div class="team-lineup-matchup-side team-lineup-matchup-side--home">
    <strong>{{ homeAbbr }}</strong>
    <span class="team-lineup-matchup-logo">
      @if (homeLogo) {
        <img [src]="homeLogo" [alt]="homeAbbr + ' logo'" />
      }
    </span>
  </div>
</div>
