<section class="all-time-regular" *ngIf="standings as rows">
  <h2 *ngIf="showTitle">{{ title }}</h2>

  <div *ngFor="let row of rows" class="regular-row">
    <div class="regular-place">{{ row.place }}</div>

    <div class="regular-owner">{{ row.owner }}</div>

    <div class="regular-record">
      {{ row.record }} · {{ row.winPercentageDisplay }}
    </div>

    <div class="regular-points">
      {{ row.points | number:'1.0-2' }} Pts
    </div>
  </div>
</section>
