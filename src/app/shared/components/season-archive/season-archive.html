<section class="season-archive" *ngIf="history as vm">
  <h2>Season Archive</h2>

  <mat-accordion multi>
    <mat-expansion-panel *ngFor="let season of vm.seasons">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ season.season }}</mat-panel-title>
        <mat-panel-description>
          <span *ngIf="season.champion">🏆 {{ season.champion.owner }}</span>
        </mat-panel-description>
      </mat-expansion-panel-header>

      <app-season-results
        [results]="playoffResultsViewModel(season)"
        [showTitle]="false"
      ></app-season-results>

      <section class="awards season-block" *ngIf="season.awards.length > 0">
        <h3>Regular Season Awards</h3>

        <div class="awards-grid">
          <div *ngFor="let award of season.awards" class="award-card">
            <div class="award-icon">{{ award.icon }}</div>
            <div class="award-name">{{ award.name }}</div>
            <div class="award-owner">- {{ award.owner }} -</div>
            <div class="award-stat">{{ award.statDisplay }}</div>
          </div>
        </div>
      </section>

      <section class="season-block regular-season-block">
        <h3>Regular Season Standings</h3>

        <app-regular-season-standings-list
          [standings]="season.regularSeasonStandings"
          [showTitle]="false"
        ></app-regular-season-standings-list>
      </section>
    </mat-expansion-panel>
  </mat-accordion>
</section>
