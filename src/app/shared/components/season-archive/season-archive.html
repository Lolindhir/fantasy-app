<section class="season-archive" *ngIf="history as vm">
  <h2>Season Archive</h2>

  <mat-accordion multi>
    <mat-expansion-panel *ngFor="let season of vm.seasons">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ season.season }}</mat-panel-title>
        <mat-panel-description>
          <span *ngIf="season.champion" class="season-champion">
            <img
              class="season-champion-icon"
              src="assets/awards/ui/award-championship-ring.png"
              alt=""
              aria-hidden="true"
            />
            {{ season.champion.owner }}
          </span>
        </mat-panel-description>
      </mat-expansion-panel-header>

      <a class="season-weeks-link" routerLink="/weeks" [queryParams]="{ season: season.season }">View weeks</a>

      <app-season-results
        [results]="playoffResultsViewModel(season)"
        [showTitle]="false"
        [bannerSeason]="season.season"
      ></app-season-results>

      <app-season-awards [awards]="season.awards"></app-season-awards>

      <section class="season-block regular-season-block">
        <app-season-standings-table
          [standings]="season.regularSeasonStandings"
          [statistics]="statisticsByTeam(season)"
          [idPrefix]="'season-' + season.season"
        ></app-season-standings-table>
      </section>
    </mat-expansion-panel>
  </mat-accordion>
</section>
