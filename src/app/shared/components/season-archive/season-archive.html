<section class="season-archive" *ngIf="history as vm">
  <h2>Season Archive</h2>

  <mat-accordion multi>
    <mat-expansion-panel *ngFor="let season of vm.seasons">
      <mat-expansion-panel-header>
        <mat-panel-title>{{ season.season }}</mat-panel-title>
        <mat-panel-description>
          <span *ngIf="season.champion">🏆 {{ season.champion.owner }}</span>
        </mat-panel-description>
      </mat-expansion-panel-header>

      <app-season-results
        [results]="playoffResultsViewModel(season)"
        [showTitle]="false"
      ></app-season-results>

      <section class="season-block regular-season-block">
        <h3>Regular Season Standings</h3>

        <div class="regular-row regular-header">
          <div>#</div>
          <div>Owner</div>
          <div>Record</div>
          <div>Points</div>
        </div>

        <div *ngFor="let row of season.regularSeasonStandings" class="regular-row">
          <div class="place">{{ row.place }}</div>
          <div class="owner regular-owner">{{ row.owner }}</div>
          <div>{{ row.record }}</div>
          <div>{{ row.points | number:'1.0-2' }}</div>
        </div>
      </section>
    </mat-expansion-panel>
  </mat-accordion>
</section>
