<section class="card" aria-label="Projected range">
  <div class="head"><h3>Projected range</h3><span>{{ view.levelLabel }} · est.</span></div>
  <div class="chart">
    <div *ngFor="let team of view.teams" class="row">
      <span class="team">{{ team.label }}</span>
      <div class="track" role="img" [attr.aria-label]="team.ariaLabel">
        <i class="bar" [style.left.%]="team.bar.left" [style.width.%]="team.bar.width"></i>
        <span class="end end--low" [style.left.%]="team.bar.left">{{ team.lower }}</span>
        <span class="end end--high" [style.left.%]="team.bar.left + team.bar.width">{{ team.upper }}</span>
        <u class="marker" [style.left.%]="team.marker"></u>
        <span class="value" [style.left.%]="team.marker">{{ team.projected }}</span>
      </div>
    </div>
    <div class="ticks" aria-hidden="true">
      <span *ngFor="let tick of view.ticks" [style.left.%]="tick.position">{{ tick.value }}</span>
    </div>
  </div>
  <p class="note">Scored so far {{ view.scored.left }} and {{ view.scored.right }}. Estimate that assumes players score independently.</p>
</section>
