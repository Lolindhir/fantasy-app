@if (hasData) {
  <svg class="salary-chart" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img"
       aria-label="Salary and projected salary per week of the current season">
    @for (tick of yTicks; track tick.y) {
      <line class="grid" [attr.x1]="plotLeft" [attr.x2]="plotRight" [attr.y1]="tick.y" [attr.y2]="tick.y" />
      <text class="axis" [attr.x]="plotLeft - 6" [attr.y]="tick.y + 3.5" text-anchor="end">{{ tick.label }}</text>
    }
    @for (tick of xTicks; track tick.x) {
      <text class="axis" [attr.x]="tick.x" [attr.y]="plotBottom + 18" text-anchor="middle">{{ tick.label }}</text>
    }
    @for (segment of current.segments; track $index) {
      <path class="line line--current" [attr.d]="path(segment)" />
    }
    @for (segment of projected.segments; track $index) {
      <path class="line line--projected" [attr.d]="path(segment)" />
    }
    @for (point of projected.points; track point.week) {
      <circle class="dot" [attr.cx]="point.x" [attr.cy]="point.y" r="3.5"><title>Week {{ point.week }}: {{ formatMoney(point.value) }}</title></circle>
    }
  </svg>
  <div class="legend">
    <span class="legend__item"><i class="swatch swatch--projected"></i>Projected</span>
    <span class="legend__item"><i class="swatch swatch--current"></i>Current</span>
  </div>
} @else {
  <p class="empty">No salary history for this season yet.</p>
}
