<section class="all-time" *ngIf="standings as rows">
  <h2 *ngIf="showTitle">{{ title }}</h2>

  <div *ngFor="let row of rows" class="all-time-row">
    <div class="all-time-place">{{ row.place }}</div>

    <div class="all-time-owner">{{ row.owner }}</div>

    <div class="all-time-awards">
      <span
        *ngIf="row.championships > 0"
        class="all-time-championships"
        [attr.aria-label]="row.championships === 1 ? '1 championship' : row.championships + ' championships'"
      >
        <span *ngIf="row.championships > 2" class="championship-count">{{ row.championships }}</span>
        <img
          class="championship-ring-icon"
          src="assets/championship-ring-gold.webp"
          alt=""
          aria-hidden="true"
        />
        <img
          *ngIf="row.championships === 2"
          class="championship-ring-icon"
          src="assets/championship-ring-gold.webp"
          alt=""
          aria-hidden="true"
        />
      </span>
      {{ repeatEmojiLimited('🥈', row.runnerUps) }}
      {{ repeatEmojiLimited('🥉', row.thirds) }}
      {{ repeatEmojiLimited('👑', row.regularSeasonWins) }}
    </div>

    <div class="all-time-avg">
      Ø🏅 = {{ row.placeAverage }}
    </div>
  </div>
</section>
