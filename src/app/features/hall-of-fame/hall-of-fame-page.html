<div class="hof-page" *ngIf="vm$ | async as vm">
  <section class="hof-champions" aria-label="League champions" *ngIf="vm.champions.length > 0">
    <h2>League Champions</h2>

    <div class="hof-featured" *ngIf="vm.champions[0] as current">
      <app-achievement-banner
        class="hof-featured__banner"
        [season]="current.season"
        achievementLabel="Champion"
        accent="gold"
        [subjectName]="current.teamName"
        [subjectAvatar]="current.teamAvatar"
        [secondaryAvatar]="current.ownerAvatar"
        [emblemSrc]="championEmblemSrc"
        [achievementBadgeSrc]="current.isRegularSeasonChampion ? 'assets/awards/ui/award-regular-season.png' : null"
      ></app-achievement-banner>
      <figure class="hof-featured__ring">
        <img [src]="ringSrc(current)" [alt]="current.season + ' championship ring'" (error)="onRingError(current)" />
        <figcaption>{{ current.owner }}</figcaption>
      </figure>
    </div>

    <ul class="hof-champions__grid" *ngIf="vm.champions.length > 1">
      <li *ngFor="let champion of vm.champions.slice(1); trackBy: trackSeason">
        <button type="button" class="hof-champion" (click)="openChampion(champion)" [attr.aria-label]="champion.season + ' champion ' + champion.teamName + ', show details'">
          <img class="hof-champion__ring" [src]="ringSrc(champion)" alt="" (error)="onRingError(champion)" />
          <img class="hof-champion__logo" [src]="champion.teamAvatar" alt="" />
          <span class="hof-champion__name">{{ champion.teamName }}</span>
          <span class="hof-champion__season">{{ champion.season }}</span>
        </button>
      </li>
    </ul>
  </section>

  <app-hall-of-fame heading="League Legacy" crest="🏛️" [highlights]="vm.sections.legacy"></app-hall-of-fame>
  <app-hall-of-fame heading="All-Time Bests" crest="⭐" [highlights]="vm.sections.bests"></app-hall-of-fame>
  <app-hall-of-fame heading="Player Legends" crest="🎖️" [highlights]="vm.sections.playerLegends"></app-hall-of-fame>

  <app-all-time-overview
    [overallStandings]="vm.allTime.overallStandings"
    [regularSeasonStandings]="vm.allTime.regularSeasonStandings"
  ></app-all-time-overview>
</div>
