@if (vm$ | async; as vm) {
  <div class="drafts-page">
    <div class="activity-tabs" aria-label="Draft sections">
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'current'"
        (click)="selectTab('current')">
        Current
      </button>
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'future'"
        (click)="selectTab('future')">
        Future
      </button>
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'past'"
        (click)="selectTab('past')">
        Past
      </button>
    </div>

    @if (activeTab === 'current') {
      <app-current-drafts-tab [drafts]="vm.currentSeasonDrafts" />
    } @else if (activeTab === 'future') {
      <app-future-drafts-tab [drafts]="vm.futureDrafts" />
    } @else {
      <section class="draft-section past-draft-section">
        @if (vm.pastSeasons.length > 0) {
          <mat-form-field appearance="outline" class="past-season-select">
            <mat-label>Season</mat-label>
            <mat-select [value]="vm.selectedPastSeason" (selectionChange)="selectPastSeason($event.value)">
              @for (season of vm.pastSeasons; track season.Season) {
                <mat-option [value]="season.Season">{{ season.Season }}</mat-option>
              }
            </mat-select>
          </mat-form-field>

          <app-current-drafts-tab
            [drafts]="vm.pastDrafts"
            [sectionTitle]="'Past Drafts ' + vm.selectedPastSeason"
            emptyMessage="No past drafts found for this season." />
        } @else {
          <mat-card class="empty-card">
            <mat-card-content>No past draft seasons found.</mat-card-content>
          </mat-card>
        }
      </section>
    }
  </div>
}
