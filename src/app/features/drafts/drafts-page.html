@if (vm$ | async; as vm) {
  <div class="drafts-page">
    <div class="activity-tabs" aria-label="Draft sections">
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'current'"
        (click)="selectTab('current')">
        Current
      </button>
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'future'"
        (click)="selectTab('future')">
        Future
      </button>
      <button
        class="activity-tab"
        type="button"
        [class.active]="activeTab === 'past'"
        (click)="selectTab('past')">
        Past
      </button>
    </div>

    @if (activeTab === 'current') {
      <app-current-drafts-tab [drafts]="vm.currentSeasonDrafts" />
    } @else if (activeTab === 'future') {
      <app-future-drafts-tab [drafts]="vm.futureDrafts" />
    } @else {
      <app-past-drafts-tab [league]="vm.league" [teams]="vm.teams" [players]="vm.players" />
    }
  </div>
}
