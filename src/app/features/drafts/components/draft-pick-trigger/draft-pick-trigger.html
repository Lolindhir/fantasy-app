<app-draft-pick-pill
  [label]="label"
  [variant]="variant"
  [isTradedPick]="isTradedPick"
  [interactive]="true"
  [pillStyle]="usePositionColor ? (selectedPlayerPosition | positionStyle) : { background: roundColor }"
  [matMenuTriggerFor]="pickInfoMenu" />

<mat-menu #pickInfoMenu="matMenu" class="draft-pick-trigger-menu">
  <app-draft-pick-popover
    [draftVm]="draftVm"
    [item]="item"
    [compactPick]="compactPick"
    [currentOwner]="currentOwner" />
</mat-menu>
