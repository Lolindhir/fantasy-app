<div class="draft-board-scroll">
  <div class="draft-board">
    @for (round of draftVm.rounds; track round.round) {
      <div
        class="draft-board-row"
        [style.--column-count]="columnCount">
        @for (item of round.picks; track item.pick.PickKey) {
          <app-draft-pick-card [draftVm]="draftVm" [item]="item" />
        }
      </div>
    }
  </div>
</div>
