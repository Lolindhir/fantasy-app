<section class="draft-section">
  <div class="section-header">
    <h2>Current Season Drafts</h2>
  </div>

  @if (drafts.length > 0) {
    <div class="drafts-column">
      @for (draftVm of drafts; track draftVm.draft.DraftKey) {
        <app-draft-shell [draftVm]="draftVm">
          <div class="current-view-tabs" aria-label="Current draft views">
            <button
              class="current-view-tab"
              type="button"
              [class.active]="getActiveView(draftVm.draft.DraftKey) === 'overview'"
              (click)="selectView(draftVm.draft.DraftKey, 'overview')">
              Overview
            </button>
            <button
              class="current-view-tab"
              type="button"
              [class.active]="getActiveView(draftVm.draft.DraftKey) === 'teams'"
              (click)="selectView(draftVm.draft.DraftKey, 'teams')">
              Teams
            </button>
            <button
              class="current-view-tab"
              type="button"
              [class.active]="getActiveView(draftVm.draft.DraftKey) === 'list'"
              (click)="selectView(draftVm.draft.DraftKey, 'list')">
              List
            </button>
          </div>

          @if (getActiveView(draftVm.draft.DraftKey) === 'overview') {
            <app-current-draft-overview-view [draftVm]="draftVm" />
          } @else if (getActiveView(draftVm.draft.DraftKey) === 'teams') {
            <app-current-draft-team-view [draftVm]="draftVm" />
          } @else {
            <app-current-draft-list-view [draftVm]="draftVm" />
          }
        </app-draft-shell>
      }
    </div>
  } @else {
    <mat-card class="empty-card">
      <mat-card-content>No current season drafts found.</mat-card-content>
    </mat-card>
  }
</section>
