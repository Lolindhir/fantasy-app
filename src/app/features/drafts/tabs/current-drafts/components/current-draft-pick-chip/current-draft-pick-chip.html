<button
  class="current-pick-chip"
  [class.traded-pick]="item.isCurrentlyTraded"
  [ngStyle]="usePickedPositionColor && item.selectedPlayer ? (item.selectedPlayer.Position | positionStyle) : { background: item.roundColor }"
  [matMenuTriggerFor]="pickInfoMenu"
  type="button">
  {{ item.pick.DisplayPick }}
</button>

<mat-menu #pickInfoMenu="matMenu" class="current-pick-info-menu">
  <app-current-draft-pick-popover [draftVm]="draftVm" [item]="item" />
</mat-menu>
