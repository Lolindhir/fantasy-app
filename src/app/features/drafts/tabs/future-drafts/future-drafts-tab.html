@if (drafts.length > 0) {
  <section class="draft-section">
    <div class="section-header">
      <h2>Future Drafts</h2>
    </div>

    <div class="compact-draft-grid">
      @for (draftVm of drafts; track draftVm.draft.DraftKey) {
        <app-draft-shell [draftVm]="draftVm" [showStatus]="false">
          <div class="compact-owner-list">
            @for (ownerGroup of draftVm.ownerPickGroups; track ownerGroup.owner.id) {
              <div class="compact-owner-row">
                <img class="team-avatar" [src]="ownerGroup.owner.avatar" alt="" />
                <span class="compact-team-name">{{ ownerGroup.owner.name }}</span>
                <div class="compact-round-list">
                  @for (roundPick of ownerGroup.picks; track $index) {
                    <button
                      class="round-pill"
                      [class.traded-pick]="roundPick.isCurrentlyTraded"
                      [style.background]="roundPick.color"
                      [matMenuTriggerFor]="pickOriginMenu"
                      type="button">
                      {{ roundPick.label }}
                    </button>
                    <mat-menu #pickOriginMenu="matMenu" class="draft-pick-origin-menu">
                      <app-draft-pick-popover
                        [draftVm]="draftVm"
                        [compactPick]="roundPick"
                        [currentOwner]="ownerGroup.owner" />
                    </mat-menu>
                  }
                </div>
              </div>
            }
          </div>
        </app-draft-shell>
      }
    </div>
  </section>
}
