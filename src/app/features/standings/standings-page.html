<div class="standings-page" *ngIf="vm$ | async as vm">
  <section class="current-standings">
    <h2>Current Standings</h2>

    <div class="standing-row standing-header">
      <div>Place</div>
      <div>Team</div>
      <div>Record</div>
      <div>Points</div>
    </div>

    <div *ngFor="let row of vm.currentStandings" class="standing-row">
      <div class="standing-place">{{ row.displayPlace }}</div>

      <div class="standing-team">
        <img *ngIf="row.team.Avatar" [src]="row.team.Avatar" alt="" />
        <div>
          <div class="standing-team-name">{{ row.team.Team }}</div>
          <div class="standing-owner">{{ row.team.Owner }}</div>
        </div>
      </div>

      <div>{{ row.team.Record }}</div>
      <div>{{ row.team.Points | number:'1.0-2' }}</div>
    </div>
  </section>

  <app-season-results
    [results]="vm.seasonResults"
    title="Last Season Results"
  ></app-season-results>

  <app-all-time-standings
    [standings]="vm.allTimeStandings"
  ></app-all-time-standings>
</div>
