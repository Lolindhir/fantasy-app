<div class="standings-page" *ngIf="vm$ | async as vm">
  <app-current-standings
    [standings]="vm.currentStandings"
  ></app-current-standings>

  <app-season-results
    [results]="vm.seasonResults"
    title="Last Season Results"
  ></app-season-results>

  <app-all-time-standings
    [standings]="vm.allTimeStandings"
  ></app-all-time-standings>
</div>
