<div class="standings-page" *ngIf="vm$ | async as vm">
  <app-current-standings
    variant="detailed"
    [playoffTeams]="vm.playoffTeams"
    [standings]="vm.currentStandings"
    [playoffOdds]="vm.playoffOdds"
  ></app-current-standings>

  <app-playoff-picture
    *ngIf="vm.playoffOdds as odds"
    [odds]="odds"
    [standings]="vm.currentStandings"
  ></app-playoff-picture>

  <app-season-archive
    [history]="vm.seasonHistory"
  ></app-season-archive>
</div>
