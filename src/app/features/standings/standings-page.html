<div class="standings-page" *ngIf="vm$ | async as vm">
  <app-league-legacy-summary
    [highlights]="vm.highlights"
  ></app-league-legacy-summary>

  <app-all-time-overview
    [overallStandings]="vm.legacy.overallStandings"
    [regularSeasonStandings]="vm.legacy.regularSeasonStandings"
  ></app-all-time-overview>

  <app-current-standings
    variant="detailed"
    [playoffTeams]="vm.playoffTeams"
    [statistics]="vm.currentStatistics"
    [standings]="vm.currentStandings"
  ></app-current-standings>

  <app-season-archive
    [history]="vm.seasonHistory"
    [statistics]="vm.seasonStatistics"
    [teams]="vm.teams"
  ></app-season-archive>
</div>
