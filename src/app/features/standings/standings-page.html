<div class="standings-page" *ngIf="vm$ | async as vm">
  <app-league-legacy-summary
    [highlights]="vm.legacy.highlights"
  ></app-league-legacy-summary>

  <app-all-time-standings
    [standings]="vm.legacy.overallStandings"
    title="All-Time Overall"
  ></app-all-time-standings>

  <app-all-time-regular-season-standings
    [standings]="vm.legacy.regularSeasonStandings"
  ></app-all-time-regular-season-standings>

  <app-award-legend
    [awards]="vm.legacy.awardLegend"
  ></app-award-legend>

  <app-current-standings
    [standings]="vm.currentStandings"
  ></app-current-standings>

  <app-season-archive
    [history]="vm.seasonHistory"
  ></app-season-archive>
</div>
