<nav class="tabs" aria-label="Handbook-Themen">
  <button *ngFor="let tab of tabs" type="button" (click)="selectTab(tab.id)"
    [class.tabs__active]="selectedTab === tab.id"
    [attr.aria-current]="selectedTab === tab.id ? 'page' : null">
    {{ tab.label }}
  </button>
</nav>

<markdown class="markdown" [data]="markdownText"></markdown>
