<div class="tabs" style="display: flex; flex-wrap: wrap; gap: 8px;">
  <button 
    style="flex: 1 1 auto;"
    (click)="selectTab('Overview')"
    [style.background]="selectedTab === 'Overview' ? '#1976d2' : null"
    [style.color]="selectedTab === 'Overview' ? 'white' : null">
    Übersicht
  </button>

  <button 
    style="flex: 1 1 auto;"
    (click)="selectTab('Salary_Explanation')"
    [style.background]="selectedTab === 'Salary_Explanation' ? '#1976d2' : null"
    [style.color]="selectedTab === 'Salary_Explanation' ? 'white' : null">
    Salary Cap Berechnung
  </button>

  <button 
    style="flex: 1 1 auto;"
    (click)="selectTab('Offseason_Flow')"
    [style.background]="selectedTab === 'Offseason_Flow' ? '#1976d2' : null"
    [style.color]="selectedTab === 'Offseason_Flow' ? 'white' : null">
    Offseason Infografik
  </button>

  <button 
    style="flex: 1 1 auto;"
    (click)="selectTab('Offseason_Schedule')"
    [style.background]="selectedTab === 'Offseason_Schedule' ? '#1976d2' : null"
    [style.color]="selectedTab === 'Offseason_Schedule' ? 'white' : null">
    Offseason Regeln
  </button>

  <button 
    style="flex: 1 1 auto;"
    (click)="selectTab('Draft_Waiver_Order')"
    [style.background]="selectedTab === 'Draft_Waiver_Order' ? '#1976d2' : null"
    [style.color]="selectedTab === 'Draft_Waiver_Order' ? 'white' : null">
    Draft & Waiver Regeln
  </button>
</div>

<markdown class="markdown" [data]="markdownText"></markdown>
