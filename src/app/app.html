<div class="app-container">

  <nav class="main-nav desktop-nav">

    <div class="nav-links">

      <a routerLink="/" routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Overview
      </a>

      <a routerLink="/teams" routerLinkActive="active">
        Teams
      </a>

      <a routerLink="/players" routerLinkActive="active">
        Players
      </a>

      <a class="disabled-link">
        Drafts & Moves
      </a>

      <a routerLink="/trade" routerLinkActive="active">
        Trade Simulator
      </a>

      <a routerLink="/handbook" routerLinkActive="active">
        Handbook
      </a>

    </div>

  </nav>


  <!-- MOBILE TOP BAR -->
  <div class="mobile-top-bar">
  </div>

  <button
    class="floating-burger"
    [class.scrolled]="isScrolled"
    (click)="menuOpen = !menuOpen"
  >
    ☰ 
    @if (!isScrolled) {
      <span style="margin-left: 15px; font-size: medium;">{{ currentPage }}</span>
    }
  </button>

  <!-- MOBILE MENU -->

  <div class="mobile-menu" [class.open]="menuOpen">

    <a routerLink="/" routerLinkActive="active" (click)="menuOpen = false" 
      [routerLinkActiveOptions]="{ exact: true }">
      Overview
    </a>

    <a routerLink="/teams" routerLinkActive="active" (click)="menuOpen = false">
      Teams
    </a>

    <a class="disabled-link">
      Drafts & Moves
    </a>

    <a routerLink="/trade" routerLinkActive="active" (click)="menuOpen = false">
      Trade Simulator
    </a>

    <a routerLink="/handbook" routerLinkActive="active" (click)="menuOpen = false">
      Handbook
    </a>

  </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>
