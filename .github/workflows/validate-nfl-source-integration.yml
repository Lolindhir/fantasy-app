name: Validate NFL Source Integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-nfl-source-integration
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.head_ref == 'agent/nfl-source-identity-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/nfl-source-identity-integration
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate and persist integration result
        shell: bash
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p "test_nfl_source*.py" -v

          python tools/nfl_source_data.py materialize | tee /tmp/materialize-first.json
          python tools/nfl_source_data.py materialize | tee /tmp/materialize-second.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/materialize-second.json').read_text(encoding='utf-8'))
          expected = {
              'identityChanged': False,
              'providerMappingsChanged': False,
              'draftFilesChanged': 0,
              'auditChanged': False,
          }
          actual = {key: result.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'Semantic no-op failed: expected={expected!r} actual={actual!r}')
          PY

          python tools/nfl_source_data.py audit > /tmp/audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('/tmp/audit.json').read_text(encoding='utf-8'))
          if audit.get('scope') != 'public/data/Players.json':
              raise SystemExit(f"Unexpected audit scope: {audit.get('scope')!r}")
          if audit.get('identityInvariantViolations', {}).get('duplicateLinkProviderIDCount') != 0:
              raise SystemExit('Duplicate link-provider IDs detected in canonical identities.')
          sleeper_133 = [
              item for item in audit.get('providerMappingConflicts', [])
              if item.get('Provider') == 'Sleeper' and str(item.get('ExternalID')) == '133'
          ]
          if len(sleeper_133) != 1 or len(sleeper_133[0].get('NFLPlayerIDs', [])) != 2:
              raise SystemExit('Sleeper 133 is not represented as one two-person ambiguous mapping conflict.')
          PY

          mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
          unexpected=()
          for path in "${changed[@]}"; do
            if [[ "$path" != source-data/* ]]; then
              unexpected+=("$path")
            fi
          done
          if (( ${#unexpected[@]} > 0 )); then
            printf 'Unexpected validation changes outside source-data/:\n' >&2
            printf ' - %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

          git rm .github/workflows/validate-nfl-source-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-data
          git commit -m "data(nfl-source): validate current-main canonical state"
          git push "https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/nfl-source-identity-integration
