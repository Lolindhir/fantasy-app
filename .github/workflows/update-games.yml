name: APP • Data • Games

# Publishes Schedule.json from the canonical NFL schedule and game finality. Called by
# APP • Pipeline • NFL Live (Issue #946, step S3 of #471); no push or scheduler trigger of its own.
# workflow_dispatch stays as the manual repair path.

on:
  workflow_call:
    secrets:
      PAT_PUSH:
        required: true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /package.json
            /package-lock.json
            /tools/
            /public/requests/
            /public/data/
            /data-meta/
            /data-source/leagues/
            /data-source/nfl/teams.json
            /data-source/nfl/schedules/
            /data-source/nfl/game-finality/

      - name: Verify sparse inputs (fall back to a complete checkout)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in package-lock.json tools/rebuild_and_publish.py public/requests/RequestSchedule.ps1 data-meta data-source/leagues data-source/nfl/schedules data-source/nfl/game-finality data-source/nfl/teams.json public/data/Schedule.json public/data/Timestamps.json; do
            [[ -e "$path" ]] || { echo "::warning::Missing Games sparse input: $path"; missing=1; }
          done
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- Games checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Games checkout: sparse/blobless profile verified (partialclonefilter=$(git config --get remote.origin.partialclonefilter || echo none))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish Schedule data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope games
          --path public/data
          --
          pwsh ./public/requests/RequestSchedule.ps1
