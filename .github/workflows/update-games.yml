name: APP • Data • Games

on:
  push:
    branches:
      - main
    paths:
      - "source-data/nfl/game-finality/**"
  repository_dispatch:
    types:
      - scheduler-update-games
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish Games data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope games
          --path public/data
          --
          pwsh ./public/requests/RequestGames.ps1
