name: APP • Data • Weekly history rebuild

on:
  repository_dispatch:
    types:
      - scheduler-update-transactions
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full history, Drafts-only, or Past Seasons index-only refresh'
        required: false
        type: choice
        default: all
        options:
          - all
          - drafts
          - index

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Rebuild and publish historical League Derived and Transaction data
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode != 'drafts' && inputs.mode != 'index') }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope transactions
          --path public/data
          --path data-derived/league-transactions
          --path data-derived/league-drafts
          --path data-derived/season-statistics
          --path data-derived/league-records
          --path data-derived/league-rivalry
          --path data-derived/league-teams
          --path data-derived/league-schedule-outlook
          --path data-derived/matchup-context
          --path data-derived/weekly-recaps
          --path data-derived/team-injury-impact
          --
          bash -euo pipefail -c
          'mkdir -p "$RUNNER_TEMP/derived-summary" &&
           rm -f "$RUNNER_TEMP"/derived-summary/*.json &&
           python3 tools/derived_data.py materialize --product league-transactions | tee "$RUNNER_TEMP/derived-summary/league-transactions.json" &&
           python3 tools/derived_data.py materialize --product league-drafts | tee "$RUNNER_TEMP/derived-summary/league-drafts.json" &&
           python3 tools/league_history_app_publish.py write --fail-on-error &&
           python3 tools/schedule_archive.py write &&
           python3 tools/matchup_context_materialize.py --scope history &&
           python3 tools/matchup_context_app_publish.py write --scope history &&
           python3 tools/weekly_recaps_materialize.py --scope history &&
           python3 tools/weekly_recaps_app_publish.py write --scope history &&
           { python3 tools/team_injury_impact_materialize.py --scope history ||
             echo "::warning title=team-injury-impact not materialized::kept the last product"; } &&
           python3 tools/injury_impact_app_publish.py write &&
           { if python3 tools/derived_data.py materialize --product season-statistics --scope all > /dev/null; then
               if python3 tools/league_records_materialize.py --write; then
                 python3 tools/league_records_materialize.py --check > /dev/null || exit 1;
                python3 tools/league_records_app_publish.py write --fail-on-error || exit 1;
                 else echo "::warning title=league-records not materialized::kept the last valid product"; fi;
             else echo "::warning title=season-statistics not materialized::kept the last product; league-records not refreshed"; fi; } &&
           python3 tools/season_statistics_app_publish.py write --scope all &&
           python3 tools/league_schedule_outlook_materialize.py --scope all --mode full --fail-on-error &&
           python3 tools/league_schedule_outlook_app_publish.py write &&
           { python3 tools/derived_data.py materialize --product league-teams > /dev/null ||
             echo "::warning title=league-teams not materialized::kept the last product"; } &&
           python3 tools/team_seasons_app_publish.py write &&
           { python3 tools/derived_data.py materialize --product league-rivalry > /dev/null ||
             echo "::warning title=league-rivalry not materialized::kept the last product"; } &&
           python3 tools/rivalry_app_publish.py write &&
           pwsh ./public/requests/RequestPastSeasonsIndex.ps1'

      - name: Rebuild and publish Drafts-only data (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'drafts' }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope drafts
          --path public/data
          --path data-derived/league-drafts
          --
          bash -euo pipefail -c
          'python3 tools/derived_data.py materialize --product league-drafts &&
           python3 tools/league_history_app_publish.py write --fail-on-error &&
           pwsh ./public/requests/RequestPastSeasonsIndex.ps1'

      - name: Rebuild and publish Past Seasons index only (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'index' }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope past-seasons-index
          --path public/data/PastSeasonsIndex.json
          --
          pwsh ./public/requests/RequestPastSeasonsIndex.ps1

      - name: Summarize Derived products
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.mode != 'drafts' && inputs.mode != 'index')) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "derived-summary"
          print("## Shared Derived products")
          print()
          print("| Product | League | Seasons checked | Changed | Status |")
          print("|---|---|---|---|---|")
          for product in ("league-transactions", "league-drafts"):
              path = root / f"{product}.json"
              try:
                  results = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  print(f"| {product} | - | - | - | blocked (no result, see job log) |")
                  continue
              for result in results:
                  seasons = result.get("Seasons", [])
                  changed = sum(season.get("Written", 0) for season in seasons)
                  print(f"| {product} | {result.get('CanonicalLeagueID')} | {len(seasons)} | {changed} | {'changed' if changed else 'unchanged'} |")
          PY
