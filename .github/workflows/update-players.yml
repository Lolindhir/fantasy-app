name: APP • Data • Players

on:
  repository_dispatch:
    types:
      - scheduler-update-players
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Rebuild and publish Players data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope players
          --path public/data
          --path data-derived/player-valuation
          --
          bash -euo pipefail -c
          'python3 tools/derived_data.py materialize --product player-valuation > /dev/null &&
          python3 tools/players_app_publish.py write'
