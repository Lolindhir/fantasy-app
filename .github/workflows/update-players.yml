name: APP • Data • Players

on:
  repository_dispatch:
    types:
      - scheduler-update-players
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish Players data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope players
          --path public/data
          --
          pwsh ./public/requests/RequestPlayers.ps1
