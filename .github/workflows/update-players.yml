name: APP • Data • Players

on:
  repository_dispatch:
    types:
      - scheduler-update-players
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          # Season boundary: 2021 onwards covers the PlayerValuation history (league start 2024 minus 3 history
          # seasons of salary-v1). If a salary model reads more history seasons or a league starts earlier, move the
          # excluded year patterns below. The Verify step checks only 2025 and does not catch this.
          sparse-checkout: |
            /.github/
            /package.json
            /package-lock.json
            /tools/
            /public/data/
            /data-meta/
            /data-derived/
            /data-source/leagues/
            /data-source/nfl/teams.json
            /data-source/nfl/schedules/
            /data-source/nfl/game-finality/
            /data-source/nfl/identities/
            /data-source/nfl/platform/sleeper/
            /data-source/nfl/draft/
            /data-source/nfl/rosters/
            /data-source/nfl/weekly-rosters/
            /data-source/nfl/player-profiles/
            /data-source/nfl/player-game-long-gains/
            /data-source/nfl/qbr-week/
            /data-source/nfl/player-stats/
            /data-source/nfl/snap-counts/
            /data-source/nfl/special-teams-fumble-events/
            !/data-source/nfl/player-stats/19*/
            !/data-source/nfl/player-stats/200*/
            !/data-source/nfl/player-stats/201*/
            !/data-source/nfl/player-stats/2020/
            !/data-source/nfl/snap-counts/19*/
            !/data-source/nfl/snap-counts/200*/
            !/data-source/nfl/snap-counts/201*/
            !/data-source/nfl/snap-counts/2020/
            !/data-source/nfl/special-teams-fumble-events/19*/
            !/data-source/nfl/special-teams-fumble-events/200*/
            !/data-source/nfl/special-teams-fumble-events/201*/
            !/data-source/nfl/special-teams-fumble-events/2020/
            !/data-source/nfl/weekly-rosters/19*/
            !/data-source/nfl/weekly-rosters/200*/
            !/data-source/nfl/weekly-rosters/201*/
            !/data-source/nfl/weekly-rosters/2020/

      - name: Verify sparse inputs (fall back to a complete checkout)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in package-lock.json tools/rebuild_and_publish.py tools/players_app_publish.py data-meta data-derived/player-valuation data-source/leagues data-source/nfl/schedules data-source/nfl/identities data-source/nfl/platform/sleeper data-source/nfl/player-stats/2025 data-source/nfl/snap-counts/2025 public/data/Players.json public/data/Timestamps.json; do
            [[ -e "$path" ]] || { echo "::warning::Missing Players sparse input: $path"; missing=1; }
          done
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- Players checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Players checkout: sparse/blobless profile verified (partialclonefilter=$(git config --get remote.origin.partialclonefilter || echo none))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish Players data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope players
          --path public/data
          --path data-derived/player-valuation
          --
          python3 tools/players_app_publish.py write
