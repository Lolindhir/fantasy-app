name: APP • Data • Standings

on:
  repository_dispatch:
    types:
      - scheduler-update-standings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish Standings data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope standings
          --path public/data
          --
          pwsh ./public/requests/RequestStandings.ps1

  # Run the same weekly scheduler tick as Standings, but in a separate job
  # so historical PWF failures never suppress the original App Standings build.
  historical_pwf:
    name: Weekly finalized PlayerWeekFantasy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest repository inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Rebuild and publish every finalized PlayerWeekFantasy partition
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope player-week-fantasy
          --path data-derived/player-week-fantasy
          --
          python3 tools/historical_pwf_batch.py --write

      - name: Describe weekly PWF publication scope
        if: ${{ always() }}
        run: |
          echo "## Historical PlayerWeekFantasy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: all registered league manifests and canonically scored, NFL-finalized weeks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Output: data-derived/player-week-fantasy only; live App generator untouched" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generator: source-only preflight of every candidate before any changed partition is written" >> "$GITHUB_STEP_SUMMARY"
          echo "- On failure, no historical PWF commit is published" >> "$GITHUB_STEP_SUMMARY"
