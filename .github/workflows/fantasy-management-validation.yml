name: CI • Fantasy Management
run-name: "CI • Fantasy Management • ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  push:
    branches:
      - main
    paths:
      - "fantasy-management/automation/**"
      - "fantasy-management/sources/podcasts/**"
      - "fantasy-management/analyses/**/drafts/**"
      - "fantasy-management/_ai/schemas/**"
      - "fantasy-management/_ai/templates/podcast/**"
      - "fantasy-management/_ai/templates/draft-analysis/**"
      - "fantasy-management/_ai/entity-resolution/**"
      - "fantasy-management/_ai/scripts/**"
      - "fantasy-management/_ai/schema-list.json"
      - "fantasy-management/_ai/PODCAST_SOURCE_MODEL.md"
      - "fantasy-management/_ai/PODCAST_EXTRACTION_RULES.md"
      - "fantasy-management/_ai/WORKFLOWS.md"
      - "fantasy-management/AGENTS.md"
      - ".github/workflows/fantasy-management-validation.yml"
  pull_request:
    paths:
      - "fantasy-management/automation/**"
      - "fantasy-management/sources/podcasts/**"
      - "fantasy-management/analyses/**/drafts/**"
      - "fantasy-management/_ai/schemas/**"
      - "fantasy-management/_ai/templates/podcast/**"
      - "fantasy-management/_ai/templates/draft-analysis/**"
      - "fantasy-management/_ai/entity-resolution/**"
      - "fantasy-management/_ai/scripts/**"
      - "fantasy-management/_ai/schema-list.json"
      - "fantasy-management/_ai/PODCAST_SOURCE_MODEL.md"
      - "fantasy-management/_ai/PODCAST_EXTRACTION_RULES.md"
      - "fantasy-management/_ai/WORKFLOWS.md"
      - "fantasy-management/AGENTS.md"
      - ".github/workflows/fantasy-management-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-fantasy-management:
    name: Validate Fantasy Management artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Test entity mention coverage validator
        run: |
          python -m unittest discover \
            -s fantasy-management/_ai/scripts/tests \
            -p "test_*.py" \
            -v

      - name: Validate canonical state JSON formatting
        run: |
          python fantasy-management/_ai/scripts/validate_json_format.py \
            fantasy-management/automation/state/entity-observation.json

      - name: Validate entity observation base and shards
        run: |
          python fantasy-management/_ai/scripts/validate_observation_state_shards.py

      - name: Build lossless full-shard migration candidate
        if: github.event_name == 'pull_request'
        run: |
          python fantasy-management/_ai/scripts/migrate_observation_state_to_full_shards.py \
            --output-root "${RUNNER_TEMP}/entity-observation-full-shard-migration"

      - name: Upload full-shard migration candidate
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: entity-observation-full-shard-migration
          path: ${{ runner.temp }}/entity-observation-full-shard-migration/
          if-no-files-found: error
          retention-days: 1

      - name: Publish validated full-shard migration candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/263-full-shard-observation-state'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "${HEAD_REF}"
          git switch -C "${HEAD_REF}" "origin/${HEAD_REF}"
          cp "${RUNNER_TEMP}/entity-observation-full-shard-migration/entity-observation-index.json" \
            fantasy-management/automation/state/entity-observation-index.json
          cp "${RUNNER_TEMP}/entity-observation-full-shard-migration/entity-observation-targets/"*.json \
            fantasy-management/automation/state/entity-observation-targets/
          git add \
            fantasy-management/automation/state/entity-observation-index.json \
            fantasy-management/automation/state/entity-observation-targets/
          if git diff --cached --quiet; then
            echo "Validated migration candidate already materialized; commit skipped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize full-shard observation state"
          git push origin "HEAD:${HEAD_REF}"

      - name: Validate podcast package structure and takes
        run: |
          python fantasy-management/_ai/scripts/validate_episode_package.py --all

      - name: Validate podcast entity mention coverage
        run: |
          python fantasy-management/_ai/scripts/validate_episode_coverage.py --all

      - name: Validate structured draft analyses
        run: |
          python fantasy-management/_ai/scripts/validate_draft_analyses.py --all
