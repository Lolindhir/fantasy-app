name: Data • Source Readiness

on:
  repository_dispatch:
    types:
      - scheduler-source-data-readiness
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/source_data_readiness.py"
      - "tools/historical_fantasy_scoring.py"
      - "tools/tests/test_historical_fantasy_scoring.py"
      - ".github/workflows/source-data-readiness.yml"

permissions:
  contents: write

concurrency:
  group: source-data-readiness
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate historical scoring harness
        run: python -m unittest tools.tests.test_historical_fantasy_scoring -v

      - name: Build and publish source-data readiness audits
        shell: bash
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT_PUSH:-}" ]]; then
            echo "PAT_PUSH is required for repository-consistent write semantics." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/source_data_readiness.py --write

            mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                source-data/audits/nfl-source-data-readiness.json|source-data/audits/league-source-data-audit.json|source-data/audits/source-data-storage-audit.json) ;;
                *) unexpected+=("$path") ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unexpected readiness changes:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              exit 1
            fi

            git add -- source-data/audits/nfl-source-data-readiness.json source-data/audits/league-source-data-audit.json source-data/audits/source-data-storage-audit.json
            if git diff --cached --quiet; then
              echo "Source-data readiness audits already match main."
              exit 0
            fi

            timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "data(source): refresh readiness audits • $timestamp"
            if git push "$push_url" HEAD:main; then
              exit 0
            fi
            echo "main advanced while publishing readiness audits; retrying ($attempt/3)."
          done
          echo "Could not publish readiness audits after 3 attempts." >&2
          exit 1
