name: REPO • Scheduler
run-name: "REPO • Scheduler • ${{ github.event_name }}"

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types:
      - external-scheduler-tick
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: repo-central-workflow-scheduler
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch due workflows
        uses: actions/github-script@v7
        with:
          script: |
            const scheduler = require('./tools/run-workflow-scheduler.cjs');
            await scheduler.run({ github, context, core });
