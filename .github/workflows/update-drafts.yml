name: APP • Data • Drafts

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Request Script
        run: pwsh ./public/requests/RequestDrafts.ps1

      - name: Commit and push updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/**
          before_commit="$(git rev-parse HEAD)"
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope drafts
          after_commit="$(git rev-parse HEAD)"
          if [ "$before_commit" = "$after_commit" ]; then
            echo "No data commit created. Push skipped."
            exit 0
          fi
          git push https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/${{ github.repository }} HEAD:main
