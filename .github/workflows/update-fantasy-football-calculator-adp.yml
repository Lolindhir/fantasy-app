name: FM • Ranking • FFC ADP
run-name: "FM • Ranking • FFC ADP • ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  repository_dispatch:
    types:
      - scheduler-update-ffc-adp
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasy_football_calculator_adp.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_adp_core.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_adp_storage.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_kicker_adp.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasy_football_calculator_adp.py
      - fantasy-management/_ai/scripts/tests/test_fantasy_football_calculator_kicker_adp.py
      - .github/workflows/update-fantasy-football-calculator-adp.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasy_football_calculator_adp.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_adp_core.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_adp_storage.py
      - fantasy-management/_ai/scripts/fantasy_football_calculator_kicker_adp.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasy_football_calculator_adp.py
      - fantasy-management/_ai/scripts/tests/test_fantasy_football_calculator_kicker_adp.py
      - .github/workflows/update-fantasy-football-calculator-adp.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fantasy-football-calculator-adp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Fantasy Football Calculator ADP fetchers
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_fantasy_football_calculator_adp.py
          fantasy-management/_ai/scripts/tests/test_fantasy_football_calculator_kicker_adp.py
          -v

      - name: Update Fantasy Football Calculator ADP rankings
        run: >-
          python fantasy-management/_ai/scripts/fetch_fantasy_football_calculator_adp.py
          --skip-unchanged

      - name: Record successful FFC refresh
        if: github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id fantasy-football-calculator
          --workflow "FM • Ranking • FFC ADP"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/adp/fantasy-football-calculator

      - name: Commit and push updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            fantasy-management/sources/external-rankings/adp/fantasy-football-calculator/ \
            fantasy-management/sources/refresh-status/fantasy-football-calculator.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope ffc-adp-rankings
          python tools/publish_generated_commit.py --remote origin --branch main
