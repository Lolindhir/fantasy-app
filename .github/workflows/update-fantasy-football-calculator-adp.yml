name: FM • Ranking • FFC ADP

on:
  schedule:
    - cron: "44 3 * * *"  # 05:44 Europe/Berlin während CEST
    - cron: "44 4 * * *"  # 05:44 Europe/Berlin während CET
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fantasy-football-calculator-adp
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve Berlin schedule window
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: schedule gate passed."
            exit 0
          fi

          berlin_offset="$(TZ=Europe/Berlin date +%z)"
          if [[ "$berlin_offset" == "+0200" ]]; then
            expected_schedule="44 3 * * *"
          elif [[ "$berlin_offset" == "+0100" ]]; then
            expected_schedule="44 4 * * *"
          else
            echo "Unsupported Europe/Berlin UTC offset: $berlin_offset" >&2
            exit 1
          fi

          if [[ "$SCHEDULE_EXPRESSION" == "$expected_schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run selected for 05:44 Europe/Berlin."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Companion DST cron skipped for current Berlin offset $berlin_offset."
          fi

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Fantasy Football Calculator ADP fetcher
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_fantasy_football_calculator_adp.py
          -v

      - name: Update Fantasy Football Calculator ADP rankings
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/fetch_fantasy_football_calculator_adp.py
          --skip-unchanged

      - name: Record successful FFC refresh
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id fantasy-football-calculator
          --workflow "FM • Ranking • FFC ADP"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/adp/fantasy-football-calculator

      - name: Commit and push updates
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            fantasy-management/sources/external-rankings/adp/fantasy-football-calculator/ \
            fantasy-management/sources/refresh-status/fantasy-football-calculator.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope ffc-adp-rankings
          git push https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/${{ github.repository }} HEAD:main
