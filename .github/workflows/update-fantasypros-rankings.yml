name: FM • Ranking • FantasyPros ECR
run-name: "FM • Ranking • FantasyPros ECR • ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  repository_dispatch:
    types:
      - scheduler-update-fantasypros-rankings
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasypros_dynasty_superflex.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_dynasty_superflex_impl.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_redraft_ppr_superflex.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_redraft_ppr_superflex_impl.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasypros_dynasty_superflex.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasypros_redraft_ppr_superflex.py
      - .github/workflows/update-fantasypros-rankings.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasypros_dynasty_superflex.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_dynasty_superflex_impl.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_redraft_ppr_superflex.py
      - fantasy-management/_ai/scripts/fetch_fantasypros_redraft_ppr_superflex_impl.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasypros_dynasty_superflex.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasypros_redraft_ppr_superflex.py
      - .github/workflows/update-fantasypros-rankings.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fantasypros-rankings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FantasyPros fetchers
        run: >-
          python -m unittest discover
          -s fantasy-management/_ai/scripts/tests
          -p "test_fetch_fantasypros*.py"
          -v

      - name: Update FantasyPros rankings
        run: |
          python fantasy-management/_ai/scripts/fetch_fantasypros_dynasty_superflex.py --skip-unchanged
          python fantasy-management/_ai/scripts/fetch_fantasypros_redraft_ppr_superflex.py --skip-unchanged

      - name: Record successful FantasyPros refresh
        if: github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id fantasypros
          --workflow "FM • Ranking • FantasyPros ECR"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/expert-consensus/fantasypros

      - name: Commit and push updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A -- \
            fantasy-management/sources/external-rankings/expert-consensus/fantasypros \
            fantasy-management/sources/refresh-status/fantasypros.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope fantasypros-rankings
          python tools/publish_generated_commit.py --remote origin --branch main
