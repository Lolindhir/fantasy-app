name: APP • Data • Transactions

on:
  repository_dispatch:
    types:
      - scheduler-update-transactions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish historical League Derived and Transaction data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope transactions
          --path public/data
          --path data-derived/league-transactions
          --path data-derived/league-drafts
          --
          bash -euo pipefail -c
          'python3 tools/derived_data.py materialize --product league-transactions --league nfl-reise &&
           python3 tools/derived_data.py materialize --product league-drafts --league nfl-reise &&
           python3 tools/league_history_app_publish.py write --fail-on-error &&
           python3 tools/schedule_archive.py write &&
           pwsh ./public/requests/RequestPastSeasonsIndex.ps1'
