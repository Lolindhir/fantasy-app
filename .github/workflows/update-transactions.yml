name: APP • Data • Transactions

on:
  repository_dispatch:
    types:
      - scheduler-update-transactions
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full history, Drafts-only, or Past Seasons index-only refresh'
        required: false
        type: choice
        default: all
        options:
          - all
          - drafts
          - index

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish historical League Derived and Transaction data
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.mode != 'drafts' && inputs.mode != 'index') }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope transactions
          --path public/data
          --path data-derived/league-transactions
          --path data-derived/league-drafts
          --
          bash -euo pipefail -c
          'mkdir -p "$RUNNER_TEMP/derived-summary" &&
           rm -f "$RUNNER_TEMP"/derived-summary/*.json &&
           python3 tools/derived_data.py materialize --product league-transactions | tee "$RUNNER_TEMP/derived-summary/league-transactions.json" &&
           python3 tools/derived_data.py materialize --product league-drafts | tee "$RUNNER_TEMP/derived-summary/league-drafts.json" &&
           python3 tools/league_history_app_publish.py write --fail-on-error &&
           python3 tools/schedule_archive.py write &&
           python3 tools/matchup_context_app_publish.py write --scope history &&
           python3 tools/weekly_recaps_app_publish.py write --scope history &&
           pwsh ./public/requests/RequestPastSeasonsIndex.ps1'

      - name: Rebuild and publish Drafts-only data (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'drafts' }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope drafts
          --path public/data
          --path data-derived/league-drafts
          --
          bash -euo pipefail -c
          'python3 tools/derived_data.py materialize --product league-drafts &&
           python3 tools/league_history_app_publish.py write --fail-on-error &&
           pwsh ./public/requests/RequestPastSeasonsIndex.ps1'

      - name: Rebuild and publish Past Seasons index only (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'index' }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope past-seasons-index
          --path public/data/PastSeasonsIndex.json
          --
          pwsh ./public/requests/RequestPastSeasonsIndex.ps1

      - name: Summarize Derived products
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.mode != 'drafts' && inputs.mode != 'index')) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "derived-summary"
          print("## Shared Derived products")
          print()
          print("| Product | League | Seasons checked | Changed | Status |")
          print("|---|---|---|---|---|")
          for product in ("league-transactions", "league-drafts"):
              path = root / f"{product}.json"
              try:
                  results = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  print(f"| {product} | - | - | - | blocked (no result, see job log) |")
                  continue
              for result in results:
                  seasons = result.get("Seasons", [])
                  changed = sum(season.get("Written", 0) for season in seasons)
                  print(f"| {product} | {result.get('CanonicalLeagueID')} | {len(seasons)} | {changed} | {'changed' if changed else 'unchanged'} |")
          PY
