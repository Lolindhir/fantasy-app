name: Data • NFL Player Availability

on:
  repository_dispatch:
    types:
      - scheduler-sync-nfl-player-availability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-availability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild and publish ESPN player availability
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-player-availability
          --path source-data/nfl/player-availability
          --path source-data/providers/espn/player-availability
          --
          python3 tools/espn_player_availability.py
