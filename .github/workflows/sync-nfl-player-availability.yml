name: Data • NFL Player Availability

on:
  repository_dispatch:
    types:
      - scheduler-sync-nfl-player-availability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-availability:
    runs-on: ubuntu-latest
    steps:
      # G5 AP3b (Issue #1263): the writer reads tools code, the league manifests (current season) and its own
      # two output prefixes; publication scope, token and rebuild-and-retry semantics are unchanged.
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /tools/
            /data-source/leagues/*/manifest.json
            /data-source/nfl/player-availability/
            /data-source/providers/espn/

      - name: Verify sparse inputs (fall back to a complete checkout)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in tools/espn_player_availability.py tools/rebuild_and_publish.py .github/scripts/Invoke-GeneratedDataCommit.ps1; do
            [[ -f "$path" ]] || { echo "::warning::Missing sparse input: $path"; missing=1; }
          done
          compgen -G "data-source/leagues/*/manifest.json" >/dev/null || { echo "::warning::Missing league manifests in sparse checkout"; missing=1; }
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- Availability checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Availability checkout: sparse/blobless profile verified" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Rebuild and publish ESPN player availability
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-player-availability
          --path data-source/nfl/player-availability
          --path data-source/providers/espn
          --
          python3 tools/espn_player_availability.py
