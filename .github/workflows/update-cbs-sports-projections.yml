name: Update CBS Sports Projections

on:
  schedule:
    - cron: "37 6 * * *"  # täglich um 06:37 UTC
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-cbs-sports-projections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test CBS Sports projection fetcher
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_kicker_projections.py
          -v

      - name: Update CBS Sports projections
        run: >-
          python fantasy-management/_ai/scripts/fetch_cbs_sports_kicker_projections.py
          --skip-unchanged

      - name: Commit and push updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fantasy-management/sources/external-rankings/projections/cbs-sports/
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope cbs-projections
          git push https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/${{ github.repository }} HEAD:main
