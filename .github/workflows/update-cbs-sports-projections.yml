name: FM • Projection • CBS Sports

on:
  schedule:
    - cron: "8 4 * * *"  # 06:08 Europe/Berlin während CEST
    - cron: "8 5 * * *"  # 06:08 Europe/Berlin während CET
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_cbs_sports_kicker_projections.py
      - fantasy-management/_ai/scripts/fetch_cbs_sports_offense_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_kicker_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_offense_projections.py
      - .github/workflows/update-cbs-sports-projections.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_cbs_sports_kicker_projections.py
      - fantasy-management/_ai/scripts/fetch_cbs_sports_offense_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_kicker_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_offense_projections.py
      - .github/workflows/update-cbs-sports-projections.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-cbs-sports-projections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve Berlin schedule window
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled run: schedule gate passed."
            exit 0
          fi

          berlin_offset="$(TZ=Europe/Berlin date +%z)"
          if [[ "$berlin_offset" == "+0200" ]]; then
            expected_schedule="8 4 * * *"
          elif [[ "$berlin_offset" == "+0100" ]]; then
            expected_schedule="8 5 * * *"
          else
            echo "Unsupported Europe/Berlin UTC offset: $berlin_offset" >&2
            exit 1
          fi

          if [[ "$SCHEDULE_EXPRESSION" == "$expected_schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run selected for 06:08 Europe/Berlin."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Companion DST cron skipped for current Berlin offset $berlin_offset."
          fi

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test CBS Sports projection fetchers
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_kicker_projections.py
          fantasy-management/_ai/scripts/tests/test_fetch_cbs_sports_offense_projections.py
          -v

      - name: Fetch and validate CBS Sports kicker projections
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/fetch_cbs_sports_kicker_projections.py
          --skip-unchanged

      - name: Fetch and validate CBS Sports offensive projections
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/fetch_cbs_sports_offense_projections.py
          --skip-unchanged

      - name: Record successful CBS Sports refresh
        if: steps.schedule_gate.outputs.run == 'true' && github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id cbs-sports
          --workflow "FM • Projection • CBS Sports"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/projections/cbs-sports

      - name: Commit and push updates
        if: steps.schedule_gate.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            fantasy-management/sources/external-rankings/projections/cbs-sports/ \
            fantasy-management/sources/refresh-status/cbs-sports.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope cbs-projections
          python tools/publish_generated_commit.py --remote origin --branch main
