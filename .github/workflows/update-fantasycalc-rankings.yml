name: Update FantasyCalc Rankings

on:
  schedule:
    - cron: "43 5 * * *"  # täglich um 05:43 UTC
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fantasycalc-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FantasyCalc fetcher
        run: >-
          python -m unittest discover
          -s fantasy-management/_ai/scripts/tests
          -p "test_fetch_fantasycalc*.py"
          -v

      - name: Update FantasyCalc rankings
        run: >-
          python fantasy-management/_ai/scripts/fetch_fantasycalc_rankings.py
          --skip-unchanged

      - name: Commit and push updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fantasy-management/sources/external-rankings/market-value/fantasycalc/
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope fantasycalc-rankings
          git push https://x-access-token:${{ secrets.PAT_PUSH }}@github.com/${{ github.repository }} HEAD:main
