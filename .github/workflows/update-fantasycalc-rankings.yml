name: FM • Ranking • FantasyCalc Market
run-name: "FM • Ranking • FantasyCalc Market • ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  schedule:
    - cron: "32 5 * * *"  # Pre-Operations-Refresh vor dem 07:00-Europe/Berlin-Lauf
      timezone: "Europe/Berlin"
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasycalc_rankings.py
      - fantasy-management/_ai/scripts/fetch_fantasycalc_rankings_impl.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasycalc_rankings.py
      - .github/workflows/update-fantasycalc-rankings.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fantasycalc_rankings.py
      - fantasy-management/_ai/scripts/fetch_fantasycalc_rankings_impl.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fantasycalc_rankings.py
      - .github/workflows/update-fantasycalc-rankings.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fantasycalc-rankings-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FantasyCalc fetcher
        run: >-
          python -m unittest discover
          -s fantasy-management/_ai/scripts/tests
          -p "test_fetch_fantasycalc*.py"
          -v

      - name: Update FantasyCalc rankings
        run: >-
          python fantasy-management/_ai/scripts/fetch_fantasycalc_rankings.py
          --skip-unchanged

      - name: Record successful FantasyCalc refresh
        if: github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id fantasycalc
          --workflow "FM • Ranking • FantasyCalc Market"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/market-value/fantasycalc

      - name: Commit and push updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            fantasy-management/sources/external-rankings/market-value/fantasycalc/ \
            fantasy-management/sources/refresh-status/fantasycalc.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope fantasycalc-rankings
          python tools/publish_generated_commit.py --remote origin --branch main
