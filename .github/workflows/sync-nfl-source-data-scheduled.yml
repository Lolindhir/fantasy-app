name: Data • NFL Source Sync • Scheduled

on:
  repository_dispatch:
    types:
      - scheduler-sync-nfl-source-data
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-source-data-scheduled-dispatch
  cancel-in-progress: false

jobs:
  sync:
    uses: ./.github/workflows/sync-nfl-source-data.yml
    secrets:
      PAT_PUSH: ${{ secrets.PAT_PUSH }}
