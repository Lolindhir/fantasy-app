name: FM • Materialize • Operations Inputs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - public/data/League.json
      - public/data/Players.json
      - public/data/Timestamps.json
      - fantasy-management/sources/external-rankings/**
      - fantasy-management/sources/external-signals/**
      - fantasy-management/automation/input-materialization.json
      - fantasy-management/automation/external-signal-materialization.json
      - fantasy-management/automation/player-signal-materialization.json
      - fantasy-management/automation/free-agent-materialization.json
      - fantasy-management/automation/kicker-streaming-input-materialization.json
      - fantasy-management/_ai/operations-source-catalog.json
      - fantasy-management/_ai/operations-external-signal-catalog.json
      - fantasy-management/_ai/scripts/build_fantasy_operations_inputs.py
      - fantasy-management/_ai/scripts/materialize_external_signals.py
      - fantasy-management/_ai/scripts/build_player_signal_dataset.py
      - fantasy-management/_ai/scripts/build_free_agent_dataset.py
      - fantasy-management/_ai/scripts/build_kicker_streaming_inputs.py
      - fantasy-management/_ai/scripts/tests/test_build_fantasy_operations_inputs.py
      - fantasy-management/_ai/scripts/tests/test_materialize_external_signals.py
      - fantasy-management/_ai/scripts/tests/test_build_player_signal_dataset.py
      - fantasy-management/_ai/scripts/tests/test_build_free_agent_dataset.py
      - fantasy-management/_ai/scripts/tests/test_build_kicker_streaming_inputs.py
      - fantasy-management/_ai/scripts/tests/test_kicker_streaming_workflow.py
      - fantasy-management/_ai/schemas/fantasy-operations-inputs.schema.json
      - fantasy-management/_ai/schemas/operations-source-catalog.schema.json
      - fantasy-management/_ai/schemas/operations-external-signal-catalog.schema.json
      - fantasy-management/_ai/schemas/external-signal-relevance.schema.json
      - fantasy-management/_ai/schemas/player-signal-dataset.schema.json
      - fantasy-management/_ai/schemas/free-agent-dataset.schema.json
      - fantasy-management/_ai/schemas/kicker-streaming-inputs.schema.json
      - fantasy-management/_ai/FANTASY_OPERATIONS_ARCHITECTURE.md
      - .github/workflows/materialize-fantasy-operations-inputs.yml

permissions:
  contents: write

concurrency:
  group: fantasy-operations-input-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install jsonschema

      - name: Run focused unit tests
        run: |
          python -m unittest \
            fantasy-management/_ai/scripts/tests/test_build_fantasy_operations_inputs.py \
            fantasy-management/_ai/scripts/tests/test_materialize_external_signals.py \
            fantasy-management/_ai/scripts/tests/test_build_player_signal_dataset.py \
            fantasy-management/_ai/scripts/tests/test_build_free_agent_dataset.py \
            fantasy-management/_ai/scripts/tests/test_build_kicker_streaming_inputs.py \
            fantasy-management/_ai/scripts/tests/test_kicker_streaming_workflow.py \
            -v

      - name: Commit generated inputs when changed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python fantasy-management/_ai/scripts/build_fantasy_operations_inputs.py
            python fantasy-management/_ai/scripts/materialize_external_signals.py
            python fantasy-management/_ai/scripts/build_player_signal_dataset.py
            python fantasy-management/_ai/scripts/build_free_agent_dataset.py
            python fantasy-management/_ai/scripts/build_kicker_streaming_inputs.py

            test -s fantasy-management/generated/operations/player-signals.json || {
              echo "player-signals.json is missing or empty after materialization" >&2
              exit 1
            }
            python -c 'import json; from pathlib import Path; from jsonschema import Draft202012Validator; data=json.loads(Path("fantasy-management/generated/operations/player-signals.json").read_text(encoding="utf-8")); schema=json.loads(Path("fantasy-management/_ai/schemas/player-signal-dataset.schema.json").read_text(encoding="utf-8")); Draft202012Validator(schema).validate(data); count=data["population"]["player_count"]; assert count > 0 and len(data["players"]) == count, "invalid player-signals population"; print(f"Validated player-signals.json with {count} players.")'

            test -s fantasy-management/generated/operations/free-agent-signals.json || {
              echo "free-agent-signals.json is missing or empty after materialization" >&2
              exit 1
            }
            python -c 'import json; from pathlib import Path; from jsonschema import Draft202012Validator; data=json.loads(Path("fantasy-management/generated/operations/free-agent-signals.json").read_text(encoding="utf-8")); schema=json.loads(Path("fantasy-management/_ai/schemas/free-agent-dataset.schema.json").read_text(encoding="utf-8")); Draft202012Validator(schema).validate(data); count=data["population"]["player_count"]; assert count > 0 and len(data["players"]) == count, "invalid free-agent-signals population"; assert all(player["ownership"]["status"] == "fantasy_free_agent" for player in data["players"]), "rostered player in free-agent-signals"; print(f"Validated free-agent-signals.json with {count} fantasy free agents.")'

            test -s fantasy-management/generated/operations/kicker-streaming-inputs.json || {
              echo "kicker-streaming-inputs.json is missing or empty after materialization" >&2
              exit 1
            }
            python -c 'import json; from pathlib import Path; from jsonschema import Draft202012Validator; data=json.loads(Path("fantasy-management/generated/operations/kicker-streaming-inputs.json").read_text(encoding="utf-8")); schema=json.loads(Path("fantasy-management/_ai/schemas/kicker-streaming-inputs.schema.json").read_text(encoding="utf-8")); Draft202012Validator(schema).validate(data); count=data["population"]["candidate_count"]; held=data["population"]["held_count"]; free=data["population"]["free_agent_count"]; assert count > 0 and len(data["candidates"]) == count, "invalid kicker-streaming candidate population"; assert free > 0, "no fantasy-free-agent kickers in kicker-streaming inputs"; assert all(candidate["availability"] in {"held", "free_agent"} for candidate in data["candidates"]), "invalid kicker availability"; assert all(candidate["availability"] != "free_agent" or candidate["ownership"]["status"] == "fantasy_free_agent" for candidate in data["candidates"]), "rostered kicker marked free_agent"; print(f"Validated kicker-streaming-inputs.json with {count} candidates ({held} held, {free} free agents).")'

            git add \
              fantasy-management/generated/operations/managed-roster-signals.json \
              fantasy-management/generated/operations/external-signal-relevance.json \
              fantasy-management/generated/operations/player-signals.json \
              fantasy-management/generated/operations/free-agent-signals.json \
              fantasy-management/generated/operations/kicker-streaming-inputs.json \
              fantasy-management/generated/operations/data-quality.json

            if git diff --cached --quiet; then
              echo "No Fantasy Operations input changes."
              exit 0
            fi

            git commit -m "data(fantasy-operations): materialize inputs"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push race on attempt ${attempt}; rebuilding from current main."
            git reset --hard origin/main
          done

          echo "Unable to publish materialized Fantasy Operations inputs after 3 attempts." >&2
          exit 1
