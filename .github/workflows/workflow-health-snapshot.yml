name: REPO • Monitoring • Workflow Health Snapshot

on:
  repository_dispatch:
    types:
      - scheduler-workflow-health
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: workflow-health-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Issue #1263 G5 E6: the snapshot reads only the policy, the scheduler schedule, the workflow inventory and
      # tools/, and writes only workflow-health.json on the isolated state branch. A sparse/blobless checkout skips
      # the multi-gigabyte data trees (about 48 s of a 100 s run, 48 runs a day). /workflow-health.json keeps the
      # state-branch switch of the publish step free of sparse-path conflicts. An incomplete profile falls back to a
      # complete checkout (verify step below). Token, concurrency, permissions and the publish step are unchanged.
      - name: Checkout main (sparse, blobless)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tools/
            /.ai-context/manual/workflow-monitoring.yaml
            /workflow-health.json

      - name: Verify sparse inputs (fall back to a complete checkout)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [[ "$(git config --get core.sparseCheckout)" == "true" ]] || { echo "::warning::Sparse checkout disabled"; missing=1; }
          for path in tools/build_workflow_health_snapshot.py tools/tests/test_build_workflow_health_snapshot.py .ai-context/manual/workflow-monitoring.yaml .github/workflow-schedules.json .github/workflows; do
            [[ -e "$path" ]] || { echo "::warning::Missing sparse input: $path"; missing=1; }
          done
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- Snapshot checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Snapshot checkout: sparse/blobless profile verified" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install monitoring dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Load previous health snapshot
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin workflow-health-state:refs/remotes/origin/workflow-health-state; then
            git show origin/workflow-health-state:workflow-health.json > /tmp/previous-workflow-health.json || true
          else
            echo "workflow-health-state branch is missing; the publish step will initialize it."
          fi

      - name: Test snapshot logic
        run: python -m unittest discover -s tools/tests -p "test_build_workflow_health_snapshot.py" -v

      - name: Build workflow health snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --policy .ai-context/manual/workflow-monitoring.yaml
            --output /tmp/workflow-health.json
            --source-sha "${GITHUB_SHA}"
          )
          if [[ -f /tmp/previous-workflow-health.json ]]; then
            args+=(--previous-snapshot /tmp/previous-workflow-health.json)
          fi
          python tools/build_workflow_health_snapshot.py "${args[@]}"

      - name: Publish snapshot to isolated state branch
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --depth=1 origin workflow-health-state:refs/remotes/origin/workflow-health-state; then
            git switch -C workflow-health-state origin/workflow-health-state
          else
            git switch --orphan workflow-health-state
            git rm -rf . || true
          fi
          cp /tmp/workflow-health.json workflow-health.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add workflow-health.json
          git commit -m "chore(monitoring): refresh workflow health snapshot"
          git push origin HEAD:workflow-health-state
