name: REPO • Monitoring • Workflow Health Snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:
    workflows:
      - "APP • Data • League"
    types:
      - completed
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workflow-health-snapshot.yml"
      - ".ai-context/manual/workflow-monitoring.yaml"
      - "tools/build_workflow_health_snapshot.py"
      - "tools/tests/test_build_workflow_health_snapshot.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: workflow-health-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide whether snapshot build is needed
        id: snapshot-gate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIGGERING_WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          FALLBACK_MIN_AGE_MINUTES: "40"
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_run" ]]; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            echo "Primary trigger (${GITHUB_EVENT_NAME}); building snapshot."
            exit 0
          fi

          if [[ "${TRIGGERING_WORKFLOW_EVENT}" != "schedule" ]]; then
            echo "should-run=false" >> "${GITHUB_OUTPUT}"
            echo "Ignoring League fallback from non-scheduled event: ${TRIGGERING_WORKFLOW_EVENT:-unknown}."
            exit 0
          fi

          snapshot_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/workflow-health.json?ref=workflow-health-state"
          if ! snapshot_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${snapshot_url}")"; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            echo "Existing snapshot is missing or unreadable; fallback will rebuild it."
            exit 0
          fi

          generated_at="$(printf '%s' "${snapshot_json}" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("generatedAt", ""))')"
          if [[ -z "${generated_at}" ]]; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            echo "Existing snapshot has no generatedAt; fallback will rebuild it."
            exit 0
          fi

          if ! generated_epoch="$(date -u -d "${generated_at}" +%s 2>/dev/null)"; then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            echo "Existing snapshot generatedAt is invalid; fallback will rebuild it."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          age_seconds=$(( now_epoch - generated_epoch ))
          threshold_seconds=$(( FALLBACK_MIN_AGE_MINUTES * 60 ))

          if (( age_seconds >= threshold_seconds )); then
            echo "should-run=true" >> "${GITHUB_OUTPUT}"
            echo "Existing snapshot is $(( age_seconds / 60 )) minutes old; fallback will rebuild it."
          else
            echo "should-run=false" >> "${GITHUB_OUTPUT}"
            echo "Existing snapshot is $(( age_seconds / 60 )) minutes old; fallback is not needed."
          fi

      - name: Checkout main
        if: steps.snapshot-gate.outputs.should-run == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: steps.snapshot-gate.outputs.should-run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install monitoring dependency
        if: steps.snapshot-gate.outputs.should-run == 'true'
        run: python -m pip install "PyYAML>=6,<7"

      - name: Load previous health snapshot
        if: steps.snapshot-gate.outputs.should-run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin workflow-health-state:refs/remotes/origin/workflow-health-state; then
            git show origin/workflow-health-state:workflow-health.json > /tmp/previous-workflow-health.json || true
          else
            echo "workflow-health-state branch is missing; the publish step will initialize it."
          fi

      - name: Test snapshot logic
        if: steps.snapshot-gate.outputs.should-run == 'true'
        run: python -m unittest discover -s tools/tests -p "test_build_workflow_health_snapshot.py" -v

      - name: Build workflow health snapshot
        if: steps.snapshot-gate.outputs.should-run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(
            --repository "${GITHUB_REPOSITORY}"
            --policy .ai-context/manual/workflow-monitoring.yaml
            --output /tmp/workflow-health.json
            --source-sha "${GITHUB_SHA}"
          )
          if [[ -f /tmp/previous-workflow-health.json ]]; then
            args+=(--previous-snapshot /tmp/previous-workflow-health.json)
          fi
          python tools/build_workflow_health_snapshot.py "${args[@]}"

      - name: Publish snapshot to isolated state branch
        if: steps.snapshot-gate.outputs.should-run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch origin workflow-health-state:refs/remotes/origin/workflow-health-state; then
            git switch -C workflow-health-state origin/workflow-health-state
          else
            git switch --orphan workflow-health-state
            git rm -rf . || true
          fi
          cp /tmp/workflow-health.json workflow-health.json
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add workflow-health.json
          git commit -m "chore(monitoring): refresh workflow health snapshot"
          git push origin HEAD:workflow-health-state
