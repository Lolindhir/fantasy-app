name: APP • Deploy • GitHub Pages
run-name: "APP • Deploy • ${{ github.event.head_commit.message || github.event_name }}"

on:
  workflow_dispatch:   # manueller Start
  push:
    branches:
      - main
    paths-ignore:
      - "fantasy-management/**"
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment script (build + JSON kopieren)
        shell: pwsh
        run: ./deploy_action.ps1

      - name: Upload deploy diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-script-diagnostics-${{ github.sha }}
          path: .ai-workflow
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/fantasy-league-custom-frontend/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  workflow-result:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: ${{ always() }}

    steps:
      - name: Write machine-readable workflow result
        shell: pwsh
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path ".ai-workflow" -Force | Out-Null

          $buildResult = $env:BUILD_RESULT
          $deployResult = $env:DEPLOY_RESULT

          if ($buildResult -eq 'success' -and $deployResult -eq 'success') {
            $conclusion = 'success'
          } elseif ($buildResult -eq 'cancelled' -or $deployResult -eq 'cancelled') {
            $conclusion = 'cancelled'
          } else {
            $conclusion = 'failure'
          }

          $result = [ordered]@{
            schemaVersion = 1
            type = 'deploy-workflow-result'
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            shortCommit = $env:GITHUB_SHA.Substring(0, 7)
            ref = $env:GITHUB_REF
            event = $env:GITHUB_EVENT_NAME
            build = $buildResult
            deploy = $deployResult
            conclusion = $conclusion
            generatedAtUtc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }

          $result | ConvertTo-Json -Depth 10 | Set-Content ".ai-workflow/workflow-result.json" -Encoding utf8

          if ($conclusion -eq 'success') {
            $statusState = 'success'
          } elseif ($conclusion -eq 'cancelled') {
            $statusState = 'error'
          } else {
            $statusState = 'failure'
          }

          $statusDescription = "build=$buildResult deploy=$deployResult conclusion=$conclusion"
          if ($statusDescription.Length -gt 140) {
            $statusDescription = $statusDescription.Substring(0, 140)
          }

          $statusBody = @{
            state = $statusState
            target_url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description = $statusDescription
            context = 'deploy/result'
          } | ConvertTo-Json -Depth 10

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers $headers -ContentType 'application/json' -Body $statusBody | Out-Null

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Deploy result"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Commit: $env:GITHUB_SHA"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Build: $buildResult"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Deploy: $deployResult"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Conclusion: $conclusion"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Commit status: deploy/result = $statusState"

      - name: Upload AI-readable workflow result
        uses: actions/upload-artifact@v4
        with:
          name: ai-workflow-result-${{ github.sha }}
          path: .ai-workflow/workflow-result.json
          retention-days: 14
