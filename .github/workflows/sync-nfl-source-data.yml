              echo "NFL provider raw sync failed." >&2
              write_failure_diagnostic "raw-sync" "$raw_status" "$raw_log"
              exit "$raw_status"
            fi

            # Historical intake selection is sticky across the OUTER publication
            # retry loop, including a successful Raw push followed by a Canonical
            # push race. A no-candidate first attempt must also remain a no-op.
            if [[ "${INJURY_HISTORY_DUE:-false}" == "true" ]]; then
