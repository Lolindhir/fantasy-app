          if scope == "game-finality":
              schedule_evaluated = result.get("scheduleCanonicalFileCount") or 0
              finality_evaluated = result.get("gameFinalityCanonicalFileCount") or 0
              schedule_changed = result.get("scheduleFilesChanged") or 0
              finality_changed = result.get("gameFinalityFilesChanged") or 0
              changed = (result.get("scheduleChangedPaths") or []) + (result.get("gameFinalityChangedPaths") or [])
              print(f"- Scoped canonical files evaluated: {schedule_evaluated + finality_evaluated}")
              print(f"- Scoped canonical files changed: {schedule_changed + finality_changed}")
              print("- Scoped changed paths: " + (", ".join(changed) if changed else "none"))
              diagnostics = result.get("gameFinalityDiagnostics") or {}
              print(
                  "- Finality evidence flags: "
                  f"released={diagnostics.get('releasedEvidenceCount')}, "
                  f"schedule={diagnostics.get('scheduleGameCount')}, "
                  f"final={diagnostics.get('finalGameCount')}, "
                  f"weekFinal={diagnostics.get('weekFinalCount')}"
              )
          elif scope == "injuries":
              print(f"- Injury canonical season: {result.get('injurySeason')}")
              print(f"- Injury canonical files changed: {result.get('injuryCanonicalFilesChanged')}")
              print("- Injury canonical changed paths: " +
                    (", ".join(result.get("injuryCanonicalChangedPaths") or []) or "none"))
              print("- Obsolete injury weeks requiring review: " +
                    (", ".join(result.get("injuryObsoleteRequiresReview") or []) or "none"))
          elif scope == "schedule-odds":
              print(f"- Scoped canonical files evaluated: {result.get('oddsCanonicalFileCount')}")
              print(f"- Scoped canonical files changed: {result.get('oddsFilesChanged')}")
              print("- Scoped changed paths: " + (", ".join(result.get("oddsChangedPaths") or []) or "none"))
              diagnostics = result.get("oddsDiagnostics") or {}
              print(
                  "- Odds coverage: "
                  f"games={diagnostics.get('gameCount')}, "
                  f"complete={diagnostics.get('gamesWithCompleteLines')}, "
                  f"incomplete={diagnostics.get('gamesWithoutCompleteLines')}"
              )
          else:
              print(
                  "- Full materialization change flags: "
                  f"identity={result.get('identityChanged')}, "
                  f"providerMappings={result.get('providerMappingsChanged')}, "
                  f"draftFiles={result.get('draftFilesChanged')}, "
                  f"phase1Files={result.get('phase1FilesChanged')}, "
                  f"audit={result.get('auditChanged')}"
              )
          PY

            # The exact same persisted/raw state must be a semantic no-op on pass two.
            noop_log="$(mktemp)"
            noop_start="$(date +%s)"
            set +e
            python tools/nfl_source_data.py "${materialize_args[@]}" 2>&1 | tee "$noop_log"
            noop_status=${PIPESTATUS[0]}
            if (( noop_status == 0 )); then
              python - "$noop_log" "$materialization_scope" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          scope = sys.argv[2]
          if scope == "game-finality":
              expected = {
                  "scheduleFilesChanged": 0,
                  "scheduleChangedPaths": [],
                  "gameFinalityFilesChanged": 0,
                  "gameFinalityChangedPaths": [],
              }
          elif scope == "schedule-odds":
              expected = {
                  "oddsFilesChanged": 0,
                  "oddsChangedPaths": [],
              }
          elif scope == "injuries":
              expected = {
                  "injuryCanonicalFilesChanged": 0,
                  "injuryCanonicalChangedPaths": [],
                  "injuryObsoleteRequiresReview": [],
              }
          else:
              expected = {
                  "identityChanged": False,
                  "providerMappingsChanged": False,
                  "draftFilesChanged": 0,
                  "auditChanged": False,
              }
          actual = {key: result.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(
                  "Semantic no-op verification failed: "
                  + json.dumps({"scope": scope, "expected": expected, "actual": actual}, sort_keys=True)
              )
          PY
              noop_status=$?
            fi
            if (( noop_status == 0 )) && [[ "${INJURY_HISTORY_DUE:-false}" == "true" ]]; then
