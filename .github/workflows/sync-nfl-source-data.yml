name: Data • NFL Source Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-nfl-source-data.yml"
      - "tools/nfl_source_data.py"
      - "tools/nfl_source_data_lib/**"
      - "tools/nfl_pbp_source_auto.py"
      - "tools/nfl_game_details_materialize.py"
      - "tools/derived_data_lib/nfl_game_detail_core.py"
      - "tools/derived_data_lib/nfl_pbp_accepted_season.py"
      - "tools/tests/test_nfl_source*.py"
  repository_dispatch:
    types:
      - scheduler-sync-nfl-source-data
  workflow_dispatch:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      season:
        description: "Optional comma-separated season(s); leave blank for current season plus bounded missing-history healing on a full sync"
        required: false
        type: string
        default: ""
      historical_backfill_limit:
        description: "Max missing historical partitions to heal on an unfiltered full sync; 0 disables"
        required: false
        type: number
        default: 12
      expected_injury_sha256:
        description: "Optional exact SHA-256 binding to preflighted original Injury source bytes"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
      materialization_scope:
        description: "Canonical materialization scope; full is the normal source path, game-finality is reserved for the Finality wrapper"
        required: false
        type: string
        default: "full"
      reconcile_injury_history:
        description: "Run the historical Injury Source/Canonical/Derived reconciliation now (requires full scope, no dataset/season filters, force off)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      season:
        description: "Optional comma-separated season(s); leave blank for current season plus bounded missing-history healing on a full sync"
        required: false
        type: string
        default: ""
      historical_backfill_limit:
        description: "Max missing historical partitions to heal on an unfiltered full sync; 0 disables"
        required: false
        type: number
        default: 12
      expected_injury_sha256:
        description: "Optional exact SHA-256 binding to preflighted original Injury source bytes"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
      materialization_scope:
        description: "Canonical materialization scope"
        required: false
        type: string
        default: "full"
    outputs:
      main_before_sync:
        description: "origin/main commit at the start of the sync job (NFL Live change detection base)"
        value: ${{ jobs.sync.outputs.main_before_sync }}
    secrets:
      PAT_PUSH:
        required: true

permissions:
  contents: write
  actions: read

# G5 (Issue #1263): queue: max keeps every waiting run in this shared Source writer group (FIFO, GitHub cap 100)
# instead of replacing the single pending slot. Callers (live pipelines, Injury wrapper, Odds, manual and
# scheduled syncs) no longer cancel each other while a long run holds the group; writer serialization is unchanged.
concurrency:
  group: nfl-source-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MATERIALIZATION_SCOPE: ${{ inputs.materialization_scope || 'full' }}
    outputs:
      main_before_sync: ${{ steps.base.outputs.main_before_sync }}
      injury_history_due: ${{ steps.injury_history_due.outputs.due }}

    steps:
      - name: Record queue timing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_start_epoch="$(date +%s)"
          echo "JOB_START_EPOCH=$job_start_epoch" >> "$GITHUB_ENV"
          echo "CHECKOUT_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

          queue_seconds="$(python3 - <<'PY' || true
          import json
          import os
          import urllib.request
          from datetime import datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ.get("GH_TOKEN", "")

          def fetch(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              run = fetch(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              jobs = fetch(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")
              created = datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              starts = [
                  datetime.fromisoformat(job["started_at"].replace("Z", "+00:00"))
                  for job in jobs.get("jobs", [])
                  if job.get("started_at")
              ]
              if not starts:
                  print("unavailable")
              else:
                  print(max(0, int((min(starts) - created).total_seconds())))
          except Exception:
              print("unavailable")
          PY
          )"
          echo "QUEUE_SECONDS=$queue_seconds" >> "$GITHUB_ENV"
          echo "## NFL Source Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Queue before job start: ${queue_seconds}s" >> "$GITHUB_STEP_SUMMARY"

      # G5 E5 (Issue #1263): the game-finality scope (NFL Live finality job) reads and writes only the registry, tools,
      # the canonical and raw schedules and game-finality partitions and data-source/_sync (strace of the exact
      # commands). It therefore gets a sparse, blobless checkout; every other scope keeps the complete checkout.
      # Token, branch, write paths, concurrency and the publication loop are unchanged. An incomplete profile falls
      # back to a complete checkout (verify step below).
      - name: Checkout main (game-finality sparse, blobless)
        if: inputs.materialization_scope == 'game-finality'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /tools/
            /data-source/*.json
            /data-source/nfl/*.json
            /data-source/leagues/*/manifest.json
            /data-source/nfl/schedules/
            /data-source/nfl/game-finality/
            /data-source/providers/nflverse/schedules/
            /data-source/providers/nflverse/game-finality/
            /data-source/_sync/

      - name: Checkout main
        if: inputs.materialization_scope != 'game-finality'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: ${{ (inputs.materialization_scope == 'game-finality' || inputs.materialization_scope == 'schedule-odds') && 1 || 0 }}
          token: ${{ secrets.PAT_PUSH }}

      - name: Verify game-finality sparse inputs (fall back to a complete checkout)
        if: inputs.materialization_scope == 'game-finality'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [[ "$(git config --get core.sparseCheckout)" == "true" ]] || { echo "::warning::Sparse checkout disabled"; missing=1; }
          for path in tools/nfl_source_data.py tools/git_transient.py data-source/registry.json data-source/leagues/nfl-reise/manifest.json data-source/nfl/teams.json data-source/nfl/schedules data-source/nfl/game-finality data-source/providers/nflverse/schedules/raw-latest.csv data-source/providers/nflverse/schedules/metadata.json data-source/providers/nflverse/game-finality/raw-latest.csv data-source/providers/nflverse/game-finality/metadata.json; do
            [[ -e "$path" ]] || { echo "::warning::Missing sparse input: $path"; missing=1; }
          done
          [[ "$(git config --get remote.origin.partialclonefilter)" == "blob:none" ]] || echo "::warning::Blobless Git filter missing; sparse checkout still limits the working tree"
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- Game-finality checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Game-finality checkout: sparse/blobless profile verified (partialclonefilter=$(git config --get remote.origin.partialclonefilter || echo none))" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Record main before sync
        id: base
        shell: bash
        run: echo "main_before_sync=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record checkout timing
        shell: bash
        run: |
          set -euo pipefail
          checkout_seconds=$(( $(date +%s) - CHECKOUT_START_EPOCH ))
          echo "- Checkout: ${checkout_seconds}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select scheduled or explicitly requested Injury history reconciliation
        id: injury_history_due
        shell: bash
        env:
          DATASET: ${{ inputs.dataset }}
          SEASON: ${{ inputs.season }}
          MANUAL_INJURY_HISTORY: ${{ inputs.reconcile_injury_history || 'false' }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          due=false
          # Pushes/called/scoped runs never activate the historical pipeline.
          # The recurring scheduler owns Mondays; a manual checkbox explicitly
          # opts into the SAME bounded Source -> Canonical -> Derived writers.
          scheduled_monday=false
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" && "$(TZ=Europe/Berlin date +%u)" == "1" ]]; then
            scheduled_monday=true
          fi
          manual_requested=false
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${MANUAL_INJURY_HISTORY:-false}" == "true" ]]; then
            manual_requested=true
          fi
          # An explicit manual request must fail, not silently skip the history
          # that the operator believes is being refreshed.
          if [[ "$manual_requested" == "true" ]] && {
            [[ "${MATERIALIZATION_SCOPE:-full}" != "full" ]] ||
            [[ -n "${DATASET:-}" ]] ||
            [[ -n "${SEASON:-}" ]] ||
            [[ "${FORCE:-false}" == "true" ]]
          }; then
            echo "::error::Historical Injury manual replay requires full scope, blank dataset/season and force=false." >&2
            exit 2
          fi
          if [[ "${MATERIALIZATION_SCOPE:-full}" == "full" && -z "${DATASET:-}" && -z "${SEASON:-}" ]] &&
             [[ "$scheduled_monday" == "true" || "$manual_requested" == "true" ]]; then
            due=true
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "- Historical Injury reconciliation due: $due (scheduledMonday=$scheduled_monday; manualRequested=$manual_requested)" >> "$GITHUB_STEP_SUMMARY"

      # Regression tests run in PR CI and the periodic full audit.
      # Keep real-data and canonical-state validation in the publisher.
      - name: Report production validation boundary
        shell: bash
        run: |
          echo "- Regression suites: PR Fast / periodic full audit; not run during data sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime safeguards: provider validation, canonical materialization, semantic no-op, and scoped write guards" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full scope: post-materialization identity audit before canonical publication" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync, validate and publish NFL source data
        shell: bash
        env:
          DATASET: ${{ inputs.dataset }}
          SEASON: ${{ inputs.season }}
          HISTORICAL_BACKFILL_LIMIT: ${{ inputs.historical_backfill_limit }}
          FORCE: ${{ inputs.force }}
          EXPECTED_INJURY_SHA256: ${{ inputs.expected_injury_sha256 || '' }}
          INJURY_HISTORY_DUE: ${{ steps.injury_history_due.outputs.due }}
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
          # Existing contents:write token for immutable original-PBP Source evidence.
          PBP_ARCHIVE_TOKEN: ${{ github.token }}
          # The built-in token also reads official nflverse release metadata.
          # The built-in token is only used to read official nflverse release metadata.
          NFLVERSE_RELEASE_API_TOKEN: ${{ inputs.materialization_scope == 'injuries' && github.token || '' }}
        run: |
          set -euo pipefail

          materialization_scope="${MATERIALIZATION_SCOPE:-full}"
          case "$materialization_scope" in
            full|game-finality|schedule-odds|injuries) ;;
            *)
              echo "Unsupported materialization scope: $materialization_scope" >&2
              exit 2
              ;;
          esac
          # Failure diagnostics are owned per scope (Issue #1263 G5 AP0b): a successful
          # scoped run may only clear its own scope's diagnostic, never the full-sync one.
          # The full scope keeps the legacy file name so existing state stays valid.
          failure_diagnostic_file="data-source/_sync/last-failure.json"
          if [[ "$materialization_scope" != "full" ]]; then
            failure_diagnostic_file="data-source/_sync/last-failure.${materialization_scope}.json"
          fi
          if [[ "$materialization_scope" == "game-finality" ]]; then
            if [[ "${DATASET:-}" != "nflverse.game-finality" ]]; then
              echo "game-finality scope requires dataset=nflverse.game-finality" >&2
              exit 2
            fi
            if [[ -n "${SEASON:-}" ]]; then
              echo "game-finality scope does not accept a season filter; schedules and released evidence are fixed datasets" >&2
              exit 2
            fi
          fi

          if [[ "$materialization_scope" == "schedule-odds" ]]; then
            if [[ "${DATASET:-}" != "nflverse.schedule-odds" ]]; then
              echo "schedule-odds scope requires dataset=nflverse.schedule-odds" >&2
              exit 2
            fi
            if [[ -n "${SEASON:-}" ]]; then
              echo "schedule-odds scope does not accept a season filter; odds upstream is fixed" >&2
              exit 2
            fi
          fi

          if [[ -n "${EXPECTED_INJURY_SHA256:-}" ]]; then
            if [[ "$materialization_scope" != "injuries" || ! "$EXPECTED_INJURY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Expected Injury digest is malformed or outside Injury scope." >&2
              exit 2
            fi
          fi
          if [[ "$materialization_scope" == "injuries" ]]; then
            if [[ "${DATASET:-}" != "nflverse.injuries" ]]; then
              echo "injuries scope requires dataset=nflverse.injuries" >&2
              exit 2
            fi
            if [[ "${FORCE:-false}" == "true" ]]; then
              echo "injuries scope rejects forced replacement of historical injury evidence" >&2
              exit 2
            fi
            if [[ -n "${SEASON:-}" && ! "${SEASON}" =~ ^[0-9]{4}$ ]]; then
              echo "injuries scope accepts only one explicitly selected four-digit season" >&2
              exit 2
            fi
          fi

          injury_year=""
          if [[ "$materialization_scope" == "injuries" ]]; then
            injury_year="${SEASON:-}"
            if [[ -z "$injury_year" ]]; then
              injury_year="$(PYTHONPATH=tools python3 -c 'from nfl_source_data_lib.common import current_source_season; from pathlib import Path; print(current_source_season(Path.cwd()))')"
            fi
            if [[ ! "$injury_year" =~ ^[0-9]{4}$ ]] || [[ "$injury_year" == "0000" ]]; then
              echo "Unsupported Injury season: $injury_year" >&2
              exit 2
            fi
          fi

          raw_sync_args=(sync --raw-only)
          if [[ -n "${DATASET:-}" ]]; then
            raw_sync_args+=(--dataset "$DATASET")
          fi
          if [[ "$materialization_scope" == "game-finality" ]]; then
            raw_sync_args+=(--dataset "nflverse.schedules")
          fi
          if [[ -n "${SEASON:-}" ]]; then
            IFS=',' read -ra season_values <<< "$SEASON"
            for season in "${season_values[@]}"; do
              season="${season//[[:space:]]/}"
              if [[ -n "$season" ]]; then
                raw_sync_args+=(--season "$season")
              fi
            done
          elif [[ "$materialization_scope" == "injuries" ]]; then
            raw_sync_args+=(--season "$injury_year")
          fi
          effective_backfill_limit="${HISTORICAL_BACKFILL_LIMIT:-12}"
          if [[ -z "${DATASET:-}" && -z "${SEASON:-}" ]]; then
            raw_sync_args+=(--historical-backfill-limit "$effective_backfill_limit")
          fi
          if [[ "${FORCE:-false}" == "true" ]]; then
            raw_sync_args+=(--force)
          fi

          materialize_args=(materialize)
          if [[ "$materialization_scope" == "game-finality" ]]; then
            materialize_args+=(--scope game-finality)
          elif [[ "$materialization_scope" == "schedule-odds" ]]; then
            materialize_args+=(--scope schedule-odds)
          elif [[ "$materialization_scope" == "injuries" ]]; then
            materialize_args+=(--scope injuries --season "$injury_year")
          fi

          {
            echo "- Dataset input: ${DATASET:-all}"
            echo "- Season input: ${SEASON:-current}"
            echo "- Materialization scope: $materialization_scope"
            if [[ "$materialization_scope" == "game-finality" ]]; then
              echo "- Scoped raw datasets: nflverse.schedules + nflverse.game-finality"
              echo "- Canonical write-set: data-source/nfl/schedules/** + data-source/nfl/game-finality/**"
              echo "- Full NFL audit: read/write disabled for scoped materialization"
            elif [[ "$materialization_scope" == "schedule-odds" ]]; then
              echo "- Scoped read dependencies: schedule raw + published canonical schedule"
              echo "- Canonical write-set: data-source/nfl/schedule-odds/** only"
              echo "- Full NFL audit: read/write disabled for scoped materialization"
            elif [[ "$materialization_scope" == "injuries" ]]; then
              echo "- Scoped raw: data-source/providers/nflverse/injuries/raw-<season>.csv and metadata-<season>.json"
              echo "- Scoped canonical: data-source/nfl/injuries/<season>/**"
              echo "- Derived: separate rebuild-and-retry in data-derived/nfl-injuries/<season>.json"
              echo "- Original nflverse release SHA verified before Raw publication"
              echo "- Full NFL audit: disabled; seasonal Injury canonical integrity check only"
            else
              echo "- Canonical write-set: full NFL source materialization"
            fi
            if [[ -z "${DATASET:-}" && -z "${SEASON:-}" ]]; then
              echo "- Historical backfill limit: $effective_backfill_limit"
            else
              echo "- Historical backfill: disabled for targeted dataset/season runs"
            fi
            echo "- Force raw sync: ${FORCE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${PAT_PUSH:-}" ]]; then
            echo "PAT_PUSH is required for repository-consistent write semantics." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          max_attempts=3

          reset_to_main() {
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- data-source
          }

          # Materialization reads only these inputs. Pushes by other writers to any
          # other path (league source incl. data-source/providers/sleeper/leagues,
          # fantasy operations, matchups) cannot change the canonical result, so the validated commit may be rebased instead of rebuilt.
          materialize_input_pathspecs=(
            data-source/registry.json
            data-source/providers/dynastyprocess
            data-source/providers/nflverse
            data-source/providers/sleeper/players
            data-source/nfl
            data-source/audits
            data-source/historical-identity-backfill.json
            'data-source/leagues/*/manifest.json'
            public/data/past_seasons
            tools
            .github/workflows/sync-nfl-source-data.yml
          )

          # Odds-only materialization does not read player/roster/identity data.
          # Keep producer tools as a conservative race input.
          if [[ "$materialization_scope" == "schedule-odds" ]]; then
            materialize_input_pathspecs=(
              data-source/registry.json
              data-source/providers/nflverse/schedules
              data-source/providers/nflverse/schedule-odds
              data-source/nfl/schedules
              data-source/nfl/schedule-odds
              tools
              .github/workflows/sync-nfl-source-data.yml
            )
          fi

          if [[ "$materialization_scope" == "injuries" ]]; then
            materialize_input_pathspecs=(
              data-source/registry.json
              data-source/providers/nflverse/injuries
              data-source/nfl/injuries
              data-source/nfl/identities/players.json
              data-source/nfl/schedules
              'data-source/leagues/*/manifest.json'
              tools
              .github/workflows/sync-nfl-source-data.yml
              .github/workflows/sync-nfl-injuries.yml
            )
          fi

          # Returns 0 after a successful push. Returns 1 when a materialization input
          # changed on main (caller must rebuild). Fails closed on rebase conflicts.
          publish_canonical_commit() {
            local base_sha rebase_attempt
            base_sha="$(git rev-parse HEAD~1)"
            for rebase_attempt in 1 2 3 4 5; do
              if git push "$push_url" HEAD:main; then
                return 0
              fi
              # schedule-odds normally uses a shallow checkout. Restore complete
              # ancestry only after a rejected push so input comparison and
              # rebase retain the original race-safe semantics.
              if [[ "$materialization_scope" == "schedule-odds" ]] && [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
                if ! git fetch --unshallow origin main; then
                  echo "Cannot restore complete schedule-odds ancestry; failing closed." >&2
                  exit 1
                fi
                if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
                  echo "Schedule-odds history remains shallow after fetch; failing closed." >&2
                  exit 1
                fi
              else
                git fetch origin main
              fi
              if ! git diff --quiet "$base_sha" origin/main -- "${materialize_input_pathspecs[@]}"; then
                echo "Materialization inputs changed on main; rebuild required."
                return 1
              fi
              echo "main advanced outside materialization inputs; rebasing validated commit (rebase attempt $rebase_attempt)."
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Rebase of validated canonical commit failed; failing closed." >&2
                exit 1
              fi
              base_sha="$(git rev-parse HEAD~1)"
            done
            echo "main kept advancing outside materialization inputs; rebuild required."
            return 1
          }

          assert_source_data_only() {
            mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
            unexpected=()
            for path in "${changed[@]}"; do
              if [[ "$path" != data-source/* ]]; then
                unexpected+=("$path")
              fi
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unexpected changes outside data-source/:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_scoped_raw_write_set() {
            if [[ "$materialization_scope" != "injuries" ]]; then
              return 0
            fi
            mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
            unexpected=()
            for path in "${changed[@]}"; do
              if [[ "$path" == "data-source/providers/nflverse/injuries/raw-${injury_year}.csv" ||
                    "$path" == "data-source/providers/nflverse/injuries/metadata-${injury_year}.json" ||
                    "$path" == "$failure_diagnostic_file" ]]; then
                continue
              fi
              unexpected+=("$path")
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped injury Raw sync touched unexpected paths:\\n' >&2
              printf ' - %s\\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_scoped_canonical_write_set() {
            if [[ "$materialization_scope" == "full" ]]; then
              return 0
            fi
            mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
            unexpected=()
            for path in "${changed[@]}"; do
              if [[ "$materialization_scope" == "game-finality" ]]; then
                if [[ "$path" == data-source/nfl/schedules/* || "$path" == data-source/nfl/game-finality/* ]]; then
                  continue
                fi
              elif [[ "$materialization_scope" == "schedule-odds" ]]; then
                if [[ "$path" == data-source/nfl/schedule-odds/* ]]; then
                  continue
                fi
              elif [[ "$materialization_scope" == "injuries" ]]; then
                if [[ "$path" == data-source/nfl/injuries/"$injury_year"/* ]]; then
                  continue
                fi
              fi
              if [[ "$path" == "$failure_diagnostic_file" ]]; then
                continue
              fi
              unexpected+=("$path")
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped %s materialization touched unexpected paths:\n' "$materialization_scope" >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          write_failure_diagnostic() {
            local phase="$1"
            local exit_code="$2"
            local log_file="$3"

            for diagnostic_attempt in $(seq 1 "$max_attempts"); do
              reset_to_main
              mkdir -p data-source/_sync

              PHASE="$phase" EXIT_CODE="$exit_code" LOG_FILE="$log_file" \
                FAILURE_DIAGNOSTIC_FILE="$failure_diagnostic_file" \
                python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ["LOG_FILE"])
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "status": "failed",
              "phase": os.environ["PHASE"],
              "exitCode": int(os.environ["EXIT_CODE"]),
              "recordedAtUtc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "workflow": "Data • NFL Source Sync",
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
