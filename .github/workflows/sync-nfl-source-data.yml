name: Data • NFL Source Sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-nfl-source-data.yml"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
    secrets:
      PAT_PUSH:
        required: true

permissions:
  contents: write

concurrency:
  group: nfl-source-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test NFL source-data tooling
        run: python -m unittest discover -s tools/tests -p "test_nfl_source_data.py" -v

      - name: Sync, validate and publish NFL source data
        shell: bash
        env:
          DATASET: ${{ inputs.dataset }}
          FORCE: ${{ inputs.force }}
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail

          sync_args=(sync)
          if [[ -n "$DATASET" ]]; then
            sync_args+=(--dataset "$DATASET")
          fi
          if [[ "$FORCE" == "true" ]]; then
            sync_args+=(--force)
          fi

          if [[ -z "$PAT_PUSH" ]]; then
            echo "PAT_PUSH is required for repository-consistent write semantics." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          write_failure_diagnostic() {
            local phase="$1"
            local exit_code="$2"
            local log_file="$3"

            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- source-data
            mkdir -p source-data/_sync

            PHASE="$phase" EXIT_CODE="$exit_code" LOG_FILE="$log_file" \
              python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ["LOG_FILE"])
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "status": "failed",
              "phase": os.environ["PHASE"],
              "exitCode": int(os.environ["EXIT_CODE"]),
              "recordedAtUtc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "workflow": "Data • NFL Source Sync",
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "datasetInput": os.environ.get("DATASET") or None,
              "forceInput": (os.environ.get("FORCE") or "false").lower() == "true",
              "errorTail": lines[-80:],
          }
          Path("source-data/_sync/last-failure.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

            git add -- source-data/_sync/last-failure.json
            git commit -m "data(nfl-source): record failed source sync"
            git push "https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          }

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Publish attempt $attempt/$max_attempts"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -- source-data

            log_file="$(mktemp)"
            set +e
            python tools/nfl_source_data.py "${sync_args[@]}" 2>&1 | tee "$log_file"
            sync_status=${PIPESTATUS[0]}
            set -e
            if (( sync_status != 0 )); then
              echo "NFL source sync failed; publishing a sanitized failure diagnostic." >&2
              write_failure_diagnostic "sync" "$sync_status" "$log_file"
              exit "$sync_status"
            fi

            set +e
            python tools/nfl_source_data.py audit 2>&1 | tee -a "$log_file"
            audit_status=${PIPESTATUS[0]}
            set -e
            if (( audit_status != 0 )); then
              echo "NFL source audit failed; publishing a sanitized failure diagnostic." >&2
              write_failure_diagnostic "audit" "$audit_status" "$log_file"
              exit "$audit_status"
            fi

            rm -f source-data/_sync/last-failure.json

            mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
            if (( ${#changed[@]} == 0 )); then
              echo "No NFL source-data changes detected."
              exit 0
            fi

            unexpected=()
            for path in "${changed[@]}"; do
              if [[ "$path" != source-data/* ]]; then
                unexpected+=("$path")
              fi
            done

            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unexpected changes outside source-data/:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              exit 1
            fi

            printf 'Validated source-data changes:\n'
            printf ' - %s\n' "${changed[@]}"

            git add -A -- source-data
            if git diff --cached --quiet; then
              echo "No source-data changes to commit."
              exit 0
            fi

            timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "data(nfl-source): refresh persistent NFL sources • $timestamp"

            if git push "https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "NFL source-data publish succeeded."
              exit 0
            fi

            if (( attempt == max_attempts )); then
              echo "main advanced during all $max_attempts publish attempts; failing closed." >&2
              exit 1
            fi

            echo "main advanced during publish; rebuilding against the latest main before retrying."
          done
