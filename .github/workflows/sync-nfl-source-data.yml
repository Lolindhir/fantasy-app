              echo "- No-op reason: no staged semantic data-source changes" >> "$GITHUB_STEP_SUMMARY"
              echo "- Publication (attempt $attempt): ${publication_seconds}s" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "data(nfl-source): materialize canonical NFL sources • $timestamp"
            publish_start="$(date +%s)"
            if publish_canonical_commit; then
              publication_seconds=$(( publication_seconds + $(date +%s) - publish_start ))
              echo "NFL data-source publish succeeded."
              echo "- Publication (attempt $attempt): ${publication_seconds}s" >> "$GITHUB_STEP_SUMMARY"
              echo "- No-op reason: n/a — validated canonical changes published" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            publication_seconds=$(( publication_seconds + $(date +%s) - publish_start ))

            if (( attempt == max_attempts )); then
              echo "main advanced during all canonical publish attempts; failing closed." >&2
              exit 1
            fi
            echo "main advanced during canonical publish; rebuilding from latest main."
            echo "- Publication (attempt $attempt): ${publication_seconds}s; canonical push raced with main, rebuilding" >> "$GITHUB_STEP_SUMMARY"
          done


      # Issue #1077: reproducible empirical report on a change to this read-only
      # researcher, using the accepted Release asset. Not a new scheduler or
      # publisher; no data-source, derived, app or research files are written.
      # Never run on routine scheduled Source refreshes or unrelated code pushes.
      - name: Read-only original PBP 2025 quality evidence (researcher changes only)
        if: github.event_name == 'push'
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'tools/nfl_pbp_2025_quality_report.py'; then
            echo "- PBP 2025 research replay: skipped (researcher unchanged)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
          fi
          python3 tools/nfl_pbp_2025_quality_report.py
          echo "- PBP 2025 research replay: completed; detailed JSON receipt in this step log (research-only, not publication-certified)" >> "$GITHUB_STEP_SUMMARY"

  nfl_games_derived:
    name: Publish global NFL Game Shared Derived
    needs: sync
    # After full daily Source or scoped nflverse.schedule-odds refresh only.
    # NFL Live game-finality and all other targeted datasets remain excluded.
    if: ${{ needs.sync.result == 'success' && inputs.materialization_scope != 'game-finality' && inputs.materialization_scope != 'injuries' && (!inputs.dataset || inputs.dataset == 'nflverse.schedule-odds') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical NFL Game Source-to-Derived restore
        run: python3 -m unittest tools.tests.test_nfl_games_real_source_restore -v

      - name: Rebuild and publish only NFL Game Derived seasons
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-games
          --path data-derived/nfl-games
          --
          python3 tools/nfl_games_materialize.py --all-seasons --write

      - name: Rebuild and publish current-season NFL GameDetails
        # Same classified publisher and product root as the existing NFL Games index.
        # Validated source-backed GameIDs only; per-GameID semantic no-op.
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-games
          --path data-derived/nfl-games/details
          --
          python3 tools/nfl_game_details_materialize.py --current-season --write

      - name: Reconcile and publish historical NFL GameDetails weekly
        # The centrally scheduled *full* NFL Source sync runs daily at 04:00
        # Europe/Berlin. Only Monday's full sync rederives accepted history.
        # On a full Source run, additionally perform one needed SchemaVersion=2
        # upgrade outside Monday; stable history returns to Monday-only audits.
        # Scoped odds refresh never enters this historical step. Existing
        # rebuild-and-retry handles branch races.
        if: ${{ !inputs.dataset && (inputs.materialization_scope == 'full' || !inputs.materialization_scope) }}
        shell: bash
        run: |
          set -euo pipefail
          reason="weekly-Monday"
          if [[ "$(TZ=Europe/Berlin date +%u)" != "1" ]]; then
            status="$(python3 tools/nfl_game_details_materialize.py --historical-v2-upgrade-needed)"
            if [[ "$status" == "schema-current" ]]; then
              echo "Historical NFL GameDetail reconciliation: schema current; weekly audit remains Monday" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" != "upgrade-needed" ]]; then
              echo "::error::Unrecognized GameDetail historical schema check: $status"
              exit 1
            fi
            reason="one-time-schema-v2-upgrade"
          fi
          python3 tools/rebuild_and_publish.py \
            --scope nfl-games \
            --path data-derived/nfl-games/details \
            -- \
            python3 tools/nfl_game_details_materialize.py --historical-seasons --write
          echo "Historical NFL GameDetail reconciliation: completed ($reason), all accepted indexed seasons before current" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize isolated Derived publication
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## Global NFL Game Shared Derived" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: successful full NFL Source sync or scoped schedule-odds refresh (not game-finality live)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated write-set: data-derived/nfl-games/** only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publisher: rebuild-and-retry from latest main, no-op on unchanged content" >> "$GITHUB_STEP_SUMMARY"

  nfl_injuries_derived:
    name: Publish isolated NFL Injury Shared Derived
    needs: sync
    # Reuse the same Derived writer for an Injury Source update or a successful
    # Monday full-Source historical Canonical reconciliation, never a new writer.
    if: ${{ needs.sync.result == 'success' && (inputs.materialization_scope == 'injuries' || needs.sync.outputs.injury_history_due == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and publish isolated Injury Derived product
        if: ${{ inputs.materialization_scope == 'injuries' }}
        shell: bash
        env:
          INJURY_SEASON_INPUT: ${{ inputs.season }}
        run: |
          set -euo pipefail
          season="${INJURY_SEASON_INPUT:-}"
          if [[ -z "$season" ]]; then
            season="$(PYTHONPATH=tools python3 -c 'from nfl_source_data_lib.common import current_source_season; from pathlib import Path; print(current_source_season(Path.cwd()))')"
          fi
          if [[ ! "$season" =~ ^[0-9]{4}$ ]]; then
            echo "Injury Derived requires exactly one season" >&2
            exit 2
          fi
          python3 tools/rebuild_and_publish.py \
            --scope nfl-injuries \
            --path data-derived/nfl-injuries \
            -- \
            python3 tools/nfl_injuries_phase.py --phase derived --season "$season" --write

      - name: Rebuild and publish all accepted historical Injury Derived
        if: ${{ needs.sync.outputs.injury_history_due == 'true' }}
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-injuries
          --path data-derived/nfl-injuries
          --
          python3 tools/nfl_injuries_history_reconcile.py --phase derived --write

      - name: Audit frozen original Injury release revisions without repair
        if: ${{ needs.sync.outputs.injury_history_due == 'true' }}
        env:
          NFLVERSE_RELEASE_API_TOKEN: ${{ github.token }}
        run: python3 tools/nfl_injuries_history_reconcile.py --phase revisions --fail-on-review

      - name: Summarize Injury Derived publication
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## NFL Injury Shared Derived" >> "$GITHUB_STEP_SUMMARY"
