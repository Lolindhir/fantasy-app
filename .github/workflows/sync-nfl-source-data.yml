            if [[ -n "$raw_line" ]]; then
              echo "- Raw result: $raw_line" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ "$materialization_scope" == "game-finality" ]]; then
              schedule_raw_line="$(grep -m1 '^nflverse.schedules' "$raw_log" || true)"
              if [[ -n "$schedule_raw_line" ]]; then
                echo "- Raw companion result: $schedule_raw_line" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
