            # A failure publishes no canonical data; raw evidence is already on main.
            if [[ "$materialization_scope" == "full" ]]; then
              post_audit_log="$(mktemp)"
              post_audit_start="$(date +%s)"
              set +e
              python -m unittest tools.tests.test_nfl_source_app_espn_identity_bridge_repository -v 2>&1 | tee "$post_audit_log"
              post_audit_status=${PIPESTATUS[0]}
              set -e
