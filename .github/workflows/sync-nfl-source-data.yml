                fi
                set +e
                python3 tools/nfl_injuries_history_reconcile.py "${intake_args[@]}" 2>&1 | tee "$intake_log"
                intake_status=${PIPESTATUS[0]}
                set -e
                if (( intake_status != 0 )); then
                  echo "Historical NFL Injury source admission blocked; no new Raw commit." >&2
                  write_failure_diagnostic "historical-injury-source-intake" "$intake_status" "$intake_log"
                  exit "$intake_status"
                fi
                if [[ -z "$historical_intake_selected_season" ]]; then
                  historical_intake_selected_season="$(python3 - "$intake_log" <<'PY'
          import json
          import sys
          from pathlib import Path

          season = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["Season"]
