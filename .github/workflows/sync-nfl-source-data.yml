            if [[ "$materialization_scope" == "injuries" && -n "${EXPECTED_INJURY_SHA256:-}" ]]; then
              actual_injury_sha="$(sha256sum "data-source/providers/nflverse/injuries/raw-${injury_year}.csv" | cut -d' ' -f1)"
              if [[ "$actual_injury_sha" != "$EXPECTED_INJURY_SHA256" ]]; then
                echo "Injury source changed since historical preflight; no Raw commit." >&2
                exit 2
              fi
            fi

            # Issue #1077: accepted original PBP for the current Source season.
            # Immutable upstream-byte versions live in SHA-addressed GitHub
            # Releases; only a small per-season manifest joins this existing
            # Source Raw git transaction. A digest revision is a normal current
            # season update, never an overwrite of earlier original evidence.
            # Historical 2025 acceptance remains frozen and independently guarded.
            # Scoped and targeted Source runs never acquire original PBP.
            if [[ "$materialization_scope" == "full" && -z "${DATASET:-}" && -z "${SEASON:-}" ]]; then
              if ! python3 -c 'import yaml' 2>/dev/null; then
                python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2' || echo "::warning::Original PBP audit dependency unavailable; archive intake will fail soft."
              fi
              for pbp_script in tools/nfl_pbp_source_archive.py tools/nfl_pbp_source_auto.py; do
