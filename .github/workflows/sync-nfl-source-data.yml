name: Data • NFL Source Sync

on:
  # Temporary branch-only bootstrap trigger. Remove after the real-source
  # materialization succeeds and the branch has been validated.
  push:
    branches:
      - agent/document-player-identity-architecture
    paths:
      - ".github/workflows/sync-nfl-source-data.yml"
      - "tools/nfl_source_data.py"
      - "tools/nfl_source_data_lib/**"
      - "tools/tests/test_nfl_source*.py"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dataset:
        description: "Optional registry dataset ID; leave blank to sync all datasets"
        required: false
        type: string
        default: ""
      force:
        description: "Force replacement even when the downloaded content hash is unchanged"
        required: false
        type: boolean
        default: false
    secrets:
      PAT_PUSH:
        required: true

permissions:
  contents: write

concurrency:
  group: nfl-source-data-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test NFL source-data tooling
        run: python -m unittest discover -s tools/tests -p "test_nfl_source*.py" -v

      - name: Sync, validate and publish NFL source data
        shell: bash
        env:
          DATASET: ${{ inputs.dataset }}
          FORCE: ${{ inputs.force }}
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail

          raw_sync_args=(sync --raw-only)
          if [[ -n "${DATASET:-}" ]]; then
            raw_sync_args+=(--dataset "$DATASET")
          fi
          if [[ "${FORCE:-false}" == "true" ]]; then
            raw_sync_args+=(--force)
          fi

          if [[ -z "${PAT_PUSH:-}" ]]; then
            echo "PAT_PUSH is required for repository-consistent write semantics." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          max_attempts=3

          reset_to_target() {
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"
            git clean -fd -- source-data
          }

          assert_source_data_only() {
            mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
            unexpected=()
            for path in "${changed[@]}"; do
              if [[ "$path" != source-data/* ]]; then
                unexpected+=("$path")
              fi
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unexpected changes outside source-data/:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          write_failure_diagnostic() {
            local phase="$1"
            local exit_code="$2"
            local log_file="$3"

            for diagnostic_attempt in $(seq 1 "$max_attempts"); do
              reset_to_target
              mkdir -p source-data/_sync

              PHASE="$phase" EXIT_CODE="$exit_code" LOG_FILE="$log_file" \
                python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ["LOG_FILE"])
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "status": "failed",
              "phase": os.environ["PHASE"],
              "exitCode": int(os.environ["EXIT_CODE"]),
              "recordedAtUtc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "workflow": "Data • NFL Source Sync",
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "datasetInput": os.environ.get("DATASET") or None,
              "forceInput": (os.environ.get("FORCE") or "false").lower() == "true",
              "errorTail": lines[-80:],
          }
          Path("source-data/_sync/last-failure.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

              assert_source_data_only
              git add -- source-data/_sync/last-failure.json
              if git diff --cached --quiet; then
                echo "Failure diagnostic already matches target branch."
                return 0
              fi
              git commit -m "data(nfl-source): record failed source sync"
              if git push "$push_url" "HEAD:$TARGET_BRANCH"; then
                return 0
              fi
              echo "Target branch advanced while publishing failure diagnostic; retrying."
            done
            echo "Could not publish failure diagnostic after $max_attempts attempts." >&2
            return 1
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "NFL source publish attempt $attempt/$max_attempts on $TARGET_BRANCH"
            reset_to_target

            raw_log="$(mktemp)"
            set +e
            python tools/nfl_source_data.py "${raw_sync_args[@]}" 2>&1 | tee "$raw_log"
            raw_status=${PIPESTATUS[0]}
            set -e
            if (( raw_status != 0 )); then
              echo "NFL provider raw sync failed." >&2
              write_failure_diagnostic "raw-sync" "$raw_status" "$raw_log"
              exit "$raw_status"
            fi

            assert_source_data_only
            git add -- source-data/providers
            if ! git diff --cached --quiet; then
              timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
              git commit -m "data(nfl-source): refresh provider raw sources • $timestamp"
              if ! git push "$push_url" "HEAD:$TARGET_BRANCH"; then
                if (( attempt == max_attempts )); then
                  echo "Target branch advanced during all raw publish attempts; failing closed." >&2
                  exit 1
                fi
                echo "Target branch advanced during raw publish; retrying from latest target."
                continue
              fi
            fi

            # Rebase canonical materialization on the persisted raw state. If
            # normalization fails, the validated raw evidence remains published.
            reset_to_target
            materialize_log="$(mktemp)"
            set +e
            python tools/nfl_source_data.py materialize 2>&1 | tee "$materialize_log"
            materialize_status=${PIPESTATUS[0]}
            set -e
            if (( materialize_status != 0 )); then
              echo "NFL canonical materialization failed; raw source state remains preserved." >&2
              write_failure_diagnostic "materialize" "$materialize_status" "$materialize_log"
              exit "$materialize_status"
            fi

            python tools/nfl_source_data.py audit | tee -a "$materialize_log"
            rm -f source-data/_sync/last-failure.json
            assert_source_data_only

            mapfile -t changed < <(git status --porcelain=v1 | sed -E 's/^.. //')
            if (( ${#changed[@]} == 0 )); then
              echo "No canonical NFL source-data changes detected."
              exit 0
            fi

            printf 'Validated canonical source-data changes:\n'
            printf ' - %s\n' "${changed[@]}"

            git add -A -- source-data
            if git diff --cached --quiet; then
              echo "No canonical source-data changes to commit."
              exit 0
            fi

            timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "data(nfl-source): materialize canonical NFL sources • $timestamp"
            if git push "$push_url" "HEAD:$TARGET_BRANCH"; then
              echo "NFL source-data publish succeeded."
              exit 0
            fi

            if (( attempt == max_attempts )); then
              echo "Target branch advanced during all canonical publish attempts; failing closed." >&2
              exit 1
            fi
            echo "Target branch advanced during canonical publish; rebuilding against latest target."
          done
