            # full Source writer. No provider Raw download or frozen original repair.
            if [[ "${INJURY_HISTORY_DUE:-false}" == "true" ]]; then
              history_log="$(mktemp)"
              set +e
              python3 tools/nfl_injuries_history_reconcile.py --phase canonical --write 2>&1 | tee "$history_log"
              history_status=${PIPESTATUS[0]}
              set -e
              if (( history_status != 0 )); then
                echo "Historical NFL Injury canonical reconciliation failed; no Canonical commit." >&2
