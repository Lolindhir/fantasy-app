name: Data • NFL Game Finality

on:
  repository_dispatch:
    types:
      - scheduler-sync-nfl-game-finality
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-finality:
    uses: ./.github/workflows/sync-nfl-source-data.yml
    with:
      dataset: nflverse.game-finality
      historical_backfill_limit: 0
    secrets: inherit
