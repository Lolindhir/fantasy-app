name: FM • Signal • Sleeper Trending

on:
  schedule:
    - cron: "20 4 * * *"  # 06:20 Europe/Berlin während CEST
    - cron: "20 5 * * *"  # 06:20 Europe/Berlin während CET
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-sleeper-trending
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve Berlin schedule window
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: schedule gate passed."
            exit 0
          fi

          berlin_offset="$(TZ=Europe/Berlin date +%z)"
          if [[ "$berlin_offset" == "+0200" ]]; then
            expected_schedule="20 4 * * *"
          elif [[ "$berlin_offset" == "+0100" ]]; then
            expected_schedule="20 5 * * *"
          else
            echo "Unsupported Europe/Berlin UTC offset: $berlin_offset" >&2
            exit 1
          fi

          if [[ "$SCHEDULE_EXPRESSION" == "$expected_schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run selected for 06:20 Europe/Berlin."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Companion DST cron skipped for current Berlin offset $berlin_offset."
          fi

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Sleeper trending fetcher
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_sleeper_trending.py
          -v

      - name: Update Sleeper trending signal
        if: steps.schedule_gate.outputs.run == 'true'
        run: python fantasy-management/_ai/scripts/fetch_sleeper_trending.py

      - name: Record successful Sleeper refresh
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id sleeper-trending
          --workflow "FM • Signal • Sleeper Trending"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-signals/roster-activity/sleeper

      - name: Commit and push updates
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A -- \
            fantasy-management/sources/external-signals/roster-activity/sleeper/ \
            fantasy-management/sources/refresh-status/sleeper-trending.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope sleeper-trending
          python tools/publish_generated_commit.py --remote origin --branch main
