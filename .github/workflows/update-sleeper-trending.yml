name: FM • Signal • Sleeper Trending
run-name: "FM • Signal • Sleeper Trending • ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  schedule:
    - cron: "20 6 * * *"  # Pre-Operations-Refresh vor dem 07:00-Europe/Berlin-Lauf
      timezone: "Europe/Berlin"
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_sleeper_trending.py
      - fantasy-management/_ai/scripts/tests/test_fetch_sleeper_trending.py
      - .github/workflows/update-sleeper-trending.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_sleeper_trending.py
      - fantasy-management/_ai/scripts/tests/test_fetch_sleeper_trending.py
      - .github/workflows/update-sleeper-trending.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-sleeper-trending-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Sleeper trending fetcher
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_sleeper_trending.py
          -v

      - name: Update Sleeper trending signal
        run: python fantasy-management/_ai/scripts/fetch_sleeper_trending.py

      - name: Record successful Sleeper refresh
        if: github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id sleeper-trending
          --workflow "FM • Signal • Sleeper Trending"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-signals/roster-activity/sleeper

      - name: Commit and push updates
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A -- \
            fantasy-management/sources/external-signals/roster-activity/sleeper/ \
            fantasy-management/sources/refresh-status/sleeper-trending.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope sleeper-trending
          python tools/publish_generated_commit.py --remote origin --branch main
