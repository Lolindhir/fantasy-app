name: Data • League Source Sync

on:
  pull_request:
    paths:
      - ".github/workflows/sync-league-source-data.yml"
      - ".github/workflows/league-live.yml"
      - "data-source/league-registry.json"
      - "data-meta/**"
      - "tools/league_source_data.py"
      - "tools/league_source_data_lib/**"
      - "tools/git_transient.py"
      - "tools/tests/test_league_source*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-league-source-data.yml"
      - "data-source/league-registry.json"
      - "data-meta/**"
      - "data-source/nfl/schedules/**"
      - "tools/league_source_data.py"
      - "tools/league_source_data_lib/**"
      - "tools/git_transient.py"
      - "tools/tests/test_league_source*.py"
  repository_dispatch:
    types:
      - scheduler-sync-league-source-data
  workflow_dispatch:
    inputs:
      materialization_scope:
        description: "League source materialization scope"
        required: false
        type: choice
        options:
          - full
          - transactions
          - drafts
          - league-core
          - matchups
          - current
        default: full
      force:
        description: "Explicitly refetch/repair historical Sleeper partitions"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      materialization_scope:
        description: "League source materialization scope"
        required: false
        type: string
        default: full
      force:
        description: "Explicitly refetch/repair historical Sleeper partitions"
        required: false
        type: boolean
        default: false
    outputs:
      main_before_sync:
        description: "origin/main commit at the start of the sync job (League Live change detection base)"
        value: ${{ jobs.sync.outputs.main_before_sync }}
    secrets:
      PAT_PUSH:
        required: true

permissions:
  contents: write

concurrency:
  group: league-source-data-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MATERIALIZATION_SCOPE: ${{ inputs.materialization_scope || 'full' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test League data-source tooling
        shell: bash
        run: |
          set -euo pipefail
          case "${MATERIALIZATION_SCOPE:-full}" in
            full)
              python -m unittest discover -s tools/tests -p "test_league_source*.py" -v
              ;;
            transactions)
              python -m unittest \
                tools.tests.test_league_source_transaction_targeting \
                tools.tests.test_league_source_transaction_window \
                -v
              ;;
            drafts)
              python -m unittest tools.tests.test_league_source_draft_targeting -v
              ;;
            league-core)
              python -m unittest tools.tests.test_league_source_league_core_targeting -v
              ;;
            matchups)
              python -m unittest tools.tests.test_league_source_matchup_targeting -v
              ;;
            current)
              python -m unittest \
                tools.tests.test_league_source_league_core_targeting \
                tools.tests.test_league_source_transaction_targeting \
                tools.tests.test_league_source_transaction_window \
                tools.tests.test_league_source_draft_targeting \
                -v
              ;;
            *)
              echo "Unsupported League materialization scope: ${MATERIALIZATION_SCOPE}" >&2
              exit 2
              ;;
          esac

      - name: Validate League data-source registry and bootstrap
        run: python tools/league_source_data.py validate

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MATERIALIZATION_SCOPE: ${{ inputs.materialization_scope || 'full' }}
    outputs:
      main_before_sync: ${{ steps.base.outputs.main_before_sync }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}

      - name: Record main before sync
        id: base
        run: echo "main_before_sync=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync, materialize and publish League source data
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail

          materialization_scope="${MATERIALIZATION_SCOPE:-full}"
          case "$materialization_scope" in
            full|transactions|drafts|league-core|matchups|current) ;;
            *)
              echo "Unsupported League materialization scope: $materialization_scope" >&2
              exit 2
              ;;
          esac

          if [[ -z "${PAT_PUSH:-}" ]]; then
            echo "PAT_PUSH is required for repository-consistent write semantics." >&2
            exit 1
          fi

          sync_args=(sync)
          materialize_args=(materialize)
          if [[ "$materialization_scope" == "transactions" ]]; then
            sync_args+=(--dataset sleeper.transactions --current-transaction-window)
            materialize_args+=(--materialization-scope transactions --current-transaction-window)
          elif [[ "$materialization_scope" == "drafts" ]]; then
            sync_args+=(--current-draft-scope)
            materialize_args+=(--materialization-scope drafts --current-draft-scope)
          elif [[ "$materialization_scope" == "league-core" ]]; then
            sync_args+=(--current-league-core-scope)
            materialize_args+=(--materialization-scope league-core --current-league-core-scope)
          elif [[ "$materialization_scope" == "matchups" ]]; then
            sync_args+=(--current-matchup-scope)
            materialize_args+=(--materialization-scope matchups --current-matchup-scope)
          elif [[ "$materialization_scope" == "current" ]]; then
            sync_args+=(--current-scope)
            materialize_args+=(--materialization-scope current --current-scope)
          fi
          if [[ "${FORCE:-false}" == "true" ]]; then
            sync_args+=(--force)
          fi

          {
            echo "## League Source Sync"
            echo "- Materialization scope: $materialization_scope"
            if [[ "$materialization_scope" == "transactions" ]]; then
              echo "- Raw scope: current Sleeper league evidence + current/previous transaction week"
              echo "- Canonical write-set: addressed current-season transaction partitions only"
            elif [[ "$materialization_scope" == "drafts" ]]; then
              echo "- Raw scope: current Sleeper draft index + discovered draft detail/picks/traded-picks"
              echo "- Canonical write-set: current-season drafts.json only"
            elif [[ "$materialization_scope" == "league-core" ]]; then
              echo "- Raw scope: current Sleeper league + members + rosters + winners/losers brackets + exactly the active matchup week"
              echo "- Canonical write-set: current-season league.json + members.json + rosters.json + winners/losers-bracket.json + matchups/week-<CurrentWeek>.json only"
            elif [[ "$materialization_scope" == "matchups" ]]; then
              echo "- Raw scope: current Sleeper league evidence + exactly the active matchup week"
              echo "- Canonical write-set: current-season matchups/week-<CurrentWeek>.json only"
            elif [[ "$materialization_scope" == "current" ]]; then
              echo "- Raw scope: League Core + current/previous transaction week + current draft scope (one pass)"
              echo "- Canonical write-set: union of the League Core, transactions and drafts write-sets"
            else
              echo "- Raw scope: full registered League Source acquisition"
              echo "- Canonical write-set: full League Source materialization"
            fi
            echo "- Force raw sync: ${FORCE:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_url="https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git"
          max_attempts=3

          reset_to_main() {
            python3 tools/git_transient.py fetch origin main
            git reset --hard origin/main
            git clean -fd -- \
              data-source/providers/sleeper/leagues \
              data-source/leagues \
              data-source/_sync
          }

          changed_paths() {
            git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //'
          }

          assert_league_source_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*|data-source/leagues/*|data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Unexpected changes outside League Source paths:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_transaction_raw_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*/league.json|\
                data-source/providers/sleeper/leagues/*/league.metadata.json|\
                data-source/providers/sleeper/leagues/*/transactions/week-*.json|\
                data-source/providers/sleeper/leagues/*/transactions/week-*.metadata.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped transaction acquisition touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_transaction_canonical_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/leagues/*/seasons/*/transactions/week-*.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped transaction materialization touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_matchup_raw_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*/league.json|\
                data-source/providers/sleeper/leagues/*/league.metadata.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.metadata.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped matchup acquisition touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_matchup_canonical_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/leagues/*/seasons/*/matchups/week-*.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped matchup materialization touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_draft_raw_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*/drafts/index.json|\
                data-source/providers/sleeper/leagues/*/drafts/index.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/draft.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/draft.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/picks.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/picks.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/traded-picks.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/traded-picks.metadata.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped draft acquisition touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_draft_canonical_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/leagues/*/seasons/*/drafts.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped draft materialization touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_league_core_raw_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*/league.json|\
                data-source/providers/sleeper/leagues/*/league.metadata.json|\
                data-source/providers/sleeper/leagues/*/members.json|\
                data-source/providers/sleeper/leagues/*/members.metadata.json|\
                data-source/providers/sleeper/leagues/*/rosters.json|\
                data-source/providers/sleeper/leagues/*/rosters.metadata.json|\
                data-source/providers/sleeper/leagues/*/winners-bracket.json|\
                data-source/providers/sleeper/leagues/*/winners-bracket.metadata.json|\
                data-source/providers/sleeper/leagues/*/losers-bracket.json|\
                data-source/providers/sleeper/leagues/*/losers-bracket.metadata.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.metadata.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped League Core acquisition touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_league_core_canonical_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/leagues/*/seasons/*/league.json|\
                data-source/leagues/*/seasons/*/members.json|\
                data-source/leagues/*/seasons/*/rosters.json|\
                data-source/leagues/*/seasons/*/winners-bracket.json|\
                data-source/leagues/*/seasons/*/losers-bracket.json|\
                data-source/leagues/*/seasons/*/matchups/week-*.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped League Core materialization touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_current_raw_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/providers/sleeper/leagues/*/league.json|\
                data-source/providers/sleeper/leagues/*/league.metadata.json|\
                data-source/providers/sleeper/leagues/*/members.json|\
                data-source/providers/sleeper/leagues/*/members.metadata.json|\
                data-source/providers/sleeper/leagues/*/rosters.json|\
                data-source/providers/sleeper/leagues/*/rosters.metadata.json|\
                data-source/providers/sleeper/leagues/*/winners-bracket.json|\
                data-source/providers/sleeper/leagues/*/winners-bracket.metadata.json|\
                data-source/providers/sleeper/leagues/*/losers-bracket.json|\
                data-source/providers/sleeper/leagues/*/losers-bracket.metadata.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.json|\
                data-source/providers/sleeper/leagues/*/matchups/week-*.metadata.json|\
                data-source/providers/sleeper/leagues/*/transactions/week-*.json|\
                data-source/providers/sleeper/leagues/*/transactions/week-*.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/index.json|\
                data-source/providers/sleeper/leagues/*/drafts/index.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/draft.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/draft.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/picks.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/picks.metadata.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/traded-picks.json|\
                data-source/providers/sleeper/leagues/*/drafts/*/traded-picks.metadata.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped current acquisition touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          assert_current_canonical_only() {
            mapfile -t changed < <(changed_paths)
            unexpected=()
            for path in "${changed[@]}"; do
              case "$path" in
                data-source/leagues/*/seasons/*/league.json|\
                data-source/leagues/*/seasons/*/members.json|\
                data-source/leagues/*/seasons/*/rosters.json|\
                data-source/leagues/*/seasons/*/winners-bracket.json|\
                data-source/leagues/*/seasons/*/losers-bracket.json|\
                data-source/leagues/*/seasons/*/matchups/week-*.json|\
                data-source/leagues/*/seasons/*/transactions/week-*.json|\
                data-source/leagues/*/seasons/*/drafts.json|\
                data-source/_sync/last-league-failure.json)
                  ;;
                *)
                  unexpected+=("$path")
                  ;;
              esac
            done
            if (( ${#unexpected[@]} > 0 )); then
              printf 'Scoped current materialization touched an unexpected path:\n' >&2
              printf ' - %s\n' "${unexpected[@]}" >&2
              return 1
            fi
          }

          write_failure_diagnostic() {
            local phase="$1"
            local exit_code="$2"
            local log_file="$3"

            for diagnostic_attempt in $(seq 1 "$max_attempts"); do
              reset_to_main
              mkdir -p data-source/_sync

              PHASE="$phase" EXIT_CODE="$exit_code" LOG_FILE="$log_file" MATERIALIZATION_SCOPE="$materialization_scope" \
                python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path(os.environ["LOG_FILE"])
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          payload = {
              "schemaVersion": 1,
              "status": "failed",
              "phase": os.environ["PHASE"],
              "exitCode": int(os.environ["EXIT_CODE"]),
              "recordedAtUtc": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "workflow": "Data • League Source Sync",
              "runId": os.environ.get("GITHUB_RUN_ID"),
              "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "materializationScope": os.environ.get("MATERIALIZATION_SCOPE") or "full",
              "forceInput": (os.environ.get("FORCE") or "false").lower() == "true",
              "errorTail": lines[-80:],
          }
          Path("data-source/_sync/last-league-failure.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

              assert_league_source_only
              git add -- data-source/_sync/last-league-failure.json
              if git diff --cached --quiet; then
                echo "League failure diagnostic already matches main."
                return 0
              fi
              git commit -m "data(league-source): record failed source sync"
              push_status=0
              python3 tools/git_transient.py push "$push_url" HEAD:main || push_status=$?
              if (( push_status == 0 )); then
                return 0
              fi
              if (( push_status != 10 )); then
                echo "Publishing League failure diagnostic failed for a non-race reason." >&2
                return 1
              fi
              echo "main advanced while publishing League failure diagnostic; retrying."
            done
            echo "Could not publish League failure diagnostic after $max_attempts attempts." >&2
            return 1
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "League source publish attempt $attempt/$max_attempts"
            reset_to_main

            raw_stdout="$(mktemp)"
            raw_stderr="$(mktemp)"
            raw_log="$(mktemp)"
            set +e
            python tools/league_source_data.py "${sync_args[@]}" >"$raw_stdout" 2>"$raw_stderr"
            raw_status=$?
            set -e
            cat "$raw_stdout"
            cat "$raw_stderr" >&2
            cat "$raw_stdout" "$raw_stderr" > "$raw_log"
            if (( raw_status != 0 )); then
              echo "League provider raw sync failed." >&2
              write_failure_diagnostic "raw-sync" "$raw_status" "$raw_log"
              exit "$raw_status"
            fi

            if [[ "$materialization_scope" == "transactions" ]]; then
              python - "$raw_stdout" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Current transaction window sync returned no leagues")
          for item in leagues:
              window = item.get("CurrentTransactionWindow") or {}
              print(
                  "- Transaction window "
                  f"{item.get('CanonicalLeagueID')}: season={window.get('Season')}, "
                  f"currentWeek={window.get('CurrentWeek')}, weeks={window.get('Weeks')}, "
                  f"evidence={window.get('Evidence')}"
              )
          PY
              assert_transaction_raw_only
              git add -- data-source/providers/sleeper/leagues
            elif [[ "$materialization_scope" == "drafts" ]]; then
              python - "$raw_stdout" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Current draft scope sync returned no leagues")
          for item in leagues:
              scope = item.get("CurrentDraftScope") or {}
              print(
                  "- Draft scope "
                  f"{item.get('CanonicalLeagueID')}: season={scope.get('Season')}, "
                  f"providerLeagueID={scope.get('ProviderLeagueID')}"
              )
          PY
              assert_draft_raw_only
              git add -- data-source/providers/sleeper/leagues
            elif [[ "$materialization_scope" == "league-core" ]]; then
              python - "$raw_stdout" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Current League Core scope sync returned no leagues")
          for item in leagues:
              scope = item.get("CurrentLeagueCoreScope") or {}
              print(
                  "- League Core scope "
                  f"{item.get('CanonicalLeagueID')}: season={scope.get('Season')}, "
                  f"providerLeagueID={scope.get('ProviderLeagueID')}"
              )
          PY
              assert_league_core_raw_only
              git add -- data-source/providers/sleeper/leagues
            elif [[ "$materialization_scope" == "matchups" ]]; then
              python - "$raw_stdout" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Current matchup scope sync returned no leagues")
          for item in leagues:
              scope = item.get("CurrentMatchupScope") or {}
              print(
                  "- Matchup scope "
                  f"{item.get('CanonicalLeagueID')}: season={scope.get('Season')}, "
                  f"currentWeek={scope.get('CurrentWeek')}, "
                  f"evidence={scope.get('Evidence')}, "
                  f"providerLeagueID={scope.get('ProviderLeagueID')}"
              )
          PY
              assert_matchup_raw_only
              git add -- data-source/providers/sleeper/leagues
            elif [[ "$materialization_scope" == "current" ]]; then
              python - "$raw_stdout" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Current scope sync returned no leagues")
          for item in leagues:
              core = item.get("CurrentLeagueCoreScope") or {}
              window = item.get("CurrentTransactionWindow") or {}
              drafts = item.get("CurrentDraftScope") or {}
              print(
                  "- Current scope "
                  f"{item.get('CanonicalLeagueID')}: season={core.get('Season')}, "
                  f"matchupWeek={core.get('CurrentMatchupWeek')}, "
                  f"transactionWeeks={window.get('Weeks')}, "
                  f"draftSeason={drafts.get('Season')}"
              )
          PY
              assert_current_raw_only
              git add -- data-source/providers/sleeper/leagues
            else
              assert_league_source_only
              git add -- data-source/providers/sleeper/leagues data-source/leagues
            fi

            if ! git diff --cached --quiet; then
              timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
              git commit -m "data(league-source): refresh Sleeper league raw sources • $timestamp"
              push_status=0
              python3 tools/git_transient.py push "$push_url" HEAD:main || push_status=$?
              if (( push_status != 0 )); then
                if (( push_status != 10 )); then
                  echo "League raw publish failed for a non-race reason; failing closed." >&2
                  exit 1
                fi
                if (( attempt == max_attempts )); then
                  echo "main advanced during all League raw publish attempts; failing closed." >&2
                  exit 1
                fi
                echo "main advanced during League raw publish; rebuilding from latest main."
                continue
              fi
            fi

            reset_to_main
            materialize_log="$(mktemp)"
            set +e
            python tools/league_source_data.py "${materialize_args[@]}" 2>&1 | tee "$materialize_log"
            materialize_status=${PIPESTATUS[0]}
            set -e
            if (( materialize_status != 0 )); then
              echo "League canonical materialization failed; persisted provider evidence remains preserved." >&2
              write_failure_diagnostic "materialize" "$materialize_status" "$materialize_log"
              exit "$materialize_status"
            fi

            noop_log="$(mktemp)"
            set +e
            python tools/league_source_data.py "${materialize_args[@]}" 2>&1 | tee "$noop_log"
            noop_status=${PIPESTATUS[0]}
            if (( noop_status == 0 )); then
              python - "$noop_log" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          leagues = result.get("Leagues")
          if not isinstance(leagues, list) or not leagues:
              raise SystemExit("Semantic no-op verification returned no leagues")
          changed = {
              item.get("CanonicalLeagueID"): item.get("CanonicalFilesChanged")
              for item in leagues
          }
          if any(value != 0 for value in changed.values()):
              raise SystemExit(
                  "League canonical semantic no-op verification failed: "
                  + json.dumps(changed, sort_keys=True)
              )
          PY
              noop_status=$?
            fi
            set -e
            if (( noop_status != 0 )); then
              echo "League canonical materialization is not a semantic no-op on the second pass." >&2
              write_failure_diagnostic "semantic-noop" "$noop_status" "$noop_log"
              exit "$noop_status"
            fi

            mkdir -p data-source/_sync
            rm -f data-source/_sync/last-league-failure.json
            if [[ "$materialization_scope" == "transactions" ]]; then
              assert_transaction_canonical_only
            elif [[ "$materialization_scope" == "drafts" ]]; then
              assert_draft_canonical_only
            elif [[ "$materialization_scope" == "league-core" ]]; then
              assert_league_core_canonical_only
            elif [[ "$materialization_scope" == "matchups" ]]; then
              assert_matchup_canonical_only
            elif [[ "$materialization_scope" == "current" ]]; then
              assert_current_canonical_only
            else
              assert_league_source_only
            fi

            mapfile -t changed < <(changed_paths)
            if (( ${#changed[@]} == 0 )); then
              echo "No canonical League data-source changes detected."
              exit 0
            fi

            printf 'Validated canonical League data-source changes:\n'
            printf ' - %s\n' "${changed[@]}"

            git add -A -- data-source/leagues data-source/_sync
            if git diff --cached --quiet; then
              echo "No canonical League data-source changes to commit."
              exit 0
            fi

            timestamp="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M %Z')"
            git commit -m "data(league-source): materialize canonical league sources • $timestamp"
            push_status=0
            python3 tools/git_transient.py push "$push_url" HEAD:main || push_status=$?
            if (( push_status == 0 )); then
              echo "League data-source publish succeeded."
              exit 0
            fi
            if (( push_status != 10 )); then
              echo "League canonical publish failed for a non-race reason; failing closed." >&2
              exit 1
            fi

            if (( attempt == max_attempts )); then
              echo "main advanced during all League canonical publish attempts; failing closed." >&2
              exit 1
            fi
            echo "main advanced during League canonical publish; rebuilding from latest main."
          done
