name: FM • Projection • FFToday

on:
  schedule:
    - cron: "56 3 * * *"  # 05:56 Europe/Berlin während CEST
    - cron: "56 4 * * *"  # 05:56 Europe/Berlin während CET
  push:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fftoday_kicker_projections.py
      - fantasy-management/_ai/scripts/fetch_fftoday_offense_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fftoday_kicker_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fftoday_offense_projections.py
      - .github/workflows/update-fftoday-projections.yml
  pull_request:
    branches:
      - main
    paths:
      - fantasy-management/_ai/scripts/fetch_fftoday_kicker_projections.py
      - fantasy-management/_ai/scripts/fetch_fftoday_offense_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fftoday_kicker_projections.py
      - fantasy-management/_ai/scripts/tests/test_fetch_fftoday_offense_projections.py
      - .github/workflows/update-fftoday-projections.yml
  workflow_dispatch: # manueller Start

permissions:
  contents: write

concurrency:
  group: update-fftoday-projections-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve Berlin schedule window
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Non-scheduled run: schedule gate passed."
            exit 0
          fi

          berlin_offset="$(TZ=Europe/Berlin date +%z)"
          if [[ "$berlin_offset" == "+0200" ]]; then
            expected_schedule="56 3 * * *"
          elif [[ "$berlin_offset" == "+0100" ]]; then
            expected_schedule="56 4 * * *"
          else
            echo "Unsupported Europe/Berlin UTC offset: $berlin_offset" >&2
            exit 1
          fi

          if [[ "$SCHEDULE_EXPRESSION" == "$expected_schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled run selected for 05:56 Europe/Berlin."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Companion DST cron skipped for current Berlin offset $berlin_offset."
          fi

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Python
        if: steps.schedule_gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test FFToday projection fetchers
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python -m unittest
          fantasy-management/_ai/scripts/tests/test_fetch_fftoday_kicker_projections.py
          fantasy-management/_ai/scripts/tests/test_fetch_fftoday_offense_projections.py
          -v

      - name: Fetch and validate FFToday kicker projections
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/fetch_fftoday_kicker_projections.py
          --skip-unchanged

      - name: Fetch and validate FFToday offensive projections
        if: steps.schedule_gate.outputs.run == 'true'
        run: >-
          python fantasy-management/_ai/scripts/fetch_fftoday_offense_projections.py
          --skip-unchanged

      - name: Record successful FFToday refresh
        if: steps.schedule_gate.outputs.run == 'true' && github.event_name != 'pull_request'
        run: >-
          python fantasy-management/_ai/scripts/write_source_refresh_heartbeat.py
          --source-id fftoday
          --workflow "FM • Projection • FFToday"
          --trigger "${{ github.event_name }}"
          --content-path fantasy-management/sources/external-rankings/projections/fftoday

      - name: Commit and push updates
        if: steps.schedule_gate.outputs.run == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            fantasy-management/sources/external-rankings/projections/fftoday/ \
            fantasy-management/sources/refresh-status/fftoday.json
          pwsh ./.github/scripts/Invoke-GeneratedDataCommit.ps1 -Scope fftoday-projections
          python tools/publish_generated_commit.py --remote origin --branch main
