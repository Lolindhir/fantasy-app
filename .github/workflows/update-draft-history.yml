name: Update Draft History

on:
  schedule:
    - cron: '0 4 * * 1' # wöchentlich montags um 04:00 UTC
  workflow_dispatch:
    inputs:
      forceHistory:
        description: 'Force rewrite completed draft history without compare skip'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-draft-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Run Draft History Request Script
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.forceHistory }}' -eq 'true') {
            ./public/requests/RequestDraftHistory.ps1 -ForceHistory
          } else {
            ./public/requests/RequestDraftHistory.ps1
          }

      - name: Commit and push updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/past_seasons/Drafts/ || true
          git diff --cached --quiet || git commit -m "Draft History Update"
          git push
