name: Data • League Core

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-league-core.yml"
      - "tools/league_source_data_lib/materialize.py"
      - "tools/league_source_data_lib/league_core_materialize.py"
  repository_dispatch:
    types:
      - scheduler-sync-league-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-league-core:
    uses: ./.github/workflows/sync-league-source-data.yml
    with:
      materialization_scope: league-core
    secrets: inherit
