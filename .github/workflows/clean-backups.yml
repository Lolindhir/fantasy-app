name: APP • Maintenance • Backups

on:
  repository_dispatch:
    types:
      - scheduler-clean-backups
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Rebuild and publish backup retention
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope backup-cleanup
          --path public/data/backup
          --
          python3 tools/cleanup_backups.py
