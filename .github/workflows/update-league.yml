name: APP • Data • League

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-league.yml"
      - "public/data/Schedule.json"
      - "public/requests/RequestLeague.ps1"
      - "public/requests/RequestLeaguePublication.ps1"
      - "public/requests/utils/league/CanonicalLeagueCoreUtils.psm1"
      - "public/requests/utils/league/CanonicalPlayoffUtils.psm1"
      - "public/requests/utils/league/CanonicalMatchupUtils.psm1"
      - "source-data/leagues/nfl-reise/seasons/*/matchups/week-*.json"
  repository_dispatch:
    types:
      - scheduler-update-league
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Rebuild and publish League data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope league
          --path public/data
          --
          pwsh ./public/requests/RequestLeaguePublication.ps1
