name: CI • Angular Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow-health test dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Run workflow-health regression tests
        run: python -m unittest tools/tests/test_build_workflow_health_snapshot.py -v

      - name: Run publication-safety regression tests
        run: |
          python -m unittest tools.tests.test_rebuild_and_publish -v
          python -m unittest tools.tests.test_workflow_publication_contracts -v

      - name: Run NFL source-data regression tests
        run: |
          python -m unittest discover -s tools/tests -p "test_nfl_source*.py" -v
          python -m unittest tools.tests.test_historical_fantasy_scoring -v

      - name: Run PowerShell data regression tests
        shell: pwsh
        run: |
          ./public/requests/DraftIdentityRegressionTest.ps1
          ./public/requests/LeagueTransactionPipelineRegressionTest.ps1
          ./public/requests/HistoricalTransactionRebuildRegressionTest.ps1
          ./public/requests/WaiverScheduleRegressionTest.ps1
          ./public/requests/DecisionWindowRegressionTest.ps1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run central scheduler regression tests
        run: node --test tools/tests/run-workflow-scheduler*.test.cjs

      - name: Install dependencies
        run: npm ci

      - name: Run fantasy-team ordering regression tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --configuration=fantasy-team-order --include=src/app/shared/utils/fantasy-team-order.util.spec.ts

      - name: "Run #507 focused Angular tests"
        run: |
          cat > tsconfig.507.spec.json <<'EOF'
          {
            "extends": "./tsconfig.spec.json",
            "include": [
              "src/app/shared/utils/matchups-overview-view.util.spec.ts",
              "src/app/shared/components/league-matchups/league-matchups.spec.ts",
              "src/**/*.d.ts"
            ]
          }
          EOF
          npx ng test --watch=false --browsers=ChromeHeadless \
            --ts-config=tsconfig.507.spec.json \
            --include=src/app/shared/utils/matchups-overview-view.util.spec.ts \
            --include=src/app/shared/components/league-matchups/league-matchups.spec.ts

      - name: Build Angular app
        shell: pwsh
        run: ./deploy_action.ps1

      - name: "Capture #507 responsive screenshots"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview/fantasy-app visual
          cp -R dist/fantasy-league-custom-frontend/browser/. .preview/fantasy-app/
          python -m http.server 4173 --directory .preview >/tmp/issue-507-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No headless Chrome/Chromium binary found." >&2
            exit 1
          fi
          for WIDTH in 360 390 430; do
            "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=6000 --window-size="${WIDTH},1900" \
              --screenshot="visual/overview-${WIDTH}.png" \
              http://127.0.0.1:4173/fantasy-app/
          done
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=6000 --window-size="1280,1500" \
            --screenshot="visual/overview-1280.png" \
            http://127.0.0.1:4173/fantasy-app/

      - name: Upload #507 responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: issue-507-responsive-review
          path: visual/*.png
          retention-days: 1
