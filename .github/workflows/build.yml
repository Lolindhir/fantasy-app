name: CI • Repository Validation
run-name: "${{ github.event_name == 'pull_request' && 'CI • Repository Validation' || 'CI • Full Repository Audit' }}"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "full = complete audit (Core, all Fast, all Deep, restore gate); a Deep group runs only that Deep category on the selected ref"
        type: choice
        default: full
        options:
          - full
          - nfl-identity-replay
          - league-pwf-twp
          - market-restore
          - consumer-restore
  repository_dispatch:
    types:
      - scheduler-ci-full-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read  # advisory-only changed-file inventory

jobs:
  # Issue #1122: a pull request runs Core (always) plus the Fast blocks the
  # change can affect. Deep suites never run on a pull request; they run in the
  # weekly full audit or through a manual dispatch of one Deep category. The
  # the read-only Derived Restore Gate completes the full audit.
  selector:
    name: CI • Selection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      nfl: ${{ steps.route.outputs.nfl }}
      league: ${{ steps.route.outputs.league }}
      market: ${{ steps.route.outputs.market }}
      consumer: ${{ steps.route.outputs.consumer }}
      angular: ${{ steps.route.outputs.angular }}
      scheduler: ${{ steps.route.outputs.scheduler }}
      powershell: ${{ steps.route.outputs.powershell }}
      deep_nfl: ${{ steps.route.outputs.deep_nfl }}
      deep_league: ${{ steps.route.outputs.deep_league }}
      deep_market: ${{ steps.route.outputs.deep_market }}
      deep_consumer: ${{ steps.route.outputs.deep_consumer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate complete PR diff and select Fast blocks
        id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci_test_impact.py route

  # Core: small mandatory checks that run on every change.
  fast-contracts:
    name: CI Core • Contracts & Publication Safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workflow-health test dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate CI inventory and routing contracts
        run: python -m unittest tools.tests.test_ci_test_impact -v
      - name: Validate workflow, publisher and repository contracts
        run: python tools/ci_suite_runner.py core

  fast-nfl:
    name: CI Fast • NFL Source & Identity
    needs: selector
    if: ${{ needs.selector.outputs.nfl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py fast nfl-identity-replay

  fast-league:
    name: CI Fast • League, Scoring & PWF/TWP
    needs: selector
    if: ${{ needs.selector.outputs.league == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py fast league-pwf-twp
      - name: Players league-scoring shadow and Sleeper gate
        run: python tools/players_league_scoring_shadow.py gate

  fast-market:
    name: CI Fast • External Market Sources
    needs: selector
    if: ${{ needs.selector.outputs.market == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py fast market-restore

  fast-consumer:
    name: CI Fast • Shared Derived & Consumers
    needs: selector
    if: ${{ needs.selector.outputs.consumer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py fast consumer-restore

  fast-powershell:
    name: CI Fast • PowerShell Data Regressions
    needs: selector
    if: ${{ needs.selector.outputs.powershell == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run existing PowerShell data regression contracts
        shell: pwsh
        run: |
          ./public/requests/LeagueReadModelRegressionTest.ps1
          ./public/requests/ProviderJoinInvariantRegressionTest.ps1
          ./public/requests/DecisionWindowRegressionTest.ps1

  fast-scheduler:
    name: CI Fast • Scheduler
    needs: selector
    if: ${{ needs.selector.outputs.scheduler == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run complete central scheduler regression tests
        run: node --test tools/tests/run-workflow-scheduler*.test.cjs

  fast-angular:
    name: CI Fast • Angular Tests & Build
    needs: selector
    if: ${{ needs.selector.outputs.angular == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run fantasy-team ordering regression tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --configuration=fantasy-team-order --include=src/app/shared/utils/fantasy-team-order.util.spec.ts
      - name: Run PlayerWeekFantasy consumer regression tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --configuration=player-week-fantasy --include=src/app/core/services/data.service.spec.ts
      - name: Run Overview weekly-dashboard regression tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --configuration=overview-weekly-dashboard --include=src/app/testing/overview-weekly-dashboard.karma.spec.ts
      - name: Run full Angular unit test suite
        run: npx ng test --watch=false --browsers=ChromeHeadless
      - name: Build Angular app
        shell: pwsh
        run: ./deploy_action.ps1

  # Deep: full historical replays and clean-root restores. Never selected by a
  # pull request; weekly full audit or manual dispatch of one category only.
  deep-nfl:
    name: CI Deep • NFL Identity Replay
    needs: selector
    if: ${{ needs.selector.outputs.deep_nfl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py deep nfl-identity-replay

  deep-league:
    name: CI Deep • League PWF & TWP
    needs: selector
    if: ${{ needs.selector.outputs.deep_league == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py deep league-pwf-twp

  deep-market:
    name: CI Deep • Market Restore
    needs: selector
    if: ${{ needs.selector.outputs.deep_market == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py deep market-restore

  deep-consumer:
    name: CI Deep • Consumer Restore
    needs: selector
    if: ${{ needs.selector.outputs.deep_consumer == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - run: python tools/ci_suite_runner.py deep consumer-restore

  # Stable check present on every run. It requires Core, every selected Fast
  # block and, in audits, the selected Deep jobs; "not selected" is not "passed".
  merge-gate:
    name: CI / Merge Gate
    if: ${{ always() }}
    needs: [selector, fast-contracts, fast-nfl, fast-league, fast-market, fast-consumer, fast-powershell, fast-scheduler, fast-angular, deep-nfl, deep-league, deep-market, deep-consumer, restore-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Core, selected Fast and audit results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_ACTION: ${{ github.event.action }}
        run: python tools/ci_merge_gate.py

  # Issue #471: weekly read-only proof that data-derived can be rebuilt from
  # data-source and data-meta alone. Red on restore-defect, nondeterministic
  # and blocked; stale-published and latent-blocker only appear in the summary.
  # Audit only; never part of a pull request.
  restore-gate:
    name: CI Audit • Derived Restore Gate
    needs: selector
    if: ${{ needs.selector.outputs.mode == 'full' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'repository_dispatch' && github.event.action == 'scheduler-ci-full-audit')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyYAML>=6,<7"
      - name: Rebuild every Shared Derived product from an empty root (read-only)
        run: python tools/derived_clean_root_audit.py --github-summary

