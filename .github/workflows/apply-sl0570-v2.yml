name: Apply Stoned Lack 570 V2

on:
  push:
    branches:
      - main
    paths:
      - "fantasy-management/_ai/scripts/migrations/**"
      - ".github/workflows/apply-sl0570-v2.yml"
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: >-
      ${{
        (github.event_name != 'issues' || github.event.issue.title == '[automation] Apply Stoned Lack 570 V2') &&
        (github.event_name != 'pull_request' || github.event.pull_request.title == '[automation] Apply Stoned Lack 570 V2')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply version-2 episode package
        run: python fantasy-management/_ai/scripts/migrations/apply_sl0570_v2.py

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/episode.md
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/takes.json
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/mentions.json
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/index.json
          if git diff --cached --quiet; then
            echo "No package changes to commit."
          else
            git commit -m "Re-extract Stoned Lack 570 as version 2"
            git push origin HEAD:main
          fi
