name: APP • Pipeline • NFL Live

# NFL live chain (Issue #946, step S3 of #471), woken by the scheduler target nfl-live
# (game-window mode: dense cadence only around NFL games, sparse idle cadence otherwise):
#   espn-schedule  ESPN kickoff observations (Source Evidence, Issue #1627), at most about twice an hour, never blocking
#   finality  canonical game finality (plus the schedule snapshot without odds); applies the ESPN kickoff overlay
#   publish-schedule  Schedule.json, only when finality or the canonical schedule changed
#   league    wake the League Live chain, only when finality changed
#   schedule-parity  read-only, non-blocking: compares canonical kickoff times with ESPN and warns on differences
# Player Availability keeps its own ten-minute target (sync-nfl-player-availability.yml).

on:
  repository_dispatch:
    types:
      - scheduler-nfl-live
  workflow_dispatch:
    inputs:
      force_schedule:
        description: "Publish Schedule.json even if finality and schedule did not change"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: nfl-live
  cancel-in-progress: false

jobs:
  # ESPN kickoff observations (Issue #1627, ADR-097): nflverse can lag behind NFL flex scheduling. This job only
  # records what ESPN reports (data-source/providers/espn/schedule/<season>.json, merged, written on semantic change);
  # the canonical schedule materialization in the finality job applies it to games that are not scored yet and
  # falls back to nflverse whenever evidence is missing. A failure here never blocks the chain.
  espn-schedule:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Throttle (about twice an hour)
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(date -u +%-M)" -lt 20 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "- ESPN schedule observation skipped (throttled)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository (sparse, blobless)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /tools/
            /data-source/leagues/*/manifest.json
            /data-source/nfl/schedules/
            /data-source/providers/espn/schedule/

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Observe ESPN kickoff times
        if: steps.gate.outputs.run == 'true'
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope nfl-espn-schedule
          --path data-source/providers/espn/schedule
          --
          python3 tools/espn_schedule_snapshot.py sync

  finality:
    needs: espn-schedule
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/sync-nfl-source-data.yml
    with:
      dataset: nflverse.game-finality
      historical_backfill_limit: 0
      materialization_scope: game-finality
    secrets: inherit

  detect:
    needs: finality
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      finality_changed: ${{ steps.detect.outputs.finality_changed }}
      schedule_changed: ${{ steps.detect.outputs.schedule_changed }}
      run_schedule: ${{ steps.detect.outputs.run_schedule }}
    steps:
      # G5 AP3c (Issue #1263): detection only compares tree entries of two commits (git diff BASE HEAD),
      # which never reads the working tree. The checkout therefore materializes no data files; the
      # conservative fallbacks (missing/unfetchable base) are unchanged.
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      - name: Detect changed NFL inputs
        id: detect
        env:
          BASE: ${{ needs.finality.outputs.main_before_sync }}
          FORCE: ${{ inputs.force_schedule }}
        run: |
          set -euo pipefail
          finality=false
          schedule=false
          run=false
          reason=""
          if [[ "${FORCE:-false}" == "true" ]]; then
            finality=true; schedule=true; run=true
            reason="forced by workflow_dispatch input"
          elif [[ -z "${BASE:-}" ]]; then
            finality=true; schedule=true; run=true
            reason="no base commit reported by the finality job; running conservatively"
          elif ! git fetch --no-tags --depth=1 origin "$BASE"; then
            finality=true; schedule=true; run=true
            reason="base commit $BASE could not be fetched; running conservatively"
          else
            if [[ -n "$(git diff --name-only "$BASE" HEAD -- data-source/nfl/game-finality)" ]]; then finality=true; fi
            if [[ -n "$(git diff --name-only "$BASE" HEAD -- data-source/nfl/schedules)" ]]; then schedule=true; fi
            if [[ "$finality" == "true" || "$schedule" == "true" ]]; then run=true; fi
            reason="finality_changed=$finality schedule_changed=$schedule since $BASE"
          fi
          {
            echo "finality_changed=$finality"
            echo "schedule_changed=$schedule"
            echo "run_schedule=$run"
          } >> "$GITHUB_OUTPUT"
          echo "- NFL Live: schedule publication run=$run, league wake=$finality ($reason)" >> "$GITHUB_STEP_SUMMARY"

  publish-schedule:
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.run_schedule == 'true' }}
    uses: ./.github/workflows/update-games.yml
    secrets: inherit

  league:
    needs: [detect, publish-schedule]
    if: ${{ !cancelled() && needs.detect.outputs.finality_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wake the League Live chain
        env:
          GH_TOKEN: ${{ secrets.PAT_PUSH }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d '{"event_type":"scheduler-league-live","client_payload":{"source":"nfl-live"}}'
          echo "- League Live chain dispatched (finality changed)" >> "$GITHUB_STEP_SUMMARY"

  # Read-only freshness check: nflverse can lag behind NFL flex scheduling, so a green sync does not prove
  # current kickoff times. Compares canonical kickoffs with the ESPN scoreboard and only warns (annotation and
  # Job Summary); it writes nothing, never overrides the canonical schedule and never fails the chain.
  schedule-parity:
    needs: finality
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository (sparse)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /data-source/nfl/schedules/
            /data-source/leagues/*/manifest.json

      - name: Compare canonical kickoff times with ESPN
        run: python3 tools/nfl_schedule_parity.py check
