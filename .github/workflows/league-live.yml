name: APP • Pipeline • League Live

# One ten-minute chain for the live league data (Issue #945, step S2 of #471):
#   source    current League Core + transactions + drafts, one run and one pair of commits
#   standings league-standings product and Standings.json (Python writer, semantic no-op; Issue #987 step 4)
#   league    App League plus PlayerWeekFantasy/MatchupProjections and, in the same publication, the
#             current-transactions + current/future Drafts Derived refresh (newest scored-week
#             TeamWeekPerformance; Issue #471 step 3)
# Standings runs before League because League.json embeds the published Standings placement.

on:
  repository_dispatch:
    types:
      - scheduler-league-live
  workflow_dispatch:
    inputs:
      historical_preflight:
        description: "Read-only isolated historical PWF + TeamWeekPerformance audit (skip all live writers)"
        required: false
        type: boolean
        default: false
      historical_mode:
        description: "Historical target selection"
        required: false
        type: choice
        options:
          - full
          - week
          - incremental
        default: full
      historical_season:
        description: "Season (only for week mode)"
        required: false
        type: string
      historical_week:
        description: "Week (only for week mode)"
        required: false
        type: string
      historical_changed_path:
        description: "Changed canonical path (only for incremental mode)"
        required: false
        type: string

permissions:
  contents: write

# Own group, no cancellation: a newer tick waits for the running chain. The source job
# additionally takes the group of sync-league-source-data.yml so the daily full League
# source sync never writes in parallel.
concurrency:
  group: league-live
  cancel-in-progress: false

jobs:
  historical_preflight:
    if: ${{ inputs.historical_preflight == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout coherent Source snapshot without write credentials
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Run isolated historical PWF and TWP preflight (no publication)
        shell: bash
        env:
          MODE: ${{ inputs.historical_mode }}
          YEAR: ${{ inputs.historical_season }}
          WEEK: ${{ inputs.historical_week }}
          CHANGED_PATH: ${{ inputs.historical_changed_path }}
        run: |
          set -euo pipefail
          args=(--mode "${MODE:-full}")
          if [[ "${MODE:-full}" == "week" ]]; then
            [[ "${YEAR:-}" =~ ^[0-9]{4}$ && "${WEEK:-}" =~ ^[0-9]{1,2}$ ]] || {
              echo "Historical week mode requires valid season and week" >&2
              exit 2
            }
            args+=(--season "$YEAR" --week "$WEEK")
          elif [[ "${MODE:-full}" == "incremental" ]]; then
            [[ -n "${CHANGED_PATH:-}" ]] || {
              echo "Incremental mode requires a changed canonical path" >&2
              exit 2
            }
            args+=(--changed-path "$CHANGED_PATH")
          fi
          python3 tools/historical_derived_orchestrate.py "${args[@]}"

  source:
    if: ${{ !inputs.historical_preflight }}
    uses: ./.github/workflows/sync-league-source-data.yml
    with:
      materialization_scope: current
    secrets: inherit

  standings:
    needs: source
    if: ${{ !cancelled() && !inputs.historical_preflight }}
    runs-on: ubuntu-latest
    steps:
      # G5 AP2c (Issue #1263): the Python-only Standings writer reads tools, data-meta, the canonical league
      # source, the NFL schedule/finality partitions and its own outputs (League.json, Standings.json,
      # Timestamps.json, data-derived/league-standings). A forced regeneration in a sparse clone is
      # byte-identical to the complete tree (player-stats only feeds NflStatsComplete, not LeagueScoredWeek).
      # rebuild_and_publish.py fetches and resets the branch tip itself, which honors the sparse profile;
      # the generated-commit script lives in .github/scripts. Output paths are unchanged.
      - name: Checkout repository (sparse, blobless)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/workflow-schedules.json
            /tools/
            /data-meta/
            /data-source/leagues/
            /data-source/nfl/schedules/
            /data-source/nfl/game-finality/
            /public/data/League.json
            /public/data/Standings.json
            /public/data/Timestamps.json
            /data-derived/league-standings/

      - name: Verify Standings sparse inputs
        shell: bash
        run: |
          set -euo pipefail
          for path in tools/league_standings_app_publish.py tools/rebuild_and_publish.py .github/scripts/Invoke-GeneratedDataCommit.ps1 data-meta data-source/leagues data-source/nfl/schedules data-source/nfl/game-finality public/data/League.json public/data/Standings.json public/data/Timestamps.json data-derived/league-standings; do
            [[ -e "$path" ]] || { echo "Missing Standings sparse input: $path" >&2; exit 1; }
          done
          echo "- Standings checkout: sparse/blobless profile verified" >> "$GITHUB_STEP_SUMMARY"
      - name: G5 shadow decision - Standings (observe only)
        continue-on-error: true
        run: >-
          python3 tools/league_live_shadow_gate.py
          --stage standings
          --source-status "${{ needs.source.result }}"
          --upstream-status "${{ needs.source.result }}"


      # The Standings writer is Python-only (no pwsh) and a semantic no-op writes nothing, so it runs every
      # tick. A change-detection gate would miss LeagueScoredWeek moves: the week basis depends on NFL game
      # finality, which nfl-live commits outside this chain (Issue #987 step 4).
      - name: Note Standings run
        id: detect
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "- Standings: run=true (semantic no-op writer, week basis depends on NFL game finality)" >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild and publish Standings data
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope standings
          --path public/data
          --path data-derived/league-standings
          --
          python3 tools/league_standings_app_publish.py write

  league:
    needs: [source, standings]
    if: ${{ !cancelled() && !inputs.historical_preflight }}
    runs-on: ubuntu-latest
    steps:
      # G5 E2 (Issue #1263): exclusion profile. The generator chain below reads (strace of the exact commands) only
      # recent NFL seasons (PWF model: target season minus 5 up to minus 1), the sleeper provider, tools, data-meta,
      # data-derived and public/data. Excluded are only folders and old seasons the chain provably never reads:
      # player-stats before 2021, weekly-rosters before 2021, all providers except sleeper,
      # fantasy-management, market, assets, docs, research and src. public/data stays complete: RequestLeague writes
      # public/data/backup (Save-JsonFile -CreateBackup) and rebuild_and_publish runs git add -A on public/data.
      # Newer seasons (2021 onward, including every future one) stay included automatically; a missing needed file
      # fails the run closed, and the verify step falls back to a complete checkout. Paths, token and rights unchanged.
      - name: Checkout repository (exclusion profile, blobless)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/fantasy-management/
            !/research/
            !/src/
            !/public/assets/
            !/public/docs/
            !/data-source/market/
            !/data-source/providers/*/
            /data-source/providers/sleeper/
            !/data-source/nfl/player-stats/19*/
            !/data-source/nfl/player-stats/200*/
            !/data-source/nfl/player-stats/201*/
            !/data-source/nfl/player-stats/2020/
            !/data-source/nfl/weekly-rosters/19*/
            !/data-source/nfl/weekly-rosters/200*/
            !/data-source/nfl/weekly-rosters/201*/
            !/data-source/nfl/weekly-rosters/2020/

      - name: Verify League sparse inputs (fall back to a complete checkout)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for path in tools/rebuild_and_publish.py tools/player_week_fantasy_refresh.py .github/scripts/Invoke-GeneratedDataCommit.ps1 public/requests/RequestLeaguePublication.ps1 data-meta data-derived/player-valuation data-source/leagues data-source/providers/sleeper data-source/nfl/schedules data-source/nfl/identities data-source/nfl/player-stats/2025 data-source/nfl/weekly-rosters/2025 public/data/League.json; do
            [[ -e "$path" ]] || { echo "::warning::Missing League sparse input: $path"; missing=1; }
          done
          if (( missing != 0 )); then
            git sparse-checkout disable
            echo "- League checkout: sparse profile incomplete, complete checkout used" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- League checkout: exclusion profile verified (partialclonefilter=$(git config --get remote.origin.partialclonefilter || echo none))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: G5 shadow decision - League (observe only)
        continue-on-error: true
        run: >-
          python3 tools/league_live_shadow_gate.py
          --stage league
          --source-status "${{ needs.source.result }}"
          --upstream-status "${{ needs.standings.result }}"


      # G5 AP4 (Issue #1263): no Node.js setup here. Nothing in this job's command chain (Python tools, pwsh
      # RequestLeaguePublication, rebuild_and_publish.py, the generated-commit script) invokes node or npm; the
      # setup step only restored an unused npm cache (about 10 s per ten-minute tick).

      # One generator run and one commit for League and PlayerWeekFantasy/MatchupProjections:
      # two pushes seconds apart made the Deploy of the first one cancel itself.
      # Derived before consumers: current LeagueTransactions and current+all future LeagueDrafts,
      # plus the newest scored-week TeamWeekPerformance. The App history writer verifies the
      # persisted Shared Derived products against canonical inputs and fails closed on stale
      # Drafts/Transactions; independent unready TeamWeekPerformance remains fail-soft. data-derived commits do not deploy.
      # Products before consumers: the PlayerWeekFantasy/MatchupProjections refresh no longer depends on an App file
      # (target week from the lifecycle LineupWeek, ADR-075), so it runs before the App files. Matchups.json and
      # FantasyGameContext.json are rendered from the computed matchup context by tools/matchup_context_app_publish.py
      # (Issue #1199 section 3 step 7) before RequestLeaguePublication. WeeklyRecaps.json is rendered from the computed recap function by
      # tools/weekly_recaps_app_publish.py (Issue #1199 section 4); it reads the fresh TeamWeekPerformance product, not an App file.
      - name: Rebuild and publish League, PlayerWeekFantasy, MatchupProjections and current-season Derived
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope league
          --path public/data
          --path data-derived/player-week-fantasy
          --path data-derived/team-week-performance
          --path data-derived/league-transactions
          --path data-derived/league-drafts
          --
          bash -euo pipefail -c
          'python3 tools/league_live_derived_refresh.py &&
          python3 tools/player_week_fantasy_refresh.py &&
          python3 tools/matchup_context_app_publish.py write --fail-on-error &&
          python3 tools/league_history_app_publish.py write --fail-on-error &&
          python3 tools/weekly_recaps_app_publish.py write --fail-on-error &&
          pwsh ./public/requests/RequestLeaguePublication.ps1 &&
          python3 tools/team_cap_outlook_app_publish.py write'
