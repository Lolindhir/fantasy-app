name: Finalize NFL Source Docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'agent/nfl-source-identity-integration' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/nfl-source-identity-integration
          fetch-depth: 1
          token: ${{ secrets.PAT_PUSH }}
      - name: Finalize docs and TODO
        shell: bash
        env:
          PAT_PUSH: ${{ secrets.PAT_PUSH }}
        run: |
          set -euo pipefail
          python tools/_finalize_nfl_source_docs.py
          git rm .github/workflows/finalize-nfl-source-docs.yml tools/_finalize_nfl_source_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TODO.md .ai-context/manual/decisions.yaml
          git commit -m "docs(nfl-source): record completed identity bootstrap"
          git push "https://x-access-token:${PAT_PUSH}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/nfl-source-identity-integration
