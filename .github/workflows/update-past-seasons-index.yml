name: APP • Maintenance • Past Seasons

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_PUSH }}

      - name: Rebuild and publish Past Seasons index
        run: >-
          python3 tools/rebuild_and_publish.py
          --scope past-seasons-index
          --path public/data/PastSeasonsIndex.json
          --
          pwsh ./public/requests/RequestPastSeasonsIndex.ps1
