name: Apply Stoned Lack 570 V2 Feature Branch

on:
  pull_request:
    branches:
      - agent/stoned-lack-570-v2
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/stoned-lack-570-v2-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/stoned-lack-570-v2
          fetch-depth: 0

      - name: Restore and apply validated migration payload
        shell: bash
        run: |
          git show c29cc2b6e83cadd3d9368ffe94dcb5383d0ac2e3:fantasy-management/_ai/scripts/migrations/apply_sl0570_v2.py > /tmp/apply_sl0570_v2.py
          python - <<'PY'
          import base64
          import hashlib
          import io
          import runpy
          import zipfile
          from pathlib import Path

          expected_hashes = {
              'episode.md': '19edb0d2b1dafdf2726ab567990399a80948b1d478c37dba6f9a2b4adf5135b6',
              'takes.json': '14b00fe4df617c5e5ae111345247a5bb33a8c2ad95970046dfd42cb898ae245a',
              'mentions.json': '963373494046e9eeb3415433dbdca19c28a2c64e74eeb611158c86192a66804d',
              'index.json': 'b2a3c89384673ff0ba249e18d163992805a773f0a462b01e17623d102fd5a27a',
          }

          namespace = runpy.run_path('/tmp/apply_sl0570_v2.py')
          archive = base64.b64decode(namespace['PAYLOAD'])
          target = Path('fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570')
          target.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              names = set(source.namelist())
              if names != set(expected_hashes):
                  raise RuntimeError(f'Unexpected archive contents: {sorted(names)}')

              for name in sorted(names):
                  data = source.read(name)
                  actual_hash = hashlib.sha256(data).hexdigest()
                  expected_hash = expected_hashes[name]
                  if actual_hash != expected_hash:
                      raise RuntimeError(
                          f'{name} hash mismatch: expected {expected_hash}, got {actual_hash}'
                      )
                  (target / name).write_bytes(data)
                  print(f'wrote {target / name} ({len(data)} bytes, sha256={actual_hash})')
          PY

      - name: Validate episode package
        run: |
          python fantasy-management/_ai/scripts/validate_episode_package.py fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570
          python fantasy-management/_ai/scripts/validate_episode_coverage.py fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570

      - name: Commit package and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/episode.md
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/takes.json
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/mentions.json
          git add fantasy-management/sources/podcasts/stoned-lack/episodes/2026/sl_0570/index.json
          git rm .github/workflows/apply-sl0570-v2-feature.yml
          git commit -m "Re-extract Stoned Lack 570 as version 2"
          git push origin HEAD:agent/stoned-lack-570-v2
