name: Apply Stoned Lack 570 V2 Feature Branch

on:
  pull_request:
    branches:
      - agent/stoned-lack-570-v2
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/stoned-lack-570-v2-trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/stoned-lack-570-v2
          fetch-depth: 0

      - name: Inspect historical migration payload
        shell: bash
        run: |
          set +e
          git show c29cc2b6e83cadd3d9368ffe94dcb5383d0ac2e3:fantasy-management/_ai/scripts/migrations/apply_sl0570_v2.py > /tmp/apply_sl0570_v2.py
          SHOW_STATUS=$?
          export SHOW_STATUS
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          import runpy
          import traceback
          import zipfile
          from pathlib import Path

          report = {
              'git_show_status': int(os.environ.get('SHOW_STATUS', '-1')),
              'expected_local_hashes': {
                  'episode.md': '19edb0d2b1dafdf2726ab567990399a80948b1d478c37dba6f9a2b4adf5135b6',
                  'takes.json': '14b00fe4df617c5e5ae111345247a5bb33a8c2ad95970046dfd42cb898ae245a',
                  'mentions.json': '963373494046e9eeb3415433dbdca19c28a2c64e74eeb611158c86192a66804d',
                  'index.json': 'b2a3c89384673ff0ba249e18d163992805a773f0a462b01e17623d102fd5a27a',
              },
          }

          try:
              namespace = runpy.run_path('/tmp/apply_sl0570_v2.py')
              payload = namespace.get('PAYLOAD')
              report['payload_type'] = type(payload).__name__
              report['payload_length'] = len(payload) if payload is not None else None
              archive = base64.b64decode(payload)
              report['archive_size'] = len(archive)
              report['archive_sha256'] = hashlib.sha256(archive).hexdigest()
              with zipfile.ZipFile(io.BytesIO(archive)) as source:
                  report['archive_names'] = source.namelist()
                  report['files'] = {}
                  for name in source.namelist():
                      data = source.read(name)
                      report['files'][name] = {
                          'size': len(data),
                          'sha256': hashlib.sha256(data).hexdigest(),
                      }
          except Exception as exc:
              report['error_type'] = type(exc).__name__
              report['error'] = str(exc)
              report['traceback'] = traceback.format_exc()

          output = Path('fantasy-management/_ai/scripts/migrations/sl0570_v2_diagnostic.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(output.read_text(encoding='utf-8'))
          PY

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantasy-management/_ai/scripts/migrations/sl0570_v2_diagnostic.json
          git commit -m "Diagnose Stoned Lack 570 v2 migration payload"
          git push origin HEAD:agent/stoned-lack-570-v2
